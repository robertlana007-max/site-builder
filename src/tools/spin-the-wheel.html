<style>
.whl-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .whl-grid { grid-template-columns: minmax(0, 1fr); } }
.whl-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; background: var(--surface); }
.whl-wheel { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; }
.whl-wheel canvas { width: 100%; height: 100%; display: block; border-radius: 50%; cursor: pointer; touch-action: manipulation; }
.whl-wheel canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.whl-ptr { position: absolute; left: 50%; top: -6px; width: 34px; height: 42px; margin-left: -17px; transform-origin: 50% 8px; z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35)); }
.whl-ptr.tick { animation: whl-tick .12s ease-out; }
@keyframes whl-tick { 40% { transform: rotate(-16deg); } }
.whl-hub { position: absolute; left: 50%; top: 50%; width: 18%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 4px solid #fff; background: var(--accent); color: var(--on-accent); font: 800 clamp(12px, 3.4vw, 18px)/1 inherit; font-family: inherit; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); min-width: 56px; }
.whl-hub[disabled] { cursor: default; filter: saturate(.6); }
.whl-res { min-height: 28px; font-size: 18px; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
.whl-stage.whl-max { position: fixed; inset: 0; z-index: 1000; justify-content: center; padding: 16px; background: var(--bg); }
.whl-stage:fullscreen { justify-content: center; padding: 16px; background: var(--bg); }
.whl-stage.whl-max .whl-wheel, .whl-stage:fullscreen .whl-wheel { max-width: min(92vw, calc(100vh - 150px)); }
.whl-stage .btns { justify-content: center; margin: 0; }
.whl-dlg { border: 0; border-radius: 18px; padding: 26px 22px 20px; max-width: min(440px, calc(100vw - 32px)); width: 100%; text-align: center; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.whl-dlg::backdrop { background: rgba(15, 18, 22, .55); }
.whl-dlg p { margin: 0; color: var(--muted); font-weight: 600; }
.whl-win { font-size: clamp(26px, 7vw, 40px); font-weight: 800; margin: 6px 0 18px; overflow-wrap: anywhere; line-height: 1.15; }
.whl-dlg .btns { justify-content: center; }
.whl-count { font-size: 13px; color: var(--muted); font-weight: 400; }
</style>
<div class="whl-grid">
  <div class="whl-stage" id="stage">
    <div class="whl-wheel" id="wheelBox">
      <svg class="whl-ptr" id="ptr" viewBox="0 0 34 42" aria-hidden="true"><path d="M17 41L3 9a14 14 0 1 1 28 0z" fill="#111827" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="12" r="4" fill="#fff"/></svg>
      <canvas id="wheel" tabindex="0" role="button" aria-label="Wheel of entries. Press Enter or Space to spin."></canvas>
      <button type="button" class="whl-hub" id="spin">SPIN</button>
    </div>
    <div class="whl-res" id="res" aria-live="polite"></div>
    <div class="btns"><button class="btn" id="spin2">Spin the wheel</button><button class="btn ghost" id="full" aria-pressed="false">Full screen</button></div>
  </div>
  <div>
    <label for="entries">Entries, one per line <span class="whl-count" id="count"></span></label>
    <textarea id="entries" class="plain" data-nomemo style="min-height:260px" placeholder="Type one name or option per line"></textarea>
    <div class="btns">
      <button class="btn ghost" id="shuffle">Shuffle</button><button class="btn ghost" id="sort">Sort A to Z</button><button class="btn ghost" id="clear">Clear</button>
    </div>
    <div class="checks" style="margin-top:14px"><label><input type="checkbox" id="snd" checked>Sound (ticks and a cheer)</label></div>
    <p class="msg" id="msg"></p>
  </div>
</div>
<dialog class="whl-dlg" id="dlg" aria-labelledby="dlgT">
  <p id="dlgT">We have a winner!</p>
  <div class="whl-win" id="win"></div>
  <div class="btns"><button class="btn" id="again">Spin again</button><button class="btn ghost" id="remove">Remove winner</button><button class="btn ghost" id="close">Close</button></div>
</dialog>
<script>
(function () {
  var MAX = 200, KEY = 'gtn-wheel';
  var COLORS = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#6366f1', '#a855f7', '#ec4899', '#14b8a6', '#eab308'];
  var DEFAULT = ['Alice', 'Ben', 'Chloe', 'David', 'Emma', 'Farid', 'Grace', 'Hiro'];
  var ta = $('entries'), cv = $('wheel'), ctx = cv.getContext('2d'), art = document.createElement('canvas');
  var items = [], angle = 0, spinning = false, lastWin = -1, size = 0, audio = null, raf = 0;
  var calmQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  function calm() { return (calmQ && calmQ.matches) || document.documentElement.hasAttribute('data-calm'); }
  function rand(n) { // unbiased integer in [0, n)
    var max = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
    do { crypto.getRandomValues(a); } while (a[0] >= max);
    return a[0] % n;
  }
  function randUnit() { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }

  try { var saved = localStorage.getItem(KEY); ta.value = saved != null ? saved : DEFAULT.join('\n'); } catch (e) { ta.value = DEFAULT.join('\n'); }
  function store() { try { localStorage.setItem(KEY, ta.value); } catch (e) {} }
  function parse() {
    var all = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    items = all.slice(0, MAX);
    $('count').textContent = '(' + items.length + (all.length > MAX ? ' of ' + all.length : '') + ')';
    var m = $('msg');
    if (all.length > MAX) { m.className = 'msg bad'; m.textContent = 'The wheel holds up to ' + MAX + ' entries. Only the first ' + MAX + ' are used.'; }
    else if (items.length < 2) { m.className = 'msg bad'; m.textContent = 'Add at least 2 entries to spin.'; }
    else { m.className = 'msg'; m.textContent = ''; }
    var can = items.length >= 2;
    $('spin').disabled = !can || spinning; $('spin2').disabled = !can || spinning;
  }
  function color(i, n) {
    var c = i % COLORS.length;
    if (i === n - 1 && n > 1 && c === 0) c = 5; // the last slice must not match the first one it touches
    return COLORS[c];
  }
  function ink(hex) { var r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#111827' : '#ffffff'; }
  // Draw the wheel once into an off-screen canvas; each animation frame only rotates that picture.
  function render() {
    var box = $('wheelBox').getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    size = Math.max(100, Math.round(box.width * dpr));
    cv.width = cv.height = art.width = art.height = size;
    var g = art.getContext('2d'), R = size / 2, n = items.length, s = Math.PI * 2 / Math.max(n, 1);
    g.clearRect(0, 0, size, size);
    if (n === 0) {
      g.fillStyle = '#e5e7eb'; g.beginPath(); g.arc(R, R, R - 2, 0, Math.PI * 2); g.fill();
    }
    for (var i = 0; i < n; i++) {
      g.beginPath(); g.moveTo(R, R); g.arc(R, R, R - 2, i * s, (i + 1) * s); g.closePath();
      g.fillStyle = n === 1 ? COLORS[0] : color(i, n); g.fill();
      if (n <= 60) { g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = Math.max(1, size / 400); g.stroke(); }
    }
    g.beginPath(); g.arc(R, R, R - 2, 0, Math.PI * 2); g.lineWidth = Math.max(2, size / 120); g.strokeStyle = '#ffffff'; g.stroke();
    // labels: as large as the slice allows, cut with … when too long, skipped when slices are too thin to read
    var inner = R * 0.2, outer = R * 0.92, avail = outer - inner, mid = R * 0.6;
    var fs = Math.min(R * 0.11, 2 * mid * Math.sin(Math.min(s, Math.PI) / 2) * 0.62);
    if (n === 1) fs = R * 0.11;
    if (fs >= 7 * (size / box.width) / 1.2) {
      g.textBaseline = 'middle'; g.textAlign = 'right';
      g.font = '600 ' + fs + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      for (i = 0; i < n; i++) {
        var t = items[i];
        if (g.measureText(t).width > avail) {
          var lo = 0, hi = t.length;
          while (lo < hi) { var md = (lo + hi + 1) >> 1; if (g.measureText(t.slice(0, md) + '…').width <= avail) lo = md; else hi = md - 1; }
          t = Array.from(t.slice(0, lo)).join('').replace(/[\uD800-\uDBFF]$/, '') + '…';
        }
        g.save(); g.translate(R, R); g.rotate((i + 0.5) * s);
        g.fillStyle = n === 1 ? ink(COLORS[0]) : ink(color(i, n)); g.fillText(t, outer, 0); g.restore();
      }
    }
    draw();
  }
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, size, size);
    ctx.translate(size / 2, size / 2); ctx.rotate(angle); ctx.drawImage(art, -size / 2, -size / 2);
  }
  // Which slice is under the pointer at the top (canvas angle -90°) for a given wheel rotation.
  function at(a) { var n = items.length, s = Math.PI * 2 / n, r = ((-Math.PI / 2 - a) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2); return Math.min(n - 1, Math.floor(r / s)); }
  function sound(kind) {
    if (!$('snd').checked) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var t = audio.currentTime, o = audio.createOscillator(), v = audio.createGain();
      o.connect(v); v.connect(audio.destination);
      if (kind === 'tick') { o.type = 'square'; o.frequency.value = 1500; v.gain.setValueAtTime(0.05, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.03); o.start(t); o.stop(t + 0.035); }
      else { o.type = 'triangle'; [523, 659, 784, 1047].forEach(function (f, k) { o.frequency.setValueAtTime(f, t + k * 0.11); }); v.gain.setValueAtTime(0.12, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.start(t); o.stop(t + 0.62); }
    } catch (e) {}
  }
  function spin() {
    parse();
    if (spinning || items.length < 2) return;
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} // sound must start from a tap on phones
    if ($('dlg').open) $('dlg').close();
    var n = items.length, s = Math.PI * 2 / n, win = rand(n), within = 0.15 + randUnit() * 0.7;
    // final angle puts a random point inside the chosen slice exactly under the pointer
    var target = -Math.PI / 2 - (win + within) * s, base = angle - ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    target = ((target % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    var end = base + target + Math.PI * 2 * (5 + rand(3));
    if (end - angle < Math.PI * 2 * 4) end += Math.PI * 2;
    spinning = true; parse(); ta.readOnly = true; lastWin = win;
    $('res').textContent = 'Spinning…'; cv.removeAttribute('data-angle');
    if (calm()) { angle = end % (Math.PI * 2); draw(); done(); return; }
    var start = angle, t0 = performance.now(), dur = 4800 + rand(1200), last = at(angle), lastTick = 0;
    cancelAnimationFrame(raf);
    (function frame(now) {
      var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4); // ease out: fast start, long gentle stop
      angle = start + (end - start) * e; draw();
      var cur = at(angle);
      if (cur !== last) {
        last = cur;
        if (now - lastTick > 35) { lastTick = now; sound('tick'); var pt = $('ptr'); pt.classList.remove('tick'); void pt.getBoundingClientRect(); pt.classList.add('tick'); }
      }
      if (p < 1) raf = requestAnimationFrame(frame);
      else { angle = end % (Math.PI * 2); draw(); done(); }
    })(t0);
  }
  function done() {
    spinning = false; ta.readOnly = false;
    cv.setAttribute('data-angle', angle);
    var name = items[lastWin];
    $('res').textContent = 'Result: ' + name;
    $('win').textContent = name;
    $('remove').hidden = items.length <= 2;
    parse(); sound('win');
    if ($('dlg').showModal) { $('dlg').showModal(); burst($('win')); $('again').focus(); }
  }
  function setLines(arr) { ta.value = arr.join('\n'); store(); parse(); render(); }
  $('remove').addEventListener('click', function () {
    // remove exactly the line that won, even when the same name appears more than once
    var lines = ta.value.split('\n'), k = -1, seen = 0;
    for (var i = 0; i < lines.length; i++) if (lines[i].trim()) { if (seen === lastWin) { k = i; break; } seen++; }
    if (k !== -1) lines.splice(k, 1);
    ta.value = lines.join('\n'); store(); parse(); render();
    $('dlg').close(); toast('Removed ' + $('win').textContent);
  });
  $('again').addEventListener('click', function () { $('dlg').close(); spin(); });
  $('close').addEventListener('click', function () { $('dlg').close(); });
  $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) $('dlg').close(); });
  $('spin').addEventListener('click', spin); $('spin2').addEventListener('click', spin); cv.addEventListener('click', spin);
  cv.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); } });
  var typing;
  ta.addEventListener('input', function () { store(); parse(); clearTimeout(typing); typing = setTimeout(render, 120); });
  $('shuffle').addEventListener('click', function () {
    if (spinning) return;
    var a = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    setLines(a);
  });
  $('sort').addEventListener('click', function () {
    if (spinning) return;
    setLines(ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).sort(function (x, y) { return x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' }); }));
  });
  $('clear').addEventListener('click', function () { if (spinning) return; setLines([]); $('res').textContent = ''; ta.focus(); });

  // Full screen: the real Fullscreen API where it exists, otherwise (iPhone) a page-filling view.
  var stage = $('stage');
  function isFull() { return document.fullscreenElement === stage || document.webkitFullscreenElement === stage || stage.classList.contains('whl-max'); }
  function syncFull() { $('full').textContent = isFull() ? 'Exit full screen' : 'Full screen'; $('full').setAttribute('aria-pressed', isFull()); setTimeout(render, 60); }
  $('full').addEventListener('click', function () {
    if (isFull()) {
      if (stage.classList.contains('whl-max')) { stage.classList.remove('whl-max'); document.body.style.overflow = ''; }
      else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
      var fallback = function () { stage.classList.add('whl-max'); document.body.style.overflow = 'hidden'; syncFull(); };
      if (req) { try { var pr = req.call(stage); if (pr && pr.catch) pr.catch(fallback); } catch (e) { fallback(); } } else fallback();
    }
    syncFull();
  });
  document.addEventListener('fullscreenchange', syncFull); document.addEventListener('webkitfullscreenchange', syncFull);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && stage.classList.contains('whl-max') && !$('dlg').open) { stage.classList.remove('whl-max'); document.body.style.overflow = ''; syncFull(); } });
  // the dialog must live inside the full-screen element to be visible there
  document.addEventListener('fullscreenchange', function () { (document.fullscreenElement === stage ? stage : document.querySelector('.card') || document.body).appendChild($('dlg')); });

  if (window.ResizeObserver) { var lastW = 0; new ResizeObserver(function (en) { var w = Math.round(en[0].contentRect.width); if (w && w !== lastW) { lastW = w; render(); } }).observe($('wheelBox')); }
  else window.addEventListener('resize', render);
  parse(); render();
})();
</script>
