<style>
.vt-info { margin: -4px 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.vt-info b { color: var(--ink); }
.vt-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 14px; }
.vt-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s; }
.vt-video { display: block; width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 14px 0 4px; }
.vt-hint { font-size: 14px; color: var(--muted); margin: -8px 0 14px; }
</style>
<style>
.rv-modes { display: flex; gap: 8px; margin: 0 0 14px; }
.rv-modes button { flex: 1; font: inherit; font-weight: 600; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface, var(--bg)); color: var(--ink); cursor: pointer; }
.rv-modes button span { display: block; font-size: 22px; line-height: 1.2; }
.rv-modes button small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.rv-modes button[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.rv-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.rv-row .btn { flex: 1 1 150px; }
.rv-out { display: block; max-width: 100%; max-height: 360px; margin: 14px auto 0; border-radius: 10px; border: 1px solid var(--line); background: #000; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a video here</b>MP4, MOV, WebM, MKV or AVI, up to 1 GB. Your video never leaves your device.</div>
<input type="file" id="file" accept="video/*,.mkv,.mov,.avi,.m4v,.3gp,.ts,.mts,.wmv,.flv" hidden data-nomemo>
<p class="vt-info" id="info"></p>
<div id="editor" hidden>
  <video class="vt-video" id="player" controls playsinline preload="metadata"></video>
  <p class="vt-hint" id="noPlay" hidden>Your browser cannot play this video format, so there is no preview. You can still type the start and end times below.</p>
  <div class="rv-modes" role="group" aria-label="Effect">
    <button type="button" data-mode="rev" aria-pressed="true"><span aria-hidden="true">⏪</span>Reverse<small>Play it backwards</small></button>
    <button type="button" data-mode="boom" aria-pressed="false"><span aria-hidden="true">🔁</span>Boomerang<small>Forwards, then backwards</small></button>
  </div>
  <div class="rv-row">
    <button class="btn ghost" type="button" id="setA">Start here</button>
    <button class="btn ghost" type="button" id="setB">End here</button>
  </div>
  <div class="fields">
    <div><label for="start">Part to use: from</label><input type="text" id="start" value="0:00" inputmode="decimal" autocomplete="off" data-nomemo></div>
    <div><label for="end">to</label><input type="text" id="end" value="0:00" inputmode="decimal" autocomplete="off" data-nomemo></div>
    <div><label for="loops">Play it</label><select id="loops"><option value="1">Once</option><option value="2">2 times</option><option value="3" selected>3 times</option><option value="5">5 times</option></select></div>
    <div><label for="speed">Speed</label><select id="speed"><option value="1">Normal</option><option value="1.5">1.5× faster</option><option value="2">2× faster</option><option value="0.5">Half speed (slow motion)</option></select></div>
    <div><label for="sound">Sound</label><select id="sound"><option value="rev">Reverse the sound too</option><option value="none">No sound</option></select></div>
    <div><label for="size">Size</label><select id="size"><option value="0">Same as the video</option><option value="720" selected>Up to 720p (faster)</option><option value="480">Up to 480p (fastest)</option></select></div>
    <div><label for="fmt">Save as</label><select id="fmt"><option value="mp4">MP4 video</option><option value="gif">GIF animation (no sound)</option></select></div>
    <div id="gifBox" hidden><label for="gw">GIF width</label><select id="gw"><option value="320">320 px (small file)</option><option value="480" selected>480 px</option><option value="640">640 px</option></select></div>
  </div>
  <p class="vt-hint" id="hint"></p>
</div>
<div class="vt-bar" id="bar" hidden><i id="barFill"></i></div>
<div class="btns"><button class="btn" id="go" disabled>Reverse video</button><button class="btn ghost" id="stop" type="button" hidden>Cancel</button><a class="btn ghost" id="dl" hidden>Download</a></div>
<p class="msg" id="msg"></p>
<video class="rv-out" id="result" controls playsinline loop hidden></video>
<img class="rv-out" id="gifOut" alt="Your GIF" hidden>
<script>
// Video engine loader (ffmpeg.wasm, single-thread build, no special server headers needed).
// The same copy is used by every video tool. Nothing is downloaded until a video is chosen.
var FF = (function () {
  var BASE = '../assets/vendor/ffmpeg/', WASM_BYTES = 32232419, MAX = 1024 * 1024 * 1024;
  var wasmUrl = null, ff = null, loading = null, onLog = null, logTail = [];
  function abs(p) { return new URL(BASE + p, location.href).href; }
  function mb(n) { return Math.round(n / 1048576); }

  function fetchWasm(say) {
    if (wasmUrl) return Promise.resolve(wasmUrl);

    var p = inp.mounted ? f.unmount(inp.dir) : f.deleteFile(inp.path);

          if (audioOk) throw new Error('"' + file.name + '" could not be read as an audio or video file. It may be damaged or in an unsupported format.');
          if (/Invalid data|moov atom|EBML|could not find|No such file/i.test(t) || !d) throw new Error('"' + file.name + '" could not be read as a video. It may be damaged or in an unsupported format.');
          throw new Error('"' + file.name + '" has no video track.');
        }

      }, function (e) { onLog = null; throw e; });

  // Run ffmpeg. build(inPath) returns the argument list (with -y and no input already added
  // by the caller); outName is the output file. total is the expected output length in seconds.
  // file may also be an array of files: build then gets an array of paths. prep(f, paths), if given,
  // runs before ffmpeg starts (for example to write a list file) and may return a promise.
  function run(file, build, outName, total, onPct, say, prep) {
    var many = Array.isArray(file), list = many ? file : [file];
    return get(say).then(function (f) {
      logTail = [];
      onLog = function (m) {
        var t = /time=\s*(-?\d+:\d+:\d+(?:\.\d+)?)/.exec(m);
        if (t && total > 0) onPct(Math.max(0, Math.min(0.99, secs(t[1]) / total)));
      };

      return list.reduce(function (p, one) {
        return p.then(function () { return mountIn(f, one, 'input.' + ext(one)).then(function (inp) { inps.push(inp); }); });
      }, Promise.resolve()).then(function () {
        var paths = inps.map(function (i) { return i.path; });
        return Promise.resolve(prep ? prep(f, paths) : null).then(function () {
          return f.exec(['-hide_banner', '-nostdin', '-y'].concat(build(many ? paths : paths[0]), [out]));
        });
      }).then(function (code) {
        return Promise.all(inps.map(function (i) { return unmountIn(f, i); })).then(function () { return code; });
      }).then(function (code) {
        onLog = null;
        if (code !== 0) { f.deleteFile(out).catch(function () {}); throw new Error(reason()); }
        return f.readFile(out).then(function (data) {
          f.deleteFile(out).catch(function () {});
          if (!data || !data.length) throw new Error(reason('The result was empty. Try different settings.'));
          onPct(1);
          return data;
        });
      }, function (e) {
        onLog = null;
        if (e && e.message === 'called FFmpeg.terminate()') throw new Error('cancelled');

      });

  function cancel() { if (ff) { try { ff.terminate(); } catch (e) {} ff = null; } onLog = null; }

  return { get: get, check: check, probe: probe, run: run, cancel: cancel, secs: secs };
})();

// Page helpers shared by the video tools. Expect #drop #file #info #go #stop #bar #barFill #dl #msg.
var VT = (function () {
  var lastUrl = null, busy = false, cancelled = false;
  function say(cls, t) { var m = $('msg'); m.className = 'msg ' + (cls || ''); m.textContent = t || ''; }
  function bar(p) { $('bar').hidden = p == null; if (p != null) $('barFill').style.width = Math.round(p * 100) + '%'; }
  function clock(s) {
    s = Math.round(Math.max(0, s) * 10) / 10; var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    var sec = (x < 10 ? '0' : '') + x.toFixed(1);
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + sec;
  }
  function base(name) { return name.replace(/\.[^.]+$/, '') || 'video'; }
  function showInfo(file, i) {
    var el = $('info'); el.textContent = '';
    var b = document.createElement('b'); b.textContent = file.name; el.appendChild(b);
    el.appendChild(document.createTextNode(' · ' + fmtBytes(file.size) + ' · ' + clock(i.duration) + ' · ' + i.width + ' × ' + i.height + (i.audio ? ' · with sound' : ' · no sound')));
  }
  // Wire the drop zone. onReady(file, info) runs once the video has been checked and read.
  function pick(onReset, onReady) {
    var ticket = 0;
    setupDrop('drop', 'file', function (file) {
      $('file').value = '';
      if (busy) { say('bad', 'Please wait for the current video to finish, or press Cancel.'); return; }
      var mine = ++ticket;
      onReset(); $('go').disabled = true; $('dl').hidden = true; $('info').textContent = ''; bar(null);
      var bad = FF.check(file);
      if (bad) { say('bad', bad); return; }
      busy = true;
      FF.probe(file, say).then(function (info) {
        busy = false;
        if (mine !== ticket) return;
        showInfo(file, info); say('', ''); onReady(file, info); $('go').disabled = false;
      }, function (e) { busy = false; if (mine === ticket) say('bad', e.message); });
    });
    $('stop').addEventListener('click', function () { if (!busy) return; cancelled = true; FF.cancel(); });
    Array.prototype.forEach.call(document.querySelectorAll('.card input:not([type=file]), .card select'), function (el) {
      el.addEventListener('input', function () { if (!busy) $('dl').hidden = true; });
    });
  }
  // Run a job with the busy state, progress bar, Cancel button and error messages handled.
  function go(label, job) {
    if (busy) return;
    busy = true; cancelled = false;
    $('go').disabled = true; $('dl').hidden = true; $('stop').hidden = false; bar(0);
    say('', label + '…');

      clearInterval(tick);

  }

  function done(data, name, mime) {

    var dl = $('dl'); dl.href = lastUrl; dl.download = name; dl.hidden = false; bar(1);
    return lastUrl;
  }
  return { say: say, bar: bar, clock: clock, base: base, pick: pick, go: go, done: done };
})();
(function () {
  var file = null, info = null, url = null, P = $('player'), mode = 'rev', MAXLEN = 180, stopped = false;
  $('stop').addEventListener('click', function () { stopped = true; });
  function parse(s) {
    s = String(s).trim().replace(',', '.');
    if (!/^\d+(?:\.\d+)?$|^\d+:\d{1,2}(?:\.\d+)?$|^\d+:\d{1,2}:\d{1,2}(?:\.\d+)?$/.test(s)) return NaN;

  }
  function range() {
    var a = parse($('start').value), b = parse($('end').value);
    if (isNaN(a)) return { err: 'The start time is not a time. Use minutes and seconds like 0:05, or just seconds like 5.' };
    if (isNaN(b)) return { err: 'The end time is not a time. Use minutes and seconds like 0:12, or just seconds like 12.' };
    if (a >= info.duration) return { err: 'The start is after the end of the video (' + VT.clock(info.duration) + ').' };
    b = Math.min(b, info.duration);

    if (b - a > MAXLEN) return { err: 'This part is ' + VT.clock(b - a) + ' long. Reversing needs a lot of memory, so choose a part of up to 3 minutes.' };

    if (lim && Math.min(w, h) > lim) { var k = lim / Math.min(w, h); w = w * k; h = h * k; }
    return { w: Math.max(2, Math.round(w / 2) * 2), h: Math.max(2, Math.round(h / 2) * 2) };

    $('gifBox').hidden = !gif; $('sound').disabled = gif || !info.audio; $('size').disabled = false;
    $('go').textContent = (mode === 'boom' ? 'Make boomerang' : 'Reverse video') + (gif ? ' GIF' : '');
    if (r.err) { $('hint').textContent = r.err; $('go').disabled = true; return; }
    var sp = +$('speed').value, one = (r.b - r.a) / sp * (mode === 'boom' ? 2 : 1), total = one * +$('loops').value, s = outSize();
    $('hint').textContent = 'The result will be ' + VT.clock(total) + ' long (' + s.w + ' × ' + s.h + (gif ? ', GIF without sound' : '') + ').' + (r.b - r.a > 30 ? ' Long parts take a while: the video is reversed in small pieces to save memory.' : '');
    $('go').disabled = false;
  }
  ['start', 'end', 'loops', 'speed', 'sound', 'size', 'fmt', 'gw'].forEach(function (id) { $(id).addEventListener('input', hint); $(id).addEventListener('change', hint); });
  Array.prototype.forEach.call(document.querySelectorAll('.rv-modes button'), function (b) {
    b.addEventListener('click', function () { mode = b.dataset.mode; Array.prototype.forEach.call(document.querySelectorAll('.rv-modes button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); $('dl').hidden = true; hint(); });
  });
  function reset() { file = null; info = null; $('editor').hidden = true; $('result').hidden = true; $('gifOut').hidden = true; P.pause(); P.removeAttribute('src'); P.load(); if (url) { URL.revokeObjectURL(url); url = null; } }
  VT.pick(reset, function (f, i) {
    file = f; info = i; url = URL.createObjectURL(f); $('noPlay').hidden = true; P.hidden = false; P.src = url;
    $('start').value = VT.clock(0); $('end').value = VT.clock(Math.min(i.duration, MAXLEN));
    if (!i.audio) $('sound').value = 'none';
    $('editor').hidden = false; hint();
    if (i.duration > MAXLEN) VT.say('', 'This video is longer than 3 minutes, so the first 3 minutes are selected. Choose the part you want with Start here and End here.');
  });
  P.addEventListener('error', function () { if (P.getAttribute('src')) { P.hidden = true; $('noPlay').hidden = false; } });
  $('setA').addEventListener('click', function () { if (!info || P.hidden) return; $('start').value = VT.clock(P.currentTime); hint(); });
  $('setB').addEventListener('click', function () { if (!info || P.hidden) return; $('end').value = VT.clock(P.currentTime); hint(); });

  $('go').addEventListener('click', function () {
    if (!file) return;
    var r = range(); if (r.err) { VT.say('bad', r.err); return; }
    P.pause(); $('result').hidden = true; $('gifOut').hidden = true;
    var f = file, i = info, len = r.b - r.a, sp = +$('speed').value, loops = +$('loops').value, gif = $('fmt').value === 'gif', gw = +$('gw').value;
    var snd = !gif && i.audio && $('sound').value === 'rev', s = outSize(), fps = Math.min(60, Math.max(1, Math.round(i.fps) || 30)), boom = mode === 'boom';
    // pieces small enough to reverse in memory: about 60 frames of a 1080p picture
    var piece = Math.max(0.4, Math.min(4, 60 / fps * (2073600 / (s.w * s.h)))), n = Math.ceil(len / piece - 1e-6);
    var vf = 'scale=' + s.w + ':' + s.h + ':flags=bicubic,setsar=1' + (sp !== 1 ? ',setpts=PTS/' + sp : '') + ',format=yuv420p';
    var enc = ['-an', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '20', '-r', String(fps), '-video_track_timescale', '90000'];
    var steps = n + (boom ? 1 : 0) + 1 + (gif ? 1 : 0), done = 0, parts = [];
    function frames(from, l) { return Math.max(1, Math.round((from + l) / sp * fps) - Math.round(from / sp * fps)); } // whole frames, so the pieces add up exactly
    VT.go(boom ? 'Making the boomerang' : 'Reversing', function (pct) {
      function stepPct(p) { pct(Math.min(0.99, (done + p) / steps)); }
      var chain = Promise.resolve();
      stopped = false;
      if (boom) chain = chain.then(function () {
        return FF.run(f, function (inp) { return ['-ss', r.a.toFixed(3), '-t', len.toFixed(3), '-i', inp, '-vf', vf, '-frames:v', String(frames(0, len))].concat(enc); }, 'fwd.mp4', len / sp, stepPct, VT.say)
          .then(function (d) { parts.fwd = d; done++; });
      });
      for (var k = n - 1; k >= 0; k--) (function (k) { // the last piece first
        chain = chain.then(function () {
          if (stopped) throw new Error('cancelled');
          // the video engine keeps a little memory after every run, so start a fresh one now and then (long videos crashed the tab)
          if (done && done % 8 === 0) FF.cancel();
          var a = r.a + k * piece, l = Math.min(piece, r.b - a);
          return FF.run(f, function (inp) { return ['-ss', a.toFixed(3), '-t', l.toFixed(3), '-i', inp, '-vf', 'reverse,' + vf, '-frames:v', String(frames(a - r.a, l))].concat(enc); }, 'piece.mp4', l / sp, stepPct, VT.say)
            .then(function (d) { parts.push(d); done++; });
        });
      })(k);
      return chain.then(function () {
        if (stopped) throw new Error('cancelled');
        FF.cancel(); // a fresh engine for the joining step
        var names = [], list = [];
        if (boom) names.push('/rv-fwd.mp4');
        parts.forEach(function (_, k) { names.push('/rv-p' + k + '.mp4'); });
        for (var l = 0; l < loops; l++) names.forEach(function (nm) { list.push("file '" + nm + "'"); });
        var one = len / sp * (boom ? 2 : 1), total = one * loops;
        return FF.run(f, function (inp) {
          var a = ['-f', 'concat', '-safe', '0', '-i', '/rv-list.txt'];
          if (snd) {
            var ag = '[1:a]atrim=' + r.a.toFixed(3) + ':' + r.b.toFixed(3) + ',asetpts=PTS-STARTPTS,aresample=48000' + (sp !== 1 ? ',atempo=' + sp : '');
            ag += boom ? ',asplit[f][b];[b]areverse[r];[f][r]concat=n=2:v=0:a=1' : ',areverse';
            if (loops > 1) ag += ',aloop=loop=' + (loops - 1) + ':size=' + Math.round(one * 48000);
            ag += ',atrim=0:' + total.toFixed(3) + '[a]';
            a.push('-i', inp, '-filter_complex', ag, '-map', '0:v', '-map', '[a]', '-c:a', 'aac', '-b:a', '160k');
          } else a.push('-map', '0:v');
          a.push('-c:v', 'copy', '-movflags', '+faststart');
          return a;
        }, 'reversed.mp4', total, function (p) { stepPct(p); }, VT.say, function (ff) {
          var w = Promise.resolve();
          if (boom) w = w.then(function () { return ff.writeFile('/rv-fwd.mp4', parts.fwd); });
          parts.forEach(function (d, k) { w = w.then(function () { return ff.writeFile('/rv-p' + k + '.mp4', d); }); });
          return w.then(function () { return ff.writeFile('/rv-list.txt', new TextEncoder().encode(list.join('\n') + '\n')); });
        }).then(function (data) {
          done++;
          FF.get(VT.say).then(function (ff) { names.concat(['/rv-list.txt']).forEach(function (nm) { ff.deleteFile(nm).catch(function () {}); }); }); // free the memory
          parts.length = 0; parts.fwd = null;
          if (!gif) return { data: data, total: total };
          var mp4 = new File([data], 'r.mp4', { type: 'video/mp4' }), gfps = Math.min(15, fps), w2 = Math.min(gw, s.w);
          return FF.run(mp4, function (inp) {
            return ['-i', inp, '-filter_complex', 'fps=' + gfps + ',scale=' + w2 + ':-2:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4', '-loop', '0'];
          }, 'reversed.gif', total, stepPct, VT.say).then(function (g) { done++; return { data: g, total: total, gif: true }; });
        });
      }).then(function (res) {
        var name = VT.base(f.name) + (boom ? '-boomerang' : '-reversed') + (res.gif ? '.gif' : '.mp4');
        var u = VT.done(res.data, name, res.gif ? 'image/gif' : 'video/mp4');
        $('dl').textContent = res.gif ? 'Download GIF' : 'Download MP4';
        if (res.gif) { $('gifOut').src = u; $('gifOut').hidden = false; } else { $('result').src = u; $('result').hidden = false; }
        return 'Your ' + (boom ? 'boomerang' : 'reversed video') + ' is ready (' + VT.clock(res.total) + ', ' + fmtBytes(res.data.length) + ')';
      });
    }).then(function () { parts.length = 0; parts.fwd = null; });
  });
})();
