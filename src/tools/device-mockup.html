.dm-sw { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }

.dm-sec { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 0; margin-bottom: 14px; }
.dm-sec h3 { font-size: 16px; margin: 0 0 10px; }
.dm-sec input[type=color] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 3px; }
</style>

  <button type="button" data-d="tablet" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="3.8" r=".4"/></svg>Tablet</button>
  <button type="button" data-d="laptop" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20l-1.5-2.5h-17z"/></svg>Laptop</button>
  <button type="button" data-d="monitor" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="13" rx="1.5"/><path d="M10 16v4M14 16v4M8 20h8"/></svg>Monitor</button>

  <button type="button" data-d="watch" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3.5"/><path d="M9 6l1-4h4l1 4M9 18l1 4h4l1-4"/></svg>Watch</button>
</div>
<div class="dm-sec">
  <h3>Device</h3>

</div>
<div class="dm-sec">
  <h3>Background</h3>

  <div class="dm-sw" id="grads" role="group" aria-label="Background presets"></div>
</div>

  </div>
</div>

      say('', 'Screenshot ' + w + ' × ' + h + ' px. Pick a device and style, then download.' + (dev === 'browser' && h / w > 2.5 ? ' Very tall screenshots are cropped in the browser frame.' : ''));
    });
  }
  var drop = $('drop'), input = $('file');
  drop.addEventListener('click', function () { input.click(); });
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  input.addEventListener('change', function () { var f = input.files[0]; input.value = ''; take(f); });

  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { take(e.dataTransfer.files[0]); });

  });
  $('sample').addEventListener('click', function () { // a made-up app screen
    var c = canvas(1080, 2340), x = c.getContext('2d');
    x.fillStyle = '#f5f7fb'; x.fillRect(0, 0, 1080, 2340);
    var g = x.createLinearGradient(0, 0, 1080, 700); g.addColorStop(0, '#4f46e5'); g.addColorStop(1, '#06b6d4'); x.fillStyle = g; x.fillRect(0, 0, 1080, 700);
    x.fillStyle = '#fff'; x.font = '700 84px system-ui, sans-serif'; x.fillText('Good morning', 70, 300); x.font = '400 46px system-ui, sans-serif'; x.fillText('You have 3 tasks today', 70, 380);
    ['#f97316', '#22c55e', '#a855f7', '#0ea5e9'].forEach(function (col, i) {
      rr(x, 60, 780 + i * 330, 960, 280, 40); x.fillStyle = '#fff'; x.fill(); x.fillStyle = col; x.beginPath(); x.arc(170, 920 + i * 330, 60, 0, 7); x.fill();
      x.fillStyle = '#1f2937'; x.font = '600 52px system-ui, sans-serif'; x.fillText(['Morning run', 'Team meeting', 'Read 20 pages', 'Call family'][i], 270, 905 + i * 330);
      x.fillStyle = '#6b7280'; x.font = '400 38px system-ui, sans-serif'; x.fillText(['07:00 · 5 km', '10:30 · 45 min', 'Anytime', '19:00'][i], 270, 965 + i * 330);
    });
    c.toBlob(function (b) { take(new File([b], 'sample-screen.png', { type: 'image/png' })); });
  });

  // ---------- save ----------
  function save(type) {
    if (!shot) return;
    var btn = $(type === 'image/png' ? 'go' : 'jpg'); btn.disabled = true; say('', 'Making your picture…');
    setTimeout(function () {
      var c; try { c = compose(+$('res').value, type === 'image/jpeg'); } catch (e) { c = null; }
      if (!c) { btn.disabled = false; say('bad', 'Not enough memory for this size. Choose a smaller width.'); return; }
      c.toBlob(function (b) {
        btn.disabled = false;
        if (!b) { say('bad', 'Your browser could not save the picture. Choose a smaller width.'); return; }
        var a = document.createElement('a'), u = URL.createObjectURL(b); a.href = u; a.download = name + '-' + dev + '-mockup.' + (type === 'image/png' ? 'png' : 'jpg');
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
        say('ok', 'Saved ' + a.download + ' (' + c.width + ' × ' + c.height + ' px, ' + fmtBytes(b.size) + ').'); if (window.burst) burst(btn);
      }, type, 0.92);
    }, 20);
  }
  $('go').addEventListener('click', function () { save('image/png'); });
  $('jpg').addEventListener('click', function () { save('image/jpeg'); });
  rows();
})();
