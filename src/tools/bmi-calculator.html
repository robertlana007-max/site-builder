<div class="fields">
  <div><label for="unit">Units</label><select id="unit"><option value="m">Metric (kg, cm)</option><option value="i">Imperial (lb, ft, in)</option></select></div>
  <div><label for="wt" id="wl">Weight (kg)</label><input type="number" id="wt" min="0" step="any"></div>
  <div id="cmBox"><label for="cm">Height (cm)</label><input type="number" id="cm" min="0" step="any"></div>
  <div id="ftBox" hidden><label for="ft">Height (ft)</label><input type="number" id="ft" min="0" step="1"></div>
  <div id="inBox" hidden><label for="inch">Height (in)</label><input type="number" id="inch" min="0" step="any"></div>
</div>
<div class="stats">
  <div class="stat"><span>Your BMI</span><b id="bmi">–</b></div>
  <div class="stat"><span>Category</span><b id="cat">–</b></div>
  <div class="stat"><span>Healthy weight for your height</span><b id="rng">–</b></div>
</div>
<p class="msg">BMI is a general screening number for adults. It does not account for muscle, age or body type, and it is not a medical diagnosis.</p>
<script>
(function () {
  function calc() {
    var imp = $('unit').value === 'i';
    $('wl').textContent = imp ? 'Weight (lb)' : 'Weight (kg)';
    $('cmBox').hidden = imp; $('ftBox').hidden = !imp; $('inBox').hidden = !imp;
    var kg = imp ? +$('wt').value * 0.45359237 : +$('wt').value;
    var m = imp ? ((+$('ft').value) * 12 + (+$('inch').value)) * 0.0254 : +$('cm').value / 100;
    if (!(kg > 0) || !(m > 0)) { $('bmi').textContent = $('cat').textContent = $('rng').textContent = '–'; return; }
    var b = kg / (m * m);
    $('bmi').textContent = b.toFixed(1);
    $('cat').textContent = b < 18.5 ? 'Underweight' : b < 25 ? 'Healthy weight' : b < 30 ? 'Overweight' : 'Obese';
    var lo = 18.5 * m * m, hi = 24.9 * m * m;
    $('rng').textContent = imp ? Math.round(lo / 0.45359237) + ' – ' + Math.round(hi / 0.45359237) + ' lb' : lo.toFixed(1) + ' – ' + hi.toFixed(1) + ' kg';
  }
  ['unit', 'wt', 'cm', 'ft', 'inch'].forEach(function (id) { $(id).addEventListener('input', calc); });
})();
</script>
