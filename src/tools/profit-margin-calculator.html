<div class="fields">
  <div><label for="cost">Cost</label><input type="number" id="cost" min="0" step="any" placeholder="60"></div>
  <div><label for="price">Selling price</label><input type="number" id="price" min="0" step="any" placeholder="100"></div>
</div>
<div class="stats">
  <div class="stat"><span>Profit</span><b id="profit">–</b></div>
  <div class="stat"><span>Profit margin</span><b id="margin">–</b></div>
  <div class="stat"><span>Markup</span><b id="markup">–</b></div>
</div>
<h3>Find the price for a target margin</h3>
<div class="fields">
  <div><label for="cost2">Cost</label><input type="number" id="cost2" min="0" step="any" placeholder="60"></div>
  <div><label for="target">Target margin (%)</label><input type="number" id="target" min="0" max="99.99" step="any" placeholder="40"></div>
</div>
<div class="out" id="need">–</div>
<script>
(function () {
  function calc() {
    var c = +$('cost').value, p = +$('price').value;
    if ($('cost').value === '' || !(p > 0) || c < 0) { ['profit', 'margin', 'markup'].forEach(function (i) { $(i).textContent = '–'; }); }
    else {
      $('profit').textContent = fmtNum(p - c, 2);
      $('margin').textContent = fmtNum((p - c) / p * 100, 2) + '%';
      $('markup').textContent = c > 0 ? fmtNum((p - c) / c * 100, 2) + '%' : '–';
    }
    var c2 = +$('cost2').value, t = +$('target').value;
    if (!(c2 > 0) || $('target').value === '') $('need').textContent = '–';
    else if (t < 0 || t >= 100) $('need').textContent = 'The margin must be from 0 to less than 100%';
    else $('need').textContent = 'Sell at ' + fmtNum(c2 / (1 - t / 100), 2);
  }
  ['cost', 'price', 'cost2', 'target'].forEach(function (id) { $(id).addEventListener('input', calc); });
})();
</script>
