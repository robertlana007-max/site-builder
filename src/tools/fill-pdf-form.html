<style>
.ff-info { margin: 0 0 14px; }
.ff-list { display: grid; gap: 12px; margin-bottom: 16px; }
.ff-list h3 { margin: 6px 0 0; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ff-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); }
.ff-row.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ff-row > label, .ff-row > .ff-lab { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; overflow-wrap: anywhere; }
.ff-row small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.ff-row textarea { min-height: 80px; font-family: inherit; font-size: 15px; }
.ff-row select[multiple] { min-height: 110px; }
.ff-opts { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.ff-opts label { font-weight: 400; font-size: 15px; margin: 0; }
.ff-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.ff-tools .btn { min-height: 40px; padding: 6px 13px; }
.ff-tools .btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.ff-tools select { width: auto; min-height: 40px; padding: 6px 10px; }
.ff-sheet.arm { cursor: copy; outline: 3px dashed var(--accent); outline-offset: 2px; }
.ff-layer { position: absolute; inset: 0; }
.ff-w { position: absolute; background: rgba(37, 99, 235, .12); border: 1px solid rgba(37, 99, 235, .55); border-radius: 2px; cursor: pointer; overflow: hidden; color: #1d4ed8; font: 11px/1.15 Arial, sans-serif; white-space: nowrap; padding: 0 2px; box-sizing: border-box; }
.ff-w.on { background: rgba(37, 99, 235, .28); border-color: #1d4ed8; }
.ff-it { position: absolute; display: flex; align-items: flex-start; touch-action: none; }
.ff-it input { font-family: Arial, "Noto Sans", sans-serif; line-height: 1.2; padding: 0; margin: 0; border: 1px dashed #2563eb; border-radius: 0; background: rgba(255, 255, 255, .6); min-height: 0; width: auto; box-shadow: none; }
.ff-it svg { display: block; border: 1px dashed transparent; }
.ff-it:hover svg, .ff-it.on svg { border-color: #2563eb; }
.ff-grip, .ff-x { flex: none; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font: 700 12px/16px system-ui, sans-serif; cursor: move; touch-action: none; margin-inline-start: 2px; }
.ff-grip { background: #2563eb; } .ff-x { background: #e5484d; cursor: pointer; }
@media (pointer: coarse) { .ff-grip, .ff-x { width: 30px; height: 30px; line-height: 24px; } }

<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a PDF form here</b>Fill it in on your device. The file is never uploaded.</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div id="ffWork" hidden>
  <div class="notice ff-info" id="ffInfo"><p id="ffInfoText"></p></div>
  <div class="ff-list" id="ffList"></div>
  <h3 style="margin:8px 0 8px;font-size:17px">Type anywhere on the page</h3>
  <div class="ff-tools">
    <button class="btn ghost" type="button" id="ffAddText" aria-pressed="false">+ Text</button>
    <button class="btn ghost" type="button" id="ffAddCheck" aria-pressed="false" aria-label="Add a tick mark">+ ✓</button>
    <button class="btn ghost" type="button" id="ffAddCross" aria-pressed="false" aria-label="Add a cross mark">+ ✗</button>
    <button class="btn ghost" type="button" id="ffAddDate" aria-pressed="false">+ Date</button>
    <select id="ffSize" aria-label="Text size"><option value="8">8 pt</option><option value="10">10 pt</option><option value="11" selected>11 pt</option><option value="12">12 pt</option><option value="14">14 pt</option><option value="18">18 pt</option><option value="24">24 pt</option></select>
    <select id="ffColor" aria-label="Text colour"><option value="#111111">Black</option><option value="#1d4ed8">Blue</option><option value="#b91c1c">Red</option></select>
  </div>
  <div class="pager">
    <button class="btn ghost" id="ffPrev" type="button" aria-label="Previous page">‹</button>
    <span id="ffPageNo">Page 1 of 1</span>
    <button class="btn ghost" id="ffNext" type="button" aria-label="Next page">›</button>
    <span class="grow"></span>
    <span id="ffHint">Pick + Text, then tap the page where it goes.</span>
  </div>
  <div class="stage"><div class="sheet ff-sheet" id="ffSheet"><canvas id="ffCv"></canvas><div class="ff-layer" id="ffLayer"></div></div></div>
  <div class="checks" style="margin-top:14px">
    <label><input type="checkbox" id="ffFlat"> Flatten: make the filled answers part of the page, so they can no longer be changed</label>
  </div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Save filled PDF</button><a class="btn ghost" id="dl" hidden>Download filled PDF</a></div>
<p class="msg" id="msg"></p>

    if (busy) return PT.say('bad', 'Please wait until the current job is finished.');
    if (!f.size) return PT.say('bad', '"' + f.name + '" is empty.');
    if (!PT.isPdf(f)) return PT.say('bad', '"' + f.name + '" is not a PDF. Please choose a PDF file.');

      var form = d.getForm(), list = [];
      xfa = false; try { xfa = form.hasXFA(); } catch (e) { xfa = false; }
      try { list = form.getFields(); } catch (e) { list = []; }

        var F = { i: i, field: fd, kind: kindOf(fd), name: fd.getName() };
        F.label = tooltip(fd) || nice(F.name);
        try { F.spots = pageOfWidgets(fd); } catch (e) { F.spots = []; }
        if (F.kind === 'radio') { // which widget stands for which choice
          var opts = []; try { opts = fd.getOptions(); } catch (e) { opts = []; }
          F.spots.forEach(function (sp) { try { var on = sp.widget.getOnValue(); sp.opt = on ? on.decodeText() : null; } catch (e) { sp.opt = null; } if (sp.opt != null && opts.indexOf(sp.opt) === -1) sp.opt = null; });
        }
        F.page = F.spots.length ? Math.min.apply(null, F.spots.map(function (s) { return s.page < 0 ? 1e9 : s.page; })) : -1;
        if (F.page === 1e9) F.page = -1;
        var top = F.spots.length ? F.spots[0] : { y: 0, x: 0, h: 0 };
        F.top = top.y + top.h; F.left = top.x;
        F.start = valueOf(F); F.value = JSON.parse(JSON.stringify(F.start));
        F.paint = function () { F.spots.forEach(function (sp) { if (!sp.el) return; sp.el.textContent = F.kind === 'radio' ? (sp.opt != null && sp.opt === F.value ? '●' : '') : shown(F); }); };

      });
      fields.sort(function (a, b) { return (a.page < 0 ? 1e9 : a.page) - (b.page < 0 ? 1e9 : b.page) || b.top - a.top || a.left - b.left; });
      buildList();
      var usable = fields.filter(function (F) { return F.kind !== 'sign' && F.kind !== 'button'; }).length, signs = fields.filter(function (F) { return F.kind === 'sign'; }).length;
      var pages = {}; fields.forEach(function (F) { if (F.kind !== 'sign' && F.kind !== 'button' && F.page >= 0) pages[F.page] = 1; });
      var np = Object.keys(pages).length;
      if (usable) info('Found ' + usable + ' form ' + (usable === 1 ? 'field' : 'fields') + (np ? ' on ' + np + (np === 1 ? ' page' : ' pages') : '') + '. Fill them in below, or tap a blue box on the page.' + (signs ? ' ' + signs + ' signature field(s) are left as they are: use the free Sign PDF tool for those.' : '') + (xfa ? ' This form also had an Adobe XFA layer, which is removed so every PDF reader shows your answers.' : '') + (was ? ' The form was locked against changes; the saved copy is unlocked.' : ''), 'ok');

      $('drop').querySelector('b').textContent = f.name;
      Object.keys(ARMS).forEach(function (k) { $(k).setAttribute('aria-pressed', 'false'); }); sheet.classList.remove('arm');
      busy = false; refresh(); await show(1);
      PT.say('', f.name + ' · ' + n + (n === 1 ? ' page' : ' pages') + ' · ' + fmtBytes(f.size));
    })().catch(function (e) { busy = false; refresh(); PT.say('bad', e && e.message ? e.message : 'Something went wrong with this file.'); });
  });

  // ---------- save ----------
  var noto = null;
  function notoBytes() { if (!noto) noto = fetch('../assets/vendor/fonts/noto-sans-subset-400.ttf').then(function (r) { if (!r.ok) throw new Error(); return r.arrayBuffer(); }).catch(function (e) { noto = null; throw e; }); return noto; }
  function covers(font, s) { var g = font.embedder.font; return Array.from(String(s)).every(function (c) { var cp = c.codePointAt(0); return cp < 32 || g.hasGlyphForCodePoint(cp); }); }
  function rgb(hex) { var v = parseInt(hex.slice(1), 16); return PDFLib.rgb((v >> 16) / 255, (v >> 8 & 255) / 255, (v & 255) / 255); }

  $('go').addEventListener('click', function () {
    if (!doc || busy) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    busy = true;
    PT.run(async function () {
      var L = PDFLib, d = await L.PDFDocument.load(bytes, { updateMetadata: false }), form = d.getForm(), flat = $('ffFlat').checked;
      d.registerFontkit(fontkit);
      var font = await d.embedFont(await notoBytes(), { subset: true });
      var texts = items.map(function (it) { return it.text || ''; }), special = [], changed = 0;
      try { if (form.hasXFA()) form.deleteXFA(); } catch (e) { /* none */ }
      var byName = {}; form.getFields().forEach(function (f) { byName[f.getName()] = f; });
      fields.forEach(function (F) {
        var f = byName[F.name];
        if (!f || F.ro || F.kind === 'sign' || F.kind === 'button') return;
        var v = F.value, touched = !same(v, F.start);
        try {
          if (touched) {
            changed++;
            if (F.kind === 'text') f.setText(v || undefined);
            else if (F.kind === 'check') { if (v) f.check(); else f.uncheck(); }
            else if (F.kind === 'radio') { if (v) f.select(v); else f.clear(); }
            else if (F.kind === 'drop') { if (v) f.select(v); else f.clear(); }
            else if (F.kind === 'list') { if (v.length) f.select(v); else f.clear(); }
          }
          var str = F.kind === 'list' ? v.join(' ') : String(v || '');
          if (F.kind === 'text' || F.kind === 'drop' || F.kind === 'list') {
            if (!covers(font, str)) { special.push({ F: F, f: f, text: str }); texts.push(str); }
            else if (touched || flat) f.updateAppearances(font);
          } else if (touched || flat) {
            try { if (f.needsAppearancesUpdate()) f.updateAppearances(); } catch (e) { /* keeps its own look */ }
          }
        } catch (e) {
          throw new Error('The field "' + F.label + '" could not be filled' + (F.kind === 'text' && /length/i.test(String(e && e.message)) ? ': the text is longer than this field allows.' : '.'));
        }
      });
      // fields now name the Noto font in their default look: list it in the form's resources, so readers that redraw fields can find it
      try {
        var ac = form.acroForm.dict, dr = ac.lookup(L.PDFName.of('DR'), L.PDFDict);
        if (!dr) { dr = d.context.obj({}); ac.set(L.PDFName.of('DR'), dr); }
        var df = dr.lookup(L.PDFName.of('Font'), L.PDFDict);
        if (!df) { df = d.context.obj({}); dr.set(L.PDFName.of('Font'), df); }
        df.set(L.PDFName.of(font.name), font.ref);
      } catch (e) { /* the fields keep their own drawings */ }
      var T = await PDFText.create(d,{ text: texts, onStatus: function (m) { PT.say('', m); } }), pages = d.getPages();
      // answers in scripts the form font cannot show (Arabic, Chinese…)
      special.forEach(function (s) {
        if (flat) {
          s.F.spots.forEach(function (sp) {
            var pg = pages[sp.page]; if (!pg || !s.text) return;
            var multi = false; try { multi = s.f.isMultiline && s.f.isMultiline(); } catch (e) { multi = false; }
            var size = multi ? Math.min(11, sp.h / 3) : Math.max(6, Math.min(12, sp.h * .62)), al = 'start';
            try { al = ['start', 'center', 'right'][s.f.getAlignment ? s.f.getAlignment() : 0] || 'start'; } catch (e) { al = 'start'; }
            var lines = multi ? T.wrap(s.text, size, font, sp.w - 4) : [s.text];
            if (!multi) while (size > 5 && T.width(s.text, size, font) > sp.w - 4) size -= .5;
            lines.forEach(function (ln, k) {
              var y = multi ? sp.y + sp.h - 2 - size * (k + 1) * 1.15 + size * .2 : sp.y + (sp.h - size * .7) / 2;
              if (y < sp.y - 1) return;
              T.draw(pg, ln, { x: sp.x + 2, y: y, size: size, font: font, color: L.rgb(0, 0, 0), width: sp.w - 4, align: al });
            });
          });
          form.removeField(s.f);
        } else {
          // the reader draws these answers itself, with its own fonts
          s.f.acroField.getWidgets().forEach(function (w) { w.dict.delete(L.PDFName.of('AP')); });
          form.acroForm.dict.set(L.PDFName.of('NeedAppearances'), L.PDFBool.True);
        }
      });
      // text, ticks and crosses typed anywhere
      items.forEach(function (it) {
        var pg = pages[it.page - 1]; if (!pg) return;
        if (it.kind === 'text' && !it.text.trim()) return;
        var v = PT.view(pg), base = it.kind === 'text' ? it.y + it.size * .98 : it.y + it.size, p0 = v.at(it.x, v.height - base), a = v.angle * Math.PI / 180;
        pg.pushOperators(L.pushGraphicsState(), L.concatTransformationMatrix(Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), p0.x, p0.y));

        else {
          var k = it.size / 10, path = it.kind === 'check' ? 'M1.2 5.4 L4 8.2 L8.8 1.8' : 'M1.8 1.8 L8.2 8.2 M8.2 1.8 L1.8 8.2';

      PT.say('', 'Saving…');
      var out = await d.save({ updateFieldAppearances: false });
      var placed = items.filter(function (it) { return it.kind !== 'text' || it.text.trim(); }).length;
      PT.done(out, PT.base(file.name) + '-filled.pdf', 'application/pdf', (changed ? 'Filled ' + changed + (changed === 1 ? ' field' : ' fields') : 'No form answers changed') + (placed ? ', added ' + placed + (placed === 1 ? ' item' : ' items') + ' to the page' : '') + (flat ? ', flattened' : '') + (special.length && !flat ? '. Some answers use a script the form font lacks: they show in Chrome, Edge, Firefox and Adobe Reader. Tick Flatten for a fixed look everywhere' : ''));
    }).then(function () { busy = false; refresh(); });
  });
})();
</script>
