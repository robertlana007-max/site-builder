<style>
.bs-stage { display: grid; place-items: center; height: 280px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 16px; overflow: hidden; }
.bs-box { width: 160px; height: 160px; }
.bs-layers { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.bs-layers button { font: 600 13.5px/1 inherit; font-family: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
.bs-layers button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.bs-col { display: flex; gap: 10px; align-items: center; }
.bs-col input[type=color] { width: 54px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 3px; cursor: pointer; flex: none; }
.bs-pre { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.bs-pre button { font: 500 13px/1 inherit; font-family: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.bs-code { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 13.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 12px 0 0; }
</style>
<div class="bs-stage" id="stage"><div class="bs-box" id="box"></div></div>
<label>Shadow layers</label>
<div class="bs-layers" id="layers"></div>
<div class="btns" style="margin:0 0 16px"><button class="btn ghost" id="addL" type="button">Add layer</button><button class="btn ghost" id="dupL" type="button">Duplicate layer</button><button class="btn ghost" id="delL" type="button">Remove layer</button></div>
<div class="fields">
  <div><label for="sx">Horizontal offset: <span id="sxV"></span>px</label><input type="range" id="sx" min="-100" max="100" data-nomemo></div>
  <div><label for="sy">Vertical offset: <span id="syV"></span>px</label><input type="range" id="sy" min="-100" max="100" data-nomemo></div>
  <div><label for="sb">Blur: <span id="sbV"></span>px</label><input type="range" id="sb" min="0" max="150" data-nomemo></div>
  <div><label for="ss">Spread: <span id="ssV"></span>px</label><input type="range" id="ss" min="-60" max="80" data-nomemo></div>
  <div><label for="sc">Shadow color and opacity: <span id="soV"></span>%</label><div class="bs-col"><input type="color" id="sc" data-nomemo aria-label="Shadow color"><input type="range" id="so" min="0" max="100" data-nomemo aria-label="Shadow opacity"></div></div>
</div>
<div class="checks"><label><input type="checkbox" id="inset" data-nomemo>Inset (shadow inside the box)</label></div>
<details class="more"><summary>Box and background</summary><div class="fields" style="margin-top:8px">
  <div><label for="boxc">Box color</label><input type="color" id="boxc" value="#ffffff" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:3px"></div>
  <div><label for="bgc">Background color</label><input type="color" id="bgc" value="#eef1f6" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:3px"></div>
  <div><label for="rad">Corner radius: <span id="radV">16</span>px</label><input type="range" id="rad" min="0" max="100" value="16"></div>
  <div><label for="bsz">Box size: <span id="bszV">160</span>px</label><input type="range" id="bsz" min="40" max="220" value="160"></div>
</div></details>
<label>Presets</label>
<div class="bs-pre" id="pre"></div>
<label>CSS code</label>
<pre class="bs-code" id="code"></pre>
<div class="btns"><button class="btn" id="cp" type="button">Copy CSS</button></div>
<script>
(function () {
  var L = [{ x: 0, y: 10, b: 30, s: -5, c: '#000000', o: 25, i: false }], sel = 0;
  var PRE = {
    'Soft': [{ x: 0, y: 10, b: 30, s: -5, c: '#000000', o: 25, i: false }],
    'Layered': [{ x: 0, y: 1, b: 2, s: 0, c: '#000000', o: 7, i: false }, { x: 0, y: 2, b: 4, s: 0, c: '#000000', o: 7, i: false }, { x: 0, y: 4, b: 8, s: 0, c: '#000000', o: 7, i: false }, { x: 0, y: 8, b: 16, s: 0, c: '#000000', o: 7, i: false }, { x: 0, y: 16, b: 32, s: 0, c: '#000000', o: 7, i: false }],
    'Material card': [{ x: 0, y: 3, b: 6, s: 0, c: '#000000', o: 16, i: false }, { x: 0, y: 3, b: 6, s: 0, c: '#000000', o: 23, i: false }],
    'Hard offset': [{ x: 8, y: 8, b: 0, s: 0, c: '#111827', o: 100, i: false }],
    'Glow': [{ x: 0, y: 0, b: 30, s: 4, c: '#3b82f6', o: 70, i: false }],
    'Inner': [{ x: 0, y: 4, b: 12, s: 0, c: '#000000', o: 30, i: true }],
    'Neumorphism': [{ x: 10, y: 10, b: 24, s: 0, c: '#a3b1c6', o: 80, i: false }, { x: -10, y: -10, b: 24, s: 0, c: '#ffffff', o: 90, i: false }],
    'Floating': [{ x: 0, y: 30, b: 60, s: -12, c: '#32325d', o: 25, i: false }, { x: 0, y: 18, b: 36, s: -18, c: '#000000', o: 30, i: false }]
  };
  function col(l) { var n = parseInt(l.c.slice(1), 16); return l.o >= 100 ? l.c : 'rgba(' + (n >> 16 & 255) + ', ' + (n >> 8 & 255) + ', ' + (n & 255) + ', ' + +(l.o / 100).toFixed(2) + ')'; }
  function one(l) { return (l.i ? 'inset ' : '') + l.x + 'px ' + l.y + 'px ' + l.b + 'px ' + l.s + 'px ' + col(l); }
  function value() { return L.map(one).join(',\n    '); }
  function css() { return 'box-shadow: ' + value() + ';'; }
  function paint() {
    $('box').style.boxShadow = L.map(one).join(', ');
    $('box').style.background = $('boxc').value; $('stage').style.background = $('bgc').value;
    $('box').style.borderRadius = $('rad').value + 'px'; $('box').style.width = $('box').style.height = $('bsz').value + 'px';
    $('radV').textContent = $('rad').value; $('bszV').textContent = $('bsz').value;
    $('code').textContent = css();
  }
  function load() { // put the selected layer into the controls
    var l = L[sel];
    $('sx').value = l.x; $('sy').value = l.y; $('sb').value = l.b; $('ss').value = l.s; $('sc').value = l.c; $('so').value = l.o; $('inset').checked = l.i;
    labels();
    $('layers').innerHTML = L.map(function (_, i) { return '<button type="button" aria-pressed="' + (i === sel) + '" data-i="' + i + '">Layer ' + (i + 1) + '</button>'; }).join('');
    $('delL').disabled = L.length <= 1; $('addL').disabled = $('dupL').disabled = L.length >= 10;
    paint();
  }
  function labels() { $('sxV').textContent = $('sx').value; $('syV').textContent = $('sy').value; $('sbV').textContent = $('sb').value; $('ssV').textContent = $('ss').value; $('soV').textContent = $('so').value; }
  function read() { var l = L[sel]; l.x = +$('sx').value; l.y = +$('sy').value; l.b = +$('sb').value; l.s = +$('ss').value; l.c = $('sc').value; l.o = +$('so').value; l.i = $('inset').checked; labels(); paint(); }
  ['sx', 'sy', 'sb', 'ss', 'sc', 'so', 'inset'].forEach(function (id) { $(id).addEventListener('input', read); $(id).addEventListener('change', read); });
  ['boxc', 'bgc', 'rad', 'bsz'].forEach(function (id) { $(id).addEventListener('input', paint); $(id).addEventListener('change', paint); });
  $('layers').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; sel = +b.dataset.i; load(); });
  $('addL').addEventListener('click', function () { if (L.length >= 10) return; L.push({ x: 0, y: 4, b: 12, s: 0, c: '#000000', o: 20, i: false }); sel = L.length - 1; load(); });
  $('dupL').addEventListener('click', function () { if (L.length >= 10) return; L.splice(sel + 1, 0, Object.assign({}, L[sel])); sel++; load(); });
  $('delL').addEventListener('click', function () { if (L.length <= 1) return; L.splice(sel, 1); sel = Math.max(0, sel - 1); load(); });
  Object.keys(PRE).forEach(function (k) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = k;
    b.addEventListener('click', function () { L = PRE[k].map(function (l) { return Object.assign({}, l); }); sel = 0; if (k === 'Neumorphism') { $('bgc').value = '#e0e5ec'; $('boxc').value = '#e0e5ec'; } load(); });
    $('pre').appendChild(b);
  });
  $('cp').addEventListener('click', function () { copyText(css(), $('cp')); });
  load();
})();
</script>
