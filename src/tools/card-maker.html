<style>
.gcm fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.gcm legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.gcm .fields { margin-bottom: 12px; }
.gcm textarea { min-height: 80px; font-family: inherit; font-size: 15px; }
.gcm .gcm-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-bottom: 12px; }
.gcm .gcm-row button { font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 4px 6px; }
.gcm .gcm-row button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.gcm .gcm-pal { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.gcm .gcm-pal button { display: flex; width: 54px; height: 32px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); padding: 0; cursor: pointer; }
.gcm .gcm-pal button i { flex: 1; }
.gcm .gcm-pal button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.gcm .gcm-hint { display: block; font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.gcm .gcm-img { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.gcm .gcm-img img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.gcm input[type=file] { max-width: 100%; }
.gcm .gcm-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.gcm .gcm-prev canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 640px; width: auto; height: auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); border-radius: 4px; }
</style>
<div class="gcm" id="gcm">
<fieldset><legend>Occasion</legend>
  <div class="gcm-row" id="gcOcc"></div>
</fieldset>
<fieldset><legend>Words</legend>
  <div class="fields">
    <div><label for="gcHead">Headline</label><input type="text" id="gcHead" data-nomemo maxlength="60"></div>
    <div><label for="gcTo">To (optional)</label><input type="text" id="gcTo" data-nomemo maxlength="60" placeholder="e.g. Dear Sofia"></div>
  </div>
  <div class="fields"><div><label for="gcMsg">Message</label><textarea id="gcMsg" data-nomemo maxlength="500"></textarea></div></div>
  <div class="fields" id="gcInv">
    <div><label for="gcWhen">Date and time</label><input type="text" id="gcWhen" data-nomemo maxlength="60" placeholder="e.g. Saturday 14 June, 4 pm"></div>
    <div><label for="gcWhere">Place</label><input type="text" id="gcWhere" data-nomemo maxlength="80" placeholder="e.g. Garden Hall, 5 Park Road"></div>
    <div><label for="gcRsvp">Reply to (RSVP)</label><input type="text" id="gcRsvp" data-nomemo maxlength="60" placeholder="e.g. Ana, +34 600 000 000"></div>
  </div>
  <div class="fields"><div><label for="gcFrom">From</label><input type="text" id="gcFrom" data-nomemo maxlength="60" placeholder="e.g. With love, Leo"></div></div>
</fieldset>
<fieldset><legend>Look</legend>
  <label>Decoration</label>
  <div class="gcm-row" id="gcDeco"></div>
  <label>Colours</label>
  <div class="gcm-pal" id="gcPal"></div>
  <div class="fields">
    <div><label for="gcFont">Headline font</label><select id="gcFont" data-nomemo><option value="script">Elegant script</option><option value="hand">Handwritten</option><option value="caveat">Casual</option><option value="display">Big and bold</option><option value="serifb">Classic serif</option><option value="sansb">Clean sans</option></select></div>
    <div><label for="gcSize">Size</label><select id="gcSize" data-nomemo><option value="sq">Square (WhatsApp, Instagram post)</option><option value="story">Story 9:16 (phone status)</option><option value="5x7">5 × 7 in card (print)</option><option value="a5">A5 card (print)</option><option value="7x5">7 × 5 in landscape (print)</option></select></div>
  </div>
  <label for="gcPhoto">Photo (optional)</label>
  <div class="gcm-img"><input type="file" id="gcPhoto" data-nomemo accept="image/png,image/jpeg,image/webp"><img id="gcPhotoImg" alt="Your photo" hidden><button type="button" class="btn ghost" id="gcPhotoDel" hidden>Remove</button></div>
  <div class="fields" id="gcPhotoOpt" hidden><div><label for="gcPhotoMode">Show the photo</label><select id="gcPhotoMode" data-nomemo><option value="circle">In a circle</option><option value="bg">As the background</option></select></div></div>
</fieldset>
<div class="gcm-prev"><canvas id="gcCanvas" width="540" height="540" aria-label="Card preview"></canvas></div>
<div class="btns">
  <button type="button" class="btn" id="gcPng">Download PNG</button>
  <button type="button" class="btn ghost" id="gcPdf">Download PDF (print)</button>
  <button type="button" class="btn ghost" id="gcShuffle">Shuffle decorations</button>
  <button type="button" class="btn ghost" id="gcShare" hidden>Share</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

  var HEART = 'M0 -3C-6 -12 -18 -5 -11 5L0 15L11 5C18 -5 6 -12 0 -3Z', LEAF = 'M0 0C6 -9 18 -9 24 0C18 9 6 9 0 0Z', BALLOON = 'M0 -22C13 -22 20 -9 18 2C16 13 8 21 0 21C-8 21 -16 13 -18 2C-20 -9 -13 -22 0 -22ZM-3 21L3 21L0 25Z';

  function design(W, H) {
    var o = [], P = PALS[S.pal] || PALS[0], bg = P[0], a1 = P[1], a2 = P[2], ink = P[3], R = rnd(S.seed), U = Math.min(W, H) / 540, deco = S.deco;
    function text(t, x, y, font, s, fill, maxW, ls) { if (!t) return 0; s = GD.fit(t, font, s, maxW, 5, ls); o.push({ k: 'text', t: t, x: x, y: y, font: font, s: s, fill: fill, align: 'center', ls: ls }); return s; }
    o.push({ k: 'rect', x: 0, y: 0, w: W, h: H, fill: bg });
    var bgPhoto = photo && $('gcPhotoMode').value === 'bg';
    if (bgPhoto) { o.push({ k: 'img', img: photo, x: 0, y: 0, w: W, h: H, fit: 'cover' }); o.push({ k: 'rect', x: 0, y: 0, w: W, h: H, fill: '#000000', op: 0.45 }); ink = '#ffffff'; }
    // decorations along the top and bottom edges, kept out of the middle text area
    function edgeSpot() { var top = R() < 0.5, x = R() * W, y = top ? R() * H * 0.17 : H - R() * H * 0.17; return [x, y]; }
    if (deco === 'confetti') for (var i = 0; i < 70; i++) { var p = edgeSpot(), c = [a1, a2, ink][i % 3]; if (R() < 0.5) o.push({ k: 'path', d: 'M-5 -1.6H5V1.6H-5Z', x: p[0], y: p[1], sc: U * (0.8 + R()), rot: R() * 6.28, fill: c, op: 0.9 }); else o.push({ k: 'circle', x: p[0], y: p[1], r: U * (1.5 + R() * 2.5), fill: c, op: 0.85 }); }
    if (deco === 'balloons') { [[0.1, 0.16, a1], [0.2, 0.1, a2], [0.85, 0.13, a1], [0.93, 0.2, a2], [0.08, 0.86, a2], [0.9, 0.88, a1]].forEach(function (b, i) { var x = W * b[0], y = H * b[1], sc = U * (1.4 + R() * 0.6); o.push({ k: 'line', x1: x, y1: y + 25 * sc, x2: x + (R() - 0.5) * 20 * U, y2: y + 25 * sc + 50 * U, stroke: ink, lw: 0.7 * U, op: 0.5 }); o.push({ k: 'path', d: BALLOON, x: x, y: y, sc: sc, fill: b[2] }); o.push({ k: 'path', d: 'M-8 -14C-12 -10 -13 -4 -12 0', x: x, y: y, sc: sc, stroke: '#ffffff', lw: 1.4 * U, op: 0.6 }); }); }
    if (deco === 'floral') {
      [[0, 0], [W, 0], [0, H], [W, H]].forEach(function (cn, k) {
        for (var j = 0; j < 7; j++) { var ang = (k === 0 ? 0 : k === 1 ? Math.PI / 2 : k === 2 ? -Math.PI / 2 : Math.PI) + j * 0.26 + R() * 0.1; o.push({ k: 'path', d: LEAF, x: cn[0], y: cn[1], sc: U * (2.6 + R() * 1.2), rot: ang, fill: j % 2 ? a2 : a1, op: 0.55 }); }
        var fx = cn[0] + (cn[0] ? -1 : 1) * 46 * U, fy = cn[1] + (cn[1] ? -1 : 1) * 46 * U, pr = 11 * U;
        for (var q = 0; q < 6; q++) { var an = q * Math.PI / 3; o.push({ k: 'circle', x: fx + Math.cos(an) * pr, y: fy + Math.sin(an) * pr, r: pr * 0.85, fill: a1, op: 0.9 }); }
        o.push({ k: 'circle', x: fx, y: fy, r: pr * 0.7, fill: a2 });
      });
    }
    if (deco === 'stars') for (var s2 = 0; s2 < 36; s2++) { var sp = edgeSpot(), rr = U * (3 + R() * 7); o.push({ k: 'path', d: R() < 0.7 ? star(5, rr, rr * 0.45) : star(4, rr, rr * 0.3), x: sp[0], y: sp[1], sc: 1, rot: R(), fill: s2 % 3 ? a1 : a2, op: 0.6 + R() * 0.4 }); }
    if (deco === 'hearts') for (var h = 0; h < 26; h++) { var hp = edgeSpot(); o.push({ k: 'path', d: HEART, x: hp[0], y: hp[1], sc: U * (0.6 + R() * 1.1), rot: (R() - 0.5) * 0.8, fill: h % 2 ? a1 : a2, op: 0.7 + R() * 0.3 }); }
    if (deco === 'frame') { var m = 18 * U; o.push({ k: 'rect', x: m, y: m, w: W - 2 * m, h: H - 2 * m, stroke: a1, lw: 2 * U }); o.push({ k: 'rect', x: m + 7 * U, y: m + 7 * U, w: W - 2 * m - 14 * U, h: H - 2 * m - 14 * U, stroke: a1, lw: 0.6 * U }); [[m, m], [W - m, m], [m, H - m], [W - m, H - m]].forEach(function (p) { o.push({ k: 'path', d: star(4, 9, 3), x: p[0], y: p[1], sc: U, fill: a1 }); }); }
    // text block, measured first so it can be centred
    var cx = W / 2, maxW = W - 90 * U, hf = $('gcFont').value, items = [];
    var hs = { script: 64, hand: 56, caveat: 62, display: 50, serifb: 44, sansb: 44 }[hf] * U;
    if (photo && !bgPhoto) items.push({ ph: Math.min(W, H) * 0.3 });
    if (v('gcTo')) items.push({ t: v('gcTo'), f: 'serif', s: 20 * U, c: ink, gap: 10 });
    GD.wrap(v('gcHead'), hf, hs, maxW).slice(0, 5).forEach(function (l, i, arr) { items.push({ t: l, f: hf, s: GD.fit(l, hf, hs, maxW), c: bgPhoto || a1 === bg ? ink : a1, gap: i === arr.length - 1 ? 16 : 2, lh: 1.05 }); });
    var bs = 17 * U; GD.wrap(v('gcMsg'), 'serif', bs, maxW - 20 * U).slice(0, 30).forEach(function (l, i, arr) { items.push({ t: l, f: 'serif', s: bs, c: ink, gap: i === arr.length - 1 ? 14 : 0, lh: 1.45 }); });
    if (OCC[S.occ][4]) [['When', v('gcWhen')], ['Where', v('gcWhere')], ['RSVP', v('gcRsvp')]].forEach(function (d) { if (!d[1]) return; items.push({ t: d[0].toUpperCase(), f: 'sansb', s: 10.5 * U, c: bgPhoto || a1 === bg ? ink : a1, ls: 2 * U, gap: 2 }); GD.wrap(d[1], 'serif', 16 * U, maxW).slice(0, 2).forEach(function (l) { items.push({ t: l, f: 'serif', s: 16 * U, c: ink, gap: 0, lh: 1.35 }); }); items[items.length - 1].gap = 10; });
    if (v('gcFrom')) items.push({ t: v('gcFrom'), f: hf === 'display' || hf === 'sansb' ? 'serif' : 'hand', s: 24 * U, c: ink, gap: 0 });
    var total = 0; items.forEach(function (it) { it.h = it.ph ? it.ph + 18 * U : it.s * (it.lh || 1.3); total += it.h + (it.gap || 0) * U; });
    var area = H * (deco === 'none' || deco === 'frame' || bgPhoto ? 0.88 : 0.64), k = total > area ? area / total : 1;
    var y = (H - total * k) / 2;
    items.forEach(function (it) {
      if (it.ph) { var d = it.ph * k; o.push({ k: 'circle', x: cx, y: y + d / 2, r: d / 2 + 4 * U, fill: a1 }); o.push({ k: 'img', img: photo, x: cx - d / 2, y: y, w: d, h: d, clip: 'circle', fit: 'cover' }); y += (it.h) * k; return; }
      var s = it.s * k; y += s * (it.lh || 1.3) * 0.78; text(it.t, cx, y, it.f, s, it.c, maxW, it.ls ? it.ls * k : 0); y += s * (it.lh || 1.3) * 0.22 + (it.gap || 0) * U * k;
    });
    return o;
  }

  var timer = null, ready = false;
  function draw() {
    var sz = SIZES[$('gcSize').value] || SIZES.sq, c = $('gcCanvas'), sc = Math.min(2, (window.devicePixelRatio || 1) * Math.min(1, 540 / Math.max(sz[0], sz[1])) * 1.2);
    c.width = Math.round(sz[0] * sc); c.height = Math.round(sz[1] * sc); c.style.width = Math.min(sz[0], 540 * sz[0] / Math.max(sz[0], sz[1])) + 'px';
    GD.drawCanvas(design(sz[0], sz[1]), c.getContext('2d'), sc);
  }
  function save() { var o = { occ: S.occ, deco: S.deco, pal: S.pal, seed: S.seed }; FIELDS.forEach(function (id) { o[id] = $(id).value; }); try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  function changed() { clearTimeout(timer); timer = setTimeout(function () { if (ready) draw(); save(); }, 60); }
  function paint() {
    $('gcOcc').innerHTML = Object.keys(OCC).map(function (k) { return '<button type="button" data-k="' + k + '" aria-pressed="' + (k === S.occ) + '">' + OCC[k][0] + '</button>'; }).join('');
    $('gcDeco').innerHTML = DECOS.map(function (d) { return '<button type="button" data-d="' + d[0] + '" aria-pressed="' + (d[0] === S.deco) + '">' + d[1] + '</button>'; }).join('');
    $('gcPal').innerHTML = PALS.map(function (p, i) { return '<button type="button" data-p="' + i + '" aria-label="Colour set ' + (i + 1) + '" aria-pressed="' + (i === S.pal) + '"><i style="background:' + p[0] + '"></i><i style="background:' + p[1] + '"></i><i style="background:' + p[2] + '"></i></button>'; }).join('');
    $('gcInv').hidden = !OCC[S.occ][4];
  }
  function setOcc(k) {
    var cur = OCC[S.occ], edited = ($('gcHead').value !== cur[1] || $('gcMsg').value !== cur[2]) && ($('gcHead').value || $('gcMsg').value);
    S.occ = k;
    if (!edited || confirm('Use the suggested ' + OCC[k][0].toLowerCase() + ' headline and message instead of yours?')) { $('gcHead').value = OCC[k][1]; $('gcMsg').value = OCC[k][2]; S.deco = OCC[k][3]; S.pal = OCC[k][5]; }
    paint(); changed();
  }
  $('gcOcc').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setOcc(b.dataset.k); });
  $('gcDeco').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.deco = b.dataset.d; paint(); changed(); });
  $('gcPal').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.pal = +b.dataset.p; paint(); changed(); });
  $('gcm').addEventListener('input', function (e) { if (e.target.type !== 'file') changed(); });
  $('gcShuffle').addEventListener('click', function () { S.seed = Math.floor(Math.random() * 1e9) + 1; changed(); });
  $('gcPhoto').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    GD.readImage(f, 1600, function (img, err) { if (!img) return say('bad', err); photo = img; $('gcPhotoImg').src = img.src; $('gcPhotoImg').hidden = $('gcPhotoDel').hidden = $('gcPhotoOpt').hidden = false; say('ok', 'Photo added. It stays on this device.'); changed(); });
  });
  $('gcPhotoDel').addEventListener('click', function () { photo = null; $('gcPhotoImg').hidden = $('gcPhotoDel').hidden = $('gcPhotoOpt').hidden = true; changed(); });

  function base() { return (v('gcHead') || 'card').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 40) || 'card'; }
  function check() { if (!v('gcHead') && !v('gcMsg')) { say('bad', 'Write a headline or a message first.'); $('gcHead').focus(); return false; } return true; }
  function pngBlob(cb) { var sz = SIZES[$('gcSize').value], c = document.createElement('canvas'); c.width = Math.round(sz[0] * sz[2]); c.height = Math.round(sz[1] * sz[2]); GD.drawCanvas(design(sz[0], sz[1]), c.getContext('2d'), sz[2]); c.toBlob(function (b) { cb(b, c); }, 'image/png'); }
  $('gcPng').addEventListener('click', function () {
    if (!check()) return; var btn = this;
    pngBlob(function (b, c) { if (!b) return say('bad', 'This device could not make the picture.'); GD.download(b, base() + '.png'); say('ok', 'Saved ' + base() + '.png (' + c.width + ' × ' + c.height + ').'); if (window.burst) burst(btn); });
  });
  var busy = false;
  $('gcPdf').addEventListener('click', async function () {
    if (busy || !check()) return; busy = true; var btn = this; btn.disabled = true; say('', 'Making your PDF…');
    try {
      var sz = SIZES[$('gcSize').value], env = await GD.newPdf(v('gcHead') || 'Card', 'GetToolNest Card Maker', function (m) { say('', m); }), pg = env.doc.addPage([sz[0], sz[1]]);
      await GD.drawPdf(env, pg, design(sz[0], sz[1]));
      var bytes = await env.doc.save(); GD.download(new Blob([bytes], { type: 'application/pdf' }), base() + '.pdf');
      var note = 'Saved ' + base() + '.pdf (' + fmtBytes(bytes.length) + '). Print it at 100% ("Actual size").';
      say('ok', note);
    } catch (e) { say('bad', 'Sorry, the PDF could not be made. Check your connection (the PDF maker loads the first time) and try again.'); }
    busy = false; btn.disabled = false;
  });
  if (navigator.canShare) {
    $('gcShare').hidden = false;
    $('gcShare').addEventListener('click', function () {
      if (!check()) return;
      pngBlob(function (b) {
        var f = new File([b], base() + '.png', { type: 'image/png' });
        if (!navigator.canShare({ files: [f] })) return say('bad', 'Sharing pictures is not supported here. Use Download PNG instead.');
        navigator.share({ files: [f] }).catch(function (e) { if (e && e.name !== 'AbortError') say('bad', 'Could not share. Use Download PNG instead.'); });
      });
    });
  }

  var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (saved && typeof saved === 'object' && OCC[saved.occ]) {
    S.occ = saved.occ; if (DECOS.some(function (d) { return d[0] === saved.deco; })) S.deco = saved.deco; if (PALS[saved.pal]) S.pal = saved.pal; if (saved.seed > 0) S.seed = saved.seed;
    FIELDS.forEach(function (id) { if (typeof saved[id] !== 'string') return; var el = $(id); if (el.tagName === 'SELECT' && !el.querySelector('option[value="' + saved[id] + '"]')) return; el.value = saved[id]; });
    paint();
  } else { $('gcHead').value = OCC.birthday[1]; $('gcMsg').value = OCC.birthday[2]; paint(); }
  GD.loadAll(['serif', 'sansb', 'script', 'hand', 'caveat', 'display', 'serifb']).then(function () { ready = true; draw(); }, function () { say('bad', 'The fonts could not load. Check your connection and reload.'); });
})();
</script>
