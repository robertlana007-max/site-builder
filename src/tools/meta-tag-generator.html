<style>
.mt-cnt { font-size: 12.5px; color: var(--muted); font-weight: 500; float: right; }
.mt-cnt.warn { color: #b45309; } .mt-cnt.bad { color: var(--bad); } .mt-cnt.good { color: var(--ok); }
[data-theme="dark"] .mt-cnt.warn { color: #fbbf24; }
.mt-pv { margin-top: 10px; }
.mt-g { background: #fff; color: #202124; border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-family: Arial, Helvetica, sans-serif; max-width: 640px; }
.mt-g-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; min-width: 0; }
.mt-g-ic { width: 28px; height: 28px; border-radius: 50%; background: #f1f3f4; border: 1px solid #dadce0; flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5f6368; font-weight: 700; }
.mt-g-site { font-size: 14px; color: #202124; line-height: 1.3; min-width: 0; }
.mt-g-site small { display: block; font-size: 12px; color: #4d5156; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-g-t { font-size: 20px; line-height: 1.3; color: #1a0dab; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-g-d { font-size: 14px; line-height: 1.58; color: #4d5156; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.mt-card { border: 1px solid #dadde1; border-radius: 10px; overflow: hidden; max-width: 520px; background: #f2f3f5; color: #1c1e21; font-family: Helvetica, Arial, sans-serif; }
.mt-card.x { border-radius: 16px; background: #fff; color: #0f1419; border-color: #cfd9de; }
.mt-card.small { display: flex; }
.mt-img { aspect-ratio: 1.91 / 1; background: #e4e6eb center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: #8a8d91; font-size: 14px; }
.mt-card.small .mt-img { aspect-ratio: 1 / 1; width: 120px; flex: none; }
.mt-card-b { padding: 10px 12px; min-width: 0; }
.mt-card-u { font-size: 12px; text-transform: uppercase; color: #606770; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-card.x .mt-card-u { text-transform: none; color: #536471; }
.mt-card-t { font-weight: 700; font-size: 16px; line-height: 1.3; margin: 3px 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.mt-card-d { font-size: 14px; color: #606770; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.mt-card.x .mt-card-d { color: #536471; }
.mt-tips { margin: 8px 0 0; padding-inline-start: 20px; font-size: 14px; }
.mt-tips li { margin: 3px 0; }
.mt-tips li.bad { color: var(--bad); } .mt-tips li.good { color: var(--ok); }
#mtCode { min-height: 220px; font-size: 12.5px; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.mt-h { font-size: 17px; margin: 22px 0 8px; }
</style>
<div class="fields" style="grid-template-columns:1fr">
  <div><label for="mtTitle">Page title <span class="mt-cnt" id="mtTitleN"></span></label><input type="text" id="mtTitle" maxlength="200" placeholder="e.g. Handmade Ceramic Mugs | Clay & Co"></div>
  <div><label for="mtDesc">Description <span class="mt-cnt" id="mtDescN"></span></label><textarea id="mtDesc" class="plain" style="min-height:90px" maxlength="500" placeholder="One or two sentences that tell people what the page offers and why they should click."></textarea></div>
</div>
<div class="fields">
  <div><label for="mtUrl">Page URL</label><input type="text" id="mtUrl" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/page"></div>
  <div><label for="mtSite">Site name</label><input type="text" id="mtSite" placeholder="e.g. Clay & Co"></div>
  <div><label for="mtImg">Share image URL</label><input type="text" id="mtImg" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/share.jpg"></div>
  <div><label for="mtAlt">Image description (alt)</label><input type="text" id="mtAlt" placeholder="What the image shows"></div>
  <div><label for="mtType">Page type</label><select id="mtType"><option value="website">Website / home page</option><option value="article">Article / blog post</option><option value="product">Product</option><option value="profile">Profile</option><option value="video.other">Video</option><option value="book">Book</option></select></div>
  <div><label for="mtLocale">Language</label><select id="mtLocale"></select></div>
  <div><label for="mtCard">X (Twitter) card</label><select id="mtCard"><option value="summary_large_image">Large image</option><option value="summary">Small square image</option></select></div>
  <div><label for="mtTw">X (Twitter) account (optional)</label><input type="text" id="mtTw" autocomplete="off" spellcheck="false" placeholder="@yourname"></div>
  <div><label for="mtAuthor">Author (optional)</label><input type="text" id="mtAuthor" placeholder="Your name or company"></div>
  <div><label for="mtColor">Theme colour</label><input type="color" id="mtColor" value="#2563eb" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:4px"></div>
</div>
<div class="checks">
  <label><input type="checkbox" id="mtIndex" checked>Let search engines show this page</label>
  <label><input type="checkbox" id="mtFollow" checked>Let search engines follow its links</label>
  <label><input type="checkbox" id="mtCanon" checked>Add canonical link</label>
  <label><input type="checkbox" id="mtBasic" checked>Include charset and viewport</label>
  <label><input type="checkbox" id="mtTheme">Include theme colour</label>
</div>
<h2 class="mt-h">Google search preview</h2>
<div class="mt-pv"><div class="mt-g" aria-label="Google search result preview"><div class="mt-g-top"><div class="mt-g-ic" id="pvIc">G</div><div class="mt-g-site"><span id="pvGSite">Example</span><small id="pvGUrl">example.com</small></div></div><div class="mt-g-t" id="pvGT">Your page title</div><div class="mt-g-d" id="pvGD">Your description appears here.</div></div></div>
<h2 class="mt-h">Facebook, LinkedIn and WhatsApp preview</h2>
<div class="mt-pv"><div class="mt-card" id="pvF"><div class="mt-img" id="pvFI">No image</div><div class="mt-card-b"><div class="mt-card-u" id="pvFU">EXAMPLE.COM</div><div class="mt-card-t" id="pvFT"></div><div class="mt-card-d" id="pvFD"></div></div></div></div>
<h2 class="mt-h">X (Twitter) preview</h2>
<div class="mt-pv"><div class="mt-card x" id="pvX"><div class="mt-img" id="pvXI">No image</div><div class="mt-card-b"><div class="mt-card-u" id="pvXU">example.com</div><div class="mt-card-t" id="pvXT"></div><div class="mt-card-d" id="pvXD"></div></div></div></div>
<h2 class="mt-h">Checks</h2>
<ul class="mt-tips" id="mtTips"></ul>
<h2 class="mt-h">Your meta tags</h2>
<p class="msg" style="margin:0 0 8px">Paste these inside the &lt;head&gt; of your page.</p>
<textarea id="mtCode" data-nomemo readonly spellcheck="false"></textarea>
<div class="btns">
  <button class="btn" id="mtCp">Copy HTML</button>
  <button class="btn ghost" id="mtDl">Download .html</button>
  <button class="btn ghost" id="mtReset">Start over</button>
</div>
<script>
(function () {
  var LOCALES = [['', 'Not set'], ['en_US', 'English (US)'], ['en_GB', 'English (UK)'], ['en_IN', 'English (India)'], ['en_AU', 'English (Australia)'], ['es_ES', 'Spanish (Spain)'], ['es_LA', 'Spanish (Latin America)'], ['pt_BR', 'Portuguese (Brazil)'], ['pt_PT', 'Portuguese (Portugal)'], ['fr_FR', 'French'], ['de_DE', 'German'], ['it_IT', 'Italian'], ['nl_NL', 'Dutch'], ['pl_PL', 'Polish'], ['tr_TR', 'Turkish'], ['ru_RU', 'Russian'], ['uk_UA', 'Ukrainian'], ['ar_AR', 'Arabic'], ['ur_PK', 'Urdu'], ['hi_IN', 'Hindi'], ['bn_IN', 'Bengali'], ['fa_IR', 'Persian'], ['id_ID', 'Indonesian'], ['ms_MY', 'Malay'], ['th_TH', 'Thai'], ['vi_VN', 'Vietnamese'], ['zh_CN', 'Chinese (Simplified)'], ['zh_TW', 'Chinese (Traditional)'], ['ja_JP', 'Japanese'], ['ko_KR', 'Korean'], ['sw_KE', 'Swahili'], ['he_IL', 'Hebrew']];
  LOCALES.forEach(function (l) { var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1] + (l[0] ? ' – ' + l[0] : ''); $('mtLocale').appendChild(o); });
  var cv = document.createElement('canvas').getContext('2d');
  function px(text, font) { cv.font = font; return cv.measureText(text).width; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function v(id) { return $(id).value.trim(); }
  function absUrl(u) { return /^https?:\/\/[^\s/$.?#][^\s]*$/i.test(u); }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function count(id, n, lo, hi, extra) {
    var el = $(id); el.textContent = n + ' characters' + (extra || '');
    el.className = 'mt-cnt ' + (!n ? '' : n < lo ? 'warn' : n > hi ? 'bad' : 'good');
  }
  var imgState = { url: '', w: 0, h: 0, err: false };
  function checkImage(u) {
    if (u === imgState.url) return;
    imgState = { url: u, w: 0, h: 0, err: false };
    if (!absUrl(u)) return;
    var im = new Image(); im.referrerPolicy = 'no-referrer';
    im.onload = function () { if (imgState.url === u) { imgState.w = im.naturalWidth; imgState.h = im.naturalHeight; render(); } };
    im.onerror = function () { if (imgState.url === u) { imgState.err = true; render(); } };
    im.src = u;
  }
  function setImg(el, u) {
    if (absUrl(u) && !imgState.err) { el.style.backgroundImage = 'url("' + u.replace(/["\\\n]/g, encodeURIComponent) + '")'; el.textContent = ''; }
    else { el.style.backgroundImage = ''; el.textContent = u ? (imgState.err ? 'Image could not be loaded' : 'Use a full https:// link') : 'No image'; }
  }
  function render() {
    var title = v('mtTitle'), desc = v('mtDesc').replace(/\s+/g, ' '), url = v('mtUrl'), site = v('mtSite'), img = v('mtImg'), alt = v('mtAlt');
    var tw = v('mtTw').replace(/^https?:\/\/(www\.)?(twitter|x)\.com\//i, '').replace(/^@?/, '@').replace(/^@$/, '');
    var tpx = Math.round(px(title, '20px Arial')), dlen = desc.length;
    count('mtTitleN', title.length, 30, 60, title ? ' · ' + tpx + ' px' : '');
    count('mtDescN', dlen, 70, 160);
    checkImage(img);
    // ---------- previews ----------
    var h = host(url) || 'example.com';
    $('pvIc').textContent = (site || h).charAt(0).toUpperCase();
    $('pvGSite').textContent = site || h;
    var path = ''; try { path = url ? new URL(url).pathname.split('/').filter(Boolean).map(decodeURIComponent).join(' › ') : ''; } catch (e) {}
    $('pvGUrl').textContent = 'https://' + h + (path ? ' › ' + path : '');
    $('pvGT').textContent = title || 'Your page title';
    $('pvGD').textContent = desc ? (dlen > 160 ? desc.slice(0, 157).replace(/\s+\S*$/, '') + ' …' : desc) : 'Your description appears here. Without one, Google picks some text from the page.';
    $('pvFU').textContent = h.toUpperCase(); $('pvFT').textContent = title || 'Your page title'; $('pvFD').textContent = desc;
    $('pvXU').textContent = h; $('pvXT').textContent = title || 'Your page title'; $('pvXD').textContent = desc;
    $('pvX').classList.toggle('small', $('mtCard').value === 'summary');
    setImg($('pvFI'), img); setImg($('pvXI'), img);
    // ---------- checks ----------
    var tips = [];
    var add = function (cls, t) { tips.push([cls, t]); };
    if (!title) add('bad', 'Add a page title. It is the blue link in search results.');
    else if (tpx > 600 || title.length > 60) add('bad', 'The title is ' + title.length + ' characters (' + tpx + ' px). Google usually cuts titles at about 600 px (50–60 characters).');
    else if (title.length < 30) add('', 'The title is short. 30–60 characters gives people and search engines more to go on.');
    else add('good', 'Title length is good.');
    if (!desc) add('bad', 'Add a description. Without one, search engines and social apps pick text from the page.');
    else if (dlen > 160) add('bad', 'The description is ' + dlen + ' characters. Around 160 is shown; the rest is cut off.');
    else if (dlen < 70) add('', 'The description is short. 70–160 characters works best.');
    else add('good', 'Description length is good.');
    if (url && !absUrl(url)) add('bad', 'The page URL should be a full link starting with https://.');
    if (!url) add('', 'Add the page URL so links and the canonical tag point to the right page.');
    if (img && !absUrl(img)) add('bad', 'The image needs a full link starting with https:// or social apps cannot show it.');
    else if (img && imgState.err) add('bad', 'The image could not be loaded from that link. Check that it is public.');
    else if (img && imgState.w) {
      if (imgState.w < 600) add('bad', 'The image is ' + imgState.w + ' × ' + imgState.h + ' px. Use at least 1200 × 630 px for a sharp large preview.');
      else add('good', 'Image size ' + imgState.w + ' × ' + imgState.h + ' px' + (Math.abs(imgState.w / imgState.h - 1.91) > 0.25 && $('mtCard').value !== 'summary' ? ' (it will be cropped; 1.91:1, like 1200 × 630, fits best).' : ' looks good.'));
    } else if (!img) add('', 'Add a share image (1200 × 630 px) so links stand out on social media.');
    if (img && !alt) add('', 'Describe the image in Image description to help people using screen readers.');
    if (!$('mtIndex').checked) add('bad', 'Search engines are told NOT to show this page (noindex). Untick only for private or duplicate pages.');
    $('mtTips').textContent = '';
    tips.forEach(function (t) { var li = document.createElement('li'); li.className = t[0]; li.textContent = t[1]; $('mtTips').appendChild(li); });
    // ---------- code ----------
    var L = [];
    if ($('mtBasic').checked) { L.push('<meta charset="utf-8">'); L.push('<meta name="viewport" content="width=device-width, initial-scale=1">'); }
    if (title) L.push('<title>' + esc(title) + '</title>');
    if (desc) L.push('<meta name="description" content="' + esc(desc) + '">');
    var robots = [$('mtIndex').checked ? 'index' : 'noindex', $('mtFollow').checked ? 'follow' : 'nofollow'];
    if (robots.join() !== 'index,follow') L.push('<meta name="robots" content="' + robots.join(', ') + '">');
    if (v('mtAuthor')) L.push('<meta name="author" content="' + esc(v('mtAuthor')) + '">');
    if ($('mtCanon').checked && absUrl(url)) L.push('<link rel="canonical" href="' + esc(url) + '">');
    if ($('mtTheme').checked) L.push('<meta name="theme-color" content="' + esc($('mtColor').value) + '">');
    L.push('');
    L.push('<!-- Open Graph: Facebook, LinkedIn, WhatsApp and others -->');
    L.push('<meta property="og:type" content="' + esc($('mtType').value) + '">');
    if (title) L.push('<meta property="og:title" content="' + esc(title) + '">');
    if (desc) L.push('<meta property="og:description" content="' + esc(desc) + '">');
    if (absUrl(url)) L.push('<meta property="og:url" content="' + esc(url) + '">');
    if (site) L.push('<meta property="og:site_name" content="' + esc(site) + '">');
    if ($('mtLocale').value) L.push('<meta property="og:locale" content="' + esc($('mtLocale').value) + '">');
    if (img) {
      L.push('<meta property="og:image" content="' + esc(img) + '">');
      if (imgState.w) { L.push('<meta property="og:image:width" content="' + imgState.w + '">'); L.push('<meta property="og:image:height" content="' + imgState.h + '">'); }
      if (alt) L.push('<meta property="og:image:alt" content="' + esc(alt) + '">');
    }
    L.push('');
    L.push('<!-- X (Twitter) -->');
    L.push('<meta name="twitter:card" content="' + $('mtCard').value + '">');
    if (tw) L.push('<meta name="twitter:site" content="' + esc(tw) + '">');
    if (title) L.push('<meta name="twitter:title" content="' + esc(title) + '">');
    if (desc) L.push('<meta name="twitter:description" content="' + esc(desc) + '">');
    if (img) { L.push('<meta name="twitter:image" content="' + esc(img) + '">'); if (alt) L.push('<meta name="twitter:image:alt" content="' + esc(alt) + '">'); }
    $('mtCode').value = L.join('\n');
  }
  var deb;
  function schedule() { clearTimeout(deb); deb = setTimeout(render, 80); }
  document.querySelectorAll('.card input, .card textarea:not([readonly]), .card select').forEach(function (el) { el.addEventListener('input', schedule); el.addEventListener('change', schedule); });
  $('mtCp').addEventListener('click', function () { copyText($('mtCode').value, $('mtCp')); });
  $('mtDl').addEventListener('click', function () {
    var page = '<!doctype html>\n<html' + ($('mtLocale').value ? ' lang="' + $('mtLocale').value.split('_')[0] + '"' : '') + '>\n<head>\n' + $('mtCode').value.split('\n').map(function (l) { return l ? '  ' + l : ''; }).join('\n') + '\n</head>\n<body>\n</body>\n</html>\n';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([page], { type: 'text/html;charset=utf-8' })); a.download = 'meta-tags.html'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });
  $('mtReset').addEventListener('click', function () {
    ['mtTitle', 'mtDesc', 'mtUrl', 'mtSite', 'mtImg', 'mtAlt', 'mtTw', 'mtAuthor'].forEach(function (id) { $(id).value = ''; $(id).dispatchEvent(new Event('input', { bubbles: true })); });
    render(); $('mtTitle').focus();
  });
  render();
})();
</script>
