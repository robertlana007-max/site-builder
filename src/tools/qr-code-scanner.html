<style>
.qs-cam { position: relative; margin: 0 auto 16px; max-width: 520px; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
.qs-cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.qs-cam::after { content: ''; position: absolute; inset: 15%; border: 3px solid rgba(255, 255, 255, .85); border-radius: 16px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .25); pointer-events: none; }
.qs-res { margin-top: 16px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 14px; }
.qs-res h3 { margin: 0 0 8px; font-size: 15px; }
.qs-text { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; margin: 0; }
.qs-kv { display: grid; grid-template-columns: minmax(80px, max-content) minmax(0, 1fr); gap: 6px 12px; margin: 10px 0 0; font-size: 15px; }
.qs-kv dt { color: var(--muted); font-weight: 600; font-size: 13px; padding-top: 2px; }
.qs-kv dd { margin: 0; overflow-wrap: anywhere; }
.qs-url { margin-top: 10px; font-size: 14px; overflow-wrap: anywhere; }
.qs-url b { color: var(--ink); }
.qs-warn { color: var(--bad); font-weight: 600; }
.qs-hist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.qs-hist li { display: flex; gap: 6px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 5px; padding-inline-start: 12px; }
.qs-hist li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.qs-hist li small { color: var(--muted); font-size: 12px; flex: none; }
.qs-hist button { font: inherit; font-size: 13px; height: 34px; padding: 0 10px; flex: none; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.qs-hist button:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 480px) { .qs-hist li small { display: none; } }
</style>
<div class="btns" style="margin:0 0 14px">
  <button class="btn" id="qsStart">Scan with camera</button>
  <button class="btn ghost" id="qsStop" hidden>Stop camera</button>
  <button class="btn ghost" id="qsTorch" hidden aria-pressed="false">Flashlight</button>
  <select id="qsCams" hidden aria-label="Camera" style="width:auto;max-width:100%" data-nomemo></select>
</div>
<div class="qs-cam" id="qsCamBox" hidden><video id="qsVideo" playsinline muted></video></div>
<div class="drop" id="qsDrop" tabindex="0" role="button"><b>Or click, drop or paste an image of a QR code</b>Screenshots and photos work. Your image never leaves your device.</div>
<input type="file" id="qsFile" accept="image/*" hidden data-nomemo>
<p class="msg" id="qsMsg"></p>
<div class="qs-res" id="qsRes" hidden>
  <h3 id="qsType">Text</h3>
  <pre class="qs-text" id="qsText"></pre>
  <dl class="qs-kv" id="qsKv" hidden></dl>
  <p class="qs-url" id="qsUrl" hidden></p>
  <div class="btns" id="qsActs"></div>
</div>
<div id="qsHistBox" hidden style="margin-top:22px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>Scan history</b><button class="btn ghost" id="qsClear" style="min-height:36px;padding:5px 12px">Clear history</button></div>
  <p class="msg" style="margin:4px 0 0;font-size:13px">Saved only in this browser on this device.</p>
  <ul class="qs-hist" id="qsHist"></ul>
</div>
<canvas id="qsCv" hidden></canvas>
<script>
(function () {

        }

      });
    });
  }
  // Quick decode for one camera frame.
  function decodeFrame(v) {

  function parse(text) {

    if (/^WIFI:/i.test(t)) {
      var f = fields(t.slice(5)), sec = (f.T || [''])[0];
      return { type: 'Wi-Fi network', kv: [['Network (SSID)', (f.S || [''])[0]], ['Password', sec.toLowerCase() === 'nopass' ? '(none)' : (f.P || [''])[0]], ['Security', sec ? (sec.toLowerCase() === 'nopass' ? 'Open (no password)' : sec) : 'Not given'], ['Hidden network', /^true$/i.test((f.H || [''])[0]) ? 'Yes' : 'No']], copyPass: (f.P || [''])[0] };

  }
  function safeDec(s) { try { return decodeURIComponent(s.replace(/\+/g, ' ')); } catch (e) { return s; } }

  function link(label, href, ghost) { var a = document.createElement('a'); a.className = 'btn' + (ghost ? ' ghost' : ''); a.textContent = label; a.href = href; return a; }

  function show(text, from) {

  // ---------- images ----------

  }
  function loop() {
    if (!wantRunning || !stream) return;
    var v = $('qsVideo');
    if (busy || v.readyState < 2) { loopTimer = setTimeout(loop, 150); return; }
    busy = true;
    decodeFrame(v).then(function (t) {
      busy = false;
      if (!wantRunning) return;
      if (t != null && t !== '') { stopCam(true); say('ok', 'QR code found. Press Scan with camera to scan another.'); show(t, 'camera'); return; }
      loopTimer = setTimeout(loop, 120);
    }, function () { busy = false; loopTimer = setTimeout(loop, 300); });
  }
  $('qsStart').addEventListener('click', function () { startCam(); });
  $('qsStop').addEventListener('click', function () { stopCam(); });
  $('qsCams').addEventListener('change', function () { startCam($('qsCams').value); });
  $('qsTorch').addEventListener('click', function () {
    if (!track) return;
    var on = !torchOn;
    track.applyConstraints({ advanced: [{ torch: on }] }).then(function () { torchOn = on; $('qsTorch').setAttribute('aria-pressed', String(on)); }, function () { say('bad', 'The flashlight could not be switched on with this camera.'); });
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && stream) { stopCam(true); say('', 'Camera paused while the page was hidden. Press Scan with camera to continue.'); } });
  window.addEventListener('pagehide', function () { if (stream) stopCam(true); });
  drawHist();
})();
</script>
