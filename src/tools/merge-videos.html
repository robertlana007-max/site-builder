<style>
.vt-info { margin: -4px 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.vt-info b { color: var(--ink); }
.vt-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 14px; }
.vt-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s; }
.vt-video { display: block; width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 14px 0 4px; }
.vt-hint { font-size: 14px; color: var(--muted); margin: -8px 0 14px; }
</style>
<style>
.mg-list { grid-template-columns: minmax(0, 1fr); }
.mg-list li { min-width: 0; }
.mg-list li span small { color: var(--muted); margin-inline-start: 4px; }
.mg-list li.mg-bad span { color: var(--bad); }
.mg-total { font-size: 15px; margin: -6px 0 14px; color: var(--muted); }
.mg-total b { color: var(--ink); }
.mg-video { display: block; width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 14px 0 0; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop video clips here</b>Add two or more MP4, MOV, WebM or MKV clips, up to 1 GB in total. Nothing is uploaded.</div>
<input type="file" id="file" accept="video/*,.mkv,.mov,.avi,.m4v,.3gp,.ts,.mts,.wmv,.flv" multiple hidden data-nomemo>
<ul class="files mg-list" id="list"></ul>
<p class="mg-total" id="total" hidden></p>
<div id="opts" hidden>
  <div class="fields">
    <div><label for="size">Video size</label><select id="size"><option value="first">Same as the first clip</option><option value="1920x1080">1080p landscape (1920 × 1080)</option><option value="1280x720">720p landscape (1280 × 720)</option><option value="854x480">480p landscape (854 × 480)</option><option value="1080x1920">Portrait for phones (1080 × 1920)</option><option value="720x1280">Portrait, smaller (720 × 1280)</option><option value="1080x1080">Square (1080 × 1080)</option></select></div>
    <div><label for="fit">When a clip has a different shape</label><select id="fit"><option value="pad">Fit it with black bars</option><option value="crop">Fill the frame (cut the edges)</option></select></div>
    <div><label for="q">Quality</label><select id="q"><option value="18">High (bigger file)</option><option value="22" selected>Good (recommended)</option><option value="27">Smaller file</option></select></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="fast"> <span id="fastLabel">Fast join without re-encoding</span></label></div>
  <p class="vt-hint" id="hint"></p>
</div>
<div class="vt-bar" id="bar" hidden><i id="barFill"></i></div>
<div class="btns"><button class="btn" id="go" disabled>Merge videos</button><button class="btn ghost" id="stop" type="button" hidden>Cancel</button><a class="btn ghost" id="dl" hidden>Download merged video</a></div>
<p class="msg" id="msg"></p>
<video class="mg-video" id="result" controls playsinline hidden></video>
<script>
// Video engine loader (ffmpeg.wasm, single-thread build, no special server headers needed).
// The same copy is used by every video tool. Nothing is downloaded until a video is chosen.

        var paths = inps.map(function (i) { return i.path; });

        });

        return Promise.all(inps.map(function (i) { return unmountIn(f, i); })).then(function () { return code; });
      }).then(function (code) {
        onLog = null;

})();

  function base(name) { return name.replace(/\.[^.]+$/, '') || 'video'; }

    el.appendChild(document.createTextNode(' · ' + fmtBytes(file.size) + ' · ' + clock(i.duration) + ' · ' + i.width + ' × ' + i.height + (i.audio ? ' · with sound' : ' · no sound')));

      }, function (e) { busy = false; if (mine === ticket) say('bad', e.message); });
    });

})();

  drop.addEventListener('click', function () { $('file').click(); });
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
  $('file').addEventListener('change', function () { take($('file').files); });
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { take(e.dataTransfer.files); });

  $('stop').addEventListener('click', function () { if (!busy) return; cancelled = true; FF.cancel(); });
  $('go').addEventListener('click', function () {
    var good = ok();
    if (busy || good.length < 2) return;
    busy = true; cancelled = false; render(true);
    $('go').disabled = true; $('stop').hidden = false; VT.bar(0); $('result').hidden = true;
    var fast = $('fast').checked && sameKind(good), s = size(), crf = $('q').value, fit = $('fit').value;
    var files = good.map(function (c) { return c.file; }), total = good.reduce(function (a, c) { return a + c.info.duration; }, 0);
    var anyAudio = good.some(function (c) { return c.info.audio; });
    var fps = Math.min(60, Math.round(good[0].info.fps) || 30) || 30;
    var e = fast ? ext(files[0]) : 'mp4';
    var started = Date.now();
    say('', fast ? 'Joining…' : 'Merging…');
    FF.run(files, function (paths) {
      if (fast) return ['-f', 'concat', '-safe', '0', '-i', '/merge-list.txt', '-map', '0', '-c', 'copy'].concat(/^(mp4|m4v|mov)$/.test(e) ? ['-movflags', '+faststart'] : []);
      var a = [], g = [], cat = '';
      paths.forEach(function (p) { a.push('-i', p); });
      good.forEach(function (c, i) {
        var shape = fit === 'pad'
          ? 'scale=' + s.w + ':' + s.h + ':force_original_aspect_ratio=decrease,pad=' + s.w + ':' + s.h + ':(ow-iw)/2:(oh-ih)/2'
          : 'scale=' + s.w + ':' + s.h + ':force_original_aspect_ratio=increase,crop=' + s.w + ':' + s.h;
        g.push('[' + i + ':v:0]' + shape + ',setsar=1,fps=' + fps + ',format=yuv420p,setpts=PTS-STARTPTS[v' + i + ']');
        if (anyAudio) {
          var d = c.info.duration.toFixed(3);
          g.push(c.info.audio ? '[' + i + ':a:0]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo,asetpts=PTS-STARTPTS,apad,atrim=0:' + d + '[a' + i + ']'
            : 'anullsrc=r=44100:cl=stereo,atrim=0:' + d + '[a' + i + ']');
        }
        cat += '[v' + i + ']' + (anyAudio ? '[a' + i + ']' : '');
      });
      g.push(cat + 'concat=n=' + good.length + ':v=1:a=' + (anyAudio ? 1 : 0) + '[v]' + (anyAudio ? '[a]' : ''));
      a.push('-filter_complex', g.join(';'), '-map', '[v]');
      if (anyAudio) a.push('-map', '[a]', '-c:a', 'aac', '-b:a', '160k');
      a.push('-c:v', 'libx264', '-preset', 'veryfast', '-crf', crf, '-movflags', '+faststart');
      return a;
    }, 'merged.' + e, total, function (p) {
      VT.bar(p);
      if (!/Downloading|Loading|Starting/.test($('msg').textContent)) say('', (fast ? 'Joining… ' : 'Merging… ') + Math.round(p * 100) + '% · ' + VT.clock((Date.now() - started) / 1000).replace(/\.\d$/, ''));
    }, say, fast ? function (f, paths) {
      return f.writeFile('/merge-list.txt', new TextEncoder().encode(paths.map(function (p) { return "file '" + p + "'"; }).join('\n') + '\n'));
    } : null).then(function (data) {
      var mime = { mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm', mkv: 'video/x-matroska' }[e] || 'video/' + e;
      var u = VT.done(data, VT.base(files[0].name) + '-merged.' + e, mime);
      if (outUrl !== u) { outUrl = u; $('result').src = u; $('result').hidden = false; }
      say('ok', 'Merged ' + good.length + ' clips: ' + VT.clock(total) + ', ' + fmtBytes(data.length) + ' · took ' + VT.clock((Date.now() - started) / 1000).replace(/\.\d$/, ''));
    }, function (err) {
      VT.bar(null);
      if (cancelled || err.message === 'cancelled') say('', 'Cancelled. Change the clips or settings and try again whenever you like.');
      else say('bad', err.message + (fast ? ' Untick "Fast join" and try again.' : ''));
    }).then(function () { busy = false; $('stop').hidden = true; render(true); });
  });
})();
</script>
