<style>
.dsc-add { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.dsc-add .btn { min-height: 56px; font-size: 16px; }
.dsc-cam { margin: 0 0 16px; text-align: center; }
.dsc-cam video { width: 100%; max-height: 60vh; background: #000; border-radius: 10px; display: block; }
.dsc-ed { position: relative; text-align: center; line-height: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.dsc-ed canvas { max-width: 100%; height: auto; touch-action: none; cursor: grab; }
.dsc-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.dsc-bar .btn { min-height: 40px; padding: 6px 14px; }
.dsc-pages { list-style: none; padding: 0; margin: 16px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.dsc-pages li { background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; font-size: 13px; color: var(--muted); }
.dsc-pages li.cur { border-color: var(--accent); }
.dsc-pages img { width: 100%; height: 130px; object-fit: contain; background: #fff; border-radius: 6px; display: block; margin-bottom: 4px; cursor: pointer; }
.dsc-pages .row { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
.dsc-pages button { font: inherit; width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; padding: 0; }
.dsc-pages button[disabled] { opacity: .35; cursor: default; }
.dsc-h { font-size: 16px; margin: 22px 0 10px; }
</style>
<div class="dsc-add">
  <button class="btn" id="shoot" type="button">📷 Take a photo</button>
  <button class="btn ghost" id="pick" type="button">Upload photos</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden data-nomemo>
<div class="drop" id="drop" tabindex="0" role="button"><b>…or drop photos of your pages here</b>JPG, PNG or WebP. Pages are found and straightened on your device; nothing is uploaded.</div>
<input type="file" id="file" accept="image/*" multiple hidden data-nomemo>
<div class="dsc-cam" id="camBox" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="btns" style="justify-content:center"><button class="btn" id="snap" type="button">Capture page</button><button class="btn ghost" id="camOff" type="button">Close camera</button></div>
</div>
<div id="edit" hidden>
  <h3 class="dsc-h" id="edTitle">Page 1</h3>
  <div class="dsc-ed"><canvas id="ed" width="10" height="10" aria-label="Drag the four corners onto the corners of the page"></canvas></div>
  <p class="msg" style="margin-top:6px;font-size:14px">Drag the round handles onto the four corners of the page.</p>
  <div class="dsc-bar">
    <button class="btn ghost" id="auto" type="button">Find edges again</button>
    <button class="btn ghost" id="full" type="button">Use whole photo</button>
    <button class="btn ghost" id="rot" type="button">↻ Turn</button>
  </div>
  <label>Look</label>
  <div class="seg" id="modes" role="group" aria-label="Look"><button type="button" data-v="color" aria-pressed="true">Colour</button><button type="button" data-v="gray" aria-pressed="false">Grey</button><button type="button" data-v="bw" aria-pressed="false">Black &amp; white</button><button type="button" data-v="orig" aria-pressed="false">Original</button></div>
  <div class="preview" style="margin-top:12px"><canvas id="out" width="10" height="10" aria-label="Straightened page" style="max-width:100%;height:auto;background:#fff"></canvas></div>
</div>
<ul class="dsc-pages" id="pages"></ul>
<div id="exp" hidden>
  <h3 class="dsc-h">Save your scan</h3>
  <div class="fields">
    <div><label for="size">PDF page size</label><select id="size"><option value="a4">A4 (210 × 297 mm)</option><option value="letter">Letter (8.5 × 11 in)</option><option value="fit">Same shape as the scan</option></select></div>
    <div><label for="qual">Quality</label><select id="qual"><option value="3508">High (300 dpi)</option><option value="2339" selected>Standard (200 dpi)</option><option value="1754">Smaller file (150 dpi)</option></select></div>
  </div>
  <div class="btns">
    <button class="btn" id="pdf" type="button">Download PDF</button>
    <button class="btn ghost" id="jpg" type="button">Download JPG</button>
    <button class="btn ghost danger" id="clear" type="button">Start again</button>
  </div>
  <div class="notice" id="notice" hidden><div class="meter"><i id="fill"></i></div><p id="stat"></p></div>
</div>
<p class="msg" id="msg"></p>
