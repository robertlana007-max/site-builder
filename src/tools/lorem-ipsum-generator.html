<div class="fields">
  <div><label for="n">How many</label><input type="number" id="n" min="1" max="100" step="1" value="3"></div>
  <div><label for="unit">Of</label><select id="unit"><option value="p">Paragraphs</option><option value="s">Sentences</option><option value="w">Words</option></select></div>
</div>
<div class="checks"><label><input type="checkbox" id="classic" checked>Start with "Lorem ipsum dolor sit amet"</label></div>
<textarea id="out" class="plain" style="min-height:240px" readonly aria-label="Generated text"></textarea>
<div class="btns"><button class="btn" id="gen">Generate</button><button class="btn ghost" id="cp">Copy</button></div>
<script>
(function () {
  var W = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum at vero eos accusamus iusto odio dignissimos ducimus blanditiis praesentium voluptatum deleniti atque corrupti quos dolores quas molestias excepturi similique mollitia animi perspiciatis unde omnis iste natus error voluptatem accusantium doloremque laudantium totam rem aperiam eaque ipsa quae ab illo inventore veritatis quasi architecto beatae vitae dicta explicabo nemo ipsam quia voluptas aspernatur aut odit fugit consequuntur magni ratione sequi nesciunt neque porro quisquam'.split(' ');
  var FIRST = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit';
  function r(n) { return Math.floor(Math.random() * n); }
  function words(n) { var a = []; for (var i = 0; i < n; i++) a.push(W[r(W.length)]); return a; }
  function sentence(first) {
    if (first) return FIRST + '.';
    var a = words(8 + r(10));
    if (a.length > 10) a[3 + r(4)] += ',';
    var s = a.join(' ');
    return s[0].toUpperCase() + s.slice(1) + '.';
  }
  function gen() {
    var n = Math.min(100, Math.max(1, Math.floor(+$('n').value) || 1)), u = $('unit').value, c = $('classic').checked, out;
    if (u === 'w') {
      var a = c ? FIRST.toLowerCase().replace(',', '').split(' ').slice(0, n) : [];
      a = a.concat(words(n - a.length));
      out = a.join(' '); out = out[0].toUpperCase() + out.slice(1) + '.';
    } else if (u === 's') {
      var s = []; for (var i = 0; i < n; i++) s.push(sentence(c && i === 0));
      out = s.join(' ');
    } else {
      var p = [];
      for (var j = 0; j < n; j++) { var q = [], k = 4 + r(4); for (var m = 0; m < k; m++) q.push(sentence(c && j === 0 && m === 0)); p.push(q.join(' ')); }
      out = p.join('\n\n');
    }
    $('out').value = out;
  }
  $('gen').addEventListener('click', gen);
  ['n', 'unit', 'classic'].forEach(function (id) { $(id).addEventListener('input', gen); });
  $('cp').addEventListener('click', function () { copyText($('out').value, $('cp')); });
  gen();
})();
</script>
