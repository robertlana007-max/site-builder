<style>
.ppg fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.ppg legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.ppg .ppg-types { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-bottom: 14px; }
.ppg .ppg-types button { font: inherit; font-size: 14px; font-weight: 600; min-height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 4px 6px; }
.ppg .ppg-types button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ppg .ppg-hint { display: block; font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
.ppg .ppg-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.ppg .ppg-sw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.ppg .ppg-sw button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.ppg .ppg-sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.ppg input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); }
.ppg .ppg-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.ppg .ppg-prev canvas { width: 100%; max-width: 480px; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
.ppg .ppg-prev.land canvas { max-width: 680px; }
</style>
<div class="ppg" id="ppg">
<fieldset><legend>Type of paper</legend>
  <div class="ppg-types" id="ppType" role="group" aria-label="Type of paper"></div>
  <div class="fields">
    <div><label for="ppUnit">Units</label><select id="ppUnit"><option value="mm">Millimetres (mm)</option><option value="in">Inches (in)</option></select></div>
    <div><label for="ppGap" id="ppGapLab">Line spacing</label><input type="number" id="ppGap" data-nomemo min="1" max="60" step="0.1" inputmode="decimal"></div>
    <div id="ppMajorBox"><label for="ppMajor">Bold line every</label><select id="ppMajor"><option value="0">Never</option><option value="2">2 squares</option><option value="4">4 squares</option><option value="5" selected>5 squares</option><option value="10">10 squares</option></select></div>
    <div id="ppIsoBox" hidden><label for="ppIso">Draw as</label><select id="ppIso"><option value="lines">Lines</option><option value="dots">Dots</option></select></div>
  </div>
  <span class="ppg-hint" id="ppGapHint"></span>
</fieldset>
<fieldset><legend>Page</legend>
  <div class="fields">
    <div><label for="ppPaper">Paper size</label><select id="ppPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option><option value="legal">US Legal</option><option value="a5">A5</option><option value="a3">A3</option></select></div>
    <div><label for="ppOrient">Orientation</label><select id="ppOrient"><option value="port">Portrait</option><option value="land">Landscape</option></select></div>
    <div><label for="ppMargin">Margin around the page</label><select id="ppMargin"><option value="0">None (to the edge)</option><option value="5">Small (5 mm)</option><option value="10" selected>Normal (10 mm)</option><option value="15">Wide (15 mm)</option><option value="20">Extra wide (20 mm)</option></select></div>
    <div><label for="ppPages">Number of pages</label><input type="number" id="ppPages" min="1" max="200" step="1" value="1" inputmode="numeric"></div>
  </div>
</fieldset>
<fieldset><legend>Look</legend>
  <div class="ppg-sw" id="ppSw"><input type="color" id="ppColor" value="#9ca3af" aria-label="Custom line colour"></div>
  <div class="fields">
    <div><label for="ppWeight">Line thickness</label><select id="ppWeight"><option value="0.35">Fine</option><option value="0.6" selected>Normal</option><option value="1">Bold</option></select></div>
  </div>
  <label class="ppg-check" id="ppMarginLineBox"><input type="checkbox" id="ppMarginLine" checked>Red margin line on the left</label>
  <label class="ppg-check"><input type="checkbox" id="ppHeader">Name and Date at the top</label>
  <div class="fields"><div><label for="ppTitle">Title at the top (optional)</label><input type="text" id="ppTitle" data-nomemo maxlength="80" placeholder="e.g. Science notes"></div></div>
</fieldset>
<div class="ppg-prev" id="ppPrevBox"><canvas id="ppCanvas" width="595" height="842" aria-label="Paper preview"></canvas></div>
<div class="btns">
  <button type="button" class="btn" id="ppPdf">Download PDF</button>
  <button type="button" class="btn ghost" id="ppPng">Save as PNG</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

    graph: ['Graph (grid)', 'Square size', 5, 0.25, 'Common sizes are 5 mm and 1/4 in. Use 1 mm for engineering paper or 10 mm for big squares.'],
    dot: ['Dot grid', 'Dot spacing', 5, 0.2, '5 mm is the usual spacing for bullet journals.'],
    iso: ['Isometric', 'Triangle size', 5, 0.25, 'Used for 3D drawings, game maps and design sketches.'],
    music: ['Music staff', 'Staff line gap', 2, 0.08, 'The gap between the 5 lines of each staff. 2 mm makes an 8 mm staff, like most printed music.'],
    hand: ['Handwriting', 'Writing line height', 15, 0.625, 'The height from the top line to the baseline. Use 18 to 25 mm for young children.'],
    cornell: ['Cornell notes', 'Line spacing', 7.1, 0.28125, 'A cue column on the left and a summary box at the bottom, for study notes.']
  };
  var COLORS = ['#9ca3af', '#93c5fd', '#2563eb', '#86efac', '#fca5a5', '#111827'];
  var type = 'lined', color = COLORS[0], busy = false, ready = false;
  function say(c, t) { var m = $('msg'); m.className = 'msg ' + (c || ''); m.textContent = t || ''; }
  Object.keys(TYPES).forEach(function (k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = TYPES[k][0]; b.dataset.k = k; b.setAttribute('aria-pressed', k === type); b.addEventListener('click', function () { setType(k, true); }); $('ppType').appendChild(b); });
  COLORS.forEach(function (c) { var b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.dataset.c = c; b.setAttribute('aria-label', 'Line colour ' + c); b.setAttribute('aria-pressed', c === color); b.addEventListener('click', function () { setColor(c); }); $('ppSw').insertBefore(b, $('ppColor')); });
  function setColor(c) { color = c; [].forEach.call($('ppSw').querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', b.dataset.c === c); }); paint(); }
  function unit() { return $('ppUnit').value; }
  function setType(k, resetGap) {
    type = k;
    [].forEach.call($('ppType').querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', b.dataset.k === k); });
    $('ppGapLab').textContent = TYPES[k][1] + ' (' + unit() + ')';
    $('ppGapHint').textContent = TYPES[k][4];
    if (resetGap) $('ppGap').value = unit() === 'mm' ? TYPES[k][2] : TYPES[k][3];
    $('ppMajorBox').hidden = k !== 'graph';
    $('ppIsoBox').hidden = k !== 'iso';
    $('ppMarginLineBox').hidden = k !== 'lined';
    paint();
  }
  $('ppPaper').value = UT.letter() ? 'letter' : 'a4';
  if (UT.letter()) $('ppUnit').value = 'in';

  function pageSize() { var p = { a4: [595.28, 841.89], letter: [612, 792], legal: [612, 1008], a5: [419.53, 595.28], a3: [841.89, 1190.55] }[$('ppPaper').value]; return $('ppOrient').value === 'land' ? [p[1], p[0]] : p; }
  function gapPt() { var v = parseFloat(String($('ppGap').value).replace(',', '.')); if (!isFinite(v) || v <= 0) return null; return unit() === 'mm' ? v * MM : v * 72; }
  // the part of an endless line (through px,py with direction dx,dy) that lies inside the box
  function clip(px, py, dx, dy, b) {
    var t0 = -1e9, t1 = 1e9;
    [[dx, b.x - px, b.x + b.w - px], [dy, b.y - py, b.y + b.h - py]].forEach(function (a) {
      if (Math.abs(a[0]) < 1e-9) { if (a[1] > 0 || a[2] < 0) { t0 = 1; t1 = 0; } return; }
      var u = a[1] / a[0], v = a[2] / a[0]; if (u > v) { var s = u; u = v; v = s; } t0 = Math.max(t0, u); t1 = Math.min(t1, v);
    });
    return t1 > t0 ? [px + dx * t0, py + dy * t0, px + dx * t1, py + dy * t1] : null;
  }
  function pageOps() {
    var P = pageSize(), W = P[0], H = P[1], g = gapPt(), lw = +$('ppWeight').value, m = +$('ppMargin').value * MM, ops = [{ k: 'rect', x: 0, y: 0, w: W, h: H, fill: '#ffffff' }];
    var top = m, title = $('ppTitle').value.trim();
    if (title || $('ppHeader').checked) top = Math.max(m, 12 * MM);
    if (title) { var ts = GD.fit(title, 'sansb', 16, W - 2 * Math.max(m, 24), 8); ops.push({ k: 'text', t: title, x: Math.max(m, 24), y: top + ts * 0.2, font: 'sansb', s: ts, fill: '#374151' }); top += ts + 8; }
    if ($('ppHeader').checked) {
      var hx = Math.max(m, 24), hy = top + 12;
      ops.push({ k: 'text', t: 'Name', x: hx, y: hy, font: 'sans', s: 10, fill: '#4b5563' }, { k: 'line', x1: hx + 32, y1: hy + 2, x2: W * 0.6, y2: hy + 2, stroke: '#9ca3af', lw: 0.7 });
      ops.push({ k: 'text', t: 'Date', x: W * 0.64, y: hy, font: 'sans', s: 10, fill: '#4b5563' }, { k: 'line', x1: W * 0.64 + 28, y1: hy + 2, x2: W - hx, y2: hy + 2, stroke: '#9ca3af', lw: 0.7 });
      top = hy + 14;
    }
    var box = { x: m, y: top, w: W - 2 * m, h: H - top - m };
    function line(x1, y1, x2, y2, o) { ops.push({ k: 'line', x1: x1, y1: y1, x2: x2, y2: y2, stroke: (o && o.c) || color, lw: (o && o.w) || lw, dash: o && o.dash }); }
    if (type === 'lined' || type === 'cornell') {
      var y0 = box.y + (type === 'cornell' ? g * 1.5 : g), bottom = type === 'cornell' ? box.y + box.h - Math.min(2 * 72, box.h * 0.22) : box.y + box.h;
      if (type === 'cornell') {
        var cueX = box.x + Math.min(2.5 * 72, box.w * 0.3);
        line(box.x, bottom, box.x + box.w, bottom, { w: lw * 2.2 });
        line(cueX, box.y, cueX, bottom, { w: lw * 2.2 });
        ops.push({ k: 'text', t: 'Cues', x: box.x + 6, y: box.y + 11, font: 'sansb', s: 9, fill: '#9ca3af' }, { k: 'text', t: 'Notes', x: cueX + 6, y: box.y + 11, font: 'sansb', s: 9, fill: '#9ca3af' }, { k: 'text', t: 'Summary', x: box.x + 6, y: bottom + 13, font: 'sansb', s: 9, fill: '#9ca3af' });
        for (var yc = y0; yc <= bottom - g * 0.5; yc += g) line(cueX, yc, box.x + box.w, yc);
      } else {
        for (var y = y0; y <= bottom + 0.01; y += g) line(box.x, y, box.x + box.w, y);
        if ($('ppMarginLine').checked) { var mx = box.x + Math.min(box.w * 0.15, 25 * MM); line(mx, box.y, mx, box.y + box.h, { c: '#ef4444', w: Math.max(0.5, lw) }); }
      }
    } else if (type === 'graph') {
      var major = +$('ppMajor').value, nx = Math.floor(box.w / g + 1e-6), ny = Math.floor(box.h / g + 1e-6), gx = box.x + (box.w - nx * g) / 2, gy = box.y + (box.h - ny * g) / 2;
      for (var i = 0; i <= nx; i++) { var mj = major && i % major === 0; line(gx + i * g, gy, gx + i * g, gy + ny * g, { w: mj ? lw * 2 : lw, c: mj ? color : undefined }); }
      for (var j = 0; j <= ny; j++) { var mj2 = major && j % major === 0; line(gx, gy + j * g, gx + nx * g, gy + j * g, { w: mj2 ? lw * 2 : lw }); }
    } else if (type === 'dot') {
      var dx = Math.floor(box.w / g + 1e-6), dy = Math.floor(box.h / g + 1e-6), ox = box.x + (box.w - dx * g) / 2, oy = box.y + (box.h - dy * g) / 2, r = Math.max(0.45, lw * 0.95);
      var dots = { k: 'dots', pts: [], r: r, fill: color }; ops.push(dots);
      for (var a = 0; a <= dx; a++) for (var b = 0; b <= dy; b++) dots.pts.push(ox + a * g, oy + b * g);
    } else if (type === 'iso') {
      var hstep = g * Math.sqrt(3) / 2, cols = Math.floor(box.w / hstep + 1e-6), ix = box.x + (box.w - cols * hstep) / 2;
      if ($('ppIso').value === 'dots') {
        var idots = { k: 'dots', pts: [], r: Math.max(0.45, lw * 0.95), fill: color }; ops.push(idots);
        for (var c = 0; c <= cols; c++) for (var yy = box.y + (c % 2 ? g / 2 : 0); yy <= box.y + box.h + 0.01; yy += g) idots.pts.push(ix + c * hstep, yy);
      } else {
        var ib = { x: ix, y: box.y, w: cols * hstep, h: box.h };
        for (var c2 = 0; c2 <= cols; c2++) line(ix + c2 * hstep, box.y, ix + c2 * hstep, box.y + box.h);
        var s30 = Math.tan(Math.PI / 6), span = ib.h + ib.w * s30;
        for (var k = -Math.ceil(ib.w * s30 / g) - 1; k * g <= span + g; k++) {
          var p1 = clip(ix, box.y + k * g, 1, s30, ib), p2 = clip(ix, box.y + ib.h - k * g, 1, -s30, ib);
          if (p1) line(p1[0], p1[1], p1[2], p1[3]);
          if (p2) line(p2[0], p2[1], p2[2], p2[3]);
        }
      }
    } else if (type === 'music') {
      var staff = g * 4, between = Math.max(staff * 1.2, 9 * MM), n = Math.floor((box.h + between) / (staff + between) + 1e-6), sy = box.y + (box.h - (n * staff + (n - 1) * between)) / 2;
      for (var s = 0; s < n; s++) for (var l = 0; l < 5; l++) line(box.x, sy + s * (staff + between) + l * g, box.x + box.w, sy + s * (staff + between) + l * g, { w: Math.max(lw, 0.5) });
    } else if (type === 'hand') {
      var row = g, step = g * 1.5, nr = Math.floor((box.h - row * 0.5) / step + 1e-6) + (box.h >= row ? 1 : 0), hy0 = box.y + 4;
      for (var q = 0; q < nr; q++) {
        var ty = hy0 + q * step; if (ty + row > box.y + box.h + 0.01) break;
        line(box.x, ty, box.x + box.w, ty, { c: '#60a5fa' });
        line(box.x, ty + row / 2, box.x + box.w, ty + row / 2, { c: '#93c5fd', dash: [3, 3] });
        line(box.x, ty + row, box.x + box.w, ty + row, { c: '#ef4444', w: lw * 1.4 });
        if (ty + row * 1.5 <= box.y + box.h + 0.01) line(box.x, ty + row * 1.5, box.x + box.w, ty + row * 1.5, { c: '#d1d5db', dash: [1, 3] });
      }
    }
    return { ops: ops, W: W, H: H };
  }
  function check() {
    var g = gapPt(), P = pageSize(), n = +$('ppPages').value;
    if (!g) { say('bad', 'Type a spacing bigger than 0, for example ' + (unit() === 'mm' ? TYPES[type][2] + ' mm.' : TYPES[type][3] + ' in.')); return false; }
    if (g < 1 * MM) { say('bad', 'The spacing must be at least 1 mm (0.04 in), or the lines would print as solid grey.'); return false; }
    if (g > Math.min(P[0], P[1]) / 3) { say('bad', 'That spacing is too big for this paper. Try a smaller number.'); return false; }
    if (!(n >= 1 && n <= 200 && n === Math.floor(n))) { say('bad', 'Choose between 1 and 200 pages.'); return false; }
    return true;
  }
  function paint() {
    if (!ready) return;
    $('ppGapLab').textContent = TYPES[type][1] + ' (' + unit() + ')';
    if (!check()) return;
    say('', '');
    var pg = pageOps(), cv = $('ppCanvas'), sc = 1.5;
    cv.width = Math.round(pg.W * sc); cv.height = Math.round(pg.H * sc);
    $('ppPrevBox').classList.toggle('land', pg.W > pg.H);
    GD.drawCanvas(pg.ops, cv.getContext('2d'), sc);
    dotsCanvas(pg.ops, cv.getContext('2d'), sc);
  }
  // thousands of dots are drawn as one shape (one circle per dot made big pages freeze and PDFs of many MB)
  function dotsCanvas(ops, ctx, sc) {
    ops.forEach(function (o) {
      if (o.k !== 'dots') return;
      ctx.fillStyle = o.fill; ctx.beginPath();
      for (var i = 0; i < o.pts.length; i += 2) { ctx.moveTo((o.pts[i] + o.r) * sc, o.pts[i + 1] * sc); ctx.arc(o.pts[i] * sc, o.pts[i + 1] * sc, o.r * sc, 0, Math.PI * 2); }
      ctx.fill();
    });
  }
  // in the PDF each dot is a very short line with round ends, all in one compressed drawing
  function dotsPdf(doc, page, ops) {
    var H = page.getHeight(), parts = [];
    ops.forEach(function (o) {
      if (o.k !== 'dots') return;
      var c = GD.rgb(o.fill), s = ['q', c.map(function (v) { return v.toFixed(3); }).join(' ') + ' RG', (o.r * 2).toFixed(3) + ' w', '1 J'];
      for (var i = 0; i < o.pts.length; i += 2) { var x = o.pts[i], y = H - o.pts[i + 1]; s.push(x.toFixed(2) + ' ' + y.toFixed(2) + ' m ' + (x + 0.01).toFixed(2) + ' ' + y.toFixed(2) + ' l'); }
      s.push('S', 'Q'); parts.push(s.join('\n'));
    });
    if (parts.length) page.node.addContentStream(doc.context.register(doc.context.flateStream(parts.join('\n'))));
  }
  var tm = null;
  $('ppGap').addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(paint, 200); });
  $('ppUnit').addEventListener('change', function () { var v = parseFloat($('ppGap').value); if (isFinite(v)) $('ppGap').value = unit() === 'in' ? +(v / 25.4).toFixed(3) : +(v * 25.4).toFixed(2); paint(); });
  ['ppMajor', 'ppIso', 'ppPaper', 'ppOrient', 'ppMargin', 'ppWeight', 'ppMarginLine', 'ppHeader', 'ppPages'].forEach(function (id) { $(id).addEventListener('change', paint); });
  $('ppTitle').addEventListener('input', paint);
  $('ppColor').addEventListener('input', function () { setColor(this.value); });
  $('ppPng').addEventListener('click', function () { if (!check()) return; paint(); $('ppCanvas').toBlob(function (b) { GD.download(b, type + '-paper.png'); say('ok', 'PNG saved.'); }, 'image/png'); });
  $('ppPdf').addEventListener('click', async function () {
    if (busy || !check()) return;
    busy = true; var btn = this; btn.disabled = true; say('', 'Making the PDF…');
    try {
      var pg = pageOps(), n = +$('ppPages').value;
      // draw the page once, then place that same drawing on every page so the file stays small
      var one = await GD.newPdf('Paper', 'GetToolNest', null);
      var pg1 = one.doc.addPage([pg.W, pg.H]);
      await GD.drawPdf(one, pg1, pg.ops); dotsPdf(one.doc, pg1, pg.ops);
      var env = await GD.newPdf(TYPES[type][0] + ' paper', 'GetToolNest Paper Generator', null);
      var emb = (await env.doc.embedPdf(await one.doc.save()))[0];
      for (var i = 0; i < n; i++) env.doc.addPage([pg.W, pg.H]).drawPage(emb, { x: 0, y: 0, width: pg.W, height: pg.H });
      var bytes = await env.doc.save();
      GD.download(new Blob([bytes], { type: 'application/pdf' }), type + '-paper-' + $('ppPaper').value + '.pdf');
      say('ok', 'PDF saved: ' + n + ' page' + (n > 1 ? 's' : '') + ', ' + fmtBytes(bytes.length) + '. Print at 100% ("Actual size") so the spacing stays exact.');
    } catch (e) { say('bad', 'The PDF could not be made. ' + (e && e.message ? e.message : '')); }
    busy = false; btn.disabled = false;
  });
  // remember the paper type and spacing for the next visit
  function keep() { try { localStorage.setItem('gtnPaper', JSON.stringify({ type: type, gap: $('ppGap').value, unit: unit() })); } catch (e) {} }
  var sv = null; try { sv = JSON.parse(localStorage.getItem('gtnPaper')); } catch (e) {}
  if (sv && TYPES[sv.type] && (sv.unit === 'mm' || sv.unit === 'in') && sv.gap) { $('ppUnit').value = sv.unit; $('ppGap').value = sv.gap; setType(sv.type, false); }
  else { $('ppGap').value = unit() === 'mm' ? TYPES.lined[2] : TYPES.lined[3]; setType('lined', false); }
  $('ppGap').addEventListener('input', keep); $('ppUnit').addEventListener('change', keep);
  $('ppType').addEventListener('click', keep);
  GD.loadAll(['sans', 'sansb']).then(function () { ready = true; paint(); }, function () { ready = true; paint(); });
})();
</script>
