<style>
.spk-view { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 14px; min-height: 60px; max-height: 420px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; font-size: 16px; }
.spk-view:empty::before { content: attr(data-empty); color: var(--muted); }
.spk-bad { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-decoration: underline wavy var(--bad); text-decoration-skip-ink: none; text-underline-offset: 3px; border-radius: 3px; }
.spk-bad:hover, .spk-bad.on { background: rgba(220, 38, 38, .12); }
.spk-panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; background: var(--surface); }
.spk-panel h3 { margin: 0 0 8px; font-size: 16px; overflow-wrap: anywhere; }
.spk-sugg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.spk-sugg .btn { min-height: 38px; padding: 6px 12px; }
.spk-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.spk-list button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
.spk-list button:hover { border-color: var(--bad); }
.spk-list button i { font-style: normal; color: var(--muted); margin-left: 4px; font-size: 12px; }
.spk-words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.spk-words span { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 14px; max-width: 100%; overflow-wrap: anywhere; }
.spk-words button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px; }
.spk-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.spk-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>
<div class="fields">
  <div><label for="spLang">Language</label>
    <select id="spLang">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="es">Español (Spanish)</option>
      <option value="fr">Français (French)</option>
      <option value="de">Deutsch (German)</option>
      <option value="pt-BR">Português (Brasil)</option>
      <option value="pt-PT">Português (Portugal)</option>
      <option value="it">Italiano (Italian)</option>
      <option value="nl">Nederlands (Dutch)</option>
      <option value="ru">Русский (Russian)</option>
      <option value="tr">Türkçe (Turkish)</option>
      <option value="id">Bahasa Indonesia</option>
    </select>
  </div>
</div>
<div class="checks">
  <label><input type="checkbox" id="spCaps" checked>Ignore words in CAPITALS</label>
  <label><input type="checkbox" id="spNums" checked>Ignore words with numbers</label>
  <label><input type="checkbox" id="spLive" checked>Check as I type</label>
</div>
<label for="spTxt">Your text</label>
<textarea id="spTxt" data-nomemo class="plain" style="min-height:200px" spellcheck="false" placeholder="Type or paste your text here, then press Check spelling..."></textarea>
<div class="btns">
  <button class="btn" id="spGo">Check spelling</button>
  <button class="btn ghost" id="spCp">Copy text</button>
  <button class="btn ghost" id="spEx">Try an example</button>
  <button class="btn ghost" id="spClr">Clear</button>
</div>
<p class="msg" id="spMsg"></p>
<div class="spk-bar" id="spBar" hidden><i></i></div>
<div class="stats">
  <div class="stat"><span>Words checked</span><b id="spW">0</b></div>
  <div class="stat"><span>Possible mistakes</span><b id="spN">0</b></div>
  <div class="stat"><span>Different words</span><b id="spU">0</b></div>
</div>
<div class="spk-view" id="spView" data-empty="Mistakes will be underlined here. Click an underlined word to see suggestions." aria-live="polite"></div>
<div class="spk-panel" id="spPanel" hidden>
  <h3 id="spWord"></h3>
  <div class="spk-sugg" id="spSugg"></div>
  <div class="btns" style="margin-top:0">
    <button class="btn ghost" id="spIgn">Ignore</button>
    <button class="btn ghost" id="spAdd">Add to my dictionary</button>
    <button class="btn ghost" id="spNext">Next mistake</button>
  </div>
</div>
<div class="spk-list" id="spList"></div>
<details style="margin-top:16px">
  <summary>My dictionary (<span id="spDn">0</span> words)</summary>
  <p class="msg" style="margin-top:6px">Words you add are saved only in this browser and are accepted in every language.</p>
  <div class="spk-words" id="spDict"></div>
</details>
<script>
(function () {

  var SIZE = { 'en-US': 0.19, 'en-GB': 0.19, es: 0.23, fr: 0.34, de: 0.34, 'pt-BR': 1.4, 'pt-PT': 0.23, it: 0.36, nl: 0.82, ru: 0.6, tr: 2.3, id: 0.17 };
  var EXAMPLES = {
    'en-US': 'I recieve alot of emails every day, and I definately read them all. Their is a meeting tomorow at the libary.',
    'en-GB': 'The colour of the theatre was beautifull. We organised a meeting but nobody recieved the invitaton.',
    es: 'Mañana vamos a la playa con mis amigoss. La reunion es a las tres en la biblioteka.',
    fr: 'Je suis allé au marcher hier. Les enfans jouent dans le jardin avec leur chiens.',

    id: 'Besok kami akan pergi ke perpustakan. Rapat akan diadakan di sekolah pada jam tigaa.'
  };
  var worker = null, ready = {}, loading = {}, reqId = 0, pending = {}, timer = null, lastRun = 0;

      return fetch(base + 'hunspell.wasm').then(function (r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); }, function () { throw new Error('net'); }).then(function (wasm) {

          m._free(a); m._free(b); m.FS.unlink('/d.aff'); m.FS.unlink('/d.dic');

          postMessage({ type: 'loaded', lang: d.lang });

      var d = e.data;
      if (d.type === 'progress') { if (d.lang === lang()) bar(d.p); return; }

        var l = loading[d.lang]; delete loading[d.lang];

        else l && l.rej(d.why);
        return;

      var p = pending[d.id]; delete pending[d.id];
      if (p) p(d);
    };
    worker.onerror = function (e) { e.preventDefault(); worker.terminate(); worker = null; ready = {}; Object.keys(loading).forEach(function (k) { loading[k].rej('crash'); delete loading[k]; }); Object.keys(pending).forEach(function (k) { pending[k]({ gone: true }); delete pending[k]; }); };

  function ensure(l) {
    if (ready[l]) return Promise.resolve();
    if (loading[l]) return loading[l].p;

    var t = $('spTxt').value, l = lang(), me = ++runNo;

        render(t, mistakes);
        var u = Object.keys(bad).length;
        say(mistakes.length ? '' : 'ok', mistakes.length ? 'Found ' + fmtNum(mistakes.length) + ' possible mistake' + (mistakes.length === 1 ? '' : 's') + ' (' + langName(l) + '). Click an underlined word for suggestions.' : (toks.length ? 'No spelling mistakes found (' + langName(l) + ').' : 'There are no words to check with these settings.'));

    });

  function render(t, ms) {
    var html = '', pos = 0, LIMIT = 300000;
    ms.forEach(function (k, n) {
      html += esc(t.slice(pos, k.i)) + '<button type="button" class="spk-bad" data-n="' + n + '">' + esc(k.w) + '</button>';
      pos = k.i + k.w.length;
    });
    html += esc(t.slice(pos));

    ms.forEach(function (k) { if (!cnt[k.w]) { cnt[k.w] = 0; order.push(k.w); } cnt[k.w]++; });

    $('spWord').textContent = '“' + k.w + '”';

    });

  showDict();

  $('spTxt').addEventListener('input', function () {

  $('spGo').addEventListener('click', function () { clearTimeout(timer); run(true); });
  $('spLang').addEventListener('change', function () { closePanel(); if ($('spTxt').value.trim()) run(); else say('', ''); });
  ['spCaps', 'spNums'].forEach(function (id) { $(id).addEventListener('change', function () { if ($('spTxt').value.trim() && ready[lang()]) run(); }); });
  $('spCp').addEventListener('click', function () { copyText($('spTxt').value, $('spCp')); });

  // Start with the visitor's own language when we have a dictionary for it.
  try {
    var langs = (navigator.languages || [navigator.language || 'en-US']).map(String), pick = null;
    langs.some(function (n) {
      var c = n.toLowerCase();
      if (c === 'en-gb' || /^en-(ie|au|nz|za|in|pk|ng|ke|sg|my)/.test(c)) return (pick = 'en-GB');
      if (c.indexOf('en') === 0) return (pick = 'en-US');
      if (c === 'pt-pt' || /^pt-(ao|mz)/.test(c)) return (pick = 'pt-PT');
      if (c.indexOf('pt') === 0) return (pick = 'pt-BR');
      var two = c.slice(0, 2); if (two === 'in' || two === 'ms') two = 'id';
      if ($('spLang').querySelector('option[value="' + two + '"]')) return (pick = two);
      return false;
    });
    if (pick) $('spLang').value = pick;
  } catch (e) {}
})();
