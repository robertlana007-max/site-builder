<style>
.vc-src { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }

.vc-rec { display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 6px; border: 2px dashed var(--line); border-radius: 14px; padding: 14px; text-align: center; }
.vc-rec .btn { min-height: 52px; }
.vc-time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; min-height: 1.3em; }
.vc-lvl { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.vc-lvl i { display: block; height: 100%; width: 0; background: var(--accent); }
.vc-src .drop { margin: 0; display: flex; flex-direction: column; justify-content: center; }
.vc-name { margin: 0 0 12px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.vc-name b { color: var(--ink); }
.vc-fx { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 0 0 14px; }
.vc-fx button { font: inherit; font-weight: 600; min-height: 64px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface, var(--bg)); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.vc-fx button span { font-size: 22px; line-height: 1; }
.vc-fx button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft, var(--bg)); box-shadow: 0 0 0 1px var(--accent) inset; }
.vc-amt { display: flex; align-items: center; gap: 10px; }
.vc-amt input { flex: 1; min-width: 0; accent-color: var(--accent); }
.vc-amt output { min-width: 6.5em; text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; }
.vc-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.vc-row .btn { flex: 1 1 160px; }
.vc-audio { display: block; width: 100%; margin: 0 0 14px; }
</style>

    <button class="btn" type="button" id="rec">● Record your voice</button>
    <div class="vc-time" id="recTime" aria-live="off"></div>
    <div class="vc-lvl" aria-hidden="true"><i id="recLvl"></i></div>
  </div>
  <div class="drop" id="drop" tabindex="0" role="button"><b>Or open an audio file</b>MP3, M4A, WAV, OGG, voice notes or videos. Nothing is uploaded.</div>
</div>

    <button class="btn ghost" type="button" id="orig">▶ Original</button>

</div>
<div class="meter" id="bar" hidden><i id="fill"></i></div>

      try { recCtx = new AC(); recAn = recCtx.createAnalyser(); recAn.fftSize = 1024; recCtx.createMediaStreamSource(s).connect(recAn); } catch (e) { recAn = null; }
      var data = new Float32Array(1024);
      recTimer = setInterval(function () {
        var t = (performance.now() - recT0) / 1000; $('recTime').textContent = clock(t);
        if (recAn) { recAn.getFloatTimeDomainData(data); var pk = 0; for (var i = 0; i < data.length; i++) pk = Math.max(pk, Math.abs(data[i])); $('recLvl').style.width = Math.min(100, pk * 140) + '%'; }
        if (t >= MAXREC) { recStop(); }
      }, 100);
    }).catch(function (e) { $('rec').disabled = false; recorder = null; say('bad', micWhy(e)); });
  });

  // ---------- effects ----------
  function impulse(ctx, secs, decay) {
    var n = Math.round(ctx.sampleRate * secs), ir = ctx.createBuffer(2, n, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = ir.getChannelData(c); for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return ir;
  }
  // Apply the chosen effect. Resolves with an AudioBuffer.
  function render(onPct) {
    var key = fx + ':' + $('amt').value;
    if (cache.key === key && cache.buf) return Promise.resolve(cache.buf);
    var chs = []; for (var c = 0; c < Math.min(2, buf.numberOfChannels); c++) chs.push(buf.getChannelData(c));
    var st = semis();
    var step1 = st ? dspRun(chs, SR, 1, st, false, function (p) { onPct(p * 0.7); }) : Promise.resolve(chs.map(function (x) { return x; }));
    return step1.then(function (data) {
      onPct(0.75);
      var a = amt(), tail = fx === 'echo' ? 1 + a * 3 : fx === 'reverb' ? 1 + a * 3 : 0.1, len = data[0].length + Math.round(tail * SR);
      var ctx = new OAC(2, len, SR), b = ctx.createBuffer(data.length, data[0].length, SR);
      data.forEach(function (d, k) { b.getChannelData(k).set(d); });
      var s = ctx.createBufferSource(); s.buffer = b;
      var outG = ctx.createGain(); outG.connect(ctx.destination);
      if (fx === 'robot') {
        // ring modulation with a low hum, plus a short metallic resonance
        var ring = ctx.createGain(), osc = ctx.createOscillator(); ring.gain.value = 0; osc.frequency.value = 30 + a * 60; osc.connect(ring.gain); osc.start();
        var dly = ctx.createDelay(0.05), fb = ctx.createGain(); dly.delayTime.value = 0.008; fb.gain.value = 0.35 + a * 0.3;
        s.connect(ring); ring.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(outG); ring.connect(outG);
        var dry = ctx.createGain(); dry.gain.value = 0.25 * (1 - a); s.connect(dry); dry.connect(outG);
      } else if (fx === 'echo') {
        var d2 = ctx.createDelay(2), f2 = ctx.createGain(), w2 = ctx.createGain(); d2.delayTime.value = 0.22 + a * 0.28; f2.gain.value = 0.3 + a * 0.35; w2.gain.value = 0.7;
        s.connect(outG); s.connect(d2); d2.connect(f2); f2.connect(d2); d2.connect(w2); w2.connect(outG);
      } else if (fx === 'reverb') {
        var conv = ctx.createConvolver(), wet = ctx.createGain(), dry2 = ctx.createGain();
        conv.buffer = impulse(ctx, 1.2 + a * 2.8, 2.5); wet.gain.value = 0.25 + a * 0.5; dry2.gain.value = 1 - a * 0.4;
        s.connect(dry2); dry2.connect(outG); s.connect(conv); conv.connect(wet); wet.connect(outG);
      } else if (fx === 'phone') {
        var hp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), pk = ctx.createBiquadFilter(), sh = ctx.createWaveShaper(), mono = ctx.createGain();
        hp.type = 'highpass'; hp.frequency.value = 400; hp.Q.value = 0.9; lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.9;
        pk.type = 'peaking'; pk.frequency.value = 1800; pk.gain.value = 6; pk.Q.value = 1;
        var curve = new Float32Array(1024), k = 1 + a * 12; for (var i = 0; i < 1024; i++) { var x = i / 511.5 - 1; curve[i] = Math.tanh(k * x) / Math.tanh(k); }
        sh.curve = curve; mono.channelCount = 1; mono.channelCountMode = 'explicit'; mono.channelInterpretation = 'speakers';
        s.connect(mono); mono.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(sh); sh.connect(outG); outG.gain.value = 0.8;
      } else s.connect(outG);
      s.start();
      var p = ctx.startRendering();
      return p && p.then ? p : new Promise(function (r) { ctx.oncomplete = function (e) { r(e.renderedBuffer); }; });
    }).then(function (out) {
      // trim silence left at the end and keep the level safe
      var peak = 0, last = 0, n = out.length;
      for (var c2 = 0; c2 < out.numberOfChannels; c2++) { var d = out.getChannelData(c2); for (var i2 = 0; i2 < n; i2++) { var v = d[i2] < 0 ? -d[i2] : d[i2]; if (v > peak) peak = v; if (v > 0.0005 && i2 > last) last = i2; } }
      var keep = Math.max(Math.min(n, buf.length), Math.min(n, last + Math.round(0.05 * SR))), g = peak > 0.98 ? 0.98 / peak : 1;
      var fin = new AudioBuffer({ length: keep, numberOfChannels: out.numberOfChannels, sampleRate: SR });
      for (c2 = 0; c2 < out.numberOfChannels; c2++) { var o2 = fin.getChannelData(c2), s2 = out.getChannelData(c2); for (i2 = 0; i2 < keep; i2++) o2[i2] = s2[i2] * g; }
      cache = { key: key, buf: fin }; onPct(1);
      return fin;
    });
  }

  // ---------- listening ----------
  function stop() { if (src) { try { src.onended = null; src.stop(); } catch (e) {} src = null; } $('hear').textContent = '▶ Listen'; $('orig').textContent = '▶ Original'; }
  function playBuf(b, btn, label) {
    if (!AC) return say('bad', 'This browser cannot play sound here. You can still save the file.');
    if (!actx) actx = new AC();
    if (actx.resume) actx.resume();
    stop(); src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start();
    src.onended = function () { src = null; stop(); };
    btn.textContent = '■ Stop'; say('', label);
  }
  var playTicket = 0;
  function play() {
    if (!buf || busy) return;
    var mine = ++playTicket, label = FX.filter(function (f) { return f[0] === fx; })[0][2];
    if (cache.key !== fx + ':' + $('amt').value) say('', 'Applying "' + label + '"…');
    busy = true;
    render(function () {}).then(function (b) { busy = false; if (mine === playTicket) playBuf(b, $('hear'), 'Playing with "' + label + '".'); }, function () { busy = false; say('bad', 'The effect could not be applied. Your device may be low on memory.'); });
  }
  $('hear').addEventListener('click', function () { if (src && $('hear').textContent.indexOf('Stop') >= 0) return stop(); play(); });
  $('orig').addEventListener('click', function () { if (!buf) return; if (src && $('orig').textContent.indexOf('Stop') >= 0) return stop(); playBuf(buf, $('orig'), 'Playing the original sound.'); });

  // ---------- saving ----------
  $('go').addEventListener('click', function () {
    if (!buf || busy) return;
    stop(); busy = true; $('go').disabled = true; $('dl').hidden = true; $('result').hidden = true; bar(0);
    var fmt = $('fmt').value, label = FX.filter(function (f) { return f[0] === fx; })[0][2];
    say('', 'Applying "' + label + '"…');
    render(function (p) { bar(p * 0.6); }).then(function (b) {
      var chs = []; for (var c = 0; c < b.numberOfChannels; c++) chs.push(b.getChannelData(c));
      if (fmt === 'wav') return wavBlob(chs, SR);
      say('', 'Saving as MP3…');
      return encodeMp3(chs, SR, 160, function (p) { bar(0.6 + p * 0.4); });
    }).then(function (blob) {
      if (dlUrl) URL.revokeObjectURL(dlUrl);
      dlUrl = URL.createObjectURL(blob);
      $('dl').href = dlUrl; $('dl').download = name + '-' + fx + '.' + fmt; $('dl').textContent = 'Download ' + fmt.toUpperCase(); $('dl').hidden = false;
      $('result').src = dlUrl; $('result').hidden = false; bar(1);
      say('ok', 'Your "' + label + '" voice is ready (' + fmtBytes(blob.size) + ').');
    }).catch(function (e) { bar(null); say('bad', e instanceof RangeError ? 'Your device ran out of memory. Try a shorter recording.' : 'Something went wrong while saving. Please try again.'); })
      .then(function () { busy = false; $('go').disabled = !buf; });
  });
  amtUi();
})();
</script>
