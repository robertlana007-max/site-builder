<label for="txt">Your text</label>
<textarea id="txt" class="plain" placeholder="Type or paste your text here..."></textarea>
<div class="btns">
  <button class="btn" data-m="upper">UPPER CASE</button>
  <button class="btn" data-m="lower">lower case</button>
  <button class="btn" data-m="title">Title Case</button>
  <button class="btn" data-m="sentence">Sentence case</button>
  <button class="btn" data-m="camel">camelCase</button>
  <button class="btn" data-m="snake">snake_case</button>
  <button class="btn" data-m="kebab">kebab-case</button>
  <button class="btn ghost" id="cp">Copy</button>
  <button class="btn ghost" id="undo" disabled>Undo</button>
</div>
<script>
(function () {
  function words(t) { return t.replace(/([a-z0-9])([A-Z])/g, '$1 $2').split(/[^A-Za-z0-9À-￿]+/).filter(Boolean); }
  // Convert each line on its own, so a list stays a list.
  function lines(f) { return function (t) { return t.split('\n').map(f).join('\n'); }; }
  var M = {
    upper: function (t) { return t.toUpperCase(); },
    lower: function (t) { return t.toLowerCase(); },
    title: function (t) { return t.toLowerCase().replace(/(^|[\s\-(\["'])(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); },
    sentence: function (t) { return t.toLowerCase().replace(/(^\s*|[.!?]\s+|\n\s*)(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); },
    camel: lines(function (t) { return words(t).map(function (w, i) { w = w.toLowerCase(); return i ? w[0].toUpperCase() + w.slice(1) : w; }).join(''); }),
    snake: lines(function (t) { return words(t).join('_').toLowerCase(); }),
    kebab: lines(function (t) { return words(t).join('-').toLowerCase(); })
  };
  document.querySelectorAll('[data-m]').forEach(function (b) {
    b.addEventListener('click', function () {
      var before = $('txt').value, after = M[b.dataset.m](before);
      if (after === before) return;
      prev.push(before); $('undo').disabled = false;
      $('txt').value = after;
    });
  });
  // Keep earlier versions so a conversion can be taken back, even when the browser's own undo cannot.
  var prev = [];
  $('undo').addEventListener('click', function () { if (prev.length) $('txt').value = prev.pop(); $('undo').disabled = !prev.length; });
  $('cp').addEventListener('click', function () { copyText($('txt').value, $('cp')); });
})();
</script>
