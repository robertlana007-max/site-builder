<style>
.cp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cp-two .drop { margin-bottom: 0; padding: 22px 12px; overflow-wrap: anywhere; }
.cp-two .drop small { display: block; margin-top: 4px; font-size: 13px; }
.cp-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-bottom: 6px; }
.cp-a { background: #fde2e2; color: #b42318; } .cp-b { background: #dbeafe; color: #1d4ed8; }
@media (max-width: 560px) { .cp-two { grid-template-columns: 1fr; } }
.cp-res { margin-top: 16px; }
.cp-pages { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.cp-pages button { font: inherit; font-size: 13px; min-width: 40px; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.cp-pages button.chg { border-color: #e5484d; color: #b42318; font-weight: 700; }
.cp-pages button.only { border-style: dashed; }
.cp-pages button[aria-current="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cp-modes { margin: 4px 0 12px; }
.cp-text { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 12px 14px; line-height: 1.7; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70vh; overflow: auto; }
.cp-text del { background: #fde2e2; color: #b42318; text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
.cp-text ins { background: #dcfce7; color: #166534; text-decoration: none; border-radius: 3px; padding: 0 2px; }
[data-theme="dark"] .cp-text del { background: #4c1d1d; color: #fecaca; } [data-theme="dark"] .cp-text ins { background: #14391f; color: #bbf7d0; }
.cp-legend { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.cp-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 4px; }
.cp-vis { display: grid; gap: 10px; }
.cp-vis.two { grid-template-columns: 1fr 1fr; }
.cp-vis figure { margin: 0; }
.cp-vis figcaption { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.cp-vis canvas { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: #fff; }
</style>
<div class="cp-two">
  <div class="drop" id="cpDropA" tabindex="0" role="button"><span class="cp-tag cp-a">First (old)</span><b id="cpNameA">Choose the first PDF</b><small id="cpInfoA">Click or drop it here</small></div>
  <div class="drop" id="cpDropB" tabindex="0" role="button"><span class="cp-tag cp-b">Second (new)</span><b id="cpNameB">Choose the second PDF</b><small id="cpInfoB">Click or drop it here</small></div>
</div>
<input type="file" id="cpFileA" accept="application/pdf,.pdf" hidden>
<input type="file" id="cpFileB" accept="application/pdf,.pdf" hidden>
<div class="checks" style="margin-top:14px">
  <label><input type="checkbox" id="cpCase"> Ignore capital letters</label>
  <label><input type="checkbox" id="cpPunct"> Ignore punctuation</label>
</div>
<div class="btns"><button class="btn" id="go" disabled>Compare PDFs</button><button class="btn ghost" id="cpSwap" type="button" disabled>Swap first and second</button></div>
<p class="msg" id="msg"></p>
<div class="cp-res" id="cpRes" hidden>
  <div class="stats" id="cpStats"></div>
  <div class="cp-pages" id="cpPages" role="group" aria-label="Pages"></div>
  <div class="seg cp-modes" role="group" aria-label="How to show the differences">
    <button type="button" id="cpMText" aria-pressed="true">Text changes</button>
    <button type="button" id="cpMOver" aria-pressed="false">Overlay</button>
    <button type="button" id="cpMSide" aria-pressed="false">Side by side</button>
  </div>
  <div id="cpView"></div>
</div>
<script src="../assets/vendor/pdf.min.js"></script>
<script>
(function () {
  var files = { A: null, B: null }, docs = { A: null, B: null }, texts = { A: [], B: [] }, result = [], cur = 0, mode = 'text', busy = false, job = 0;

        var r = { i: i, inA: !!a, inB: !!b }, ops = diff(a || [], b || []);

        var d = document.createElement('div'); d.className = 'stat'; d.innerHTML = '<span></span><b></b>'; d.firstChild.textContent = x[0]; d.lastChild.textContent = x[1]; st.appendChild(d);
      });

    busy = false; refresh();
  });

  function drawPages() {
    var box = $('cpPages'); box.innerHTML = '';
    result.forEach(function (r, k) {

      if (r.changed) b.className = 'chg'; if (!r.inA || !r.inB) b.className += ' only';

  }
  function setMode(m) { mode = m; [['cpMText', 'text'], ['cpMOver', 'over'], ['cpMSide', 'side']].forEach(function (x) { $(x[0]).setAttribute('aria-pressed', String(mode === x[1])); }); }

  $('cpMOver').addEventListener('click', function () { setMode('over'); show(cur); });
  $('cpMSide').addEventListener('click', function () { setMode('side'); show(cur); });

  var vjob = 0;
  function show(k, m) {
    if (m) setMode(m);
    cur = k; var r = result[k], view = $('cpView'), me = ++vjob;
    Array.prototype.forEach.call($('cpPages').children, function (b, z) { b.setAttribute('aria-current', String(z === k)); });

      lg.innerHTML = '<i style="background:#fde2e2;border:1px solid #b42318"></i>Removed (only in the first) &nbsp; <i style="background:#dcfce7;border:1px solid #166534"></i>Added (only in the second)';
      view.appendChild(lg);
      var box = document.createElement('div'); box.className = 'cp-text'; box.setAttribute('translate', 'no');

        run.textContent += (run.textContent ? ' ' : '') + o.w;
        var nx = r.ops[z + 1]; if (!nx || nx.t !== o.t || nx.w === '\n') { box.appendChild(document.createTextNode(' ')); }

        if (Math.abs(la - lb) > 48 || Math.abs(A[p] - B[p]) + Math.abs(A[p + 1] - B[p + 1]) + Math.abs(A[p + 2] - B[p + 2]) > 120) { mask[q] = la < lb ? 1 : 2; diffN++; }

        view.appendChild(lg2);

        [[ga, 'First: ' + files.A.name, a], [gb, 'Second: ' + files.B.name, b]].forEach(function (x) {
          var cv = x[0].canvas, fg = document.createElement('figure'), cap = document.createElement('figcaption');
          cap.textContent = x[1];
          if (!x[2]) { x[0].fillStyle = '#f3f4f6'; x[0].fillRect(0, 0, W, H); x[0].fillStyle = '#6b7280'; x[0].font = Math.round(W / 22) + 'px sans-serif'; x[0].fillText('No page ' + r.i, W * .1, H * .2); }

})();
