<style>
.vt-info { margin: -4px 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.vt-info b { color: var(--ink); }
.vt-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 14px; }
.vt-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s; }
.vt-video { display: block; width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 14px 0 4px; }
.vt-hint { font-size: 14px; color: var(--muted); margin: -8px 0 14px; }
</style>
<style>
.tv-stage { position: relative; margin: 14px auto 6px; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid var(--line); max-width: 100%; }
.tv-stage video { display: block; width: 100%; height: 100%; }
.tv-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: move; }
.tv-ctl { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; }
.tv-ctl .btn { flex: none; padding: 8px 14px; }
.tv-ctl input { flex: 1; min-width: 0; accent-color: var(--accent); }
.tv-ctl span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.6em; }
.tv-list { grid-template-columns: minmax(0, 1fr); }
.tv-list li { min-width: 0; cursor: pointer; }
.tv-list li.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tv-list li span small { color: var(--muted); margin-inline-start: 4px; }
.tv-ed { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 14px; }
.tv-ed textarea { width: 100%; min-height: 70px; resize: vertical; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--field, var(--bg)); color: var(--ink); margin: 0 0 10px; }
.tv-time { display: flex; gap: 6px; }
.tv-time input { flex: 1; min-width: 0; }
.tv-time .btn { flex: none; padding: 6px 10px; font-size: 13px; }
.tv-range { display: flex; align-items: center; gap: 10px; }
.tv-range input { flex: 1; min-width: 0; accent-color: var(--accent); }
.tv-range output { min-width: 3em; text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }
.tv-pos { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.tv-pos button { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface, var(--bg)); color: var(--ink); cursor: pointer; }
.tv-add { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.tv-add .btn { flex: 1 1 160px; }

})();

    var bx = Math.max(0, Math.min(W - bw, it.x * W - bw / 2)), by = Math.max(0, Math.min(H - bh, it.y * H - bh / 2));

      if (it.look === 'box') { g.fillStyle = it.boxc; g.globalAlpha = 0.72; var r = Math.min(px * 0.3, bh / 2); g.beginPath(); if (g.roundRect) g.roundRect(bx, by, bw, bh, r); else g.rect(bx, by, bw, bh); g.fill(); g.globalAlpha = 1; }

      g.textAlign = it.align === 'left' ? (g.direction === 'rtl' ? 'right' : 'left') : it.align === 'right' ? (g.direction === 'rtl' ? 'left' : 'right') : 'center';

  function alpha(it, t) {

  }
  function draw() {
    if (!info) return;
    var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1, W = Math.max(1, Math.round(r.width * d)), H = Math.max(1, Math.round(r.height * d));
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    var g = cv.getContext('2d'), t = P.currentTime || 0;
    g.clearRect(0, 0, W, H);
    items.forEach(function (it, i) {
      var a = alpha(it, t), show = a > 0 || i === sel;
      if (!show || !it.text.trim()) return;
      g.globalAlpha = a > 0 ? a : 0.35; var box = paint(g, it, W, H); g.globalAlpha = 1;
      if (i === sel) { g.setLineDash([6 * d, 4 * d]); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = d; g.strokeRect(box.x, box.y, box.w, box.h); g.setLineDash([]); }
    });
  }
  function tick() { draw(); $('ptime').textContent = VT.clock(P.currentTime || 0); if (info) $('seek').value = Math.round((P.currentTime || 0) / info.duration * 1000); if (!P.paused) raf = requestAnimationFrame(tick); }

  // ---------- list and editor ----------
  function cur() { return items[sel]; }
  function list() {
    var ul = $('list'); ul.innerHTML = '';
    items.forEach(function (it, i) {
      var li = document.createElement('li'), s = document.createElement('span');
      if (i === sel) li.className = 'sel';
      s.textContent = (i + 1) + '. ' + (it.text.trim().split('\n')[0] || '(empty)');
      var sm = document.createElement('small'); sm.textContent = '· ' + VT.clock(it.a) + ' – ' + VT.clock(it.b); s.appendChild(sm);
      li.appendChild(s);
      var e = document.createElement('button'); e.type = 'button'; e.textContent = '✎'; e.setAttribute('aria-label', 'Edit text ' + (i + 1));
      li.appendChild(e);
      li.addEventListener('click', function () { pick(i); });
      ul.appendChild(li);
    });
    $('del').disabled = items.length < 2;
  }
  function pick(i) {
    sel = i; var it = cur();
    $('t').value = it.text; $('from').value = VT.clock(it.a); $('to').value = VT.clock(it.b);
    $('size').value = it.size; $('sizeOut').textContent = it.size; $('font').value = it.font; $('look').value = it.look;
    $('color').value = it.color; $('boxc').value = it.boxc; $('align').value = it.align; $('bold').checked = it.bold; $('fade').checked = it.fade;
    $('boxBox').hidden = it.look === 'shadow' || it.look === 'plain';
    list(); draw(); hint();
  }
  function hint() {
    if (!info) return;
    var bad2 = check();
    $('hint').className = 'vt-hint';
    $('hint').textContent = bad2 || (items.length + (items.length === 1 ? ' text' : ' texts') + '. Drag a text on the video to move it. The video is re-encoded to MP4' + (info.audio ? ' and the sound is kept' : '') + '.');
  }
  function check() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it.text.trim()) return 'Text ' + (i + 1) + ' is empty. Type something or remove it.';
      if (isNaN(it.a) || isNaN(it.b)) return 'The times of text ' + (i + 1) + ' are not valid. Use minutes and seconds like 0:05 or 1:20.5.';
      if (it.b - it.a < 0.1) return 'In text ' + (i + 1) + ', "Until" must be after "Show from".';
      if (it.a >= info.duration) return 'Text ' + (i + 1) + ' starts after the end of the video (' + VT.clock(info.duration) + ').';
    }
    return '';
  }
  function edited() { $('dl').hidden = true; list(); draw(); hint(); }
  $('t').addEventListener('input', function () { cur().text = $('t').value; edited(); });
  $('from').addEventListener('input', function () { cur().a = parse($('from').value); edited(); });
  $('to').addEventListener('input', function () { var v = parse($('to').value); cur().b = isNaN(v) ? v : Math.min(v, info.duration); edited(); });
  $('fromNow').addEventListener('click', function () { cur().a = Math.round(P.currentTime * 10) / 10; $('from').value = VT.clock(cur().a); edited(); });
  $('toNow').addEventListener('click', function () { cur().b = Math.round(P.currentTime * 10) / 10; $('to').value = VT.clock(cur().b); edited(); });
  $('size').addEventListener('input', function () { cur().size = +$('size').value; $('sizeOut').textContent = $('size').value; edited(); });
  ['font', 'look', 'color', 'boxc', 'align'].forEach(function (id) { $(id).addEventListener('input', function () { cur()[id] = $(id).value; $('boxBox').hidden = cur().look === 'shadow' || cur().look === 'plain'; edited(); }); });
  ['bold', 'fade'].forEach(function (id) { $(id).addEventListener('change', function () { cur()[id] = $(id).checked; edited(); }); });
  Array.prototype.forEach.call($('pos').children, function (b) { b.addEventListener('click', function () { if (b.dataset.y) cur().y = +b.dataset.y; if (b.dataset.x) cur().x = +b.dataset.x; edited(); }); });
  $('add').addEventListener('click', function () {
    var t = Math.min(P.currentTime || 0, Math.max(0, info.duration - 0.5)), it = newItem('New text', Math.round(t * 10) / 10, Math.min(info.duration, Math.round((t + 3) * 10) / 10));
    it.y = 0.5; items.push(it); pick(items.length - 1); $('t').focus(); $('t').select();
  });
  $('dup').addEventListener('click', function () { var c = JSON.parse(JSON.stringify(cur())); c.y = Math.min(0.95, c.y + 0.08); items.push(c); pick(items.length - 1); });
  $('del').addEventListener('click', function () { if (items.length < 2) return; items.splice(sel, 1); pick(Math.max(0, sel - 1)); });
  // drag a text on the preview
  var drag = null;
  cv.addEventListener('pointerdown', function (e) {
    if (!info) return;
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height, g = cv.getContext('2d'), t = P.currentTime || 0, hit = -1;
    for (var i = items.length - 1; i >= 0; i--) {
      if (alpha(items[i], t) <= 0 && i !== sel) continue;
      var b = paint(g, items[i], cv.width, cv.height, true);
      if (x * cv.width >= b.x && x * cv.width <= b.x + b.w && y * cv.height >= b.y && y * cv.height <= b.y + b.h) { hit = i; break; }
    }
    if (hit < 0) return;
    if (hit !== sel) pick(hit);
    drag = { x: x, y: y, ox: cur().x, oy: cur().y }; cv.setPointerCapture(e.pointerId); e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    cur().x = Math.max(0, Math.min(1, drag.ox + x - drag.x)); cur().y = Math.max(0, Math.min(1, drag.oy + y - drag.y)); draw(); $('dl').hidden = true;
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) { cv.addEventListener(ev, function () { drag = null; }); });

  // ---------- video ----------
  function reset() { file = null; info = null; $('editor').hidden = true; cancelAnimationFrame(raf); P.pause(); P.removeAttribute('src'); P.load(); if (url) { URL.revokeObjectURL(url); url = null; } }
  VT.pick(reset, function (f, i) {
    file = f; info = i; url = URL.createObjectURL(f); bad = false; $('noPlay').hidden = true; P.src = url;
    var box = $('stageBox'); box.style.aspectRatio = i.width + ' / ' + i.height; box.style.maxWidth = Math.round(420 * i.width / i.height) + 'px';
    if (!items.length) items = [newItem('Your text here', 0, Math.round(Math.min(i.duration, 5) * 10) / 10)];
    items.forEach(function (it) { if (it.b > i.duration) it.b = i.duration; if (it.a >= i.duration) it.a = 0; });
    $('editor').hidden = false; pick(Math.min(sel, items.length - 1));
  });
  P.addEventListener('error', function () { if (P.getAttribute('src')) { bad = true; $('noPlay').hidden = false; } });
  P.addEventListener('loadeddata', draw); P.addEventListener('seeked', draw);
  P.addEventListener('play', function () { $('pp').textContent = '❚❚'; tick(); });
  P.addEventListener('pause', function () { $('pp').textContent = '▶'; draw(); });
  $('pp').addEventListener('click', function () { if (bad || !info) return; if (P.paused) { var p = P.play(); if (p && p.catch) p.catch(function () {}); } else P.pause(); });
  $('seek').addEventListener('input', function () { if (!info) return; if (!bad) P.currentTime = $('seek').value / 1000 * info.duration; $('ptime').textContent = VT.clock($('seek').value / 1000 * info.duration); draw(); });
  window.addEventListener('resize', draw);

  // ---------- export: each text becomes a transparent picture laid over the video ----------
  function png(it) {
    var W = info.width, H = info.height, c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d'), b = paint(g, it, W, H, true);
    var x = Math.max(0, Math.floor(b.x)), y = Math.max(0, Math.floor(b.y)), w = Math.min(W - x, Math.ceil(b.w) + 2), h = Math.min(H - y, Math.ceil(b.h) + 2);
    paint(g, it, W, H);
    var o = document.createElement('canvas'); o.width = Math.max(1, w); o.height = Math.max(1, h); o.getContext('2d').drawImage(c, x, y, w, h, 0, 0, w, h);
    return new Promise(function (res, rej) { o.toBlob(function (bl) { if (!bl) return rej(new Error('Could not draw the text.')); bl.arrayBuffer().then(function (ab) { res({ data: new Uint8Array(ab), x: x, y: y }); }); }, 'image/png'); });
  }
  $('go').addEventListener('click', function () {
    if (!file) return;
    var err = check(); if (err) { VT.say('bad', err); return; }
    P.pause();
    var f = file, i = info, list2 = items.map(function (it) { return JSON.parse(JSON.stringify(it)); }), q = $('q').value;
    VT.go('Adding text', function (pct) {
      return Promise.all(list2.map(png)).then(function (pics) {
        var names = pics.map(function (_, k) { return '/text' + k + '.png'; });
        return FF.run(f, function (inp) {
          var a = ['-i', inp];
          list2.forEach(function (it, k) { if (it.fade) a.push('-loop', '1', '-framerate', String(Math.min(60, Math.round(i.fps) || 30)), '-t', (Math.min(it.b, i.duration) + 0.1).toFixed(2)); a.push('-i', names[k]); });
          var g2 = [], last = '0:v';
          list2.forEach(function (it, k) {
            var b = Math.min(it.b, i.duration), src = (k + 1) + ':v';
            if (it.fade) { var d = Math.min(0.4, (b - it.a) / 3); g2.push('[' + src + ']format=rgba,fade=t=in:st=' + it.a.toFixed(2) + ':d=' + d.toFixed(2) + ':alpha=1,fade=t=out:st=' + (b - d).toFixed(2) + ':d=' + d.toFixed(2) + ':alpha=1[p' + k + ']'); src = 'p' + k; }
            g2.push('[' + last + '][' + src + ']overlay=' + pics[k].x + ':' + pics[k].y + ':enable=\'between(t,' + it.a.toFixed(2) + ',' + b.toFixed(2) + ')\'' + (it.fade ? ':eof_action=pass' : '') + '[v' + k + ']');
            last = 'v' + k;
          });
          g2.push('[' + last + ']scale=trunc(iw/2)*2:trunc(ih/2)*2,format=yuv420p[vout]');
          a.push('-filter_complex', g2.join(';'), '-map', '[vout]');
          if (i.audio) a.push('-map', '0:a:0?', '-c:a', i.acodec === 'aac' ? 'copy' : 'aac', '-b:a', '160k');
          a.push('-c:v', 'libx264', '-preset', 'veryfast', '-crf', q, '-movflags', '+faststart', '-t', i.duration.toFixed(3));
          return a;
        }, 'with-text.mp4', i.duration, pct, VT.say, function (ff) {
          return pics.reduce(function (p, pic, k) { return p.then(function () { return ff.writeFile(names[k], pic.data); }); }, Promise.resolve());
        }).then(function (data) {
          VT.done(data, VT.base(f.name) + '-with-text.mp4', 'video/mp4');
          return 'Your video with ' + list2.length + (list2.length === 1 ? ' text' : ' texts') + ' is ready (' + fmtBytes(data.length) + ')';
        });
      });
    });
  });
})();
