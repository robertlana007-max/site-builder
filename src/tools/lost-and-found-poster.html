<style>
.lf fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 4px; margin: 0 0 14px; min-width: 0; }
.lf legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.lf textarea { width: 100%; box-sizing: border-box; min-height: 80px; font: inherit; font-size: 15px; }
.lf .lf-lab { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
.lf .lf-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-bottom: 12px; }
.lf .lf-row button { font: inherit; font-size: 14.5px; font-weight: 600; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 4px 6px; }
.lf .lf-row button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.lf .lf-row.tpl button { display: flex; align-items: center; justify-content: center; gap: 6px; }
.lf .lf-row.tpl i { width: 16px; height: 16px; border-radius: 4px; flex: 0 0 16px; border: 1px solid rgba(0,0,0,.2); }
.lf .lf-img { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.lf .lf-img img { max-height: 56px; max-width: 110px; border: 1px solid var(--line); border-radius: 6px; }
.lf input[type=file] { max-width: 100%; }
.lf .lf-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 12px; }
.lf .lf-prev canvas { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
.lf .lf-hint { display: block; font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
.lf .lf-note { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin: 0 0 12px; }
.lf .btns .btn { min-height: 44px; }
</style>
<div class="lf" id="lf">
<fieldset><legend>Poster</legend>
  <span class="lf-lab" id="lfModeL">Lost or found?</span>
  <div class="lf-row" id="lfMode" role="group" aria-labelledby="lfModeL"><button type="button" data-k="lost">Lost</button><button type="button" data-k="found">Found</button></div>
  <span class="lf-lab" id="lfKindL">What is it?</span>
  <div class="lf-row" id="lfKind" role="group" aria-labelledby="lfKindL"><button type="button" data-k="pet">Pet</button><button type="button" data-k="person">Person</button><button type="button" data-k="item">Item</button><button type="button" data-k="vehicle">Vehicle</button></div>
  <p class="lf-note" id="lfPersonNote" hidden>If someone is missing, contact the police or your local emergency number first. A poster helps, but it does not replace a report.</p>
  <span class="lf-lab" id="lfTplL">Style</span>
  <div class="lf-row tpl" id="lfTpl" role="group" aria-labelledby="lfTplL"></div>
  <div class="fields">
    <div><label for="lfLang">Poster language</label><select id="lfLang" data-nomemo></select></div>
    <div><label for="lfSize">Size</label><select id="lfSize" data-nomemo>
      <option value="a4">A4 paper</option><option value="letter">US Letter paper</option><option value="square">Square post (1080 × 1080)</option><option value="portrait">Portrait post (1080 × 1350)</option><option value="story">Story / status (1080 × 1920)</option></select></div>
    <div id="lfStripsBox"><label for="lfStrips">Tear-off strips</label><select id="lfStrips" data-nomemo><option value="0">None</option><option value="6">6 strips</option><option value="8">8 strips</option><option value="10">10 strips</option></select></div>
  </div>
</fieldset>

<fieldset><legend>Photo</legend>
  <label for="lfImg">A clear, recent photo (optional but it helps a lot)</label>
  <div class="lf-img"><input type="file" id="lfImg" data-nomemo accept="image/*"><img id="lfImgPrev" alt="Chosen photo" hidden><button type="button" class="btn ghost" id="lfImgDel" hidden>Remove</button></div>
  <div class="fields"><div><label for="lfFit">Photo</label><select id="lfFit" data-nomemo><option value="cover">Fill the box (may crop the edges)</option><option value="contain">Show the whole photo</option></select></div></div>
</fieldset>

<fieldset><legend>Details</legend>
  <div class="fields">
    <div><label for="lfWhat" id="lfWhatL">Type of animal</label><input type="text" id="lfWhat" data-nomemo maxlength="40"></div>
    <div><label for="lfName" id="lfNameL">Name (optional)</label><input type="text" id="lfName" data-nomemo maxlength="40"></div>
  </div>
  <label for="lfDesc">Description: colour, size, clothes, marks, collar…</label>
  <textarea id="lfDesc" data-nomemo maxlength="400"></textarea>
  <div class="fields" style="margin-top:12px">
    <div><label for="lfPlace" id="lfPlaceL">Last seen at</label><input type="text" id="lfPlace" data-nomemo maxlength="80" placeholder="e.g. Near Central Park, North Gate"></div>
    <div><label for="lfDate">Date</label><input type="date" id="lfDate" data-nomemo></div>
    <div><label for="lfTime">Time (optional)</label><input type="time" id="lfTime" data-nomemo></div>
    <div id="lfRewardBox"><label for="lfReward">Reward (optional)</label><input type="text" id="lfReward" data-nomemo maxlength="30" placeholder="e.g. 100 USD"></div>
  </div>
  <div class="fields"><div><label for="lfHead">Headline (leave empty for automatic)</label><input type="text" id="lfHead" data-nomemo maxlength="30"></div></div>
</fieldset>

<fieldset><legend>Contact and QR code</legend>
  <div class="fields">
    <div><label for="lfContact">Contact name (optional)</label><input type="text" id="lfContact" data-nomemo maxlength="40" placeholder="e.g. Maria"></div>
    <div><label for="lfPhone">Phone number</label><input type="tel" id="lfPhone" data-nomemo maxlength="30" placeholder="with country code, e.g. +44 7700 900123"></div>
    <div><label for="lfQr">QR code opens</label><select id="lfQr" data-nomemo><option value="tel">A phone call</option><option value="wa">A WhatsApp chat</option><option value="url">A web page</option><option value="none">No QR code</option></select></div>
    <div id="lfUrlBox" hidden><label for="lfUrl">Web page</label><input type="url" id="lfUrl" data-nomemo maxlength="300" placeholder="https://…"></div>
  </div>
</fieldset>

<div class="lf-prev"><canvas id="lfCanvas" width="595" height="842" aria-label="Poster preview"></canvas></div>
<div class="btns">
  <button type="button" class="btn" id="lfPdf">Download PDF</button>
  <button type="button" class="btn ghost" id="lfPng">Download PNG</button>
  <button type="button" class="btn ghost" id="lfShare" hidden>Share picture</button>
  <button type="button" class="btn ghost" id="lfReset">Start again</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
<script src="../assets/vendor/qrcode.js"></script>

    if (d.qr.err) notes.push(d.qr.err); else if (d.qr.warn) notes.push(d.qr.warn);
    if (!$('lfPhone').value.trim() && !$('lfContact').value.trim()) notes.push('Add a phone number so people can reach you.');
    if (d.cut) notes.push('Some text does not fit. Shorten the description' + (IMG ? ' or choose a taller size.' : '.'));
    say(notes.length ? 'bad' : '', notes.join(' '));
    return d;
  }
  var tm = null; function later() { clearTimeout(tm); tm = setTimeout(paint, 120); save(); }
  FIELDS.forEach(function (id) { $(id).addEventListener('input', later); });
  SETS.forEach(function (id) { $(id).addEventListener('change', function () { paint(); save(); }); });

  // ---------- photo ----------
  function showImg() { $('lfImgPrev').src = IMG.src; $('lfImgPrev').hidden = $('lfImgDel').hidden = false; }
  $('lfImg').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    GD.readImage(f, 2400, function (img, err) {
      $('lfImg').value = '';
      if (!img) return say('bad', err);
      IMG = img;
      // a smaller copy is kept in this browser so the poster is still here next time
      try { var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1000 / Math.max(w, h)), c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); var s = c.toDataURL('image/jpeg', 0.82); IMG.small = s.length < 1.6e6 ? s : null; } catch (e) {}
      showImg(); paint(); save();
    });
  });
  $('lfImgDel').addEventListener('click', function () { IMG = null; $('lfImgPrev').hidden = $('lfImgDel').hidden = true; paint(); save(); });

  // ---------- output ----------
  function base() { var d = [S.mode, $('lfWhat').value.trim(), $('lfName').value.trim()].join(' ').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 40); return (d || 'poster') + '-poster'; }
  function check() { if (!$('lfPhone').value.trim() && !$('lfContact').value.trim() && !(qrTarget().url)) { say('bad', 'Add a phone number or contact name first, so people can reach you.'); $('lfPhone').focus(); return false; } return true; }
  function pngBlob(cb) {
    var d = design(), sc = d.paper ? 200 / 72 : 1, c = document.createElement('canvas');
    c.width = Math.round(d.W * sc); c.height = Math.round(d.H * sc); GD.drawCanvas(d.ops, c.getContext('2d'), sc);
    c.toBlob(function (b) { cb(b, c); }, 'image/png');
  }
  $('lfPng').addEventListener('click', function () {
    if (!ready || busy || !check()) return;
    pngBlob(function (b, c) { if (!b) return say('bad', 'The picture could not be made on this device.'); GD.download(b, base() + '.png'); say('ok', 'Saved a ' + c.width + ' × ' + c.height + ' PNG. Share it on WhatsApp, social media or local groups.'); });
  });
  if (navigator.canShare && window.File) { try { $('lfShare').hidden = !navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'p.png', { type: 'image/png' })] }); } catch (e) {} }
  $('lfShare').addEventListener('click', function () {
    if (!ready || busy || !check()) return;
    pngBlob(function (b) { if (!b) return; var f = new File([b], base() + '.png', { type: 'image/png' }); navigator.share({ files: [f], title: $('lfHead').value || 'Poster' }).catch(function (e) { if (e && e.name !== 'AbortError') say('bad', 'Sharing did not work here. Use Download PNG instead.'); }); });
  });
  $('lfPdf').addEventListener('click', async function () {
    if (!ready || busy || !check()) return;
    var d = design(); if (!d.paper) return say('bad', 'PDF is for printing. Choose A4 or US Letter paper as the size.');
    busy = true; var btn = this; btn.disabled = true; say('', 'Making the PDF…');
    try {
      var env = await GD.newPdf(($('lfHead').value.trim() || (S.mode === 'found' ? 'Found' : 'Lost')) + ' ' + $('lfWhat').value.trim(), 'GetToolNest Lost and Found Poster', function (t) { say('', t); });
      await GD.drawPdf(env, env.doc.addPage([d.W, d.H]), d.ops);
      var bytes = await env.doc.save();
      GD.download(new Blob([bytes], { type: 'application/pdf' }), base() + '.pdf');
      say('ok', 'PDF saved (' + fmtBytes(bytes.length) + '). Print at 100% ("Actual size"), then cut the tear-off strips along the dotted lines.');
    } catch (e) { console.warn(e); say('bad', 'The PDF could not be made. ' + (e && e.message ? e.message : '')); }
    busy = false; btn.disabled = false;
  });
  $('lfReset').addEventListener('click', function () {
    if (!confirm('Clear the poster and start again?')) return;
    FIELDS.forEach(function (id) { $(id).value = ''; }); IMG = null; $('lfImgPrev').hidden = $('lfImgDel').hidden = true;
    $('lfDate').value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    try { localStorage.removeItem(KEY); } catch (e) {} paint(); $('lfWhat').focus();
  });

  load(); marks();
  GD.loadAll(['sans', 'sansb', 'display']).then(function () { ready = true; paint(); }, function () { ready = true; paint(); say('bad', 'Some fonts could not load. Check your connection and reload.'); });
})();
</script>
