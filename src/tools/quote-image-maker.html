<style>
.qim fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.qim legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.qim textarea { min-height: 100px; font-family: inherit; font-size: 15px; }
.qim .qim-bgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; margin-bottom: 12px; }
.qim .qim-bgs button { height: 44px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.qim .qim-bgs button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.qim input[type=color] { width: 100%; max-width: 120px; height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); }
.qim input[type=file] { max-width: 100%; }
.qim input[type=range] { width: 100%; }
.qim .qim-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.qim .qim-img { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.qim .qim-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.qim .qim-prev canvas { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.qim .qim-prev.wide canvas { max-width: 620px; }
.qim .qim-count { display: block; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
</style>
<div class="qim" id="qim">
<fieldset><legend>Quote</legend>
  <label for="qtText">Quote</label>
  <textarea id="qtText" data-nomemo maxlength="600" placeholder="The best way to get started is to quit talking and begin doing."></textarea>
  <span class="qim-count" id="qtCount">0 / 600</span>
  <div class="fields">
    <div><label for="qtAuthor">Author (optional)</label><input type="text" id="qtAuthor" data-nomemo maxlength="60" placeholder="e.g. Walt Disney"></div>
    <div><label for="qtHandle">Your name or @handle in the corner (optional)</label><input type="text" id="qtHandle" data-nomemo maxlength="40" placeholder="@yourpage"></div>
  </div>
</fieldset>
<fieldset><legend>Style</legend>
  <div class="fields">
    <div><label for="qtSize">Size</label><select id="qtSize"><option value="1080x1080">Square post (1080 × 1080)</option><option value="1080x1350">Portrait post (1080 × 1350)</option><option value="1080x1920">Story or reel (1080 × 1920)</option><option value="1600x900">Landscape post (1600 × 900)</option><option value="1200x628">Link preview (1200 × 628)</option></select></div>
    <div><label for="qtFont">Font</label><select id="qtFont"><option value="playfair">Elegant serif</option><option value="serif">Book serif</option><option value="sansb">Modern sans</option><option value="display">Bold (Anton)</option><option value="caveat">Handwritten</option><option value="pacifico">Friendly</option></select></div>
    <div><label for="qtAlign">Alignment</label><select id="qtAlign"><option value="center">Centre</option><option value="left">Left</option></select></div>
  </div>
  <label>Background</label>
  <div class="qim-bgs" id="qtBgs" role="group" aria-label="Backgrounds"></div>
  <div class="fields">
    <div><label for="qtColor">Own colour</label><input type="color" id="qtColor" value="#0f766e"></div>
    <div><label for="qtInk">Text colour</label><select id="qtInk"><option value="auto">Automatic</option><option value="#ffffff">White</option><option value="#111827">Black</option><option value="#fde68a">Cream yellow</option></select></div>
  </div>
  <label for="qtImg">Or your own photo</label>
  <div class="qim-img"><input type="file" id="qtImg" data-nomemo accept="image/png,image/jpeg,image/webp"><button type="button" class="btn ghost" id="qtImgDel" hidden>Remove photo</button></div>
  <div id="qtDimBox" hidden><label for="qtDim">Darken the photo</label><input type="range" id="qtDim" min="0" max="85" value="45"></div>
  <label class="qim-check"><input type="checkbox" id="qtMarks" checked>Big quotation mark</label>
  <label class="qim-check"><input type="checkbox" id="qtFrame">Thin frame</label>
</fieldset>
<div class="qim-prev" id="qtPrevBox"><canvas id="qtCanvas" width="1080" height="1080" aria-label="Quote image preview"></canvas></div>
<div class="btns">
  <button type="button" class="btn" id="qtPng">Download PNG</button>
  <button type="button" class="btn ghost" id="qtJpg">Download JPG</button>
  <button type="button" class="btn ghost" id="qtCopy">Copy image</button>
  <button type="button" class="btn ghost" id="qtShuffle">Surprise me</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
