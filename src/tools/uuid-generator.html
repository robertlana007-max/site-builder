<div class="fields">
  <div><label for="n">How many</label><input type="number" id="n" min="1" max="500" step="1" value="5"></div>
</div>
<div class="checks">
  <label><input type="checkbox" id="up">UPPERCASE</label>
  <label><input type="checkbox" id="nohy">Remove hyphens</label>
</div>
<textarea id="out" style="min-height:180px" readonly spellcheck="false" aria-label="Generated UUIDs"></textarea>
<div class="btns"><button class="btn" id="gen">Generate new</button><button class="btn ghost" id="cp">Copy all</button></div>
<script>
(function () {
  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80; // version 4, RFC 4122 variant
    var h = Array.from(b).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  function gen() {
    var n = Math.min(500, Math.max(1, Math.floor(+$('n').value) || 1)), a = [];
    for (var i = 0; i < n; i++) {
      var u = uuid();
      if ($('nohy').checked) u = u.replace(/-/g, '');
      if ($('up').checked) u = u.toUpperCase();
      a.push(u);
    }
    $('out').value = a.join('\n');
  }
  $('gen').addEventListener('click', gen);
  ['n', 'up', 'nohy'].forEach(function (id) { $(id).addEventListener('input', gen); });
  $('cp').addEventListener('click', function () { copyText($('out').value, $('cp')); });
  gen();
})();
</script>
