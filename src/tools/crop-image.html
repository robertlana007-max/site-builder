<style>
.cr-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.cr-bar .btn { min-height: 40px; padding: 6px 12px; }
.cr-stage { position: relative; display: flex; justify-content: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
.cr-wrap { position: relative; line-height: 0; cursor: crosshair; }
.cr-wrap canvas { display: block; max-width: 100%; }
.cr-box { position: absolute; box-sizing: border-box; border: 2px solid #fff; outline: 1px solid rgba(0, 0, 0, .55); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .5); cursor: move; touch-action: none; }
.cr-box:focus-visible { outline: 3px solid var(--accent); }
.cr-box::before, .cr-box::after { content: ""; position: absolute; pointer-events: none; border: 0 solid rgba(255, 255, 255, .55); }
.cr-box::before { left: 33.33%; right: 33.33%; top: 0; bottom: 0; border-width: 0 1px; }
.cr-box::after { top: 33.33%; bottom: 33.33%; left: 0; right: 0; border-width: 1px 0; }
.cr-h { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; touch-action: none; z-index: 1; }
.cr-h::after { content: ""; position: absolute; inset: 5px; background: #fff; border: 2px solid var(--accent); border-radius: 3px; }
.cr-h[data-d=nw] { left: 0; top: 0; cursor: nwse-resize; } .cr-h[data-d=ne] { left: 100%; top: 0; cursor: nesw-resize; }
.cr-h[data-d=sw] { left: 0; top: 100%; cursor: nesw-resize; } .cr-h[data-d=se] { left: 100%; top: 100%; cursor: nwse-resize; }
.cr-h[data-d=n] { left: 50%; top: 0; cursor: ns-resize; } .cr-h[data-d=s] { left: 50%; top: 100%; cursor: ns-resize; }
.cr-h[data-d=w] { left: 0; top: 50%; cursor: ew-resize; } .cr-h[data-d=e] { left: 100%; top: 50%; cursor: ew-resize; }
@media (pointer: coarse) { .cr-h { width: 34px; height: 34px; margin: -17px 0 0 -17px; } .cr-h::after { inset: 9px; } }
.cr-size { font-size: 14px; color: var(--muted); margin: 8px 0 14px; text-align: center; }
.cr-nums { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop an image here</b>JPG, PNG, WebP, GIF or BMP. Cropped on your device, never uploaded.</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="editor" hidden>
  <div class="fields">
    <div><label for="aspect">Shape (aspect ratio)</label><select id="aspect">
      <option value="free">Free</option><option value="orig">Original shape</option><option value="1">Square 1:1</option>
      <option value="0.8">Instagram portrait 4:5</option><option value="1.7777778">Widescreen 16:9</option><option value="0.5625">Story / Reel 9:16</option>
      <option value="1.5">Photo 3:2</option><option value="0.7777778">Passport photo 35 × 45 mm</option>
    </select></div>
  </div>
  <div class="cr-bar">
    <button class="btn ghost" id="rotL" aria-label="Rotate left">⟲ Rotate left</button>
    <button class="btn ghost" id="rotR" aria-label="Rotate right">⟳ Rotate right</button>
    <button class="btn ghost" id="flipH">⇆ Flip</button>
    <button class="btn ghost" id="flipV">⇅ Flip up/down</button>
    <button class="btn ghost" id="reset">Reset</button>
  </div>
  <div class="cr-stage" id="stage"><div class="cr-wrap" id="wrap"><canvas id="cv"></canvas>
    <div class="cr-box" id="box" tabindex="0" role="group" aria-label="Crop area. Drag to move, use the arrow keys to nudge.">
      <i class="cr-h" data-d="nw"></i><i class="cr-h" data-d="n"></i><i class="cr-h" data-d="ne"></i><i class="cr-h" data-d="e"></i>
      <i class="cr-h" data-d="se"></i><i class="cr-h" data-d="s"></i><i class="cr-h" data-d="sw"></i><i class="cr-h" data-d="w"></i>
    </div></div></div>
  <p class="cr-size" id="size"></p>
  <div class="fields cr-nums">
    <div><label for="cw">Width (px)</label><input type="number" id="cw" min="1" step="1" inputmode="numeric" data-nomemo></div>
    <div><label for="ch">Height (px)</label><input type="number" id="ch" min="1" step="1" inputmode="numeric" data-nomemo></div>
    <div><label for="cx">Left (X)</label><input type="number" id="cx" min="0" step="1" inputmode="numeric" data-nomemo></div>
    <div><label for="cy">Top (Y)</label><input type="number" id="cy" min="0" step="1" inputmode="numeric" data-nomemo></div>
  </div>
  <div class="checks" id="passRow" hidden><label><input type="checkbox" id="pass300" checked>Resize to 413 × 531 px (prints at 35 × 45 mm, 300 dpi)</label></div>
  <div class="fields">
    <div><label for="fmt">Save as</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
    <div id="qRow"><label for="q">Quality: <span id="qv">92</span>%</label><input type="range" id="q" min="40" max="100" value="92"></div>
  </div>
</div>
<div class="preview"><img id="prev" alt="Cropped image" hidden></div>
<div class="btns"><button class="btn" id="go" disabled>Crop image</button><a class="btn ghost" id="dl" hidden>Download</a></div>
<p class="msg" id="msg"></p>
<script>
(function () {
  var img = null, name = 'image', W = 0, H = 0, M = [1, 0, 0, 1, 0, 0], r = null, k = 1, drag = null, url = null, job = 0;
  var cv = $('cv'), box = $('box'), wrap = $('wrap'), MIN = 8;
  function say(cls, t) { $('msg').className = 'msg ' + (cls || ''); $('msg').textContent = t || ''; }
  function stale() { $('dl').hidden = true; $('prev').hidden = true; job++; }
  function ratio() { var v = $('aspect').value; return v === 'free' ? 0 : v === 'orig' ? W / H : +v; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---------- orientation: M maps original pixels to the turned/flipped picture (W × H) ----------
  function mul(a, b) { return [a[0] * b[0] + a[1] * b[2], a[0] * b[1] + a[1] * b[3], a[2] * b[0] + a[3] * b[2], a[2] * b[1] + a[3] * b[3], a[4] * b[0] + a[5] * b[2] + b[4], a[4] * b[1] + a[5] * b[3] + b[5]]; }
  function turn(t, nw, nh, mapRect) { M = mul(M, t); r = mapRect(r); W = nw; H = nh; fitAspect(true); layout(); stale(); }
  $('rotR').addEventListener('click', function () { if (!img) return; var h = H; turn([0, 1, -1, 0, H, 0], H, W, function (q) { return { x: h - q.y - q.h, y: q.x, w: q.h, h: q.w }; }); });
  $('rotL').addEventListener('click', function () { if (!img) return; var w = W; turn([0, -1, 1, 0, 0, W], H, W, function (q) { return { x: q.y, y: w - q.x - q.w, w: q.h, h: q.w }; }); });
  $('flipH').addEventListener('click', function () { if (!img) return; var w = W; turn([-1, 0, 0, 1, W, 0], W, H, function (q) { return { x: w - q.x - q.w, y: q.y, w: q.w, h: q.h }; }); });
  $('flipV').addEventListener('click', function () { if (!img) return; var h = H; turn([1, 0, 0, -1, 0, H], W, H, function (q) { return { x: q.x, y: h - q.y - q.h, w: q.w, h: q.h }; }); });
  $('reset').addEventListener('click', function () { if (!img) return; M = [1, 0, 0, 1, 0, 0]; W = img.naturalWidth; H = img.naturalHeight; r = { x: 0, y: 0, w: W, h: H }; fitAspect(false); layout(); stale(); });

  // ---------- drawing ----------
  function layout() {
    if (!img) return;
    var maxW = $('stage').clientWidth - 26, maxH = Math.max(240, Math.min(window.innerHeight * .65, 720));
    k = Math.min(maxW / W, maxH / H, 1);
    var dw = Math.max(1, Math.round(W * k)), dh = Math.max(1, Math.round(H * k)), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(dw * dpr); cv.height = Math.round(dh * dpr); cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
    k = dw / W;
    var c = cv.getContext('2d'), s = cv.width / W;
    c.setTransform(M[0] * s, M[1] * s, M[2] * s, M[3] * s, M[4] * s, M[5] * s);
    c.imageSmoothingQuality = 'high'; c.drawImage(img, 0, 0);
    paint();
  }
  function paint(skip) {
    box.style.left = r.x * k + 'px'; box.style.top = r.y * k + 'px'; box.style.width = r.w * k + 'px'; box.style.height = r.h * k + 'px';
    var R = rounded(), f = { cw: R.w, ch: R.h, cx: R.x, cy: R.y };
    Object.keys(f).forEach(function (id) { if (id !== skip) $(id).value = f[id]; });
    $('cw').max = W; $('ch').max = H; $('cx').max = W - 1; $('cy').max = H - 1;
    $('size').textContent = 'Crop: ' + R.w + ' × ' + R.h + ' px of ' + W + ' × ' + H;
  }
  function rounded() {
    var x = clamp(Math.round(r.x), 0, W - 1), y = clamp(Math.round(r.y), 0, H - 1);
    return { x: x, y: y, w: clamp(Math.round(r.w), 1, W - x), h: clamp(Math.round(r.h), 1, H - y) };
  }

  // The biggest box of the chosen shape, kept around the current centre (or the whole picture).
  function fitAspect(keepCentre) {
    var a = ratio();
    if (!a) { r.w = clamp(r.w, 1, W); r.h = clamp(r.h, 1, H); r.x = clamp(r.x, 0, W - r.w); r.y = clamp(r.y, 0, H - r.h); return; }
    var cx = keepCentre ? r.x + r.w / 2 : W / 2, cy = keepCentre ? r.y + r.h / 2 : H / 2, w = W, h = W / a;
    if (h > H) { h = H; w = H * a; }
    if (keepCentre && r.w * r.h < w * h * .98) { var area = r.w * r.h; w = Math.min(w, Math.sqrt(area * a)); h = w / a; }
    r = { w: w, h: h, x: clamp(cx - w / 2, 0, W - w), y: clamp(cy - h / 2, 0, H - h) };
  }
  $('aspect').addEventListener('change', function () {
    if (!img) return;
    $('passRow').hidden = $('aspect').value !== '0.7777778';
    fitAspect(false); paint(); stale();
  });
  $('aspect').addEventListener('input', function () { $('passRow').hidden = $('aspect').value !== '0.7777778'; });

  // ---------- dragging (mouse, pen and touch through pointer events) ----------
  function at(e) { var b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / k, y: (e.clientY - b.top) / k }; }
  function start(e, d) {
    if (!img || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault(); e.stopPropagation();
    var p = at(e), o = { x: r.x, y: r.y, w: r.w, h: r.h };
    if (d === 'new') { p.x = clamp(p.x, 0, W); p.y = clamp(p.y, 0, H); o = { x: p.x, y: p.y, w: 0, h: 0 }; }
    drag = { d: d, p: p, o: o, id: e.pointerId, prev: { x: r.x, y: r.y, w: r.w, h: r.h } };
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    box.focus({ preventScroll: true });
  }
  Array.prototype.forEach.call(box.querySelectorAll('.cr-h'), function (h) { h.addEventListener('pointerdown', function (e) { start(e, h.dataset.d); }); });
  box.addEventListener('pointerdown', function (e) { if (e.target === box) start(e, 'move'); });
  wrap.addEventListener('pointerdown', function (e) { if (e.target === cv) start(e, 'new'); });
  wrap.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    e.preventDefault();
    var p = at(e), o = drag.o, d = drag.d, a = ratio();
    if (d === 'move') {
      r.x = clamp(o.x + p.x - drag.p.x, 0, W - o.w); r.y = clamp(o.y + p.y - drag.p.y, 0, H - o.h);
    } else if (d === 'new' || d.length === 2) {
      // a corner: the opposite corner stays put
      var ax, ay, sx, sy;
      if (d === 'new') { ax = o.x; ay = o.y; sx = p.x >= ax ? 1 : -1; sy = p.y >= ay ? 1 : -1; }
      else { sx = d.indexOf('e') >= 0 ? 1 : -1; sy = d.indexOf('s') >= 0 ? 1 : -1; ax = sx > 0 ? o.x : o.x + o.w; ay = sy > 0 ? o.y : o.y + o.h; }
      var mw = sx > 0 ? W - ax : ax, mh = sy > 0 ? H - ay : ay;
      var w = clamp((p.x - ax) * sx, MIN, mw), h = clamp((p.y - ay) * sy, MIN, mh);
      if (a) { w = Math.max(w, h * a); h = w / a; if (w > mw) { w = mw; h = w / a; } if (h > mh) { h = mh; w = h * a; } }
      r = { x: sx > 0 ? ax : ax - w, y: sy > 0 ? ay : ay - h, w: w, h: h };
    } else if (d === 'e' || d === 'w') {
      var left = d === 'e' ? o.x : o.x + o.w, ww = clamp(d === 'e' ? p.x - left : left - p.x, MIN, d === 'e' ? W - left : left), cy = o.y + o.h / 2, hh = o.h;
      if (a) { var mh2 = 2 * Math.min(cy, H - cy); hh = ww / a; if (hh > mh2) { hh = mh2; ww = hh * a; } }
      r = { x: d === 'e' ? left : left - ww, y: a ? cy - hh / 2 : o.y, w: ww, h: hh };
    } else {
      var top = d === 's' ? o.y : o.y + o.h, h2 = clamp(d === 's' ? p.y - top : top - p.y, MIN, d === 's' ? H - top : top), cx = o.x + o.w / 2, w2 = o.w;
      if (a) { var mw2 = 2 * Math.min(cx, W - cx); w2 = h2 * a; if (w2 > mw2) { w2 = mw2; h2 = w2 / a; } }
      r = { x: a ? cx - w2 / 2 : o.x, y: d === 's' ? top : top - h2, w: w2, h: h2 };
    }
    paint(); stale();
  });
  function end(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.d === 'new' && (r.w <= MIN || r.h <= MIN)) { r = drag.prev; paint(); }
    drag = null;
  }
  wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
  // Keep the page from scrolling while a finger drags the crop box (older iOS ignores touch-action).
  $('stage').addEventListener('touchmove', function (e) { if (drag) e.preventDefault(); }, { passive: false });
  box.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 10 : 1, m = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!m || !img) return;
    e.preventDefault(); r.x = clamp(r.x + m[0], 0, W - r.w); r.y = clamp(r.y + m[1], 0, H - r.h); paint(); stale();
  });

  // ---------- exact numbers ----------
  function typed(id) {
    var v = Math.round(+$(id).value), a = ratio();
    if (!isFinite(v) || $(id).value === '') return;
    if (id === 'cx') r.x = clamp(v, 0, W - r.w);
    else if (id === 'cy') r.y = clamp(v, 0, H - r.h);
    else if (id === 'cw') {
      var w = clamp(v, 1, W), h = a ? w / a : r.h;
      if (a && h > H) { h = H; w = h * a; }
      r.w = w; r.h = h; r.x = clamp(r.x, 0, W - w); r.y = clamp(r.y, 0, H - h);
    } else {
      var h3 = clamp(v, 1, H), w3 = a ? h3 * a : r.w;
      if (a && w3 > W) { w3 = W; h3 = w3 / a; }
      r.w = w3; r.h = h3; r.x = clamp(r.x, 0, W - w3); r.y = clamp(r.y, 0, H - h3);
    }
    stale();
  }
  ['cw', 'ch', 'cx', 'cy'].forEach(function (id) {
    $(id).addEventListener('input', function () { if (!img) return; typed(id); paint(id); });
    $(id).addEventListener('change', function () { if (!img) return; typed(id); paint(); });
  });

  // ---------- output ----------
  function fmtChanged() { $('qRow').hidden = $('fmt').value === 'image/png'; stale(); }
  $('fmt').addEventListener('change', fmtChanged); $('fmt').addEventListener('input', fmtChanged);
  $('q').addEventListener('input', function () { $('qv').textContent = $('q').value; stale(); });
  $('pass300').addEventListener('change', stale);
  $('go').addEventListener('click', function () {
    if (!img) return;
    var R = rounded(), type = $('fmt').value, ow = R.w, oh = R.h, mine = ++job;
    if ($('aspect').value === '0.7777778' && $('pass300').checked) { ow = 413; oh = 531; }
    var c = document.createElement('canvas'); c.width = ow; c.height = oh;
    var x = c.getContext('2d'), sx = ow / R.w, sy = oh / R.h;
    if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, ow, oh); }
    x.imageSmoothingQuality = 'high';
    x.setTransform(M[0] * sx, M[1] * sy, M[2] * sx, M[3] * sy, (M[4] - R.x) * sx, (M[5] - R.y) * sy);
    x.drawImage(img, 0, 0);
    $('go').disabled = true; say('', 'Cropping…');
    c.toBlob(function (b) {
      $('go').disabled = false;
      if (mine !== job) return;
      if (!b) return say('bad', 'Your browser could not save this format. Try JPG or PNG.');
      var ext = type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';
      if (type === 'image/webp' && b.type !== 'image/webp') { ext = 'png'; say('', ''); }
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(b);
      $('prev').src = url; $('prev').hidden = false;
      $('dl').href = url; $('dl').download = name + '-cropped-' + ow + 'x' + oh + '.' + ext; $('dl').hidden = false;
      say('ok', ow + ' × ' + oh + ' px · ' + ext.toUpperCase() + ' · ' + fmtBytes(b.size) + (ext === 'png' && type === 'image/webp' ? ' (this browser cannot make WebP, so it is a PNG)' : ''));
    }, type, $('q').value / 100);
  });

  function open(f) {
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name)) { say('bad', 'Please choose an image file.'); return; }
    say('', 'Opening…');
    loadImage(f, function (im) {
      if (!im || !(im.naturalWidth > 0)) { say('bad', 'This picture could not be opened. HEIC photos from iPhones need converting to JPG first.'); return; }
      img = im; name = (f.name.replace(/\.[^.]+$/, '') || 'image').replace(/[\\/:*?"<>|]+/g, '-');
      M = [1, 0, 0, 1, 0, 0]; W = im.naturalWidth; H = im.naturalHeight; r = { x: 0, y: 0, w: W, h: H };
      $('editor').hidden = false; $('go').disabled = false; stale();
      $('passRow').hidden = $('aspect').value !== '0.7777778'; $('qRow').hidden = $('fmt').value === 'image/png';
      if (ratio()) fitAspect(false); else r = { x: W * .1, y: H * .1, w: W * .8, h: H * .8 };
      layout();
      say('', f.name + ' · ' + W + ' × ' + H + ' px. Drag the box or its handles, or type exact numbers.');
    });
  }
  setupDrop('drop', 'file', function (f) { $('file').value = ''; open(f); });
  document.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) if (items[i].kind === 'file' && /^image\//.test(items[i].type)) { var f = items[i].getAsFile(); if (f) { e.preventDefault(); open(new File([f], 'pasted-image.png', { type: f.type })); return; } }
  });
  if (window.ResizeObserver) new ResizeObserver(function () { if (img && !drag) layout(); }).observe($('stage'));
  else window.addEventListener('resize', function () { if (img) layout(); });
})();
</script>
