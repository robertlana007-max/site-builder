<style>
.mm-ex { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.mm-ex button { font: 500 13px/1 var(--mono); border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.mm-ex button:hover { border-color: var(--accent); color: var(--accent); }
.mm-total { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; margin-top: 12px; font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }
.mm-total small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
.mm-total sub, .mm-total sup { font-size: .6em; }
.mm-bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; min-width: 60px; }
.mm-bar i { display: block; height: 100%; background: var(--accent); }
.mm-conv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
</style>
<label for="formula">Chemical formula</label>
<input type="text" id="formula" value="C6H12O6" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="for example H2O, Ca(OH)2, CuSO4·5H2O">
<div class="mm-ex" id="exs" aria-label="Examples"><button type="button">H2O</button><button type="button">NaCl</button><button type="button">CO2</button><button type="button">H2SO4</button><button type="button">Ca(OH)2</button><button type="button">C2H5OH</button><button type="button">CuSO4·5H2O</button><button type="button">K4[Fe(CN)6]</button><button type="button">(NH4)3PO4</button></div>
<p class="msg" id="msg"></p>
<div id="out" hidden>
  <div class="mm-total"><small id="tl">Molar mass</small><span id="tot"></span> g/mol</div>
  <div class="btns"><button class="btn ghost" id="cp" type="button">Copy molar mass</button></div>
  <h3>Element breakdown and percent composition</h3>
  <div class="scroll-x"><table class="sched"><thead><tr><th>Element</th><th>Atoms</th><th>Atomic mass</th><th>Total mass</th><th>Mass %</th><th></th></tr></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>
  <p class="msg" id="note"></p>
  <h3>Grams, moles and particles</h3>
  <div class="mm-conv">
    <div><label for="g">Mass (g)</label><input type="number" id="g" min="0" step="any" value="100"></div>
    <div><label for="mol">Amount (mol)</label><input type="number" id="mol" min="0" step="any"></div>
  </div>
  <div class="stats"><div class="stat"><span>Particles (molecules or formula units)</span><b id="part">–</b></div><div class="stat"><span>Atoms in total</span><b id="atoms">–</b></div></div>
</div>
<script src="../assets/chem.js"></script>
<script>
(function () {
  var NA = 6.02214076e23, M = 0, atomsPer = 0, timer, from = 'g';
  function msg(t, bad) { $('msg').className = 'msg' + (bad ? ' bad' : ''); $('msg').textContent = t || ''; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function sci(x) { if (!isFinite(x)) return '–'; if (x === 0) return '0'; var e = Math.floor(Math.log10(Math.abs(x))); if (e < 6 && e > -4) return fmtNum(x, 4); var m = x / Math.pow(10, e); return m.toFixed(4) + ' × 10' + String(e).replace(/\d|-/g, function (c) { return c === '-' ? '⁻' : '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]; }); }
  function conv() {
    if (!M) return;
    var g = parseFloat($('g').value), mol = parseFloat($('mol').value);
    if (from === 'g') { mol = g / M; $('mol').value = isFinite(mol) ? +mol.toPrecision(8) : ''; }
    else { g = mol * M; $('g').value = isFinite(g) ? +g.toPrecision(8) : ''; }
    var ok = isFinite(mol) && mol >= 0;
    $('part').textContent = ok ? sci(mol * NA) : '–';
    $('atoms').textContent = ok ? sci(mol * NA * atomsPer) : '–';
  }
  function run() {
    var src = $('formula').value;
    $('out').hidden = true; M = 0;
    if (!src.trim()) { msg('Type a chemical formula, like H2O or Ca(OH)2.'); return; }
    var p;
    try { p = Chem.parseFormula(src); } catch (e) { if (!(e instanceof Chem.Err)) throw e; msg(e.message, true); return; }
    msg('');
    var syms = Object.keys(p.counts).sort(function (a, b) { return Chem.EL[a].z - Chem.EL[b].z; });
    // Hill order: C first, then H, then the rest alphabetically
    if (p.counts.C) syms = ['C'].concat(p.counts.H ? ['H'] : [], syms.filter(function (x) { return x !== 'C' && x !== 'H'; }).sort());
    else syms.sort();
    M = Chem.molarMass(p.counts);
    atomsPer = syms.reduce(function (a, x) { return a + p.counts[x]; }, 0);
    $('tl').innerHTML = 'Molar mass of ' + Chem.pretty(src.trim());
    $('tot').textContent = M.toFixed(3);
    var unstable = [];
    $('tb').innerHTML = syms.map(function (x) {
      var e = Chem.EL[x], m = e.mass * p.counts[x], pc = m / M * 100;
      if (!e.stable) unstable.push(e.name);
      return '<tr><td>' + esc(e.name) + ' (' + x + ')</td><td>' + p.counts[x] + '</td><td>' + e.massTxt + '</td><td>' + m.toFixed(3) + '</td><td>' + pc.toFixed(3) + '%</td><td><div class="mm-bar"><i style="width:' + pc.toFixed(2) + '%"></i></div></td></tr>';
    }).join('');
    $('tf').innerHTML = '<tr><th>Total</th><th>' + atomsPer + '</th><th></th><th>' + M.toFixed(3) + '</th><th>100%</th><th></th></tr>';
    var notes = ['Uses IUPAC standard atomic weights, so results can differ from older textbooks in the second decimal place.'];
    if (unstable.length) notes.push(unstable.join(', ') + (unstable.length === 1 ? ' has' : ' have') + ' no stable isotope, so the mass number of the most stable isotope is used.');
    if (p.charge) notes.push('The charge (' + Math.abs(p.charge) + (p.charge > 0 ? '+' : '−') + ') changes the mass by only ' + (Math.abs(p.charge) * 0.000549).toFixed(5) + ' g/mol (the electrons), so it is ignored.');
    if (p.lead && p.lead > 1) notes.push('The ' + p.lead + ' in front multiplies the whole formula.');
    $('note').textContent = notes.join(' ');
    $('out').hidden = false;
    conv();
  }
  $('formula').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 150); });
  $('g').addEventListener('input', function () { from = 'g'; conv(); });
  $('mol').addEventListener('input', function () { from = 'mol'; conv(); });
  $('exs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('formula').value = b.textContent; run(); $('formula').dispatchEvent(new Event('change', { bubbles: true })); });
  $('cp').addEventListener('click', function () { if (M) copyText(M.toFixed(3) + ' g/mol', $('cp')); });
  run();
})();
</script>
