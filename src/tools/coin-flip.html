<style>
.cf-tabs { display: flex; justify-content: center; margin-bottom: 18px; }
.cf-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; perspective: 900px; margin: 6px 0 4px; }
.cf-coin { position: relative; width: 168px; height: 168px; transform-style: preserve-3d; }
.cf-coin.spin { transition: transform 1.1s cubic-bezier(.2, .7, .25, 1); }
.cf-face { position: absolute; inset: 0; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-weight: 800; letter-spacing: .06em; color: #5b3a05; border: 6px solid #c9971f; box-shadow: inset 0 0 0 4px #f6d77a, inset 0 -10px 20px rgba(120, 72, 0, .35); user-select: none; }
.cf-face b { font-size: 54px; line-height: 1; }
.cf-face span { font-size: 15px; margin-top: 6px; }
.cf-h { background: radial-gradient(circle at 35% 30%, #fff3c4, #f2c94c 45%, #d39b1c); }
.cf-t { background: radial-gradient(circle at 35% 30%, #f4f4f4, #c9ced6 45%, #8e959f); color: #2c3440; border-color: #8e959f; box-shadow: inset 0 0 0 4px #e5e8ec, inset 0 -10px 20px rgba(0, 0, 0, .25); transform: rotateY(180deg); }
.cf-res { font-size: clamp(28px, 7vw, 40px); font-weight: 800; letter-spacing: -.02em; min-height: 1.3em; text-align: center; margin: 4px 0 0; }
.cf-pop { animation: cfPop .35s ease-out; }
@keyframes cfPop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.cf-dice { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 76px; margin: 6px 0 4px; }
.cf-die { width: 68px; height: 68px; border-radius: 14px; background: var(--surface); border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; flex-direction: column; font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; position: relative; box-shadow: 0 3px 0 var(--line); }
.cf-die small { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1; margin-top: 2px; }
.cf-die.d6 { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 9px; gap: 2px; }
.cf-die.d6 i { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); place-self: center; }
.cf-die.roll { animation: cfRoll .5s ease-out; }
@keyframes cfRoll { 0% { transform: rotate(-200deg) scale(.6); opacity: .3; } 70% { transform: rotate(12deg) scale(1.05); } 100% { transform: none; } }
.cf-sum { text-align: center; font-size: 18px; margin: 6px 0 0; overflow-wrap: anywhere; }
.cf-sum b { font-size: 30px; }
.cf-hist { list-style: none; padding: 0; margin: 8px 0 0; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.cf-hist li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
.cf-hist li:last-child { border-bottom: 0; }
.cf-hist li span:first-child { overflow-wrap: anywhere; min-width: 0; }
.cf-hist li span:last-child { color: var(--muted); white-space: nowrap; }
.cf-pct { display: block; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.cf-bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 8px; display: flex; }
.cf-bar i { display: block; height: 100%; background: #d39b1c; }
.cf-bar i + i { background: #8e959f; }
@media (prefers-reduced-motion: reduce) { .cf-coin.spin { transition: none; } .cf-die.roll, .cf-pop { animation: none; } }
html[data-calm] .cf-coin.spin { transition: none; }
</style>
<div class="cf-tabs"><div class="seg" role="group" aria-label="Choose coin or dice"><button type="button" id="cfTabCoin" aria-pressed="true">Coin flip</button><button type="button" id="cfTabDice" aria-pressed="false">Dice roller</button></div></div>

<div id="cfCoinBox">
  <div class="cf-stage">
    <div class="cf-coin" id="cfCoin" aria-hidden="true"><div class="cf-face cf-h"><b>H</b><span>HEADS</span></div><div class="cf-face cf-t"><b>T</b><span>TAILS</span></div></div>
    <p class="cf-res" id="cfRes" aria-live="polite">Press Flip</p>
  </div>
  <div class="btns" style="justify-content:center"><button class="btn" id="cfFlip">Flip the coin</button><button class="btn ghost" id="cfFlip10">Flip 10 times</button><button class="btn ghost" id="cfFlip100">Flip 100 times</button></div>
  <div class="stats">
    <div class="stat"><span>Flips</span><b id="cfN">0</b></div>
    <div class="stat"><span>Heads</span><b id="cfH">0</b></div>
    <div class="stat"><span>Tails</span><b id="cfT">0</b></div>
    <div class="stat"><span>Longest streak</span><b id="cfStreak">0</b></div>
  </div>
  <div class="cf-bar" aria-hidden="true"><i id="cfBarH" style="width:50%"></i><i id="cfBarT" style="width:50%"></i></div>
</div>

<div id="cfDiceBox" hidden>
  <div class="fields">
    <div><label for="cfCount">Number of dice</label><select id="cfCount"></select></div>
    <div><label for="cfSides">Type of dice</label><select id="cfSides"><option value="4">d4 (4 sides)</option><option value="6" selected>d6 (6 sides, normal dice)</option><option value="8">d8 (8 sides)</option><option value="10">d10 (10 sides)</option><option value="12">d12 (12 sides)</option><option value="20">d20 (20 sides)</option><option value="100">d100 (1 to 100)</option></select></div>
  </div>
  <div class="cf-dice" id="cfDice" aria-hidden="true"></div>
  <p class="cf-sum" id="cfSum" aria-live="polite">Press Roll</p>
  <div class="btns" style="justify-content:center"><button class="btn" id="cfRoll">Roll the dice</button></div>
  <div class="stats">
    <div class="stat"><span>Rolls</span><b id="cfRolls">0</b></div>
    <div class="stat"><span>Average total</span><b id="cfAvg">–</b></div>
    <div class="stat"><span>Expected average</span><b id="cfExp">–</b></div>
    <div class="stat"><span>Highest total</span><b id="cfMax">–</b></div>
  </div>
  <p class="msg" id="cfDiceNote"></p>
</div>

<div class="checks" style="margin-top:16px"><label><input type="checkbox" id="snd" checked>Sound effects</label></div>
<h3 style="font-size:17px;margin:12px 0 0">History</h3>
<ul class="cf-hist" id="cfHist"></ul>
<p class="msg" id="cfHistNone">Nothing yet. Your last 50 results appear here.</p>
<div class="btns"><button class="btn ghost" id="cfClear">Clear history and statistics</button></div>
<script>
(function () {
  // Fair random whole number from 0 to n-1, using the browser's cryptographic generator.
  // Values in the top, incomplete block of 2^32 are thrown away (rejection sampling), so every result is exactly equally likely.
  function randInt(n) {
    var lim = 4294967296 - (4294967296 % n), b = new Uint32Array(1);
    do { crypto.getRandomValues(b); } while (b[0] >= lim);
    return b[0] % n;
  }
  var KEY = 'gtn-coinflip';
  var calmMQ = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  function calm() { return (calmMQ && calmMQ.matches) || document.documentElement.hasAttribute('data-calm'); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  var D = load();
  var st = {
    h: D.h | 0, t: D.t | 0, run: D.run | 0, runSide: D.runSide || '', best: D.best | 0,
    rolls: D.rolls | 0, totalSum: +D.totalSum || 0, totalExp: +D.totalExp || 0, maxTot: D.maxTot || null,
    hist: Array.isArray(D.hist) ? D.hist.slice(0, 50) : [], tab: D.tab === 'dice' ? 'dice' : 'coin'
  };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  // ---------- sound ----------
  var ctx = null;
  function ac() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ctx.state === 'suspended') ctx.resume().catch(function () {}); return ctx; }
  function ting(delay) {
    if (!$('snd').checked || !ac()) return;
    var t = ctx.currentTime + (delay || 0);
    [2100, 3150].forEach(function (f, i) { var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(i ? 0.05 : 0.12, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.62); });
  }
  function clatter() {
    if (!$('snd').checked || !ac()) return;
    for (var k = 0; k < 6; k++) {
      var t = ctx.currentTime + k * 0.07 + Math.random() * 0.03, len = Math.floor(ctx.sampleRate * 0.03), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 1500; g.gain.value = 0.5 * (1 - k / 7);
      s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t);
    }
  }

  // ---------- history ----------
  function addHist(text) {
    st.hist.unshift([text, Date.now()]); if (st.hist.length > 50) st.hist.length = 50;
  }
  function paintHist() {
    var ul = $('cfHist'); ul.innerHTML = '';
    st.hist.forEach(function (h) {
      var li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('span');
      a.textContent = h[0]; b.textContent = new Date(h[1]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      li.appendChild(a); li.appendChild(b); ul.appendChild(li);
    });
    ul.hidden = !st.hist.length; $('cfHistNone').hidden = !!st.hist.length;
  }

  // ---------- coin ----------
  var angle = 0, busy = false;
  function pct(a, n) { return n ? fmtNum(a / n * 100, 1) + '%' : '0%'; }
  function paintCoin() {
    var n = st.h + st.t;
    $('cfN').textContent = fmtNum(n, 0);
    [['cfH', st.h], ['cfT', st.t]].forEach(function (x) { var el = $(x[0]), sm = document.createElement('small'); el.textContent = fmtNum(x[1], 0); sm.className = 'cf-pct'; sm.textContent = pct(x[1], n); el.appendChild(sm); });
    $('cfStreak').textContent = fmtNum(st.best, 0);
    $('cfBarH').style.width = (n ? st.h / n * 100 : 50) + '%'; $('cfBarT').style.width = (n ? st.t / n * 100 : 50) + '%';
  }
  function record(side) {
    if (side) st.h++; else st.t++;
    var s = side ? 'H' : 'T';
    if (st.runSide === s) st.run++; else { st.runSide = s; st.run = 1; }
    if (st.run > st.best) st.best = st.run;
  }
  function showSide(side, text) {
    var r = $('cfRes'); r.textContent = text; r.classList.remove('cf-pop'); void r.offsetWidth; if (!calm()) r.classList.add('cf-pop');
  }
  function setCoin(side, animate) {
    var coin = $('cfCoin');
    // always turn forward: whole turns plus a half turn when the result is tails
    var base = Math.ceil(angle / 360) * 360 + (animate ? 1800 : 0);
    angle = base + (side ? 0 : 180);
    coin.classList.toggle('spin', animate);
    coin.style.transform = 'rotateY(' + angle + 'deg)';
  }
  function flip() {
    if (busy) return;
    var side = randInt(2) === 1, anim = !calm();
    record(side); addHist(side ? 'Coin: Heads' : 'Coin: Tails'); save();
    if (!anim) { setCoin(side, false); showSide(side, side ? 'Heads' : 'Tails'); ting(0); paintCoin(); paintHist(); return; }
    busy = true; $('cfFlip').disabled = true; $('cfRes').textContent = 'Flipping…';
    setCoin(side, true); ting(0);
    setTimeout(function () { busy = false; $('cfFlip').disabled = false; showSide(side, side ? 'Heads' : 'Tails'); ting(0); paintCoin(); paintHist(); }, 1150);
  }
  function many(n) {
    if (busy) return;
    var h = 0;
    for (var i = 0; i < n; i++) { var s = randInt(2) === 1; if (s) h++; record(s); }
    addHist('Coin × ' + n + ': ' + h + ' heads, ' + (n - h) + ' tails'); save();
    setCoin(st.runSide === 'H', false);
    showSide(null, h + ' heads · ' + (n - h) + ' tails'); ting(0); paintCoin(); paintHist();
  }
  $('cfFlip').addEventListener('click', flip);
  $('cfFlip10').addEventListener('click', function () { many(10); });
  $('cfFlip100').addEventListener('click', function () { many(100); });
  $('cfCoin').addEventListener('click', flip);

  // ---------- dice ----------
  for (var i = 1; i <= 10; i++) { var o = document.createElement('option'); o.value = i; o.textContent = i + (i === 1 ? ' die' : ' dice'); if (i === 2) o.selected = true; $('cfCount').appendChild(o); }
  var PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function dieEl(v, sides, anim) {
    var d = document.createElement('div'); d.className = 'cf-die' + (sides === 6 ? ' d6' : '') + (anim ? ' roll' : '');
    if (sides === 6) { for (var c = 1; c <= 9; c++) { var p = document.createElement('i'); if (PIPS[v].indexOf(c) < 0) p.style.visibility = 'hidden'; d.appendChild(p); } }
    else { d.textContent = v; var s = document.createElement('small'); s.textContent = 'd' + sides; d.appendChild(s); }
    if (anim) d.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
    return d;
  }
  function paintDiceStats() {
    $('cfRolls').textContent = fmtNum(st.rolls, 0);
    $('cfAvg').textContent = st.rolls ? fmtNum(st.totalSum / st.rolls, 2) : '–';
    $('cfExp').textContent = st.rolls ? fmtNum(st.totalExp / st.rolls, 2) : '–';
    $('cfMax').textContent = st.maxTot == null ? '–' : fmtNum(st.maxTot, 0);
    var n = +$('cfCount').value, s = +$('cfSides').value;
    $('cfDiceNote').textContent = 'With ' + n + ' × d' + s + ' the total can be ' + n + ' to ' + n * s + ', and the long-run average is ' + fmtNum(n * (s + 1) / 2, 1) + '.';
  }
  function roll() {
    var n = Math.min(10, Math.max(1, +$('cfCount').value || 1)), s = +$('cfSides').value || 6, vals = [], sum = 0;
    for (var i = 0; i < n; i++) { var v = randInt(s) + 1; vals.push(v); sum += v; }
    st.rolls++; st.totalSum += sum; st.totalExp += n * (s + 1) / 2; if (st.maxTot == null || sum > st.maxTot) st.maxTot = sum;
    addHist(n + 'd' + s + ': ' + (n > 1 ? vals.join(' + ') + ' = ' + sum : String(sum))); save();
    var box = $('cfDice'), anim = !calm(); box.innerHTML = '';
    vals.forEach(function (v) { box.appendChild(dieEl(v, s, anim)); });
    $('cfSum').innerHTML = '';
    var b = document.createElement('b'); b.textContent = sum;
    $('cfSum').appendChild(document.createTextNode(n > 1 ? 'Total: ' : 'You rolled ')); $('cfSum').appendChild(b);
    if (n > 1) $('cfSum').appendChild(document.createTextNode('  (' + vals.join(' + ') + ')'));
    clatter(); paintDiceStats(); paintHist();
  }
  $('cfRoll').addEventListener('click', roll);
  ['cfCount', 'cfSides'].forEach(function (id) { $(id).addEventListener('change', paintDiceStats); $(id).addEventListener('input', paintDiceStats); });

  // ---------- tabs, keyboard, reset ----------
  function tab(t) {
    st.tab = t; save();
    $('cfCoinBox').hidden = t !== 'coin'; $('cfDiceBox').hidden = t !== 'dice';
    $('cfTabCoin').setAttribute('aria-pressed', t === 'coin'); $('cfTabDice').setAttribute('aria-pressed', t === 'dice');
  }
  $('cfTabCoin').addEventListener('click', function () { tab('coin'); });
  $('cfTabDice').addEventListener('click', function () { tab('dice'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== ' ' || e.repeat || /^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test((e.target || {}).tagName || '')) return;
    e.preventDefault(); if (st.tab === 'coin') flip(); else roll();
  });
  $('cfClear').addEventListener('click', function () {
    st.h = st.t = st.run = st.best = st.rolls = 0; st.runSide = ''; st.totalSum = st.totalExp = 0; st.maxTot = null; st.hist = []; save();
    $('cfRes').textContent = 'Press Flip'; $('cfDice').innerHTML = ''; $('cfSum').textContent = 'Press Roll';
    paintCoin(); paintDiceStats(); paintHist();
  });
  tab(st.tab); paintCoin(); paintDiceStats(); paintHist();
})();
</script>
