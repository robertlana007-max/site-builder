<div class="out" id="pw" aria-live="polite"></div>
<div class="meter"><i id="bar"></i></div>
<p class="msg" id="str"></p>
<div class="fields">
  <div><label for="len">Length: <span id="lv">16</span></label><input type="range" id="len" min="6" max="64" value="16"></div>
</div>
<div class="checks">
  <label><input type="checkbox" id="up" checked>Uppercase (A-Z)</label>
  <label><input type="checkbox" id="lo" checked>Lowercase (a-z)</label>
  <label><input type="checkbox" id="nu" checked>Numbers (0-9)</label>
  <label><input type="checkbox" id="sy" checked>Symbols (!@#$)</label>
  <label><input type="checkbox" id="amb">Skip look-alikes (0 O 1 l I)</label>
</div>
<div class="btns"><button class="btn" id="gen">Generate new</button><button class="btn ghost" id="cp">Copy</button></div>
<script>
(function () {
  var SETS = { up: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lo: 'abcdefghijklmnopqrstuvwxyz', nu: '0123456789', sy: '!@#$%^&*()-_=+[]{};:,.?' };
  function rand(n) { // unbiased random integer in [0, n)
    var max = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
    do { crypto.getRandomValues(a); } while (a[0] >= max);
    return a[0] % n;
  }
  function gen() {
    var sets = [];
    Object.keys(SETS).forEach(function (k) {
      if (!$(k).checked) return;
      var s = SETS[k];
      if ($('amb').checked) s = s.replace(/[0O1lI]/g, '');
      sets.push(s);
    });
    if (!sets.length) { $('lo').checked = true; return gen(); }
    var len = +$('len').value, all = sets.join(''), out = [];
    sets.forEach(function (s) { out.push(s[rand(s.length)]); }); // at least one from each chosen set
    while (out.length < len) out.push(all[rand(all.length)]);
    for (var i = out.length - 1; i > 0; i--) { var j = rand(i + 1), t = out[i]; out[i] = out[j]; out[j] = t; }
    $('pw').textContent = out.slice(0, len).join('');
    var bits = Math.round(len * Math.log2(all.length));
    var label = bits < 50 ? 'Weak' : bits < 75 ? 'Fair' : bits < 100 ? 'Strong' : 'Very strong';
    $('bar').style.width = Math.min(100, bits / 1.28) + '%';
    $('str').textContent = label + ' · about ' + bits + ' bits of entropy';
  }
  $('len').addEventListener('input', function () { $('lv').textContent = $('len').value; gen(); });
  ['up', 'lo', 'nu', 'sy', 'amb'].forEach(function (id) { $(id).addEventListener('change', gen); });
  $('gen').addEventListener('click', gen);
  $('cp').addEventListener('click', function () { copyText($('pw').textContent, $('cp')); });
  gen();
})();
</script>
