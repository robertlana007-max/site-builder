<style>
.ytc .ytc-count { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.ytc .ytc-count b.over { color: var(--bad); }
.ytc textarea { font-family: inherit; font-size: 15px; min-height: 150px; }
.ytc .ytc-score { display: flex; align-items: center; gap: 14px; margin: 16px 0 8px; }
.ytc .ytc-ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 800 20px/1 system-ui, sans-serif; background: conic-gradient(var(--c, var(--ok)) calc(var(--p) * 1%), var(--line) 0); position: relative; flex: none; }
.ytc .ytc-ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
.ytc .ytc-ring span { position: relative; }
.ytc .ytc-checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.ytc .ytc-checks li { padding: 8px 10px 8px 34px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); position: relative; font-size: 14.5px; }
.ytc .ytc-checks li::before { position: absolute; left: 10px; top: 8px; font-weight: 800; }
.ytc .ytc-checks li.ok::before { content: '✓'; color: var(--ok); }
.ytc .ytc-checks li.warn::before { content: '!'; color: #b7791f; }
.ytc .ytc-checks li.bad::before { content: '✕'; color: var(--bad); }
.ytc .ytc-views { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 10px; }
.ytc .ytc-views button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; min-height: 38px; }
.ytc .ytc-views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ytc .ytc-pv { background: #fff; color: #0f0f0f; border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: hidden; font-family: Roboto, Arial, sans-serif; }
.ytc .ytc-pv.dark { background: #0f0f0f; color: #f1f1f1; }
.ytc .ytc-thumb { background: linear-gradient(135deg, #8a9bb0, #c4ccd6); border-radius: 12px; aspect-ratio: 16/9; position: relative; overflow: hidden; flex: none; }
.ytc .ytc-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ytc .ytc-thumb i { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font: 500 12px/1 Roboto, Arial, sans-serif; padding: 3px 4px; border-radius: 4px; font-style: normal; }
.ytc .ytc-t { font-weight: 500; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ytc .ytc-meta { color: #606060; font-size: 12px; margin-top: 4px; }
.ytc .ytc-pv.dark .ytc-meta { color: #aaa; }
.ytc .ytc-d { color: #606060; font-size: 12px; margin-top: 8px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.ytc .ytc-pv.dark .ytc-d { color: #aaa; }
.ytc .v-search { display: flex; gap: 16px; width: 760px; max-width: none; }
.ytc .v-search .ytc-thumb { width: 360px; }
.ytc .v-search .ytc-t { font-size: 18px; line-height: 26px; -webkit-line-clamp: 2; }
.ytc .v-mobile { width: 360px; max-width: 100%; margin: 0 auto; }
.ytc .v-mobile .ytc-thumb { border-radius: 0; margin: -14px -14px 10px; }
.ytc .v-mobile .ytc-row { display: flex; gap: 10px; }
.ytc .v-mobile .ytc-av { width: 36px; height: 36px; border-radius: 50%; background: #c4ccd6; flex: none; }
.ytc .v-mobile .ytc-t { font-size: 14px; line-height: 20px; -webkit-line-clamp: 2; }
.ytc .v-side { display: flex; gap: 8px; width: 402px; max-width: 100%; }
.ytc .v-side .ytc-thumb { width: 168px; border-radius: 8px; }
.ytc .v-side .ytc-t { font-size: 14px; line-height: 20px; -webkit-line-clamp: 2; }
.ytc .v-watch .ytc-thumb { border-radius: 12px; max-width: 640px; }
.ytc .v-watch .ytc-t { font-size: 20px; line-height: 28px; font-weight: 700; margin-top: 12px; -webkit-line-clamp: 3; }
.ytc .v-watch .ytc-box { background: rgba(0,0,0,.05); border-radius: 12px; padding: 12px; margin-top: 12px; font-size: 14px; line-height: 20px; }
.ytc .ytc-pv.dark .v-watch .ytc-box { background: rgba(255,255,255,.1); }
.ytc .v-watch .ytc-tags { color: #065fd4; font-size: 14px; margin-top: 10px; }
.ytc .ytc-pv.dark .v-watch .ytc-tags { color: #3ea6ff; }
.ytc .v-watch .ytc-desc { white-space: pre-wrap; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.ytc .ytc-scroll { overflow-x: auto; }
.ytc .ytc-note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
</style>
<div class="ytc" id="ytc">
<label for="ycTitle">Video title</label>
<input type="text" id="ycTitle" data-nomemo maxlength="200" placeholder="e.g. How I Grew Tomatoes on a Tiny Balcony (Full Guide)">
<div class="ytc-count"><span>YouTube allows 100 characters. About 60–70 show in full on most screens.</span><b id="ycTN">0 / 100</b></div>
<div class="fields">
  <div><label for="ycKey">Main keyword</label><input type="text" id="ycKey" data-nomemo maxlength="80" placeholder="e.g. balcony tomatoes"></div>
  <div><label for="ycChan">Channel name (for the preview)</label><input type="text" id="ycChan" data-nomemo maxlength="40" placeholder="Your channel"></div>
  <div><label for="ycThumb">Thumbnail (optional)</label><input type="file" id="ycThumb" data-nomemo accept="image/*" style="max-width:100%"></div>
</div>
<p class="msg" id="ycMsg" role="status" aria-live="polite" style="margin-top:0"></p>
<label for="ycDesc">Description</label>
<textarea id="ycDesc" data-nomemo maxlength="6000" placeholder="Start with one or two sentences that say what the video is about, using your keyword. Add chapters (0:00 Intro), links and up to 3 key hashtags."></textarea>
<div class="ytc-count"><span>The first 2–3 lines show before "more". Limit: 5,000 characters.</span><b id="ycDN">0 / 5,000</b></div>
<div class="ytc-score"><div class="ytc-ring" id="ycRing" style="--p:0"><span id="ycScore">0</span></div><div><b id="ycGrade">Type a title to check it</b><div class="ytc-note">Checks are guides from YouTube's published limits and common practice. A great video still matters most.</div></div></div>
<ul class="ytc-checks" id="ycChecks"></ul>
<div class="ytc-views" id="ycViews"><button type="button" data-v="mobile" aria-pressed="true">Phone home feed</button><button type="button" data-v="search" aria-pressed="false">Computer search</button><button type="button" data-v="side" aria-pressed="false">Suggested videos</button><button type="button" data-v="watch" aria-pressed="false">Watch page</button><button type="button" data-v="dark" aria-pressed="false">Dark mode</button></div>
<div class="ytc-scroll"><div class="ytc-pv" id="ycPv"></div></div>
<p class="ytc-note" id="ycCut"></p>
<div class="btns"><button type="button" class="btn ghost" id="ycCopyT">Copy title</button><button type="button" class="btn ghost" id="ycCopyD">Copy description</button></div>
</div>
<script>
(function () {
  'use strict';
  var view = 'mobile', dark = false, thumb = null, KEY = 'gtnYtTitleCheck';
  var seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter() : null;
  function len(t) { if (!seg) return Array.from(t).length; var n = 0; for (var x of seg.segment(t)) n++; return n; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fold(t) { return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
  var EMO = /\p{Extended_Pictographic}/gu;
  function checks(t, d, k) {
    var c = [], tl = len(t), dl = len(d), ft = fold(t), fk = fold(k), fd = fold(d);
    if (!t.trim()) return [['bad', 'Add a title.', 0]];
    if (tl > 100) c.push(['bad', 'The title is ' + tl + ' characters. YouTube allows 100, so shorten it.', 0]);
    else if (tl > 70) c.push(['warn', 'The title is ' + tl + ' characters. The end will be cut off in most places. Put the important words first.', 6]);
    else if (tl < 20) c.push(['warn', 'The title is short (' + tl + ' characters). Add words people would search for.', 7]);
    else c.push(['ok', 'Good length: ' + tl + ' characters.', 15]);
    if (/[<>]/.test(t)) c.push(['bad', 'YouTube does not allow < or > in titles.', 0]);
    if (fk) {
      var i = ft.indexOf(fk);
      if (i < 0) { var parts = fk.split(' '), hit = parts.filter(function (p) { return p && ft.indexOf(p) >= 0; }).length; c.push([hit ? 'warn' : 'bad', hit ? 'Only part of your keyword is in the title. Use the exact phrase if it reads naturally.' : 'Your keyword "' + k.trim() + '" is not in the title.', hit ? 7 : 0]); }
      else if (i <= Math.max(10, ft.length * 0.4)) c.push(['ok', 'The keyword is near the start of the title.', 20]);
      else c.push(['warn', 'The keyword is in the title but late. Move it closer to the start.', 12]);
      if (!d.trim()) {} else if (fold(d.slice(0, 160)).indexOf(fk) >= 0) c.push(['ok', 'The keyword is in the first lines of the description.', 10]);
      else if (fd.indexOf(fk) >= 0) c.push(['warn', 'Use the keyword in the first one or two sentences of the description, not only later.', 5]);
      else c.push(['bad', 'The description does not mention your keyword.', 0]);
    } else c.push(['warn', 'Add your main keyword above to check where it appears.', 5]);
    var caps = (t.match(/\b[A-Z]{4,}\b/g) || []).length;
    if (caps > 2 || (tl > 10 && t === t.toUpperCase() && /[A-Z]/.test(t))) c.push(['warn', 'Lots of CAPITAL words can look like shouting. Use them for one word at most.', 3]);
    else c.push(['ok', 'Capital letters are used sensibly.', 8]);
    if (/[!?]{2,}|\.{4,}/.test(t)) c.push(['warn', 'Avoid repeated punctuation like "!!!" or "???".', 2]); else c.push(['ok', 'No repeated punctuation.', 5]);
    var em = 0; if (seg) { for (var sg of seg.segment(t)) if (/\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(sg.segment)) em++; } else em = (t.match(EMO) || []).length; /* a family or flag emoji counts once */ if (em > 2) c.push(['warn', em + ' emojis in the title. One or two is plenty.', 2]); else c.push(['ok', em ? 'Emoji use is light.' : 'No emojis (fine for search).', 5]);
    if (/\d/.test(t)) c.push(['ok', 'A number in the title (like "5 tips" or a year) often helps people click.', 5]);
    var th = (t.match(/#[\p{L}\p{N}_]+/gu) || []).length; if (th) c.push(['warn', th + ' hashtag' + (th > 1 ? 's' : '') + ' in the title. Hashtags fit better in the description.', 0]);
    // description
    if (!d.trim()) c.push(['bad', 'Add a description. It helps people and search understand the video.', 0]);
    else if (dl > 5000) c.push(['bad', 'The description is ' + dl.toLocaleString() + ' characters. The limit is 5,000.', 0]);
    else if (d.trim().split(/\s+/).length < 60) c.push(['warn', 'The description is short. Aim for at least 100 to 200 words: what the video covers, chapters and links.', 6]);
    else c.push(['ok', 'The description has a useful length.', 12]);
    var tags = d.match(/(^|\s)#[\p{L}\p{N}_]+/gu) || [];
    if (tags.length > 15) c.push(['bad', tags.length + ' hashtags in the description. With more than 15, YouTube ignores all of them.', 0]);
    else if (tags.length) c.push(['ok', tags.length + ' hashtag' + (tags.length > 1 ? 's' : '') + '. The first 3 can show above the title.', 4]);
    var stamps = d.match(/^\s*\(?(\d{1,2}:)?\d{1,2}:\d{2}\)?\s+\S/gm) || [];
    if (stamps.length) { var first = /^\s*\(?(0{1,2}:)?0{1,2}:00/.test(stamps[0]); c.push([first && stamps.length >= 3 ? 'ok' : 'warn', first && stamps.length >= 3 ? 'Chapters found (' + stamps.length + '). They will show on the progress bar.' : 'For chapters, start with 0:00 and list at least 3 timestamps, each 10 seconds or more apart.', first && stamps.length >= 3 ? 4 : 1]); }
    return c;
  }
  function views() { return '<div class="ytc-meta">' + esc($('ycChan').value.trim() || 'Your channel') + ' · 12K views · 2 days ago</div>'; }
  function thumbHtml() { return '<div class="ytc-thumb">' + (thumb ? '<img src="' + thumb + '" alt="Your thumbnail">' : '') + '<i>12:34</i></div>'; }
  function preview(t, d) {
    var T = '<div class="ytc-t" id="ycT">' + esc(t || 'Your video title will show here') + '</div>', first = esc(d.split('\n').filter(function (x) { return x.trim(); }).join(' ').slice(0, 300));
    var tagLine = (d.match(/(^|\s)#[\p{L}\p{N}_]+/gu) || []).slice(0, 3).map(function (x) { return esc(x.trim()); }).join(' ');
    var h;
    if (view === 'search') h = '<div class="v-search">' + thumbHtml() + '<div style="min-width:0">' + T + views() + '<div class="ytc-d">' + (first || 'Your description starts here.') + '</div></div></div>';
    else if (view === 'side') h = '<div class="v-side">' + thumbHtml() + '<div style="min-width:0">' + T + views() + '</div></div>';
    else if (view === 'watch') h = '<div class="v-watch">' + thumbHtml() + (tagLine ? '<div class="ytc-tags">' + tagLine + '</div>' : '') + T + '<div class="ytc-box"><b>12K views · 2 days ago</b><div class="ytc-desc">' + esc(d || 'Your description starts here.') + '</div><b>…more</b></div></div>';
    else h = '<div class="v-mobile">' + thumbHtml() + '<div class="ytc-row"><div class="ytc-av"></div><div style="min-width:0">' + T + views() + '</div></div></div>';
    $('ycPv').innerHTML = h; $('ycPv').classList.toggle('dark', dark);
    // find where the title is cut off in this view
    var el = $('ycT'); if (!t) { $('ycCut').textContent = ''; return; }
    if (el.scrollHeight <= el.clientHeight + 1) { $('ycCut').textContent = 'The whole title shows in this view.'; return; }
    var chars = Array.from(t), lo = 0, hi = chars.length;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; el.textContent = chars.slice(0, mid).join('') + '…'; if (el.scrollHeight <= el.clientHeight + 1) lo = mid; else hi = mid - 1; }
    el.textContent = t;
    $('ycCut').textContent = 'In this view the title is cut after about ' + lo + ' characters: "' + chars.slice(0, lo).join('').trim() + '…"';
  }
  var timer = null;
  function run() {
    var t = $('ycTitle').value, d = $('ycDesc').value, k = $('ycKey').value, tl = len(t), dl = len(d);
    $('ycTN').textContent = tl + ' / 100'; $('ycTN').className = tl > 100 ? 'over' : '';
    $('ycDN').textContent = dl.toLocaleString() + ' / 5,000'; $('ycDN').className = dl > 5000 ? 'over' : '';
    var c = checks(t, d, k), max = 100, got = c.reduce(function (s, x) { return s + x[2]; }, 0);
    var score = t.trim() ? Math.max(0, Math.min(100, Math.round(got / 0.89))) : 0;
    if (c.some(function (x) { return x[0] === 'bad'; })) score = Math.min(score, 60);
    $('ycScore').textContent = score; $('ycRing').style.setProperty('--p', score); $('ycRing').style.setProperty('--c', score >= 80 ? 'var(--ok)' : score >= 55 ? '#d69e2e' : 'var(--bad)');
    $('ycGrade').textContent = !t.trim() ? 'Type a title to check it' : score >= 80 ? 'Great: ready to publish' : score >= 55 ? 'Good, with a few things to improve' : 'Needs work';
    $('ycChecks').innerHTML = c.map(function (x) { return '<li class="' + x[0] + '">' + esc(x[1]) + '</li>'; }).join('');
    preview(t, d);
    clearTimeout(timer); timer = setTimeout(function () { try { localStorage.setItem(KEY, JSON.stringify({ t: t, d: d.slice(0, 6000), k: k, c: $('ycChan').value })); } catch (e) {} }, 400);
  }
  ['ycTitle', 'ycDesc', 'ycKey', 'ycChan'].forEach(function (id) { $(id).addEventListener('input', run); });
  $('ycViews').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v === 'dark') { dark = !dark; b.setAttribute('aria-pressed', String(dark)); }
    else { view = b.dataset.v; document.querySelectorAll('#ycViews button:not([data-v=dark])').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }
    run();
  });
  $('ycThumb').addEventListener('change', function () {
    var f = this.files[0], m = $('ycMsg'); if (!f) return;
    function bad() { m.className = 'msg bad'; m.textContent = '"' + f.name + '" could not be opened as a picture. Choose a JPG, PNG or WebP thumbnail.'; }
    if (!/^image\//.test(f.type)) { this.value = ''; return bad(); }
    var u = URL.createObjectURL(f), im = new Image();
    im.onload = function () { if (thumb) URL.revokeObjectURL(thumb); thumb = u; m.className = 'msg'; m.textContent = im.naturalWidth && Math.abs(im.naturalWidth / im.naturalHeight - 16 / 9) > 0.05 ? 'Tip: YouTube thumbnails are 16:9 (for example 1280 × 720). Yours is ' + im.naturalWidth + ' × ' + im.naturalHeight + ', so it is cropped in the preview.' : ''; run(); };
    im.onerror = function () { URL.revokeObjectURL(u); bad(); };
    im.src = u;
  });
  $('ycCopyT').addEventListener('click', function () { copyText($('ycTitle').value, this); });
  $('ycCopyD').addEventListener('click', function () { copyText($('ycDesc').value, this); });
  window.addEventListener('resize', function () { clearTimeout(timer); timer = setTimeout(run, 150); });
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s) { $('ycTitle').value = s.t || ''; $('ycDesc').value = s.d || ''; $('ycKey').value = s.k || ''; $('ycChan').value = s.c || ''; } } catch (e) {}
  run();
})();
</script>
