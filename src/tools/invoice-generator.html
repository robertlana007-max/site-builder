<style>
.ivg fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.ivg legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.ivg .fields { margin-bottom: 12px; }
.ivg textarea { min-height: 76px; font-family: inherit; font-size: 15px; }
.ivg input[type=color] { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 4px; }
.ivg [aria-invalid="true"] { border-color: var(--bad) !important; box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 20%, transparent); }
.ivg .ivg-hint { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 400; }
.ivg .ivg-logo-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ivg .ivg-logo-box img { max-height: 44px; max-width: 120px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 2px; }
.ivg .ivg-items-head, .ivg .ivg-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px 104px 108px 128px; gap: 8px; align-items: center; }
.ivg .ivg-items-head { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.ivg .ivg-items-head span:nth-child(n+2) { text-align: end; }
.ivg .ivg-row { padding: 8px 0; border-top: 1px solid var(--line); }
.ivg .ivg-row input { text-align: end; }
.ivg .ivg-row input.ivg-d { text-align: start; }
.ivg .ivg-amt { text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ivg .ivg-tools { display: flex; gap: 4px; justify-content: flex-end; }
.ivg .ivg-tools button { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; cursor: pointer; font: inherit; font-size: 17px; line-height: 1; padding: 0; }
.ivg .ivg-tools button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.ivg .ivg-tools button[disabled] { opacity: .35; cursor: default; }
.ivg .ivg-add { margin: 6px 0 12px; }
.ivg .ivg-check { display: flex; align-items: center; font-weight: 400; margin: 0 0 12px; }
.ivg .stats { margin: 0 0 14px; }
.ivg-wrapprev { margin-top: 18px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); padding: 14px; }
.ivg-wrapprev > b { display: block; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
.ivg-paper { --ivg-acc: #2563eb; background: #fff; color: #1f2937; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 32px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif; overflow-wrap: anywhere; max-width: 820px; margin: 0 auto; }
.ivg-paper .ivg-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.ivg-paper .ivg-top img { max-width: 180px; max-height: 70px; display: block; }
.ivg-paper .ivg-bizbig { font-size: 18px; font-weight: 700; }
.ivg-paper h2 { margin: 0; font-size: 26px; letter-spacing: .06em; color: var(--ivg-acc); text-align: end; }
.ivg-paper .ivg-meta { display: grid; grid-template-columns: auto auto; gap: 1px 14px; margin-top: 6px; font-size: 12.5px; justify-content: end; }
.ivg-paper .ivg-meta span { color: #6b7280; }
.ivg-paper .ivg-meta b { text-align: end; font-weight: 600; }
.ivg-paper .ivg-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 24px 0 18px; }
.ivg-paper .ivg-parties small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; color: #6b7280; font-weight: 700; margin-bottom: 2px; }
.ivg-paper .ivg-parties div div { white-space: pre-line; }
.ivg-paper table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ivg-paper .ivg-items th { background: var(--ivg-acc); color: #fff; font-size: 11.5px; font-weight: 600; text-align: end; padding: 7px 8px; }
.ivg-paper .ivg-items th:first-child, .ivg-paper .ivg-items td:first-child { text-align: start; }
.ivg-paper .ivg-items td { padding: 7px 8px; border-bottom: 1px solid #e5e7eb; text-align: end; vertical-align: top; }
.ivg-paper .ivg-items td:first-child { white-space: pre-line; }
.ivg-paper .ivg-items th:not(:first-child), .ivg-paper .ivg-items td:not(:first-child) { white-space: nowrap; overflow-wrap: normal; }
.ivg-paper .ivg-scroll { overflow-x: auto; }
.ivg-paper .ivg-items tr { break-inside: avoid; }
.ivg-paper .ivg-empty td { color: #9ca3af; text-align: center !important; }
.ivg-paper .ivg-sum { width: min(300px, 100%); margin: 14px 0 0 auto; break-inside: avoid; }
.ivg-paper .ivg-sum td { padding: 3px 8px; text-align: end; }
.ivg-paper .ivg-sum td:first-child { text-align: start; color: #4b5563; }
.ivg-paper .ivg-sum .ivg-tot td { border-top: 1px solid #d1d5db; font-weight: 700; padding-top: 6px; }
.ivg-paper .ivg-sum .ivg-bal td { background: color-mix(in srgb, var(--ivg-acc) 12%, #fff); font-weight: 700; font-size: 14.5px; color: #111827; padding: 8px; }
.ivg-paper .ivg-note { margin-top: 18px; white-space: pre-line; break-inside: avoid; }
.ivg-paper .ivg-note b { display: block; font-size: 11.5px; color: #4b5563; }
@media (max-width: 640px) {
  .ivg .ivg-items-head { display: none; }
  .ivg .ivg-row { grid-template-columns: 1fr 1fr 1fr; grid-template-areas: "d d d" "q p a" "t t t"; }
  .ivg .ivg-row .ivg-d { grid-area: d; } .ivg .ivg-row .ivg-q { grid-area: q; } .ivg .ivg-row .ivg-p { grid-area: p; } .ivg .ivg-row .ivg-amt { grid-area: a; } .ivg .ivg-row .ivg-tools { grid-area: t; }
  .ivg .ivg-row .ivg-q, .ivg .ivg-row .ivg-p { text-align: start; }
  .ivg-wrapprev { padding: 8px; margin-left: -6px; margin-right: -6px; }
  .ivg-paper { padding: 16px 14px; font-size: 12px; }
  .ivg-paper h2 { font-size: 21px; }
  .ivg-paper .ivg-parties { grid-template-columns: 1fr; gap: 12px; }
  .ivg-paper .ivg-items th, .ivg-paper .ivg-items td { padding: 6px 4px; font-size: 11px; }
  .ivg-paper .ivg-top img { max-width: 130px; max-height: 50px; }
}
#ivgPrintBox { display: none; }
@media print {
  @page { margin: 12mm; }
  body > *:not(#ivgPrintBox) { display: none !important; }
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  #ivgPrintBox { display: block !important; }
  #ivgPrintBox .ivg-paper { max-width: none; box-shadow: none; border-radius: 0; padding: 0; font-size: 10.5pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #ivgPrintBox .ivg-paper .ivg-parties { grid-template-columns: 1fr 1fr; }
  #ivgPrintBox .ivg-paper h2 { font-size: 24pt; }
  #ivgPrintBox .ivg-paper .ivg-items thead { display: table-header-group; }
  #ivgPrintBox .ivg-scroll { overflow: visible; }
}
</style>
<div class="ivg" id="ivg">
<fieldset>
  <legend>Your business</legend>
  <div class="fields">
    <div><label for="ivgBizName">Business name</label><input type="text" id="ivgBizName" data-nomemo autocomplete="organization" placeholder="Your company or your name"></div>
    <div><label for="ivgBizEmail">Email</label><input type="text" id="ivgBizEmail" data-nomemo inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
    <div><label for="ivgBizPhone">Phone</label><input type="text" id="ivgBizPhone" data-nomemo inputmode="tel" autocomplete="tel" placeholder="+1 555 0100"></div>
  </div>
  <div class="fields">
    <div><label for="ivgBizAddr">Address</label><textarea id="ivgBizAddr" data-nomemo rows="3" placeholder="Street, city, postcode, country"></textarea></div>
    <div><label for="ivgLogo">Logo (optional)</label>
      <div class="ivg-logo-box"><input type="file" id="ivgLogo" data-nomemo accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"><img id="ivgLogoImg" alt="Your logo" hidden><button type="button" class="btn ghost" id="ivgLogoDel" hidden>Remove logo</button></div>
      <span class="ivg-hint">PNG, JPG, WebP or SVG. It is shrunk to a sensible size and kept on this device only.</span></div>
  </div>
</fieldset>
<fieldset>
  <legend>Bill to</legend>
  <div class="fields">
    <div><label for="ivgClientName">Client name</label><input type="text" id="ivgClientName" data-nomemo placeholder="Client or company name"></div>
    <div><label for="ivgClientEmail">Client email</label><input type="text" id="ivgClientEmail" data-nomemo inputmode="email" placeholder="client@example.com"></div>
  </div>
  <div class="fields"><div><label for="ivgClientAddr">Client address</label><textarea id="ivgClientAddr" data-nomemo rows="3" placeholder="Street, city, postcode, country"></textarea></div></div>
</fieldset>
<fieldset>
  <legend>Invoice details</legend>
  <div class="fields">
    <div><label for="ivgNo">Invoice number</label><input type="text" id="ivgNo" data-nomemo maxlength="40"><span class="ivg-hint" id="ivgNoHint"></span></div>
    <div><label for="ivgDate">Invoice date</label><input type="date" id="ivgDate" data-nomemo></div>
    <div><label for="ivgDuePreset">Payment due</label><select id="ivgDuePreset" data-nomemo><option value="0">On receipt</option><option value="7">In 7 days</option><option value="15">In 15 days</option><option value="30" selected>In 30 days</option><option value="c">Pick a date</option></select></div>
    <div><label for="ivgDue">Due date</label><input type="date" id="ivgDue" data-nomemo></div>
  </div>
  <div class="fields">
    <div><label for="ivgCur">Currency</label><select id="ivgCur" data-nomemo>
      <option value="USD">USD – US dollar ($)</option><option value="EUR">EUR – Euro (€)</option><option value="GBP">GBP – British pound (£)</option>
      <option value="PKR">PKR – Pakistani rupee (₨)</option><option value="INR">INR – Indian rupee (₹)</option><option value="AED">AED – UAE dirham</option>
      <option value="SAR">SAR – Saudi riyal</option><option value="CAD">CAD – Canadian dollar (C$)</option><option value="AUD">AUD – Australian dollar (A$)</option>
      <option value="JPY">JPY – Japanese yen (¥)</option><option value="CNY">CNY – Chinese yuan (CN¥)</option><option value="CHF">CHF – Swiss franc</option>
      <option value="BDT">BDT – Bangladeshi taka (Tk)</option><option value="NGN">NGN – Nigerian naira (₦)</option><option value="ZAR">ZAR – South African rand (R)</option>
      <option value="KES">KES – Kenyan shilling</option><option value="EGP">EGP – Egyptian pound (E£)</option><option value="TRY">TRY – Turkish lira (₺)</option>
      <option value="BRL">BRL – Brazilian real (R$)</option><option value="MXN">MXN – Mexican peso (MX$)</option><option value="SGD">SGD – Singapore dollar (S$)</option>
      <option value="MYR">MYR – Malaysian ringgit (RM)</option><option value="IDR">IDR – Indonesian rupiah (Rp)</option><option value="PHP">PHP – Philippine peso (₱)</option>
      <option value="NZD">NZD – New Zealand dollar (NZ$)</option>
      <option value="X">Other – type your own symbol</option></select></div>
    <div id="ivgSymBox" hidden><label for="ivgSym">Your currency symbol or code</label><input type="text" id="ivgSym" data-nomemo maxlength="6" placeholder="e.g. CFA or ₩"></div>
    <div><label for="ivgPaperSize">Paper size (PDF)</label><select id="ivgPaperSize" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
    <div><label for="ivgColor">Accent colour</label><input type="color" id="ivgColor" data-nomemo value="#2563eb"></div>
  </div>
</fieldset>
<fieldset>
  <legend>Items</legend>
  <div class="ivg-items-head" aria-hidden="true"><span>Description</span><span>Qty</span><span>Unit price</span><span>Amount</span><span></span></div>
  <div id="ivgRows"></div>
  <button type="button" class="btn ghost ivg-add" id="ivgAdd">+ Add item</button>
</fieldset>
<fieldset>
  <legend>Discount, tax and payments</legend>
  <div class="fields">
    <div><label for="ivgDiscType">Discount type</label><select id="ivgDiscType" data-nomemo><option value="pct">Percent (%)</option><option value="fixed">Fixed amount</option></select></div>
    <div><label for="ivgDisc">Discount</label><input type="text" id="ivgDisc" data-nomemo inputmode="decimal" placeholder="0"></div>
    <div><label for="ivgTax1Name">Tax name</label><input type="text" id="ivgTax1Name" data-nomemo maxlength="30" value="Tax"></div>
    <div><label for="ivgTax1">Tax rate (%)</label><input type="text" id="ivgTax1" data-nomemo inputmode="decimal" placeholder="0"></div>
  </div>
  <label class="ivg-check"><input type="checkbox" id="ivgTax2On" data-nomemo>Add a second tax</label>
  <div class="fields" id="ivgTax2Box" hidden>
    <div><label for="ivgTax2Name">Second tax name</label><input type="text" id="ivgTax2Name" data-nomemo maxlength="30" value="Tax 2"></div>
    <div><label for="ivgTax2">Second tax rate (%)</label><input type="text" id="ivgTax2" data-nomemo inputmode="decimal" placeholder="0"></div>
  </div>
  <div class="fields">
    <div><label for="ivgShip">Shipping</label><input type="text" id="ivgShip" data-nomemo inputmode="decimal" placeholder="0.00"></div>
    <div><label for="ivgPaid">Amount already paid</label><input type="text" id="ivgPaid" data-nomemo inputmode="decimal" placeholder="0.00"></div>
  </div>
</fieldset>
<fieldset>
  <legend>Notes and payment</legend>
  <div class="fields">
    <div><label for="ivgNotes">Notes</label><textarea id="ivgNotes" data-nomemo rows="3" placeholder="Thank you for your business!"></textarea></div>
    <div><label for="ivgTerms">Payment terms</label><textarea id="ivgTerms" data-nomemo rows="3" placeholder="e.g. Please pay within 30 days."></textarea></div>
  </div>
  <div class="fields"><div><label for="ivgBank">Bank or payment details (optional)</label><textarea id="ivgBank" data-nomemo rows="3" placeholder="Bank name, account name, IBAN / account number, SWIFT, or a payment link"></textarea></div></div>
</fieldset>
<div class="stats">
  <div class="stat"><span>Subtotal</span><b id="ivgSubOut">–</b></div>
  <div class="stat"><span>Total</span><b id="ivgTotOut">–</b></div>
  <div class="stat"><span>Balance due</span><b id="ivgBalOut">–</b></div>
</div>
<div class="btns">
  <button type="button" class="btn" id="ivgPdf">Download PDF</button>
  <a class="btn ghost" id="dl" hidden>Download again</a>
  <button type="button" class="btn ghost" id="ivgPrint">Print</button>
  <button type="button" class="btn ghost" id="ivgSave">Save draft</button>
  <button type="button" class="btn ghost" id="ivgNew">New invoice</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="ivg-wrapprev"><b>Live preview</b><div class="ivg-paper" id="ivgPaper" translate="no"></div></div>
</div>
<script>
(function () {
  'use strict';
  var DRAFT = 'gtnInvoiceDraft', LAST = 'gtnInvoiceLastNo';
  var CUR = { USD: '$', EUR: '€', GBP: '£', PKR: '₨', INR: '₹', AED: 'AED ', SAR: 'SAR ', CAD: 'C$', AUD: 'A$', JPY: '¥', CNY: 'CN¥', CHF: 'CHF ', BDT: 'Tk ', NGN: '₦', ZAR: 'R ', KES: 'KES ', EGP: 'E£', TRY: '₺', BRL: 'R$', MXN: 'MX$', SGD: 'S$', MYR: 'RM ', IDR: 'Rp ', PHP: '₱', NZD: 'NZ$' };
  // A first-time visitor starts with the currency of their own country when it is in the list.
  function localCur() {
    var EU = 'AT BE CY DE EE ES FI FR GR HR IE IT LT LU LV MT NL PT SI SK'.split(' '), M = { US: 'USD', GB: 'GBP', PK: 'PKR', IN: 'INR', AE: 'AED', SA: 'SAR', CA: 'CAD', AU: 'AUD', JP: 'JPY', CN: 'CNY', CH: 'CHF', BD: 'BDT', NG: 'NGN', ZA: 'ZAR', KE: 'KES', EG: 'EGP', TR: 'TRY', BR: 'BRL', MX: 'MXN', SG: 'SGD', MY: 'MYR', ID: 'IDR', PH: 'PHP', NZ: 'NZD' };
    try { var r = new Intl.Locale(navigator.language).maximize().region; return EU.indexOf(r) >= 0 ? 'EUR' : M[r] || 'USD'; } catch (e) { return 'USD'; }
  }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var FIELDS = ['ivgBizName', 'ivgBizEmail', 'ivgBizPhone', 'ivgBizAddr', 'ivgClientName', 'ivgClientEmail', 'ivgClientAddr', 'ivgNo', 'ivgDate', 'ivgDuePreset', 'ivgDue', 'ivgCur', 'ivgSym', 'ivgPaperSize', 'ivgColor', 'ivgDiscType', 'ivgDisc', 'ivgTax1Name', 'ivgTax1', 'ivgTax2On', 'ivgTax2Name', 'ivgTax2', 'ivgShip', 'ivgPaid', 'ivgNotes', 'ivgTerms', 'ivgBank'];
  var logo = null; // data URL of the shrunk logo
  var B0 = BigInt(0), B100 = BigInt(100);

  // ---------- exact maths: money is kept as whole cents in BigInt, never as floating point ----------
  // Read a typed number into an integer scaled by 10^dp. Returns { v: BigInt } or { err: text }.
  function parseNum(raw, dp, empty) {
    var s = String(raw == null ? '' : raw).replace(/[\s ']/g, '');
    if (s === '') return { v: empty == null ? B0 : empty, blank: true };
    if (/^-/.test(s)) return { err: 'cannot be negative' };
    if (/^\d{1,3}(,\d{3})+(\.\d*)?$/.test(s)) s = s.replace(/,/g, ''); // 1,234.50
    else if (/^\d*,\d+$/.test(s)) s = s.replace(',', '.'); // 12,5 written the European way
    if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return { err: 'must be a number, like 12.50' };
    var parts = s.split('.'), whole = parts[0] || '0', frac = parts[1] || '';
    if (whole.replace(/^0+/, '').length > 12) return { err: 'is too large' };
    if (frac.length > dp) { if (/[1-9]/.test(frac.slice(dp))) return { err: 'can have at most ' + dp + ' decimal places' }; frac = frac.slice(0, dp); }
    while (frac.length < dp) frac += '0';
    return { v: BigInt(whole + frac) };
  }
  // a * b / d rounded half up (all non-negative BigInt)
  function mulDiv(a, b, d) { var n = a * b; return (n * BigInt(2) + d) / (d * BigInt(2)); }

  // in = { items:[{desc,qty,price}], discType, disc, tax1, tax2On, tax2, ship, paid }
  // Quantities have up to 3 decimals, unit prices up to 4, rates up to 3, other money up to 2.
  function calc(inp) {
    var errs = [], lines = [], sub = B0;
    function get(val, dp, what, id, empty) { var r = parseNum(val, dp, empty); if (r.err) { errs.push({ id: id, text: what + ' ' + r.err + '.' }); return null; } return r; }
    (inp.items || []).forEach(function (it, i) {
      var q = get(it.qty, 3, 'Quantity on item ' + (i + 1), 'row' + i + 'q', BigInt(1000));
      var p = get(it.price, 4, 'Unit price on item ' + (i + 1), 'row' + i + 'p');
      var blank = !String(it.desc || '').trim() && (!p || p.blank);
      var amt = q && p ? mulDiv(q.v, p.v, BigInt(100000)) : null; // milli-units x 1/10000 -> cents
      if (amt != null && !blank) sub += amt;
      lines.push({ desc: String(it.desc || ''), qty: q ? q.v : null, price: p ? p.v : null, amount: amt, blank: blank });
    });
    var d = inp.discType === 'fixed' ? get(inp.disc, 2, 'The discount', 'ivgDisc') : get(inp.disc, 3, 'The discount percent', 'ivgDisc');
    var discount = B0, discRate = null;
    if (d) {
      if (inp.discType === 'fixed') discount = d.v;
      else { discRate = d.v; if (d.v > BigInt(100000)) errs.push({ id: 'ivgDisc', text: 'The discount cannot be more than 100%.' }); else discount = mulDiv(sub, d.v, BigInt(100000)); }
      if (inp.discType === 'fixed' && discount > sub) { errs.push({ id: 'ivgDisc', text: 'The discount is bigger than the subtotal. Lower it so the total does not go below zero.' }); discount = sub; }
    }
    var taxable = sub - discount;
    function tax(val, id, what) {
      var r = get(val, 3, what, id); if (!r) return null;
      if (r.v > BigInt(100000)) { errs.push({ id: id, text: what + ' cannot be more than 100%.' }); return null; }
      return { rate: r.v, amount: mulDiv(taxable, r.v, BigInt(100000)) };
    }
    var t1 = tax(inp.tax1, 'ivgTax1', 'The tax rate'), t2 = inp.tax2On ? tax(inp.tax2, 'ivgTax2', 'The second tax rate') : null;
    var ship = get(inp.ship, 2, 'Shipping', 'ivgShip'), paid = get(inp.paid, 2, 'The amount paid', 'ivgPaid');
    var total = taxable + (t1 ? t1.amount : B0) + (t2 ? t2.amount : B0) + (ship ? ship.v : B0);
    var paidV = paid ? paid.v : B0, balance = total - paidV;
    return { errors: errs, lines: lines, subtotal: sub, discount: discount, discRate: discRate, taxable: taxable, tax1: t1, tax2: t2, shipping: ship ? ship.v : B0, total: total, paid: paidV, balance: balance < B0 ? B0 : balance, overpaid: balance < B0 ? -balance : B0 };
  }

  // ---------- formatting ----------
  function group(s, lakh) {
    if (!lakh || s.length <= 3) return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var last = s.slice(-3), rest = s.slice(0, -3);
    return rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last;
  }
  function plain(cents, lakh) { var s = cents.toString(); while (s.length < 3) s = '0' + s; return group(s.slice(0, -2), lakh) + '.' + s.slice(-2); }
  function sym() { var c = $('ivgCur').value; if (c !== 'X') return CUR[c]; var s = $('ivgSym').value.trim(); return s ? (/[A-Za-z]$/.test(s) ? s + ' ' : s) : ''; }
  function money(cents) { return sym() + plain(cents, $('ivgCur').value === 'INR'); }
  function scaled(v, dp) { // BigInt scaled by 10^dp -> shortest decimal text
    var s = v.toString(); while (s.length <= dp) s = '0' + s;
    var w = s.slice(0, s.length - dp), f = s.slice(s.length - dp).replace(/0+$/, '');
    return group(w) + (f ? '.' + f : '');
  }
  function unitPrice(v) { // at least 2 decimals, up to 4

    c.lines.forEach(function (l) {
      if (l.blank) return;
      var dl = wrap(l.desc, 9.5, R, dW), h = dl.length * 12.5 + 10;
      if (y - h < BOTTOM) { newPage(); txt('Invoice ' + s.ivgNo + ' (continued)', M, y - 10, 9, R, mute); y -= 22; head(); }
      var top = y - 15;
      dl.forEach(function (t, i) { txt(t, M + 8, top - i * 12.5, 9.5, R); });
      var q = scaled(l.qty, 3), pr = unitPrice(l.price), am = money(l.amount);
      rtxt(q, xQty, top, fit(q, 9.5, R, 58), R); rtxt(pr, xPrice, top, fit(pr, 9.5, R, 88), R); rtxt(am, xAmt - 8, top, fit(am, 9.5, Bf, 88), Bf);
      y -= h;
      page.drawLine({ start: { x: M, y: y }, end: { x: M + W, y: y }, thickness: .6, color: line });
    });

    // totals
    var rows = totalRows(s, c), need = rows.length * 17 + 16;
    y -= 12;
    if (y - need < BOTTOM) newPage();
    var sx = M + W - 250;
    rows.forEach(function (r) {
      var bal = r[2] === 'ivg-bal', tot = r[2] === 'ivg-tot', f = bal || tot ? Bf : R, sz = bal ? 11 : 9.5;
      if (tot) page.drawLine({ start: { x: sx, y: y + 2 }, end: { x: M + W, y: y + 2 }, thickness: .8, color: L.rgb(.8, .82, .85) });
      if (bal) { y -= 4; page.drawRectangle({ x: sx, y: y - 19, width: 250, height: 24, color: soft }); }
      var ls = fit(r[0], sz, f, 140);
      txt(r[0], sx + 8, y - 12, ls, f, bal || tot ? ink : mute); rtxt(r[1], xAmt - 8, y - 12, fit(r[1], sz, f, 100), f);
      y -= bal ? 24 : 17;
    });
    y -= 10;

    // notes, terms, bank details
    noteBlocks(s).forEach(function (n) {
      y -= 8;
      if (y - 30 < BOTTOM) newPage();
      txt(n[0], M, y - 10, 9.5, Bf, mute); y -= 24;
      wrap(n[1], 9.5, R, W).forEach(function (l) { if (y < BOTTOM) newPage(); txt(l, M, y, 9.5, R); y -= 13; });
    });

    // footer on every page
    var pages = doc.getPages();
    pages.forEach(function (pg, i) {
      page = pg;
      var f = clean((s.ivgNo ? 'Invoice ' + s.ivgNo : 'Invoice') + (s.ivgBizName.trim() ? ' · ' + s.ivgBizName.trim() : ''));
      txt(f.length > 90 ? f.slice(0, 90) + '…' : f, M, M - 14, 8, R, mute);
      rtxt('Page ' + (i + 1) + ' of ' + pages.length, PW - M, M - 14, 8, R, mute);
    });
    return { bytes: await doc.save(), pages: pages.length, lost: lost };
  }

  var busy = false, dlUrl = null;
  $('ivgPdf').addEventListener('click', async function () {
    if (busy || !ready()) return;
    busy = true; var b = this; b.disabled = true; b.textContent = 'Making PDF…'; say('', 'Making your PDF…');
    try {
      try { await getLibs(); } catch (e) { throw new Error('The PDF maker could not load. Check your connection and try again.'); }
      var s = last.s; s.logo = logo;
      var r = await makePdf(s, last.c);
      if (dlUrl) URL.revokeObjectURL(dlUrl);
      dlUrl = URL.createObjectURL(new Blob([r.bytes], { type: 'application/pdf' }));
      var name = 'invoice-' + ((s.ivgNo || 'draft').replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '') || 'draft') + '.pdf';
      var a = $('dl'); a.href = dlUrl; a.download = name; a.hidden = false; a.click();
      markUsed(); saveDraft();
      var note = 'Saved ' + name + ' (' + r.pages + (r.pages === 1 ? ' page, ' : ' pages, ') + fmtBytes(r.bytes.length) + ').';
      if (r.lost) say('bad', note + ' Some letters (' + r.lost + ') are not in the PDF font and show as "?". Use Print and choose "Save as PDF" to keep them.');
      else { say('ok', note); if (window.burst) burst(b); }
    } catch (e) { say('bad', e && /^The PDF/.test(e.message) ? e.message : 'Sorry, the PDF could not be made on this device. Try Print and choose "Save as PDF" instead.'); }
    busy = false; b.disabled = false; b.textContent = 'Download PDF';
  });

  // ---------- start ----------
  var saved = null; try { saved = JSON.parse(load(DRAFT)); } catch (e) {}
  var used = load(LAST);
  if (used) $('ivgNoHint').textContent = 'Last used: ' + used;
  if (saved && typeof saved === 'object') { apply(saved); }
  else {
    var t = isoToday();
    apply({ ivgNo: used ? nextNo(used) : 'INV-0001', ivgDate: t, ivgDue: addDays(t, 30), ivgCur: localCur(), items: [{}] });
  }
  update(false);
  if (saved) setTimeout(function () { if (!$('msg').textContent) say('ok', 'Your saved draft was restored. Press New invoice to start a fresh one.'); }, 0);
})();
</script>
