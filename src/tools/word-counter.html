<label for="txt">Your text</label>
<textarea id="txt" class="plain" style="min-height:220px" placeholder="Type or paste your text here..."></textarea>
<div class="stats">
  <div class="stat"><span>Words</span><b id="w">0</b></div>
  <div class="stat"><span>Characters</span><b id="c">0</b></div>
  <div class="stat"><span>Without spaces</span><b id="cn">0</b></div>
  <div class="stat"><span>Sentences</span><b id="s">0</b></div>
  <div class="stat"><span>Paragraphs</span><b id="p">0</b></div>
  <div class="stat"><span>Reading time</span><b id="r">0 min</b></div>
</div>
<div class="btns"><button class="btn ghost" id="clr">Clear</button></div>
<script>
(function () {
  // Count characters as people see them, so an emoji like a flag or family counts as one.
  var seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter() : null;
  function chars(t) { if (!seg) return Array.from(t).length; var n = 0; for (var x of seg.segment(t)) n++; return n; }
  var CJK = /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/g;
  function count() {
    // Chinese and Japanese do not put spaces between words, so each of their characters counts as one word, like other counters do.
    var t = $('txt').value, cjk = t.match(CJK), rest = t.replace(CJK, ' ').trim(), words = (cjk ? cjk.length : 0) + (rest ? rest.split(/\s+/).filter(function (w) { return /[\p{L}\p{N}\p{So}]/u.test(w); }).length : 0);
    $('w').textContent = fmtNum(words);
    $('c').textContent = fmtNum(chars(t));
    $('cn').textContent = fmtNum(chars(t.replace(/\s/g, '')));
    // A sentence ends at . ! ? only when a space or the end of the text follows, so 3.5 or example.com do not split it.
    $('s').textContent = fmtNum(t.split(/[.!?؟۔।॥]+['"”’)\]]*(?=\s|$)|[。！？]+/).filter(function (x) { return /[\p{L}\p{N}]/u.test(x); }).length);
    $('p').textContent = fmtNum(t.split(/\n+/).filter(function (x) { return x.trim(); }).length);
    var mins = words / 200;
    var rm = Math.round(mins);
    $('r').textContent = words === 0 ? '0 min' : mins < 1 ? '< 1 min' : rm < 60 ? rm + ' min' : Math.floor(rm / 60) + ' h ' + (rm % 60) + ' min';
  }
  $('txt').addEventListener('input', count);
  $('clr').addEventListener('click', function () { $('txt').value = ''; count(); $('txt').focus(); });
})();
</script>
