<style>
.md-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 860px) { .md-wrap { grid-template-columns: minmax(0, 1fr); } }
.md-wrap textarea { min-height: 420px; height: 100%; font-size: 14px; }
.md-panel { display: flex; flex-direction: column; min-width: 0; }
.md-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.md-head label { margin: 0; }
.md-box { flex: 1; min-height: 420px; max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 16px; }
.md-src { margin: 0; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); }
.md-prev { font-size: 15.5px; line-height: 1.6; overflow-wrap: anywhere; }
.md-prev > :first-child { margin-top: 0; }
.md-prev h1, .md-prev h2, .md-prev h3, .md-prev h4 { line-height: 1.25; margin: 1.2em 0 .5em; }
.md-prev h1 { font-size: 1.8em; } .md-prev h2 { font-size: 1.45em; border-bottom: 1px solid var(--line); padding-bottom: .2em; } .md-prev h3 { font-size: 1.2em; }
.md-prev p, .md-prev ul, .md-prev ol, .md-prev blockquote, .md-prev pre, .md-prev table { margin: 0 0 1em; }
.md-prev code { font-family: var(--mono); font-size: .9em; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: .1em .35em; }
.md-prev pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; }
.md-prev pre code { border: 0; padding: 0; background: none; }
.md-prev blockquote { border-inline-start: 4px solid var(--line); padding-inline-start: 12px; color: var(--muted); margin-inline: 0; }
.md-prev table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
.md-prev th, .md-prev td { border: 1px solid var(--line); padding: 6px 10px; }
.md-prev th { background: var(--bg); }
.md-prev img { max-width: 100%; height: auto; }
.md-prev hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
.md-prev li:has(> input[type=checkbox]) { list-style: none; }
.md-prev li > input[type=checkbox] { margin-inline: -1.4em .4em; }
</style>
<div class="btns" style="margin:0 0 12px">
  <button class="btn ghost" id="mdSample">Load sample</button>
  <button class="btn ghost" id="mdOpen">Open .md file</button>
  <button class="btn ghost" id="mdClear">Clear</button>
</div>
<input type="file" id="mdFile" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" hidden data-nomemo>
<div class="checks" style="margin-bottom:12px">
  <label><input type="checkbox" id="mdBreaks"> Treat single line breaks as &lt;br&gt;</label>
</div>
<div class="md-wrap">
  <div class="md-panel">
    <div class="md-head"><label for="mdIn">Markdown</label><span class="msg" id="mdStat" style="margin:0;font-size:13px"></span></div>
    <textarea id="mdIn" data-nomemo spellcheck="false" placeholder="# Hello&#10;&#10;Type **Markdown** here, or press Load sample."></textarea>
  </div>
  <div class="md-panel">
    <div class="md-head">
      <div class="seg" role="tablist" aria-label="Output view">
        <button type="button" role="tab" id="mdTabP" aria-pressed="true" aria-selected="true" aria-controls="mdPrev">Preview</button>
        <button type="button" role="tab" id="mdTabS" aria-pressed="false" aria-selected="false" aria-controls="mdSrc">HTML source</button>
      </div>
    </div>
    <div class="md-box md-prev" id="mdPrev" role="tabpanel" aria-labelledby="mdTabP"></div>
    <pre class="md-box md-src" id="mdSrc" role="tabpanel" aria-labelledby="mdTabS" hidden></pre>
  </div>
</div>
<div class="btns">
  <button class="btn" id="mdCopy">Copy HTML</button>
  <button class="btn ghost" id="mdDlHtml">Download .html</button>
  <button class="btn ghost" id="mdDlMd">Download .md</button>
</div>
<p class="msg" id="mdMsg">Raw HTML inside your Markdown is allowed, but scripts, event handlers and other unsafe code are always removed.</p>
<script src="../assets/vendor/marked/marked.min.js"></script>
<script src="../assets/vendor/dompurify/purify.min.js"></script>
<script>
(function () {
  var SAMPLE = [
    '# Project notes',
    '',
    'A short **sample** document that shows what *Markdown* can do. Edit it on the left and watch the preview update.',
    '',
    '## Lists',
    '',
    '- Fast and private: runs in your browser',
    '- Works offline',
    '  - Nested items work too',
    '',
    '1. Write Markdown',
    '2. Check the preview',
    '3. Copy or download the HTML',
    '',
    '## Task list',
    '',
    '- [x] Draft the outline',
    '- [x] Add a table',
    '- [ ] Publish the page',
    '',
    '## Table',
    '',
    '| Tool | Category | Free |',
    '| :--- | :---: | ---: |',
    '| Regex Tester | Developer | Yes |',
    '| QR Code Scanner | Generators | Yes |',
    '',
    '## Code',
    '',
    'Inline `code` and a fenced block:',
    '',
    '```js',
    'function greet(name) {',
    '  return `Hello, ${name}!`;',
    '}',
    '```',
    '',
    '> Quotes look like this. ~~Strikethrough~~ works as well.',
    '',
    'Links become clickable: [GetToolNest](https://gettoolnest.com) and https://example.com',
    '',
    '---',
    '',
    'That is all. Happy writing!'
  ].join('\n');
  var ok = window.marked && window.DOMPurify && DOMPurify.isSupported !== false;
  var html = '', timer = null;
  function say(cls, t) { $('mdMsg').className = 'msg' + (cls ? ' ' + cls : ''); $('mdMsg').textContent = t; }
  function render() {
    var md = $('mdIn').value;
    if (!ok) { say('bad', 'The Markdown converter could not be loaded. Check your connection and reload the page.'); return; }
    var raw = '';
    try { raw = marked.parse(md, { gfm: true, breaks: $('mdBreaks').checked, async: false }); }
    catch (e) { say('bad', 'Could not convert: ' + e.message); return; }
    // ALWAYS sanitise before the HTML touches the page or the clipboard
    html = DOMPurify.sanitize(raw, { USE_PROFILES: { html: true } });
    var prev = $('mdPrev');
    prev.innerHTML = html;
    // in the preview only, open links in a new tab so the editor is not lost
    prev.querySelectorAll('a[href]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
    $('mdSrc').textContent = html;
    var words = md.trim() ? md.trim().split(/\s+/).length : 0;
    $('mdStat').textContent = fmtNum(words, 0) + (words === 1 ? ' word' : ' words') + ' · ' + fmtNum(md.length, 0) + ' characters';
    if (!md.trim()) prev.innerHTML = '<p style="color:var(--muted)">The preview appears here.</p>';
  }
  function later() { clearTimeout(timer); timer = setTimeout(render, $('mdIn').value.length > 200000 ? 400 : 120); }
  function tab(src) {
    $('mdTabP').setAttribute('aria-pressed', String(!src)); $('mdTabP').setAttribute('aria-selected', String(!src));
    $('mdTabS').setAttribute('aria-pressed', String(src)); $('mdTabS').setAttribute('aria-selected', String(src));
    $('mdPrev').hidden = src; $('mdSrc').hidden = !src;
  }
  function title() {
    var h = $('mdPrev').querySelector('h1, h2'), t = h ? h.textContent.trim() : '';
    return t || 'Document';
  }
  function fileBase() { return title().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 60) || 'document'; }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function save(text, name, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type })), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function empty() { if ($('mdIn').value.trim()) return false; say('bad', 'Type or paste some Markdown first, or press Load sample.'); return true; }
  $('mdIn').addEventListener('input', later);
  $('mdBreaks').addEventListener('change', render);
  $('mdTabP').addEventListener('click', function () { tab(false); });
  $('mdTabS').addEventListener('click', function () { tab(true); });
  $('mdSample').addEventListener('click', function () {
    if ($('mdIn').value.trim() && $('mdIn').value !== SAMPLE && !confirm('Replace your text with the sample document?')) return;
    $('mdIn').value = SAMPLE; render(); say('', 'Sample loaded. Edit it on the left.');
  });
  $('mdClear').addEventListener('click', function () { $('mdIn').value = ''; render(); $('mdIn').focus(); });
  $('mdOpen').addEventListener('click', function () { $('mdFile').click(); });
  $('mdFile').addEventListener('change', function () {
    var f = $('mdFile').files[0]; $('mdFile').value = '';
    if (!f) return;
    if (f.size > 20 * 1048576) { say('bad', 'That file is ' + fmtBytes(f.size) + '. Please use a Markdown file under 20 MB.'); return; }
    if (f.type && !/^text\/|markdown/.test(f.type) && !/\.(md|markdown|mdown|txt)$/i.test(f.name)) { say('bad', 'That does not look like a Markdown or text file.'); return; }
    f.text().then(function (t) {
      if (/\u0000/.test(t.slice(0, 2000))) { say('bad', 'That file is not plain text, so it cannot be opened as Markdown.'); return; }
      $('mdIn').value = t; render(); say('ok', 'Opened ' + f.name + ' (' + fmtBytes(f.size) + ').');
    }, function () { say('bad', 'Could not read that file.'); });
  });
  $('mdCopy').addEventListener('click', function () { if (empty()) return; render(); copyText(html, $('mdCopy')); });
  $('mdDlMd').addEventListener('click', function () { if (empty()) return; save($('mdIn').value, fileBase() + '.md', 'text/markdown;charset=utf-8'); });
  $('mdDlHtml').addEventListener('click', function () {
    if (empty()) return; render();
    var doc = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + esc(title()) + '</title>\n<style>\n' +
      'body{max-width:760px;margin:40px auto;padding:0 16px;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937}\n' +
      'h1,h2,h3{line-height:1.25}h2{border-bottom:1px solid #e5e7eb;padding-bottom:.2em}a{color:#2563eb}\n' +
      'code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:#f3f4f6;border-radius:4px;padding:.1em .35em}\n' +
      'pre{background:#f3f4f6;border-radius:8px;padding:12px;overflow:auto}pre code{background:none;padding:0}\n' +
      'blockquote{border-left:4px solid #e5e7eb;margin-left:0;padding-left:12px;color:#6b7280}\n' +
      'table{border-collapse:collapse}th,td{border:1px solid #e5e7eb;padding:6px 10px}th{background:#f9fafb}img{max-width:100%}\n' +
      'li:has(> input[type=checkbox]){list-style:none}\n</style>\n</head>\n<body>\n' + html + '\n</body>\n</html>\n';
    save(doc, fileBase() + '.html', 'text/html;charset=utf-8');
  });
  render();
})();
</script>
