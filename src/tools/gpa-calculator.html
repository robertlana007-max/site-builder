<div id="rows"></div>
<div class="btns" style="margin:0 0 4px"><button class="btn ghost" id="add">+ Add course</button><button class="btn ghost" id="clr">Clear all</button></div>
<div class="stats">
  <div class="stat"><span>GPA (4.0 scale)</span><b id="gpa">–</b></div>
  <div class="stat"><span>Total credits</span><b id="cr">–</b></div>
  <div class="stat"><span>Grade points</span><b id="pts">–</b></div>
</div>
<script>
(function () {
  var G = [['A+', 4], ['A', 4], ['A-', 3.7], ['B+', 3.3], ['B', 3], ['B-', 2.7], ['C+', 2.3], ['C', 2], ['C-', 1.7], ['D+', 1.3], ['D', 1], ['F', 0]];
  function calc() {
    var credits = 0, points = 0;
    document.querySelectorAll('#rows .fields').forEach(function (r) {
      var c = +r.querySelector('.cr').value, g = r.querySelector('.gr').value;
      if (c > 0 && g !== '') { credits += c; points += c * +g; }
    });
    $('gpa').textContent = credits ? (points / credits).toFixed(2) : '–';
    $('cr').textContent = credits ? fmtNum(credits) : '–';
    $('pts').textContent = credits ? fmtNum(points, 1) : '–';
  }
  function addRow() {
    var n = document.querySelectorAll('#rows .fields').length + 1, r = document.createElement('div');
    r.className = 'fields'; r.style.gridTemplateColumns = 'minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)'; r.style.marginBottom = '10px';
    r.innerHTML = '<div><label for="n' + n + '">Course ' + n + '</label><input type="text" id="n' + n + '" placeholder="Optional name"></div>' +
      '<div><label for="c' + n + '">Credits</label><input type="number" class="cr" id="c' + n + '" min="0" step="0.5" value="3"></div>' +
      '<div><label for="g' + n + '">Grade</label><select class="gr" id="g' + n + '"><option value="">–</option>' +
      G.map(function (g) { return '<option value="' + g[1] + '">' + g[0] + '</option>'; }).join('') + '</select></div>';
    r.addEventListener('input', calc);
    $('rows').appendChild(r);
  }
  $('add').addEventListener('click', addRow);
  $('clr').addEventListener('click', function () { $('rows').innerHTML = ''; for (var i = 0; i < 4; i++) addRow(); calc(); });
  for (var i = 0; i < 4; i++) addRow();
})();
</script>
