<div id="rows"></div>
<div class="btns" style="margin:0 0 4px"><button class="btn ghost" id="add">+ Add course</button><button class="btn ghost" id="clr">Clear all</button></div>
<div class="stats">
  <div class="stat"><span>GPA (4.0 scale)</span><b id="gpa">–</b></div>
  <div class="stat"><span>Total credits</span><b id="cr">–</b></div>
  <div class="stat"><span>Grade points</span><b id="pts">–</b></div>
</div>
<p class="msg">A+ counts as 4.0, like A. If your school uses a 4.3 scale (A+ = 4.3), your GPA there can be a little higher.</p>
<script>
(function () {
  var G = [['A+', 4], ['A', 4], ['A-', 3.7], ['B+', 3.3], ['B', 3], ['B-', 2.7], ['C+', 2.3], ['C', 2], ['C-', 1.7], ['D+', 1.3], ['D', 1], ['F', 0]];
  function calc() {
    var credits = 0, points = 0;
    document.querySelectorAll('#rows .fields').forEach(function (r) {
      var c = +r.querySelector('.cr').value, g = r.querySelector('.gr').value;
      if (c > 0 && g !== '') { credits += c; points += c * +g; }
    });
    $('gpa').textContent = credits ? (points / credits).toFixed(2) : '–';
    $('cr').textContent = credits ? fmtNum(credits) : '–';
    $('pts').textContent = credits ? fmtNum(points, 1) : '–';
  }
  var seq = 0;
  // Tell the site's input memory that rows were removed, so a reload does not bring them back.
  function changed() { $('rows').dispatchEvent(new Event('change', { bubbles: true })); }
  function addRow(id) {
    var n = id || ++seq, r = document.createElement('div');
    r.className = 'fields'; r.style.gridTemplateColumns = 'minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto'; r.style.alignItems = 'end'; r.style.marginBottom = '10px';
    r.innerHTML = '<div><label for="n' + n + '">Course ' + n + '</label><input type="text" id="n' + n + '" placeholder="Optional name"></div>' +
      '<div><label for="c' + n + '">Credits</label><input type="number" class="cr" id="c' + n + '" min="0" step="0.5" value="3"></div>' +
      '<div><label for="g' + n + '">Grade</label><select class="gr" id="g' + n + '"><option value="">–</option>' +
      G.map(function (g) { return '<option value="' + g[1] + '">' + g[0] + '</option>'; }).join('') + '</select></div>' +
      '<button type="button" class="btn ghost rm" aria-label="Remove this course" title="Remove this course" style="min-height:44px;padding:0 12px">×</button>';
    r.querySelector('.rm').addEventListener('click', function () { r.remove(); if (!document.querySelector('#rows .fields')) addRow(); renumber(); calc(); changed(); });
    r.addEventListener('input', calc);
    $('rows').appendChild(r);
    renumber();
  }
  // Labels follow the row order (Course 1, 2, 3...) even after a row is removed; ids stay unique.
  function renumber() { document.querySelectorAll('#rows .fields').forEach(function (r, i) { r.querySelector('label').textContent = 'Course ' + (i + 1); }); }
  $('add').addEventListener('click', function () { addRow(); });
  $('clr').addEventListener('click', function () { $('rows').innerHTML = ''; seq = 0; for (var i = 0; i < 4; i++) addRow(); calc(); changed(); });
  // Recreate every saved course row (with its saved ids) before the site restores the saved values into them.
  var saved = [];
  try { var mem = Store.read().inputs['gpa-calculator'] || {}; Object.keys(mem).forEach(function (k) { var m = /^[ncg](\d+)$/.exec(k); if (m && saved.indexOf(+m[1]) < 0) saved.push(+m[1]); }); } catch (e) {}
  saved = saved.filter(function (n) { return n > 0 && n < 1000; }).sort(function (a, b) { return a - b; });
  if (saved.length) { seq = saved[saved.length - 1]; saved.forEach(function (n) { addRow(n); }); }
  else for (var i = 0; i < 4; i++) addRow();
})();
</script>
