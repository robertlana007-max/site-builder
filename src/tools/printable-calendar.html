<style>
.pcal fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.pcal legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.pcal textarea { min-height: 110px; font-family: inherit; font-size: 15px; }
.pcal .pcal-hint { display: block; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.pcal .pcal-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.pcal .pcal-sw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.pcal .pcal-sw button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.pcal .pcal-sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.pcal input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); }
.pcal .pcal-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.pcal .pcal-prev canvas { width: 100%; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
.pcal .pcal-prev.port canvas { max-width: 460px; }
.pcal .pcal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
.pcal .pcal-nav .btn { min-height: 38px; padding: 4px 12px; }
</style>
<div class="pcal" id="pcal">
<fieldset><legend>Which dates?</legend>
  <div class="fields">
    <div><label for="pcLayout">Layout</label><select id="pcLayout"><option value="month">One month per page</option><option value="year">Whole year on one page</option></select></div>
    <div><label for="pcYear">Year</label><input type="number" id="pcYear" min="1600" max="2600" step="1" inputmode="numeric"></div>
    <div id="pcStartBox"><label for="pcStart">Starting month</label><select id="pcStart"></select></div>
    <div id="pcCountBox"><label for="pcCount">Number of months</label><select id="pcCount"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="6">6</option><option value="12" selected>12</option><option value="18">18</option><option value="24">24</option></select></div>
  </div>
</fieldset>
<fieldset><legend>Language and week</legend>
  <div class="fields">
    <div><label for="pcLang">Month and day names</label><select id="pcLang"></select></div>
    <div><label for="pcWeek">Week starts on</label><select id="pcWeek"><option value="auto">Automatic for my region</option><option value="1">Monday</option><option value="0">Sunday</option><option value="6">Saturday</option></select></div>
  </div>
  <label class="pcal-check"><input type="checkbox" id="pcWeekNo">Show week numbers (ISO)</label>
  <label class="pcal-check"><input type="checkbox" id="pcWeekend" checked>Shade weekends</label>
</fieldset>
<fieldset><legend>Holidays, birthdays and events (optional)</legend>
  <label for="pcEvents">One per line: a date, then the name</label>
  <textarea id="pcEvents" data-nomemo maxlength="20000" placeholder="01-01 New Year's Day&#10;2026-03-20 Spring term ends&#10;08-14 Mum's birthday"></textarea>
  <span class="pcal-hint">Write dates as YYYY-MM-DD for one day, or MM-DD to repeat every year. Nothing is added for you, so you choose the holidays of your own country.</span>
</fieldset>
<fieldset><legend>Design</legend>
  <div class="fields">
    <div><label for="pcStyle">Style</label><select id="pcStyle"><option value="modern">Modern</option><option value="classic">Classic</option><option value="minimal">Minimal</option><option value="bold">Bold</option></select></div>
    <div><label for="pcPaper">Paper</label><select id="pcPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
    <div><label for="pcOrient">Orientation</label><select id="pcOrient"><option value="land">Landscape</option><option value="port">Portrait</option></select></div>
  </div>
  <div class="pcal-sw" id="pcSw"><input type="color" id="pcColor" value="#2563eb" aria-label="Custom colour"></div>
  <label class="pcal-check"><input type="checkbox" id="pcNotes">Add a notes area under each month</label>
</fieldset>
<div class="pcal-prev" id="pcPrevBox">
  <div class="pcal-nav"><button type="button" class="btn ghost" id="pcPrevP" aria-label="Previous page">‹</button><span id="pcWho">Page 1</span><button type="button" class="btn ghost" id="pcNextP" aria-label="Next page">›</button></div>
  <canvas id="pcCanvas" width="842" height="595" aria-label="Calendar preview"></canvas>
</div>
<div class="btns">
  <button type="button" class="btn" id="pcPdf">Download PDF</button>
  <button type="button" class="btn ghost" id="pcPng">This page as PNG</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
