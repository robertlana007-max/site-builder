<style>
.vt-info { margin: -4px 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.vt-info b { color: var(--ink); }
.vt-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 14px; }
.vt-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s; }
.vt-video { display: block; width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 14px 0 4px; }
.vt-hint { font-size: 14px; color: var(--muted); margin: -8px 0 14px; }
</style>
<style>
.rv-stage { position: relative; display: flex; align-items: center; justify-content: center; height: 300px; background: #000; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; margin: 14px 0 14px; }
.rv-stage video { max-width: 100%; max-height: 100%; transition: transform .3s; }
.rv-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0 0 14px; }
.rv-picks button { font: 600 14.5px/1.2 inherit; font-family: inherit; min-height: 46px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.rv-picks button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
@media (max-width: 480px) { .rv-stage { height: 220px; } }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a video here</b>MP4, MOV, WebM, MKV or AVI, up to 1 GB. Your video never leaves your device.</div>
<input type="file" id="file" accept="video/*,.mkv,.mov,.avi,.m4v,.3gp,.ts,.mts,.wmv,.flv" hidden data-nomemo>
<p class="vt-info" id="info"></p>
<div id="editor" hidden>
  <div class="rv-stage" id="stage"><video id="player" playsinline muted loop preload="metadata"></video></div>
  <p class="vt-hint" id="noPlay" hidden>Your browser cannot play this video format, so there is no preview. Choose the turn anyway and it will be applied.</p>
  <div class="rv-picks" role="group" aria-label="Turn or flip">
    <button type="button" data-t="cw" aria-pressed="true">↻ 90° right</button>
    <button type="button" data-t="ccw" aria-pressed="false">↺ 90° left</button>
    <button type="button" data-t="180" aria-pressed="false">⟳ Upside down (180°)</button>
    <button type="button" data-t="h" aria-pressed="false">⇋ Mirror (left-right)</button>
    <button type="button" data-t="v" aria-pressed="false">⇵ Flip (top-bottom)</button>
  </div>
  <div class="fields">
    <div><label for="q">Quality</label><select id="q"><option value="18">High (bigger file)</option><option value="22" selected>Good (recommended)</option><option value="27">Smaller file</option></select></div>
  </div>
  <p class="vt-hint" id="hint"></p>
</div>
<div class="vt-bar" id="bar" hidden><i id="barFill"></i></div>
<div class="btns"><button class="btn" id="go" disabled>Rotate video</button><button class="btn ghost" id="stop" type="button" hidden>Cancel</button><a class="btn ghost" id="dl" hidden>Download video</a></div>
<p class="msg" id="msg"></p>
<script>
// Video engine loader (ffmpeg.wasm, single-thread build, no special server headers needed).
// The same copy is used by every video tool. Nothing is downloaded until a video is chosen.
var FF = (function () {
  var BASE = '../assets/vendor/ffmpeg/', WASM_BYTES = 32232419, MAX = 1024 * 1024 * 1024;
  var wasmUrl = null, ff = null, loading = null, onLog = null, logTail = [];
  function abs(p) { return new URL(BASE + p, location.href).href; }
  function mb(n) { return Math.round(n / 1048576); }

  function fetchWasm(say) {
    if (wasmUrl) return Promise.resolve(wasmUrl);
    return fetch(abs('ffmpeg-core.wasm')).then(function (res) {
      if (!res.ok) throw new Error('The video engine could not be downloaded (error ' + res.status + '). Check your connection and try again.');
      if (!res.body || !res.body.getReader) return res.blob();
      var reader = res.body.getReader(), parts = [], got = 0;
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return new Blob(parts, { type: 'application/wasm' });
          parts.push(r.value); got += r.value.length;
          say('', 'Downloading the video engine… ' + Math.min(99, Math.round(got / WASM_BYTES * 100)) + '% (' + mb(got) + ' of ' + mb(WASM_BYTES) + ' MB). This happens only once.');
          return pump();
        });
      }
      return pump();
    }, function () { throw new Error('The video engine could not be downloaded. Check your connection and try again.'); })
      .then(function (blob) { wasmUrl = URL.createObjectURL(blob.type === 'application/wasm' ? blob : new Blob([blob], { type: 'application/wasm' })); return wasmUrl; });
  }

  // Resolve with a ready FFmpeg instance. say(cls, text) shows status to the person.
  function get(say) {
    if (ff) return Promise.resolve(ff);
    if (loading) return loading;
    if (typeof WebAssembly !== 'object' || typeof Worker !== 'function') return Promise.reject(new Error('This browser cannot run the video engine. Please use a recent Chrome, Edge, Firefox or Safari.'));
    say('', 'Loading the video engine…');
    loading = Promise.all([import(abs('index.js')), fetchWasm(say)]).then(function (r) {
      say('', 'Starting the video engine…');
      var f = new r[0].FFmpeg();
      f.on('log', function (e) { var m = e.message; logTail.push(m); if (logTail.length > 60) logTail.shift(); if (onLog) onLog(m); });
      return f.load({ coreURL: abs('ffmpeg-core.js'), wasmURL: wasmUrl }).then(function () { ff = f; return f; });
    }).catch(function (e) {
      if (e && /could not be downloaded|cannot run/.test(e.message)) throw e;
      throw new Error('The video engine could not start in this browser. Please update your browser or try Chrome, Edge or Firefox.');
    }).then(function (f) { loading = null; return f; }, function (e) { loading = null; throw e; });
    return loading;
  }

  function secs(s) { var m = /(\d+):(\d+):(\d+(?:\.\d+)?)/.exec(s); return m ? +m[1] * 3600 + +m[2] * 60 + +m[3] : null; }

  // Plain-language reason for a failed run, from the last log lines.
  function reason(fallback) {
    var t = logTail.join('\n');
    if (/Invalid data found|moov atom not found|could not find codec parameters|EBML header parsing failed|Invalid argument.*input/i.test(t)) return 'This file could not be read as a video. It may be damaged, incomplete, or in a format the engine does not support.';
    if (/Decoder .* not found|Unknown decoder|unsupported codec/i.test(t)) return 'The video inside this file uses a codec this tool cannot decode.';
    if (/does not contain any stream|Output file .* does not contain|matches no streams/i.test(t)) return 'This file has no video track to work with.';
    if (/out of memory|Cannot allocate memory|Aborted\(|OOM/i.test(t)) return 'Your browser ran out of memory. Try a shorter or smaller video, or a lower resolution.';
    return fallback || 'Something went wrong while processing the video.';
  }

  var job = 0;
  // Put the file into the engine's file system. WORKERFS reads it in pieces, so big files do not fill memory.
  function mountIn(f, file, name) {
    var dir = '/in' + (++job);
    return f.createDir(dir).then(function () {
      return f.mount('WORKERFS', { files: [new File([file], name)] }, dir).then(function () { return { path: dir + '/' + name, dir: dir, mounted: true }; }, function () {
        return file.arrayBuffer().then(function (buf) { return f.writeFile(dir + '/' + name, new Uint8Array(buf)); }).then(function () { return { path: dir + '/' + name, dir: dir, mounted: false }; });
      });
    });
  }
  function unmountIn(f, inp) {
    var p = inp.mounted ? f.unmount(inp.dir) : f.deleteFile(inp.path);
    return p.catch(function () {}).then(function () { return f.deleteDir(inp.dir).catch(function () {}); });
  }
  function ext(file) { var m = /\.([a-z0-9]{1,5})$/i.exec(file.name); return m ? m[1].toLowerCase() : 'mp4'; }

  // Check a file before doing anything with it. Returns an error message or ''.
  function check(file) {
    if (!file) return 'Please choose a video file.';
    var okType = /^video\//.test(file.type) || /\.(mp4|m4v|mov|webm|mkv|avi|3gp|3g2|mpg|mpeg|ts|mts|m2ts|flv|wmv|ogv|qt)$/i.test(file.name);
    if (!okType) return '"' + file.name + '" is not a video file. Please choose an MP4, MOV, WebM, MKV or AVI video.';
    if (!file.size) return '"' + file.name + '" is empty.';
    if (file.size > MAX) return 'This video is ' + fmtBytes(file.size) + '. Videos over 1 GB are too big to process inside a browser tab. Trim it first or use a desktop app.';
    return '';
  }

  // Read duration, size, rotation and streams by asking ffmpeg to describe the file.
  // audioOk: accept a file that only has sound (for the audio tools).
  function probe(file, say, audioOk) {
    return get(say).then(function (f) {
      var lines = [];
      onLog = function (m) { lines.push(m); };
      return mountIn(f, file, 'input.' + ext(file)).then(function (inp) {
        return f.exec(['-hide_banner', '-i', inp.path]).then(function () { return unmountIn(f, inp); });
      }).then(function () {
        onLog = null;
        var t = lines.join('\n'), info = { duration: 0, width: 0, height: 0, rotate: 0, fps: 0, vcodec: '', audio: false, acodec: '' };
        var d = /Duration:\s*(\d+:\d+:\d+(?:\.\d+)?)/.exec(t); if (d) info.duration = secs(d[1]);
        var v = /Stream #\d+:\d+[^:]*: Video: ([a-z0-9_]+)[^\n]*?, (\d{2,5})x(\d{2,5})/.exec(t);
        if (v) { info.vcodec = v[1]; info.width = +v[2]; info.height = +v[3]; }
        var fr = /, ([\d.]+) fps/.exec(t) || /, ([\d.]+) tbr/.exec(t); if (fr) info.fps = +fr[1];
        var r = /rotation of (-?[\d.]+) degrees/.exec(t); if (r) info.rotate = ((Math.round(-r[1] / 90) * 90) % 360 + 360) % 360;
        if (info.rotate === 90 || info.rotate === 270) { var w = info.width; info.width = info.height; info.height = w; }
        var a = /Stream #\d+:\d+[^:]*: Audio: ([a-z0-9_]+)/.exec(t); if (a) { info.audio = true; info.acodec = a[1]; }
        if (!info.vcodec && !(audioOk && info.audio && info.duration > 0)) {
          if (audioOk) throw new Error('"' + file.name + '" could not be read as an audio or video file. It may be damaged or in an unsupported format.');
          if (/Invalid data|moov atom|EBML|could not find|No such file/i.test(t) || !d) throw new Error('"' + file.name + '" could not be read as a video. It may be damaged or in an unsupported format.');
          throw new Error('"' + file.name + '" has no video track.');
        }
        if (!(info.duration > 0)) throw new Error('Could not read the length of this video. It may be damaged or still recording.');
        return info;
      }, function (e) { onLog = null; throw e; });
    });
  }

  // Run ffmpeg. build(inPath) returns the argument list (with -y and no input already added
  // by the caller); outName is the output file. total is the expected output length in seconds.
  // file may also be an array of files: build then gets an array of paths. prep(f, paths), if given,
  // runs before ffmpeg starts (for example to write a list file) and may return a promise.
  function run(file, build, outName, total, onPct, say, prep) {
    var many = Array.isArray(file), list = many ? file : [file];
    return get(say).then(function (f) {
      logTail = [];
      onLog = function (m) {
        var t = /time=\s*(-?\d+:\d+:\d+(?:\.\d+)?)/.exec(m);
        if (t && total > 0) onPct(Math.max(0, Math.min(0.99, secs(t[1]) / total)));
      };
      var out = '/' + outName, inps = [];
      return list.reduce(function (p, one) {
        return p.then(function () { return mountIn(f, one, 'input.' + ext(one)).then(function (inp) { inps.push(inp); }); });
      }, Promise.resolve()).then(function () {
        var paths = inps.map(function (i) { return i.path; });
        return Promise.resolve(prep ? prep(f, paths) : null).then(function () {
          return f.exec(['-hide_banner', '-nostdin', '-y'].concat(build(many ? paths : paths[0]), [out]));
        });
      }).then(function (code) {
        return Promise.all(inps.map(function (i) { return unmountIn(f, i); })).then(function () { return code; });
      }).then(function (code) {
        onLog = null;
        if (code !== 0) { f.deleteFile(out).catch(function () {}); throw new Error(reason()); }
        return f.readFile(out).then(function (data) {
          f.deleteFile(out).catch(function () {});
          if (!data || !data.length) throw new Error(reason('The result was empty. Try different settings.'));
          onPct(1);
          return data;
        });
      }, function (e) {
        onLog = null;
        if (e && e.message === 'called FFmpeg.terminate()') throw new Error('cancelled');
        // the engine may be broken after a crash: start a fresh one next time
        try { f.terminate(); } catch (x) {}
        ff = null;
        throw new Error(reason(e && /memory|abort/i.test(String(e.message || e)) ? 'Your browser ran out of memory. Try a shorter or smaller video, or a lower resolution.' : 'The video engine stopped unexpectedly. Try again, or try a smaller video.'));
      });
    });
  }

  function cancel() { if (ff) { try { ff.terminate(); } catch (e) {} ff = null; } onLog = null; }

  return { get: get, check: check, probe: probe, run: run, cancel: cancel, secs: secs };
})();

// Page helpers shared by the video tools. Expect #drop #file #info #go #stop #bar #barFill #dl #msg.
var VT = (function () {
  var lastUrl = null, busy = false, cancelled = false;
  function say(cls, t) { var m = $('msg'); m.className = 'msg ' + (cls || ''); m.textContent = t || ''; }
  function bar(p) { $('bar').hidden = p == null; if (p != null) $('barFill').style.width = Math.round(p * 100) + '%'; }
  function clock(s) {
    s = Math.round(Math.max(0, s) * 10) / 10; var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    var sec = (x < 10 ? '0' : '') + x.toFixed(1);
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + sec;
  }
  function base(name) { return name.replace(/\.[^.]+$/, '') || 'video'; }
  function showInfo(file, i) {
    var el = $('info'); el.textContent = '';
    var b = document.createElement('b'); b.textContent = file.name; el.appendChild(b);
    el.appendChild(document.createTextNode(' · ' + fmtBytes(file.size) + ' · ' + clock(i.duration) + ' · ' + i.width + ' × ' + i.height + (i.audio ? ' · with sound' : ' · no sound')));
  }
  // Wire the drop zone. onReady(file, info) runs once the video has been checked and read.
  function pick(onReset, onReady) {
    var ticket = 0;
    setupDrop('drop', 'file', function (file) {
      $('file').value = '';
      if (busy) { say('bad', 'Please wait for the current video to finish, or press Cancel.'); return; }
      var mine = ++ticket;
      onReset(); $('go').disabled = true; $('dl').hidden = true; $('info').textContent = ''; bar(null);
      var bad = FF.check(file);
      if (bad) { say('bad', bad); return; }
      busy = true;
      FF.probe(file, say).then(function (info) {
        busy = false;
        if (mine !== ticket) return;
        showInfo(file, info); say('', ''); onReady(file, info); $('go').disabled = false;
      }, function (e) { busy = false; if (mine === ticket) say('bad', e.message); });
    });
    $('stop').addEventListener('click', function () { if (!busy) return; cancelled = true; FF.cancel(); });
    Array.prototype.forEach.call(document.querySelectorAll('.card input:not([type=file]), .card select'), function (el) {
      el.addEventListener('input', function () { if (!busy) $('dl').hidden = true; });
    });
  }
  // Run a job with the busy state, progress bar, Cancel button and error messages handled.
  function go(label, job) {
    if (busy) return;
    busy = true; cancelled = false;
    $('go').disabled = true; $('dl').hidden = true; $('stop').hidden = false; bar(0);
    say('', label + '…');
    var started = Date.now(), last = 0;
    function show() { if (busy) say('', label + '… ' + Math.round(last * 100) + '% · ' + VT.clock((Date.now() - started) / 1000).replace(/\.\d$/, '')); }
    function pct(p) { last = p; bar(p); show(); }
    var tick = setInterval(function () { if (!/Downloading|Loading|Starting/.test($('msg').textContent)) show(); }, 1000);
    return Promise.resolve().then(function () { return job(pct); }).then(function (note) {
      clearInterval(tick);
      say('ok', (note || 'Done') + ' · took ' + VT.clock((Date.now() - started) / 1000).replace(/\.\d$/, ''));
    }, function (e) {
      clearInterval(tick); bar(null);
      if (cancelled || (e && e.message === 'cancelled')) say('', 'Cancelled. Change the settings and try again whenever you like.');
      else say('bad', e && e.message ? e.message : 'Something went wrong with this video.');
    }).then(function () { busy = false; $('go').disabled = false; $('stop').hidden = true; });
  }
  // Show the finished file on #dl. Returns the object URL.
  function done(data, name, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    var dl = $('dl'); dl.href = lastUrl; dl.download = name; dl.hidden = false; bar(1);
    return lastUrl;
  }
  return { say: say, bar: bar, clock: clock, base: base, pick: pick, go: go, done: done };
})();
(function () {
  var file = null, info = null, url = null, turn = 'cw', P = $('player');
  var LOOK = { cw: 'rotate(90deg)', ccw: 'rotate(-90deg)', '180': 'rotate(180deg)', h: 'scaleX(-1)', v: 'scaleY(-1)' };
  var VF = { cw: 'transpose=1', ccw: 'transpose=2', '180': 'hflip,vflip', h: 'hflip', v: 'vflip' };
  var NAME = { cw: 'rotated-right', ccw: 'rotated-left', '180': 'rotated-180', h: 'mirrored', v: 'flipped' };
  function side() { return turn === 'cw' || turn === 'ccw'; }
  function show() {
    Array.prototype.forEach.call(document.querySelectorAll('.rv-picks button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.t === turn)); });
    var t = LOOK[turn];
    if (side() && P.videoWidth) { // keep the turned picture inside the box
      var box = $('stage').getBoundingClientRect(), r = P.getBoundingClientRect();
      var s = Math.min(box.width / r.height, box.height / r.width, 1);
      t += ' scale(' + s.toFixed(3) + ')';
    }
    P.style.transform = t;
    if (info) {
      var w = side() ? info.height : info.width, h = side() ? info.width : info.height;
      $('hint').textContent = 'The new video will be ' + w + ' × ' + h + (side() ? (w < h ? ' (portrait).' : ' (landscape).') : '.') + ' It is re-encoded as an MP4, which takes about as long as the video plays, or longer on a phone.';
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.rv-picks button'), function (b) {
    b.addEventListener('click', function () { if (turn !== b.dataset.t && !$('dl').hidden) { $('dl').hidden = true; VT.say('', 'Changed. Press Rotate video to make the new video.'); } turn = b.dataset.t; show(); });
  });
  P.addEventListener('loadedmetadata', show);
  window.addEventListener('resize', show);
  function reset() {
    file = null; info = null; $('editor').hidden = true;
    P.pause(); P.removeAttribute('src'); P.load();
    if (url) { URL.revokeObjectURL(url); url = null; }
  }
  VT.pick(reset, function (f, i) {
    file = f; info = i; url = URL.createObjectURL(f);
    $('noPlay').hidden = true; $('stage').hidden = false; P.src = url;
    var pl = P.play(); if (pl && pl.catch) pl.catch(function () {});
    $('editor').hidden = false; show();
  });
  P.addEventListener('error', function () { if (P.getAttribute('src')) { $('stage').hidden = true; $('noPlay').hidden = false; } });
  $('go').addEventListener('click', function () {
    if (!file) return;
    var f = file, i = info, t = turn, crf = $('q').value;
    VT.go('Rotating', function (pct) {
      return FF.run(f, function (input) {
        var a = ['-i', input, '-map', '0:v:0', '-map', '0:a:0?', '-vf', VF[t] + ',scale=trunc(iw/2)*2:trunc(ih/2)*2',
          '-c:v', 'libx264', '-preset', 'veryfast', '-crf', crf, '-pix_fmt', 'yuv420p', '-metadata:s:v:0', 'rotate=0'];
        if (i.audio) a.push.apply(a, /^(aac|mp3)$/.test(i.acodec) ? ['-c:a', 'copy'] : ['-c:a', 'aac', '-b:a', '160k']);
        a.push('-movflags', '+faststart');
        return a;
      }, 'rotated.mp4', i.duration, pct, VT.say).then(function (data) {
        VT.done(data, VT.base(f.name) + '-' + NAME[t] + '.mp4', 'video/mp4');
        return 'Your video is ready (' + fmtBytes(data.length) + ')';
      });
    });
  });
})();
</script>
