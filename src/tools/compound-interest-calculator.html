<div class="fields">
  <div><label for="start">Starting amount</label><input type="number" id="start" min="0" step="any" value="10000"></div>
  <div><label for="add">Monthly contribution</label><input type="number" id="add" min="0" step="any" value="200"></div>
  <div><label for="rate">Interest rate (% per year)</label><input type="number" id="rate" min="0" step="any" value="7"></div>
  <div><label for="yrs">Years</label><input type="number" id="yrs" min="1" max="100" step="1" value="20"></div>
  <div><label for="comp">Compounded</label><select id="comp"><option value="12">Monthly</option><option value="4">Quarterly</option><option value="1">Yearly</option><option value="365">Daily</option></select></div>
</div>
<div class="stats">
  <div class="stat"><span>Future value</span><b id="fv">–</b></div>
  <div class="stat"><span>Total you put in</span><b id="paid">–</b></div>
  <div class="stat"><span>Interest earned</span><b id="earn">–</b></div>
</div>
<p class="msg" id="msg"></p>
<h3>Year by year</h3>
<div class="scroll-x"><table class="sched"><thead><tr><th>Year</th><th>Contributions</th><th>Interest</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
(function () {
  function calc() {
    var P = Math.max(0, +$('start').value), add = Math.max(0, +$('add').value), rate = +$('rate').value / 100, yrs = Math.round(+$('yrs').value), n = +$('comp').value;
    $('rows').innerHTML = '';
    if (!(yrs >= 1) || yrs > 100 || rate < 0 || (P === 0 && add === 0)) {
      ['fv', 'paid', 'earn'].forEach(function (i) { $(i).textContent = '–'; });
      $('msg').className = 'msg bad'; $('msg').textContent = 'Enter an amount, a rate of 0 or more, and 1 to 100 years.'; return;
    }
    $('msg').textContent = '';
    // Convert the chosen compounding to an equivalent monthly growth rate; contributions are added at the end of each month.
    var mr = Math.pow(1 + rate / n, n / 12) - 1, bal = P, paid = P, html = '';
    for (var y = 1; y <= yrs; y++) {
      for (var m = 0; m < 12; m++) { bal = bal * (1 + mr) + add; paid += add; }
      html += '<tr><td>' + y + '</td><td>' + fmtNum(paid, 0) + '</td><td>' + fmtNum(bal - paid, 0) + '</td><td>' + fmtNum(bal, 0) + '</td></tr>';
    }
    $('rows').innerHTML = html;
    $('fv').textContent = fmtNum(bal, 2);
    $('paid').textContent = fmtNum(paid, 2);
    $('earn').textContent = fmtNum(bal - paid, 2);
  }
  ['start', 'add', 'rate', 'yrs', 'comp'].forEach(function (id) { $(id).addEventListener('input', calc); });
  calc();
})();
</script>
