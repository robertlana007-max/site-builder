    if (pendingDead) {
      var d = pendingDead; pendingDead = null; drawKb();
      if (ch === ' ') { insert(d.sym); return; }
      var comp = (ch + d.mark).normalize('NFC');
      if (/\p{L}/u.test(ch) && (Array.from(comp).length === 1 || d.screen)) { insert(comp); return; }
      insert(d.sym + ch); return;
    }
    if (lay.dead && lay.dead[ch]) { pendingDead = { mark: lay.dead[ch], sym: ch, screen: true }; drawKb(); hint('Accent ' + ch + ' waiting: type a vowel.'); return; }
    var conv = $('okConv').checked;
    if (lay.conv === 'hangul' && hangul(ch)) return;
    if (conv && (lay.conv === 'romaji' || lay.conv === 'katakana') && kana(ch, lay.conv === 'katakana')) return;
    if (conv && lay.conv === 'ethiopic' && ethiopic(ch)) return;
    if (conv && lay.conv === 'telex' && telex(ch)) return;
    if (conv && lay.conv === 'pinyin' && pinyin(ch)) return;
    if ($('okDig').checked && lay.digits && /^[0-9]$/.test(ch)) ch = lay.digits[+ch];
    insert(ch);
    compEnd = lay.conv === 'hangul' ? -1 : compEnd;
  }
  function hint(t) { $('okHint').textContent = t || ''; }

  // computer keys: non-Latin layouts are mapped by key position; Latin ones keep the computer's own layout
  ta.addEventListener('keydown', function (e) {
    if (!$('okPhys').checked || e.metaKey || e.isComposing) return;
    var ag = e.getModifierState && e.getModifierState('AltGraph') || (e.ctrlKey && e.altKey);
    if ((e.ctrlKey || e.altKey) && !ag) return;
    if (lay.latin) {
      if (ag && INTL[e.code] && !lay.intlOff) { e.preventDefault(); var c = INTL[e.code]; typeChar(e.shiftKey ? c.toUpperCase() : c); }
      return;
    }
    var known = CODES.some(function (r) { return r.indexOf(e.code) !== -1; });
    if (!known) { if (e.key === ' ' || e.key === 'Enter' || e.key === 'Backspace' || e.key.indexOf('Arrow') === 0) compEnd = -1; return; }
    var sh = e.shiftKey, ch = keyChar(e.code, sh, ag);
    // Caps Lock (or a capital letter coming from the computer's own layout) gives capitals on alphabets that have them
    var caps = (e.getModifierState && e.getModifierState('CapsLock')) || (/^[A-Za-z]$/.test(e.key) && (e.key !== e.key.toLowerCase()) !== sh);
    if (lay.cased && caps && /\p{L}/u.test(ch)) { var other = keyChar(e.code, !sh, ag); if (/\p{L}/u.test(other)) ch = other; }
    e.preventDefault();
    if (ch) typeChar(ch);
  });
  // Latin-based keyboards: accent keys and transliteration work on the typed characters
  ta.addEventListener('beforeinput', function (e) {
    if (lay.latin && lay.conv && $('okConv').checked && (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph')) { e.preventDefault(); typeChar('\n'); return; }
    if (!lay.latin || e.inputType !== 'insertText' || !e.data || e.isComposing || !$('okPhys').checked) return;
    var useIntl = $('okIntl').checked && !lay.intlOff, conv = lay.conv && $('okConv').checked;
    if (!useIntl && !conv && !pendingDead) return;
    e.preventDefault();
    for (var ch of e.data) {
      if (useIntl && !pendingDead && INTLDEAD[ch]) { pendingDead = { mark: INTLDEAD[ch], sym: ch }; hint('Accent ' + ch + ' waiting: type a letter, or space for the ' + ch + ' sign.'); continue; }
      typeChar(ch);
    }
  });
  ta.addEventListener('input', function () { saved = [ta.selectionStart, ta.selectionEnd]; stats(); if ($('okMsg').textContent) say('', ''); if (!pendingDead) hint(''); });
  ['select', 'keyup', 'click'].forEach(function (ev) { ta.addEventListener(ev, function () { saved = [ta.selectionStart, ta.selectionEnd]; if (ev === 'click') compEnd = -1; }); });

  // ---------- on-screen keyboard ----------
  function label(t) { return /^\p{M}/u.test(t) ? '\u25cc' + t : t === '\u200c' ? 'ZWNJ' : t === '\u200d' ? 'ZWJ' : t; }
  function drawKb() {
    var kb = $('okKb'), frag = document.createDocumentFragment();
    var mk = function (cls, text, data, title) { var b = document.createElement('button'); b.type = 'button'; b.className = 'ok-k' + (cls ? ' ' + cls : ''); b.textContent = text; for (var k in data) b.dataset[k] = data[k]; if (title) b.title = title; return b; };
    var ex = document.createElement('div'); ex.className = 'ok-row ok-ex';
    if (lay.tones) lay.tones.forEach(function (t) { ex.appendChild(mk('w2', t[0], { tone: t[1] }, 'Tone: ' + t[0])); });
    if (lay.deadRow) DEADS.forEach(function (d) { var b = mk('dead' + (pendingDead && pendingDead.sym === d[0] ? ' on' : ''), '', { dead: d[0], mark: d[1] }, 'Accent: press, then a letter'); var bb = document.createElement('b'); bb.textContent = d[0]; b.appendChild(bb); ex.appendChild(b); });
    (lay.extras || '').split(' ').filter(Boolean).forEach(function (c) { var b = mk('', '', { out: c }); var bb = document.createElement('b'); bb.textContent = label(c); b.appendChild(bb); b.setAttribute('aria-label', c === '\u200c' ? 'Zero-width non-joiner' : c); ex.appendChild(b); });
    if (ex.childNodes.length) frag.appendChild(ex);
    var rows = alt ? null : (shift ? lay.sr : lay.nr);
    CODES.forEach(function (codes, r) {
      var row = document.createElement('div'); row.className = 'ok-row';
      if (r === 3) row.appendChild(mk('w2' + (shift ? ' on' : ''), '⇧ Shift', { k: 'SHIFT' }));
      codes.forEach(function (code, i) {
        var t = alt ? keyChar(code, shift, true) : rows[r][i];
        if (t === '∅') t = '';
        if (t && /^[0-9]$/.test(t) && $('okDig').checked && lay.digits) t = lay.digits[+t];
        var b = mk(t ? (lay.dead && lay.dead[t] ? 'dead' : '') : 'empty', '', t ? { out: t, code: code } : { code: code });
        var bb = document.createElement('b'); bb.textContent = t ? label(t) : ''; var ii = document.createElement('i'); ii.textContent = lay.latin ? '' : QN[r].split(' ')[i];
        b.appendChild(ii); b.appendChild(bb); b.setAttribute('aria-label', t || 'empty');
        row.appendChild(b);
      });
      if (r === 3) row.appendChild(mk('w2', '⌫', { k: 'BACK' }, 'Backspace'));
      frag.appendChild(row);
    });
    var last = document.createElement('div'); last.className = 'ok-row';
    if (lay.alt && !lay.intlOff) last.appendChild(mk('w2' + (alt ? ' on' : ''), 'AltGr', { k: 'ALT' }, 'More characters'));
    if (lay.arabic) last.appendChild(mk('w2', 'ZWNJ', { out: '\u200c' }, 'Zero-width non-joiner: stops two letters from joining'));
    last.appendChild(mk('sp', lay.native, { k: 'SPACE' }, 'Space'));
    last.appendChild(mk('w2', '↵', { k: 'ENTER' }, 'New line'));
    frag.appendChild(last);
    kb.textContent = ''; kb.appendChild(frag);
    kb.setAttribute('dir', 'ltr');
  }
  var repeat = null;
  function press(b) {
    var k = b.dataset.k;
    if (b.classList.contains('empty')) return;
    if (k === 'SHIFT') { shift = !shift; drawKb(); return; }
    if (k === 'ALT') { alt = !alt; drawKb(); return; }
    if (k === 'BACK') { pendingDead = null; insert('', true); compEnd = -1; return; }
    if (k === 'SPACE') { typeChar(' '); compEnd = -1; return; }
    if (k === 'ENTER') { typeChar('\n'); compEnd = -1; return; }
    if (b.dataset.tone !== undefined) { applyTone(b.dataset.tone); return; }
    if (b.dataset.dead) { pendingDead = pendingDead && pendingDead.sym === b.dataset.dead ? null : { mark: b.dataset.mark, sym: b.dataset.dead, screen: true }; drawKb(); hint(pendingDead ? 'Accent ' + b.dataset.dead + ' waiting: tap a letter.' : ''); return; }
    var out = b.dataset.out;
    // on Latin keyboards, keys are passed through the transliteration like typed letters
    if (b.parentNode.classList.contains('ok-ex')) { if (pendingDead) typeChar(out); else { insert(out); compEnd = -1; } }
    else typeChar(out);
    if (shift || alt) { shift = false; alt = false; drawKb(); }
  }
  $('okKb').addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.ok-k'); if (!b) return;
    e.preventDefault();
    b.classList.add('down'); setTimeout(function () { b.classList.remove('down'); }, 120);
    press(b);
    if (b.dataset.k === 'BACK') { clearTimeout(repeat); repeat = setTimeout(function rep() { insert('', true); repeat = setTimeout(rep, 70); }, 450); }
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { $('okKb').addEventListener(ev, function () { clearTimeout(repeat); }); });
  $('okKb').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { var b = e.target.closest('.ok-k'); if (b) { e.preventDefault(); press(b); } } });

  // ---------- language list ----------
  function fillList(q) {
    var sel = $('okLang'), cur = sel.value || lay.id, n = 0; sel.textContent = '';
    var qq = (q || '').trim().toLowerCase();
    L.forEach(function (l) {
      if (qq && (l.name + ' ' + l.native + ' ' + l.lang).toLowerCase().indexOf(qq) === -1) return;
      var o = document.createElement('option'); o.value = l.id; o.textContent = l.name + (l.native !== l.name ? ' – ' + l.native : ''); sel.appendChild(o); n++;
    });
    if (!n) { var o = document.createElement('option'); o.value = ''; o.textContent = 'No keyboard matches "' + q + '"'; o.disabled = true; sel.appendChild(o); }
    if (BY[cur] && sel.querySelector('option[value="' + cur + '"]')) sel.value = cur;
    return n;
  }
  function setLayout(id, quiet) {
    var l = BY[id]; if (!l) return;
    lay = l; shift = false; alt = false; pendingDead = null; compEnd = -1;
    ta.setAttribute('dir', l.dir); ta.setAttribute('lang', l.lang); ta.style.textAlign = l.dir === 'rtl' ? 'right' : 'left';
    $('okConvL').hidden = !l.conv || l.conv === 'hangul'; $('okConvT').textContent = l.convLabel || '';
    $('okIntlL').hidden = !l.latin || !!l.intlOff;
    $('okDigL').hidden = !l.digits; $('okDigT').textContent = l.digits ? 'Native digits (' + l.digits.slice(1, 4) + ')' : '';
    $('okNastL').hidden = !l.nastaliq;
    if (!quiet) { $('okDig').checked = !!l.digDefault; $('okNast').checked = !!l.nastDefault; $('okConv').checked = true; }
    look();
    var help = l.latin ? (l.conv ? (l.note || 'Type with your keyboard or tap the keys; ' + l.convLabel.charAt(0).toLowerCase() + l.convLabel.slice(1) + '.') : 'Your own keyboard types as usual. Tap the accent and letter keys above for special characters, or hold AltGr (right Alt) for more.')
      : l.conv === 'hangul' ? 'Type with your computer keys (2-set Korean layout) or tap the keys; letters join into syllable blocks automatically.'
        : 'Press your computer keys to type ' + l.name + ' (the key labels show which key gives which letter), or tap the keys. Hold Shift for more letters.';
    $('okHelp').textContent = help;
    try { localStorage.setItem('gtn-kb-lang', l.id); } catch (e) {}
    drawKb(); hint('');
    if ($('okLang').value !== l.id) { fillList($('okFind').value); if (!$('okLang').querySelector('option[value="' + l.id + '"]')) { $('okFind').value = ''; fillList(''); } $('okLang').value = l.id; }
  }
  function look() {
    ta.classList.toggle('nastaliq', !!(lay.nastaliq && $('okNast').checked));
    ta.style.fontSize = $('okSize').value + 'px';
    if ($('okNoKb').checked) ta.setAttribute('inputmode', 'none'); else ta.removeAttribute('inputmode');
  }
  $('okLang').addEventListener('change', function () { if (this.value) setLayout(this.value); });
  $('okFind').addEventListener('input', function () { var n = fillList(this.value); if (n && $('okLang').value && $('okLang').value !== lay.id) setLayout($('okLang').value, false); });
  $('okFind').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if ($('okLang').value) { setLayout($('okLang').value); ta.focus(); } } });
  ['okNast', 'okSize', 'okNoKb'].forEach(function (id) { $(id).addEventListener('change', look); });
  $('okDig').addEventListener('change', drawKb);
  function stats() {
    var v = ta.value, seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter(lay.lang) : null, n = 0;
    if (seg && v.length < 200000) { for (var x of seg.segment(v)) n++; } else n = Array.from(v).length;
    $('okC').textContent = fmtNum(n, 0);
    var words = 0;
    if (seg && v.length < 200000) { var ws = new Intl.Segmenter(lay.lang, { granularity: 'word' }); for (var w of ws.segment(v)) if (w.isWordLike) words++; } else words = v.trim() ? v.trim().split(/\s+/).length : 0;
    $('okW').textContent = fmtNum(words, 0);
  }
  $('okCopy').addEventListener('click', function () { if (ta.value) copyText(ta.value, $('okCopy')); else say('', 'Nothing to copy yet. Type something first.'); });
  $('okDl').addEventListener('click', function () {
    if (!ta.value) { say('', 'Nothing to download yet. Type something first.'); return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + ta.value], { type: 'text/plain;charset=utf-8' })); a.download = 'text.txt'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });
  $('okClr').addEventListener('click', function () { ta.value = ''; saved = [0, 0]; pendingDead = null; compEnd = -1; stats(); say('', ''); hint(''); drawKb(); if (!$('okNoKb').checked) ta.focus(); });

  // start with the last keyboard used, or the browser's language
  var start = null;
  try { start = localStorage.getItem('gtn-kb-lang'); } catch (e) {}
  if (!BY[start]) {
    var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
    for (var i = 0; i < langs.length && !BY[start]; i++) {
      var code = String(langs[i]).toLowerCase(), base = code.split('-')[0];
      start = { iw: 'he', nn: 'no', nb: 'no', zh: 'zh-py' }[base] || base;
      if (base === 'ja' && !BY[start]) start = 'ja';
    }
    if (!BY[start]) start = 'en';
  }
  fillList(''); setLayout(start); stats();
})();
</script>
