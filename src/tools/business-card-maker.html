<style>
.bcm fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.bcm legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.bcm .fields { margin-bottom: 12px; }
.bcm .bcm-hint { display: block; font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.bcm .bcm-tpl { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 12px; }
.bcm .bcm-tpl button { font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; }
.bcm .bcm-tpl button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.bcm .bcm-sw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.bcm .bcm-sw button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.bcm .bcm-sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.bcm input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); }
.bcm .bcm-logo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.bcm .bcm-logo img { max-height: 44px; max-width: 120px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 2px; }
.bcm .bcm-prev { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.bcm .bcm-prev figure { margin: 0; }
.bcm .bcm-prev figcaption { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.bcm .bcm-prev canvas { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.18); background: #fff; }
.bcm .bcm-check { display: flex; align-items: center; font-weight: 400; margin: 0 0 12px; }
</style>
<div class="bcm" id="bcm">
<fieldset><legend>Your details</legend>
  <div class="fields">
    <div><label for="bcName">Name</label><input type="text" id="bcName" data-nomemo maxlength="60" placeholder="e.g. Sam Rivera"></div>
    <div><label for="bcTitle">Job title</label><input type="text" id="bcTitle" data-nomemo maxlength="60" placeholder="e.g. Interior Designer"></div>
    <div><label for="bcCompany">Company</label><input type="text" id="bcCompany" data-nomemo maxlength="60" placeholder="e.g. Rivera Studio"></div>
  </div>
  <div class="fields">
    <div><label for="bcPhone">Phone</label><input type="text" id="bcPhone" data-nomemo inputmode="tel" maxlength="40" placeholder="+61 400 000 000"></div>
    <div><label for="bcEmail">Email</label><input type="text" id="bcEmail" data-nomemo inputmode="email" maxlength="80" placeholder="sam@example.com"></div>
    <div><label for="bcWeb">Website</label><input type="text" id="bcWeb" data-nomemo inputmode="url" maxlength="80" placeholder="riverastudio.com"></div>
  </div>
  <div class="fields">
    <div><label for="bcAddr">Address (optional)</label><input type="text" id="bcAddr" data-nomemo maxlength="100" placeholder="12 Harbour St, Sydney"></div>
    <div><label for="bcTag">Tagline for the back (optional)</label><input type="text" id="bcTag" data-nomemo maxlength="60" placeholder="e.g. Spaces that feel like home"></div>
  </div>
  <label for="bcLogo">Logo (optional)</label>
  <div class="bcm-logo"><input type="file" id="bcLogo" data-nomemo accept="image/png,image/jpeg,image/webp,image/svg+xml"><img id="bcLogoImg" alt="Your logo" hidden><button type="button" class="btn ghost" id="bcLogoDel" hidden>Remove logo</button></div>
  <span class="bcm-hint">A PNG with a transparent background looks best. Without a logo, the company name is shown.</span>
</fieldset>
<fieldset><legend>Design</legend>
  <label>Template</label>
  <div class="bcm-tpl" id="bcTpl"></div>
  <label>Colour</label>
  <div class="bcm-sw" id="bcSw"></div>
  <div class="fields">
    <div><label for="bcFont">Font</label><select id="bcFont" data-nomemo><option value="sans">Modern sans</option><option value="serif">Classic serif</option><option value="display">Bold display name</option></select></div>
    <div><label for="bcSize">Card size</label><select id="bcSize" data-nomemo><option value="eu">85 × 55 mm (Europe, most countries)</option><option value="us">3.5 × 2 in (US, Canada)</option><option value="au">90 × 55 mm (Australia, India, China)</option><option value="jp">91 × 55 mm (Japan)</option></select></div>
  </div>
  <div class="fields">
    <div><label for="bcQr">QR code</label><select id="bcQr" data-nomemo><option value="vcard">Contact card (saves your details)</option><option value="web">Website link</option><option value="custom">My own text or link</option><option value="none">No QR code</option></select></div>
    <div><label for="bcQrSide">QR code goes on</label><select id="bcQrSide" data-nomemo><option value="back">The back</option><option value="front">The front</option></select></div>
  </div>
  <div class="fields" id="bcQrBox" hidden><div><label for="bcQrText">QR code text or link</label><input type="text" id="bcQrText" data-nomemo maxlength="300" placeholder="https://..."></div></div>
</fieldset>
<div class="bcm-prev" id="bcPrev"><figure><figcaption>Front</figcaption><canvas id="bcFront" width="600" height="388" aria-label="Front of the card"></canvas></figure><figure><figcaption>Back</figcaption><canvas id="bcBack" width="600" height="388" aria-label="Back of the card"></canvas></figure></div>
<div class="fields" style="margin-top:14px"><div><label for="bcOut">PDF type</label><select id="bcOut" data-nomemo><option value="bleed">For a print shop: 3 mm bleed, front and back</option><option value="marks">For a print shop: bleed and crop marks</option><option value="sheet">Print at home: 10 cards on A4</option><option value="sheetl">Print at home: 10 cards on US Letter</option></select></div></div>
<div class="btns">
  <button type="button" class="btn" id="bcPdf">Download PDF</button>
  <button type="button" class="btn ghost" id="bcPngF">Front as PNG</button>
  <button type="button" class="btn ghost" id="bcPngB">Back as PNG</button>
  <button type="button" class="btn ghost" id="bcReset">Start over</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

    if (q === 'custom') return v('bcQrText');
    var n = v('bcName'); if (!n && !v('bcPhone') && !v('bcEmail')) return '';
    var parts = n.split(/\s+/), last = parts.length > 1 ? parts.pop() : '', first = parts.join(' ');
    var L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + vesc(last) + ';' + vesc(first) + ';;;', 'FN:' + vesc(n)];
    if (v('bcCompany')) L.push('ORG:' + vesc(v('bcCompany'))); if (v('bcTitle')) L.push('TITLE:' + vesc(v('bcTitle')));
    if (v('bcPhone')) L.push('TEL;TYPE=WORK,VOICE:' + v('bcPhone')); if (v('bcEmail')) L.push('EMAIL:' + v('bcEmail'));
    if (v('bcWeb')) L.push('URL:' + v('bcWeb')); if (v('bcAddr')) L.push('ADR;TYPE=WORK:;;' + vesc(v('bcAddr')) + ';;;;');
    L.push('END:VCARD'); return L.join('\r\n');
  }
  function qrModules(text) { if (!text) return null; try { var q = qrcode(0, 'M'); q.addData(text, 'Byte'); q.make(); return q; } catch (e) { return 'big'; } }

  // ---------- design: returns shapes in points; backgrounds reach into the bleed b ----------
  function design(side, W, H, b, qr) {
    var o = [], A = S.color, tpl = S.tpl, pad = H * 0.13;
    var nf = $('bcFont').value === 'serif' ? 'serifb' : $('bcFont').value === 'display' ? 'display' : 'sansb', bf = $('bcFont').value === 'serif' ? 'serif' : 'sans';
    var onDark = lum(A) < 0.18 ? mixc(A, '#ffffff', 0.55) : A, lightA = lum(A) > 0.6, onA = lightA ? '#111111' : '#ffffff', accText = lightA ? '#333333' : A;
    var name = v('bcName'), title = v('bcTitle'), comp = v('bcCompany');
    var info = [['phone', v('bcPhone')], ['mail', v('bcEmail')], ['web', v('bcWeb')], ['pin', v('bcAddr')]].filter(function (x) { return x[1]; });
    function bg(c) { o.push({ k: 'rect', x: -b, y: -b, w: W + 2 * b, h: H + 2 * b, fill: c }); }
    function text(t, x, y, font, s, fill, align, maxW, ls) { if (!t) return 0; s = GD.fit(t, font, s, maxW, 4, ls); o.push({ k: 'text', t: t, x: x, y: y, font: font, s: s, fill: fill, align: align || 'left', ls: ls }); return s; }
    function qrDraw(x, y, size, dark) {
      if (!qr || qr === 'big') return;
      var n = qr.getModuleCount(), q = 2, cell = size / (n + 2 * q);
      o.push({ k: 'rect', x: x, y: y, w: size, h: size, fill: '#ffffff', r: size * 0.04 });
      for (var r = 0; r < n; r++) { var c = 0; while (c < n) { if (!qr.isDark(r, c)) { c++; continue; } var s0 = c; while (c < n && qr.isDark(r, c)) c++; o.push({ k: 'rect', x: x + (q + s0) * cell, y: y + (q + r) * cell, w: (c - s0) * cell + 0.05, h: cell + 0.05, fill: dark || '#000000' }); } }
    }
    function contacts(x, maxW, fill, iconFill, s, bottom, align) {
      var lh = s * 1.62, y = (bottom || H - pad) - (info.length - 1) * lh;
      info.forEach(function (it) {
        if (align === 'center') { text(it[1], W / 2, y, bf, s, fill, 'center', maxW); }
        else {
          var ic = s * 1.05; o.push({ k: 'path', d: ICON[it[0]], x: x, y: y - ic * 0.86, sc: ic / 24, stroke: iconFill, lw: s * 0.09 });
          text(it[1], x + ic + s * 0.55, y, bf, s, fill, 'left', maxW - ic - s * 0.55);
        }
        y += lh;
      });
    }
    function brand(cx, cy, maxW, maxH, fill, tag) {
      var th = tag ? maxH * 0.2 : 0;
      if (logoImg) {
        var iw = logoImg.naturalWidth, ih = logoImg.naturalHeight, k = Math.min(maxW / iw, (maxH - th * 1.4) / ih), w = iw * k, h = ih * k;
        o.push({ k: 'img', img: logoImg, alpha: logoImg.alpha, x: cx - w / 2, y: cy - (h + th * 1.4) / 2, w: w, h: h, fit: 'contain' });
        if (tag) text(tag, cx, cy + (h + th * 1.4) / 2, bf, Math.min(th, H * 0.065), fill, 'center', maxW * 1.2);
      } else {
        var nm = comp || name || 'Your company', s = GD.fit(nm, nf, H * 0.13, maxW);
        text(nm, cx, cy + s * 0.35 - (tag ? s * 0.5 : 0), nf, s, fill, 'center', maxW);
        if (tag) text(tag, cx, cy + s * 0.35 + s * 0.85, bf, Math.min(s * 0.5, H * 0.065), fill, 'center', maxW * 1.1);
      }
    }
    var qrHere = qr && qr !== 'big' && $('bcQrSide').value === side, qs = H * 0.4;
    if (side === 'front') {
      var ns = H * 0.115, ts = H * 0.065, cs = H * 0.056, x = pad * 1.15, maxW = W - x - pad - (qrHere ? qs + pad * 0.6 : 0);
      if (tpl === 'clean') {
        bg('#ffffff'); o.push({ k: 'rect', x: -b, y: -b, w: W * 0.03 + b, h: H + 2 * b, fill: A });
        text(name, x, pad + ns, nf, ns, '#15181c', 'left', W - x - pad);
        text(title, x, pad + ns + ts * 1.7, bf, ts, accText, 'left', W - x - pad);
        contacts(x, maxW, '#30363d', accText, cs);
        if (qrHere) qrDraw(W - pad - qs, H - pad * 0.8 - qs, qs);
      } else if (tpl === 'bold') {
        bg('#ffffff'); var bh = H * 0.42; o.push({ k: 'rect', x: -b, y: -b, w: W + 2 * b, h: bh + b, fill: A });
        text(name, x, bh - ts * 2.3, nf, ns, onA, 'left', W - x - pad);
        text(title, x, bh - ts * 0.9, bf, ts, onA, 'left', W - x - pad);
        contacts(x, maxW, '#30363d', accText, cs);
        if (qrHere) qrDraw(W - pad - qs * 0.85, bh + (H - bh - qs * 0.85) / 2, qs * 0.85);
      } else if (tpl === 'split') {
        bg('#ffffff'); var pw = W * 0.36; o.push({ k: 'rect', x: -b, y: -b, w: pw + b, h: H + 2 * b, fill: A });
        if (qrHere) { qrDraw((pw - qs * 0.9) / 2, (H - qs * 0.9) / 2, qs * 0.9); }
        else brand(pw / 2, H / 2, pw * 0.72, H * 0.5, onA, '');
        var sx = pw + pad * 0.9, sw = W - sx - pad * 0.8;
        text(name, sx, pad + ns, nf, ns, '#15181c', 'left', sw);
        text(title, sx, pad + ns + ts * 1.7, bf, ts, accText, 'left', sw);
        contacts(sx, sw, '#30363d', accText, cs * 0.95);
      } else if (tpl === 'centered') {
        bg('#ffffff'); o.push({ k: 'rect', x: H * 0.06, y: H * 0.06, w: W - H * 0.12, h: H - H * 0.12, stroke: A, lw: 0.6 });
        var top = qrHere ? H * 0.3 : H * 0.4;
        text(name, W / 2, top, nf, ns, '#15181c', 'center', W - 2 * pad, nf === 'display' ? 0 : 0.6);
        text(title.toUpperCase(), W / 2, top + ts * 1.9, bf, ts * 0.85, accText, 'center', W - 2 * pad, 1.2);
        o.push({ k: 'rect', x: W / 2 - 12, y: top + ts * 3, w: 24, h: 1.1, fill: A });
        if (qrHere) { qrDraw(W / 2 - qs * 0.36, top + ts * 3.8, qs * 0.72); }
        else { var line1 = [v('bcPhone'), v('bcEmail')].filter(Boolean).join('   ·   '), line2 = [v('bcWeb'), v('bcAddr')].filter(Boolean).join('   ·   ');
          text(line1, W / 2, H * 0.72, bf, cs, '#30363d', 'center', W - 2 * pad); text(line2, W / 2, H * 0.72 + cs * 1.7, bf, cs, '#30363d', 'center', W - 2 * pad); }
      } else if (tpl === 'dark') {
        bg('#16181d');
        o.push({ k: 'rect', x: x, y: pad * 0.9, w: 18, h: 1.4, fill: A });
        text(name, x, pad + ns * 1.35, nf, ns, '#ffffff', 'left', W - x - pad);
        text(title, x, pad + ns * 1.35 + ts * 1.7, bf, ts, onDark, 'left', W - x - pad);
        contacts(x, maxW, '#d8dce2', onDark, cs);
        if (qrHere) qrDraw(W - pad - qs, H - pad * 0.8 - qs, qs);
      } else { // corner
        bg('#ffffff');
        o.push({ k: 'circle', x: W + b * 0.2, y: -b * 0.2, r: H * 0.62, fill: A, op: 0.22 });
        o.push({ k: 'circle', x: W + b * 0.2, y: -b * 0.2, r: H * 0.4, fill: A });
        text(name, x, pad + ns, nf, ns, '#15181c', 'left', W * 0.55);
        text(title, x, pad + ns + ts * 1.7, bf, ts, accText, 'left', W * 0.55);
        contacts(x, maxW, '#30363d', accText, cs);
        if (qrHere) qrDraw(W - pad - qs * 0.85, H - pad * 0.8 - qs * 0.85, qs * 0.85);
      }
    } else {
      var bgc = { clean: A, bold: '#ffffff', split: A, centered: '#16181d', dark: A, corner: A }[tpl], fg = bgc === '#ffffff' ? '#15181c' : bgc === '#16181d' ? '#ffffff' : onA;
      bg(bgc);
      if (tpl === 'bold') o.push({ k: 'rect', x: -b, y: H * 0.86, w: W + 2 * b, h: H * 0.14 + b, fill: A });
      if (tpl === 'corner') { o.push({ k: 'circle', x: -b * 0.2, y: H + b * 0.2, r: H * 0.55, fill: '#ffffff', op: 0.12 }); o.push({ k: 'circle', x: W + b * 0.2, y: -b * 0.2, r: H * 0.35, fill: '#ffffff', op: 0.12 }); }
      if (tpl === 'centered') o.push({ k: 'rect', x: H * 0.06, y: H * 0.06, w: W - H * 0.12, h: H - H * 0.12, stroke: lum(A) < 0.12 ? '#8a8f98' : A, lw: 0.6 });
      if (qrHere) { brand(W * 0.32, H / 2, W * 0.42, H * 0.55, fg, v('bcTag')); qrDraw(W * 0.62, (H - qs * 1.05) / 2, qs * 1.05); }
      else brand(W / 2, H / 2, W * 0.6, H * 0.5, fg, v('bcTag'));
    }
    return o;
  }

  // ---------- preview ----------
  var timer = null, ready = false;
  function draw() {
    var sz = SIZES[$('bcSize').value] || SIZES.eu, W = sz[0], H = sz[1], qr = qrModules(qrText());
    var tiny = [];
    ['bcFront', 'bcBack'].forEach(function (id, i) {
      var c = $(id), sc = 2 * Math.max(1, Math.min(2.5, (c.clientWidth || 300) * (window.devicePixelRatio || 1) / 2 / W));
      c.width = Math.round(W * sc); c.height = Math.round(H * sc);
      var g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); var ops = design(i ? 'back' : 'front', W, H, 0, qr);
      ops.forEach(function (o) { if (o.k === 'text' && o.s < 5.5 && tiny.indexOf(o.t) < 0) tiny.push(o.t); });
      GD.drawCanvas(ops, g, sc);
    });
    if (qr === 'big') say('bad', 'The QR code text is too long. Shorten it or choose "Website link".');
    else if (tiny.length) say('bad', 'Some text had to shrink so much it will be hard to read when printed: "' + tiny[0].slice(0, 50) + '". Shorten it if you can.');
    else if ($('msg').classList.contains('bad') && /QR code text|hard to read/.test($('msg').textContent)) say('', '');
  }
  function changed() { clearTimeout(timer); timer = setTimeout(function () { if (ready) draw(); save(); }, 60); }
  function save() { var o = { tpl: S.tpl, color: S.color, logo: S.logo }; FIELDS.forEach(function (id) { o[id] = $(id).value; }); try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { try { o.logo = null; localStorage.setItem(KEY, JSON.stringify(o)); } catch (e2) {} } }
  function paint() {
    $('bcTpl').innerHTML = TPLS.map(function (t) { return '<button type="button" data-t="' + t[0] + '" aria-pressed="' + (t[0] === S.tpl) + '">' + t[1] + '</button>'; }).join('');
    $('bcSw').innerHTML = COLORS.map(function (c) { return '<button type="button" data-c="' + c + '" style="background:' + c + '" aria-label="Colour ' + c + '" aria-pressed="' + (c === S.color) + '"></button>'; }).join('') + '<input type="color" id="bcColor" data-nomemo aria-label="Pick your own colour" value="' + S.color + '">';
    $('bcQrBox').hidden = $('bcQr').value !== 'custom';
  }
  $('bcTpl').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.tpl = b.dataset.t; paint(); changed(); });
  $('bcSw').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.color = b.dataset.c; paint(); changed(); });
  $('bcSw').addEventListener('input', function (e) { if (e.target.id === 'bcColor') { S.color = e.target.value; changed(); } });
  $('bcm').addEventListener('input', function (e) { if (e.target.id !== 'bcLogo' && e.target.id !== 'bcColor') { $('bcQrBox').hidden = $('bcQr').value !== 'custom'; changed(); } });
  window.addEventListener('resize', changed);
  function setLogo(url, cb) {
    if (!url) { S.logo = null; logoImg = null; $('bcLogoImg').hidden = $('bcLogoDel').hidden = true; if (cb) cb(); return; }
    var im = new Image(); im.onload = function () { im.alpha = /^data:image\/png/.test(url); logoImg = im; S.logo = url; $('bcLogoImg').src = url; $('bcLogoImg').hidden = $('bcLogoDel').hidden = false; if (cb) cb(); }; im.onerror = function () { setLogo(null, cb); }; im.src = url;
  }
  $('bcLogo').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    GD.readImage(f, 1000, function (img, err) { if (!img) return say('bad', err); setLogo(img.src, function () { say('ok', 'Logo added.'); changed(); }); });
  });
  $('bcLogoDel').addEventListener('click', function () { setLogo(null); changed(); });

  // ---------- export ----------
  function fileBase() { return (v('bcName') || v('bcCompany') || 'business-card').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'business-card'; }
  function check() { if (!v('bcName') && !v('bcCompany')) { say('bad', 'Type your name or company first.'); $('bcName').focus(); return false; } if (qrModules(qrText()) === 'big') { say('bad', 'The QR code text is too long. Shorten it or choose "Website link".'); return false; } return true; }
  function png(side) {
    if (!check()) return;
    var sz = SIZES[$('bcSize').value], sc = 300 / 72, c = document.createElement('canvas');
    c.width = Math.round(sz[0] * sc); c.height = Math.round(sz[1] * sc);
    GD.drawCanvas(design(side, sz[0], sz[1], 0, qrModules(qrText())), c.getContext('2d'), sc);
    c.toBlob(function (bl) { if (!bl) return say('bad', 'This device could not make the picture.'); GD.download(bl, fileBase() + '-' + side + '.png'); say('ok', 'Saved the ' + side + ' as a ' + c.width + ' × ' + c.height + ' PNG (300 DPI).'); });
  }
  $('bcPngF').addEventListener('click', function () { png('front'); });
  $('bcPngB').addEventListener('click', function () { png('back'); });
  function marks(page, x, y, w, h, gap, len) {
    var c = PDFLib.rgb(0, 0, 0), t = 0.4;
    [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(function (p, i) {
      var sx = i % 2 ? 1 : -1, sy = i < 2 ? -1 : 1;
      page.drawLine({ start: { x: p[0] + sx * gap, y: p[1] }, end: { x: p[0] + sx * (gap + len), y: p[1] }, thickness: t, color: c });
      page.drawLine({ start: { x: p[0], y: p[1] - sy * gap }, end: { x: p[0], y: p[1] - sy * (gap + len) }, thickness: t, color: c });
    });
  }
  var busy = false;
  $('bcPdf').addEventListener('click', async function () {
    if (busy || !check()) return; busy = true; var btn = this; btn.disabled = true; say('', 'Making your PDF…');
    try {
      var sz = SIZES[$('bcSize').value], W = sz[0], H = sz[1], mode = $('bcOut').value, qr = qrModules(qrText()), env = await GD.newPdf('Business card – ' + (v('bcName') || v('bcCompany')), 'GetToolNest Business Card Maker');
      var doc = env.doc, B = 3 * MM, pages = 0;
      if (mode === 'bleed' || mode === 'marks') {
        var m = mode === 'marks' ? 18 : 0;
        for (var side of ['front', 'back']) {
          var pg = doc.addPage([W + 2 * B + 2 * m, H + 2 * B + 2 * m]);
          await GD.drawPdf(env, pg, design(side, W, H, B, qr), B + m, B + m);
          pg.setBleedBox(m, m, W + 2 * B, H + 2 * B); pg.setTrimBox(m + B, m + B, W, H);
          if (m) { pg.drawRectangle({ x: 0, y: 0, width: m, height: pg.getHeight(), color: PDFLib.rgb(1, 1, 1) }); pg.drawRectangle({ x: pg.getWidth() - m, y: 0, width: m, height: pg.getHeight(), color: PDFLib.rgb(1, 1, 1) }); pg.drawRectangle({ x: 0, y: 0, width: pg.getWidth(), height: m, color: PDFLib.rgb(1, 1, 1) }); pg.drawRectangle({ x: 0, y: pg.getHeight() - m, width: pg.getWidth(), height: m, color: PDFLib.rgb(1, 1, 1) }); marks(pg, m + B, m + B, W, H, B + 2, 9); }
          pages++;
        }
      } else {
        var PS = mode === 'sheetl' ? [612, 792] : [595.28, 841.89], cols = Math.max(1, Math.floor((PS[0] - 20 * MM / 2) / W)), rows = Math.max(1, Math.floor((PS[1] - 20 * MM / 2) / H));
        cols = Math.min(cols, 2); rows = Math.min(rows, 5);
        var gx = (PS[0] - cols * W) / 2, gy = (PS[1] - rows * H) / 2, fo = design('front', W, H, 0, qr), bo = design('back', W, H, 0, qr);
        for (var si = 0; si < 2; si++) {
          var p2 = doc.addPage(PS);
          for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
            var cc = si ? cols - 1 - c : c; // back page is mirrored so it lines up when printed on both sides
            var P = PDFLib; // clip each card to its own box so shapes that reach into the bleed do not spill onto the next card
            p2.pushOperators(P.pushGraphicsState(), P.rectangle(gx + cc * W, PS[1] - gy - (r + 1) * H, W, H), P.clip(), P.endPath());
            await GD.drawPdf(env, p2, si ? bo : fo, gx + cc * W, gy + r * H);
            p2.pushOperators(P.popGraphicsState());
          }
          var k = PDFLib.rgb(.55, .55, .55), Hh = PS[1];
          for (var i = 0; i <= cols; i++) { var xx = gx + i * W; p2.drawLine({ start: { x: xx, y: Hh - gy + 4 }, end: { x: xx, y: Hh - gy + 16 }, thickness: .4, color: k }); p2.drawLine({ start: { x: xx, y: Hh - gy - rows * H - 4 }, end: { x: xx, y: Hh - gy - rows * H - 16 }, thickness: .4, color: k }); }
          for (var j = 0; j <= rows; j++) { var yy = Hh - gy - j * H; p2.drawLine({ start: { x: gx - 4, y: yy }, end: { x: gx - 16, y: yy }, thickness: .4, color: k }); p2.drawLine({ start: { x: gx + cols * W + 4, y: yy }, end: { x: gx + cols * W + 16, y: yy }, thickness: .4, color: k }); }
          pages++;
        }
      }
      var bytes = await doc.save(), name = fileBase() + '-' + (mode.indexOf('sheet') === 0 ? 'print-sheet' : sz[2] + '-bleed') + '.pdf';
      GD.download(new Blob([bytes], { type: 'application/pdf' }), name);
      var note = 'Saved ' + name + ' (' + pages + ' pages, ' + fmtBytes(bytes.length) + ').' + (mode.indexOf('sheet') === 0 ? ' Print page 1, turn the sheet over, then print page 2 at 100% scale ("Actual size").' : ' Page 1 is the front, page 2 the back.');
      if (env.lost) say('bad', note + ' Some letters (' + env.lost + ') are not in the font and show as "?".'); else { say('ok', note); if (window.burst) burst(btn); }
    } catch (e) { say('bad', 'Sorry, the PDF could not be made. Check your connection (the PDF maker loads the first time) and try again.'); }
    busy = false; btn.disabled = false;
  });
  $('bcReset').addEventListener('click', function () {
    if (!confirm('Clear all your card details?')) return;
    FIELDS.forEach(function (id) { var el = $(id); if (el.tagName === 'SELECT') el.selectedIndex = 0; else el.value = ''; });
    if (/^en-(US|CA)$/i.test(navigator.language || '')) { $('bcSize').value = 'us'; $('bcOut').value = 'sheetl'; }
    S.tpl = 'clean'; S.color = COLORS[0]; setLogo(null); paint(); changed(); say('', 'Cleared.');
  });

  // ---------- start ----------
  var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (saved && typeof saved === 'object') {
    FIELDS.forEach(function (id) { if (typeof saved[id] !== 'string') return; var el = $(id); if (el.tagName === 'SELECT' && !el.querySelector('option[value="' + saved[id] + '"]')) return; el.value = saved[id]; });
    if (TPLS.some(function (t) { return t[0] === saved.tpl; })) S.tpl = saved.tpl;
    if (/^#[0-9a-f]{6}$/i.test(saved.color)) S.color = saved.color;
  } else if (/^en-(US|CA)$/i.test(navigator.language || '')) { $('bcSize').value = 'us'; $('bcOut').value = 'sheetl'; }
  paint();
  setLogo(saved && typeof saved.logo === 'string' && /^data:image\//.test(saved.logo) ? saved.logo : null, function () {
    GD.loadAll(['sans', 'sansb', 'serif', 'serifb', 'display']).then(function () { ready = true; draw(); }, function () { say('bad', 'The fonts could not load. Check your connection and reload.'); });
  });
})();
