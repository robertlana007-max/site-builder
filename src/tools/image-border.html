<style>
.ibd-stage { border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; margin: 0 0 14px; line-height: 0;
  background: repeating-conic-gradient(var(--line) 0 25%, var(--bg) 0 50%) 0 0 / 18px 18px; }
.ibd-stage canvas { max-width: 100%; max-height: 62vh; height: auto; }
.ibd-thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 0 10px; }
.ibd-thumbs button { flex: none; width: 64px; height: 64px; padding: 0; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); cursor: pointer; }
.ibd-thumbs button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ibd-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ibd-sec { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 0; margin-bottom: 14px; }
.ibd-sec h3 { font-size: 16px; margin: 0 0 10px; }
.ibd-sec input[type=color] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 3px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop photos here</b>JPG, PNG or WebP. One photo or many: the same border is added to each. Nothing is uploaded.</div>
<input type="file" id="file" accept="image/*" multiple hidden data-nomemo>
<div class="btns" style="margin:-4px 0 16px"><button class="btn ghost" id="sample" type="button">Try with a sample photo</button></div>
<div class="ibd-thumbs" id="thumbs" hidden></div>
<div class="ibd-stage" id="stage" hidden><canvas id="cv" aria-label="Preview of the photo with its border"></canvas></div>
<div class="ibd-sec">
  <h3>Style</h3>
  <div class="fields">
    <div><label for="preset">Quick style</label><select id="preset">
      <option value="">Choose a style…</option>
      <option value="white">Simple white border</option>
      <option value="black">Thin black frame</option>
      <option value="polaroid">Instant photo (Polaroid style)</option>
      <option value="mat">Gallery mat with frame</option>
      <option value="insta">Fit square for Instagram (no crop)</option>
      <option value="round">Rounded card with shadow</option>
    </select></div>
    <div><label for="layout">Layout</label><select id="layout"><option value="even">Even border</option><option value="polaroid">Instant photo (wide bottom)</option></select></div>
    <div><label for="ratio">Canvas shape</label><select id="ratio">
      <option value="keep">Keep the photo shape</option>
      <option value="1:1">Square 1:1 (Instagram post)</option>
      <option value="4:5">Portrait 4:5 (Instagram)</option>
      <option value="9:16">Story 9:16</option>
      <option value="16:9">Wide 16:9</option>
      <option value="3:2">Print 3:2</option>
    </select></div>
  </div>
</div>
<div class="ibd-sec">
  <h3>Border</h3>
  <div class="fields">
    <div><label for="bw">Border width: <span id="bwV">5</span>%</label><input type="range" id="bw" min="0" max="30" step="0.5" value="5"></div>
    <div><label for="fill">Border fill</label><select id="fill"><option value="color">Solid colour</option><option value="grad">Gradient</option><option value="blur">Blurred photo</option></select></div>
    <div><label for="c1">Colour</label><input type="color" id="c1" value="#ffffff"></div>
    <div id="c2Row" hidden><label for="c2">Second colour</label><input type="color" id="c2" value="#c7d2fe"></div>
    <div><label for="fw">Outer frame line: <span id="fwV">0</span>%</label><input type="range" id="fw" min="0" max="8" step="0.25" value="0"></div>
    <div id="fcRow" hidden><label for="fc">Frame line colour</label><input type="color" id="fc" value="#222222"></div>
  </div>
</div>
<div class="ibd-sec">
  <h3>Corners, shadow and caption</h3>
  <div class="fields">
    <div><label for="pr">Photo corners: <span id="prV">0</span>%</label><input type="range" id="pr" min="0" max="25" value="0"></div>
    <div><label for="or">Outer corners: <span id="orV">0</span>%</label><input type="range" id="or" min="0" max="25" value="0"></div>
    <div><label for="sh">Photo shadow: <span id="shV">0</span></label><input type="range" id="sh" min="0" max="10" value="0"></div>
    <div id="capRow"><label for="cap">Caption (optional)</label><input type="text" id="cap" maxlength="60" placeholder="Summer 2026" autocomplete="off" data-nomemo></div>
    <div><label for="cc">Caption colour</label><input type="color" id="cc" value="#333333"></div>
  </div>
</div>
<div class="fields">
  <div><label for="size">Saved size</label><select id="size"><option value="orig">Full resolution</option><option value="1080">1080 px wide (Instagram)</option><option value="2048">2048 px wide</option></select></div>
  <div><label for="fmt">Format</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG (keeps see-through corners)</option></select></div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Download this photo</button><button class="btn ghost" id="all" disabled hidden>Download all (ZIP)</button><a id="dl" hidden></a></div>
<p class="msg" id="msg"></p>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  'use strict';
  var MAX_SIDE = 6000, MAX_OUT = 16e6, items = [], cur = 0, job = 0, cv = $('cv'), font = 'GTN Caveat', fontP = null;
  function say(c, t) { PT.say(c, t); }
  function canvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function loadFont() {
    if (!fontP) fontP = fetch('../assets/vendor/fonts/caveat-latin-400-normal.woff2').then(function (r) { if (!r.ok) throw new Error('font'); return r.arrayBuffer(); })
      .then(function (b) { return new FontFace(font, b).load(); }).then(function (f) { document.fonts.add(f); preview(); }).catch(function () { font = 'cursive'; });
    return fontP;
  }

  // ---------- layout ----------
  function rr(x, X, Y, W, H, r) { r = Math.max(0, Math.min(r, W / 2, H / 2)); x.beginPath(); if (x.roundRect) x.roundRect(X, Y, W, H, r); else { x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); } }
  function layout(w, h) {
    var m = Math.min(w, h), b = +$('bw').value > 0 ? Math.max(1, Math.round(+$('bw').value / 100 * m)) : 0, pol = $('layout').value === 'polaroid';
    if (pol && b < m * 0.04) b = Math.round(m * 0.04);
    var top = b, bottom = pol ? Math.round(b * 2 + m * 0.16) : b, cw = w + 2 * b, ch = h + top + bottom;
    var W = cw, H = ch, rt = $('ratio').value;
    if (rt !== 'keep') { var p = rt.split(':'), r = +p[0] / +p[1]; if (W / H > r) H = Math.round(W / r); else W = Math.round(H * r); }
    return { W: W, H: H, ox: Math.round((W - cw) / 2), oy: Math.round((H - ch) / 2), b: b, top: top, bottom: bottom, cw: cw, ch: ch, m: m, pol: pol };
  }
  function render(img, scale, forJpg) {
    var w = img.width, h = img.height, L = layout(w, h), s = scale || 1;
    var c = canvas(Math.max(1, Math.round(L.W * s)), Math.max(1, Math.round(L.H * s))), x = c.getContext('2d');
    x.scale(c.width / L.W, c.height / L.H);
    var big = Math.max(L.W, L.H), outerR = +$('or').value / 100 * Math.min(L.W, L.H);
    if (forJpg) { x.fillStyle = '#ffffff'; x.fillRect(0, 0, L.W, L.H); }
    x.save(); rr(x, 0, 0, L.W, L.H, outerR); x.clip();
    // border fill
    var fill = $('fill').value;
    if (fill === 'grad') { var g = x.createLinearGradient(0, 0, L.W, L.H); g.addColorStop(0, $('c1').value); g.addColorStop(1, $('c2').value); x.fillStyle = g; x.fillRect(0, 0, L.W, L.H); }
    else if (fill === 'blur') {
      var sc = Math.max(L.W / w, L.H / h), t = canvas(Math.max(1, Math.round(w / 24)), Math.max(1, Math.round(h / 24))), tx = t.getContext('2d');
      tx.imageSmoothingQuality = 'high'; tx.drawImage(img, 0, 0, t.width, t.height); x.imageSmoothingQuality = 'high';
      x.drawImage(t, (L.W - w * sc) / 2, (L.H - h * sc) / 2, w * sc, h * sc); x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(0, 0, L.W, L.H);
    } else { x.fillStyle = $('c1').value; x.fillRect(0, 0, L.W, L.H); }
    // photo
    var px = L.ox + L.b, py = L.oy + L.top, pr = +$('pr').value / 100 * Math.min(w, h), sh = +$('sh').value;
    if (sh) { x.save(); x.shadowColor = 'rgba(0,0,0,' + (0.18 + sh * 0.03) + ')'; x.shadowBlur = sh * L.m / 150; x.shadowOffsetY = sh * L.m / 500; rr(x, px, py, w, h, pr); x.fillStyle = '#fff'; x.fill(); x.restore(); }
    x.save(); rr(x, px, py, w, h, pr); x.clip(); x.drawImage(img, px, py, w, h); x.restore();
    // caption
    var cap = $('cap').value.trim();
    if (cap) {
      var area = L.pol ? L.bottom : Math.max(L.b, (L.H - L.ch) / 2 + L.b), fs = Math.max(8, Math.min(area * 0.55, L.m * 0.09));
      x.font = fs + 'px "' + font + '", cursive'; x.fillStyle = $('cc').value; x.textAlign = 'center'; x.textBaseline = 'middle';
      while (fs > 8 && x.measureText(cap).width > L.W * 0.9) { fs *= 0.92; x.font = fs + 'px "' + font + '", cursive'; }
      var cy = L.pol ? L.oy + L.top + h + L.bottom / 2 : L.H - area / 2;
      x.fillText(cap, L.W / 2, cy);
    }
    // outer frame line
    var fw = +$('fw').value / 100 * Math.min(L.W, L.H);
    if (fw > 0) { x.lineWidth = fw * 2; x.strokeStyle = $('fc').value; rr(x, 0, 0, L.W, L.H, outerR); x.stroke(); }
    x.restore();
    return c;
  }
  function outScale(img) {
    var L = layout(img.width, img.height), v = $('size').value;
    var s = v === 'orig' ? 1 : +v / L.W;
    return Math.min(s, Math.sqrt(MAX_OUT / (L.W * L.H)), 8192 / Math.max(L.W, L.H)); // phones cannot make bigger pictures
  }
  var raf = 0;
  function preview() {
    if (!items.length) return;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      raf = 0; var it = items[cur]; if (!it) return;
      var L = layout(it.img.width, it.img.height), s = Math.min(1, 1100 / Math.max(L.W, L.H)), c = render(it.img, s, false);
      cv.width = c.width; cv.height = c.height; var x = cv.getContext('2d'); x.clearRect(0, 0, c.width, c.height); x.drawImage(c, 0, 0);
      var sc = outScale(it.img);
      say('', 'Saved size: ' + Math.round(L.W * sc) + ' × ' + Math.round(L.H * sc) + ' px' + (it.scaled ? ' (your photo was very large, so it was scaled to ' + it.img.width + ' × ' + it.img.height + ' px first)' : '') + '.');
    });
  }

  // ---------- presets ----------
  var PRESETS = {
    white: { layout: 'even', ratio: 'keep', bw: 5, fill: 'color', c1: '#ffffff', fw: 0, pr: 0, or: 0, sh: 0 },
    black: { layout: 'even', ratio: 'keep', bw: 2, fill: 'color', c1: '#111111', fw: 0, pr: 0, or: 0, sh: 0 },
    polaroid: { layout: 'polaroid', ratio: 'keep', bw: 5, fill: 'color', c1: '#fbfaf6', fw: 0, pr: 0, or: 1, sh: 0, cc: '#333333' },
    mat: { layout: 'even', ratio: 'keep', bw: 12, fill: 'color', c1: '#f4f1ea', fw: 2.5, fc: '#2b2b2b', pr: 0, or: 0, sh: 3 },
    insta: { layout: 'even', ratio: '1:1', bw: 0, fill: 'color', c1: '#ffffff', fw: 0, pr: 0, or: 0, sh: 0, size: '1080' },
    round: { layout: 'even', ratio: 'keep', bw: 6, fill: 'grad', c1: '#a5b4fc', c2: '#fbcfe8', fw: 0, pr: 4, or: 4, sh: 6, fmt: 'image/png' }
  };
  function set(id, v) { var el = $(id); el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }
  $('preset').addEventListener('change', function () {
    var p = PRESETS[$('preset').value]; if (!p) return;
    Object.keys(p).forEach(function (k) { set(k, p[k]); });
    if (!('size' in p)) set('size', 'orig');
    if (!('fmt' in p) && +p.or === 0) set('fmt', 'image/jpeg');
    $('preset').value = ''; preview();
  });
  function syncRows() {
    $('c2Row').hidden = $('fill').value !== 'grad'; $('fcRow').hidden = +$('fw').value === 0;
    ['bw', 'fw', 'pr', 'or', 'sh'].forEach(function (id) { $(id + 'V').textContent = $(id).value; });
  }
  ['layout', 'ratio', 'bw', 'fill', 'c1', 'c2', 'fw', 'fc', 'pr', 'or', 'sh', 'cap', 'cc', 'size'].forEach(function (id) {
    $(id).addEventListener('input', function () { syncRows(); preview(); }); $(id).addEventListener('change', function () { syncRows(); preview(); });
  });
  $('cap').addEventListener('input', loadFont);
  $('or').addEventListener('input', function () { if (+$('or').value > 0 && $('fmt').value === 'image/jpeg') say('', 'Tip: choose PNG to keep the rounded corners see-through (JPG fills them with white).'); });

  // ---------- files ----------
  function thumbs() {
    var t = $('thumbs'); t.innerHTML = ''; t.hidden = items.length < 2;
    items.forEach(function (it, i) {
      var b = document.createElement('button'), im = new Image(); b.type = 'button'; b.setAttribute('aria-pressed', String(i === cur)); b.setAttribute('aria-label', 'Show ' + it.name);
      im.src = it.thumb; im.alt = ''; b.appendChild(im); b.addEventListener('click', function () { cur = i; thumbs(); preview(); }); t.appendChild(b);
    });
    $('all').hidden = items.length < 2; $('all').disabled = items.length < 2; $('go').disabled = !items.length;
    $('stage').hidden = !items.length;
  }
  function add(files) {
    var mine = ++job, list = files.filter(function (f) { return /^image\//.test(f.type) && !/hei[cf]/i.test(f.type); }), bad = files.length - list.length;
    if (!list.length) { say('bad', files.length === 1 ? '"' + files[0].name + '" is not a photo this tool can open. Please choose JPG, PNG or WebP.' : 'None of those files are photos. Please choose JPG, PNG or WebP.'); return; }
    if (list.length > 100) { list = list.slice(0, 100); }
    items = []; cur = 0; say('', 'Opening ' + list.length + ' photo' + (list.length > 1 ? 's' : '') + '…');
    var failed = 0;
    (function next(i) {
      if (mine !== job) return;
      if (i >= list.length) {
        thumbs(); preview();
        if (!items.length) { say('bad', 'Could not read ' + (list.length > 1 ? 'those photos' : '"' + list[0].name + '"') + '. They may be damaged or in a format your browser cannot open.'); return; }
        if (bad || failed) setTimeout(function () { say('', (bad + failed) + ' file(s) were skipped because they are not photos or could not be read.'); }, 60);
        return;
      }
      loadImage(list[i], function (im) {
        if (mine !== job) return;
        if (im && im.naturalWidth) {
          var w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, MAX_SIDE / Math.max(w, h), Math.sqrt(24e6 / (w * h)));
          var c = canvas(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          var t = canvas(64, 64), tx = t.getContext('2d'), k = Math.max(64 / w, 64 / h); tx.drawImage(im, (64 - w * k) / 2, (64 - h * k) / 2, w * k, h * k);
          items.push({ img: c, name: list[i].name.replace(/\.[^.]+$/, '') || 'photo', thumb: t.toDataURL(), scaled: s < 1 });
        } else failed++;
        next(i + 1);
      });
    })(0);
  }
  PT.drop(true, add);
  $('sample').addEventListener('click', function () {
    var c = canvas(1200, 900), x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 900);
    g.addColorStop(0, '#ff9a5a'); g.addColorStop(0.55, '#ffd36e'); g.addColorStop(0.56, '#2f6f8f'); g.addColorStop(1, '#173c52'); x.fillStyle = g; x.fillRect(0, 0, 1200, 900);
    x.fillStyle = '#fff3c4'; x.beginPath(); x.arc(600, 470, 110, Math.PI, 0); x.fill();
    x.fillStyle = '#1d2b36'; x.beginPath(); x.moveTo(0, 900); x.lineTo(0, 700); x.quadraticCurveTo(300, 620, 520, 760); x.lineTo(520, 900); x.fill();
    c.toBlob(function (b) { add([new File([b], 'sunset.jpg', { type: 'image/jpeg' })]); }, 'image/jpeg', 0.9);
  });

  // ---------- save ----------
  function encode(it) {
    var type = $('fmt').value, c = render(it.img, outScale(it.img), type === 'image/jpeg');
    return PT.blob(c, type, 0.92).then(function (b) { if (!b) throw new Error('enc'); return b; });
  }
  function ext() { return $('fmt').value === 'image/png' ? 'png' : 'jpg'; }
  function saveBlob(b, n) { var a = document.createElement('a'), u = URL.createObjectURL(b); a.href = u; a.download = n; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000); }
  $('go').addEventListener('click', function () {
    var it = items[cur]; if (!it) return; var btn = $('go'); btn.disabled = true;
    encode(it).then(function (b) { var n = it.name + '-border.' + ext(); saveBlob(b, n); say('ok', 'Saved ' + n + ' (' + fmtBytes(b.size) + ').'); if (window.burst) burst(btn); })
      .catch(function () { say('bad', 'Your browser ran out of memory making this picture. Choose a smaller Saved size.'); }).then(function () { btn.disabled = false; });
  });
  $('all').addEventListener('click', function () {
    var btn = $('all'), files = [], used = {}; btn.disabled = true;
    (function next(i) {
      if (i >= items.length) {
        var z = PT.zip(files); saveBlob(z, 'photos-with-border.zip'); say('ok', 'Saved ' + files.length + ' photos in photos-with-border.zip (' + fmtBytes(z.size) + ').'); btn.disabled = false; return;
      }
      say('', 'Making photo ' + (i + 1) + ' of ' + items.length + '…');
      encode(items[i]).then(function (b) { return b.arrayBuffer(); }).then(function (a) {
        var n = items[i].name + '-border', k = n; for (var j = 2; used[k]; j++) k = n + '-' + j; used[k] = 1;
        files.push({ name: k + '.' + ext(), data: new Uint8Array(a) }); next(i + 1);
      }).catch(function () { say('bad', 'Ran out of memory on photo ' + (i + 1) + '. Choose a smaller Saved size and try again.'); btn.disabled = false; });
    })(0);
  });
  syncRows();
})();
</script>
