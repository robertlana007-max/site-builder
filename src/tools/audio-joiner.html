<style>
.aj-list { grid-template-columns: minmax(0, 1fr); }
.aj-list li { min-width: 0; }
.aj-list li span small { color: var(--muted); margin-inline-start: 4px; }
.aj-list li.aj-bad span { color: var(--bad); }
.aj-total { font-size: 15px; margin: -6px 0 14px; color: var(--muted); }
.aj-total b { color: var(--ink); }
.aj-audio { display: block; width: 100%; margin: 0 0 14px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop audio files here</b>Add two or more MP3, M4A, WAV, OGG or FLAC files. You can add more at any time. Nothing is uploaded.</div>
<input type="file" id="file" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.mp4,.mov,.webm,.mkv" multiple hidden data-nomemo>
<ul class="files aj-list" id="list"></ul>
<p class="aj-total" id="total" hidden></p>
<div id="opts" hidden>
  <div class="fields">
    <div><label for="join">Between the files</label><select id="join"><option value="none">Play straight on, no pause</option><option value="gap">Add a silent pause</option><option value="xfade">Crossfade (blend into each other)</option></select></div>
    <div id="secsBox" hidden><label for="secs" id="secsLbl">Seconds</label><input type="number" id="secs" min="0.1" max="15" step="0.1" value="2" inputmode="decimal"></div>
    <div><label for="fin">Fade in at the start</label><select id="fin"><option value="0">None</option><option value="1">1 second</option><option value="2">2 seconds</option><option value="5">5 seconds</option></select></div>
    <div><label for="fout">Fade out at the end</label><select id="fout"><option value="0">None</option><option value="2">2 seconds</option><option value="3">3 seconds</option><option value="5">5 seconds</option><option value="10">10 seconds</option></select></div>
    <div><label for="fmt">Save as</label><select id="fmt"><option value="mp3">MP3 (plays everywhere)</option><option value="m4a">M4A / AAC (iPhone, smaller)</option><option value="wav">WAV (no quality loss, big file)</option></select></div>
    <div id="kbpsBox"><label for="kbps">Quality</label><select id="kbps"><option value="128">128 kbps (small)</option><option value="192" selected>192 kbps (very good)</option><option value="256">256 kbps (best)</option></select></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="level"> Even out the volume (make quiet and loud files about the same level)</label></div>
</div>
<div class="meter" id="bar" hidden><i id="fill"></i></div>
<div class="btns"><button class="btn" id="go" disabled>Join audio files</button><a class="btn ghost" id="dl" hidden>Download</a></div>
<p class="msg" id="msg"></p>
<audio class="aj-audio" id="result" controls hidden></audio>
<script src="../assets/vendor/lamejs/lamejs.min.js"></script>

  dropEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  input.addEventListener('change', function () { if (input.files.length) add(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(function (ev) { dropEl.addEventListener(ev, function (e) { e.preventDefault(); dropEl.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { dropEl.addEventListener(ev, function (e) { e.preventDefault(); dropEl.classList.remove('over'); }); });
  dropEl.addEventListener('drop', function (e) { if (e.dataTransfer.files.length) add(e.dataTransfer.files); });

  // ---------- joining ----------
  function rms(b) {
    var s = 0, n = 0, step = Math.max(1, Math.floor(b.length / 400000));
    for (var c = 0; c < b.numberOfChannels; c++) { var d = b.getChannelData(c); for (var i = 0; i < d.length; i += step) { if (d[i] !== 0) { s += d[i] * d[i]; n++; } } }
    return n ? Math.sqrt(s / n) : 0;
  }
  function mix() {
    var g = good(), p = plan(), mode = $('join').value, L = new Float32Array(p.total), R = new Float32Array(p.total), gains = g.map(function () { return 1; });
    if ($('level').checked) {
      var r = g.map(rms), logs = r.filter(function (v) { return v > 0; }).map(Math.log), target = logs.length ? Math.exp(logs.reduce(function (a, b) { return a + b; }, 0) / logs.length) : 0;
      gains = r.map(function (v) { return v > 0 && target ? Math.max(0.25, Math.min(4, target / v)) : 1; });
    }
    g.forEach(function (it, k) {
      var b = it.buf, n = b.length, st = p.starts[k], a = b.getChannelData(0), z = b.numberOfChannels > 1 ? b.getChannelData(1) : a, gain = gains[k];
      var fadeIn = k > 0 && mode === 'xfade' ? p.starts[k - 1] + g[k - 1].buf.length - st : 0;
      var fadeOut = k < g.length - 1 && mode === 'xfade' ? st + n - p.starts[k + 1] : 0;
      for (var i = 0; i < n; i++) {
        var w = gain;
        if (fadeIn > 0 && i < fadeIn) w *= Math.sin(i / fadeIn * Math.PI / 2); // equal-power crossfade
        if (fadeOut > 0 && i >= n - fadeOut) w *= Math.cos((i - (n - fadeOut)) / fadeOut * Math.PI / 2);
        L[st + i] += a[i] * w; R[st + i] += z[i] * w;
      }
    });
    var fi = Math.min(+$('fin').value * SR, p.total / 2), fo = Math.min(+$('fout').value * SR, p.total / 2);
    for (var i = 0; i < fi; i++) { L[i] *= i / fi; R[i] *= i / fi; }
    for (i = 0; i < fo; i++) { var j = p.total - 1 - i; L[j] *= i / fo; R[j] *= i / fo; }
    var peak = 0; for (i = 0; i < p.total; i++) { var v = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (v > peak) peak = v; }
    if (peak > 0.97) { var s = 0.97 / peak; for (i = 0; i < p.total; i++) { L[i] *= s; R[i] *= s; } }
    return [L, R];
  }
  $('go').addEventListener('click', function () {
    if (busy || good().length < 2) return;
    busy = true; render(); $('go').disabled = true; $('dl').hidden = true; $('result').hidden = true; bar(0.05);
    var fmt = $('fmt').value, kbps = +$('kbps').value, t0 = Date.now(), n = good().length;
    say('', 'Joining ' + n + ' files…');
    new Promise(function (r) { setTimeout(r, 30); }).then(function () {
      var chs = mix(); bar(0.3);
      if (fmt === 'wav') return wavBlob(chs, SR);
      if (fmt === 'mp3') { say('', 'Saving as MP3…'); return encodeMp3(chs, SR, kbps, function (p) { bar(0.3 + p * 0.7); say('', 'Saving as MP3… ' + Math.round(p * 100) + '%'); }); }
      var wav = new File([wavBlob(chs, SR)], 'joined.wav', { type: 'audio/wav' }), secs2 = chs[0].length / SR; chs = null;
      return FF.run(wav, function (inp) { return ['-i', inp, '-c:a', 'aac', '-b:a', kbps + 'k', '-movflags', '+faststart']; }, 'joined.m4a', secs2,
        function (p) { bar(0.3 + p * 0.7); say('', 'Saving as M4A… ' + Math.round(p * 100) + '%'); }, say)
        .then(function (data) { return new Blob([data], { type: 'audio/mp4' }); });
    }).then(function (blob) {
      busy = false; render();
      if (dlUrl) URL.revokeObjectURL(dlUrl);
      dlUrl = URL.createObjectURL(blob);
      $('dl').href = dlUrl; $('dl').download = 'joined-audio.' + fmt; $('dl').textContent = 'Download ' + fmt.toUpperCase(); $('dl').hidden = false;
      $('result').src = dlUrl; $('result').hidden = false; bar(1);
      say('ok', 'Joined ' + n + ' files: ' + clock(plan().total / SR) + ', ' + fmtBytes(blob.size) + ' · took ' + Math.max(1, Math.round((Date.now() - t0) / 1000)) + ' s.');
    }).catch(function (e) {
      busy = false; render(); bar(null);
      say('bad', e instanceof RangeError ? 'Your device ran out of memory. Try fewer or shorter files, or MP3 instead of WAV.' : e && e.message ? e.message.replace(/video/g, 'audio') : 'Something went wrong while joining. Please try again.');
    });
  });
  refresh();
})();
</script>
