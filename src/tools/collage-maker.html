<style>
.cm-tray { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 12px; }
.cm-tray:empty { display: none; }
.cm-th { position: relative; flex: none; width: 68px; height: 68px; border: 2px solid var(--line); border-radius: 10px; padding: 0; background: var(--bg) center / cover no-repeat; cursor: grab; }
.cm-th[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cm-th.used::before { content: '✓'; position: absolute; bottom: 2px; inset-inline-start: 2px; width: 20px; height: 20px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 20px; text-align: center; }
.cm-th span { position: absolute; top: 2px; inset-inline-end: 2px; width: 24px; height: 24px; border-radius: 99px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; line-height: 24px; text-align: center; cursor: pointer; }
.cm-lays { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; margin-bottom: 16px; }
.cm-lays button { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px; cursor: pointer; }
.cm-lays button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.cm-lays svg { width: 100%; height: 100%; display: block; }
.cm-lays rect { fill: var(--muted); opacity: .55; }
.cm-lays button[aria-pressed="true"] rect { fill: var(--accent); opacity: .8; }
.cm-stage { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 12px; user-select: none; -webkit-user-select: none; }
.cm-stage canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 70vh; touch-action: none; cursor: grab; }
.cm-cell { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin-bottom: 14px; }
.cm-cell .btns { margin: 0 0 12px; }
.cm-cell .btn { min-height: 40px; padding: 6px 12px; }
.cm-tip { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.cm-col input[type=color] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 3px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop 2 to 9 photos here</b>JPG, PNG or WebP. Everything stays on your device.</div>
<input type="file" id="file" accept="image/*" multiple hidden data-nomemo>
<div class="cm-tray" id="tray" aria-label="Your photos"></div>
<div id="editor" hidden>
  <div class="fields"><div><label for="cnt">Layouts for</label><select id="cnt" data-nomemo><option value="2">2 photos</option><option value="3">3 photos</option><option value="4">4 photos</option><option value="5">5 photos</option><option value="6">6 photos</option><option value="7">7 photos</option><option value="8">8 photos</option><option value="9">9 photos</option><option value="all">All layouts</option></select></div></div>
  <div class="cm-lays" id="lays" role="group" aria-label="Layouts"></div>
  <p class="cm-tip" id="tip">Drag a photo to move it inside its frame. Use the zoom slider, the mouse wheel or two fingers to zoom. Drag a thumbnail onto a frame to put it there.</p>
  <div class="cm-stage"><canvas id="cv" aria-label="Collage preview. Click a frame to select it."></canvas></div>
  <div class="cm-cell" id="cellPanel" hidden>
    <div class="fields"><div><label for="zoom">Zoom selected photo: <span id="zoomV">100</span>%</label><input type="range" id="zoom" min="100" max="400" value="100" data-nomemo></div></div>
    <div class="btns"><button class="btn ghost" id="swap" type="button">⇄ Swap with another frame</button><button class="btn ghost" id="resetCell" type="button">Reset position</button><button class="btn ghost" id="clearCell" type="button">Empty this frame</button></div>
  </div>
  <div class="fields cm-col">
    <div><label for="ratio">Canvas shape</label><select id="ratio"><option value="1">Square 1:1</option><option value="0.8">Instagram portrait 4:5</option><option value="0.5625">Story 9:16</option><option value="1.7777778">Wide 16:9</option><option value="1.5">Photo 3:2</option><option value="0.7070707">A4 portrait</option><option value="1.4142857">A4 landscape</option></select></div>
    <div><label for="gap">Spacing: <span id="gapV">2</span>%</label><input type="range" id="gap" min="0" max="8" step="0.25" value="2"></div>
    <div><label for="rad">Corner rounding: <span id="radV">0</span>%</label><input type="range" id="rad" min="0" max="20" step="0.5" value="0"></div>
    <div><label for="bgc">Background colour</label><input type="color" id="bgc" value="#ffffff"></div>
    <div><label for="size">Export size (long side)</label><select id="size"><option value="1080">1080 px (social media)</option><option value="2000" selected>2000 px</option><option value="3000">3000 px (print)</option></select></div>
    <div><label for="fmt">Save as</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></div>
    <div id="qRow"><label for="q">Quality: <span id="qv">92</span>%</label><input type="range" id="q" min="50" max="100" value="92"></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="border" checked> Spacing around the outside edge too</label></div>
</div>

    if (v !== '') { var n = +v, prev = cells.findIndex(function (c) { return c.p === n; }); if (prev >= 0 && prev !== i) cells[prev].p = cells[i].p; cells[i] = { p: n, z: 1, ox: 0, oy: 0 }; sel = i; tray(); panel(); draw(); return; }
    var f = e.dataTransfer.files[0]; // a file dropped straight onto a frame
    if (f && photos.length < 9 && /^image\//.test(f.type)) load(f).then(function (p) { if (!p) { say('bad', 'Could not read that image.'); return; } photos.push(p); cells[i] = { p: photos.length - 1, z: 1, ox: 0, oy: 0 }; sel = i; tray(); panel(); draw(); });
  });

  $('zoom').addEventListener('input', function () { var c = cells[sel]; if (!c) return; c.z = $('zoom').value / 100; $('zoomV').textContent = $('zoom').value; draw(); });
  $('swap').addEventListener('click', function () { swapping = !swapping; panel(); draw(); if (swapping) say('', 'Tap the frame to swap with.'); });
  $('resetCell').addEventListener('click', function () { var c = cells[sel]; if (c) { c.z = 1; c.ox = c.oy = 0; panel(); draw(); } });
  $('clearCell').addEventListener('click', function () { var c = cells[sel]; if (c) { c.p = -1; c.z = 1; c.ox = c.oy = 0; tray(); panel(); draw(); } });
  $('cnt').addEventListener('change', function () { var n = $('cnt').value; laysUi(); if (n !== 'all' && (!lay || lay.length !== +n)) setLayout(LAYOUTS.find(function (L) { return L.length === +n; })); });
  ['ratio', 'gap', 'rad', 'bgc', 'border', 'fmt', 'q', 'size'].forEach(function (id) { $(id).addEventListener('input', draw); $(id).addEventListener('change', draw); });
  window.addEventListener('resize', draw);

  // ---------- export ----------
  $('go').addEventListener('click', function () {
    if (!lay || busy) return;
    var empty = cells.filter(function (c) { return c.p < 0; }).length;
    busy = true; sync(); say('', 'Creating your collage…');
    setTimeout(function () {
      var d = dims(+$('size').value), c = document.createElement('canvas'); c.width = d.W; c.height = d.H;
      render(c.getContext('2d'), d.W, d.H, false);
      var type = $('fmt').value;
      PT.blob(c, type, $('q').value / 100).then(function (b) {
        c.width = c.height = 0; busy = false; sync();
        if (!b) { say('bad', 'Your browser could not create the image. Try a smaller export size.'); return; }
        var name = 'collage-' + d.W + 'x' + d.H + '.' + (type === 'image/png' ? 'png' : 'jpg');
        PT.done(b, name, type, 'Saved ' + name + (empty ? '. Note: ' + empty + ' empty frame' + (empty === 1 ? ' shows' : 's show') + ' the background colour' : ''));
        $('dl').textContent = 'Download ' + name; $('dl').click();
      });
    }, 20);
  });
  laysUi(); sync();
})();
</script>
