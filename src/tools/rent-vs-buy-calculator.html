<style>
.rvb .stat b { font-size: clamp(17px, 4.6vw, 22px); overflow-wrap: normal; word-break: normal; }
.rvb fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.rvb legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.rvb .rvb-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 8px; }
.rvb .rvb-head h3 { margin: 0; }
.rvb .stat.rvb-win b { color: var(--ok); }
.rvb .rvb-verdict { font-size: 18px; font-weight: 700; margin: 14px 0 0; }
.rvb table.sched td, .rvb table.sched th { white-space: nowrap; }
.rvb table.sched { min-width: 560px; }
.fch { position: relative; margin: 16px 0 4px; }
.fch canvas { display: block; width: 100%; height: 240px; touch-action: pan-y; }
.fch-tip { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); margin-top: 6px; min-height: 20px; font-variant-numeric: tabular-nums; }
.fch-tip b { color: var(--ink); }
.fch-tip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
@media (max-width: 480px) { .rvb .stats { grid-template-columns: 1fr 1fr; } .rvb .stat { padding: 10px 12px; } }
</style>

<div class="fields">

  <div><label for="rvbYears">How many years you will stay</label><input type="number" id="rvbYears" min="1" max="50" step="1" inputmode="numeric" value="10"></div>
</div>
<fieldset>
  <legend>Buying</legend>
  <div class="fields">
    <div><label for="rvbPrice">Home price</label><input type="number" id="rvbPrice" min="0" step="any" inputmode="decimal" value="300000"></div>
    <div><label for="rvbDown">Down payment (%)</label><input type="number" id="rvbDown" min="0" max="100" step="any" inputmode="decimal" value="20"></div>
    <div><label for="rvbRate">Mortgage interest (% per year)</label><input type="number" id="rvbRate" min="0" step="any" inputmode="decimal" value="6"></div>
    <div><label for="rvbTerm">Mortgage term (years)</label><input type="number" id="rvbTerm" min="1" max="50" step="1" inputmode="numeric" value="25"></div>
  </div>
  <div class="fields">
    <div><label for="rvbBuyCost">Buying costs (% of price)</label><input type="number" id="rvbBuyCost" min="0" step="any" inputmode="decimal" value="3"></div>
    <div><label for="rvbSellCost">Selling costs (% of price)</label><input type="number" id="rvbSellCost" min="0" step="any" inputmode="decimal" value="5"></div>
    <div><label for="rvbTax">Property tax (% per year)</label><input type="number" id="rvbTax" min="0" step="any" inputmode="decimal" value="1"></div>
    <div><label for="rvbMaint">Upkeep and repairs (% per year)</label><input type="number" id="rvbMaint" min="0" step="any" inputmode="decimal" value="1"></div>
  </div>
  <div class="fields">
    <div><label for="rvbIns">Home insurance (per year)</label><input type="number" id="rvbIns" min="0" step="any" inputmode="decimal" value="1200"></div>
    <div><label for="rvbFees">Service or HOA fees (per month)</label><input type="number" id="rvbFees" min="0" step="any" inputmode="decimal" value="0"></div>
    <div><label for="rvbGrow">Home value growth (% per year)</label><input type="number" id="rvbGrow" step="any" inputmode="decimal" value="3"></div>
  </div>
</fieldset>
<fieldset>
  <legend>Renting</legend>
  <div class="fields">
    <div><label for="rvbRent">Monthly rent</label><input type="number" id="rvbRent" min="0" step="any" inputmode="decimal" value="1300"></div>
    <div><label for="rvbRentUp">Rent increase (% per year)</label><input type="number" id="rvbRentUp" step="any" inputmode="decimal" value="3"></div>
    <div><label for="rvbRentIns">Renter's insurance (per month)</label><input type="number" id="rvbRentIns" min="0" step="any" inputmode="decimal" value="15"></div>
    <div><label for="rvbInv">Investment return on savings (% per year)</label><input type="number" id="rvbInv" step="any" inputmode="decimal" value="5"></div>
  </div>
</fieldset>
<p class="rvb-verdict" id="rvbVerdict" aria-live="polite"></p>
<div class="stats">
  <div class="stat" id="rvbBuyBox"><span>Your wealth if you buy</span><b id="rvbBuyW">–</b></div>
  <div class="stat" id="rvbRentBox"><span>Your wealth if you rent</span><b id="rvbRentW">–</b></div>
  <div class="stat"><span>Buying breaks even after</span><b id="rvbBreak">–</b></div>
  <div class="stat"><span>Mortgage payment (monthly)</span><b id="rvbPay">–</b></div>
  <div class="stat"><span>First-month cost to own</span><b id="rvbOwn1">–</b></div>
  <div class="stat"><span>Cash needed up front</span><b id="rvbCash">–</b></div>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="rvb-head"><h3>Wealth over time</h3></div>
<div class="fch"><canvas id="rvbChart" role="img" aria-label="Line chart comparing your wealth when buying and when renting, year by year"></canvas><div class="fch-tip" id="rvbTip" aria-live="off"></div></div>
<div class="rvb-head"><h3>Year by year</h3></div>
<div class="scroll-x"><table class="sched"><thead><tr><th>Year</th><th>Owning costs</th><th>Rent paid</th><th>Home equity</th><th>Buyer's wealth</th><th>Renter's wealth</th></tr></thead><tbody id="rvbRows"></tbody></table></div>
<div class="btns"><button type="button" class="btn ghost" id="rvbCsv">Download table (CSV)</button><button type="button" class="btn ghost" id="rvbCopy">Copy summary</button></div>
<a id="dl" hidden></a>
</div>

    $('rvbBuyBox').className = 'stat' + (r.buy >= r.renter ? ' rvb-win' : ''); $('rvbRentBox').className = 'stat' + (r.renter > r.buy ? ' rvb-win' : '');
    $('rvbBreak').textContent = r.first == null ? 'Not within ' + o.years + ' yrs' : r.first + (r.first === 1 ? ' year' : ' years');
    $('rvbPay').textContent = money(r.pay); $('rvbOwn1').textContent = money(r.own1); $('rvbCash').textContent = money(r.cash, 0);
    var d = r.buy - r.renter;
    $('rvbVerdict').textContent = Math.abs(d) < 1 ? 'Buying and renting come out about the same after ' + o.years + ' years.' :
      (d > 0 ? 'Buying' : 'Renting') + ' leaves you about ' + money(Math.abs(d), 0) + ' better off after ' + o.years + (o.years === 1 ? ' year.' : ' years.');
    var notes = ['Wealth means what you would have at the end: for the buyer, the home value after selling costs minus the loan left, plus any savings; for the renter, the invested savings.'];
    if (o.down === 100) notes.push('You are paying cash for the home, so there is no mortgage.');
    say('', notes.join(' '));
    $('rvbRows').innerHTML = r.years.map(function (y) { return '<tr><td>' + y.y + '</td><td>' + money(y.own, 0) + '</td><td>' + money(y.rent, 0) + '</td><td>' + money(y.equity, 0) + '</td><td>' + money(y.buy, 0) + '</td><td>' + money(y.renter, 0) + '</td></tr>'; }).join('');
    var L = ['Start'].concat(r.years.map(function (y) { return 'Y' + y.y; }));
    var b0 = o.price * (1 - o.sellCost / 100) - r.loan;
    chart.set({ type: 'line', labels: L, fmt: function (v) { return money(v, 0); }, series: [
      { name: 'Buy', color: cssv('--accent', '#2563eb'), data: [b0].concat(r.years.map(function (y) { return y.buy; })) },
      { name: 'Rent', color: '#f59e0b', data: [r.cash].concat(r.years.map(function (y) { return y.renter; })) }] });
  }
  $('rvbCsv').addEventListener('click', function () {
    if (!last) return say('bad', 'Fix the numbers above first.');
    var lines = ['Year,Owning costs,Rent paid,Home equity after selling costs,Buyer wealth,Renter wealth'];
    last.r.years.forEach(function (y) { lines.push([y.y, y.own.toFixed(2), y.rent.toFixed(2), y.equity.toFixed(2), y.buy.toFixed(2), y.renter.toFixed(2)].join(',')); });
    var a = $('dl'); if (a.href) URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/csv' })); a.download = 'rent-vs-buy.csv'; a.click();
    say('ok', 'Saved rent-vs-buy.csv.');
  });
  $('rvbCopy').addEventListener('click', function () {
    if (!last) return say('bad', 'Fix the numbers above first.');
    copyText($('rvbVerdict').textContent + '\nWealth if you buy: ' + money(last.r.buy, 0) + '\nWealth if you rent: ' + money(last.r.renter, 0) + '\nMortgage payment: ' + money(last.r.pay) + '\nBreak-even: ' + $('rvbBreak').textContent, this);
  });
  $('rvb').addEventListener('input', function (e) { if (e.target.tagName !== 'SELECT') calc(); });
  curWire(calc);
  calc();
})();
</script>
