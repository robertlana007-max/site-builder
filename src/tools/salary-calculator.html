<div class="fields">
  <div><label for="amt">Pay amount</label><input type="number" id="amt" min="0" step="any" value="25"></div>
  <div><label for="per">Per</label><select id="per"><option value="hour">Hour</option><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option></select></div>
  <div><label for="hpw">Hours per week</label><input type="number" id="hpw" min="1" max="168" step="any" value="40"></div>
  <div><label for="dpw">Days per week</label><input type="number" id="dpw" min="1" max="7" step="any" value="5"></div>
  <div><label for="wpy">Weeks per year</label><input type="number" id="wpy" min="1" max="52" step="any" value="52"></div>
</div>
<div class="stats">
  <div class="stat"><span>Hourly</span><b id="hour">–</b></div>
  <div class="stat"><span>Daily</span><b id="day">–</b></div>
  <div class="stat"><span>Weekly</span><b id="week">–</b></div>
  <div class="stat"><span>Every 2 weeks</span><b id="bi">–</b></div>
  <div class="stat"><span>Monthly</span><b id="month">–</b></div>
  <div class="stat"><span>Yearly</span><b id="year">–</b></div>
</div>
<p class="msg" id="msg"></p>
<p class="msg">These are gross figures, before tax and deductions.</p>
<script>
(function () {
  var out = ['hour', 'day', 'week', 'bi', 'month', 'year'];
  function calc() {
    var a = +$('amt').value, hpw = +$('hpw').value, dpw = +$('dpw').value, wpy = +$('wpy').value;
    var err = !(a > 0) ? 'Enter a pay amount above 0.'
      : !(hpw > 0 && hpw <= 168) ? 'Hours per week must be above 0 and no more than 168.'
      : !(dpw > 0 && dpw <= 7) ? 'Days per week must be above 0 and no more than 7.'
      : !(wpy > 0 && wpy <= 52) ? 'Weeks per year must be above 0 and no more than 52.'
      : hpw > dpw * 24 ? 'You cannot work more than 24 hours a day. Check the hours and days per week.' : '';
    $('msg').className = err ? 'msg bad' : 'msg'; $('msg').textContent = err;
    if (err) { out.forEach(function (i) { $(i).textContent = '–'; }); return; }
    var perYear = { hour: hpw * wpy, day: dpw * wpy, week: wpy, month: 12, year: 1 };
    var y = a * perYear[$('per').value];
    $('hour').textContent = fmtNum(y / (hpw * wpy), 2);
    $('day').textContent = fmtNum(y / (dpw * wpy), 2);
    $('week').textContent = fmtNum(y / wpy, 2);
    $('bi').textContent = fmtNum(y / wpy * 2, 2);
    $('month').textContent = fmtNum(y / 12, 2);
    $('year').textContent = fmtNum(y, 2);
  }
  ['amt', 'per', 'hpw', 'dpw', 'wpy'].forEach(function (id) { $(id).addEventListener('input', calc); });
  calc();
})();
</script>
