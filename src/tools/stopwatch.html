<div class="big" id="time" role="timer" aria-live="off">00:00.00</div>
<div class="btns" style="justify-content:center">
  <button class="btn" id="go">Start</button>
  <button class="btn ghost" id="lap" disabled>Lap</button>
  <button class="btn ghost" id="reset">Reset</button>
</div>
<div class="scroll-x" id="lapBox" hidden style="margin-top:18px"><table class="sched"><thead><tr><th>Lap</th><th>Lap time</th><th>Total</th></tr></thead><tbody id="laps"></tbody></table></div>
<script>
(function () {
  var running = false, startAt = 0, elapsed = 0, lastLap = 0, laps = 0, raf = 0;
  function fmt(ms) {
    var cs = Math.floor(ms / 10), h = Math.floor(cs / 360000), m = Math.floor(cs / 6000) % 60, s = Math.floor(cs / 100) % 60, c = cs % 100;
    var p = function (x) { return String(x).padStart(2, '0'); };
    return (h ? p(h) + ':' : '') + p(m) + ':' + p(s) + '.' + p(c);
  }
  function now() { return running ? elapsed + performance.now() - startAt : elapsed; }
  function tick() { $('time').textContent = fmt(now()); if (running) raf = requestAnimationFrame(tick); }
  $('go').addEventListener('click', function () {
    if (running) { elapsed = now(); running = false; cancelAnimationFrame(raf); }
    else { startAt = performance.now(); running = true; tick(); }
    $('go').textContent = running ? 'Pause' : 'Resume';
    $('lap').disabled = !running;
    tick();
  });
  $('lap').addEventListener('click', function () {
    var t = now(), tr = document.createElement('tr');
    laps++;
    [String(laps), fmt(t - lastLap), fmt(t)].forEach(function (v) { var td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    $('laps').insertBefore(tr, $('laps').firstChild);
    lastLap = t; $('lapBox').hidden = false;
  });
  $('reset').addEventListener('click', function () {
    running = false; cancelAnimationFrame(raf); elapsed = 0; lastLap = 0; laps = 0;
    $('laps').innerHTML = ''; $('lapBox').hidden = true; $('go').textContent = 'Start'; $('lap').disabled = true; tick();
  });
})();
</script>
