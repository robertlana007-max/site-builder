<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop images here</b>JPG, PNG or WebP. Each image becomes one page. Nothing is uploaded.</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<ul class="files" id="list"></ul>
<div class="fields">
  <div><label for="page">Page size</label><select id="page"><option value="fit">Same as each image</option><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
  <div><label for="margin">Margin</label><select id="margin"><option value="0">None</option><option value="24">Small</option><option value="48">Large</option></select></div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Create PDF</button><a class="btn ghost" id="dl" hidden>Download PDF</a></div>
<p class="msg" id="msg"></p>
<script src="../assets/vendor/pdf-lib.min.js"></script>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  var files = [], SIZE = { a4: [595.28, 841.89], letter: [612, 792] };
  function refresh() { $('go').disabled = !files.length; $('dl').hidden = true; PT.say('', files.length > 1 ? 'Use the arrows to set the page order.' : ''); }
  function isImage(f) { return (/^image\//.test(f.type) || (!f.type && /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name))) && !/hei[cf]|svg/i.test(f.type); }
  PT.drop(true, function (list) {
    var ok = list.filter(isImage);
    files = files.concat(ok);
    PT.list(files, refresh); refresh();
    var skipped = list.length - ok.length;
    if (skipped) PT.say('bad', (skipped === 1 ? '1 file was skipped because it is not' : skipped + ' files were skipped because they are not') + ' a JPG, PNG, WebP or GIF picture. For iPhone HEIC photos, share them as JPG first.');
  });
  // The EXIF orientation of a JPG (1 = upright). Phone photos are often stored sideways with this flag set.
  function orientation(b) {
    var d = new DataView(b), i = 2;
    while (i + 4 < d.byteLength && d.getUint8(i) === 0xFF) {
      var mark = d.getUint8(i + 1), len = d.getUint16(i + 2);
      if (mark === 0xE1 && d.getUint32(i + 4) === 0x45786966) { // "Exif"
        var t = i + 10, le = d.getUint16(t) === 0x4949;
        if (t + 8 > d.byteLength) return 1;
        var ifd = t + d.getUint32(t + 4, le), count = d.getUint16(ifd, le);
        for (var k = 0; k < count; k++) {
          var e = ifd + 2 + k * 12;
          if (e + 10 > d.byteLength) return 1;
          if (d.getUint16(e, le) === 0x0112) return d.getUint16(e + 8, le) || 1;
        }
        return 1;
      }
      if (mark === 0xDA) break;
      i += 2 + len;
    }
    return 1;
  }
  // JPG and PNG are embedded untouched (a sideways JPG is turned on the page, not re-saved); other formats are redrawn as JPG first.
  // Returns the embedded image and how far (clockwise) it must be turned to stand upright.
  async function embed(doc, f) {
    var buf = await f.arrayBuffer(), h = new Uint8Array(buf.slice(0, 4)), turn = 0;
    if (h[0] === 0xFF && h[1] === 0xD8) {
      var o = 1; try { o = orientation(buf); } catch (e) {}
      if (o === 1 || o === 3 || o === 6 || o === 8) return { img: await doc.embedJpg(buf), turn: { 1: 0, 3: 180, 6: 90, 8: 270 }[o] };
    } else if (h[0] === 0x89 && h[1] === 0x50 && h[2] === 0x4E && h[3] === 0x47) return { img: await doc.embedPng(buf), turn: 0 };
    var img = await new Promise(function (res) { loadImage(f, res); }); // the browser applies any EXIF orientation here
    if (!img || !img.naturalWidth) throw new Error('"' + f.name + '" could not be read as an image.');
    var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0);
    var blob = await PT.blob(c, 'image/jpeg', 0.92);
    if (!blob) throw new Error('"' + f.name + '" is too large to convert on this device.');
    return { img: await doc.embedJpg(await blob.arrayBuffer()), turn: turn };
  }
  $('go').addEventListener('click', function () {
    PT.run(async function () {
      var doc = await PDFLib.PDFDocument.create(), m = +$('margin').value, kind = $('page').value;
      for (var i = 0; i < files.length; i++) {
        PT.say('', 'Adding image ' + (i + 1) + ' of ' + files.length + '…');
        var r;
        try { r = await embed(doc, files[i]); }
        catch (e) { throw new Error(/could not be read|too large/.test(e.message) ? e.message : '"' + files[i].name + '" is damaged or not a supported image.'); }
        var img = r.img, side = r.turn === 90 || r.turn === 270, iw = side ? img.height : img.width, ih = side ? img.width : img.height; // size as it is seen
        var pw, ph;
        if (kind === 'fit') { pw = iw + m * 2; ph = ih + m * 2; }
        else { pw = SIZE[kind][0]; ph = SIZE[kind][1]; if (iw > ih) { var t = pw; pw = ph; ph = t; } } // landscape page for wide images
        // Shrink big images to fit the paper, but never enlarge small ones (that makes them blurry); they are centered instead.
        var s = kind === 'fit' ? 1 : Math.min(1, (pw - m * 2) / iw, (ph - m * 2) / ih);
        var w = iw * s, h = ih * s, x = (pw - w) / 2, y = (ph - h) / 2, page = doc.addPage([pw, ph]);
        // drawImage turns the picture around its bottom-left corner, so move that corner to where it ends up
        if (r.turn === 90) page.drawImage(img, { x: x, y: y + h, width: h, height: w, rotate: PDFLib.degrees(-90) });
        else if (r.turn === 270) page.drawImage(img, { x: x + w, y: y, width: h, height: w, rotate: PDFLib.degrees(90) });
        else if (r.turn === 180) page.drawImage(img, { x: x + w, y: y + h, width: w, height: h, rotate: PDFLib.degrees(180) });
        else page.drawImage(img, { x: x, y: y, width: w, height: h });
      }
      PT.done(await doc.save(), 'images.pdf', 'application/pdf', 'Created a PDF with ' + files.length + (files.length === 1 ? ' page' : ' pages'));
    });
  });
})();
</script>
