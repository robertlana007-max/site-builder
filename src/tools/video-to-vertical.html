<style>
.vt-info { margin: -4px 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.vt-info b { color: var(--ink); }
.vt-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 14px; }
.vt-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s; }
.vt-video { display: block; width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 14px 0 4px; }
.vt-hint { font-size: 14px; color: var(--muted); margin: -8px 0 14px; }
</style>
<style>
.v9-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin: 6px 0 14px; }
.v9-prev { flex: 0 1 auto; margin: 0 auto; text-align: center; }
.v9-prev canvas { display: block; max-width: 100%; height: auto; width: 225px; border-radius: 12px; border: 1px solid var(--line); background: #000; margin: 0 auto; }
.v9-ctl { display: flex; gap: 8px; align-items: center; margin: 8px 0 0; }
.v9-ctl .btn { flex: none; padding: 8px 14px; }
.v9-ctl input { flex: 1; min-width: 0; accent-color: var(--accent); }
.v9-ctl span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.6em; }
.v9-opts { flex: 1 1 300px; min-width: 0; }
.v9-range { display: flex; align-items: center; gap: 10px; }
.v9-range input { flex: 1; min-width: 0; accent-color: var(--accent); }
.v9-range output { min-width: 3.4em; text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; }
.v9-shape { display: flex; gap: 8px; margin: 0 0 14px; }
.v9-shape button { flex: 1; font: inherit; font-weight: 600; font-size: 14px; padding: 8px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface, var(--bg)); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.v9-shape button i { display: block; border: 2px solid currentColor; border-radius: 3px; }
.v9-shape button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a video here</b>MP4, MOV, WebM, MKV or AVI, up to 1 GB. Your video never leaves your device.</div>
<input type="file" id="file" accept="video/*,.mkv,.mov,.avi,.m4v,.3gp,.ts,.mts,.wmv,.flv" hidden data-nomemo>
<p class="vt-info" id="info"></p>
<div id="editor" hidden>
  <div class="v9-shape" id="shapes" role="group" aria-label="Shape">
    <button type="button" data-shape="9x16" aria-pressed="true"><i style="width:18px;height:32px"></i>9:16 Reels, TikTok, Shorts</button>
    <button type="button" data-shape="4x5" aria-pressed="false"><i style="width:24px;height:30px"></i>4:5 Instagram post</button>
    <button type="button" data-shape="1x1" aria-pressed="false"><i style="width:28px;height:28px"></i>1:1 Square</button>
  </div>
  <div class="v9-wrap">
    <div class="v9-prev">
      <canvas id="prev" width="360" height="640" aria-label="Preview of the new video"></canvas>
      <div class="v9-ctl"><button class="btn ghost" type="button" id="pp">▶</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Preview position"><span id="ptime">0:00.0</span></div>
      <p class="vt-hint" id="noPlay" hidden style="margin:8px 0 0">Your browser cannot play this video format, so there is no preview. The settings still work.</p>
      <video id="player" playsinline preload="auto" hidden></video>
    </div>
    <div class="v9-opts">
      <div class="fields">
        <div><label for="fill">Fill the empty space with</label><select id="fill"><option value="blur">A blurred copy of the video</option><option value="color">A plain colour</option><option value="crop">Nothing: zoom in to fill (cuts the sides)</option></select></div>
        <div id="colorBox" hidden><label for="color">Background colour</label><input type="color" id="color" value="#000000"></div>
        <div id="blurBox"><label for="blur">Blur strength</label><select id="blur"><option value="3">Light</option><option value="6" selected>Medium</option><option value="10">Strong</option></select></div>
        <div><label for="zoom">Zoom</label><div class="v9-range"><input type="range" id="zoom" min="100" max="300" step="5" value="100"><output id="zoomOut">100%</output></div></div>
        <div><label for="px">Left ↔ right</label><div class="v9-range"><input type="range" id="px" min="0" max="100" step="1" value="50"><output id="pxOut">Centre</output></div></div>
        <div><label for="py">Up ↕ down</label><div class="v9-range"><input type="range" id="py" min="0" max="100" step="1" value="50"><output id="pyOut">Centre</output></div></div>
        <div><label for="res">Size</label><select id="res"><option value="720">720p (faster)</option><option value="1080">1080p Full HD (slower)</option></select></div>
        <div><label for="q">Quality</label><select id="q"><option value="20">High (bigger file)</option><option value="23" selected>Good (recommended)</option><option value="27">Smaller file</option></select></div>
      </div>
      <div class="checks"><label><input type="checkbox" id="mute"> Remove the sound</label></div>
      <p class="vt-hint" id="hint"></p>
    </div>
  </div>
</div>
<div class="vt-bar" id="bar" hidden><i id="barFill"></i></div>
<div class="btns"><button class="btn" id="go" disabled>Make vertical video</button><button class="btn ghost" id="stop" type="button" hidden>Cancel</button><a class="btn ghost" id="dl" hidden>Download MP4</a></div>

<script>
// Video engine loader (ffmpeg.wasm, single-thread build, no special server headers needed).

(function () {

    if (L.cw > 0 && L.ch > 0) g.drawImage(P, L.cx * sx, L.cy * sy, L.cw * sx, L.ch * sy, L.ox0 * k, L.oy0 * k, (L.ox1 - L.ox0) * k, (L.oy1 - L.oy0) * k);
  }
  function loop() { draw(); $('ptime').textContent = VT.clock(P.currentTime || 0); if (info) $('seek').value = Math.round((P.currentTime || 0) / info.duration * 1000); if (!P.paused) raf = requestAnimationFrame(loop); }
  function hint() {
    if (!info) return;
    labels(); draw();
    var o = out(), mode = $('fill').value, L = layout(o.W, o.H), lost = mode !== 'crop' || L.full ? 1 - (L.cw * L.ch) / (info.width * info.height) : 0;
    var txt = 'New video: ' + o.W + ' × ' + o.H + ' MP4.';
    if (lost > 0.02) txt += ' About ' + Math.round(lost * 100) + '% of the picture is cut off at the edges. Use the sliders to choose which part stays.';
    var slow = o.W * o.H / 921600 * (mode === 'blur' ? 1.3 : 1), mins = info.duration * slow / 60;
    txt += ' Expect roughly ' + (mins < 1 ? 'under a minute' : Math.round(mins) + ' to ' + Math.round(mins * 3) + ' minutes') + ' on a computer, longer on a phone.';
    $('hint').textContent = txt;
  }
  Array.prototype.forEach.call($('shapes').children, function (b) {
    b.addEventListener('click', function () {
      shape = b.dataset.shape; Array.prototype.forEach.call($('shapes').children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      $('dl').hidden = true; hint();
    });
  });
  ['fill', 'color', 'blur', 'zoom', 'px', 'py', 'res', 'q', 'mute'].forEach(function (id) { $(id).addEventListener('input', hint); $(id).addEventListener('change', hint); });
  function reset() {
    file = null; info = null; $('editor').hidden = true; cancelAnimationFrame(raf);
    P.pause(); P.removeAttribute('src'); P.load();
    if (url) { URL.revokeObjectURL(url); url = null; }
  }
  VT.pick(reset, function (f, i) {
    file = f; info = i; url = URL.createObjectURL(f);
    $('noPlay').hidden = true; P.hidden = false; P.muted = false; P.src = url;
    $('mute').checked = false; $('mute').disabled = !i.audio;
    if (i.height > i.width && shape === '9x16') VT.say('', 'This video is already upright. You can still change its shape, zoom in, or add a blurred background.');
    $('editor').hidden = false; hint();
  });
  P.addEventListener('loadeddata', function () { draw(); });
  P.addEventListener('seeked', function () { draw(); });
  P.addEventListener('error', function () { if (P.getAttribute('src')) { P.hidden = true; $('noPlay').hidden = false; draw(); } });
  P.addEventListener('play', function () { $('pp').textContent = '❚❚'; loop(); });
  P.addEventListener('pause', function () { $('pp').textContent = '▶'; draw(); });
  P.addEventListener('ended', function () { $('pp').textContent = '▶'; });
  $('pp').addEventListener('click', function () { if (P.hidden || !info) return; if (P.paused) { var p = P.play(); if (p && p.catch) p.catch(function () {}); } else P.pause(); });
  $('seek').addEventListener('input', function () { if (!info || P.hidden) return; P.currentTime = $('seek').value / 1000 * info.duration; $('ptime').textContent = VT.clock(P.currentTime); });
  window.addEventListener('resize', draw);

  $('go').addEventListener('click', function () {
    if (!file) return;
    P.pause();
    var f = file, i = info, o = out(), W = o.W, H = o.H, L = layout(W, H), mode = $('fill').value, mute = $('mute').checked || !i.audio, q = $('q').value;
    function ev(v) { return Math.max(2, Math.round(v / 2) * 2); }
    var cw = Math.min(ev(L.cw), i.width - i.width % 2), ch = Math.min(ev(L.ch), i.height - i.height % 2);
    var cx = Math.max(0, Math.min(i.width - cw, Math.round(L.cx))), cy = Math.max(0, Math.min(i.height - ch, Math.round(L.cy)));
    var ow = Math.min(W, ev(L.ox1 - L.ox0)), oh = Math.min(H, ev(L.oy1 - L.oy0)), ox = Math.max(0, Math.min(W - ow, Math.round(L.ox0))), oy = Math.max(0, Math.min(H - oh, Math.round(L.oy0)));
    var fg = 'crop=' + cw + ':' + ch + ':' + cx + ':' + cy + ',scale=' + ow + ':' + oh + ':flags=bicubic,setsar=1';
    var graph;
    if (L.full) graph = '[0:v]' + fg + ',format=yuv420p[v]';
    else if (mode === 'color') graph = '[0:v]' + fg + ',pad=' + W + ':' + H + ':' + ox + ':' + oy + ':color=0x' + $('color').value.slice(1) + ',format=yuv420p[v]';
    else {
      var bw = ev(W / 8), bh = ev(H / 8), r = +$('blur').value;
      graph = '[0:v]split=2[a][b];[a]scale=' + bw + ':' + bh + ':force_original_aspect_ratio=increase,crop=' + bw + ':' + bh + ',boxblur=' + r + ':2,scale=' + W + ':' + H + ',eq=brightness=-0.06,setsar=1[bg];' +
        '[b]' + fg + '[fg];[bg][fg]overlay=' + ox + ':' + oy + ',format=yuv420p[v]';
    }
    VT.go('Making your ' + shape.replace('x', ':') + ' video', function (pct) {
      return FF.run(f, function (inp) {
        var a = ['-i', inp, '-filter_complex', graph, '-map', '[v]'];
        if (!mute) a.push('-map', '0:a:0?', '-c:a', i.acodec === 'aac' ? 'copy' : 'aac', '-b:a', '160k'); else a.push('-an');
        a.push('-c:v', 'libx264', '-preset', 'veryfast', '-crf', q, '-movflags', '+faststart');
        return a;
      }, 'vertical.mp4', i.duration, pct, VT.say).then(function (data) {
        VT.done(data, VT.base(f.name) + '-' + shape.replace('x', 'x') + '.mp4', 'video/mp4');
        return 'Your ' + W + ' × ' + H + ' video is ready (' + fmtBytes(data.length) + ')';
      });
    });
  });
})();
</script>
