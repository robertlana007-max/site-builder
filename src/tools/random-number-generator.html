<div class="fields">
  <div><label for="min">From</label><input type="number" id="min" step="1" value="1"></div>
  <div><label for="max">To</label><input type="number" id="max" step="1" value="100"></div>
  <div><label for="n">How many numbers</label><input type="number" id="n" min="1" max="1000" step="1" value="1"></div>
</div>
<div class="checks"><label><input type="checkbox" id="uniq">No repeats</label><label><input type="checkbox" id="sort">Sort results</label></div>
<div class="out" id="out" aria-live="polite">–</div>
<div class="btns"><button class="btn" id="gen">Generate</button><button class="btn ghost" id="cp">Copy</button></div>
<p class="msg" id="msg"></p>
<script>
(function () {
  function rand(n) { // unbiased integer in [0, n), n up to 2^32
    var max = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
    do { crypto.getRandomValues(a); } while (a[0] >= max);
    return a[0] % n;
  }
  function bad(t) { $('out').textContent = '–'; $('msg').className = 'msg bad'; $('msg').textContent = t; }
  function gen() {
    var lo = Math.round(+$('min').value), hi = Math.round(+$('max').value), n = Math.floor(+$('n').value);
    if ($('min').value === '' || $('max').value === '' || isNaN(lo) || isNaN(hi)) return bad('Enter both numbers.');
    if (lo > hi) return bad('"From" must not be larger than "To".');
    var span = hi - lo + 1;
    if (span > 4294967296) return bad('That range is too large. Keep it within about 4 billion.');
    if (!(n >= 1 && n <= 1000)) return bad('Choose between 1 and 1000 numbers.');
    if ($('uniq').checked && n > span) return bad('There are only ' + span + ' different numbers in that range.');
    var out = [], seen = new Set();
    while (out.length < n) {
      var v = lo + rand(span);
      if ($('uniq').checked) { if (seen.has(v)) continue; seen.add(v); }
      out.push(v);
    }
    if ($('sort').checked) out.sort(function (a, b) { return a - b; });
    $('out').textContent = out.join(', ');
    $('msg').textContent = '';
  }
  $('gen').addEventListener('click', gen);
  $('cp').addEventListener('click', function () { copyText($('out').textContent, $('cp')); });
  gen();
})();
</script>
