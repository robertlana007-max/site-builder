<label for="txt">Text or URL</label>
<textarea id="txt" spellcheck="false" placeholder="https://example.com/search?q=hello world"></textarea>
<div class="btns">
  <button class="btn" id="enc">Encode</button>
  <button class="btn" id="dec">Decode</button>
  <button class="btn ghost" id="cp">Copy</button>
  <button class="btn ghost" id="clr">Clear</button>
</div>
<div class="checks" style="margin-top:14px"><label><input type="checkbox" id="full">Keep URL structure (do not encode : / ? &amp; = #)</label></div>
<p class="msg" id="msg"></p>
<script>
(function () {
  function say(cls, t) { $('msg').className = 'msg ' + cls; $('msg').textContent = t; }
  $('enc').addEventListener('click', function () {
    try { $('txt').value = ($('full').checked ? encodeURI : encodeURIComponent)($('txt').value); say('ok', 'Encoded.'); }
    catch (e) { say('bad', 'This text contains characters that cannot be encoded.'); }
  });
  $('dec').addEventListener('click', function () {
    try { $('txt').value = ($('full').checked ? decodeURI : decodeURIComponent)($('txt').value.replace(/\+/g, $('full').checked ? '+' : ' ')); say('ok', 'Decoded.'); }
    catch (e) { say('bad', 'This text contains a broken % sequence and cannot be decoded.'); }
  });
  $('cp').addEventListener('click', function () { copyText($('txt').value, $('cp')); });
  $('clr').addEventListener('click', function () { $('txt').value = ''; say('', ''); });
})();
</script>
