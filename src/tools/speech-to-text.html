<style>
.st-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
.st-top .btn { min-height: 52px; font-size: 17px; flex: 1 1 200px; }
.st-live { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--muted); flex: 1 1 160px; }
.st-live i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; }
.st-live.on { color: var(--bad); }
.st-live.on i { background: var(--bad); animation: st-pulse 1.2s infinite; }
@keyframes st-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .st-live.on i { animation: none; } }
.st-txt { min-height: 220px; font-size: 18px; line-height: 1.6; }
.st-interim { min-height: 1.6em; margin: 8px 0 10px; padding: 8px 12px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.st-interim:empty::before { content: attr(data-empty); font-style: normal; }
.st-punct { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.st-punct button { min-width: 44px; height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 16px/1 inherit; font-family: inherit; cursor: pointer; }
.st-punct button:hover { border-color: var(--accent); color: var(--accent); }
.st-count { font-size: 14px; color: var(--muted); margin: -6px 0 12px; font-variant-numeric: tabular-nums; }
</style>
<div class="notice bad" id="unsup" hidden><p id="unsupText"></p></div>
<div class="fields">
  <div><label for="lang">Language you will speak</label><select id="lang"></select></div>
</div>
<div class="st-top">
  <button class="btn" type="button" id="go">🎤 Start dictation</button>
  <span class="st-live" id="live" aria-live="polite"><i></i><span id="liveText">Not listening</span></span>
</div>
<label for="txt">Your text (you can edit it at any time)</label>
<textarea id="txt" class="plain st-txt" dir="auto" data-nomemo placeholder="Press Start dictation and speak. Your words appear here."></textarea>
<div class="st-interim" id="interim" dir="auto" aria-live="off" data-empty="Words being heard appear here first."></div>
<p class="st-count" id="count">0 words · 0 characters</p>
<div class="st-punct" id="punct" role="group" aria-label="Add punctuation"></div>
<div class="checks">
  <label><input type="checkbox" id="spoken" checked> <span id="spokenLabel">Spoken punctuation: say "comma", "full stop", "question mark", "new line"</span></label>
  <label><input type="checkbox" id="caps" checked> Capital letter at the start of sentences</label>
</div>
<div class="btns"><button class="btn ghost" type="button" id="copy">Copy text</button><button class="btn ghost" type="button" id="save">Download .txt</button><button class="btn ghost" type="button" id="clear">Clear</button></div>
<p class="msg" id="msg"></p>
<p class="msg">Speech recognition is done by your browser's speech service: Chrome sends the sound to Google, Edge to Microsoft and Safari to Apple to turn it into text, so you need an internet connection. Your text stays on this page.</p>

  function base() { return sel.value.split('-')[0]; }
  function noSpaces() { return /^(cmn|yue|ja|th|lo|km|my)$/.test(base()); }

    var t = $('txt').value, w = t.trim() ? (noSpaces() ? t.replace(/\s/g, '').length : t.trim().split(/\s+/).length) : 0;

  }
  // punctuation buttons for the chosen language
  function punct() {
    var b = base(), list = /^(ur)$/.test(b) ? ['۔', '،', '؟', '!', ':', '"'] : /^(ar|fa)$/.test(b) ? ['.', '،', '؟', '!', ':', '؛'] : /^(cmn|yue|ja)$/.test(b) ? ['。', '，', '？', '！', '：', '、'] : /^(hi|mr|ne|bn|pa)$/.test(b) ? ['।', ',', '?', '!', ':', '"'] : ['.', ',', '?', '!', ':', ';', '"'];

    list.concat(['↵ New line', '¶ New paragraph']).forEach(function (p) {
      var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = p;

    $('spokenLabel').textContent = en ? 'Spoken punctuation: say "comma", "full stop", "question mark", "new line"' : 'Spoken punctuation (English only): use the buttons above for this language';

  function insertPunct(p) {
    var t = $('txt'), s = t.selectionStart, e = t.selectionEnd, v = t.value;
    if (document.activeElement !== t && s === e && s === 0 && v) s = e = v.length; // not focused: add at the end
