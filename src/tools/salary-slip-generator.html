<style>
.fin .stat b { font-size: clamp(17px, 4.6vw, 22px); overflow-wrap: normal; word-break: normal; }
.fin input[type=month] { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 44px; }
.fin table.sched td, .fin table.sched th { white-space: nowrap; }
@media (max-width: 480px) { .fin .stats { grid-template-columns: 1fr 1fr; } .fin .stat { padding: 10px 12px; } }
.fdw fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.fdw legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.fdw .fields { margin-bottom: 12px; }
.fdw textarea { min-height: 70px; font-family: inherit; font-size: 15px; }
.fdw input[type=color] { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 4px; }
.fdw .fd-hint { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 400; }
.fdw .fd-logo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fdw .fd-logo img { max-height: 44px; max-width: 120px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 2px; }
.fdw .fd-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px 110px 116px 44px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.fdw .fd-row.two { grid-template-columns: minmax(0, 1fr) 140px 44px; }
.fdw .fd-row input.n { text-align: end; }
.fdw .fd-amt { text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fdw .fd-del { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; cursor: pointer; font: inherit; font-size: 18px; line-height: 1; padding: 0; }
.fdw .fd-del:hover { border-color: var(--bad); color: var(--bad); }
.fdw .fd-add { margin: 6px 0 12px; }
.fdw [aria-invalid="true"] { border-color: var(--bad) !important; }
.fdw .stats { margin: 0 0 14px; }
.fd-wrapprev { margin-top: 18px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); padding: 14px; }
.fd-wrapprev > b { display: block; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
.fd-paper { --fd-acc: #2563eb; background: #fff; color: #1f2937; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 32px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif; overflow-wrap: anywhere; max-width: 820px; margin: 0 auto; }
.fd-paper .fd-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.fd-paper .fd-top img { max-width: 180px; max-height: 70px; display: block; }
.fd-paper .fd-biz { font-size: 18px; font-weight: 700; }
.fd-paper .fd-bizsm { font-weight: 700; margin-top: 4px; }
.fd-paper h2 { margin: 0; font-size: 24px; letter-spacing: .06em; color: var(--fd-acc); text-align: end; }
.fd-paper .fd-meta { display: grid; grid-template-columns: auto auto; gap: 1px 14px; margin-top: 6px; font-size: 12.5px; justify-content: end; }
.fd-paper .fd-meta span { color: #6b7280; }
.fd-paper .fd-meta b { text-align: end; font-weight: 600; }
.fd-paper .fd-parties { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin: 22px 0 14px; }
.fd-paper .fd-parties small, .fd-paper .fd-h { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; color: #6b7280; font-weight: 700; margin-bottom: 2px; }
.fd-paper .fd-h { color: var(--fd-acc); margin: 16px 0 6px; font-size: 11px; }
.fd-paper .fd-parties div div { white-space: pre-line; }
.fd-paper .fd-kv { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 18px; }
.fd-paper .fd-kv div { display: flex; gap: 10px; } .fd-paper .fd-kv span { color: #6b7280; min-width: 100px; }
.fd-paper table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.fd-paper .fd-items th { background: var(--fd-acc); color: #fff; font-size: 11.5px; font-weight: 600; text-align: start; padding: 7px 8px; }
.fd-paper .fd-items td { padding: 7px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; white-space: pre-line; }
.fd-paper .fd-items .r { text-align: end; white-space: nowrap; }
.fd-paper .fd-items tr.fd-bold td { font-weight: 700; }
.fd-paper .fd-scroll { overflow-x: auto; }
.fd-paper .fd-items tr { break-inside: avoid; }
.fd-paper .fd-empty td { color: #9ca3af; text-align: center; }
.fd-paper .fd-sum { width: min(300px, 100%); margin: 14px 0 0 auto; break-inside: avoid; }
.fd-paper .fd-sum td { padding: 3px 8px; text-align: end; }
.fd-paper .fd-sum td:first-child { text-align: start; color: #4b5563; }
.fd-paper .fd-sum .fd-tot td { border-top: 1px solid #d1d5db; font-weight: 700; padding-top: 6px; }
.fd-paper .fd-sum .fd-big td { background: color-mix(in srgb, var(--fd-acc) 12%, #fff); font-weight: 700; font-size: 14.5px; color: #111827; padding: 8px; }
.fd-paper .fd-banner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 12px; background: color-mix(in srgb, var(--fd-acc) 12%, #fff); padding: 12px 14px; border-radius: 6px; margin-top: 16px; break-inside: avoid; }
.fd-paper .fd-banner span { font-weight: 700; } .fd-paper .fd-banner b { font-size: 20px; color: var(--fd-acc); }
.fd-paper .fd-banner small { flex-basis: 100%; color: #4b5563; }
.fd-paper .fd-note { margin-top: 16px; white-space: pre-line; break-inside: avoid; }
.fd-paper .fd-note b { display: block; font-size: 11.5px; color: #4b5563; }
.fd-paper .fd-sign { display: flex; gap: 30px; margin-top: 46px; break-inside: avoid; }
.fd-paper .fd-sign div { flex: 1; border-top: 1px solid #9ca3af; padding-top: 4px; color: #6b7280; font-size: 12px; }
@media (max-width: 640px) {
  .fdw .fd-row { grid-template-columns: 1fr 1fr 1fr 44px; }
  .fdw .fd-row > :first-child { grid-column: 1 / -1; }
  .fdw .fd-row.two { grid-template-columns: 1fr 44px; }
  .fd-wrapprev { padding: 8px; margin-left: -6px; margin-right: -6px; }
  .fd-paper { padding: 16px 14px; font-size: 12px; }
  .fd-paper h2 { font-size: 20px; }
  .fd-paper .fd-kv { grid-template-columns: 1fr; }
  .fd-paper .fd-items th, .fd-paper .fd-items td { padding: 6px 4px; font-size: 11px; }
  .fd-paper .fd-top img { max-width: 130px; max-height: 50px; }
}
#fdPrintBox { display: none; }
@media print {
  @page { margin: 12mm; }
  body > *:not(#fdPrintBox) { display: none !important; }
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  #fdPrintBox { display: block !important; color: #111; }
  #fdPrintBox .fd-paper { max-width: none; box-shadow: none; border-radius: 0; padding: 0; font-size: 10.5pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #fdPrintBox .fd-items thead { display: table-header-group; }
  #fdPrintBox .fd-scroll { overflow: visible; }
}
.ssg .fd-check { display: flex; align-items: center; font-weight: 400; margin: 0 0 12px; }
.ssg .ssg-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ssg .ssg-cols fieldset { margin: 0 0 14px; }
@media (max-width: 760px) { .ssg .ssg-cols { grid-template-columns: 1fr; gap: 0; } }
</style>
<div class="fin fdw ssg" id="ssg">
<fieldset>
  <legend>Company</legend>
  <div class="fields">

    <div><label for="ssLogo">Logo (optional)</label>

</fieldset>
<fieldset>

    <div><label for="ssRole">Job title</label><input type="text" id="ssRole" data-nomemo maxlength="80"></div>
    <div><label for="ssDept">Department</label><input type="text" id="ssDept" data-nomemo maxlength="80"></div>
  </div>
  <div class="fields">

<fieldset>

  <label class="fd-check"><input type="checkbox" id="ssWords" data-nomemo checked>Show net pay in words</label>
  <label class="fd-check"><input type="checkbox" id="ssSign" data-nomemo checked>Add signature lines</label>
</fieldset>
<div class="stats">

  <div class="stat"><span>Total deductions</span><b id="ssDedOut">–</b></div>
  <div class="stat"><span>Net pay</span><b id="ssNet">–</b></div>
</div>
<div class="btns">

  <a class="btn ghost" id="dl" hidden>Download again</a>
  <button type="button" class="btn ghost" id="ssPrint">Print</button>
  <button type="button" class="btn ghost" id="ssSave">Save draft</button>
  <button type="button" class="btn ghost" id="ssNext">Next month</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="fd-wrapprev"><b>Live preview</b><div class="fd-paper" id="ssPaperBox" translate="no"></div></div>
</div>
<script>
(function () {
  'use strict';
  // ---------- money and currency ----------
  var CURS = [['USD', 'US dollar'], ['EUR', 'Euro'], ['GBP', 'British pound'], ['INR', 'Indian rupee'], ['PKR', 'Pakistani rupee'], ['AED', 'UAE dirham'], ['SAR', 'Saudi riyal'],
    ['CAD', 'Canadian dollar'], ['AUD', 'Australian dollar'], ['NZD', 'New Zealand dollar'], ['JPY', 'Japanese yen'], ['CNY', 'Chinese yuan'], ['SGD', 'Singapore dollar'],
    ['MYR', 'Malaysian ringgit'], ['IDR', 'Indonesian rupiah'], ['PHP', 'Philippine peso'], ['BDT', 'Bangladeshi taka'], ['LKR', 'Sri Lankan rupee'], ['NPR', 'Nepalese rupee'],
    ['NGN', 'Nigerian naira'], ['KES', 'Kenyan shilling'], ['GHS', 'Ghanaian cedi'], ['ZAR', 'South African rand'], ['EGP', 'Egyptian pound'], ['TRY', 'Turkish lira'],
    ['BRL', 'Brazilian real'], ['MXN', 'Mexican peso'], ['CHF', 'Swiss franc'], ['SEK', 'Swedish krona'], ['NOK', 'Norwegian krone'], ['DKK', 'Danish krone'], ['PLN', 'Polish zloty'],
    ['QAR', 'Qatari riyal'], ['KWD', 'Kuwaiti dinar'], ['KRW', 'South Korean won'], ['VND', 'Vietnamese dong'], ['THB', 'Thai baht']];
  var REGION_CUR = { US: 'USD', GB: 'GBP', IN: 'INR', PK: 'PKR', AE: 'AED', SA: 'SAR', CA: 'CAD', AU: 'AUD', NZ: 'NZD', JP: 'JPY', CN: 'CNY', SG: 'SGD', MY: 'MYR', ID: 'IDR', PH: 'PHP',
    BD: 'BDT', LK: 'LKR', NP: 'NPR', NG: 'NGN', KE: 'KES', GH: 'GHS', ZA: 'ZAR', EG: 'EGP', TR: 'TRY', BR: 'BRL', MX: 'MXN', CH: 'CHF', SE: 'SEK', NO: 'NOK', DK: 'DKK', PL: 'PLN',
    QA: 'QAR', KW: 'KWD', KR: 'KRW', VN: 'VND', TH: 'THB', DE: 'EUR', FR: 'EUR', ES: 'EUR', IT: 'EUR', NL: 'EUR', IE: 'EUR', PT: 'EUR', BE: 'EUR', AT: 'EUR', FI: 'EUR', GR: 'EUR' };
  function guessCur() {
    var l = (navigator.languages && navigator.languages[0]) || navigator.language || '', m = /[-_]([a-z]{2})\b/i.exec(l);
    return (m && REGION_CUR[m[1].toUpperCase()]) || 'USD';
  }
  // Fill a <select> with currencies (plus "Other"). The site restores a remembered choice after this runs.
  function fillCur(sel) {
    sel.innerHTML = CURS.map(function (c) { return '<option value="' + c[0] + '">' + c[0] + ' – ' + c[1] + '</option>'; }).join('') + '<option value="X">Other – type your own symbol</option>';
    sel.value = guessCur();
  }
  var fmtCache = {};
  function curCode() { var s = document.querySelector('[data-cur]'); return s ? s.value : 'USD'; }
  function curSym() { var b = document.querySelector('[data-cursym]'), s = b ? b.value.trim() : ''; return s ? (/[A-Za-z]$/.test(s) ? s + ' ' : s) : ''; }
  function numLocale(code) { var p = (window.Prefs && Prefs.get().numfmt) || 'en-US'; return code === 'INR' && p === 'en-US' ? 'en-IN' : p; }
  // money(12.5) -> "$12.50" in the chosen currency; dp forces the number of decimals (e.g. 0 for big totals)
  function money(n, dp) {
    if (n == null || !isFinite(n)) return '–';
    var code = curCode();
    if (dp == null) dp = { JPY: 0, KRW: 0, VND: 0, KWD: 3 }[code]; if (dp == null) dp = 2;
    if (code === 'X') return (n < 0 ? '−' : '') + curSym() + fmtNum(Math.abs(n), dp == null ? 2 : dp);
    var k = code + '|' + dp + '|' + numLocale(code);
    if (!fmtCache[k]) {
      try { var o = { style: 'currency', currency: code }; if (dp != null) { o.minimumFractionDigits = dp; o.maximumFractionDigits = dp; } fmtCache[k] = new Intl.NumberFormat(numLocale(code), o); }
      catch (e) { fmtCache[k] = { format: function (v) { return code + ' ' + fmtNum(v, dp == null ? 2 : dp); } }; }
    }
    return fmtCache[k].format(n).replace(/^-/, '−');
  }
  // Short axis labels: 1.2K, 3.4M
  function shortNum(n) { try { return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n); } catch (e) { return String(Math.round(n)); } }
  function num(id) { var el = typeof id === 'string' ? $(id) : id; var s = String(el.value).replace(/[\s,']/g, ''); return s === '' ? NaN : +s; }
  function say(cls, text, id) { var m = $(id || 'msg'); if (!m) return; m.className = 'msg ' + (cls || ''); m.textContent = text || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function isoToday() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function niceDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : ''; }
  // Wire the currency picker: fills it, shows the "own symbol" box for Other, and calls cb on change.
  function curWire(cb) {
    var s = document.querySelector('[data-cur]'), b = document.querySelector('[data-cursym]');
    fillCur(s);
    function t() { if (b) b.closest('div').hidden = s.value !== 'X'; }
    s.addEventListener('change', function () { t(); cb(); });
    s.addEventListener('input', t);
    if (b) b.addEventListener('input', cb);
    t();
  }
  // ---------- document kit: one layout spec -> live preview, print and PDF (pdf-lib) ----------
  // spec = { title, accent, paper, logo, biz, meta:[[k,v]], parties:[[label,name,text]], blocks:[...], footer }
  // blocks: {kind:'kv', title, rows:[[k,v]]} | {kind:'table', title, cols:[{h,w,a}], rows:[[...]], empty} |
  //         {kind:'totals', rows:[[label,value,cls]]} | {kind:'note', title, text} | {kind:'banner', label, value}
  function dEl(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function docHtml(box, sp) {
    box.textContent = ''; box.style.setProperty('--fd-acc', sp.accent || '#2563eb');
    var top = dEl('div', 'fd-top'), left = dEl('div');
    if (sp.logo) { var im = dEl('img'); im.src = sp.logo; im.alt = sp.biz ? sp.biz + ' logo' : 'Logo'; left.appendChild(im); if (sp.biz) left.appendChild(dEl('div', 'fd-bizsm', sp.biz)); }
    else left.appendChild(dEl('div', 'fd-biz', sp.biz || ''));
    var right = dEl('div', 'fd-right'); right.appendChild(dEl('h2', null, sp.title));
    var meta = dEl('div', 'fd-meta');
    (sp.meta || []).forEach(function (m) { if (!m[1]) return; meta.appendChild(dEl('span', null, m[0])); meta.appendChild(dEl('b', null, m[1])); });
    right.appendChild(meta); top.appendChild(left); top.appendChild(right); box.appendChild(top);
    if (sp.parties && sp.parties.length) {
      var ps = dEl('div', 'fd-parties');
      sp.parties.forEach(function (p) { var d = dEl('div'); d.appendChild(dEl('small', null, p[0])); d.appendChild(dEl('b', null, p[1] || '—')); if (p[2] && p[2].trim()) d.appendChild(dEl('div', null, p[2].trim())); ps.appendChild(d); });
      box.appendChild(ps);
    }
    sp.blocks.forEach(function (b) {
      if (b.title && b.kind !== 'note') box.appendChild(dEl('h3', 'fd-h', b.title));
      if (b.kind === 'kv') {
        var g = dEl('div', 'fd-kv'); b.rows.forEach(function (r) { if (!r[1]) return; var c = dEl('div'); c.appendChild(dEl('span', null, r[0])); c.appendChild(dEl('b', null, r[1])); g.appendChild(c); }); box.appendChild(g);
      } else if (b.kind === 'table') {
        var t = dEl('table', 'fd-items'), th = dEl('thead'), hr = dEl('tr');
        b.cols.forEach(function (c) { var h = dEl('th', c.a === 'r' ? 'r' : '', c.h); hr.appendChild(h); }); th.appendChild(hr); t.appendChild(th);
        var tb = dEl('tbody');
        b.rows.forEach(function (r) { var tr = dEl('tr', r.cls || ''); r.forEach(function (v, i) { tr.appendChild(dEl('td', b.cols[i].a === 'r' ? 'r' : '', v)); }); tb.appendChild(tr); });
        if (!b.rows.length) { var er = dEl('tr', 'fd-empty'), td = dEl('td', null, b.empty || 'Nothing added yet.'); td.colSpan = b.cols.length; er.appendChild(td); tb.appendChild(er); }
        t.appendChild(tb); var sc = dEl('div', 'fd-scroll'); sc.appendChild(t); box.appendChild(sc);
      } else if (b.kind === 'totals') {
        var s = dEl('table', 'fd-sum'); b.rows.forEach(function (r) { var tr = dEl('tr', r[2] ? 'fd-' + r[2] : ''); tr.appendChild(dEl('td', null, r[0])); tr.appendChild(dEl('td', null, r[1])); s.appendChild(tr); }); box.appendChild(s);
      } else if (b.kind === 'banner') {
        var bn = dEl('div', 'fd-banner'); bn.appendChild(dEl('span', null, b.label)); bn.appendChild(dEl('b', null, b.value)); if (b.sub) bn.appendChild(dEl('small', null, b.sub)); box.appendChild(bn);
      } else if (b.kind === 'note' && b.text && b.text.trim()) {

  }
  // printing shows only a copy of the paper, placed straight under <body>
  function docPrintWire(paperId, before) {
    function fill() { if (before) before(); var box = $('fdPrintBox'); if (!box) { box = document.createElement('div'); box.id = 'fdPrintBox'; document.body.appendChild(box); } var c = $(paperId).cloneNode(true); c.removeAttribute('id'); box.textContent = ''; box.appendChild(c); }

    window.addEventListener('afterprint', function () { var box = $('fdPrintBox'); if (box) box.textContent = ''; });
    return function () { fill(); window.print(); };
  }
  // logo picker: shrinks the picture and returns a PNG data URL

      footer: 'Payslip' + (per ? ' · ' + per : '') + (s.ssName.trim() ? ' · ' + s.ssName.trim() : '') + ' · Confidential' };
  }
  function update(changed) {
    var s = state(), c = calc(s), bad = c.errs.length;
    $('ssGross').textContent = bad ? '–' : money(c.e.t); $('ssDedOut').textContent = bad ? '–' : money(c.d.t); $('ssNet').textContent = bad ? '–' : money(c.net);
    if (bad) say('bad', c.errs.join(' ')); else if (c.net < 0) say('bad', 'Deductions are more than earnings, so net pay is negative. Check the amounts.'); else if (changed) say('', '');
    docHtml($('ssPaperBox'), spec(s, c));
    last = { s: s, c: c };
    if (changed) { $('dl').hidden = true; clearTimeout(saveT); saveT = setTimeout(function () { saveDraft(DRAFT, state()); }, 400); }
  }
  function ready() {
    update(false);
    if (last.c.errs.length) { say('bad', 'Fix this first: ' + last.c.errs[0]); var t = document.querySelector('.ssg [aria-invalid="true"]'); if (t) t.focus(); return false; }
    if (!last.c.e.rows.length) { say('bad', 'Add at least one earning, such as Basic salary.'); $('ssEarn').querySelector('input').focus(); return false; }
    return true;
  }
  var doPrint = docPrintWire('ssPaperBox');
  $('ssPrint').addEventListener('click', function () { if (ready()) doPrint(); });
  $('ssPdf').addEventListener('click', function () { if (ready()) docDownload(this, spec(last.s, last.c), fileName('payslip', (last.s.ssName.trim() + '-' + last.s.ssPeriod).replace(/^-|-$/g, '')), $('dl')); });
  $('ssSave').addEventListener('click', function () { saveDraft(DRAFT, state(), true); });
  $('ssNext').addEventListener('click', function () {
    var m = /^(\d{4})-(\d{2})$/.exec($('ssPeriod').value), d = m ? new Date(+m[1], +m[2], 1) : new Date();
    $('ssPeriod').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec($('ssPayDate').value);
    if (p) { var dim = new Date(Date.UTC(+p[1], +p[2] + 1, 0)).getUTCDate(), nd = new Date(Date.UTC(+p[1], +p[2], Math.min(+p[3], dim))); $('ssPayDate').value = nd.toISOString().slice(0, 10); } // same day next month, or its last day
    update(true); say('ok', 'Moved to ' + periodText($('ssPeriod').value) + '. The amounts are kept, so change any that differ this month.');
  });
  $('ssAddE').addEventListener('click', function () { earn.add(null, true); update(true); });
  $('ssAddD').addEventListener('click', function () { ded.add(null, true); update(true); });
  $('ssg').addEventListener('input', function (e) { if (e.target.type !== 'file') update(true); });
  $('ssg').addEventListener('change', function (e) { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.type === 'color' || e.target.type === 'date' || e.target.type === 'month') update(true); });
  curWire(function () { update(true); });
  var saved = null; try { saved = JSON.parse(load(DRAFT)); } catch (e) {}
  if (saved && typeof saved === 'object') { formSet(F, saved); earn.set(saved.earn); ded.set(saved.ded); logo.set(saved.logo); $('ssCur').dispatchEvent(new Event('input')); }
  else {
    var t = new Date(); $('ssPeriod').value = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); $('ssPayDate').value = isoToday();
    earn.set([{ d: 'Basic salary', a: '' }, { d: 'Housing allowance', a: '' }, { d: 'Transport allowance', a: '' }, { d: 'Overtime', a: '' }]);
    ded.set([{ d: 'Income tax', a: '' }, { d: 'Social security / pension', a: '' }, { d: 'Health insurance', a: '' }]);
  }
  update(false);
})();
</script>
