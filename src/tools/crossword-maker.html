<style>
.cwm fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.cwm legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.cwm textarea { min-height: 190px; font-family: inherit; font-size: 15px; }
.cwm .cwm-hint { display: block; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.cwm .cwm-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.cwm .cwm-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 4px; }
.cwm .cwm-prev canvas { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
.cwm .cwm-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
.cwm .cwm-bar .btn { min-height: 38px; padding: 4px 12px; }
.cwm .cwm-nav { display: flex; gap: 6px; align-items: center; }
</style>
<div class="cwm" id="cwm">
<fieldset><legend>Words and clues</legend>
  <div class="fields"><div><label for="cwTitle">Puzzle title</label><input type="text" id="cwTitle" data-nomemo maxlength="70" placeholder="e.g. Science Week Crossword"></div></div>
  <label for="cwWords">One per line: the answer, then a dash or colon, then the clue</label>
  <textarea id="cwWords" data-nomemo maxlength="20000" placeholder="planet - Earth is one of these&#10;oxygen - Gas we breathe in&#10;gravity - Force that pulls things down&#10;atom - Tiny building block of matter&#10;magnet - Attracts iron and steel"></textarea>
  <span class="cwm-hint" id="cwCount">Answers can be in any language. Spaces in an answer are removed in the grid.</span>
</fieldset>
<fieldset><legend>Options</legend>
  <div class="fields">
    <div><label for="cwPaper">Paper</label><select id="cwPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
    <div><label for="cwCase">Answer letters</label><select id="cwCase"><option value="upper">CAPITALS</option><option value="asis">As typed</option></select></div>
  </div>
  <label class="cwm-check"><input type="checkbox" id="cwLen" checked>Show the number of letters after each clue, like (6)</label>
  <label class="cwm-check"><input type="checkbox" id="cwName" checked>Add Name and Date lines</label>
</fieldset>
<div class="btns" style="margin:0 0 14px">
  <button type="button" class="btn" id="cwMake">Make crossword</button>
  <button type="button" class="btn ghost" id="cwAgain">Try another layout</button>
</div>
<div class="cwm-prev" id="cwPrevBox" hidden>
  <div class="cwm-bar"><span id="cwInfo"></span><span class="cwm-nav"><button type="button" class="btn ghost" id="cwPrevP" aria-label="Previous page">‹</button><span id="cwPage">1/1</span><button type="button" class="btn ghost" id="cwNextP" aria-label="Next page">›</button></span><button type="button" class="btn ghost" id="cwKey" aria-pressed="false">Show answers</button></div>
  <canvas id="cwCanvas" width="595" height="842" aria-label="Crossword preview"></canvas>
</div>
<div class="btns">
  <button type="button" class="btn" id="cwPdf" disabled>Download PDF with answer key</button>
  <button type="button" class="btn ghost" id="cwPng" disabled>Save this page as PNG</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

    function at(x, y) { return cells.get(x + ',' + y); }
    function fits(w, x, y, dx, dy) {
      var L = w.g.length, cross = 0;
      if (at(x - dx, y - dy) || at(x + dx * L, y + dy * L)) return -1;
      for (var i = 0; i < L; i++) {
        var cx = x + dx * i, cy = y + dy * i, c = at(cx, cy);
        if (c) { if (c.ch !== w.g[i] || c[dx ? 'a' : 'd']) return -1; cross++; }
        else if (at(cx + dy, cy + dx) || at(cx - dy, cy - dx)) return -1;
      }
      return cross;
    }
    function put(w, x, y, dx, dy) {
      for (var i = 0; i < w.g.length; i++) { var k = (x + dx * i) + ',' + (y + dy * i), c = cells.get(k) || { ch: w.g[i] }; c[dx ? 'a' : 'd'] = 1; cells.set(k, c); }
      placed.push({ w: w, x: x, y: y, dx: dx, dy: dy });
    }
    var first = order[0]; put(first, 0, 0, 1, 0);
    var left = order.slice(1), progress = true;
    while (left.length && progress) {
      progress = false;
      for (var j = 0; j < left.length; j++) {
        var w = left[j], best = [], bestScore = -1;
        placed.forEach(function (p) {
          for (var a = 0; a < p.w.g.length; a++) for (var b = 0; b < w.g.length; b++) {
            if (p.w.g[a] !== w.g[b]) continue;
            var dx = p.dx ? 0 : 1, dy = p.dx ? 1 : 0, x = p.x + p.dx * a - dx * b, y = p.y + p.dy * a - dy * b, c = fits(w, x, y, dx, dy);
            if (c < 1) continue;
            var sc = c * (wild ? 2 : 10) + UT.rnd(wild ? 12 : 8);
            if (sc > bestScore) { bestScore = sc; best = [x, y, dx, dy]; }
          }
        });
        if (bestScore >= 0) { put(w, best[0], best[1], best[2], best[3]); left.splice(j, 1); j--; progress = true; }
      }
    }
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, crosses = 0;
    cells.forEach(function (c, k) { var p = k.split(','), x = +p[0], y = +p[1]; minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); if (c.a && c.d) crosses++; });
    var w = maxX - minX + 1, h = maxY - minY + 1;
    return { placed: placed, left: left, minX: minX, minY: minY, w: w, h: h, crosses: crosses, score: placed.length * 1000 + crosses * 20 - Math.max(w, h) * 6 - w * h * 0.2 };
  }
  function layout(words) {

    var byLen = words.slice().sort(function (a, b) { return b.g.length - a.g.length; });
    while (n < 3 || (performance.now() - t0 < 700 && n < 400)) {
      var order = n === 0 ? byLen : UT.shuffle(byLen.slice(0, 3)).concat(UT.shuffle(byLen.slice(3)));
      if (n > 0 && UT.rnd(2)) order = byLen.slice().sort(function (a, b) { return (b.g.length - a.g.length) + (UT.rnd(5) - 2); });
      if (n > 20 && best && best.left.length && UT.rnd(2)) order = UT.shuffle(byLen.slice());
      var r = attempt(words, order, n > 20 && UT.rnd(3) === 0); n++;
      if (!best || r.score > best.score) best = r;
      if (!best.left.length && n > 60 && performance.now() - t0 > 350) break;
    }
    return finish(best, words);
  }
  function finish(r, words) {
    var rtl = words.some(function (w) { return UT.rtl(w.ans); });
    var grid = {}, starts = {}, W = r.w, H = r.h;
    r.placed.forEach(function (p) {
      p.x -= r.minX; p.y -= r.minY;
      if (rtl) { p.x = W - 1 - p.x; p.dx = -p.dx; }
      for (var i = 0; i < p.w.g.length; i++) grid[(p.x + p.dx * i) + ',' + (p.y + p.dy * i)] = p.w.g[i];
      starts[p.x + ',' + p.y] = 1;
    });
    // numbers in reading order (right to left for Arabic, Hebrew…)
    var num = {}, k = 0;
    for (var y = 0; y < H; y++) for (var i = 0; i < W; i++) { var x = rtl ? W - 1 - i : i; if (starts[x + ',' + y]) num[x + ',' + y] = ++k; }
    r.placed.forEach(function (p) { p.n = num[p.x + ',' + p.y]; });
    var across = r.placed.filter(function (p) { return p.dy === 0; }).sort(function (a, b) { return a.n - b.n; }), down = r.placed.filter(function (p) { return p.dx === 0; }).sort(function (a, b) { return a.n - b.n; });
    return { w: W, h: H, grid: grid, num: num, across: across, down: down, left: r.left, rtl: rtl, crosses: r.crosses };
  }

  // ---------- pages ----------
  function pageSize() { return $('cwPaper').value === 'letter' ? [612, 792] : [595.28, 841.89]; }
  function pages(r, title, key) {
    var P = pageSize(), W = P[0], H = P[1], M = 40, out = [], ops = [], y = M, font = 'sans';
    function newPage() { ops = [{ k: 'rect', x: 0, y: 0, w: W, h: H, fill: '#ffffff' }]; out.push(ops); y = M; }
    newPage();
    var t = (title || 'Crossword') + (key ? ' (answers)' : ''), ts = GD.fit(t, 'sansb', 22, W - 2 * M, 12);
    ops.push({ k: 'text', t: t, x: W / 2, y: y + ts, font: 'sansb', s: ts, fill: '#111827', align: 'center' }); y += ts + 14;
    if ($('cwName').checked && !key) {
      y += 10;
      ops.push({ k: 'text', t: 'Name', x: M, y: y, font: 'sans', s: 11, fill: '#374151' }, { k: 'line', x1: M + 34, y1: y + 2, x2: W * 0.62, y2: y + 2, stroke: '#9ca3af', lw: 0.8 });
      ops.push({ k: 'text', t: 'Date', x: W * 0.66, y: y, font: 'sans', s: 11, fill: '#374151' }, { k: 'line', x1: W * 0.66 + 30, y1: y + 2, x2: W - M, y2: y + 2, stroke: '#9ca3af', lw: 0.8 });
      y += 16;
    }
    y += 6;
    var maxH = (H - y - M) * 0.62, cell = Math.min(30, (W - 2 * M) / r.w, maxH / r.h), gx = (W - cell * r.w) / 2, gy = y;
    Object.keys(r.grid).forEach(function (k) {
      var p = k.split(','), x = gx + +p[0] * cell, yy = gy + +p[1] * cell;
      ops.push({ k: 'rect', x: x, y: yy, w: cell, h: cell, fill: '#ffffff', stroke: '#111827', lw: 0.9 });
      if (r.num[k]) ops.push({ k: 'text', t: String(r.num[k]), x: r.rtl ? x + cell - 2 : x + 2, y: yy + Math.max(5, cell * 0.3), font: 'sans', s: Math.max(4.5, cell * 0.28), fill: '#111827', align: r.rtl ? 'right' : 'left' });
      if (key) { var fs = cell * 0.55; ops.push({ k: 'text', t: r.grid[k], x: x + cell / 2, y: yy + cell * 0.62 + fs * 0.3, font: 'sansb', s: fs, fill: '#1d4ed8', align: 'center' }); }
    });
    y = gy + cell * r.h + 22;
    // clues flow down the left column, then the right column, then onto the next page
    var colW = (W - 2 * M - 24) / 2, cs = 10.5, lh = 14, top = y, col = 0;
    function clueText(p) { return p.w.clue + ($('cwLen').checked ? ' (' + p.w.len + ')' : '') + (key ? ' = ' + p.w.ans : ''); }
    function cx() { return M + col * (colW + 24); }
    function room(h) { if (y + h <= H - M) return; if (col === 0) { col = 1; y = top; } else { newPage(); top = M; col = 0; } }
    function block(head, list) {
      room(lh * 3);
      ops.push({ k: 'text', t: head, x: cx(), y: y + 12, font: 'sansb', s: 13, fill: '#111827' }); y += 22;
      list.forEach(function (p) {
        var lines = GD.wrap(clueText(p), font, cs, colW - 22);
        room(lines.length * lh);
        ops.push({ k: 'text', t: String(p.n), x: cx(), y: y + cs, font: 'sansb', s: cs, fill: '#111827' });
        lines.forEach(function (ln, i) { ops.push({ k: 'text', t: ln, x: cx() + 22, y: y + cs + i * lh, font: font, s: cs, fill: '#1f2937' }); });
        y += lines.length * lh + 3;
      });
      y += 10;
    }
    block('Across', r.across);
    if (col === 0 && r.across.length && r.down.length) { col = 1; y = top; }
    block('Down', r.down);
    return out.map(function (o) { return { ops: o, W: W, H: H }; });
  }
  function allPages() { return cur ? pages(cur, $('cwTitle').value.trim(), showKey) : []; }
  function paint() {
    if (!cur || !ready) return;
    var ps = allPages(); pageNo = Math.max(0, Math.min(pageNo, ps.length - 1));
    var pg = ps[pageNo], cv = $('cwCanvas'), sc = 2;
    cv.width = Math.round(pg.W * sc); cv.height = Math.round(pg.H * sc);
    GD.drawCanvas(pg.ops, cv.getContext('2d'), sc);
    $('cwPage').textContent = (pageNo + 1) + '/' + ps.length;
  }
  function make() {
    if (!ready) return say('', 'Loading fonts…');
    var rl = readList(), list = rl.list;
    $('cwCount').textContent = list.length + ' answers' + (rl.bad.length ? '. Skipped: ' + rl.bad.slice(0, 4).join('; ') + (rl.bad.length > 4 ? '…' : '') : '') + '.';
    if (list.length < 2) { cur = null; $('cwPrevBox').hidden = true; $('cwPdf').disabled = $('cwPng').disabled = true; return say('bad', 'Add at least 2 answers with clues, one per line, like: planet - Earth is one of these'); }
    if (list.length > 60) return say('bad', 'Please use 60 answers or fewer. You have ' + list.length + '.');
    var r = layout(list);
    cur = r; pageNo = 0;
    $('cwCanvas')._puzzle = r;
    $('cwPrevBox').hidden = false; $('cwPdf').disabled = $('cwPng').disabled = false;
    $('cwInfo').textContent = r.w + ' × ' + r.h + ' squares, ' + (r.across.length + r.down.length) + ' answers';
    var miss = r.left.map(function (w) { return w.ans; }), noClue = list.filter(function (w) { return w.noClue; }).length;
    if (miss.length) say('bad', 'These answers could not be joined to the others and were left out: ' + miss.join(', ') + '. They may share no letters with the rest. Press "Try another layout", or add words that share letters with them.');
    else say('ok', 'Crossword ready with all ' + list.length + ' answers.' + (noClue ? ' ' + noClue + ' answer' + (noClue > 1 ? 's have' : ' has') + ' no clue yet.' : ''));
    paint();
  }
  $('cwMake').addEventListener('click', make);
  $('cwAgain').addEventListener('click', make);
  $('cwCase').addEventListener('change', function () { if (cur) make(); });
  ['cwPaper', 'cwLen', 'cwName'].forEach(function (id) { $(id).addEventListener('change', paint); });
  $('cwTitle').addEventListener('input', paint);
  $('cwPrevP').addEventListener('click', function () { pageNo--; paint(); });
  $('cwNextP').addEventListener('click', function () { pageNo++; paint(); });
  $('cwKey').addEventListener('click', function () { showKey = !showKey; this.setAttribute('aria-pressed', showKey); this.textContent = showKey ? 'Hide answers' : 'Show answers'; paint(); });
  $('cwPng').addEventListener('click', function () { if (cur) $('cwCanvas').toBlob(function (b) { GD.download(b, 'crossword' + (showKey ? '-answers' : '') + '.png'); say('ok', 'PNG saved.'); }, 'image/png'); });
  $('cwPdf').addEventListener('click', async function () {
    if (!cur || busy) return;
    busy = true; var btn = this; btn.disabled = true; say('', 'Making the PDF…');
    try {
      var title = $('cwTitle').value.trim(), env = await GD.newPdf(title || 'Crossword', 'GetToolNest Crossword Maker', function (t) { say('', t); });
      var ps = pages(cur, title, false).concat(pages(cur, title, true));
      for (var i = 0; i < ps.length; i++) await GD.drawPdf(env, env.doc.addPage([ps[i].W, ps[i].H]), ps[i].ops);
      var bytes = await env.doc.save();
      GD.download(new Blob([bytes], { type: 'application/pdf' }), (title || 'crossword').replace(/[\\/:*?"<>|]+/g, '').slice(0, 60) + '.pdf');
      say('ok', 'PDF saved with the puzzle and the answer key (' + ps.length + ' pages).');
    } catch (e) { say('bad', 'The PDF could not be made. ' + (e && e.message ? e.message : '')); }
    busy = false; btn.disabled = false;
  });
  GD.loadAll(['sans', 'sansb']).then(function () { ready = true; if ($('cwWords').value.trim()) make(); }, function () { say('bad', 'The fonts could not load. Check your connection and reload.'); });
})();
</script>
