<style>
.cbs-views { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
.cbs-stage { position: relative; text-align: center; }
.cbs-stage label, .cbs-stage input { text-align: start; line-height: normal; }
.cbs-slide { line-height: 0; }
.cbs-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.cbs-fig { margin: 0; min-width: 0; }
.cbs-fig canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.cbs-fig figcaption { font-size: 13.5px; color: var(--muted); margin-top: 4px; line-height: 1.35; text-align: center; }
.cbs-fig figcaption b { color: var(--ink); font-weight: 600; }
.cbs-slide { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; max-width: 100%; display: inline-block; }
.cbs-slide canvas { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; }
.cbs-slide .cbs-line { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
.cbs-slide .cbs-line::after { content: '\2194'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #111; font: 700 18px/34px system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.4); text-align: center; }
.cbs-tag { position: absolute; top: 8px; font: 600 12px/1 system-ui, sans-serif; background: rgba(0,0,0,.6); color: #fff; padding: 5px 8px; border-radius: 6px; pointer-events: none; line-height: 1; }
.cbs-note { font-size: 14px; color: var(--muted); margin: 10px 0 0; }

<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop an image here, or paste one with Ctrl+V</b>A photo, chart, map, screenshot or design. JPG, PNG, WebP, GIF or BMP. It stays on your device.</div>

<div class="btns" style="margin:-4px 0 16px"><button class="btn ghost" id="sample" type="button">Try with a sample picture</button></div>
<div class="fields">
  <div><label for="type">Type of colour blindness</label><select id="type">
    <option value="protan">Red-blind (protan)</option>
    <option value="deutan" selected>Green-blind (deutan)</option>
    <option value="tritan">Blue-blind (tritan)</option>
    <option value="achro">No colour (achromatopsia)</option>

  <div><label for="sev">Strength: <span id="sevv">100% (full)</span></label><input type="range" id="sev" min="10" max="100" step="10" value="100"></div>
</div>

</div>

</div>

      var out = canvas(cols * w + (cols + 1) * pad, rows * (h + capH) + (rows + 1) * pad), ox = out.getContext('2d');
      ox.fillStyle = '#fff'; ox.fillRect(0, 0, out.width, out.height);
      panels.forEach(function (p, n) {
        var cx = pad + (n % cols) * (w + pad), cy = pad + Math.floor(n / cols) * (h + capH + pad), t = canvas(w, h);
        t.getContext('2d').putImageData(p.d, 0, 0); ox.drawImage(t, cx, cy);
        ox.save(); ox.translate(cx, cy + h); caption(ox, p.t, w, capH / 2, fs); ox.restore();
      });
      save(out, view === 'all' ? 'colour-blindness-all-types' : 'colour-blindness-comparison');
    });
  });
})();
</script>
