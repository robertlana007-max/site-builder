<style>
.pe-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.pe-bar .btn { min-height: 40px; padding: 6px 12px; }
.pe-stage { background: repeating-conic-gradient(var(--line) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 12px; user-select: none; -webkit-user-select: none; }
.pe-wrap { position: relative; line-height: 0; width: fit-content; max-width: 100%; margin: 0 auto; }
.pe-wrap canvas { display: block; max-width: 100%; max-height: 65vh; }
.pe-wrap #peOv { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; touch-action: none; cursor: move; }
.pe-tag { position: absolute; top: 8px; inset-inline-start: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; line-height: 1; padding: 6px 9px; border-radius: 99px; }
.pe-presets { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 12px; }
.pe-presets button { flex: none; width: 76px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); padding: 3px; cursor: pointer; font: 500 12px/1.2 inherit; font-family: inherit; color: var(--ink); }
.pe-presets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pe-presets canvas { width: 66px; height: 66px; display: block; border-radius: 7px; margin-bottom: 3px; }
.pe-sec { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin-bottom: 14px; }
.pe-sec h3 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pe-sec h3 button { font: 600 13px/1 inherit; font-family: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 6px; }
.pe-adj { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pe-adj label { display: flex; justify-content: space-between; }
.pe-adj label span { color: var(--muted); font-weight: 500; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a photo here</b>JPG, PNG or WebP, up to about 50 megapixels. Edited on your device, never uploaded.</div>
<input type="file" id="file" accept="image/*" hidden data-nomemo>
<div id="editor" hidden>
  <div class="pe-bar">
    <button class="btn ghost" type="button" id="undo" disabled aria-label="Undo">↶ Undo</button>
    <button class="btn ghost" type="button" id="redo" disabled aria-label="Redo">↷ Redo</button>
    <button class="btn ghost" type="button" id="cmp" title="Hold to see the original">◐ Hold to compare</button>
    <button class="btn ghost" type="button" id="cropBtn" aria-pressed="false">⛶ Crop and rotate</button>
    <button class="btn ghost" type="button" id="resetAll">Reset all</button>
  </div>
  <div class="pe-sec" id="cropPanel" hidden>
    <h3>Crop and rotate</h3>
    <div class="fields">
      <div><label for="aspect">Crop shape</label><select id="aspect" data-nomemo><option value="free">Free</option><option value="orig">Original</option><option value="1">Square 1:1</option><option value="0.8">Portrait 4:5</option><option value="1.5">Photo 3:2</option><option value="0.6666667">Photo 2:3</option><option value="1.7777778">Wide 16:9</option><option value="0.5625">Story 9:16</option></select></div>
      <div><label for="straight">Straighten: <span id="straightV">0</span>°</label><input type="range" id="straight" min="-45" max="45" step="0.5" value="0" data-nomemo></div>
    </div>
    <div class="pe-bar">
      <button class="btn ghost" type="button" id="rotL">⟲ Rotate left</button>
      <button class="btn ghost" type="button" id="rotR">⟳ Rotate right</button>
      <button class="btn ghost" type="button" id="flipH">⇆ Flip</button>
      <button class="btn ghost" type="button" id="flipV">⇅ Flip up/down</button>
      <button class="btn ghost" type="button" id="cropReset">Reset crop</button>
      <button class="btn" type="button" id="cropDone">Done</button>
    </div>
  </div>
  <div class="pe-stage"><div class="pe-wrap" id="wrap"><canvas id="pv" aria-label="Photo preview"></canvas><canvas id="peOv" hidden aria-label="Crop box. Drag inside to move it, drag a corner to resize."></canvas><span class="pe-tag" id="tag" hidden>Original</span></div></div>
  <p class="msg" id="info" style="margin:-4px 0 12px;text-align:center"></p>
  <div class="pe-sec">
    <h3>Filters</h3>
    <div class="pe-presets" id="presets" role="group" aria-label="Filters"></div>
    <div class="fields" id="fsRow" hidden><div><label for="fs">Filter strength: <span id="fsV">100</span>%</label><input type="range" id="fs" min="0" max="100" value="100" data-nomemo></div></div>
  </div>
  <div class="pe-sec">
    <h3>Adjust <button type="button" id="resetAdj">Reset sliders</button></h3>
    <div class="fields pe-adj" id="adj"></div>
  </div>
  <div class="fields">
    <div><label for="fmt">Save as</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
    <div id="qRow"><label for="q">Quality: <span id="qv">92</span>%</label><input type="range" id="q" min="40" max="100" value="92"></div>
  </div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Download full size</button><a class="btn ghost" id="dl" hidden>Download</a></div>
<progress id="prog" max="1" value="0" hidden style="width:100%;margin-top:10px;accent-color:var(--accent)"></progress>
<p class="msg" id="msg"></p>

    $('adj').appendChild(d);
    var el = d.querySelector('input');
    el.addEventListener('input', function () { st.adj[a[0]] = +el.value; $('a_' + a[0] + 'V').textContent = el.value; refresh(); });
    el.addEventListener('change', commit);
    el.addEventListener('dblclick', function () { el.value = 0; st.adj[a[0]] = 0; ui(); refresh(); commit(); }); // double-click a slider to reset it
  });
  function ui() {
    ADJ.forEach(function (a) { var el = $('a_' + a[0]); el.value = st.adj[a[0]]; $('a_' + a[0] + 'V').textContent = st.adj[a[0]]; });
    Array.prototype.forEach.call($('presets').children, function (b) { b.setAttribute('aria-pressed', b.dataset.p === st.preset); });
    $('fsRow').hidden = st.preset === 'none'; $('fs').value = st.fs; $('fsV').textContent = st.fs;
    $('straight').value = st.ang; $('straightV').textContent = st.ang;
    $('undo').disabled = !hist.length; $('redo').disabled = !fut.length;
    $('qRow').hidden = $('fmt').value === 'image/png'; $('qv').textContent = $('q').value;
    $('cropBtn').setAttribute('aria-pressed', cropMode); $('cropPanel').hidden = !cropMode;
    $('go').disabled = !img || busy;
    $('dl').hidden = true;
  }
  $('fs').addEventListener('input', function () { st.fs = +$('fs').value; $('fsV').textContent = st.fs; refresh(); });
  $('fs').addEventListener('change', commit);
  $('resetAdj').addEventListener('click', function () { st.adj = fresh().adj; ui(); refresh(); commit(); });
  $('resetAll').addEventListener('click', function () { st = fresh(); cropMode = false; $('aspect').value = 'free'; ui(); refresh(); commit(); });
  ['fmt', 'q'].forEach(function (id) { $(id).addEventListener('input', ui); $(id).addEventListener('change', ui); });

  // crop and rotate
  function setCrop(on) { cropMode = on; srcKey = ''; ui(); refresh(); }
  $('cropBtn').addEventListener('click', function () { setCrop(!cropMode); });
  $('cropDone').addEventListener('click', function () { setCrop(false); commit(); });
  function turn(dir) { st.r = (st.r + dir + 4) % 4; st.crop = fitAspect({ x: 0, y: 0, w: 1, h: 1 }); srcKey = ''; refresh(); commit(); }
  $('rotL').addEventListener('click', function () { turn(-1); });
  $('rotR').addEventListener('click', function () { turn(1); });
  $('flipH').addEventListener('click', function () { if (st.r % 2) st.fv = !st.fv; else st.fh = !st.fh; refresh(); commit(); }); // flips act on what you see
  $('flipV').addEventListener('click', function () { if (st.r % 2) st.fh = !st.fh; else st.fv = !st.fv; refresh(); commit(); });
  $('cropReset').addEventListener('click', function () { st.crop = fitAspect({ x: 0, y: 0, w: 1, h: 1 }); st.ang = 0; ui(); refresh(); commit(); });
  $('straight').addEventListener('input', function () { st.ang = +$('straight').value; $('straightV').textContent = st.ang; refresh(); });
  $('straight').addEventListener('change', commit);
  $('aspect').addEventListener('change', function () { st.crop = fitAspect(st.crop, true); overlay(); refresh(); commit(); });

  // before / after: hold the button (mouse, finger or Space key)
  function orig(on) { if (!img || showOrig === on) return; showOrig = on; $('tag').hidden = !on; if (on) running = false; refresh(); }
  $('cmp').addEventListener('pointerdown', function (e) { e.preventDefault(); orig(true); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { $('cmp').addEventListener(ev, function () { orig(false); }); });
  $('cmp').addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); orig(true); } });
  $('cmp').addEventListener('keyup', function () { orig(false); });
  $('cmp').addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // filter thumbnails, drawn with each filter on a small copy of your photo
  function thumbs() {
    var box = $('presets'); box.innerHTML = '';
    var t = document.createElement('canvas'), n = 132; t.width = t.height = n;
    var x = t.getContext('2d'), s = Math.max(n / img.naturalWidth, n / img.naturalHeight);
    x.drawImage(img, (n - img.naturalWidth * s) / 2, (n - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);
    var base = x.getImageData(0, 0, n, n);
    PRESETS.forEach(function (p) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.p = p[0];
      var c = document.createElement('canvas'); c.width = c.height = n;
      var id = new ImageData(new Uint8ClampedArray(base.data), n, n), s2 = fresh(); s2.preset = p[0];
      PIPE(id.data, n, n, params(s2)); c.getContext('2d').putImageData(id, 0, 0);
      b.appendChild(c); b.appendChild(document.createTextNode(p[1]));
      b.addEventListener('click', function () { st.preset = p[0]; if (p[0] !== 'none' && st.fs === 0) st.fs = 100; ui(); refresh(); commit(); });
      box.appendChild(b);
    });
  }

  // ---------- loading ----------
  PT.drop(false, function (f) {
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name)) { say('bad', 'Please choose a photo (JPG, PNG or WebP).'); return; }
    say('', 'Opening…');
    loadImage(f, function (im) {
      if (!im || !im.naturalWidth) { say('bad', /\.hei[cf]$/i.test(f.name) || /hei[cf]/i.test(f.type) ? 'This is a HEIC photo (the iPhone format), which this browser cannot open. Convert it to JPG first with the HEIC to JPG tool, then come back.' : 'Could not read that photo. It may be damaged, or in a format your browser cannot open (like RAW). Convert it to JPG first.'); return; }
      if (im.naturalWidth * im.naturalHeight > 60e6) { say('bad', 'That photo is ' + Math.round(im.naturalWidth * im.naturalHeight / 1e6) + ' megapixels, more than your browser can safely edit. Resize it below 50 megapixels first.'); return; }
      img = im; file = f; st = fresh(); hist = []; fut = []; last = ''; cropMode = false; srcKey = ''; $('aspect').value = 'free';
      $('editor').hidden = false; $('drop').querySelector('b').textContent = 'Open a different photo';
      thumbs(); commit(); ui(); refresh();
      say('', im.naturalWidth + ' × ' + im.naturalHeight + ' px. Try a filter or the sliders. Your original file is never changed.');
    });
  });

  // ---------- export at full resolution, processed in the background worker ----------
  var busy = false;
  $('go').addEventListener('click', function () {
    if (!img || busy) return;
    if (cropMode) setCrop(false);
    busy = true; ui(); $('prog').hidden = false; $('prog').removeAttribute('value'); say('', 'Processing the full-size photo…');
    setTimeout(function () {
      var c, x, id;
      try { c = geom(st, 1, true); x = c.getContext('2d'); id = x.getImageData(0, 0, c.width, c.height); }
      catch (e) { busy = false; $('prog').hidden = true; ui(); say('bad', 'This photo is too large for your browser\'s memory. Try a smaller copy.'); return; }
      var W = c.width, H = c.height, t0 = Date.now(), first = id;
      processData(function () { var r = first || x.getImageData(0, 0, W, H); first = null; return r; }, params(st), function (out) {
        x.putImageData(new ImageData(out, W, H), 0, 0);
        var type = $('fmt').value;
        if (type === 'image/jpeg') { x.setTransform(1, 0, 0, 1, 0, 0); /* white behind see-through parts */ x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); }
        PT.blob(c, type, $('q').value / 100).then(function (b) {
          c.width = c.height = 0; busy = false; $('prog').hidden = true; ui();
          if (!b) { say('bad', 'Your browser could not save in this format. Try JPG.'); return; }
          var ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[b.type] || 'png', name = PT.base(file.name) + '-edited.' + ext;
          PT.done(b, name, b.type, 'Saved ' + name + ' at ' + W + ' × ' + H + ' px in ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s');
          $('dl').textContent = 'Download ' + name; $('dl').click();
        });
      });
    }, 30);
  });
  window.addEventListener('resize', function () { if (cropMode) overlay(); });
})();
</script>
