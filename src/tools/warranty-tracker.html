<style>
.wt fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 4px; margin: 0 0 14px; min-width: 0; }
.wt legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.wt textarea { width: 100%; box-sizing: border-box; min-height: 64px; font: inherit; font-size: 15px; }
.wt .wt-len { display: grid; grid-template-columns: minmax(0, 90px) minmax(0, 1fr); gap: 6px; }
.wt .wt-len input, .wt .wt-len select { width: 100%; box-sizing: border-box; min-width: 0; }
.wt .wt-rc { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
.wt .wt-rc img { max-height: 72px; max-width: 120px; border: 1px solid var(--line); border-radius: 6px; }
.wt .wt-rc input[type=file] { max-width: 100%; }
.wt .wt-hint { font-size: 13.5px; color: var(--muted); margin: 2px 0 10px; }
.wt .wt-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 14px 0 10px; }
.wt .wt-bar > div { flex: 1 1 160px; min-width: 0; }
.wt .wt-bar input, .wt .wt-bar select { width: 100%; box-sizing: border-box; }
.wt .wt-soon { border: 1px solid #f59e0b; background: rgba(245, 158, 11, .1); border-radius: 12px; padding: 8px 12px; margin: 12px 0; }
.wt .wt-soon h3 { margin: 4px 0 6px; font-size: 16px; }
.wt .wt-soon ul { margin: 0; padding-inline-start: 18px; }
.wt .wt-soon li { margin: 2px 0; overflow-wrap: anywhere; }
.wt .wt-list { display: grid; gap: 10px; }
.wt .wt-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; background: var(--surface); }
.wt .wt-card h4 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.wt .wt-card .meta { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.wt .wt-card .nt { font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; margin: 2px 0 0; }
.wt .wt-card .side { grid-row: span 3; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.wt .wt-card .side img { width: 72px; height: 72px; object-fit: cover; border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in; display: block; }
.wt .wt-card .side .pdf { width: 72px; height: 72px; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--accent); text-decoration: none; }
.wt .wt-card .act { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.wt .wt-ib { min-height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; padding: 0 12px; }
.wt .wt-ib.danger { color: var(--bad); }
.wt .wt-badge { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
.wt .wt-badge.ok { background: rgba(15, 122, 79, .12); color: var(--ok); }
.wt .wt-badge.soon { background: rgba(245, 158, 11, .18); color: #b45309; }
.wt .wt-badge.exp { background: rgba(198, 40, 40, .12); color: var(--bad); }
.wt .wt-badge.none { background: var(--bg); color: var(--muted); }
:root[data-theme="dark"] .wt .wt-badge.soon { color: #fbbf24; }
.wt .wt-empty { color: var(--muted); padding: 16px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.wt .btns .btn { min-height: 44px; }
.wt details summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
.wt-view { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 12px; }
.wt-view img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; }
.wt-view button { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #fff; color: #111; font-size: 22px; cursor: pointer; }
</style>
<div class="wt">
<fieldset id="wtForm"><legend id="wtFormT">Add a purchase</legend>
  <div class="fields">
    <div><label for="wtName">Item</label><input type="text" id="wtName" data-nomemo maxlength="80" placeholder="e.g. Washing machine"></div>
    <div><label for="wtStore">Shop or seller</label><input type="text" id="wtStore" data-nomemo maxlength="60" placeholder="e.g. City Electronics"></div>
    <div><label for="wtDate">Date bought</label><input type="date" id="wtDate" data-nomemo></div>
    <div><label for="wtPrice">Price (optional)</label><input type="text" id="wtPrice" data-nomemo inputmode="decimal" maxlength="16" placeholder="e.g. 499.99"></div>
    <div><label for="wtLen">Warranty</label><div class="wt-len"><input type="text" id="wtLen" data-nomemo inputmode="numeric" maxlength="3" value="1" aria-label="Warranty length"><select id="wtLenU" data-nomemo aria-label="Warranty unit"><option value="y">years</option><option value="m">months</option><option value="life">Lifetime</option><option value="none">No warranty</option></select></div></div>
    <div><label for="wtSerial">Serial or model number (optional)</label><input type="text" id="wtSerial" data-nomemo maxlength="60" autocapitalize="characters" spellcheck="false"></div>
  </div>
  <label for="wtNotes">Notes (optional): order number, how to claim, support phone…</label>
  <textarea id="wtNotes" data-nomemo maxlength="1000"></textarea>
  <label for="wtFile" style="margin-top:10px;display:block">Receipt photo or PDF (optional)</label>
  <div class="wt-rc"><input type="file" id="wtFile" data-nomemo accept="image/*,application/pdf"><img id="wtFileImg" alt="Receipt preview" hidden><span id="wtFileInfo" class="wt-hint" style="margin:0"></span><button type="button" class="wt-ib" id="wtFileDel" hidden>Remove receipt</button></div>
  <p class="wt-hint">Photos are made smaller (about 1600 pixels) and kept only on this device. Nothing is uploaded.</p>
  <div class="btns">
    <button type="button" class="btn" id="wtSave">Add purchase</button>
    <button type="button" class="btn ghost" id="wtCancel" hidden>Cancel</button>
  </div>
</fieldset>

<div class="stats" id="wtStats"></div>
<div id="wtSoonBox"></div>

<div class="wt-bar">
  <div><label for="wtSearch">Search</label><input type="search" id="wtSearch" data-nomemo maxlength="60" placeholder="Item, shop, serial, notes"></div>
  <div><label for="wtShow">Show</label><select id="wtShow" data-nomemo><option value="all">Everything</option><option value="active">Under warranty</option><option value="soon">Ending soon</option><option value="exp">Expired</option></select></div>
  <div><label for="wtSort">Sort by</label><select id="wtSort" data-nomemo><option value="end">Warranty ends first</option><option value="new">Newest purchase</option><option value="name">Name</option><option value="price">Highest price</option></select></div>
  <div><label for="wtSoonDays">"Ending soon" means</label><select id="wtSoonDays" data-nomemo><option value="30">within 30 days</option><option value="60">within 60 days</option><option value="90">within 90 days</option><option value="180">within 6 months</option></select></div>
</div>
<div class="wt-list" id="wtList"></div>

<div class="btns">
  <button type="button" class="btn" id="wtPdf">Print list / PDF</button>
  <button type="button" class="btn ghost" id="wtZip">Export ZIP with receipts</button>
  <button type="button" class="btn ghost" id="wtImportBtn">Import ZIP</button>
  <input type="file" id="wtImport" data-nomemo accept=".zip,application/zip" hidden>
</div>
<details>
  <summary>More</summary>
  <div class="fields">
    <div><label for="wtCur">Currency</label><select id="wtCur" data-nomemo></select></div>
    <div><label for="wtPaper">Paper size</label><select id="wtPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
  </div>
  <div class="btns"><button type="button" class="btn ghost" id="wtCsv">Download CSV</button><button type="button" class="btn ghost danger" id="wtWipe">Delete everything</button></div>
  <p class="wt-hint" id="wtSpace"></p>
</details>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<a id="dl" hidden></a>
</div>
<script>

  });
  function persist() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {} }

  // ---------- receipt thumbnails ----------
  var thumbs = (function () {
    var urls = {};
    return {
      get: function (id) { if (urls[id]) return Promise.resolve(urls[id]); return IDB.get(id).then(function (v) { if (!v || !v.blob) return null; urls[id] = { url: URL.createObjectURL(v.blob), type: v.type }; return urls[id]; }); },
      drop: function (id) { if (urls[id]) { URL.revokeObjectURL(urls[id].url); delete urls[id]; } }
    };
  })();
  function loadThumbs() {
    [].forEach.call($('wtList').querySelectorAll('.th[data-rc]'), function (el) {
      var id = el.dataset.rc;
      thumbs.get(id).then(function (t) {
        if (!t) { el.innerHTML = '<span class="wt-hint" style="margin:0">Receipt missing</span>'; return; }
        var it = item(id), nm = it ? it.name : 'item';
        el.innerHTML = t.type === 'application/pdf' ? '<a class="pdf" href="' + t.url + '" target="_blank" rel="noopener" aria-label="Open the PDF receipt for ' + esc(nm) + '">PDF</a>' : '<img src="' + t.url + '" alt="Receipt for ' + esc(nm) + '" tabindex="0" role="button">';
      }, function () { el.innerHTML = ''; });
    });
  }
  function viewer(url) {
    var v = document.createElement('div'); v.className = 'wt-view'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'Receipt');
    v.innerHTML = '<img alt="Receipt" src="' + url + '"><button type="button" aria-label="Close">×</button>';
    function close() { v.remove(); document.removeEventListener('keydown', key); history.state && history.state.wtView && history.back(); }
    function key(e) { if (e.key === 'Escape') close(); }
    v.addEventListener('click', function (e) { if (e.target === v || e.target.tagName === 'BUTTON') close(); });
    document.addEventListener('keydown', key); document.body.appendChild(v); v.querySelector('button').focus();
    try { history.pushState({ wtView: 1 }, ''); } catch (e) {}
    window.addEventListener('popstate', function pop() { window.removeEventListener('popstate', pop); if (v.isConnected) { v.remove(); document.removeEventListener('keydown', key); } });
  }

  // ---------- the list ----------
  function render() {
    var t = today(), all = st.items, n = all.length, act = 0, soon = [], exp = 0, val = 0, priced = 0;
    all.forEach(function (it) { var s = status(it); if (s.k === 'ok' || s.k === 'soon') act++; if (s.k === 'soon') soon.push([it, s]); if (s.k === 'exp') exp++; if (it.price != null) { val += it.price; priced++; } });
    $('wtStats').innerHTML = n ? '<div class="stat"><span>Purchases</span><b>' + n + '</b></div><div class="stat"><span>Under warranty</span><b>' + act + '</b></div><div class="stat"><span>Ending soon</span><b>' + soon.length + '</b></div><div class="stat"><span>Expired</span><b>' + exp + '</b></div>' + (priced ? '<div class="stat"><span>Total paid</span><b>' + fmt(val) + '</b></div>' : '') : '';
    soon.sort(function (a, b) { return a[1].left - b[1].left; });
    $('wtSoonBox').innerHTML = soon.length ? '<div class="wt-soon"><h3>Warranty ending soon</h3><ul>' + soon.map(function (x) { return '<li><b>' + esc(x[0].name) + '</b> – ' + esc(x[1].t) + ' (ends ' + esc(fmtDate(x[1].end, { day: 'numeric', month: 'short', year: 'numeric' })) + ')</li>'; }).join('') + '</ul></div>' : '';
    var q = $('wtSearch').value.trim().toLowerCase(), show = $('wtShow').value;
    var rows = all.map(function (it) { return [it, status(it)]; }).filter(function (x) {
      var it = x[0], s = x[1];
      if (show === 'active' && !(s.k === 'ok' || s.k === 'soon')) return false;
      if (show === 'soon' && s.k !== 'soon') return false;
      if (show === 'exp' && s.k !== 'exp') return false;
      return !q || (it.name + ' ' + it.store + ' ' + it.serial + ' ' + it.notes).toLowerCase().indexOf(q) >= 0;
    });
    var so = st.sort;
    rows.sort(function (a, b) {
      if (so === 'new') return b[0].date.localeCompare(a[0].date) || b[0].added - a[0].added;
      if (so === 'name') return a[0].name.localeCompare(b[0].name);
      if (so === 'price') return (b[0].price || 0) - (a[0].price || 0);
      var ka = a[1].left < 0 ? 1e9 - a[1].left : a[1].left, kb = b[1].left < 0 ? 1e9 - b[1].left : b[1].left; // active first, soonest end on top, expired at the end
      if (a[1].k === 'none') ka = 3e9; if (b[1].k === 'none') kb = 3e9;
      return ka - kb || a[0].name.localeCompare(b[0].name);
    });
    if (!n) $('wtList').innerHTML = '<p class="wt-empty">No purchases yet. Add the first one above – a phone, a fridge, a laptop… Keep the receipt photo with it.</p>';
    else if (!rows.length) $('wtList').innerHTML = '<p class="wt-empty">Nothing matches. Clear the search or choose "Everything".</p>';
    else $('wtList').innerHTML = rows.map(function (x) {
      var it = x[0], s = x[1];
      return '<div class="wt-card" data-id="' + esc(it.id) + '"><h4>' + esc(it.name) + '</h4><div class="side"><span class="wt-badge ' + s.k + '">' + esc(s.t) + '</span>' + (it.receipt ? '<span class="th" data-rc="' + esc(it.id) + '"></span>' : '') + '</div>' +
        '<div class="meta">' + esc([it.store, 'bought ' + fmtDate(it.date, { day: 'numeric', month: 'short', year: 'numeric' }), it.price != null ? fmt(it.price) : ''].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="meta">' + esc('Warranty: ' + lenText(it.months) + (s.end ? ', ends ' + fmtDate(s.end, { day: 'numeric', month: 'short', year: 'numeric' }) : '') + (it.serial ? ' · Serial ' + it.serial : '')) + '</div>' +
        (it.notes ? '<p class="nt">' + esc(it.notes) + '</p>' : '') +
        '<div class="act"><button type="button" class="wt-ib" data-a="edit">Edit</button>' + (it.receipt ? '<button type="button" class="wt-ib" data-a="rc">Receipt</button>' : '') + '<button type="button" class="wt-ib danger" data-a="del">Delete</button></div></div>';
    }).join('');
    loadThumbs();
    $('wtSoonDays').value = String(st.soon); $('wtSort').value = st.sort; $('wtPaper').value = st.paper;
    space();
  }
  function space() {
    var tot = 0, k = 0; st.items.forEach(function (i) { if (i.receipt) { tot += i.receipt.size; k++; } });
    $('wtSpace').textContent = k ? k + (k === 1 ? ' receipt uses ' : ' receipts use ') + fmtBytes(tot) + ' on this device.' : '';
  }
  ['wtSearch'].forEach(function (id) { $(id).addEventListener('input', render); });
  $('wtShow').addEventListener('change', render);
  $('wtSort').addEventListener('change', function () { st.sort = this.value; save(); render(); });
  $('wtSoonDays').addEventListener('change', function () { st.soon = +this.value; save(); render(); });
  $('wtPaper').addEventListener('change', function () { st.paper = this.value; save(); });
  $('wtList').addEventListener('click', function (e) {
    var card = e.target.closest('.wt-card'); if (!card) return; var it = item(card.dataset.id); if (!it) return;
    var img = e.target.closest('.side img'); if (img) return viewer(img.src);
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'rc') { thumbs.get(it.id).then(function (t) { if (!t) return say('bad', 'The receipt for ' + it.name + ' is missing on this device.'); if (t.type === 'application/pdf') window.open(t.url, '_blank', 'noopener'); else viewer(t.url); }, function () { say('bad', 'Receipts cannot be opened in this browser mode.'); }); }
    else if (b.dataset.a === 'edit') {
      editId = it.id; pending = null; pendingDrop = false; $('wtFormT').textContent = 'Edit ' + it.name; $('wtSave').textContent = 'Save changes'; $('wtCancel').hidden = false;
      $('wtName').value = it.name; $('wtStore').value = it.store; $('wtDate').value = it.date; $('wtPrice').value = it.price != null ? decStr(it.price, curDp(st.money)) : ''; $('wtSerial').value = it.serial; $('wtNotes').value = it.notes;
      if (it.months === -1) $('wtLenU').value = 'life'; else if (!it.months) $('wtLenU').value = 'none'; else if (it.months % 12 === 0) { $('wtLenU').value = 'y'; $('wtLen').value = it.months / 12; } else { $('wtLenU').value = 'm'; $('wtLen').value = it.months; }
      $('wtLenU').dispatchEvent(new Event('change'));
      setPreview(null); if (it.receipt) thumbs.get(it.id).then(function (t) { if (t && editId === it.id) { $('wtFileInfo').textContent = (t.type === 'application/pdf' ? 'PDF receipt' : 'Receipt photo') + ', ' + fmtBytes(it.receipt.size); $('wtFileDel').hidden = false; if (t.type !== 'application/pdf') { $('wtFileImg').src = t.url; $('wtFileImg').hidden = false; } } });
      $('wtForm').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('wtName').focus({ preventScroll: true });
    } else if (b.dataset.a === 'del') {
      if (!confirm('Delete ' + it.name + (it.receipt ? ' and its receipt' : '') + '?')) return;
      st.items = st.items.filter(function (x) { return x !== it; }); save(); thumbs.drop(it.id);
      if (it.receipt) IDB.del(it.id).catch(function () {});
      if (editId === it.id) resetForm();
      render(); say('ok', 'Deleted ' + it.name + '.');
    }
  });
  $('wtList').addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.side img')) { e.preventDefault(); viewer(e.target.src); } });

  // ---------- currency ----------
  (function () {
    var list = curList(); if (list.indexOf(st.money) < 0) list.unshift(st.money);
    $('wtCur').innerHTML = list.map(function (x) { return [x, x + ' – ' + curName(x)]; }).sort(function (a, b) { return a[1].localeCompare(b[1]); }).map(function (o) { return '<option value="' + o[0] + '">' + esc(o[1]) + '</option>'; }).join('');
    $('wtCur').value = st.money;
  })();
  $('wtCur').addEventListener('change', function () {
    var to = this.value, a = curDp(st.money), b = curDp(to);
    if (a !== b) { var f = Math.pow(10, Math.abs(b - a)); st.items.forEach(function (i) { if (i.price != null) i.price = b > a ? i.price * f : Math.round(i.price / f); }); }
    st.money = to; save(); render(); say('ok', 'Prices are now shown in ' + curName(to) + '. Nothing was converted at an exchange rate.');
  });

  // ---------- files ----------
  var zipLib = null;
  function getZip() { if (!zipLib) zipLib = (window.JSZip ? Promise.resolve() : new Promise(function (res, rej) { var s = document.createElement('script'); s.src = '../assets/vendor/jszip/jszip.min.js'; s.onload = res; s.onerror = function () { rej(new Error('load')); }; document.head.appendChild(s); })).catch(function (e) { zipLib = null; throw e; }); return zipLib; }
  var EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'application/pdf': 'pdf' };
  $('wtZip').addEventListener('click', function () {
    if (!st.items.length) return say('bad', 'There is nothing to export yet.');
    var btn = this; btn.disabled = true; say('', 'Packing your purchases and receipts…');
    getZip().then(function () {
      var z = new JSZip(), missing = 0, got = 0;
      return Promise.all(st.items.map(function (it) {
        if (!it.receipt) return null;
        return IDB.get(it.id).then(function (v) { if (v && v.blob) { z.file('receipts/' + it.id + '.' + (EXT[v.type] || 'bin'), v.blob); got++; } else missing++; }, function () { missing++; });
      })).then(function () {
        z.file('warranties.json', JSON.stringify({ app: KEY, v: 1, saved: new Date().toISOString(), money: st.money, items: st.items }, null, 1));
        z.file('warranties.csv', csvText());
        return z.generateAsync({ type: 'blob', compression: 'STORE' });
      }).then(function (b) { download('warranties-' + today() + '.zip', b, 'application/zip'); say('ok', 'Exported ' + st.items.length + (st.items.length === 1 ? ' purchase' : ' purchases') + ' and ' + got + (got === 1 ? ' receipt' : ' receipts') + ' (' + fmtBytes(b.size) + ').' + (missing ? ' ' + missing + ' receipt(s) were missing on this device.' : '')); });
    }).catch(function (e) { console.warn(e); say('bad', 'The ZIP file could not be made. ' + (e && e.message === 'load' ? 'Check your connection and try again.' : '')); }).then(function () { btn.disabled = false; });
  });
  $('wtImportBtn').addEventListener('click', function () { $('wtImport').click(); });
  $('wtImport').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    if (!/\.zip$/i.test(f.name)) return say('bad', '"' + f.name + '" is not a ZIP file. Choose the warranties ZIP you exported here.');
    if (f.size > 500 * 1048576) return say('bad', 'That file is too big.');
    say('', 'Reading the ZIP file…');
    getZip().then(function () { return JSZip.loadAsync(f); }).then(function (z) {
      var j = z.file('warranties.json'); if (!j) throw new Error('shape');
      return j.async('string').then(function (t) {
        var o; try { o = JSON.parse(t); } catch (e) { throw new Error('shape'); }
        var c = o && o.app === KEY ? cleanState(o) : null; if (!c || !c.items.length) throw new Error('shape');
        var ids = {}; st.items.forEach(function (i) { ids[i.id] = i; });
        var upd = c.items.filter(function (i) { return ids[i.id]; }).length;
        if (!confirm('Import ' + c.items.length + (c.items.length === 1 ? ' purchase' : ' purchases') + ' from "' + f.name + '"?' + (upd ? ' ' + upd + ' you already have will be updated.' : ''))) return 'no';
        var rc = 0, lost = 0;
        return Promise.all(c.items.map(function (it) {
          if (!it.receipt) return null;
          var zf = z.file('receipts/' + it.id + '.' + (EXT[it.receipt.type] || 'bin'));
          if (!zf) { it.receipt = null; lost++; return null; }
          return zf.async('blob').then(function (b) { var bb = new Blob([b], { type: it.receipt.type }); it.receipt.size = bb.size; return IDB.put(it.id, { blob: bb, type: it.receipt.type }).then(function () { rc++; thumbs.drop(it.id); }); }).catch(function () { it.receipt = null; lost++; });
        })).then(function () {
          c.items.forEach(function (it) { if (ids[it.id]) Object.assign(ids[it.id], it); else st.items.push(it); });
          if (st.items.length > 2000) st.items = st.items.slice(0, 2000);
          if (!st.items.some(function (i) { return i.price != null; }) || st.money === c.money) st.money = c.money;
          save(); render(); persist();
          say('ok', 'Imported ' + c.items.length + (c.items.length === 1 ? ' purchase' : ' purchases') + ' with ' + rc + (rc === 1 ? ' receipt.' : ' receipts.') + (lost ? ' ' + lost + ' receipt(s) could not be restored.' : '') + (c.money !== st.money ? ' Note: the backup used ' + c.money + '; prices are shown in ' + st.money + '.' : ''));
        });
      });
    }).catch(function (e) { console.warn(e); say('bad', e && e.message === 'shape' ? 'This ZIP is not a warranty backup from this tool. Nothing was changed.' : e && e.message === 'load' ? 'The ZIP reader could not load. Check your connection and try again.' : 'That file could not be read. It may be damaged or not a ZIP file.'); });
  });
  function csvText() {
    var rows = [['Item', 'Shop', 'Date bought', 'Price (' + st.money + ')', 'Warranty', 'Ends', 'Status', 'Serial', 'Notes', 'Receipt']];
    st.items.forEach(function (it) { var s = status(it); rows.push([it.name, it.store, it.date, it.price != null ? decStr(it.price, curDp(st.money)) : '', lenText(it.months), s.end || '', s.t, it.serial, it.notes, it.receipt ? 'receipts/' + it.id + '.' + (EXT[it.receipt.type] || 'bin') : '']); });
    return csv(rows);
  }
  $('wtCsv').addEventListener('click', function () { if (!st.items.length) return say('bad', 'There is nothing to download yet.'); download('warranties-' + today() + '.csv', csvText(), 'text/csv;charset=utf-8'); say('ok', 'Downloaded a CSV file that opens in any spreadsheet.'); });
  $('wtWipe').addEventListener('click', function () {
    if (!st.items.length) return say('', 'There is nothing to delete.');
    if (!confirm('Delete all ' + st.items.length + ' purchases and their receipts from this device? Export a ZIP first if you want a copy.')) return;
    st.items.forEach(function (i) { thumbs.drop(i.id); }); st.items = []; save(); IDB.clear().catch(function () {}); resetForm(); render(); say('ok', 'Everything was deleted.');
  });
  $('wtPdf').addEventListener('click', function () {
    if (!st.items.length) return say('bad', 'Add a purchase first.');
    var rows = st.items.map(function (it) { return [it, status(it)]; }).sort(function (a, b) { return a[0].date.localeCompare(b[0].date) * -1; }).map(function (x) {
      var it = x[0], s = x[1];
      return [it.name + (it.serial ? '\nSerial: ' + it.serial : '') + (it.notes ? '\n' + it.notes : ''), it.store || '–', fmtDate(it.date, { day: 'numeric', month: 'short', year: 'numeric' }), it.price != null ? fmt(it.price) : '–', s.end ? fmtDate(s.end, { day: 'numeric', month: 'short', year: 'numeric' }) : lenText(it.months), s.k === 'exp' ? 'Expired' : s.k === 'soon' ? 'Ends soon' : s.k === 'none' ? '–' : 'Active'];
    });
    var act = st.items.filter(function (i) { var k = status(i).k; return k === 'ok' || k === 'soon'; }).length;
    docDownload(this, { paper: st.paper, landscape: true, title: 'Warranties', docTitle: 'Warranty list', biz: 'My purchases and warranties', meta: [['Purchases', String(st.items.length)], ['Under warranty', String(act)], ['Printed', fmtDate(today(), { day: 'numeric', month: 'short', year: 'numeric' })]], blocks: [{ kind: 'table', cols: [{ h: 'Item', w: 3.2 }, { h: 'Shop', w: 1.6 }, { h: 'Bought', w: 1.2 }, { h: 'Price', w: 1.1, a: 'r' }, { h: 'Warranty ends', w: 1.3 }, { h: 'Status', w: 1 }], rows: rows }], accent: '#0f766e', footer: 'Made with GetToolNest Warranty Tracker' }, 'warranty-list-' + today() + '.pdf', $('dl'));
  });

  IDB.ok().then(function (ok) { if (!ok) { $('wtFile').disabled = true; $('wtFileInfo').textContent = 'Receipts cannot be saved in this browser mode (for example private browsing).'; } });
  render();
})();
</script>
