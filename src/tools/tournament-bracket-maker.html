<style>
.tb-view { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; margin: 12px 0 0; max-height: 75vh; -webkit-overflow-scrolling: touch; }
.tb-view svg { display: block; }
.tb-view .tb-m { cursor: pointer; }
.tb-view .tb-m:hover rect.box, .tb-view .tb-m:focus rect.box { stroke: #2563eb; stroke-width: 2; }
.tb-view .tb-m:focus { outline: none; }
.tb-edit { border: 2px solid var(--accent); border-radius: 12px; padding: 12px; margin: 12px 0 0; background: var(--surface); }
.tb-edit h3 { margin: 0 0 8px; font-size: 16px; }
.tb-er { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; margin: 0 0 8px; }
.tb-er label { margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-er input { text-align: center; }
.tb-todo { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.tb-todo button { width: 100%; text-align: start; font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px; cursor: pointer; min-height: 44px; }
.tb-todo button:hover { border-color: var(--accent); }
.tb-todo small { color: var(--muted); display: block; }
.tb-tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; margin-top: 12px; }
.tb-tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tb-tbl table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
.tb-tbl caption { text-align: start; font-weight: 700; padding: 8px 10px 4px; }
.tb-tbl th, .tb-tbl td { padding: 5px 6px; border-top: 1px solid var(--line); text-align: center; white-space: nowrap; }
.tb-tbl td:nth-child(2), .tb-tbl th:nth-child(2) { text-align: start; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.tb-tbl tr.adv td { background: color-mix(in srgb, var(--ok) 12%, transparent); }
.tb-rounds { margin-top: 12px; }
.tb-rounds details { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 8px; padding: 6px 10px; }
.tb-rounds summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.tb-rounds .tb-todo { margin-bottom: 6px; }
.tb-champ { font-size: 20px; font-weight: 800; color: var(--ok); margin: 12px 0 0; }
.tb-print { display: none; }
@media print {
  body > *:not(.tb-print) { display: none !important; }
  html, body { background: #fff !important; }
  .tb-print { display: block !important; color: #000; background: #fff; }
  .tb-page { break-after: page; page-break-after: always; }
  .tb-page:last-child { break-after: auto; page-break-after: auto; }
  .tb-page h2 { font: 700 13pt/1.2 system-ui, sans-serif; margin: 0 0 4mm; }
  .tb-page table { border-collapse: collapse; font: 9.5pt/1.25 system-ui, sans-serif; margin: 0 0 4mm; }
  .tb-page th, .tb-page td { border: 1px solid #999; padding: 2px 5px; text-align: center; }
  .tb-page td.n { text-align: left; }
  .tb-page svg { display: block; }
}

<div id="tbSetup">
  <div class="fields">
    <div><label for="tbName">Tournament name</label><input type="text" id="tbName" data-nomemo maxlength="60" placeholder="e.g. Summer cup"></div>
    <div><label for="tbFormat">Format</label><select id="tbFormat"><option value="single">Single elimination (knockout)</option><option value="double">Double elimination</option><option value="rr">Round robin (league)</option><option value="groups">Groups, then knockout</option></select></div>
    <div><label for="tbSeed">Order</label><select id="tbSeed"><option value="random">Random draw</option><option value="manual">As typed (first = top seed)</option></select></div>
  </div>
  <label for="tbNames">Teams or players (one per line, 2 to 64)</label>
  <textarea id="tbNames" data-nomemo rows="8" placeholder="Team 1&#10;Team 2&#10;Team 3&#10;Team 4" maxlength="4000"></textarea>
  <p class="msg" id="tbCount" style="margin:4px 0 10px">0 entries</p>
  <div class="fields" id="tbOpts">
    <div data-f="single"><label><input type="checkbox" id="tbThird"> Play a match for third place</label></div>
    <div data-f="double"><label><input type="checkbox" id="tbReset" checked> Bracket reset (second final if the losers’ bracket winner wins the first final)</label></div>
    <div data-f="rr"><label><input type="checkbox" id="tbTwice"> Play each other twice (home and away)</label></div>
    <div data-f="groups"><label for="tbGroups">Number of groups</label><input type="number" id="tbGroups" min="2" max="16" value="2" inputmode="numeric"></div>
    <div data-f="groups"><label for="tbAdv">Teams that go through from each group</label><input type="number" id="tbAdv" min="1" max="4" value="2" inputmode="numeric"></div>
    <div data-f="rr groups"><label for="tbPW">Points for a win</label><input type="number" id="tbPW" min="0" max="10" value="3" inputmode="numeric"></div>
    <div data-f="rr groups"><label for="tbPD">Points for a draw</label><input type="number" id="tbPD" min="0" max="10" value="1" inputmode="numeric"></div>
    <div data-f="rr groups"><label for="tbPL">Points for a loss</label><input type="number" id="tbPL" min="0" max="10" value="0" inputmode="numeric"></div>
  </div>
  <div class="btns" style="margin:0"><button type="button" class="btn big" id="tbMake">Make the bracket</button><button type="button" class="btn ghost" id="tbLoadBtn2">Open a saved file</button></div>
</div>
<div id="tbMain" hidden>
  <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline"><h3 id="tbTitle" style="margin:0;font-size:19px"></h3><span id="tbSub" style="color:var(--muted);font-size:14px"></span></div>
  <div class="tb-champ" id="tbChamp" hidden></div>
  <div id="tbEdit" class="tb-edit" hidden></div>
  <div id="tbNext"></div>
  <div id="tbTables" class="tb-tables"></div>
  <div class="tb-view" id="tbView"></div>
  <p class="msg" style="font-size:13.5px;margin-top:6px" id="tbTapHint">Tap a match to enter the score. Winners move on by themselves.</p>
  <div id="tbRounds" class="tb-rounds"></div>
  <div class="fields" style="margin-top:14px">
    <div><label for="tbPaper">Paper for printing</label><select id="tbPaper"><option value="A4">A4 landscape</option><option value="letter">Letter landscape</option></select></div>
  </div>
  <div class="btns" style="margin:0">
    <button type="button" class="btn" id="tbPrint">Print / PDF</button>
    <button type="button" class="btn ghost" id="tbPng">Download PNG</button>
    <button type="button" class="btn ghost" id="tbSave">Save (JSON)</button>
    <button type="button" class="btn ghost" id="tbLoadBtn">Open a saved file</button>
    <button type="button" class="btn ghost" id="tbShuffle">Draw again</button>
    <button type="button" class="btn ghost danger" id="tbNew">New tournament</button>
  </div>
</div>
<input type="file" id="tbLoad" accept=".json,application/json" data-nomemo hidden>
<p class="msg" id="tbMsg">Type the names, choose a format and press Make the bracket. It is saved on this device as you go.</p>
<script>
(function () {
  var LS = 'gtn-tournament-bracket-maker', T = null;
  function say(c, t) { $('tbMsg').className = 'msg ' + (c || ''); $('tbMsg').textContent = t; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function save() { try { localStorage.setItem(LS, JSON.stringify(T)); } catch (e) { say('bad', 'Could not save on this device (storage full or blocked).'); } }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---------------- setup form ----------------
  function names() { return $('tbNames').value.split('\n').map(function (s) { return s.trim().replace(/\s+/g, ' ').slice(0, 40); }).filter(Boolean); }
  function formatOpts() { var f = $('tbFormat').value; [].forEach.call($('tbOpts').children, function (d) { d.hidden = d.dataset.f.split(' ').indexOf(f) < 0; }); }
  $('tbFormat').addEventListener('change', formatOpts);
  $('tbNames').addEventListener('input', function () { var n = names().length; $('tbCount').textContent = n + (n === 1 ? ' entry' : ' entries') + (n > 64 ? ' (too many: 64 at most)' : ''); });
  function num(id, lo, hi, label) { var v = Number($(id).value); if ($(id).value === '' || !isFinite(v) || Math.round(v) !== v || v < lo || v > hi) throw new Error(label + ' must be a whole number from ' + lo + ' to ' + hi + '.'); return v; }

  $('tbMake').addEventListener('click', function () {
    var list = names(), f = $('tbFormat').value;
    if (list.length < 2) { say('bad', 'Type at least 2 teams or players, one per line.'); return; }
    if (list.length > 64) { say('bad', 'That is ' + list.length + ' entries. The most is 64.'); return; }
    var seen = {}, dup = null; list.forEach(function (n) { var k = n.toLowerCase(); if (seen[k]) dup = n; seen[k] = 1; });
    if (dup) { say('bad', '"' + dup + '" is in the list twice. Please make every name different (for example add a number).'); return; }
    var o = { third: $('tbThird').checked, reset: $('tbReset').checked, twice: $('tbTwice').checked };
    try {
      if (f === 'rr' || f === 'groups') { o.pw = num('tbPW', 0, 10, 'Points for a win'); o.pd = num('tbPD', 0, 10, 'Points for a draw'); o.pl = num('tbPL', 0, 10, 'Points for a loss'); }
      if (f === 'groups') {
        o.groups = num('tbGroups', 2, 16, 'Number of groups'); o.adv = num('tbAdv', 1, 4, 'Teams that go through');
        if (list.length < o.groups * 2) throw new Error('With ' + list.length + ' entries you can have at most ' + Math.floor(list.length / 2) + ' groups (each group needs 2 or more).');
        if (o.adv >= Math.floor(list.length / o.groups)) throw new Error('Each group has only ' + Math.floor(list.length / o.groups) + ' teams, so fewer than that must go through. Lower "Teams that go through".');
        if (o.groups * o.adv < 2) throw new Error('At least 2 teams must go through to the knockout.');
      }
      if (f === 'rr' && list.length > 32 && o.twice) throw new Error('Playing twice with more than 32 entries makes too many matches. Untick "Play each other twice".');
    } catch (e) { say('bad', e.message); return; }
    if (T && !confirm('Replace the tournament you already have? Save it first if you want to keep it.')) return;
    T = { app: 'gtn-tournament-bracket-maker', v: 1, name: $('tbName').value.trim().slice(0, 60) || 'Tournament', format: f, seeding: $('tbSeed').value, entrants: list, order: $('tbSeed').value === 'random' ? shuffle(list.map(function (_, i) { return i; })) : list.map(function (_, i) { return i; }), opts: o, res: {}, created: new Date().toISOString() };
    build(); save(); show(); say('ok', 'Bracket ready: ' + MS.filter(function (m) { return !m.byeOnly; }).length + ' matches. Tap a match to enter its score.');
  });

  // ---------------- building the matches ----------------
  // a slot is {p: entrant} | {w: matchId} | {l: matchId} | {g: group, r: place} | null (bye)
  var MS = [], BY = {}, GROUPS = [];
  function seedOrder(P) { var o = [1]; while (o.length < P) { var n = o.length * 2, x = []; o.forEach(function (s) { x.push(s, n + 1 - s); }); o = x; } return o; }
  function add(m) { m.id = 'm' + (MS.length + 1); MS.push(m); BY[m.id] = m; return m; }
  function roundName(left, sec) { return sec === 'L' ? '' : left === 1 ? 'Final' : left === 2 ? 'Semi-finals' : left === 3 ? 'Quarter-finals' : ''; }
  function elim(slots, sec, prefix) { // slots: bracket positions for round 1 (length is a power of two)
    var rounds = [], cur = [], k = Math.log2(slots.length);
    for (var i = 0; i < slots.length; i += 2) cur.push(add({ sec: sec, r: 0, i: i / 2, a: slots[i], b: slots[i + 1] }));
    rounds.push(cur);
    for (var r = 1; r < k; r++) { var nx = []; for (var j = 0; j < cur.length; j += 2) nx.push(add({ sec: sec, r: r, i: j / 2, a: { w: cur[j].id }, b: { w: cur[j + 1].id } })); rounds.push(nx); cur = nx; }
    rounds.forEach(function (rd, r) { var nm = roundName(k - r, sec); rd.forEach(function (m) { m.rt = (prefix || '') + (nm || 'Round ' + (r + 1)); }); });
    return rounds;
  }
  function pow2(n) { var p = 1; while (p < n) p *= 2; return p; }
  function seededSlots(srcs) { var P = Math.max(2, pow2(srcs.length)); return seedOrder(P).map(function (s) { return s <= srcs.length ? srcs[s - 1] : null; }); }
  function build() {
    MS = []; BY = {}; GROUPS = [];
    var f = T.format, o = T.opts, ent = T.order.map(function (i) { return { p: i }; });
    if (f === 'single' || f === 'double') {
      var W = elim(seededSlots(ent), 'W');
      if (f === 'single' && o.third && W.length >= 2) { var sf = W[W.length - 2]; add({ sec: '3', r: 0, i: 0, a: { l: sf[0].id }, b: { l: sf[1].id }, rt: 'Third place' }); }
      if (f === 'double') {
        var k = W.length, L = [], prev = [];
        if (k >= 2) {
          for (var j = 0; j < W[0].length; j += 2) prev.push(add({ sec: 'L', r: 0, i: j / 2, a: { l: W[0][j].id }, b: { l: W[0][j + 1].id } }));
          L.push(prev);
          for (var r = 1; r < k; r++) {
            var drop = W[r].slice(); if (r % 2 === 1) drop.reverse(); // reversed so players do not meet again too soon
            var d = prev.map(function (m, x) { return add({ sec: 'L', r: L.length, i: x, a: { w: m.id }, b: { l: drop[x].id } }); });
            L.push(d); prev = d;
            if (r < k - 1) { var c = []; for (var y = 0; y < prev.length; y += 2) c.push(add({ sec: 'L', r: L.length, i: y / 2, a: { w: prev[y].id }, b: { w: prev[y + 1].id } })); L.push(c); prev = c; }
          }
          L.forEach(function (rd, x) { rd.forEach(function (m) { m.rt = x === L.length - 1 ? 'Losers’ final' : 'Losers’ round ' + (x + 1); }); });
        }
        var wf = W[k - 1][0], lf = k >= 2 ? prev[0] : null;
        W[k - 1][0].rt = 'Winners’ final';
        var gf = add({ sec: 'F', r: 0, i: 0, a: { w: wf.id }, b: lf ? { w: lf.id } : { l: wf.id }, rt: 'Grand final' });
        if (o.reset) add({ sec: 'F', r: 1, i: 0, a: { w: wf.id }, b: lf ? { w: lf.id } : { l: wf.id }, rt: 'Grand final 2 (if needed)', reset: gf.id });
      }
    } else {
      var groups = f === 'rr' ? 1 : o.groups;
      for (var g = 0; g < groups; g++) GROUPS.push([]);
      ent.forEach(function (e, x) { var row = Math.floor(x / groups), col = x % groups; GROUPS[row % 2 ? groups - 1 - col : col].push(e.p); }); // snake draw
      GROUPS.forEach(function (gp, gi) { roundRobin(gp, gi, f === 'rr' && o.twice); });
      if (f === 'groups') {
        var A = o.adv, G = o.groups, slots;
        if (A === 2 && G % 2 === 0) { // winners meet runners-up of the partner group; group mates sit in different halves
          var top = [], bot = [];
          for (var q = 0; q < G; q += 2) { top.push({ g: q, r: 0 }, { g: q + 1, r: 1 }); bot.push({ g: q + 1, r: 0 }, { g: q, r: 1 }); }
          var all = top.concat(bot), P = pow2(all.length); slots = all; while (slots.length < P) slots.push(null);
          if (P !== all.length) slots = seededSlots(all);
        } else { var tiers = []; for (var rr = 0; rr < A; rr++) for (var gg = 0; gg < G; gg++) tiers.push({ g: gg, r: rr }); slots = seededSlots(tiers); }
        elim(slots, 'K');
        if (o.third && slots.length >= 4) { var semis = MS.filter(function (m) { return m.sec === 'K' && m.rt === 'Semi-finals'; }); if (semis.length === 2) add({ sec: '3', r: 0, i: 0, a: { l: semis[0].id }, b: { l: semis[1].id }, rt: 'Third place' }); }
      }
    }
    MS.forEach(function (m) { m.byeOnly = m.sec !== 'G' && isBye(m); });
  }
  function roundRobin(ps, gi, twice) {
    var list = ps.slice(); if (list.length % 2) list.push(-1);
    var n = list.length, rounds = n - 1, half = n / 2, arr = list.slice();
    for (var leg = 0; leg < (twice ? 2 : 1); leg++) for (var r = 0; r < rounds; r++) {
      for (var i = 0; i < half; i++) {
        var a = arr[i], b = arr[n - 1 - i]; if (a === -1 || b === -1) continue;
        if ((r + i) % 2 === 1) { var t = a; a = b; b = t; } // balance home and away
        if (leg) { var t2 = a; a = b; b = t2; }
        add({ sec: 'G', g: gi, r: leg * rounds + r, i: i, a: { p: a }, b: { p: b }, rt: 'Round ' + (leg * rounds + r + 1) });
      }
      arr = [arr[0]].concat([arr[n - 1]], arr.slice(1, n - 1));
    }
  }
  function staticBye(x) { return x === null || (x.l != null && BY[x.l].byeOnly) || (x.w != null && staticBye(BY[x.w].a) && staticBye(BY[x.w].b)); }
  function isBye(m) { return staticBye(m.a) || staticBye(m.b); }

  // ---------------- results ----------------
  var memo = {};
  function res(m) { return T.res[m.id] || null; }
  function decided(m, A, B) { // 0 = first side won, 1 = second, null = not yet; 'd' = draw (league)
    var r = res(m); if (!r) return null;
    if (r.pa !== A || r.pb !== B) return null; // players changed since the score was entered
    if (r.w === 0 || r.w === 1) return r.w;
    if (r.sa != null && r.sb != null) return r.sa > r.sb ? 0 : r.sb > r.sa ? 1 : 'd';
    return null;
  }
  function who(s) { // entrant index, -1 for a bye, undefined while unknown
    if (s === null) return -1;
    if (s.p != null) return s.p;
    if (s.g != null) { var st = standings(s.g); return st.complete ? (st.rows[s.r] ? st.rows[s.r].p : -1) : undefined; }
    var id = s.w || s.l, k = id + (s.w ? 'w' : 'l');
    if (k in memo) return memo[k];
    memo[k] = undefined;
    var m = BY[id], out;
    if (m.reset && resetNotNeeded(m)) out = -1; // the second grand final is not played
    else {
      var A = who(m.a), B = who(m.b);
      if (A === -1 && B === -1) out = -1;
      else if (A === undefined || B === undefined) out = undefined;
      else if (A === -1 || B === -1) out = s.w ? (A === -1 ? B : A) : -1;
      else { var d = decided(m, A, B); out = d === 0 || d === 1 ? (s.w ? [A, B][d] : [B, A][d]) : undefined; }
    }
    return (memo[k] = out);
  }
  function resetNotNeeded(m) { var g = BY[m.reset], w = who({ w: g.id }); return w !== undefined && w === who(g.a); }
  function outcome(m) { var A = who(m.a), B = who(m.b); if (A === undefined || B === undefined) return { A: A, B: B }; return { A: A, B: B, winner: who({ w: m.id }) }; }
  function champion() {
    var f = T.format;
    if (f === 'rr') { var st = standings(0); return st.complete && st.rows.length ? st.rows[0].p : undefined; }
    if (f === 'double') { var gf = MS.filter(function (m) { return m.sec === 'F'; }); var w1 = who({ w: gf[0].id }); if (w1 === undefined) return undefined; if (!T.opts.reset || w1 === who(gf[0].a)) return w1; return who({ w: gf[1].id }); }
    var fin = MS.filter(function (m) { return (m.sec === 'W' || m.sec === 'K') && m.rt === 'Final'; })[0] || MS.filter(function (m) { return m.sec === 'W' || m.sec === 'K'; }).slice(-1)[0];
    return fin ? who({ w: fin.id }) : undefined;
  }
  var stMemo = {};
  function standings(g) {
    if (stMemo[g]) return stMemo[g];
    var o = T.opts, rows = {}, ms = MS.filter(function (m) { return m.sec === 'G' && m.g === g; }), done = 0;
    GROUPS[g].forEach(function (p) { rows[p] = { p: p, P: 0, W: 0, D: 0, L: 0, F: 0, A: 0, Pts: 0 }; });
    ms.forEach(function (m) {
      var r = res(m), a = m.a.p, b = m.b.p; if (!r || r.sa == null || r.sb == null) return; done++;
      var A = rows[a], B = rows[b]; A.P++; B.P++; A.F += r.sa; A.A += r.sb; B.F += r.sb; B.A += r.sa;
      if (r.sa > r.sb) { A.W++; B.L++; A.Pts += o.pw; B.Pts += o.pl; } else if (r.sb > r.sa) { B.W++; A.L++; B.Pts += o.pw; A.Pts += o.pl; } else { A.D++; B.D++; A.Pts += o.pd; B.Pts += o.pd; }
    });
    var list = Object.keys(rows).map(function (k) { var x = rows[k]; x.GD = x.F - x.A; return x; });
    list.sort(function (x, y) { return y.Pts - x.Pts || y.GD - x.GD || y.F - x.F || h2h(ms, x.p, y.p) || T.entrants[x.p].localeCompare(T.entrants[y.p]); });
    return (stMemo[g] = { rows: list, complete: done === ms.length, played: done, total: ms.length });
  }
  function h2h(ms, a, b) { var s = 0; ms.forEach(function (m) { var r = res(m); if (!r || r.sa == null) return; if (m.a.p === a && m.b.p === b) s += Math.sign(r.sb - r.sa); if (m.a.p === b && m.b.p === a) s += Math.sign(r.sa - r.sb); }); return s; }
  function fresh() { memo = {}; stMemo = {}; }

  // ---------------- drawing the bracket (SVG, also used for print and PNG) ----------------
  var BW = 200, BH = 50, CG = 44, VG = 18, HEAD = 30;
  function label(s) {
    var p = who(s);
    if (p === -1) return { t: 'BYE', k: 'bye' };
    if (p !== undefined) return { t: T.entrants[p], k: 'p', p: p };
    if (s.g != null) return { t: (s.r + 1) + ['st', 'nd', 'rd', 'th'][Math.min(3, s.r)] + ' in Group ' + String.fromCharCode(65 + s.g), k: 'tbd' };
    return { t: (s.w ? 'Winner of ' : 'Loser of ') + mno(BY[s.w || s.l]), k: 'tbd' };
  }
  function mno(m) { return 'M' + m.n; }
  function layout() { // positions for every knockout match
    var pos = {}, secs = [], f = T.format, x0 = 0, y0 = f === 'double' || f === 'groups' ? 26 : 0;
