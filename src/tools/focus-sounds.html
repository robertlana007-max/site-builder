<style>
.fs-top { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; margin-bottom: 16px; }
.fs-play { min-width: 150px; justify-content: center; }
.fs-play svg { width: 20px; height: 20px; }
.fs-master { flex: 1 1 220px; min-width: 0; }
.fs-master input { width: 100%; }
.fs-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.fs-presets .btn { min-height: 40px; padding: 6px 14px; }
.fs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 12px; margin-bottom: 18px; }
.fs-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px; background: var(--surface); transition: border-color .15s, background .15s; min-width: 0; }
.fs-card.on { border-color: var(--accent); background: var(--accent-soft); }
.fs-card button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 0; margin: 0 0 8px; font: 600 15.5px/1.2 inherit; font-family: inherit; color: var(--ink); cursor: pointer; text-align: left; min-height: 36px; }
.fs-card button svg { width: 26px; height: 26px; flex: none; color: var(--muted); }
.fs-card.on button svg { color: var(--accent); }
.fs-card button small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.fs-card input[type=range] { width: 100%; }
.fs-card:not(.on) input[type=range] { opacity: .55; }
.fs-timer { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.fs-timer > div { min-width: 180px; }
.fs-left { font-variant-numeric: tabular-nums; font-weight: 600; min-height: 24px; }
.fs-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
.fs-dot.live { background: var(--ok); animation: fs-pulse 1.6s ease-in-out infinite; }
@keyframes fs-pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .fs-dot.live { animation: none; } }

</div>

  <button class="btn ghost" type="button" data-preset="sleep">Sleep</button>
  <button class="btn ghost" type="button" data-preset="cafe">Coffee shop</button>
  <button class="btn ghost" type="button" data-preset="camp">Campfire night</button>

</div>
<div class="fs-grid" id="grid"></div>

      sync(); armTimer(); ui(); say('', '');
      if ('mediaSession' in navigator) try { navigator.mediaSession.metadata = new MediaMetadata({ title: 'Focus Sounds', artist: 'GetToolNest' }); navigator.mediaSession.setActionHandler('play', start); navigator.mediaSession.setActionHandler('pause', stop); } catch (e) {}
    }, function () { say('bad', 'Your browser blocked the sound. Click Play again.'); });
  }
  function stop(msg) {
    if (!ac) return;
    playing = false; endAt = 0; clearInterval(tick);
    setGain(bus.fade.gain, 0, 0.4);
    Object.keys(live).forEach(function (k) { live[k].s.stop(ac.currentTime + 0.5); delete live[k]; });
    setTimeout(function () { if (!playing) ac.suspend(); }, 600);
    ui(); if (typeof msg === 'string') say('ok', msg);
  }
  function armTimer() {
    clearInterval(tick); endAt = 0;
    var mins = +$('timer').value;
    if (playing && ac) {
      var t = ac.currentTime, p = bus.fade.gain;
      p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(1, t + 0.3);
      if (mins > 0) { // the fade is scheduled on the audio clock, so it still happens in a background tab
        endAt = t + mins * 60;
        var fadeLen = Math.min(120, mins * 60 * 0.2);
        p.setValueAtTime(1, endAt - fadeLen); p.linearRampToValueAtTime(0.0001, endAt);
      }
      tick = setInterval(ui, 1000);
    }
    ui();
  }
  function fmt(s) { s = Math.max(0, Math.ceil(s)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
  function ui() {
    if (playing && endAt && ac.currentTime >= endAt) { stop('Timer finished. Sweet dreams, or well done!'); return; }
    $('play').setAttribute('aria-pressed', playing); $('playTx').textContent = playing ? 'Pause' : 'Play';
    $('playIc').innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4.5v15l13-7.5z"/>';
    $('dot').className = 'fs-dot' + (playing ? ' live' : '');
    var n = SOUNDS.filter(function (s) { return state.on[s[0]] && state.vol[s[0]] > 0; }).length;
    $('leftTx').textContent = !playing ? 'Stopped' : !n ? 'No sound is switched on' : endAt ? 'Fades out and stops in ' + fmt(endAt - ac.currentTime) : 'Playing ' + n + (n === 1 ? ' sound' : ' sounds');
  }

  // ================= controls =================
  var cards = {};
  SOUNDS.forEach(function (s) {
    var k = s[0], d = document.createElement('div'); d.className = 'fs-card';
    d.innerHTML = '<button type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + s[3] + '</svg><span>' + s[1] + '<small>' + s[2] + '</small></span></button>' +
      '<input type="range" min="0" max="100" data-nomemo aria-label="' + s[1] + ' volume" id="v-' + k + '">';
    var b = d.querySelector('button'), r = d.querySelector('input');
    r.value = state.vol[k];
    b.addEventListener('click', function () {
      state.on[k] = !state.on[k]; if (state.on[k] && state.vol[k] < 5) state.vol[k] = 50;
      persist(); paint();
      if (state.on[k] && !playing) start(); else { sync(); ui(); }
    });
    r.addEventListener('input', function () { state.vol[k] = +r.value; if (+r.value > 0 && !state.on[k]) state.on[k] = true; persist(); paint(); sync(); ui(); });
    $('grid').appendChild(d); cards[k] = { d: d, b: b, r: r };
  });
  function paint() {
    SOUNDS.forEach(function (s) { var c = cards[s[0]], on = state.on[s[0]] && state.vol[s[0]] > 0; c.d.classList.toggle('on', on); c.b.setAttribute('aria-pressed', on); c.r.value = state.vol[s[0]]; });
    $('master').value = state.master; $('masterv').textContent = state.master;
  }
  function applyPreset(name, quiet) {
    var p = PRESETS[name] || {};
    SOUNDS.forEach(function (s) { var k = s[0]; state.on[k] = k in p; if (k in p) state.vol[k] = p[k]; });
    persist(); paint(); sync(); ui();
    if (!quiet && name !== 'none' && !playing) start();
    if (name === 'none') say('', 'All sounds are off. Pick a sound or a preset.');
  }
  document.querySelectorAll('[data-preset]').forEach(function (b) { b.addEventListener('click', function () { applyPreset(b.dataset.preset); }); });
  $('play').addEventListener('click', function () { playing ? stop() : start(); });
  $('master').addEventListener('input', function () { state.master = +$('master').value; $('masterv').textContent = state.master; persist(); sync(); });
  $('timer').addEventListener('change', function () { armTimer(); if ($('timer').value !== '0' && !playing) say('', 'The timer starts when you press Play.'); });
  document.addEventListener('keydown', function (e) { // Space toggles play when nothing else wants it
    if (e.key !== ' ' || e.target !== document.body) return;
    e.preventDefault(); playing ? stop() : start();
  });
  paint(); ui();
})();
</script>
