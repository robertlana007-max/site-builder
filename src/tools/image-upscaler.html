<style>
.up-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 14px; }
.up-row > span { font-size: 14px; font-weight: 600; }
.up-sub { font-size: 14px; color: var(--muted); margin: -6px 0 14px; }
.up-stage { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; line-height: 0; background: repeating-conic-gradient(var(--line) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; }
.up-stage canvas { display: block; margin: 0 auto; max-width: 100%; height: auto; touch-action: pan-y; cursor: ew-resize; }
.up-tag { position: absolute; top: 8px; padding: 3px 8px; border-radius: 6px; background: rgba(17, 24, 39, .72); color: #fff; font: 600 12px/1.4 system-ui, sans-serif; pointer-events: none; }
.up-tag.l { left: 8px; } .up-tag.r { right: 8px; }
.up-cmp { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; font-size: 14px; color: var(--muted); }
.up-cmp input { flex: 1; min-width: 0; }
.up-stop { margin-top: 10px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop an image here</b>JPG, PNG or WebP. It is enlarged on your device and never uploaded.</div>
<input type="file" id="file" accept="image/*" hidden data-nomemo>
<div class="up-row">
  <span>Enlarge</span>
  <div class="seg" role="group" aria-label="How much bigger"><button type="button" data-scale="2" aria-pressed="true">2× bigger</button><button type="button" data-scale="4" aria-pressed="false">4× bigger</button></div>
</div>
<div class="up-row">
  <span>Method</span>
  <div class="seg" role="group" aria-label="Method"><button type="button" data-method="ai" aria-pressed="true">AI (sharpest)</button><button type="button" data-method="fast" aria-pressed="false">Fast (smooth)</button></div>
</div>
<select id="upx" hidden aria-hidden="true" tabindex="-1"><option>2</option><option>4</option></select>
<select id="method" hidden aria-hidden="true" tabindex="-1"><option>ai</option><option>fast</option></select>
<p class="up-sub" id="methodNote"></p>
<div class="notice" id="notice" hidden><div class="meter" id="bar"><i id="fill"></i></div><p id="stat">Getting ready…</p><button type="button" class="btn ghost up-stop" id="stop">Stop</button></div>
<div id="work" hidden>
  <div class="up-row" style="margin-top:4px">
    <span>View</span>
    <div class="seg" role="group" aria-label="View"><button type="button" data-view="zoom" aria-pressed="true">Close-up (100%)</button><button type="button" data-view="all" aria-pressed="false">Whole picture</button></div>
  </div>
  <div class="up-stage" id="stage"><canvas id="cv" aria-label="Before and after. Drag to compare."></canvas><span class="up-tag l">Before</span><span class="up-tag r">After</span></div>
  <div class="up-cmp"><span>Before</span><input type="range" id="cmp" min="0" max="100" value="50" aria-label="Compare before and after" data-nomemo><span>After</span></div>
  <div class="fields" style="margin-top:12px">
    <div><label for="fmt">Save as</label><select id="fmt"><option value="image/png">PNG (best quality)</option><option value="image/jpeg">JPG (smaller)</option><option value="image/webp">WebP (smaller)</option></select></div>
    <div><label for="sharp">Extra sharpening: <span id="sharpv">0</span></label><input type="range" id="sharp" min="0" max="10" value="0"></div>
  </div>
  <div class="btns"><button class="btn" id="save">Download bigger image</button><a class="btn ghost" id="dl" hidden>Download</a></div>
</div>
<p class="msg" id="msg"></p>

      var d = tx.getImageData(0, 0, t.width, t.height).data; hasAlpha = false; for (var i = 3; i < d.length; i += 4) if (d[i] < 250) { hasAlpha = true; break; }
      if (hasAlpha) $('fmt').value = 'image/png';
      run();
    });
  }
  (function () {
    var drop = $('drop'), input = $('file');
    drop.addEventListener('click', function () { input.click(); });
    drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', function () { var f = input.files[0]; input.value = ''; if (f) take(f); });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) take(f); });
  })();

  // ---------- save (with optional unsharp mask) ----------
  function sharpen(c, amt) {
    var x = c.getContext('2d', { willReadFrequently: true }), w = c.width, h = c.height, id = x.getImageData(0, 0, w, h), d = id.data, b = new Uint8ClampedArray(d), k = amt * 0.15, i, y, xx;
    for (y = 1; y < h - 1; y++) for (xx = 1; xx < w - 1; xx++) {
      i = (y * w + xx) * 4;
      for (var ch = 0; ch < 3; ch++) { var j = i + ch, blur = (b[j - 4] + b[j + 4] + b[j - w * 4] + b[j + w * 4]) / 4; d[j] = b[j] + (b[j] - blur) * k; }
    }
    x.putImageData(id, 0, 0);
  }
  $('save').addEventListener('click', function () {
    if (!out || busy) return;
    var btn = $('save'), label = btn.textContent, type = $('fmt').value; btn.disabled = true; btn.textContent = 'Preparing…';
    setTimeout(function () {
      try {
        var c = out, amt = +$('sharp').value;
        if (amt) { c = canvas(out.width, out.height); c.getContext('2d').drawImage(out, 0, 0); sharpen(c, amt); }
        if (type === 'image/jpeg' && hasAlpha) { var j = canvas(c.width, c.height), jx = j.getContext('2d'); jx.fillStyle = '#fff'; jx.fillRect(0, 0, j.width, j.height); jx.drawImage(c, 0, 0); c = j; }
        c.toBlob(function (b) {
          btn.disabled = false; btn.textContent = label;
          if (!b) { say('bad', 'Your browser could not save a picture this big. Try JPG, or 2× instead of 4×.'); return; }
          var fname = name + '-' + outScale + 'x.' + ({ 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[b.type] || 'png');
          if (lastUrl) URL.revokeObjectURL(lastUrl);
          lastUrl = URL.createObjectURL(b);
          var a = $('dl'); a.href = lastUrl; a.download = fname; a.textContent = 'Download ' + fname; a.hidden = false; a.click(); if (window.burst) burst(a);
          say('ok', 'Saved ' + fname + ' (' + out.width + ' × ' + out.height + ' px, ' + fmtBytes(b.size) + '). If the download did not start, use the green button.');
        }, type, 0.92);
      } catch (e) { btn.disabled = false; btn.textContent = label; say('bad', 'Not enough memory to save this picture. Try 2× or a smaller picture.'); }
    }, 20);
  });
  methodNote();
})();
