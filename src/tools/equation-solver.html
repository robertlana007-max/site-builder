<style>
.es-modes { display: flex; flex-wrap: wrap; margin-bottom: 16px; max-width: 100%; }
.es-modes button { height: auto; min-height: 36px; }
.es-pane[hidden] { display: none; }
.es-eq input[type=text] { font-family: var(--mono); font-size: 17px; }
.es-co { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.es-co input { font-family: var(--mono); }
.es-form { font-size: 15px; color: var(--muted); margin: 0 0 10px; overflow-wrap: anywhere; }
.es-out { margin-top: 18px; }
.es-ans { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; font-size: 18px; overflow-x: auto; }
.es-ans p { margin: 4px 0; }
.es-ans small { color: var(--muted); font-size: 14px; }
.es-steps { margin: 16px 0 0; padding-inline-start: 22px; display: grid; gap: 10px; }
.es-steps li { padding-inline-start: 4px; overflow-x: auto; line-height: 1.7; }
.es-steps li b { display: block; font-size: 15px; }
.es-x { display: block; font-size: 16px; color: var(--ink); }
.es-help { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.es-fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.15; margin: 0 2px; }
.es-fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
.es-fr > span:last-child { padding: 0 3px; }
.es-ok { color: var(--ok); font-weight: 600; }
.mx-t { border-collapse: separate; border-spacing: 0; margin: 6px 0; font-family: var(--mono); font-size: 14.5px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 6px; font-variant-numeric: tabular-nums; }
.mx-t td { padding: 3px 10px; text-align: end; white-space: nowrap; }
.mx-t td.bar { border-left: 1.5px dashed var(--muted); }
.es-sys input[type=text] { font-family: var(--mono); font-size: 16px; margin-bottom: 8px; }
.es-steps details summary { cursor: pointer; color: var(--accent); font-weight: 600; }
</style>
<div class="seg es-modes" role="group" aria-label="Type of equation" id="modes">
  <button type="button" data-m="type" aria-pressed="true">Type it</button>
  <button type="button" data-m="lin" aria-pressed="false">Linear</button>
  <button type="button" data-m="quad" aria-pressed="false">Quadratic</button>
  <button type="button" data-m="cub" aria-pressed="false">Cubic</button>
  <button type="button" data-m="s2" aria-pressed="false">2 equations</button>
  <button type="button" data-m="s3" aria-pressed="false">3 equations</button>
</div>
<div class="es-pane es-eq" data-p="type">
  <label for="eq">Your equation in x</label>
  <input type="text" id="eq" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 2x + 3 = 7 or x^2 - 5x + 6 = 0" value="x^2 - 5x + 6 = 0">
  <p class="es-help">Linear, quadratic and cubic equations. Brackets, fractions and powers are fine: (x+1)^2 = 2x + 9, x/2 + 1/3 = 5, x^3 = 8.</p>
</div>
<div class="es-pane" data-p="lin" hidden>
  <p class="es-form">a·x + b = c</p>
  <div class="es-co"><div><label for="la">a</label><input type="text" id="la" value="2" inputmode="text"></div><div><label for="lb">b</label><input type="text" id="lb" value="3"></div><div><label for="lc">c</label><input type="text" id="lc" value="7"></div></div>
</div>
<div class="es-pane" data-p="quad" hidden>
  <p class="es-form">a·x² + b·x + c = 0</p>
  <div class="es-co"><div><label for="qa">a</label><input type="text" id="qa" value="1"></div><div><label for="qb">b</label><input type="text" id="qb" value="-2"></div><div><label for="qc">c</label><input type="text" id="qc" value="5"></div></div>
</div>
<div class="es-pane" data-p="cub" hidden>
  <p class="es-form">a·x³ + b·x² + c·x + d = 0</p>
  <div class="es-co"><div><label for="ca">a</label><input type="text" id="ca" value="1"></div><div><label for="cb">b</label><input type="text" id="cb" value="0"></div><div><label for="cc">c</label><input type="text" id="cc" value="-15"></div><div><label for="cd">d</label><input type="text" id="cd" value="-4"></div></div>
</div>
<div class="es-pane es-sys" data-p="s2" hidden>
  <p class="es-form">Use x and y. Example: 2x + 3y = 12</p>
  <label for="s21">Equation 1</label><input type="text" id="s21" autocomplete="off" spellcheck="false" value="2x + 3y = 12">
  <label for="s22">Equation 2</label><input type="text" id="s22" autocomplete="off" spellcheck="false" value="x - y = 1">
</div>
<div class="es-pane es-sys" data-p="s3" hidden>
  <p class="es-form">Use x, y and z. Example: x + y + z = 6</p>
  <label for="s31">Equation 1</label><input type="text" id="s31" autocomplete="off" spellcheck="false" value="x + y + z = 6">
  <label for="s32">Equation 2</label><input type="text" id="s32" autocomplete="off" spellcheck="false" value="2x - y + z = 3">
  <label for="s33">Equation 3</label><input type="text" id="s33" autocomplete="off" spellcheck="false" value="x + 2y - z = 2">
</div>
<p class="msg" id="msg"></p>
<div class="es-out" id="out" aria-live="polite"></div>
<div class="btns"><button type="button" class="btn ghost" id="copy" hidden>Copy answer</button></div>

      if (nIsZero(p, 1e-14)) { ts = [0, 0, 0]; st += step('Δ = 0 and p = 0: a triple root', 't = 0'); }
      else { ts = [3 * qf / pf, -3 * qf / (2 * pf), -3 * qf / (2 * pf)]; st += step('Δ = 0: a repeated root', 't₁ = 3q/p = ' + fmtF(ts[0]) + ', t₂ = t₃ = −3q/(2p) = ' + fmtF(ts[1])); }
    } else {
      var rr = 2 * Math.sqrt(-pf / 3), ang = Math.acos(Math.max(-1, Math.min(1, (3 * qf) / (2 * pf) * Math.sqrt(-3 / pf)))) / 3;
      for (var k = 0; k < 3; k++) ts.push(rr * Math.cos(ang - 2 * Math.PI * k / 3));
      st += step('Δ < 0: three real roots (trigonometric method)', 't = 2√(−p/3) · cos(⅓·arccos((3q)/(2p)·√(−3/p)) − 2πk/3), k = 0, 1, 2');
    }
    var fa = nF(a), fb = nF(b), fc = nF(c), fd = nF(d);
    var xs = ts.map(function (t) { var x = t - sh; for (var n = 0; n < 4; n++) { var f = ((fa * x + fb) * x + fc) * x + fd, df = (3 * fa * x + 2 * fb) * x + fc; if (!df) break; var nx = x - f / df; if (!isFinite(nx)) break; x = nx; } return x; }); // polish with Newton's method
    st += step('Undo the substitution x = t ' + (sh < 0 ? '+ ' + fmtF(-sh) : '− ' + fmtF(sh)), xs.map(function (x, i) { return 'x' + '₁₂₃'[i] + ' ≈ ' + fmtF(x); }).join(', '));
    var all2 = xs.slice().sort(function (m, n) { return m - n; });
    if (cplx) all2.push({ re: cplx.re, im: -cplx.im }, { re: cplx.re, im: cplx.im });
    return { ans: rootsHtml(all2), steps: st, text: rootsText(all2) };
  }
  function rootH(r) { return r && r.im !== undefined ? fmtF(r.re) + (r.im < 0 ? ' − ' : ' + ') + fmtF(Math.abs(r.im)) + 'i' : isQ(r) ? H(r) + approx(r) : (Number.isInteger(r) ? fmtF(r) : '≈ ' + fmtF(r)); }
  function sortRoots(rs) {
    var real = rs.filter(function (r) { return r.im === undefined; }).sort(function (u, v) { return nF(u) - nF(v); });
    return real.concat(rs.filter(function (r) { return r.im !== undefined; }));
  }
  function rootsHtml(rs) {
    rs = sortRoots(rs);
    var h = rs.map(function (r, i) { var s = rootH(r); return '<p>x' + '₁₂₃'[i] + (s[0] === '≈' ? ' ' : ' = ') + s + '</p>'; }).join('');
    var nreal = rs.filter(function (r) { return r.im === undefined; }).length;
    return h + '<p><small>' + nreal + ' real root' + (nreal === 1 ? '' : 's') + (nreal < 3 ? ' and ' + (3 - nreal) + ' complex' : '') + ' (counting repeated roots).</small></p>';
  }
  function rootsText(rs) { return sortRoots(rs).map(function (r, i) { return 'x' + (i + 1) + ' = ' + rootH(r).replace(/<[^>]+>/g, '').replace(/≈ /, '≈').replace(/\s+/g, ' '); }).join(', '); }

  // ---------- systems ----------
  function solveSystem(ids, vars) {
    var rows = ids.map(function (id, i) {
      var src = $(id).value;
      if (!src.trim()) throw new MathError('Fill in equation ' + (i + 1) + '.');
      if (src.indexOf('=') < 0) throw new MathError('Equation ' + (i + 1) + ' needs an "=" sign.');
      var p; try { p = equation(src, vars); } catch (e) { if (e instanceof MathError) throw new MathError('Equation ' + (i + 1) + ': ' + e.message); throw e; }
      var K0 = vars.map(function () { return 0; }).join(','), row = vars.map(function () { return Q(0); });
      Object.keys(p).forEach(function (k) {
        if (k === K0) return;
        var e = k.split(',').map(Number), deg = e.reduce(function (s, x) { return s + x; }, 0);
        if (deg > 1) throw new MathError('Equation ' + (i + 1) + ' is not linear: it has a term like x², xy or x·z.');
        row[e.indexOf(1)] = p[k];
      });
      row.push(nNeg(p[K0] || Q(0)));
      return row;
    });
    var fv = function (v) { return txt(v); };
    var st = step('Write the system as an augmented matrix [A | b]', matHtml(rows, fv, vars.length));
    var red = rowReduce(rows, 1, fv), n = vars.length;
    red.steps.forEach(function (s) { st += step(s.op, matHtml(s.M, fv, vars.length)); });
    var R = red.R, tol = red.tol;
    var bad = R.some(function (r) { return r.slice(0, n).every(function (v) { return nIsZero(v, tol); }) && !nIsZero(r[n], tol); });
    if (bad) {
      st += step('A row says 0 = a non-zero number', 'That is impossible, so the equations contradict each other.');
      return { ans: '<p>No solution. The equations are inconsistent' + (n === 2 ? ' (their lines are parallel and never meet).' : ': no point fits all three.') + '</p>', steps: st, text: 'No solution' };
    }
    if (red.rank < n) {
      var free = vars.map(function (v, i) { return i; }).filter(function (i) { return red.pivots.indexOf(i) < 0; }), names = ['t', 's', 'u'], par = {};
      free.forEach(function (c, k) { par[c] = names[k]; });
      var lines = vars.map(function (v, c) {
        if (c in par) return v + ' = ' + par[c] + ' (any number)';
        var r = R[red.pivots.indexOf(c)], out = nIsZero(r[n], tol) ? '' : H(r[n]);
        free.forEach(function (f) { var co = r[f]; if (nIsZero(co, tol)) return; var ng = nF(co) > 0, ab = ng ? co : nNeg(co); out += (out ? (ng ? ' − ' : ' + ') : (ng ? '−' : '')) + (isOne(ab) ? '' : H(ab)) + par[f]; });
        return v + ' = ' + (out || '0');
      });
      st += step('Only ' + red.rank + ' independent equation' + (red.rank === 1 ? '' : 's') + ' for ' + n + ' unknowns', 'So there are infinitely many solutions. Let ' + free.map(function (f) { return vars[f] + ' = ' + par[f]; }).join(', ') + '.');
      return { ans: '<p>Infinitely many solutions:</p>' + lines.map(function (l) { return '<p>' + l + '</p>'; }).join(''), steps: st, text: 'Infinitely many solutions: ' + lines.join('; ').replace(/<[^>]+>/g, '') };
    }
    var sol = vars.map(function (v, c) { return R[c][n]; });
    st += step('Read off the answer', vars.map(function (v, c) { return v + ' = ' + H(sol[c]); }).join(', &nbsp; '));
    var chk = rows.map(function (r, i) { var lhs = r.slice(0, n).reduce(function (s, co, c) { return nAdd(s, nMul(co, sol[c])); }, Q(0)); return 'Equation ' + (i + 1) + ': ' + H(lhs) + ' = ' + H(r[n]) + (nIsZero(nSub(lhs, r[n]), 1e-9 * Math.max(1, Math.abs(nF(r[n])))) ? ' <span class="es-ok">✓</span>' : ''); });
    st += step('Check in the original equations', chk.join('<br>'));
    return { ans: vars.map(function (v, c) { return '<p>' + v + ' = ' + H(sol[c]) + approx(sol[c]) + '</p>'; }).join(''), steps: st, text: vars.map(function (v, c) { return v + ' = ' + txt(sol[c]); }).join(', ') };
  }

  // ---------- typed equation ----------
  function solveTyped() {
    var p = equation($('eq').value, ['x']), c = [Q(0), Q(0), Q(0), Q(0)], deg = 0;
    Object.keys(p).forEach(function (k) { var e = +k; if (e > 3) throw new MathError('This solver handles equations up to x³. Yours has x' + (SUP[e] || '^' + e) + '.'); c[3 - e] = p[k]; if (!nIsZero(p[k])) deg = Math.max(deg, e); });
    var tidy = step('Move everything to one side and simplify', polyH(c.slice(3 - deg)) + ' = 0'), r;
    if (deg === 0) {
      r = nIsZero(c[3], 1e-12) ? { ans: '<p>Every number is a solution: both sides are always equal.</p>', steps: '', text: 'All real numbers' } : { ans: '<p>No solution: the equation simplifies to ' + H(c[3]) + ' = 0, which is never true.</p>', steps: '', text: 'No solution' };
    } else if (deg === 1) { r = solveLinear(c[2], c[3], Q(0), true); r.steps = step('This is a linear equation', '') + (nIsZero(c[3]) ? '' : step((nF(c[3]) < 0 ? 'Add ' + H(nNeg(c[3])) + ' to' : 'Subtract ' + H(c[3]) + ' from') + ' both sides', H(c[2]) + 'x = ' + H(nNeg(c[3])))) + r.steps; }
    else if (deg === 2) { r = solveQuadratic(c[1], c[2], c[3]); r.steps = step('This is a quadratic equation', '') + r.steps; }
    else { r = solveCubic(c[0], c[1], c[2], c[3]); r.steps = step('This is a cubic equation', '') + r.steps; }
    r.steps = tidy + r.steps;
    return r;
  }

  function plain(h) { return h.replace(/<span class="es-fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g, '$1/$2').replace(/<\/p>/g, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/[ \t]+/g, ' ').trim(); }
  // ---------- interface ----------
  var mode = 'type', last = '';
  function show(r) {
    $('out').innerHTML = '<div class="es-ans">' + r.ans + '</div>' + (r.steps ? '<h3>Step-by-step working</h3><ol class="es-steps">' + r.steps + '</ol>' : '');
    last = plain(r.ans); $('copy').hidden = !last; $('out').setAttribute('data-answer', last);
    $('msg').className = 'msg'; $('msg').textContent = '';
  }
  function solve() {
    try {
      if (mode === 'type') show(solveTyped());
      else if (mode === 'lin') show(solveLinear(num('la', 'a'), num('lb', 'b'), num('lc', 'c')));
      else if (mode === 'quad') show(solveQuadratic(num('qa', 'a'), num('qb', 'b'), num('qc', 'c')));
      else if (mode === 'cub') show(solveCubic(num('ca', 'a'), num('cb', 'b'), num('cc', 'c'), num('cd', 'd')));
      else if (mode === 's2') show(solveSystem(['s21', 's22'], ['x', 'y']));
      else show(solveSystem(['s31', 's32', 's33'], ['x', 'y', 'z']));
    } catch (e) {
      if (!(e instanceof MathError)) throw e;
      $('out').innerHTML = ''; $('out').removeAttribute('data-answer'); $('copy').hidden = true; last = '';
      $('msg').className = 'msg bad'; $('msg').textContent = e.message;
    }
  }
  var timer;
  document.querySelector('.card').addEventListener('input', function (e) { if (e.target.closest('.es-pane')) { clearTimeout(timer); timer = setTimeout(solve, 150); } });
  $('modes').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', x === b); });
    [].forEach.call(document.querySelectorAll('.es-pane'), function (p) { p.hidden = p.dataset.p !== mode; });
    try { sessionStorage.setItem('gtn-es-mode', mode); } catch (er) {}
    solve();
  });
  $('copy').addEventListener('click', function () { copyText(last, this); });
  var saved = null; try { saved = sessionStorage.getItem('gtn-es-mode'); } catch (e) {}
  var startBtn = saved && document.querySelector('#modes [data-m="' + saved + '"]');
  if (startBtn) startBtn.click(); else solve();
})();
</script>
