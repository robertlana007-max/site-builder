<style>

.uk-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 12px; }

    pair.slice(0, eq).split('|').forEach(function (r) { if (r && !DICT.has(r)) DICT.set(r, urdu); });
  });

  var CLUSTERS = [['chh', 'چھ'], ['kh', 'خ'], ['gh', 'غ'], ['sh', 'ش'], ['ch', 'چ'], ['zh', 'ژ'], ['th', 'تھ'], ['dh', 'دھ'], ['bh', 'بھ'], ['ph', 'پھ'], ['jh', 'جھ'], ['rh', 'ڑھ']];
  var CONS = { b: 'ب', p: 'پ', t: 'ت', d: 'د', j: 'ج', c: 'ک', f: 'ف', g: 'گ', h: 'ہ', k: 'ک', l: 'ل', m: 'م', n: 'ن', q: 'ق', r: 'ر', s: 'س', v: 'و', w: 'و', x: 'کس', y: 'ی', z: 'ز' };
  var RETRO = { t: 'ٹ', d: 'ڈ', r: 'ڑ', th: 'ٹھ', dh: 'ڈھ' };
  var VGROUPS = ['aa', 'ai', 'au', 'ee', 'ei', 'ii', 'oo', 'ou', 'uu', 'a', 'e', 'i', 'o', 'u'];
  var V = { // [start of word, middle, end of word]
    aa: ['آ', 'ا', 'ا'], a: ['ا', '', 'ا'], ai: ['ای', 'ی', 'ے'], au: ['او', 'و', 'و'], ee: ['ای', 'ی', 'ی'], ei: ['ای', 'ی', 'ے'], ii: ['ای', 'ی', 'ی'],
    e: ['ای', 'ی', 'ے'], i: ['ا', '', 'ی'], o: ['او', 'و', 'و'], oo: ['او', 'و', 'و'], ou: ['او', 'و', 'و'], u: ['ا', '', 'و'], uu: ['او', 'و', 'و']
  };
  var NASAL = { e: 1, ai: 1, ei: 1, o: 1 }; // a final n after these vowels is a nasal noon (karen, hain, logon)
  function isV(c) { return c === 'a' || c === 'e' || c === 'i' || c === 'o' || c === 'u'; }
  // opt: { kh: true -> 'kh' is کھ, retro: true -> t d r are ٹ ڈ ڑ, ah: true -> a final 'a' is ہ }
  function rules(word, opt) {
    var s = word.replace(/['’]/g, ''), lo = s.toLowerCase(), n = lo.length, out = '', i = 0, lastV = null, prevVowelGroup = false;
    while (i < n) {
      var c = lo[i];
      if (isV(c)) {
        var g = null;
        for (var k = 0; k < VGROUPS.length; k++) if (lo.substr(i, VGROUPS[k].length) === VGROUPS[k]) { g = VGROUPS[k]; break; }
        var end = i + g.length, atEnd = end >= n, nasalNext = end === n - 1 && lo[end] === 'n';
        var pos = i === 0 ? 0 : atEnd ? 2 : 1, piece = V[g][pos];
        if (pos === 1 && (g === 'i' || g === 'u') && end < n && isV(lo[end])) piece = g === 'i' ? 'ی' : 'و'; // dia, hua
        if (pos === 1 && (g === 'e' || g === 'a') && lo[end] === 'h' && (end + 1 >= n || !isV(lo[end + 1]))) piece = ''; // kehna, yeh
        if (pos === 2 && g === 'a' && opt.ah && n > 3) piece = 'ہ';
        if (pos === 1 && g === 'a' && opt.longA && end + 1 < n && !isV(lo[end]) && lo[end] !== 'h' && isV(lo[end + 1])) piece = 'ا'; // pakistani, musafir
        if (pos === 2 && prevVowelGroup) { // two vowel sounds in a row: hamza (jao, gai, hue)
          if (g === 'o' || g === 'u') piece = 'ؤ'; else if (g === 'i' || g === 'ee') piece = 'ئی'; else if (g === 'e' || g === 'ai') piece = 'ئے';
        }
        if (nasalNext && pos === 1 && g === 'ai') piece = 'ی';
        out += piece; lastV = g; prevVowelGroup = true; i = end;
        continue;
      }
      prevVowelGroup = false;
      if (!/[a-z]/.test(c)) { out += s[i]; i++; continue; }
      // a doubled consonant is written once (abba, kutta); also c before ch (accha)
      if (i > 0 && !isV(lo[i - 1]) && (lo[i - 1] === c) && c !== 'h') { i++; continue; }
      if (c === 'c' && lo[i + 1] === 'c' && lo[i + 2] === 'h') { i++; continue; }
      var hit = null;
      for (var j = 0; j < CLUSTERS.length; j++) if (lo.substr(i, CLUSTERS[j][0].length) === CLUSTERS[j][0]) { hit = CLUSTERS[j]; break; }
      var upper = s[i] !== lo[i] && i > 0; // a capital T, D or R inside a word means ٹ ڈ ڑ
      if (hit) {
        var u = hit[1];
        if (hit[0] === 'kh' && (opt.kh || i + 2 >= n)) u = 'کھ'; // final kh is usually کھ (dekh, likh, rakh)
        if (hit[0] === 'gh' && opt.kh) u = 'گھ';
        if ((upper || opt.retro) && RETRO[hit[0]]) u = RETRO[hit[0]];
        out += u; i += hit[0].length; continue;
      }
      var ch = CONS[c] || c;
      if ((upper || opt.retro) && RETRO[c] && !(c === 'r' && i === 0)) ch = RETRO[c];
      if (c === 'n' && i === n - 1 && i > 0 && NASAL[lastV] && isV(lo[i - 1])) ch = 'ں';
      out += ch; i++;

  }
  function candidates(word) {
    var lo = word.toLowerCase().replace(/[’]/g, '\''), list = [], add = function (x) { if (x && list.indexOf(x) === -1) list.push(x); };
    if (/^[a-z']+$/.test(lo)) {
      add(DICT.get(lo) || DICT.get(lo.replace(/'/g, '')));
      add(rules(word, {}));
      add(rules(word, { longA: true }));
      add(rules(word, { kh: true }));
      add(rules(word, { retro: true }));
      add(rules(word, { ah: true }));
    }
    return list.slice(0, 5);
  }
  var cache = new Map();
  function convert(word) {
    if (cache.has(word)) return cache.get(word);
    var lo = word.toLowerCase().replace(/’/g, '\''), u = /^[a-z']+$/.test(lo) ? (DICT.get(lo) || DICT.get(lo.replace(/'/g, '')) || rules(word, {})) : word;
    if (cache.size > 20000) cache.clear();
    cache.set(word, u); return u;
  }
  function digits(s) { return $('ukDigits').checked ? s.replace(/[0-9]/g, function (d) { return UDIG[+d]; }) : s; }
  var PUNCT = { ',': '،', '.': '۔', '?': '؟', ';': '؛' };

  // ---------- inserting text while keeping the undo history where the browser allows it ----------
  var savedSel = [0, 0];
  function insert(text, back) {
    var focused = document.activeElement === ta;
    if (!focused) { ta.setSelectionRange(savedSel[0], savedSel[1]); }
    var a = ta.selectionStart, b = ta.selectionEnd;
    if (back) { if (a === b) { if (a === 0) return; a = a - prevLen(ta.value, a); } ta.setSelectionRange(a, b); text = ''; }
    var ok = false;
    if (focused) { try { ok = document.execCommand(text ? 'insertText' : 'delete', false, text); } catch (e) {} }
    if (!ok) { ta.setRangeText(text, a, b, 'end'); }
    savedSel = [ta.selectionStart, ta.selectionEnd];
    stats(); suggest();
  }
  // length of the character before the cursor: a whole emoji or surrogate pair, or a letter with its marks
  function prevLen(v, at) {
    var c = v.charCodeAt(at - 1);
    if (c >= 0xdc00 && c <= 0xdfff && at > 1) return 2;
    return 1;
  }
  ta.addEventListener('select', function () { savedSel = [ta.selectionStart, ta.selectionEnd]; });
  ta.addEventListener('keyup', function () { savedSel = [ta.selectionStart, ta.selectionEnd]; });
  ta.addEventListener('click', function () { savedSel = [ta.selectionStart, ta.selectionEnd]; suggest(); });

  // Phonetic mode: turn each typed Latin character into its Urdu letter before it reaches the box.
  ta.addEventListener('beforeinput', function (e) {
    if (mode !== 'phon' || e.inputType !== 'insertText' || !e.data || e.isComposing) return;
    var out = '', changed = false;
    for (var ch of e.data) { var m = keyOut(ch); if (m !== ch) changed = true; out += m; }
    if (!changed) return;
    e.preventDefault();
    insert(out);
  });
  // Roman mode: when a word is finished (space, punctuation or Enter), the Roman word before it becomes Urdu.
  ta.addEventListener('input', function (e) {
    if (mode === 'roman' && !e.isComposing && (e.inputType === 'insertText' || e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph')) {
      var d = e.inputType === 'insertText' ? e.data : '\n';
      if (d && /[\s,.?;!:)\]]$/.test(d)) finishWord(d.slice(-1));
    }
    savedSel = [ta.selectionStart, ta.selectionEnd];
    if ($('ukMsg').textContent) say('', '');
    stats(); suggest();
  });
  function finishWord(endCh) {
    var v = ta.value, at = ta.selectionStart, before = v.slice(0, at - 1), m = /[A-Za-z'’]+$/.exec(before);
    var punct = PUNCT[endCh] && (m || /[\u0600-\u06ff]\s*$/.test(before)) ? PUNCT[endCh] : endCh;
    if (!m && punct === endCh) return;
    var start = m ? at - 1 - m[0].length : at - 1, word = m ? convert(m[0]) : '';
    ta.setRangeText(word + punct, start, at, 'end');
  }
  // Live suggestions for the Roman word at the cursor
  function currentWord() {
    if (mode !== 'roman') return null;
    var at = ta.selectionStart; if (at !== ta.selectionEnd) return null;
    var m = /[A-Za-z'’]+$/.exec(ta.value.slice(0, at));
    return m ? { word: m[0], start: at - m[0].length, end: at } : null;
  }
  function suggest() {
    var box = $('ukSug'), cw = currentWord();
    box.textContent = '';
    if (!cw) return;
    candidates(cw.word).forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = c; b.lang = 'ur';
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); });
      b.addEventListener('click', function () {
        var w = currentWord(); if (!w) return;
        ta.setRangeText(c + ' ', w.start, w.end, 'end'); savedSel = [ta.selectionStart, ta.selectionEnd];
        stats(); suggest(); if (!$('ukNoKb').checked) ta.focus();
      });
      box.appendChild(b);
    });
    var r = document.createElement('span'); r.className = 'uk-rom'; r.textContent = cw.word + ' →'; box.insertBefore(r, box.firstChild);
  }
  $('ukConv').addEventListener('click', function () {
    var n = 0;
    ta.value = ta.value.replace(/[A-Za-z'’]+/g, function (w) { var u = convert(w); if (u !== w) n++; return u; })
      .replace(/([\u0600-\u06ff])\s*([,.?;])(?=\s|$)/g, function (m, a, p) { return a + PUNCT[p]; });
    ta.value = digits(ta.value);
    stats(); suggest();
    say(n ? 'ok' : '', n ? 'Converted ' + n + (n === 1 ? ' Roman word.' : ' Roman words.') + ' Tap a word you want to change and retype it if needed.' : 'There are no Roman (English letter) words to convert.');
  });

  // ---------- on-screen keyboard ----------
  function drawKb() {
    var kb = $('ukKb'); kb.textContent = '';
    ROWS.forEach(function (row) {
      var r = document.createElement('div'); r.className = 'uk-row';
      row.forEach(function (k) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'uk-k'; b.dataset.k = k;
        if (k === 'SHIFT') { b.className += ' w2' + (shift ? ' on' : ''); b.textContent = '⇧ Shift'; b.setAttribute('aria-pressed', shift ? 'true' : 'false'); }
        else if (k === 'BACK') { b.className += ' w2'; b.textContent = '⌫'; b.setAttribute('aria-label', 'Backspace'); }
        else if (k === 'SPACE') { b.className += ' sp'; b.textContent = 'Space'; }
        else if (k === 'ENTER') { b.className += ' w2'; b.textContent = '↵'; b.setAttribute('aria-label', 'New line'); }
        else if (k === 'ZWNJ') { b.className += ' w2'; b.textContent = 'ZWNJ'; b.title = 'Zero-width non-joiner: stops two letters from joining'; }
        else {
          var key = shift && /[a-z]/.test(k) ? k.toUpperCase() : shift && k === ',' ? ',' : k, out = keyOut(key);
          if (shift && k === '.') out = '!';
          var bb = document.createElement('b'); bb.textContent = /^[\u064b-\u0670]$/.test(out) ? '\u25cc' + out : out;
          var ii = document.createElement('i'); ii.textContent = key;
          b.appendChild(ii); b.appendChild(bb); b.setAttribute('aria-label', out); b.dataset.out = out;
        }
        r.appendChild(b);
      });
      kb.appendChild(r);
    });
  }
  var repeat = null;
  function press(b) {
    var k = b.dataset.k;
    if (k === 'SHIFT') { shift = !shift; drawKb(); return; }
    if (k === 'BACK') { insert('', true); return; }
    if (k === 'SPACE') {
      if (mode === 'roman' && currentWord()) { var w = currentWord(); ta.setRangeText(convert(w.word) + ' ', w.start, w.end, 'end'); savedSel = [ta.selectionStart, ta.selectionEnd]; stats(); suggest(); return; }
      insert(' '); return;
    }
    if (k === 'ENTER') { insert('\n'); return; }
    if (k === 'ZWNJ') { insert('\u200c'); return; }
    insert(b.dataset.out);
    if (shift) { shift = false; drawKb(); }
  }
  $('ukKb').addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.uk-k'); if (!b) return;
    e.preventDefault(); // keep the cursor in the text box
    b.classList.add('down'); setTimeout(function () { b.classList.remove('down'); }, 120);
    press(b);
    if (b.dataset.k === 'BACK') { clearTimeout(repeat); repeat = setTimeout(function rep() { insert('', true); repeat = setTimeout(rep, 70); }, 450); }
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { $('ukKb').addEventListener(ev, function () { clearTimeout(repeat); }); });
  $('ukKb').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { var b = e.target.closest('.uk-k'); if (b) { e.preventDefault(); press(b); } } });

  // ---------- modes and options ----------
  var HELP = {
    roman: 'Type Urdu in English letters, like "aap kaise hain". Each word turns into Urdu when you press space. Tap a suggestion to pick a different spelling.',
    phon: 'Your computer keys type Urdu letters that sound alike: a = ا, b = ب, s = س. Hold Shift for more letters (Shift+t = ٹ, Shift+n = ں). The keys below show every letter.',
    off: 'Type with your own Urdu keyboard, or tap the keys below.'
  };
  function setMode(m) {
    mode = m;
    [].forEach.call($('ukMode').querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', b.dataset.m === m ? 'true' : 'false'); });
    $('ukHelp').textContent = HELP[m];
    $('ukConv').hidden = m !== 'roman';
    try { localStorage.setItem('gtn-uk-mode', m); } catch (e) {}
    suggest();
  }
  $('ukMode').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
  function look() {
    ta.classList.toggle('naskh', $('ukFont').value === 'naskh');
    ta.style.fontSize = $('ukSize').value + 'px';
    if ($('ukNoKb').checked) ta.setAttribute('inputmode', 'none'); else ta.removeAttribute('inputmode');
  }
  ['ukFont', 'ukSize', 'ukNoKb'].forEach(function (id) { $(id).addEventListener('change', look); });
  $('ukDigits').addEventListener('change', drawKb);
  function stats() {
    var v = ta.value;
    $('ukW').textContent = fmtNum(v.trim() ? v.trim().split(/\s+/).length : 0, 0);
    $('ukC').textContent = fmtNum(Array.from(v.replace(/\u200c/g, '')).length, 0);
  }
  $('ukCopy').addEventListener('click', function () { if (ta.value) copyText(ta.value, $('ukCopy')); else say('', 'Nothing to copy yet. Type something first.'); });
  $('ukDl').addEventListener('click', function () {
    if (!ta.value) { say('', 'Nothing to download yet. Type something first.'); return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + ta.value], { type: 'text/plain;charset=utf-8' })); a.download = 'urdu-text.txt'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });
  $('ukClr').addEventListener('click', function () { ta.value = ''; savedSel = [0, 0]; stats(); suggest(); say('', ''); if (!$('ukNoKb').checked) ta.focus(); });
  var saved = null; try { saved = localStorage.getItem('gtn-uk-mode'); } catch (e) {}
  setMode(HELP[saved] ? saved : 'roman');
  drawKb(); look(); stats();
  window.ukTranslit = convert; // handy for testing in the console
})();
</script>
