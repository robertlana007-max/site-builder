<div class="fields">
  <div><label for="price">Home price</label><input type="number" id="price" min="0" step="any" value="350000"></div>
  <div><label for="down">Down payment</label><input type="number" id="down" min="0" step="any" value="70000"></div>
  <div><label for="rate">Interest rate (% per year)</label><input type="number" id="rate" min="0" step="any" value="6.5"></div>
  <div><label for="term">Loan term</label><select id="term"><option value="30">30 years</option><option value="25">25 years</option><option value="20">20 years</option><option value="15">15 years</option><option value="10">10 years</option></select></div>
  <div><label for="tax">Property tax (per year)</label><input type="number" id="tax" min="0" step="any" value="3600"></div>
  <div><label for="ins">Home insurance (per year)</label><input type="number" id="ins" min="0" step="any" value="1200"></div>
  <div><label for="hoa">HOA fees (per month)</label><input type="number" id="hoa" min="0" step="any" value="0"></div>
</div>
<div class="stats">
  <div class="stat"><span>Total monthly payment</span><b id="total">–</b></div>
  <div class="stat"><span>Principal &amp; interest</span><b id="pi">–</b></div>
  <div class="stat"><span>Tax, insurance &amp; HOA</span><b id="extra">–</b></div>
</div>
<div class="stats">
  <div class="stat"><span>Loan amount</span><b id="loan">–</b></div>
  <div class="stat"><span>Down payment</span><b id="dp">–</b></div>
  <div class="stat"><span>Total interest</span><b id="int">–</b></div>
</div>
<p class="msg" id="msg"></p>
<script>
(function () {
  var ids = ['total', 'pi', 'extra', 'loan', 'dp', 'int'];
  function n(id) { var v = +$(id).value; return v > 0 ? v : 0; }
  function calc() {
    var price = n('price'), down = n('down'), P = price - down, r = n('rate') / 1200, m = +$('term').value * 12;
    if (!(price > 0) || P <= 0) {
      ids.forEach(function (i) { $(i).textContent = '–'; });
      $('msg').className = 'msg bad'; $('msg').textContent = price > 0 ? 'The down payment must be less than the home price.' : 'Enter the home price.'; return;
    }
    $('msg').textContent = '';
    var pi = r === 0 ? P / m : P * r / (1 - Math.pow(1 + r, -m));
    var extra = n('tax') / 12 + n('ins') / 12 + n('hoa');
    $('total').textContent = fmtNum(pi + extra, 2);
    $('pi').textContent = fmtNum(pi, 2);
    $('extra').textContent = fmtNum(extra, 2);
    $('loan').textContent = fmtNum(P, 0);
    $('dp').textContent = fmtNum(down / price * 100, 1) + '%';
    $('int').textContent = fmtNum(pi * m - P, 0);
  }
  ['price', 'down', 'rate', 'term', 'tax', 'ins', 'hoa'].forEach(function (id) { $(id).addEventListener('input', calc); });
  calc();
})();
</script>
