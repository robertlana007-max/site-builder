          var want = { '(': ')', '[': ']', '{': '}' }[c]; i++;
          var inner = seq(want);
          if (s[i] !== want) throw new MErr('A "' + c + '" is not closed.');
          i++; add(out, inner, num()); any = true; continue;
        }
        if (/[A-Z]/.test(c)) {
          var two = s.substr(i, 2), sym = /^[A-Z][a-z]$/.test(two) && BYSYM[two] ? two : c;
          if (!BYSYM[sym]) throw new MErr('"' + (/^[A-Z][a-z]$/.test(two) ? two : c) + '" is not an element symbol. Symbols start with a capital letter, like Co (cobalt) versus CO (carbon + oxygen).');
          i += sym.length; out[sym] = (out[sym] || 0) + num(); any = true; continue;
        }
        if (/[a-z]/.test(c)) throw new MErr('"' + c + '" should be a capital letter. Element symbols start with a capital, like Na or Cl.');

      }
      if (!any) throw new MErr('Something is missing in the formula.');

    }
    var total = {};
    while (i < s.length) {
      var k2 = num(); // a leading number multiplies the whole part: 5H2O
      add(total, seq(null), k2);

    }
    return total;
  }
  function runMM() {
    var msg = $('mmsg'); msg.className = 'msg'; msg.textContent = '';
    if (!$('formula').value.trim()) { $('mout').innerHTML = ''; return; }
    var counts;
    try { counts = parseFormula($('formula').value); } catch (e) { if (!(e instanceof MErr)) throw e; $('mout').innerHTML = ''; msg.className = 'msg bad'; msg.textContent = e.message; return; }

    syms.forEach(function (x) { total += BYSYM[x].mass * counts[x]; if (!BYSYM[x].stable) unstable.push(BYSYM[x].name); });
    var rows = syms.map(function (x) { var e = BYSYM[x], m = e.mass * counts[x]; return '<tr><td>' + e.name + ' (' + x + ')</td><td>' + counts[x] + '</td><td>' + e.massTxt + '</td><td>' + m.toFixed(3) + '</td><td>' + (m / total * 100).toFixed(2) + '%</td></tr>'; }).join('');
    var atoms = syms.reduce(function (a, x) { return a + counts[x]; }, 0);
    $('mout').innerHTML = '<div class="pt-total"><small>Molar mass of ' + $('formula').value.trim().replace(/[<>&"]/g, '') + '</small>' + total.toFixed(3) + ' g/mol</div>' +
      '<div class="scroll-x" style="margin-top:10px"><table class="sched"><thead><tr><th>Element</th><th>Atoms</th><th>Atomic mass</th><th>Mass (g/mol)</th><th>Mass %</th></tr></thead><tbody>' + rows + '</tbody><tfoot><tr><th>Total</th><th>' + atoms + '</th><th></th><th>' + total.toFixed(3) + '</th><th>100%</th></tr></tfoot></table></div>' +
      '<p class="msg">Uses IUPAC standard atomic weights. ' + (unstable.length ? unstable.join(', ') + (unstable.length === 1 ? ' has' : ' have') + ' no stable isotope, so the mass number of the most stable isotope is used. ' : '') + 'The same number in grams is one mole: ' + total.toFixed(3) + ' g contains 6.022 × 10²³ formula units.</p>';
  }
  var t; $('formula').addEventListener('input', function () { clearTimeout(t); t = setTimeout(runMM, 150); });
  $('exs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('formula').value = b.textContent; runMM(); $('formula').dispatchEvent(new Event('change', { bubbles: true })); });
  runMM();
})();
</script>
