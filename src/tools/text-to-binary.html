<label for="txt">Text or binary</label>
<textarea id="txt" spellcheck="false" placeholder="Type text, or paste binary like 01001000 01101001"></textarea>
<div class="btns">
  <button class="btn" id="enc">Text to binary</button>
  <button class="btn" id="dec">Binary to text</button>
  <button class="btn ghost" id="cp">Copy</button>
  <button class="btn ghost" id="clr">Clear</button>
</div>
<p class="msg" id="msg"></p>
<script>
(function () {
  function say(cls, t) { $('msg').className = 'msg ' + cls; $('msg').textContent = t; }
  $('enc').addEventListener('click', function () {
    var b = new TextEncoder().encode($('txt').value);
    $('txt').value = Array.from(b).map(function (x) { return x.toString(2).padStart(8, '0'); }).join(' ');
    say('ok', b.length + (b.length === 1 ? ' byte.' : ' bytes.'));
  });
  $('dec').addEventListener('click', function () {
    var s = $('txt').value.replace(/\s+/g, '');
    if (!s || /[^01]/.test(s)) return say('bad', 'Binary can only contain 0 and 1.');
    if (s.length % 8) return say('bad', 'Binary text must be in groups of 8 digits. This has ' + s.length + ' digits.');
    var bytes = new Uint8Array(s.length / 8);
    for (var i = 0; i < bytes.length; i++) bytes[i] = parseInt(s.substr(i * 8, 8), 2);
    try { $('txt').value = new TextDecoder('utf-8', { fatal: true }).decode(bytes); say('ok', 'Decoded.'); }
    catch (e) { say('bad', 'These bytes are not valid text.'); }
  });
  $('cp').addEventListener('click', function () { copyText($('txt').value, $('cp')); });
  $('clr').addEventListener('click', function () { $('txt').value = ''; say('', ''); });
})();
</script>
