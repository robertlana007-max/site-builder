<style>
.gc-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; margin-bottom: 8px; }
.gc-row[hidden] { display: none; }
.gc-sw { width: 14px; height: 14px; border-radius: 50%; background: var(--k); flex: none; }
.gc-row label { margin: 0; font-family: var(--mono); font-size: 15px; white-space: nowrap; }
.gc-row input[type=text] { font-family: var(--mono); font-size: 16px; min-width: 0; }
.gc-row input.bad { border-color: var(--bad); }
.gc-ic { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; font: 600 18px/1 inherit; font-family: inherit; display: grid; place-items: center; padding: 0; }
.gc-ic:hover { color: var(--accent); border-color: var(--accent); }
.gc-ic[aria-pressed="false"] { opacity: .45; }
.gc-err { grid-column: 3 / -1; margin: -4px 0 4px; font-size: 13.5px; color: var(--bad); }
.gc-err:empty { display: none; }
.gc-box { position: relative; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.gc-box canvas { display: block; width: 100%; height: clamp(300px, 62vw, 520px); touch-action: none; cursor: crosshair; }
.gc-box canvas.drag { cursor: grabbing; }
.gc-zoom { position: absolute; top: 8px; inset-inline-end: 8px; display: grid; gap: 6px; }
.gc-zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 20px/1 inherit; font-family: inherit; cursor: pointer; box-shadow: var(--shadow); padding: 0; }
.gc-zoom button:hover { color: var(--accent); border-color: var(--accent); }
.gc-read { margin-top: 8px; font-family: var(--mono); font-size: 14px; color: var(--muted); min-height: 22px; overflow-wrap: anywhere; }
.gc-read b { color: var(--ink); font-weight: 600; }
.gc-win { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.gc-found { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; }
.gc-found li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.gc-found i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 6px; }
.gc-help { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
</style>

    var ly = Math.min(Math.max(ax + 4, 4), h - 18); c.textAlign = 'center'; c.textBaseline = 'top';
    for (var lx = Math.ceil(view.x0 / xs) * xs; lx <= view.x1; lx += xs) {

      var lw = 0; list.forEach(function (i) { lw = Math.max(lw, c.measureText('y = ' + input(i).value.trim()).width); });

  }
  function halo(c, t, x, y, bg) { c.save(); c.strokeStyle = bg; c.lineWidth = 3; c.lineJoin = 'round'; c.strokeText(t, x, y); c.restore(); c.fillText(t, x, y); }

  var raf = 0;
  function draw() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; drawNow(); }); }
  function drawNow() {
    if (!W) return;

  }
  function size() {
    var r = cv.getBoundingClientRect(), w = Math.round(r.width), h = Math.round(r.height);

  // ---------- reading values ----------
  function readout() {

  function setTrace(px, py) {

  $('zin').addEventListener('click', function () { zoom(1 / 1.6, W / 2, H / 2); });

  $('zreset').addEventListener('click', function () { view = defaultView(); draw(); });
  $('setwin').addEventListener('click', function () {
    var v = ['xmin', 'xmax', 'ymin', 'ymax'].map(function (id) { return parseFloat($(id).value); });

    if (v[0] >= v[1] || v[2] >= v[3]) return say('bad', 'Each "from" value must be smaller than its "to" value.');
    if (v[1] - v[0] < 1e-9 || v[3] - v[2] < 1e-9) return say('bad', 'That window is too small to draw.');
    view = { x0: v[0], x1: v[1], y0: v[2], y1: v[3] }; say('', ''); draw();
  });
  function say(cls, t) { $('msg').className = 'msg' + (cls ? ' ' + cls : ''); $('msg').textContent = t; }

  // ---------- roots and intersections in the visible window ----------
  function zerosOf(g, a, b) {

  $('find').addEventListener('click', function () {

    r.querySelector('.eye').addEventListener('click', function () { var b = this, on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.textContent = on ? '◉' : '○'; draw(); });
    r.querySelector('.del').addEventListener('click', function () {
      var n = visibleRows(), shownCount = rows.filter(function (x) { return !x.hidden; }).length;
      for (var j = i; j < rows.length - 1; j++) { input(j).value = input(j + 1).value; rows[j].querySelector('.eye').setAttribute('aria-pressed', rows[j + 1].querySelector('.eye').getAttribute('aria-pressed')); rows[j].querySelector('.eye').textContent = rows[j + 1].querySelector('.eye').textContent; }
