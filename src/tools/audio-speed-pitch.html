<style>
.sp-name { margin: -4px 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.sp-name b { color: var(--ink); }
.sp-ctl { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
.sp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 4px; }
.sp-head label { margin: 0; }
.sp-head output { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sp-ctl input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
.sp-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }
.sp-presets button { font: inherit; font-size: 14px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface, var(--bg)); color: var(--ink); cursor: pointer; }
.sp-presets button:hover { border-color: var(--accent); }
.sp-ctl.off { opacity: .55; }
.sp-hint { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.sp-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.sp-row .btn { flex: 1 1 160px; }
.sp-audio { display: block; width: 100%; margin: 0 0 14px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a song or audio file here</b>MP3, M4A, WAV, OGG, FLAC, or a video to take the sound from. Nothing is uploaded.</div>
<input type="file" id="file" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.mp4,.mov,.webm,.mkv" hidden data-nomemo>
<p class="sp-name" id="info"></p>
<div id="work" hidden>
  <div class="sp-ctl">
    <div class="sp-head"><label for="speedR">Speed</label><output id="speedOut">1×</output></div>
    <input type="range" id="speedR" min="-200" max="200" step="1" value="0" aria-label="Speed, from 0.25 times to 4 times">
    <div class="sp-presets" id="speedPresets"></div>
    <div class="fields" style="margin-top:10px"><div><label for="speed">Exact speed (0.25 to 4)</label><input type="number" id="speed" min="0.25" max="4" step="0.01" value="1" inputmode="decimal"></div></div>
  </div>
  <div class="sp-ctl" id="pitchBox">
    <div class="sp-head"><label for="pitchR">Pitch</label><output id="pitchOut">0 semitones</output></div>
    <input type="range" id="pitchR" min="-12" max="12" step="1" value="0" aria-label="Pitch in semitones, from minus 12 to plus 12">
    <div class="sp-presets" id="pitchPresets"></div>
    <div class="fields" style="margin-top:10px"><div><label for="semis">Exact pitch change (semitones, −12 to 12)</label><input type="number" id="semis" min="-12" max="12" step="0.1" value="0" inputmode="decimal"></div></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="vinyl"> Change the pitch together with the speed (like a record player, "nightcore" or "slowed")</label></div>
  <div class="stats">
    <div class="stat"><span>Original length</span><b id="oldLen">–</b></div>
    <div class="stat"><span>New length</span><b id="newLen">–</b></div>
    <div class="stat"><span>Pitch</span><b id="pitchStat">–</b></div>
  </div>
  <div class="fields">
    <div><label for="from">Preview from (min:sec)</label><input type="text" id="from" value="0:00" inputmode="decimal" autocomplete="off" data-nomemo></div>
    <div><label for="fmt">Save as</label><select id="fmt"><option value="mp3">MP3 (plays everywhere)</option><option value="wav">WAV (best quality, big file)</option></select></div>
    <div id="kbpsBox"><label for="kbps">MP3 quality</label><select id="kbps"><option value="128">128 kbps (small)</option><option value="192" selected>192 kbps (very good)</option><option value="320">320 kbps (best)</option></select></div>
  </div>
  <div class="sp-row">
    <button class="btn ghost" type="button" id="hear">▶ Preview 15 seconds</button>
  </div>
</div>
<div class="meter" id="bar" hidden><i id="fill"></i></div>
<div class="btns"><button class="btn" id="go" disabled>Change and save</button><a class="btn ghost" id="dl" hidden>Download</a></div>
<p class="msg" id="msg"></p>
<audio class="sp-audio" id="result" controls hidden></audio>

    if (actx.resume) actx.resume();
    var s = speed(), len = Math.min(buf.duration - at, 15 * s), a = Math.floor(at * buf.sampleRate), b = Math.floor((at + len) * buf.sampleRate);
    busy = true; $('hear').disabled = true; say('', 'Preparing the preview…');
    dspRun(channels(a, b), buf.sampleRate, s, semis(), $('vinyl').checked).then(function (chs) {
      busy = false; $('hear').disabled = false;
      var ab = actx.createBuffer(chs.length, chs[0].length, buf.sampleRate);
      chs.forEach(function (c, k) { ab.getChannelData(k).set(c); });
      src = actx.createBufferSource(); src.buffer = ab; src.connect(actx.destination); src.start();
      src.onended = function () { src = null; stopHear(); };
      $('hear').textContent = '■ Stop preview'; say('', 'Playing the preview.');
    }, function () { busy = false; $('hear').disabled = false; say('bad', 'The preview could not be made. Your device may be low on memory.'); });
  });

  // ---------- save ----------
  $('go').addEventListener('click', function () {
    if (!buf || busy) return;
    stopHear();
    var s = speed(), st = semis(), vin = $('vinyl').checked, fmt = $('fmt').value, kbps = +$('kbps').value, f = file, t0 = Date.now();
    busy = true; $('go').disabled = true; $('dl').hidden = true; $('result').hidden = true; bar(0);
    say('', 'Changing speed and pitch… 0%');
    dspRun(channels(0, buf.length), buf.sampleRate, s, st, vin, function (p) { bar(p * 0.7); say('', 'Changing speed and pitch… ' + Math.round(p * 100) + '%'); }).then(function (chs) {
      var peak = 0; chs.forEach(function (c) { for (var i = 0; i < c.length; i++) { var v = c[i] < 0 ? -c[i] : c[i]; if (v > peak) peak = v; } });
      if (peak > 0.999) chs.forEach(function (c) { for (var i = 0; i < c.length; i++) c[i] *= 0.999 / peak; }); // no clipping
      if (fmt === 'wav') return wavBlob(chs, buf.sampleRate);
      say('', 'Saving as MP3…');
      return encodeMp3(chs, buf.sampleRate, kbps, function (p) { bar(0.7 + p * 0.3); say('', 'Saving as MP3… ' + Math.round(p * 100) + '%'); });
    }).then(function (blob) {
      if (dlUrl) URL.revokeObjectURL(dlUrl);
      dlUrl = URL.createObjectURL(blob);
      var tag = (vin ? '' : '') + (Math.abs(s - 1) > 1e-3 ? '-' + (Math.round(s * 100) / 100) + 'x' : '') + (!vin && Math.abs(st) > 1e-3 ? '-' + (st > 0 ? 'up' : 'down') + Math.abs(Math.round(st * 10) / 10) : '');
      $('dl').href = dlUrl; $('dl').download = f.name.replace(/\.[^.]+$/, '') + (tag || '-copy') + '.' + fmt; $('dl').hidden = false;
      $('dl').textContent = 'Download ' + fmt.toUpperCase();
      $('result').src = dlUrl; $('result').hidden = false; bar(1);
      say('ok', 'Done: ' + clock(buf.duration / s) + ' long, ' + fmtBytes(blob.size) + ' · took ' + Math.max(1, Math.round((Date.now() - t0) / 1000)) + ' s.');
    }).catch(function (e) {
      bar(null);
      say('bad', e instanceof RangeError ? 'Your device ran out of memory. Try a shorter file or WAV.' : 'Something went wrong while saving. Please try again.');
    }).then(function () { busy = false; $('go').disabled = !buf; });
  });
  refresh();
})();
</script>
