<style>
.rtc .stat b { font-size: clamp(17px, 4.6vw, 22px); overflow-wrap: normal; word-break: normal; }
.rtc fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.rtc legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.rtc .rtc-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 8px; }
.rtc .rtc-head h3 { margin: 0; }
.rtc .stat.rtc-good b { color: var(--ok); } .rtc .stat.rtc-bad b { color: var(--bad); }
.rtc table.sched { min-width: 560px; } .rtc table.sched td, .rtc table.sched th { white-space: nowrap; }
.rtc tr.rtc-ret td { font-weight: 700; }
.fch { position: relative; margin: 16px 0 4px; }
.fch canvas { display: block; width: 100%; height: 240px; touch-action: pan-y; }
.fch-tip { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); margin-top: 6px; min-height: 20px; font-variant-numeric: tabular-nums; }
.fch-tip b { color: var(--ink); }
.fch-tip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
@media (max-width: 480px) { .rtc .stats { grid-template-columns: 1fr 1fr; } .rtc .stat { padding: 10px 12px; } }
</style>
<div class="rtc" id="rtc">
<fieldset>
  <legend>You today</legend>
  <div class="fields">
    <div><label for="rtcCur">Currency</label><select id="rtcCur" data-cur></select></div>
    <div hidden><label for="rtcSym">Your currency symbol</label><input type="text" id="rtcSym" data-cursym maxlength="6" placeholder="e.g. ¥ or KES"></div>
    <div><label for="rtcAge">Current age</label><input type="number" id="rtcAge" min="0" max="110" step="1" inputmode="numeric" value="35"></div>
    <div><label for="rtcRet">Retirement age</label><input type="number" id="rtcRet" min="0" max="110" step="1" inputmode="numeric" value="65"></div>
    <div><label for="rtcEnd">Plan until age</label><input type="number" id="rtcEnd" min="1" max="120" step="1" inputmode="numeric" value="90"></div>
  </div>
  <div class="fields">
    <div><label for="rtcSaved">Savings so far</label><input type="number" id="rtcSaved" min="0" step="any" inputmode="decimal" value="50000"></div>
    <div><label for="rtcMonthly">You add each month</label><input type="number" id="rtcMonthly" min="0" step="any" inputmode="decimal" value="500"></div>
    <div><label for="rtcRaise">Raise your saving each year by (%)</label><input type="number" id="rtcRaise" min="0" max="50" step="any" inputmode="decimal" value="2"></div>
  </div>
</fieldset>
<fieldset>
  <legend>Growth and prices</legend>
  <div class="fields">
    <div><label for="rtcGrow">Return before retiring (% per year)</label><input type="number" id="rtcGrow" step="any" inputmode="decimal" value="6"></div>
    <div><label for="rtcPost">Return after retiring (% per year)</label><input type="number" id="rtcPost" step="any" inputmode="decimal" value="4"></div>
    <div><label for="rtcInfl">Inflation (% per year)</label><input type="number" id="rtcInfl" step="any" inputmode="decimal" value="2.5"></div>
  </div>
</fieldset>
<fieldset>
  <legend>Retirement income</legend>
  <div class="fields">
    <div><label for="rtcIncome">Income you want per year (today's money)</label><input type="number" id="rtcIncome" min="0" step="any" inputmode="decimal" value="40000"></div>
    <div><label for="rtcOther">Pension or other income per year (today's money)</label><input type="number" id="rtcOther" min="0" step="any" inputmode="decimal" value="0"></div>
    <div><label for="rtcWd">Safe withdrawal rate (%)</label><input type="number" id="rtcWd" min="0.5" max="20" step="any" inputmode="decimal" value="4"></div>
  </div>
</fieldset>
<div class="stats">
  <div class="stat"><span>Savings needed at retirement (today's money)</span><b id="rtcNeed">–</b></div>
  <div class="stat"><span>You are on track for (today's money)</span><b id="rtcHave">–</b></div>
  <div class="stat" id="rtcGapBox"><span>Shortfall</span><b id="rtcGap">–</b></div>
  <div class="stat"><span>Extra to save each month</span><b id="rtcExtra">–</b></div>
  <div class="stat"><span>Years until retirement</span><b id="rtcYears">–</b></div>
  <div class="stat"><span>Your money lasts until age</span><b id="rtcLast">–</b></div>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="rtc-head"><h3>Savings by age</h3>
  <div class="seg" role="group" aria-label="Show amounts in"><button type="button" data-v="real" aria-pressed="true">Today's money</button><button type="button" data-v="nom" aria-pressed="false">Future money</button></div>
</div>
<div class="fch"><canvas id="rtcChart" role="img" aria-label="Line chart of your savings balance by age"></canvas><div class="fch-tip" id="rtcTip" aria-live="off"></div></div>
<div class="rtc-head"><h3>Year by year</h3></div>
<div class="scroll-x"><table class="sched"><thead><tr><th>Age</th><th>Added</th><th>Growth</th><th>Withdrawn</th><th>Balance</th><th>In today's money</th></tr></thead><tbody id="rtcRows"></tbody></table></div>
<div class="btns"><button type="button" class="btn ghost" id="rtcCsv">Download table (CSV)</button><button type="button" class="btn ghost" id="rtcCopy">Copy summary</button></div>
<a id="dl" hidden></a>
</div>

    $('rtcLast').textContent = p.draw === 0 ? 'No withdrawals' : p.lastAge == null ? o.end + '+' : String(Math.floor(p.lastAge));
    var notes = [];
    if (p.draw === 0) notes.push('Your pension or other income covers the income you want, so you do not need to draw on savings.');
    else if (p.lastAge != null) notes.push('At these numbers your savings run out at about age ' + Math.floor(p.lastAge) + ', before age ' + o.end + '.');
    else notes.push('At these numbers your savings last past age ' + o.end + '.');
    if (short && p.n > 0) notes.push('To reach the target, save about ' + money(p.extra) + ' more each month (in future money, at ' + o.grow + '% a year).');
    if (o.wd > 5) notes.push('A withdrawal rate above 5% is optimistic; savings may not last.');
    say(p.lastAge != null && p.draw > 0 ? 'bad' : 'ok', notes.join(' '));
    table(); draw();
  }
  function table() {
    if (!last) return;
    var ret = last.o.ret;
    $('rtcRows').innerHTML = last.p.rows.map(function (r) {
      return '<tr' + (r.age === ret ? ' class="rtc-ret"' : '') + '><td>' + r.age + (r.age === ret ? ' (retire)' : '') + '</td><td>' + (r.add ? money(r.add, 0) : '–') + '</td><td>' + money(r.growth, 0) + '</td><td>' + (r.wd ? money(r.wd, 0) : '–') + '</td><td>' + money(r.bal, 0) + '</td><td>' + money(r.real, 0) + '</td></tr>';
    }).join('');
  }
  function draw() {
    if (!last) return;
    var rows = [{ age: last.o.age, bal: last.o.saved, real: last.o.saved }].concat(last.p.rows);
    chart.set({ type: 'line', labels: rows.map(function (r) { return String(r.age); }), fmt: function (v) { return money(v, 0); },
      series: [{ name: view === 'real' ? "Balance (today's money)" : 'Balance (future money)', color: cssv('--accent', '#2563eb'), fill: true, data: rows.map(function (r) { return view === 'real' ? r.real : r.bal; }) }] });
  }
  document.querySelectorAll('.rtc .seg button').forEach(function (b) {
    b.addEventListener('click', function () { view = b.dataset.v; document.querySelectorAll('.rtc .seg button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); draw(); });
  });
  $('rtcCsv').addEventListener('click', function () {
    if (!last) return say('bad', 'Fix the numbers above first.');
    var lines = ['Age,Added,Growth,Withdrawn,Balance,In todays money'];
    last.p.rows.forEach(function (r) { lines.push([r.age, r.add.toFixed(2), r.growth.toFixed(2), r.wd.toFixed(2), r.bal.toFixed(2), r.real.toFixed(2)].join(',')); });
    var a = $('dl'); if (a.href) URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/csv' })); a.download = 'retirement-plan.csv'; a.click();
    say('ok', 'Saved retirement-plan.csv with ' + last.p.rows.length + ' rows.');
  });
  $('rtcCopy').addEventListener('click', function () {
    if (!last) return say('bad', 'Fix the numbers above first.');
    var p = last.p, o = last.o;
    copyText('Retirement plan (today\'s money)\nRetire at ' + o.ret + ' in ' + p.n + ' years\nSavings needed: ' + money(p.needReal, 0) + '\nOn track for: ' + money(p.atRetReal, 0) +
      '\n' + (p.gapReal > 0.5 ? 'Shortfall: ' + money(p.gapReal, 0) + '\nExtra to save each month: ' + money(p.extra) : 'Surplus: ' + money(-p.gapReal, 0)) +
      '\nMoney lasts until age: ' + $('rtcLast').textContent, this);
  });
  $('rtc').addEventListener('input', function (e) { if (e.target.tagName !== 'SELECT') calc(); });
  curWire(calc);
  calc();
})();
</script>
