<div class="fields">
  <div><label for="price">Original price</label><input type="number" id="price" min="0" step="any" placeholder="80"></div>
  <div><label for="off">Discount (%)</label><input type="number" id="off" min="0" max="100" step="any" placeholder="25"></div>
  <div><label for="tax">Sales tax (%, optional)</label><input type="number" id="tax" min="0" step="any" placeholder="0"></div>
</div>
<div class="stats">
  <div class="stat"><span>You save</span><b id="save">–</b></div>
  <div class="stat"><span>Price after discount</span><b id="sale">–</b></div>
  <div class="stat"><span>Final price with tax</span><b id="final">–</b></div>
</div>
<p class="msg" id="msg"></p>
<script>
(function () {
  function calc() {
    var p = +$('price').value, off = +$('off').value, tax = Math.max(0, +$('tax').value);
    if (!(p > 0) || $('off').value === '') { ['save', 'sale', 'final'].forEach(function (i) { $(i).textContent = '–'; }); $('msg').textContent = ''; return; }
    if (off < 0 || off > 100) { ['save', 'sale', 'final'].forEach(function (i) { $(i).textContent = '–'; }); $('msg').className = 'msg bad'; $('msg').textContent = 'The discount must be between 0 and 100 percent.'; return; }
    $('msg').textContent = '';
    var save = p * off / 100, sale = p - save;
    $('save').textContent = fmtNum(save, 2);
    $('sale').textContent = fmtNum(sale, 2);
    $('final').textContent = fmtNum(sale * (1 + tax / 100), 2);
  }
  ['price', 'off', 'tax'].forEach(function (id) { $(id).addEventListener('input', calc); });
})();
</script>
