<style>
.skc { --k1: #4338ca; --k2: #e0e7ff; --k3: #eef2ff; --k4: #f59e0b; }
.skc h3 { font-size: 17px; margin: 22px 0 8px; }
.skc .skc-kids { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.skc .skc-kid { font: inherit; font-weight: 700; min-height: 44px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
.skc .skc-kid span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
.skc .skc-kid small { font-weight: 600; color: var(--muted); }
.skc .skc-kid[aria-pressed="true"] { border-color: var(--k1); background: var(--k3); color: var(--k1); }
.skc .skc-kid.add { border-style: dashed; color: var(--muted); }
.skc .skc-board { background: var(--k3); border: 3px solid var(--k1); border-radius: 18px; padding: 12px; color: #1f2937; }
.skc .skc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
.skc .skc-title { font-size: 21px; font-weight: 800; color: var(--k1); margin: 0; overflow-wrap: anywhere; min-width: 0; }
.skc .skc-deco { font-size: 24px; letter-spacing: 2px; }
.skc .skc-week { font-size: 13.5px; color: #4b5563; margin: 0 0 8px; }
.skc .skc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
.skc table.skc-t { border-collapse: separate; border-spacing: 3px; width: 100%; table-layout: fixed; }
.skc .skc-t th { font-size: 12.5px; font-weight: 700; color: #fff; background: var(--k1); border-radius: 8px; padding: 5px 0; text-align: center; }
.skc .skc-t th.today { background: var(--k4); color: #111; }
.skc .skc-t th.tk { width: 34%; text-align: start; padding: 5px 8px; }
.skc .skc-t td.tk { background: #fff; border-radius: 8px; padding: 4px 6px; font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; line-height: 1.2; }
.skc .skc-t td.tk i { font-style: normal; font-size: 19px; margin-inline-end: 4px; vertical-align: -2px; }
.skc .skc-t td.c { padding: 0; }
.skc .skc-t button.cell { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 100%; min-height: 42px; border-radius: 9px; background: #fff; border: 2px solid var(--k2); cursor: pointer; font-size: 22px; line-height: 1; touch-action: manipulation; }
.skc .skc-t button.cell.today { border-color: var(--k4); }
.skc .skc-t button.cell[aria-pressed="true"] { background: var(--k2); border-color: var(--k1); }
.skc .skc-t button.cell[aria-pressed="true"] span { animation: skcPop .35s ease-out; }
.skc .skc-t button.cell:focus-visible { outline: 3px solid var(--k4); outline-offset: 1px; }
.skc .skc-t .off { display: grid; place-items: center; min-height: 42px; border-radius: 9px; background: rgba(255,255,255,.45); color: #9ca3af; font-size: 14px; }
@keyframes skcPop { 0% { transform: scale(.2) rotate(-30deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .skc .skc-t button.cell[aria-pressed="true"] span { animation: none; } }
@media (max-width: 480px) { .skc .skc-board { padding: 8px; } .skc .skc-t th.tk { width: 30%; } .skc .skc-t td.tk { font-size: 12px; padding: 3px 4px; } .skc .skc-t td.tk i { display: block; font-size: 17px; margin: 0; } .skc .skc-t button.cell { font-size: 18px; min-height: 40px; } .skc .skc-t th { font-size: 11px; } }
.skc .skc-goal { margin: 10px 0 0; background: #fff; border-radius: 12px; padding: 10px 12px; }
.skc .skc-goal p { margin: 0 0 6px; font-weight: 700; font-size: 15.5px; overflow-wrap: anywhere; }
.skc .skc-bar { height: 16px; background: var(--k2); border-radius: 999px; overflow: hidden; }
.skc .skc-bar i { display: block; height: 100%; width: 0; background: var(--k4); border-radius: 999px; transition: width .4s; }
.skc .skc-dots { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0 0; font-size: 18px; line-height: 1.1; }
.skc .skc-dots span.e { opacity: .25; filter: grayscale(1); }
.skc .skc-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.skc .skc-row > div { flex: 1 1 150px; min-width: 0; }
.skc .skc-row input, .skc .skc-row select { width: 100%; box-sizing: border-box; min-width: 0; }
.skc .skc-row .narrow { flex: 0 1 110px; }
.skc .skc-tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.skc .skc-tasks li { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--surface); }
.skc .skc-tl { display: flex; gap: 6px; align-items: center; }
.skc .skc-tl input[type=text] { flex: 1 1 auto; min-width: 0; }
.skc .skc-ic { font: inherit; font-size: 22px; width: 44px; height: 44px; flex: 0 0 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; padding: 0; }
.skc .skc-sm { font: inherit; width: 36px; height: 40px; flex: 0 0 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; padding: 0; font-size: 15px; }
.skc .skc-sm:hover { color: var(--accent); border-color: var(--accent); }
.skc .skc-sm.del:hover { color: var(--bad); border-color: var(--bad); }
.skc .skc-days { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; }
.skc .skc-days button { font: inherit; font-size: 12.5px; font-weight: 600; min-width: 40px; min-height: 34px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.skc .skc-days button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.skc .skc-pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin: 6px 0 0; background: var(--bg); }
.skc .skc-pal button { font: inherit; font-size: 22px; height: 44px; border: 0; border-radius: 8px; background: var(--surface); cursor: pointer; padding: 0; }
.skc .skc-pal button:hover { outline: 2px solid var(--accent); }
.skc .skc-pre { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.skc .skc-pre button { font: inherit; font-size: 13.5px; min-height: 36px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.skc .skc-pre button:hover { border-color: var(--accent); color: var(--accent); }
.skc .skc-hist { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.skc .skc-hist table { border-collapse: collapse; width: 100%; font-size: 14px; }
.skc .skc-hist th, .skc .skc-hist td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: start; }
.skc .skc-hist td.n { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.skc .skc-hint { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; }
.skc fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin: 14px 0 0; min-width: 0; }
.skc legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.skc .skc-prev { margin: 10px 0 0; text-align: center; }
.skc .skc-prev canvas { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); background: #fff; }
.skc-party { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: rgba(15, 23, 42, .55); padding: 16px; }
.skc-party .box { background: #fff; color: #111827; border-radius: 22px; padding: 22px 20px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: skcIn .45s cubic-bezier(.2,.9,.3,1.4); }
.skc-party .big { font-size: 64px; line-height: 1.1; }
.skc-party h2 { margin: 8px 0 6px; font-size: 24px; overflow-wrap: anywhere; }
.skc-party p { margin: 0 0 14px; font-size: 17px; overflow-wrap: anywhere; }
.skc-party i { position: fixed; top: -20px; width: 10px; height: 16px; border-radius: 3px; pointer-events: none; }
@keyframes skcIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .skc-party .box { animation: none; } .skc-party i { display: none; } }
#skcPrint { display: none; }
@media print {
  @page { margin: 0; }
  body > *:not(#skcPrint) { display: none !important; }
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  #skcPrint { display: block !important; }
  #skcPrint img { display: block; width: 100%; height: 100vh; object-fit: contain; break-after: page; page-break-after: always; }
  #skcPrint img:last-child { break-after: auto; page-break-after: auto; }
}
</style>

<div class="skc" id="skc">
  <div class="skc-kids" id="skKids" role="group" aria-label="Children"></div>

  <div class="skc-board" id="skBoard">
    <div class="skc-head"><p class="skc-title" id="skTitle"></p><span class="skc-deco" id="skDeco" aria-hidden="true"></span></div>
    <p class="skc-week" id="skWeek"></p>
    <div class="skc-scroll"><table class="skc-t" id="skT"></table></div>
    <div class="skc-goal" aria-live="polite"><p id="skGoalTxt"></p><div class="skc-bar"><i id="skBar"></i></div><div class="skc-dots" id="skDots" aria-hidden="true"></div></div>
  </div>
  <p class="skc-hint">Tap a box to give a star. Tap it again to take it back.</p>
  <p class="msg" id="skMsg" role="status" aria-live="polite"></p>

  <h3>Child and reward</h3>
  <div class="skc-row">
    <div><label for="skName">Child's name</label><input type="text" id="skName" data-nomemo maxlength="40" placeholder="e.g. Mia"></div>
    <div class="narrow"><label for="skGoal">Stars needed</label><input type="number" id="skGoal" data-nomemo min="1" max="100" step="1" inputmode="numeric"></div>
    <div><label for="skReward">Reward</label><input type="text" id="skReward" data-nomemo maxlength="60" placeholder="e.g. Trip to the park"></div>
  </div>
  <div class="skc-row" style="margin-top:10px">
    <div><label for="skTheme">Theme</label><select id="skTheme" data-nomemo></select></div>
    <div><label for="skStamp">Stamp</label><select id="skStamp" data-nomemo></select></div>
    <div><label for="skWs">Week starts on</label><select id="skWs" data-nomemo></select></div>
  </div>
  <div class="btns">
    <button type="button" class="btn ghost" id="skNewWeek">Start a new week now</button>
    <button type="button" class="btn ghost" id="skClearWeek">Clear this week's stars</button>
    <button type="button" class="btn ghost danger" id="skDelKid">Remove this child</button>
  </div>

  <h3>Tasks and habits</h3>
  <ul class="skc-tasks" id="skTasks"></ul>
  <div class="skc-tl" style="margin-top:10px">
    <button type="button" class="skc-ic" id="skNewIc" aria-label="Choose an icon for the new task">⭐</button>
    <input type="text" id="skNewT" data-nomemo maxlength="40" placeholder="Add a task, e.g. Feed the cat" aria-label="New task">
    <button type="button" class="btn" id="skAdd">Add</button>
  </div>
  <div id="skPalBox"></div>
  <p class="skc-hint" style="margin-top:10px">Ideas (tap to add):</p>
  <div class="skc-pre" id="skPre"></div>
  <div class="btns"><button type="button" class="btn ghost" id="skCopyAll">Copy these tasks to every child</button></div>

  <h3>Past weeks</h3>
  <div id="skHist"></div>

  <fieldset><legend>Printable chart (PDF)</legend>
    <div class="skc-row">
      <div><label for="skPaper">Paper</label><select id="skPaper" data-nomemo><option value="a4">A4</option><option value="letter">Letter</option></select></div>
      <div><label for="skOrient">Direction</label><select id="skOrient" data-nomemo><option value="landscape">Landscape (wide)</option><option value="portrait">Portrait (tall)</option></select></div>
      <div><label for="skWho">Children</label><select id="skWho" data-nomemo><option value="one">This child</option><option value="all">Every child (one page each)</option></select></div>
    </div>
    <div class="skc-row" style="margin-top:10px">
      <div><label for="skFill">Boxes</label><select id="skFill" data-nomemo><option value="blank">Empty, to fill in by hand</option><option value="stars">With this week's stars</option></select></div>
      <div><label for="skDates">Dates</label><select id="skDates" data-nomemo><option value="week">Show this week's dates</option><option value="line">A line to write the week</option></select></div>
    </div>
    <div class="btns">
      <button type="button" class="btn" id="skPdf">Download PDF</button>
      <button type="button" class="btn ghost" id="skPrint">Print</button>
      <button type="button" class="btn ghost" id="skPrevB" aria-expanded="false">Show preview</button>
    </div>
    <div class="skc-prev" id="skPrev" hidden><canvas id="skCv" width="10" height="10" aria-label="Preview of the printable chart"></canvas></div>
  </fieldset>

  <h3>Back up</h3>
  <div class="btns" style="margin-top:0">
    <button type="button" class="btn ghost" id="skExport">Back up (JSON)</button>
    <button type="button" class="btn ghost" id="skCsv">Download history (CSV)</button>
    <button type="button" class="btn ghost" id="skImportB">Restore a backup</button>
    <input type="file" id="skFile" accept=".json,application/json" hidden data-nomemo>
  </div>
  <p class="skc-hint">Everything is saved only in this browser on this device. Nothing is uploaded. Make a backup to move it to another device.</p>
</div>
<div id="skcPrint"></div>

    busy = false; btn.disabled = false;
  });
  function render(k, scale) { var P = pageSize(), c = document.createElement('canvas'); c.width = Math.round(P[0] * scale); c.height = Math.round(P[1] * scale); GD.drawCanvas(chartOps(k, P[0], P[1], $('skFill').value, $('skDates').value), c.getContext('2d'), scale); return c; }
  $('skPrint').addEventListener('click', async function () {
    if (busy) return; busy = true; say('', 'Getting the chart ready to print…');
    try {
      await fontsReady();
      var box = $('skcPrint'); if (box.parentNode !== document.body) document.body.appendChild(box); var P = pageSize(), list = kidsToPrint(); box.innerHTML = '';
      var st = document.getElementById('skcPage') || document.head.appendChild(el('style')); st.id = 'skcPage';
      st.textContent = '@media print { @page { size: ' + ($('skPaper').value === 'letter' ? 'letter' : 'A4') + ' ' + $('skOrient').value + '; margin: 0; } }';
      for (var i = 0; i < list.length; i++) { var c = render(list[i], 2.5), img = new Image(); img.alt = titleOf(list[i]); img.src = c.toDataURL('image/png'); box.appendChild(img); await img.decode().catch(function () {}); }
      var done = function () { box.innerHTML = ''; window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done);
      window.print();
      say('ok', 'To make a PDF instead, choose "Save as PDF" in the print window, or use Download PDF.');
    } catch (e) { say('bad', 'Could not get the chart ready to print. ' + (e && e.message ? e.message : '')); }
    busy = false;
  });
  var prevT = null;
  function schedulePreview() { if ($('skPrev').hidden) return; clearTimeout(prevT); prevT = setTimeout(drawPreview, 250); }
  async function drawPreview() {
    try { await fontsReady(); } catch (e) {}
    var P = pageSize(), cv = $('skCv'), k = kidsToPrint()[0], sc = Math.min(2, (window.devicePixelRatio || 1) * Math.min(1, 560 / P[0]));
    cv.width = Math.round(P[0] * sc); cv.height = Math.round(P[1] * sc); cv.style.width = Math.min(560, P[0]) + 'px';
    GD.drawCanvas(chartOps(k, P[0], P[1], $('skFill').value, $('skDates').value), cv.getContext('2d'), sc);
  }
  $('skPrevB').addEventListener('click', function () { var h = !$('skPrev').hidden; $('skPrev').hidden = h; this.textContent = h ? 'Show preview' : 'Hide preview'; this.setAttribute('aria-expanded', String(!h)); if (!h) drawPreview(); });
  ['skPaper', 'skOrient', 'skWho', 'skFill', 'skDates'].forEach(function (id) { $(id).addEventListener('change', function () { try { localStorage.setItem(KEY + '-print', JSON.stringify({ p: $('skPaper').value, o: $('skOrient').value, w: $('skWho').value, f: $('skFill').value, d: $('skDates').value })); } catch (e) {} schedulePreview(); }); });

  // ---------- backup ----------
  $('skExport').addEventListener('click', function () { GD.download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), 'star-chart-backup-' + iso(new Date()) + '.json'); say('ok', 'Backup saved. Keep the file safe; use Restore a backup to load it again.'); });
  $('skCsv').addEventListener('click', function () {
    function q(v) { v = String(v == null ? '' : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = [['Child', 'Week starting', 'Stars', 'Goal', 'Goal reached', 'Reward']];
    S.kids.forEach(function (k) { k.hist.forEach(function (h) { rows.push([nameOf(k), h.wk, h.stars, h.goal, h.stars >= h.goal ? 'yes' : 'no', h.reward]); }); rows.push([nameOf(k), (k.wk || '') + ' (this week)', stars(k), k.goal, stars(k) >= k.goal ? 'yes' : 'no', k.reward]); });
    GD.download(new Blob(['﻿' + rows.map(function (r) { return r.map(q).join(','); }).join('\r\n')], { type: 'text/csv' }), 'star-chart-history.csv'); say('ok', 'History saved as a CSV file. It opens in any spreadsheet.');
  });
  $('skImportB').addEventListener('click', function () { $('skFile').value = ''; $('skFile').click(); });
  $('skFile').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    if (f.size > 5e6) return say('bad', 'That file is too big to be a star chart backup.');
    f.text().then(function (t) {
      var d = null; try { d = cleanAll(JSON.parse(t)); } catch (e) {}
      if (!d) return say('bad', '"' + f.name + '" is not a star chart backup. Choose a file saved with "Back up (JSON)".');
      if (!confirm('Replace the ' + S.kids.length + ' chart' + (S.kids.length > 1 ? 's' : '') + ' in this browser with the ' + d.kids.length + ' in the backup?')) return;
      S = d; rollover(); save(); palFor = null; renderAll(); say('ok', 'Backup restored: ' + S.kids.length + ' child' + (S.kids.length > 1 ? 'ren' : '') + '.');
    }, function () { say('bad', 'That file could not be read.'); });
  });

  // ---------- start ----------
  Object.keys(THEMES).forEach(function (k) { var o = el('option', '', THEMES[k][0] + (THEMES[k][5][0] ? ' ' + THEMES[k][5][0] : '')); o.value = k; $('skTheme').appendChild(o); });
  STAMPS.forEach(function (s) { var o = el('option', '', s[0] + ' ' + s[1]); o.value = s[0]; $('skStamp').appendChild(o); });
  for (var i = 0; i < 7; i++) { var o = el('option', '', cap(dayName(i, true))); o.value = String(i); $('skWs').appendChild(o); }
  $('skPaper').value = UT.letter() ? 'letter' : 'a4';
  try { var pp = JSON.parse(localStorage.getItem(KEY + '-print') || 'null'); if (pp) { [['skPaper', pp.p], ['skOrient', pp.o], ['skWho', pp.w], ['skFill', pp.f], ['skDates', pp.d]].forEach(function (x) { var s = $(x[0]); if ([].some.call(s.options, function (o) { return o.value === x[1]; })) s.value = x[1]; }); } } catch (e) {}
  S = load();
  S.kids.forEach(function (k) { if (!STAMPS.some(function (s) { return s[0] === k.stamp; })) { var o = el('option', '', k.stamp); o.value = k.stamp; $('skStamp').appendChild(o); } });
  rollover(); renderAll();
  // a new week can begin while the page is open (or when the phone wakes up)
  function check() { if (rollover()) { renderAll(); say('ok', 'A new week has started. Last week is in Past weeks.'); } }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 60000);
  window.addEventListener('storage', function (e) { if (e.key === KEY) { S = load(); rollover(); renderAll(); } });
})();
</script>
