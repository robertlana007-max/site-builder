<style>
.vt-info { margin: -4px 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.vt-info b { color: var(--ink); }
.vt-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 14px; }
.vt-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s; }
.vt-video { display: block; width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); background: #000; margin: 14px 0 4px; }
.vt-hint { font-size: 14px; color: var(--muted); margin: -8px 0 14px; }
</style>
<style>
.aw-prev { display: block; max-width: 100%; height: auto; margin: 4px auto 8px; border-radius: 10px; border: 1px solid var(--line); background: #000; }
.aw-ctl { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; justify-content: center; }
.aw-ctl .btn { flex: 0 1 220px; }
.aw-img { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
.aw-img .btn { flex: 0 0 auto; }
.aw-img span { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; flex: 1 1 160px; }
.aw-range { display: flex; align-items: center; gap: 10px; }
.aw-range input { flex: 1; min-width: 0; accent-color: var(--accent); }
.aw-range output { min-width: 3em; text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }
.aw-sec { margin: 4px 0 8px; font-size: 16px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a song, podcast or voice recording</b>MP3, M4A, WAV, OGG or FLAC. Nothing is uploaded.</div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.mp4,.webm" hidden data-nomemo>
<p class="vt-info" id="info"></p>
<div id="editor" hidden>
  <canvas class="aw-prev" id="prev" width="640" height="360" aria-label="Preview of the video"></canvas>
  <div class="aw-ctl"><button class="btn ghost" type="button" id="hear">▶ Play preview</button></div>
  <audio id="song" preload="auto" hidden></audio>
  <h3 class="aw-sec">Size and picture</h3>
  <div class="fields">
    <div><label for="size">Video size</label><select id="size"><option value="1280x720">YouTube 720p (1280 × 720)</option><option value="1920x1080">YouTube 1080p (1920 × 1080)</option><option value="1080x1080">Instagram square (1080 × 1080)</option><option value="1080x1350">Instagram portrait 4:5 (1080 × 1350)</option><option value="1080x1920">Reels, Stories, TikTok, Shorts (1080 × 1920)</option></select></div>
    <div><label for="bg">Background</label><select id="bg"><option value="grad">Colour gradient</option><option value="color">Plain colour</option><option value="image">My picture</option></select></div>
    <div><label for="c1">Colour 1</label><input type="color" id="c1" value="#1e1b4b"></div>
    <div id="c2Box"><label for="c2">Colour 2</label><input type="color" id="c2" value="#7c3aed"></div>
  </div>
  <div class="aw-img" id="imgBox" hidden><button class="btn ghost" type="button" id="imgBtn">Choose a picture</button><span id="imgName">JPG, PNG or WebP. It fills the frame; the edges are filled with a blurred copy if the shape differs.</span><input type="file" id="img" accept="image/*" hidden data-nomemo></div>
  <h3 class="aw-sec">Waveform</h3>
  <div class="fields">
    <div><label for="style">Style</label><select id="style"><option value="cline">Smooth wave</option><option value="p2p">Filled wave</option><option value="bars">Frequency bars</option><option value="point">Dots</option></select></div>
    <div><label for="wc">Colour</label><input type="color" id="wc" value="#ffffff"></div>
    <div><label for="wpos">Position</label><select id="wpos"><option value="0.5">Middle</option><option value="0.78" selected>Lower part</option><option value="0.25">Upper part</option></select></div>
    <div><label for="wh">Height</label><div class="aw-range"><input type="range" id="wh" min="10" max="60" step="1" value="28"><output id="whOut">28%</output></div></div>
  </div>
  <h3 class="aw-sec">Text</h3>
  <div class="fields">
    <div><label for="title">Title</label><input type="text" id="title" data-nomemo placeholder="Song or episode name" maxlength="120"></div>
    <div><label for="sub">Second line</label><input type="text" id="sub" data-nomemo placeholder="Artist, show or website" maxlength="160"></div>
    <div><label for="tc">Text colour</label><input type="color" id="tc" value="#ffffff"></div>
    <div><label for="tpos">Text position</label><select id="tpos"><option value="0.32">Above the middle</option><option value="0.12">Top</option><option value="0.5">Middle</option><option value="0.9">Bottom</option></select></div>
  </div>
  <h3 class="aw-sec">Length</h3>
  <div class="fields">
    <div><label for="start">From (min:sec)</label><input type="text" id="start" value="0:00" inputmode="decimal" autocomplete="off" data-nomemo></div>
    <div><label for="end">To (min:sec)</label><input type="text" id="end" value="0:00" inputmode="decimal" autocomplete="off" data-nomemo></div>
    <div><label for="fps">Smoothness</label><select id="fps"><option value="25">25 frames a second</option><option value="30">30 frames a second</option><option value="15">15 frames a second (fastest)</option></select></div>
  </div>
  <p class="vt-hint" id="hint"></p>
</div>
<div class="vt-bar" id="bar" hidden><i id="barFill"></i></div>

<script>
// Video engine loader (ffmpeg.wasm, single-thread build, no special server headers needed).
// The same copy is used by every video tool. Nothing is downloaded until a video is chosen.
var FF = (function () {
  var BASE = '../assets/vendor/ffmpeg/', WASM_BYTES = 32232419, MAX = 1024 * 1024 * 1024;

  function fetchWasm(say) {

          if (/Invalid data|moov atom|EBML|could not find|No such file/i.test(t) || !d) throw new Error('"' + file.name + '" could not be read as a video. It may be damaged or in an unsupported format.');

      }, function (e) { onLog = null; throw e; });

  // by the caller); outName is the output file. total is the expected output length in seconds.
  // file may also be an array of files: build then gets an array of paths. prep(f, paths), if given,

      }, Promise.resolve()).then(function () {
        var paths = inps.map(function (i) { return i.path; });

          return f.exec(['-hide_banner', '-nostdin', '-y'].concat(build(many ? paths : paths[0]), [out]));
        });
      }).then(function (code) {
        return Promise.all(inps.map(function (i) { return unmountIn(f, i); })).then(function () { return code; });
      }).then(function (code) {
        onLog = null;
        if (code !== 0) { f.deleteFile(out).catch(function () {}); throw new Error(reason()); }

          f.deleteFile(out).catch(function () {});

        });
      }, function (e) {
        onLog = null;

      });
    });

  function cancel() { if (ff) { try { ff.terminate(); } catch (e) {} ff = null; } onLog = null; }

  return { get: get, check: check, probe: probe, run: run, cancel: cancel, secs: secs };
})();

// Page helpers shared by the video tools. Expect #drop #file #info #go #stop #bar #barFill #dl #msg.
var VT = (function () {
  var lastUrl = null, busy = false, cancelled = false;
  function say(cls, t) { var m = $('msg'); m.className = 'msg ' + (cls || ''); m.textContent = t || ''; }
  function bar(p) { $('bar').hidden = p == null; if (p != null) $('barFill').style.width = Math.round(p * 100) + '%'; }
  function clock(s) {
    s = Math.round(Math.max(0, s) * 10) / 10; var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;

  }
  function base(name) { return name.replace(/\.[^.]+$/, '') || 'video'; }
  function showInfo(file, i) {
    var el = $('info'); el.textContent = '';
    var b = document.createElement('b'); b.textContent = file.name; el.appendChild(b);
    el.appendChild(document.createTextNode(' · ' + fmtBytes(file.size) + ' · ' + clock(i.duration) + ' · ' + i.width + ' × ' + i.height + (i.audio ? ' · with sound' : ' · no sound')));
  }
  // Wire the drop zone. onReady(file, info) runs once the video has been checked and read.
  function pick(onReset, onReady) {
    var ticket = 0;
    setupDrop('drop', 'file', function (file) {
      $('file').value = '';
      if (busy) { say('bad', 'Please wait for the current video to finish, or press Cancel.'); return; }
      var mine = ++ticket;
      onReset(); $('go').disabled = true; $('dl').hidden = true; $('info').textContent = ''; bar(null);
      var bad = FF.check(file);
      if (bad) { say('bad', bad); return; }

      FF.probe(file, say).then(function (info) {
        busy = false;
        if (mine !== ticket) return;
        showInfo(file, info); say('', ''); onReady(file, info); $('go').disabled = false;
      }, function (e) { busy = false; if (mine === ticket) say('bad', e.message); });
    });
    $('stop').addEventListener('click', function () { if (!busy) return; cancelled = true; FF.cancel(); });
    Array.prototype.forEach.call(document.querySelectorAll('.card input:not([type=file]), .card select'), function (el) {
      el.addEventListener('input', function () { if (!busy) $('dl').hidden = true; });
    });

  function go(label, job) {

  // Show the finished file on #dl. Returns the object URL.
  function done(data, name, mime) {

  }

})();
(function () {
  var file = null, info = null, surl = null, img = null, busy = false, ticket = 0, S = $('song'), cv = $('prev'), actx = null, an = null, srcNode = null, raf = 0;
  function parse(s) {

    });
  });

  // ---------- opening the audio ----------
  setupDrop('drop', 'file', function (f) {

    if (!file || busy) return;
    var r = range(); if (r.err) { VT.say('bad', r.err); return; }

    var d = dims(), W = d.W, H = d.H, fps = +$('fps').value, len = r.b - r.a, b = waveBox(W, H), st = $('style').value, col = '0x' + $('wc').value.slice(1), f = file;
