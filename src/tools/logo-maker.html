<style>
.lgm fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.lgm legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.lgm .lgm-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; margin-bottom: 14px; }
.lgm .lgm-icons button { height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 0; display: grid; place-items: center; font: inherit; font-size: 12px; font-weight: 700; }
.lgm .lgm-icons button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lgm .lgm-icons button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.lgm .lgm-pal { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.lgm .lgm-pal button { width: 44px; height: 32px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; padding: 0; overflow: hidden; display: flex; }
.lgm .lgm-pal button i { flex: 1; }
.lgm .lgm-pal button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.lgm input[type=color] { width: 100%; max-width: 120px; height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); }
.lgm .lgm-prev { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; place-items: center; min-height: 220px; background-color: #fff; background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1f5f9 75%), linear-gradient(-45deg, transparent 75%, #f1f5f9 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
.lgm .lgm-prev svg { max-width: 100%; max-height: 360px; width: auto; height: auto; display: block; }
.lgm .lgm-hint { display: block; font-size: 13px; color: var(--muted); margin: 6px 0 12px; }
</style>
<div class="lgm" id="lgm">
<fieldset><legend>Words</legend>
  <div class="fields">
    <div><label for="lgName">Name</label><input type="text" id="lgName" data-nomemo maxlength="30" placeholder="e.g. Green Valley"></div>
    <div><label for="lgTag">Tagline (optional)</label><input type="text" id="lgTag" data-nomemo maxlength="50" placeholder="e.g. Fresh from the farm"></div>
  </div>
  <div class="fields">
    <div><label for="lgFont">Font</label><select id="lgFont"></select></div>
    <div><label for="lgCase">Letters</label><select id="lgCase"><option value="asis">As typed</option><option value="upper">CAPITALS</option></select></div>
    <div><label for="lgSpace">Letter spacing</label><select id="lgSpace"><option value="0">Normal</option><option value="0.06">Wide</option><option value="0.16">Extra wide</option><option value="-0.02">Tight</option></select></div>
  </div>
</fieldset>
<fieldset><legend>Icon</legend>
  <div class="lgm-icons" id="lgIcons" role="group" aria-label="Icon"></div>
  <div class="fields">
    <div><label for="lgShape">Shape behind the icon</label><select id="lgShape"><option value="circle">Circle</option><option value="rounded">Rounded square</option><option value="hex">Hexagon</option><option value="ring">Outline circle</option><option value="none">None</option></select></div>
    <div><label for="lgLayout">Layout</label><select id="lgLayout"><option value="left">Icon beside the name</option><option value="top">Icon above the name</option><option value="badge">Badge (all in a circle)</option></select></div>
  </div>
</fieldset>
<fieldset><legend>Colours</legend>
  <div class="lgm-pal" id="lgPal" role="group" aria-label="Colour sets"></div>
  <div class="fields">
    <div><label for="lgC1">Main colour</label><input type="color" id="lgC1" value="#16a34a"></div>
    <div><label for="lgC2">Text colour</label><input type="color" id="lgC2" value="#14532d"></div>
    <div><label for="lgBg">Background</label><select id="lgBg"><option value="none">Transparent</option><option value="white">White</option><option value="tint">Light tint</option><option value="dark">Dark</option></select></div>
  </div>
</fieldset>
<div class="lgm-prev" id="lgPrev" aria-label="Logo preview"></div>
<span class="lgm-hint">Check that your logo is not too close to a trademark someone else already uses.</span>
<div class="fields">
  <div><label for="lgSize">PNG size</label><select id="lgSize"><option value="512">512 px wide</option><option value="1024" selected>1024 px wide</option><option value="2048">2048 px wide</option></select></div>
  <div><label for="lgSquare">Shape of the image</label><select id="lgSquare"><option value="fit">Fit the logo</option><option value="square">Square (profile picture)</option></select></div>
</div>
<div class="btns">
  <button type="button" class="btn" id="lgPng">Download PNG</button>
  <button type="button" class="btn ghost" id="lgSvg">Download SVG</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

  ['lgFont', 'lgCase', 'lgSpace', 'lgShape', 'lgLayout', 'lgBg', 'lgSquare'].forEach(function (id) { $(id).addEventListener('change', draw); });
  ['lgC1', 'lgC2'].forEach(function (id) { $(id).addEventListener('input', function () { mark(); later(); }); });
  function fname(ext) { return ($('lgName').value.trim() || 'logo').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 30) + '-logo.' + ext; }
  function save(blob, n) { var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = n; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 5000); }
  $('lgSvg').addEventListener('click', async function () { await draw(); if (!svgNow) return; save(new Blob([svgNow], { type: 'image/svg+xml' }), fname('svg')); say('ok', 'SVG saved. It stays sharp at any size, for print, signs and websites.'); });
  $('lgPng').addEventListener('click', async function () {
    await draw(); if (!svgNow) return;
    var Wpx = +$('lgSize').value, Hpx = Math.round(Wpx * box.h / box.w), img = new Image(), url = URL.createObjectURL(new Blob([svgNow], { type: 'image/svg+xml' }));
    img.onload = function () {
      var c = document.createElement('canvas'); c.width = Wpx; c.height = Hpx; c.getContext('2d').drawImage(img, 0, 0, Wpx, Hpx); URL.revokeObjectURL(url);
      c.toBlob(function (b) { save(b, fname('png')); say('ok', 'Saved a ' + Wpx + ' × ' + Hpx + ' PNG' + ($('lgBg').value === 'none' ? ' with a transparent background.' : '.')); }, 'image/png');
    };
    img.onerror = function () { URL.revokeObjectURL(url); say('bad', 'The PNG could not be made. Try the SVG instead.'); };
    img.src = url;
  });
  mark();
  fontkitReady().then(function () { return Promise.all([font('sansb'), font('sans')]); }).then(function () { ready = true; draw(); }, function () { say('bad', 'The logo tools could not load. Check your connection and reload.'); });
})();
</script>
