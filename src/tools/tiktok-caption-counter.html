<style>
.tcc { container-type: inline-size; }
.tcc .tcc-grid { display: grid; gap: 18px; }
@container (min-width: 640px) { .tcc .tcc-grid { grid-template-columns: minmax(0, 1fr) 270px; align-items: start; } }
.tcc textarea { font-family: inherit; font-size: 16px; min-height: 190px; }
.tcc .tcc-bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
.tcc .tcc-bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
.tcc .tcc-bar i.warn { background: #d69e2e; } .tcc .tcc-bar i.over { background: var(--bad); }
.tcc .tcc-lim { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.tcc .tcc-lim b.over { color: var(--bad); }
.tcc .stats { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.tcc .tcc-tips { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; font-size: 14.5px; }
.tcc .tcc-tips li { padding: 8px 10px 8px 32px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); position: relative; }
.tcc .tcc-tips li::before { position: absolute; left: 10px; top: 8px; font-weight: 800; }
.tcc .tcc-tips li.ok::before { content: '✓'; color: var(--ok); } .tcc .tcc-tips li.warn::before { content: '!'; color: #b7791f; } .tcc .tcc-tips li.bad::before { content: '✕'; color: var(--bad); }
.tcc .tcc-phone { width: 270px; max-width: 100%; margin: 0 auto; aspect-ratio: 9 / 18; border-radius: 30px; background: linear-gradient(160deg, #2b3445, #0d1017 60%); border: 8px solid #1a1a1a; position: relative; overflow: hidden; color: #fff; font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.tcc .tcc-phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tcc .tcc-shade { position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
.tcc .tcc-side { position: absolute; right: 8px; bottom: 70px; display: grid; gap: 14px; justify-items: center; font-size: 11px; }
.tcc .tcc-side span { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.25); display: block; }
.tcc .tcc-cap { position: absolute; left: 12px; right: 54px; bottom: 22px; }
.tcc .tcc-cap b { display: block; margin-bottom: 4px; font-size: 14px; }
.tcc .tcc-text { overflow-wrap: anywhere; white-space: pre-wrap; }
.tcc .tcc-text.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.tcc .tcc-text .h { font-weight: 700; }
.tcc .tcc-more { font-weight: 700; cursor: pointer; background: none; border: 0; color: #fff; padding: 0; font: inherit; }
.tcc .tcc-note { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0 0; }
</style>
<div class="tcc" id="tcc">
<div class="tcc-grid">
<div>
  <label for="tcText">Your caption</label>
  <textarea id="tcText" data-nomemo maxlength="10000" placeholder="Write your caption with #hashtags and @mentions..."></textarea>
  <div class="tcc-bar"><i id="tcBar"></i></div>
  <div class="tcc-lim"><span id="tcLimTxt">TikTok allows up to 4,000 characters.</span><b id="tcCount">0 / 4,000</b></div>
  <div class="fields" style="margin-top:12px">
    <div><label for="tcUser">Username (for the preview)</label><input type="text" id="tcUser" data-nomemo maxlength="30" placeholder="yourname"></div>
    <div><label for="tcLimit">Limit to check against</label><select id="tcLimit"><option value="4000">4,000 (video caption)</option><option value="2200">2,200 (older apps and some tools)</option><option value="150">150 (short and punchy)</option><option value="80">80 (bio limit)</option></select></div>
    <div><label for="tcBg">Video frame (optional)</label><input type="file" id="tcBg" data-nomemo accept="image/*" style="max-width:100%"></div>
  </div>
  <div class="stats">
    <div class="stat"><span>Characters</span><b id="tcC">0</b></div>
    <div class="stat"><span>Hashtags</span><b id="tcH">0</b></div>
    <div class="stat"><span>Mentions</span><b id="tcM">0</b></div>
    <div class="stat"><span>Words</span><b id="tcW">0</b></div>
    <div class="stat"><span>Emojis</span><b id="tcE">0</b></div>
    <div class="stat"><span>Lines</span><b id="tcL">0</b></div>
  </div>
  <ul class="tcc-tips" id="tcTips"></ul>
  <div class="btns"><button type="button" class="btn" id="tcCopy">Copy caption</button><button type="button" class="btn ghost" id="tcCopyTags">Copy hashtags only</button><button type="button" class="btn ghost" id="tcDedupe">Remove repeated hashtags</button><button type="button" class="btn ghost" id="tcClear">Clear</button></div>
</div>
<div>
  <div class="tcc-phone" id="tcPhone" aria-label="Preview of the caption on a video"><img id="tcImg" alt="" hidden><div class="tcc-shade"></div><div class="tcc-side"><span></span>♥<span></span>💬<span></span>↗</div><div class="tcc-cap"><b id="tcName">@yourname</b><div class="tcc-text clamp" id="tcPrev"></div><button type="button" class="tcc-more" id="tcMore" hidden>more</button></div></div>
  <p class="tcc-note" id="tcCut">Captions show about 2 lines before "more".</p>
</div>
</div>
</div>
<script>
(function () {
  'use strict';
  var seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter() : null, open = false, img = null, KEY = 'gtnTikTokCaption';
  function len(t) { if (!seg) return Array.from(t).length; var n = 0; for (var x of seg.segment(t)) n++; return n; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var HASH = /(^|[^\p{L}\p{N}_&])#([\p{L}\p{N}_]+)/gu, MENT = /(^|[^\p{L}\p{N}_.])@([\p{L}\p{N}_.]+)/gu, EMO = /\p{Extended_Pictographic}/gu;
  function list(re, t) { var out = [], m; re.lastIndex = 0; while ((m = re.exec(t))) out.push(m[2]); return out; }
  function run() {
    var t = $('tcText').value, lim = +$('tcLimit').value, n = len(t), tags = list(HASH, t), ments = list(MENT, t), words = t.trim() ? t.trim().split(/\s+/).length : 0, emo = (t.match(EMO) || []).length;
    $('tcCount').textContent = n.toLocaleString() + ' / ' + lim.toLocaleString(); $('tcCount').className = n > lim ? 'over' : '';
    $('tcLimTxt').textContent = n > lim ? (n - lim).toLocaleString() + ' characters over the limit.' : (lim - n).toLocaleString() + ' characters left.';
    var bar = $('tcBar'); bar.style.width = Math.min(100, n / lim * 100) + '%'; bar.className = n > lim ? 'over' : n > lim * 0.9 ? 'warn' : '';
    $('tcC').textContent = n.toLocaleString(); $('tcH').textContent = tags.length; $('tcM').textContent = ments.length; $('tcW').textContent = words.toLocaleString(); $('tcE').textContent = emo; $('tcL').textContent = t ? t.split('\n').length : 0;
    // tips
    var tips = [], lower = tags.map(function (x) { return x.toLowerCase(); }), dup = lower.filter(function (x, i) { return lower.indexOf(x) !== i; });
    if (!t.trim()) tips.push(['warn', 'Start typing to check your caption.']);
    else {
      if (n > lim) tips.push(['bad', 'Too long for the ' + lim.toLocaleString() + '-character limit. Shorten it by ' + (n - lim).toLocaleString() + ' characters.']);
      var first = t.split('\n')[0].replace(HASH, '$1').trim();
      if (len(first) > 0 && len(first) <= 90) tips.push(['ok', 'Your first line is short enough to read before "more". Make it a hook.']);
      else if (len(first) > 90) tips.push(['warn', 'The first line is long. Only about the first 80–100 characters show before "more", so put the hook first.']);
      if (!tags.length) tips.push(['warn', 'No hashtags. 3 to 5 relevant hashtags help people find your video.']);
      else if (tags.length > 8) tips.push(['warn', tags.length + ' hashtags. A few specific ones usually work better than many.']);
      else tips.push(['ok', tags.length + ' hashtag' + (tags.length > 1 ? 's' : '') + '. Good amount.']);
      if (dup.length) tips.push(['warn', 'Repeated hashtag' + (dup.length > 1 ? 's' : '') + ': #' + dup.filter(function (x, i) { return dup.indexOf(x) === i; }).join(', #') + '. Use each once.']);
      var longTag = tags.filter(function (x) { return len(x) > 30; }); if (longTag.length) tips.push(['warn', 'Very long hashtags are hard to read: #' + longTag[0].slice(0, 30) + '…']);
      if (/#\s/.test(t) || /#[^\p{L}\p{N}_\s]/u.test(t)) tips.push(['warn', 'A # must be followed straight away by letters or numbers, with no space or symbol.']);
      if (/(^|[^\p{L}\p{N}_])#[\p{L}\p{N}_]*[-.'][\p{L}\p{N}]/u.test(t)) tips.push(['warn', 'Hashtags stop at punctuation, so #self-care becomes #self. Use #selfcare.']);
      if (ments.length > 5) tips.push(['warn', ments.length + ' mentions. Tagging too many accounts can look like spam.']);
      if (emo > 10) tips.push(['warn', emo + ' emojis. A few go a long way.']);
    }
    $('tcTips').innerHTML = tips.map(function (x) { return '<li class="' + x[0] + '">' + esc(x[1]) + '</li>'; }).join('');
    // preview with bold hashtags and mentions
    var html = esc(t).replace(/(^|[^\p{L}\p{N}_&])([#@][\p{L}\p{N}_.]+)/gu, '$1<span class="h">$2</span>');
    $('tcPrev').innerHTML = html || '<span style="opacity:.7">Your caption shows here</span>';
    $('tcName').textContent = '@' + ($('tcUser').value.trim().replace(/^@/, '') || 'yourname');
    $('tcPrev').classList.toggle('clamp', !open);
    var cut = !open && $('tcPrev').scrollHeight > $('tcPrev').clientHeight + 1;
    $('tcMore').hidden = !(cut || open); $('tcMore').textContent = open ? 'less' : 'more';
    $('tcCut').textContent = cut ? 'People see the first 2 lines, then tap "more" to read the rest.' : t ? 'The whole caption fits before "more".' : 'Captions show about 2 lines before "more".';
    try { localStorage.setItem(KEY, JSON.stringify({ t: t.slice(0, 10000), u: $('tcUser').value })); } catch (e) {}
  }
  ['tcText', 'tcUser', 'tcLimit'].forEach(function (id) { $(id).addEventListener('input', run); });
  $('tcMore').addEventListener('click', function () { open = !open; run(); });
  $('tcBg').addEventListener('change', function () { var f = this.files[0]; if (!f || !/^image\//.test(f.type)) return; if (img) URL.revokeObjectURL(img); img = URL.createObjectURL(f); $('tcImg').src = img; $('tcImg').hidden = false; });
  $('tcCopy').addEventListener('click', function () { copyText($('tcText').value, this); });
  $('tcCopyTags').addEventListener('click', function () { var tags = list(HASH, $('tcText').value); copyText(tags.map(function (x) { return '#' + x; }).join(' '), this); });
  $('tcDedupe').addEventListener('click', function () {
    var seen = {}, removed = 0;
    $('tcText').value = $('tcText').value.replace(HASH, function (m, pre, tag) { var k = tag.toLowerCase(); if (seen[k]) { removed++; return pre; } seen[k] = 1; return m; }).replace(/[ \t]{2,}/g, ' ');
    run(); if (window.toast) toast(removed ? 'Removed ' + removed + ' repeated hashtag' + (removed > 1 ? 's' : '') : 'No repeated hashtags');
  });
  $('tcClear').addEventListener('click', function () { $('tcText').value = ''; open = false; run(); $('tcText').focus(); });
  window.addEventListener('resize', run);
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s) { $('tcText').value = s.t || ''; $('tcUser').value = s.u || ''; } } catch (e) {}
  run();
})();
</script>
