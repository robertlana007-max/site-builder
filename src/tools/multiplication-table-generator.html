<style>
.mtg .mtg-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.mtg .mtg-tabs button { flex: 1 1 auto; font: inherit; font-weight: 700; font-size: 14px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer; }
.mtg .mtg-tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.mtg .mtg-tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
.mtg .mtg-t { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.mtg .mtg-t h3 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }
.mtg .mtg-t div { font: 500 15px/1.75 var(--mono, monospace); font-variant-numeric: tabular-nums; white-space: pre; }
.mtg .mtg-chart-wrap { overflow: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; max-height: 70vh; }
.mtg table.mtg-chart { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.mtg .mtg-chart th, .mtg .mtg-chart td { min-width: 38px; height: 34px; text-align: center; border: 1px solid var(--line); padding: 0 4px; }
.mtg .mtg-chart th { background: var(--accent-soft); color: var(--accent); position: sticky; top: 0; }
.mtg .mtg-chart tbody th { left: 0; position: sticky; }
.mtg .mtg-chart td.sq { background: var(--bg); font-weight: 700; }
.mtg .mtg-chart td.hi { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.mtg .mtg-q { font: 700 clamp(34px, 9vw, 56px)/1.1 system-ui, sans-serif; text-align: center; margin: 18px 0 10px; font-variant-numeric: tabular-nums; }
.mtg .mtg-ans { display: flex; gap: 8px; max-width: 360px; margin: 0 auto; }
.mtg .mtg-ans input { font-size: 22px; text-align: center; }
.mtg .mtg-fb { text-align: center; min-height: 26px; font-weight: 600; margin-top: 10px; }
.mtg .mtg-fb.ok { color: var(--ok); } .mtg .mtg-fb.bad { color: var(--bad); }
.mtg .mtg-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-bottom: 12px; }
.mtg .mtg-picks button { min-height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; }
.mtg .mtg-picks button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mtg .mtg-ws { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-top: 14px; }
.mtg-sheet h2 { margin: 0 0 4px; font-size: 20px; }
.mtg-sheet .mtg-meta { display: flex; gap: 24px; flex-wrap: wrap; font-size: 14px; margin-bottom: 16px; }
.mtg-sheet .mtg-meta span { border-bottom: 1px solid #999; min-width: 140px; display: inline-block; }
.mtg-sheet ol { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 22px; padding: 0; margin: 0; list-style: none; counter-reset: q; font: 500 17px/1.4 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.mtg-sheet li { counter-increment: q; white-space: nowrap; }
.mtg-sheet li::before { content: counter(q) '.'; display: inline-block; width: 2.2em; color: #777; font-size: 13px; }
.mtg-sheet .blank { display: inline-block; min-width: 46px; border-bottom: 1.5px solid #333; text-align: center; }
.mtg-sheet .key { color: #b91c1c; font-weight: 700; }
@media (max-width: 560px) { .mtg-sheet ol { grid-template-columns: repeat(2, 1fr); font-size: 15px; } .mtg .mtg-ws { padding: 14px; } }
#mtgPrint { display: none; }
@media print {
  body > *:not(#mtgPrint) { display: none !important; }
  html, body { background: #fff !important; }
  #mtgPrint { display: block !important; color: #000; }
  #mtgPrint .mtg-sheet { page-break-after: always; break-after: page; }
  #mtgPrint .mtg-sheet:last-child { page-break-after: auto; break-after: auto; }
  #mtgPrint .mtg-tables { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #mtgPrint .mtg-t { border: 1px solid #999; border-radius: 8px; padding: 6px 10px; break-inside: avoid; }
  #mtgPrint .mtg-t h3 { margin: 0 0 4px; font-size: 14pt; }
  #mtgPrint .mtg-t div { font: 11pt/1.6 monospace; white-space: pre; }
  #mtgPrint table { border-collapse: collapse; font-size: 9pt; } #mtgPrint th, #mtgPrint td { border: 1px solid #999; padding: 2px 4px; text-align: center; }
}
</style>
<div class="mtg" id="mtg">
<div class="mtg-tabs" role="tablist"><button type="button" role="tab" data-tab="t" aria-selected="true">Tables</button><button type="button" role="tab" data-tab="c" aria-selected="false">Chart</button><button type="button" role="tab" data-tab="w" aria-selected="false">Worksheet</button><button type="button" role="tab" data-tab="p" aria-selected="false">Practice</button></div>

<div data-panel="t">
  <div class="fields">
    <div><label for="mtFrom">Tables from</label><input type="number" id="mtFrom" min="1" max="100" value="2" inputmode="numeric"></div>
    <div><label for="mtTo">to</label><input type="number" id="mtTo" min="1" max="100" value="10" inputmode="numeric"></div>
    <div><label for="mtUpto">Multiply up to</label><select id="mtUpto"><option>10</option><option selected>12</option><option>15</option><option>20</option><option>25</option><option>30</option></select></div>
  </div>
  <div class="btns"><button type="button" class="btn ghost" id="mtPrintT">Print these tables</button></div>
  <p class="msg" id="mtMsgT"></p>
  <div class="mtg-tables" id="mtTables"></div>
</div>

<div data-panel="c" hidden>
  <div class="fields"><div><label for="mtChartN">Chart size</label><select id="mtChartN"><option value="10">10 × 10</option><option value="12" selected>12 × 12</option><option value="15">15 × 15</option><option value="20">20 × 20</option><option value="25">25 × 25</option></select></div></div>
  <p class="msg" style="margin-top:0">Tap a number to highlight its row and column.</p>
  <div class="mtg-chart-wrap"><table class="mtg-chart" id="mtChart"></table></div>
  <div class="btns"><button type="button" class="btn ghost" id="mtPrintC">Print chart</button></div>
</div>

<div data-panel="w" hidden>
  <label>Which tables? (tap to choose)</label>
  <div class="mtg-picks" id="mtWPick"></div>
  <div class="fields">
    <div><label for="mtWMore">Other tables (up to 100)</label><input type="text" id="mtWMore" maxlength="60" placeholder="e.g. 25, 50, 99" inputmode="numeric"></div>
    <div><label for="mtWUp">Multiply up to</label><select id="mtWUp"><option>10</option><option selected>12</option><option>20</option></select></div>
    <div><label for="mtWN">Questions</label><select id="mtWN"><option>12</option><option>24</option><option selected>30</option><option>45</option><option>60</option></select></div>
    <div><label for="mtWType">Question type</label><select id="mtWType"><option value="prod">Find the answer (3 × 4 = __)</option><option value="miss">Missing number (3 × __ = 12)</option><option value="div">Division (12 ÷ 3 = __)</option><option value="mix">Mix of all</option></select></div>
  </div>
  <div class="fields"><div><label for="mtWTitle">Worksheet title</label><input type="text" id="mtWTitle" maxlength="60" value="Times Tables Practice"></div></div>
  <div class="btns"><button type="button" class="btn" id="mtWGo">New worksheet</button><button type="button" class="btn ghost" id="mtWPrint">Print worksheet + answers</button><button type="button" class="btn ghost" id="mtWKey" aria-pressed="false">Show answers</button></div>
  <p class="msg" id="mtMsgW"></p>
  <div class="mtg-ws"><div class="mtg-sheet" id="mtSheet"></div></div>
</div>

<div data-panel="p" hidden>
  <label>Practise these tables</label>
  <div class="mtg-picks" id="mtPPick"></div>
  <div class="fields">
    <div><label for="mtPUp">Multiply up to</label><select id="mtPUp"><option>10</option><option selected>12</option><option>20</option></select></div>
    <div><label for="mtPLen">Round</label><select id="mtPLen"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="60s">60 seconds</option><option value="0">Endless</option></select></div>
  </div>
  <div class="btns"><button type="button" class="btn" id="mtPStart">Start</button></div>
  <div id="mtPlay" hidden>
    <div class="mtg-q" id="mtQ" aria-live="polite"></div>
    <form class="mtg-ans" id="mtForm"><input type="text" id="mtA" data-nomemo inputmode="numeric" autocomplete="off" aria-label="Your answer"><button class="btn" type="submit">Check</button></form>
    <div class="mtg-fb" id="mtFb" role="status"></div>
  </div>
  <div class="stats"><div class="stat"><span>Correct</span><b id="mtSc">0</b></div><div class="stat"><span>Wrong</span><b id="mtWr">0</b></div><div class="stat"><span>Streak</span><b id="mtSt">0</b></div><div class="stat"><span id="mtLeftL">Left</span><b id="mtLeft">–</b></div></div>
  <p class="msg" id="mtMsgP"></p>
</div>
</div>
<script>
(function () {
  'use strict';
  function n(id, lo, hi, d) { var v = parseInt($(id).value, 10); if (isNaN(v)) return d; return Math.max(lo, Math.min(hi, v)); }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // tabs
  document.querySelectorAll('.mtg-tabs button').forEach(function (b) { b.addEventListener('click', function () { document.querySelectorAll('.mtg-tabs button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); }); document.querySelectorAll('.mtg [data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== b.dataset.tab; }); }); });

  // ---- tables ----
  function tables() {
    var a = n('mtFrom', 1, 100, 1), b = n('mtTo', 1, 100, 10), up = +$('mtUpto').value, msg = '';
    if (a > b) { var t = a; a = b; b = t; }
    if (b - a > 49) { b = a + 49; msg = 'Showing 50 tables at a time: ' + a + ' to ' + b + '.'; }
    if ($('mtFrom').value === '' || $('mtTo').value === '') msg = 'Type the first and last table, from 1 to 100.';
    $('mtMsgT').textContent = msg;
    var w = String(b * up).length, html = '';
    for (var t2 = a; t2 <= b; t2++) { var lines = []; for (var i = 1; i <= up; i++) lines.push(String(t2).padStart(String(b).length) + ' × ' + String(i).padStart(String(up).length) + ' = ' + String(t2 * i).padStart(w)); html += '<div class="mtg-t"><h3>Table of ' + t2 + '</h3><div>' + lines.join('\n') + '</div></div>'; }
    $('mtTables').innerHTML = html;
  }
  ['mtFrom', 'mtTo', 'mtUpto'].forEach(function (id) { $(id).addEventListener('input', tables); });

  // ---- chart ----
  function chart() {
    var N = +$('mtChartN').value, h = '<thead><tr><th>×</th>';
    for (var c = 1; c <= N; c++) h += '<th scope="col">' + c + '</th>';
    h += '</tr></thead><tbody>';
    for (var r = 1; r <= N; r++) { h += '<tr><th scope="row">' + r + '</th>'; for (var c2 = 1; c2 <= N; c2++) h += '<td data-r="' + r + '" data-c="' + c2 + '"' + (r === c2 ? ' class="sq"' : '') + '>' + r * c2 + '</td>'; h += '</tr>'; }
    $('mtChart').innerHTML = h + '</tbody>';
  }
  $('mtChartN').addEventListener('change', chart);
  $('mtChart').addEventListener('click', function (e) {
    var td = e.target.closest('td'); if (!td) return;
    $('mtChart').querySelectorAll('td').forEach(function (x) { x.classList.toggle('hi', x.dataset.r === td.dataset.r || x.dataset.c === td.dataset.c); });
  });

  // ---- pickers ----
  function picker(id, def) {
    var box = $(id), sel = {}; def.forEach(function (d) { sel[d] = 1; });
    box.innerHTML = Array.from({ length: 20 }, function (_, i) { return '<button type="button" data-v="' + (i + 1) + '" aria-pressed="' + !!sel[i + 1] + '">' + (i + 1) + '</button>'; }).join('');
    box.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); box.dispatchEvent(new Event('change', { bubbles: true })); });
    return function () { return Array.prototype.filter.call(box.querySelectorAll('button'), function (b) { return b.getAttribute('aria-pressed') === 'true'; }).map(function (b) { return +b.dataset.v; }); };
  }
  var wPick = picker('mtWPick', [2, 3, 4, 5]), pPick = picker('mtPPick', [2, 3, 4, 5, 6, 7, 8, 9]);

  // ---- worksheet ----
  var sheet = [];
  function wTables() {
    var extra = $('mtWMore').value.split(/[\s,;]+/).map(function (x) { return parseInt(x, 10); }).filter(function (x) { return x >= 1 && x <= 100; });
    return wPick().concat(extra).filter(function (x, i, a) { return a.indexOf(x) === i; });
  }
  function worksheet() {
    var T = wTables(), up = +$('mtWUp').value, N = +$('mtWN').value, type = $('mtWType').value, bad = $('mtWMore').value.trim() && !$('mtWMore').value.split(/[\s,;]+/).every(function (x) { var v = parseInt(x, 10); return !x || (v >= 1 && v <= 100 && /^\d+$/.test(x)); });
    $('mtMsgW').className = 'msg' + (bad || !T.length ? ' bad' : '');
    $('mtMsgW').textContent = !T.length ? 'Choose at least one table.' : bad ? 'Only whole numbers from 1 to 100 are used from "Other tables".' : '';
    if (!T.length) { sheet = []; $('mtSheet').innerHTML = ''; return; }
    var pool = []; T.forEach(function (t) { for (var i = 1; i <= up; i++) pool.push([t, i]); });
    sheet = [];
    var bag = shuffle(pool.slice());
    for (var k = 0; k < N; k++) {
      if (!bag.length) bag = shuffle(pool.slice());
      var p = bag.pop(), a = p[0], b = p[1];
      if (Math.random() < 0.5) { a = p[1]; b = p[0]; }
      var ty = type === 'mix' ? ['prod', 'miss', 'div'][k % 3] : type;
      sheet.push({ a: a, b: b, t: ty });
    }
    drawSheet();
  }
  function qHtml(q, key) {
    var bl = function (v) { return '<span class="blank' + (key ? ' key' : '') + '">' + (key ? v : '&nbsp;') + '</span>'; };
    if (q.t === 'prod') return q.a + ' × ' + q.b + ' = ' + bl(q.a * q.b);
    if (q.t === 'miss') return q.a + ' × ' + bl(q.b) + ' = ' + q.a * q.b;
    return q.a * q.b + ' ÷ ' + q.a + ' = ' + bl(q.b);
  }
  function sheetHtml(key) {
    var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    return '<h2>' + esc($('mtWTitle').value.trim() || 'Times Tables Practice') + (key ? ' – Answers' : '') + '</h2><div class="mtg-meta"><div>Name: <span></span></div><div>Date: <span></span></div><div>Score: <span style="min-width:60px"></span> / ' + sheet.length + '</div></div><ol>' + sheet.map(function (q) { return '<li>' + qHtml(q, key) + '</li>'; }).join('') + '</ol>';
  }
  function drawSheet() { $('mtSheet').innerHTML = sheet.length ? sheetHtml($('mtWKey').getAttribute('aria-pressed') === 'true') : ''; }
  $('mtWGo').addEventListener('click', worksheet);
  ['mtWPick', 'mtWUp', 'mtWN', 'mtWType'].forEach(function (id) { $(id).addEventListener('change', worksheet); });
  $('mtWMore').addEventListener('input', worksheet); $('mtWTitle').addEventListener('input', drawSheet);
  $('mtWKey').addEventListener('click', function () { this.setAttribute('aria-pressed', String(this.getAttribute('aria-pressed') !== 'true')); this.textContent = this.getAttribute('aria-pressed') === 'true' ? 'Hide answers' : 'Show answers'; drawSheet(); });

  // ---- printing ----
  function printHtml(html) {
    var box = $('mtgPrint'); if (!box) { box = document.createElement('div'); box.id = 'mtgPrint'; document.body.appendChild(box); }
    box.innerHTML = html; window.print();
  }
  window.addEventListener('afterprint', function () { var b = $('mtgPrint'); if (b) b.innerHTML = ''; });
  $('mtWPrint').addEventListener('click', function () { if (!sheet.length) return; printHtml('<div class="mtg-sheet">' + sheetHtml(false) + '</div><div class="mtg-sheet">' + sheetHtml(true) + '</div>'); });
  $('mtPrintT').addEventListener('click', function () { printHtml('<div class="mtg-tables">' + $('mtTables').innerHTML + '</div>'); });
  $('mtPrintC').addEventListener('click', function () { printHtml('<table>' + $('mtChart').innerHTML + '</table>'); });

  // ---- practice ----
  var game = null, timer = null;
  function stats() { $('mtSc').textContent = game ? game.ok : 0; $('mtWr').textContent = game ? game.bad : 0; $('mtSt').textContent = game ? game.streak : 0; }
  function next() {
    var T = game.T, a = T[rnd(0, T.length - 1)], b = rnd(1, game.up);
    if (game.last && game.last[0] === a && game.last[1] === b) b = b % game.up + 1;
    game.q = [a, b]; game.last = game.q; game.tries = 0;
    $('mtQ').textContent = (Math.random() < 0.5 ? a + ' × ' + b : b + ' × ' + a) + ' = ?';
    $('mtA').value = ''; $('mtA').focus();
    if (game.len > 0) $('mtLeft').textContent = game.len - game.n;
  }
  function finish(why) {
    clearInterval(timer); timer = null;
    var tot = game.ok + game.bad, pct = tot ? Math.round(game.ok / tot * 100) : 0;
    $('mtPlay').hidden = true; $('mtPStart').textContent = 'Play again';
    var miss = game.missed.slice(0, 12).map(function (m) { return m[0] + ' × ' + m[1] + ' = ' + m[0] * m[1]; });
    $('mtMsgP').className = 'msg ' + (pct >= 80 ? 'ok' : '');
    $('mtMsgP').textContent = (why || 'Round finished!') + ' ' + game.ok + ' of ' + tot + ' correct (' + pct + '%). Best streak: ' + game.best + '.' + (miss.length ? ' Practise these: ' + miss.join(', ') + '.' : ' No mistakes. Brilliant!');
    if (pct >= 80 && window.burst) burst($('mtPStart'));
    game.over = true;
  }
  $('mtPStart').addEventListener('click', function () {
    var T = pPick(); if (!T.length) { $('mtMsgP').className = 'msg bad'; $('mtMsgP').textContent = 'Choose at least one table to practise.'; return; }
    clearInterval(timer);
    var L = $('mtPLen').value;
    game = { T: T, up: +$('mtPUp').value, len: L === '60s' ? -1 : +L, n: 0, ok: 0, bad: 0, streak: 0, best: 0, missed: [], end: L === '60s' ? Date.now() + 60000 : 0 };
    $('mtLeftL').textContent = L === '60s' ? 'Seconds left' : 'Left'; $('mtLeft').textContent = L === '60s' ? 60 : game.len || '∞';
    $('mtPlay').hidden = false; $('mtMsgP').textContent = ''; $('mtFb').textContent = ''; stats(); next();
    if (game.end) timer = setInterval(function () { var s = Math.max(0, Math.ceil((game.end - Date.now()) / 1000)); $('mtLeft').textContent = s; if (s <= 0) finish('Time is up!'); }, 250);
  });
  $('mtForm').addEventListener('submit', function (e) {
    e.preventDefault(); if (!game || game.over) return;
    var raw = $('mtA').value.trim(); if (!/^\d+$/.test(raw)) { $('mtFb').className = 'mtg-fb bad'; $('mtFb').textContent = 'Type a whole number.'; return; }
    var right = game.q[0] * game.q[1];
    if (+raw === right) { if (!game.tries) { game.ok++; game.streak++; game.best = Math.max(game.best, game.streak); } $('mtFb').className = 'mtg-fb ok'; $('mtFb').textContent = game.tries ? 'Yes, ' + right + '.' : ['Correct!', 'Great!', 'Well done!', 'Yes!'][rnd(0, 3)]; game.n++; stats(); if (game.len > 0 && game.n >= game.len) return finish(); next(); }
    else { if (!game.tries) { game.bad++; game.streak = 0; game.missed.push(game.q); } game.tries++; stats(); $('mtFb').className = 'mtg-fb bad'; $('mtFb').textContent = game.tries >= 2 ? 'The answer is ' + right + '. Type it to go on.' : 'Not quite, try again.'; $('mtA').select(); }
  });

  tables(); chart(); worksheet();
})();
</script>
