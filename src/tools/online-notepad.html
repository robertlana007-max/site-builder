<script>
(function () {
  // [name, CodeMirror mode, file extensions, default extension for saving]
  var LANGS = [
    ['Normal text', null, ['txt', 'text', 'log'], 'txt'], ['JavaScript', 'javascript', ['js', 'mjs', 'cjs', 'jsx'], 'js'], ['TypeScript', 'text/typescript', ['ts', 'tsx'], 'ts'],
    ['JSON', 'application/json', ['json', 'jsonc', 'webmanifest'], 'json'], ['HTML', 'htmlmixed', ['html', 'htm', 'xhtml'], 'html'], ['XML', 'xml', ['xml', 'svg', 'xsl', 'plist'], 'xml'],
    ['CSS', 'css', ['css'], 'css'], ['SCSS', 'text/x-scss', ['scss'], 'scss'], ['LESS', 'text/x-less', ['less'], 'less'], ['Python', 'python', ['py', 'pyw'], 'py'],
    ['Java', 'text/x-java', ['java'], 'java'], ['C', 'text/x-csrc', ['c', 'h'], 'c'], ['C++', 'text/x-c++src', ['cpp', 'cc', 'cxx', 'hpp', 'hh'], 'cpp'], ['C#', 'text/x-csharp', ['cs'], 'cs'],
    ['Kotlin', 'text/x-kotlin', ['kt', 'kts'], 'kt'], ['Dart', 'application/dart', ['dart'], 'dart'], ['PHP', 'application/x-httpd-php', ['php', 'phtml'], 'php'], ['SQL', 'text/x-sql', ['sql'], 'sql'],
    ['Markdown', 'markdown', ['md', 'markdown'], 'md'], ['Shell / Bash', 'shell', ['sh', 'bash', 'zsh'], 'sh'], ['PowerShell', 'powershell', ['ps1', 'psm1'], 'ps1'], ['YAML', 'yaml', ['yml', 'yaml'], 'yml'],
    ['TOML', 'toml', ['toml'], 'toml'], ['INI / Properties', 'properties', ['ini', 'cfg', 'conf', 'properties', 'env'], 'ini'], ['Go', 'go', ['go'], 'go'], ['Rust', 'rust', ['rs'], 'rs'],
    ['Ruby', 'ruby', ['rb'], 'rb'], ['Lua', 'lua', ['lua'], 'lua'], ['Perl', 'perl', ['pl', 'pm'], 'pl'], ['R', 'r', ['r'], 'r'], ['Swift', 'swift', ['swift'], 'swift'],
    ['Dockerfile', 'dockerfile', ['dockerfile'], 'Dockerfile'], ['Nginx', 'nginx', [], 'conf'], ['Diff / Patch', 'diff', ['diff', 'patch'], 'diff']
  ];
  var KEY = 'gtn-notepad', OPT = 'gtn-notepad-view';
  var tabs = [], cur = -1, seq = 1, saveTimer = null, marks = [];
  var view = { wrap: false, numbers: true, spaces: false, activeline: true, dark: false, size: 14 };
  try { var v = JSON.parse(localStorage.getItem(OPT)); if (v) for (var k in view) if (k in v) view[k] = v[k]; } catch (e) {}

  function say(t, cls) { $('msg').className = 'msg ' + (cls || ''); $('msg').textContent = t; }
  function langOf(name) {
    var n = (name || '').toLowerCase(), ext = n.indexOf('.') >= 0 ? n.split('.').pop() : n;
    if (n === 'dockerfile' || /^dockerfile\./.test(n)) return 'Dockerfile';
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i][2].indexOf(ext) !== -1) return LANGS[i][0];
    return 'Normal text';
  }
  function lang(name) { for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === name) return LANGS[i]; return LANGS[0]; }

  var spaces = { token: function (s) { if (s.match(/^ +/)) return 'np-sp'; s.next(); while (!s.eol() && s.peek() !== ' ') s.next(); return null; } };
  var cm = CodeMirror($('npEd'), {
    lineNumbers: view.numbers, lineWrapping: view.wrap, styleActiveLine: view.activeline, matchBrackets: true, autoCloseBrackets: true, autoCloseTags: true,
    foldGutter: true, gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'], indentUnit: 4, tabSize: 4, indentWithTabs: false, showTrailingSpace: true,
    highlightSelectionMatches: { showToken: /\w/, annotateScrollbar: false }, styleSelectedText: true, placeholder: 'Start typing, or drop files here…',
    configureMouse: function (cm, repeat, ev) { return { addNew: ev.ctrlKey || ev.metaKey }; }, // Ctrl+click adds another cursor
    extraKeys: {
      'Ctrl-S': function () { run('save'); }, 'Cmd-S': function () { run('save'); }, 'Ctrl-O': function () { run('open'); }, 'Cmd-O': function () { run('open'); },
      'Ctrl-F': function () { run('find'); }, 'Cmd-F': function () { run('find'); }, 'Ctrl-H': function () { run('replace'); }, 'Cmd-Alt-F': function () { run('replace'); },
      'F3': function () { run('next'); }, 'Shift-F3': function () { run('prev'); }, 'Ctrl-G': function () { run('goto'); }, 'Cmd-G': function () { run('goto'); },
      'Ctrl-D': function () { run('dupline'); }, 'Cmd-D': function () { run('dupline'); }, 'Ctrl-L': function () { run('delline'); }, 'Ctrl-J': function () { run('joinlines'); },
      'Ctrl-/': function () { run('comment'); }, 'Cmd-/': function () { run('comment'); }, 'Alt-Up': function () { run('moveup'); }, 'Alt-Down': function () { run('movedown'); },
      'Ctrl-Shift-U': function () { run('upper'); }, 'Ctrl-U': function () { run('lower'); }, 'Alt-N': function () { run('new'); }, 'Alt-W': function () { run('close'); },
      'Alt-Z': function () { run('wrap'); }, 'Alt-=': function () { run('zoomin'); }, 'Alt--': function () { run('zoomout'); }, 'Alt-0': function () { run('zoomreset'); },
      'Alt-PageDown': function () { show((cur + 1) % tabs.length); }, 'Alt-PageUp': function () { show((cur - 1 + tabs.length) % tabs.length); },
      'Ctrl-P': function () { run('print'); }, 'F11': function () { run('full'); }, 'Esc': function () { if (!$('npFind').hidden) run('closefind'); else if ($('np').classList.contains('full')) run('full'); },
      'Tab': function (c) { if (c.somethingSelected()) c.indentSelection('add'); else c.replaceSelection(c.getOption('indentWithTabs') ? '\t' : Array(c.getOption('indentUnit') + 1).join(' '), 'end'); },
      'Shift-Tab': function (c) { c.indentSelection('subtract'); }
    }
  });
  window.npEditor = cm;

  // ---------- tabs ----------
  function makeTab(name, text, langName, eol) {
    var L = lang(langName || langOf(name));
    var t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name, lang: L[0], eol: eol || '\n', doc: CodeMirror.Doc(text || '', L[1]), clean: 0 };
    t.clean = t.doc.changeGeneration();
    return t;
  }
  function untitled() { var n; do { n = 'new ' + seq++; } while (tabs.some(function (t) { return t.name === n; })); return n; }
  function add(t) { tabs.push(t); show(tabs.length - 1); persist(); }
  function show(i) {
    if (i < 0 || i >= tabs.length) return;
    cur = i; var t = tabs[i];
    cm.swapDoc(t.doc); cm.setOption('mode', lang(t.lang)[1]); applySpaces();
    $('npEol').value = t.eol; drawTabs(); status(); cm.focus(); clearMarks(); persist();
  }
  function dirty(t) { return !t.doc.isClean(t.clean); }
  function drawTabs() {
    var box = $('npTabs'); box.innerHTML = '';
    tabs.forEach(function (t, i) {
      var b = document.createElement('div'), nm = document.createElement('button'), x = document.createElement('button');
      b.className = 'np-tab' + (i === cur ? ' on' : '') + (dirty(t) ? ' dirty' : ''); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === cur);
      nm.type = 'button'; nm.textContent = t.name; nm.title = t.name + ' · ' + t.lang + ' · double-click to rename';
      nm.addEventListener('click', function () { show(i); }); nm.addEventListener('dblclick', function () { show(i); run('rename'); });
      x.type = 'button'; x.className = 'np-tx'; x.textContent = '×'; x.setAttribute('aria-label', 'Close ' + t.name);
      x.addEventListener('click', function (e) { e.stopPropagation(); closeTab(i); });
      b.appendChild(nm); b.appendChild(x); box.appendChild(b);
    });
    var plus = document.createElement('button'); plus.type = 'button'; plus.className = 'np-plus'; plus.textContent = '＋'; plus.title = 'New tab (Alt+N)';
    plus.addEventListener('click', function () { run('new'); }); box.appendChild(plus);
    var on = box.querySelector('.np-tab.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function closeTab(i) {
    var t = tabs[i];
    if (dirty(t) && t.doc.getValue() && !confirm('Close “' + t.name + '”? Its text will be lost unless you saved it.')) return;
    tabs.splice(i, 1);
    if (!tabs.length) { add(makeTab(untitled(), '')); return; }
    show(Math.min(i, tabs.length - 1));
  }

  // ---------- saving the session in this browser ----------
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(KEY, JSON.stringify({ cur: cur, seq: seq, tabs: tabs.map(function (t) { var c = t.doc.getCursor(); return { name: t.name, lang: t.lang, eol: t.eol, text: t.doc.getValue(), line: c.line, ch: c.ch }; }) }));
        localStorage.setItem(OPT, JSON.stringify(view));
      } catch (e) { say('This browser’s storage is full, so the newest changes are not kept between visits. Save your work with Ctrl+S.', 'bad'); }
    }, 500);
  }
  function restore() {
    var s = null; try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (s && s.tabs && s.tabs.length) {
      seq = s.seq || 1;
      s.tabs.forEach(function (o) { var t = makeTab(o.name, o.text, o.lang, o.eol); t.doc.setCursor({ line: o.line || 0, ch: o.ch || 0 }); tabs.push(t); });
      show(Math.min(Math.max(0, s.cur || 0), tabs.length - 1));
    } else add(makeTab(untitled(), ''));
  }

  // ---------- status bar ----------
  function status() {
    var c = cm.getCursor(), sel = cm.getSelections().join('').length, n = cm.getValue().length;
    $('npPos').textContent = 'Ln ' + (c.line + 1) + ', Col ' + (c.ch + 1) + (sel ? ' · Sel ' + sel : '') + (cm.listSelections().length > 1 ? ' · ' + cm.listSelections().length + ' cursors' : '');
    $('npLen').textContent = fmtNum(n) + ' chars · ' + fmtNum(cm.lineCount()) + (cm.lineCount() === 1 ? ' line' : ' lines');
    $('npLang').textContent = tabs[cur] ? tabs[cur].lang : '';
  }
  cm.on('cursorActivity', status);
  cm.on('change', function () { status(); persist(); var on = document.querySelector('.np-tab.on'); if (on && tabs[cur]) on.classList.toggle('dirty', dirty(tabs[cur])); });
  cm.on('overwriteToggle', function (c, o) { $('npMode').textContent = o ? 'OVR' : 'INS'; });
  $('npEol').addEventListener('change', function () { if (tabs[cur]) { tabs[cur].eol = $('npEol').value; persist(); } });

  // ---------- view ----------
  function applyView() {
    cm.setOption('lineWrapping', view.wrap); cm.setOption('lineNumbers', view.numbers); cm.setOption('styleActiveLine', view.activeline);
    $('np').classList.toggle('dark', view.dark); $('np').style.setProperty('--np-size', view.size + 'px'); applySpaces();
    document.querySelectorAll('#np [data-check]').forEach(function (b) { b.setAttribute('aria-checked', !!view[b.dataset.cmd === 'wrap' ? 'wrap' : b.dataset.cmd]); });
    cm.refresh(); persist();
  }
  function applySpaces() { cm.removeOverlay(spaces); if (view.spaces) cm.addOverlay(spaces); $('np').classList.toggle('ws', view.spaces); }

  // ---------- line helpers ----------
  function lineRange() { // the selected lines, or every line when nothing is selected
    if (!cm.somethingSelected()) return { from: 0, to: cm.lastLine(), all: true };
    var a = cm.getCursor('from'), b = cm.getCursor('to');
    return { from: a.line, to: b.ch === 0 && b.line > a.line ? b.line - 1 : b.line };
  }
  function onLines(fn, msg) {
    var r = lineRange(), lines = [];
    for (var i = r.from; i <= r.to; i++) lines.push(cm.getLine(i));
    var out = fn(lines);
    cm.operation(function () {
      cm.replaceRange(out.join('\n'), { line: r.from, ch: 0 }, { line: r.to, ch: cm.getLine(r.to).length });
      cm.setSelection({ line: r.from, ch: 0 }, { line: r.from + out.length - 1, ch: (out[out.length - 1] || '').length });
    });
    say((msg || 'Done') + (r.all ? ' (whole document).' : ' (selected lines).'), 'ok');
  }
  function onText(fn) { // the selected text, or the whole document
    if (cm.somethingSelected()) cm.replaceSelections(cm.getSelections().map(fn), 'around');
    else { var c = cm.getCursor(); cm.setValue(fn(cm.getValue())); cm.setCursor(c); }
  }
  function titleCase(s) { return s.toLowerCase().replace(/(^|[\s\-_(\["'])(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  function moveLines(dir) {
    var r = lineRange(); if (r.all) r = { from: cm.getCursor().line, to: cm.getCursor().line };
    if ((dir < 0 && r.from === 0) || (dir > 0 && r.to === cm.lastLine())) return;
    cm.operation(function () {
      var block = cm.getRange({ line: r.from, ch: 0 }, { line: r.to, ch: cm.getLine(r.to).length }), sel = cm.listSelections();
      if (dir < 0) {
        var above = cm.getLine(r.from - 1);
        cm.replaceRange(block + '\n' + above, { line: r.from - 1, ch: 0 }, { line: r.to, ch: cm.getLine(r.to).length });
      } else {
        var below = cm.getLine(r.to + 1);
        cm.replaceRange(below + '\n' + block, { line: r.from, ch: 0 }, { line: r.to + 1, ch: below.length });
      }
      cm.setSelections(sel.map(function (s) { return { anchor: { line: s.anchor.line + dir, ch: s.anchor.ch }, head: { line: s.head.line + dir, ch: s.head.ch } }; }));
    });
  }

  // ---------- find and replace ----------
  function query() {
    var q = $('npQ').value; if (!q) return null;
    var cs = $('npCase').checked, src;
    if ($('npRe').checked) { try { new RegExp(q); } catch (e) { $('npFindMsg').textContent = 'That is not a valid regular expression.'; return null; } src = q; }
    else src = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if ($('npWord').checked) src = '\\b(?:' + src + ')\\b';
    return new RegExp(src, cs ? 'g' : 'gi');
  }
  function find(back) {
    var re = query(); if (!re) return false;
    var from = back ? cm.getCursor('from') : cm.getCursor('to'), c = cm.getSearchCursor(re, from);
    if (!(back ? c.findPrevious() : c.findNext())) {
      c = cm.getSearchCursor(re, back ? { line: cm.lastLine(), ch: cm.getLine(cm.lastLine()).length } : { line: 0, ch: 0 });
      if (!(back ? c.findPrevious() : c.findNext())) { $('npFindMsg').textContent = 'Not found.'; return false; }
      $('npFindMsg').textContent = back ? 'Reached the top, continued from the bottom.' : 'Reached the end, continued from the top.';
    } else $('npFindMsg').textContent = '';
    cm.setSelection(c.from(), c.to()); cm.scrollIntoView({ from: c.from(), to: c.to() }, 80);
    return true;
  }
  function count() { var re = query(); if (!re) return 0; var n = 0, c = cm.getSearchCursor(re); while (c.findNext() && n < 100000) n++; return n; }
  function clearMarks() { marks.forEach(function (m) { m.clear(); }); marks = []; }
  function markAll() { clearMarks(); var re = query(); if (!re) return 0; var c = cm.getSearchCursor(re); while (c.findNext() && marks.length < 20000) marks.push(cm.markText(c.from(), c.to(), { className: 'np-hit' })); return marks.length; }
  function replaceOne() {
    var re = query(); if (!re) return;
    var selText = cm.getSelection(), one = new RegExp('^(?:' + re.source + ')$', re.flags.replace('g', ''));
    if (selText && one.test(selText)) cm.replaceSelection(selText.replace(one, $('npRe').checked ? $('npR').value : $('npR').value.replace(/\$/g, '$$$$')), 'end');
    find(false);
  }
  function replaceAll() {
    var re = query(); if (!re) return;
    var n = 0, rep = $('npR').value;
    cm.operation(function () {
      var c = cm.getSearchCursor(re);
      while (c.findNext()) { var m = cm.getRange(c.from(), c.to()); c.replace($('npRe').checked ? m.replace(new RegExp(re.source, re.flags.replace('g', '')), rep) : rep); n++; if (n > 100000) break; }
    });
    $('npFindMsg').textContent = n ? 'Replaced ' + fmtNum(n) + (n === 1 ? ' match.' : ' matches.') : 'Nothing to replace.';
  }
  function openFind(withReplace) {
    $('npFind').hidden = false; $('npRepRow').hidden = !withReplace;
    var s = cm.getSelection(); if (s && s.indexOf('\n') === -1) $('npQ').value = s;
    $('npQ').focus(); $('npQ').select();
  }
  $('npQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); find(e.shiftKey); } if (e.key === 'Escape') run('closefind'); if (e.key === 'F3') { e.preventDefault(); find(e.shiftKey); } });
  $('npR').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); replaceOne(); } if (e.key === 'Escape') run('closefind'); });

  // ---------- files ----------
  function download(name, text, eol) {
    var blob = new Blob([text.replace(/\r\n|\r|\n/g, eol || '\n')], { type: 'text/plain;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function fileName(t) { return t.name.indexOf('.') >= 0 || t.lang === 'Dockerfile' ? t.name : t.name.replace(/\s+/g, '-') + '.' + lang(t.lang)[3]; }
  function openFiles(list) {
    Array.prototype.slice.call(list).forEach(function (f) {
      if (f.size > 20 * 1048576) return say('“' + f.name + '” is larger than 20 MB, which is too big to edit here.', 'bad');
      f.text().then(function (text) {
        var eol = /\r\n/.test(text) ? '\r\n' : /\r/.test(text) ? '\r' : '\n';
        var empty = tabs.length === 1 && !tabs[0].doc.getValue() && /^new \d+$/.test(tabs[0].name);
        var t = makeTab(f.name, text.replace(/\r\n?/g, '\n'), null, eol);
        if (empty) tabs.splice(0, 1);
        add(t); say('Opened ' + f.name + ' · ' + t.lang + ' · ' + fmtBytes(f.size), 'ok');
      });
    });
  }
  $('npOpen').addEventListener('change', function () { openFiles(this.files); this.value = ''; });
  $('np').addEventListener('dragover', function (e) { e.preventDefault(); $('np').classList.add('over'); });
  $('np').addEventListener('dragleave', function (e) { if (!$('np').contains(e.relatedTarget)) $('np').classList.remove('over'); });
  $('np').addEventListener('drop', function (e) { e.preventDefault(); $('np').classList.remove('over'); if (e.dataTransfer.files.length) openFiles(e.dataTransfer.files); });
  cm.on('drop', function (c, e) { if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); } });

  // ---------- all commands ----------
  function run(cmd) {
    var t = tabs[cur];
    switch (cmd) {
      case 'new': add(makeTab(untitled(), '')); break;
      case 'open': $('npOpen').click(); break;
      case 'save': download(fileName(t), t.doc.getValue(), t.eol); t.clean = t.doc.changeGeneration(); drawTabs(); say('Saved ' + fileName(t) + ' to your downloads.', 'ok'); break;
      case 'saveas': var nn = prompt('Save as (file name):', fileName(t)); if (!nn) break; t.name = nn.trim(); t.lang = langOf(t.name) === 'Normal text' && t.lang !== 'Normal text' && t.name.indexOf('.') < 0 ? t.lang : langOf(t.name); show(cur); run('save'); break;
      case 'saveall':
        var enc = new TextEncoder(), used = {};
        var files = tabs.map(function (x) { var n = fileName(x), k = 1; while (used[n]) n = n.replace(/(\.[^.]*)?$/, '-' + (++k) + '$1'); used[n] = 1; return { name: n, data: enc.encode(x.doc.getValue().replace(/\n/g, x.eol)) }; });
        var a = document.createElement('a'); a.href = URL.createObjectURL(PT.zip(files)); a.download = 'notepad-tabs.zip'; document.body.appendChild(a); a.click(); a.remove();
        tabs.forEach(function (x) { x.clean = x.doc.changeGeneration(); }); drawTabs(); say('Saved ' + files.length + (files.length === 1 ? ' tab' : ' tabs') + ' in notepad-tabs.zip.', 'ok'); break;
      case 'rename': var r = prompt('Tab name (add an extension such as .js or .py to change the colours):', t.name); if (r && r.trim()) { t.name = r.trim(); var g = langOf(t.name); if (t.name.indexOf('.') >= 0) t.lang = g; show(cur); } break;
      case 'close': closeTab(cur); break;
      case 'closeothers': if (!tabs.some(function (x, i) { return i !== cur && dirty(x) && x.doc.getValue(); }) || confirm('Close all other tabs? Unsaved text in them will be lost.')) { tabs = [t]; show(0); } break;
      case 'closeall': if (!tabs.some(function (x) { return dirty(x) && x.doc.getValue(); }) || confirm('Close all tabs? Unsaved text will be lost.')) { tabs = []; seq = 1; add(makeTab(untitled(), '')); } break;
      case 'print':
        var w = window.open('', '_blank'); if (!w) { say('Your browser blocked the print window. Allow pop-ups and try again.', 'bad'); break; }
        var pre = w.document.createElement('pre'); pre.textContent = t.doc.getValue(); pre.style.cssText = 'white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace';
        w.document.title = t.name; w.document.body.appendChild(pre); w.focus(); w.print(); break;
      case 'undo': cm.undo(); break;
      case 'redo': cm.redo(); break;
      case 'copyall': copyText(cm.getValue()); say('All text copied.', 'ok'); break;
      case 'selectall': cm.execCommand('selectAll'); break;
      case 'dupline':
        cm.operation(function () {
          if (cm.somethingSelected()) { cm.replaceSelections(cm.getSelections().map(function (s) { return s + s; })); return; }
          var l = cm.getCursor().line; cm.replaceRange(cm.getLine(l) + '\n', { line: l, ch: 0 }); cm.setCursor({ line: l + 1, ch: cm.getCursor().ch });
        }); break;
      case 'delline': cm.execCommand('deleteLine'); break;
      case 'moveup': moveLines(-1); break;
      case 'movedown': moveLines(1); break;
      case 'joinlines': onLines(function (L) { return [L.map(function (s, i) { return i ? s.trim() : s.replace(/\s+$/, ''); }).join(' ')]; }, 'Lines joined'); break;
      case 'comment': cm.toggleComment({ indent: true }); break;
      case 'indent': cm.indentSelection('add'); break;
      case 'outdent': cm.indentSelection('subtract'); break;
      case 'upper': onText(function (s) { return s.toUpperCase(); }); break;
      case 'lower': onText(function (s) { return s.toLowerCase(); }); break;
      case 'title': onText(titleCase); break;
      case 'sentence': onText(function (s) { return s.toLowerCase().replace(/(^\s*|[.!?]\s+|\n\s*)(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); }); break;
      case 'invert': onText(function (s) { return s.replace(/./g, function (c) { var u = c.toUpperCase(); return c === u ? c.toLowerCase() : u; }); }); break;
      case 'trimtrail': onLines(function (L) { return L.map(function (s) { return s.replace(/\s+$/, ''); }); }, 'Trailing spaces removed'); break;
      case 'trimlead': onLines(function (L) { return L.map(function (s) { return s.replace(/^\s+/, ''); }); }, 'Leading spaces removed'); break;
      case 'trimboth': onLines(function (L) { return L.map(function (s) { return s.trim(); }); }, 'Spaces trimmed'); break;
      case 'tab2sp': onLines(function (L) { var sp = Array(cm.getOption('tabSize') + 1).join(' '); return L.map(function (s) { return s.replace(/\t/g, sp); }); }, 'Tabs changed to spaces'); break;
      case 'sp2tab': onLines(function (L) { var n = cm.getOption('tabSize'); return L.map(function (s) { return s.replace(/^ +/, function (m) { return Array(Math.floor(m.length / n) + 1).join('\t') + Array(m.length % n + 1).join(' '); }); }); }, 'Leading spaces changed to tabs'); break;
      case 'date': cm.replaceSelection(new Date().toLocaleString(), 'end'); break;
      case 'find': openFind(false); break;
      case 'replace': openFind(true); break;
      case 'next': if ($('npFind').hidden && !$('npQ').value) openFind(false); else find(false); break;
      case 'prev': if ($('npFind').hidden && !$('npQ').value) openFind(false); else find(true); break;
      case 'count': var n = count(); $('npFindMsg').textContent = n === 0 && !query() ? '' : fmtNum(n) + (n === 1 ? ' match.' : ' matches.'); break;
      case 'markall': if ($('npFind').hidden) { openFind(false); break; } var m = markAll(); $('npFindMsg').textContent = fmtNum(m) + ' marked.'; break;
      case 'unmark': clearMarks(); $('npFindMsg').textContent = ''; break;
      case 'rep': replaceOne(); break;
      case 'repall': replaceAll(); break;
      case 'closefind': $('npFind').hidden = true; clearMarks(); cm.focus(); break;
      case 'goto': var to = prompt('Go to line (1 to ' + cm.lineCount() + '):', cm.getCursor().line + 1); var ln = parseInt(to, 10); if (ln > 0) { ln = Math.min(ln, cm.lineCount()); cm.setCursor({ line: ln - 1, ch: 0 }); cm.scrollIntoView(null, 120); cm.focus(); } break;
      case 'wrap': view.wrap = !view.wrap; applyView(); break;
      case 'numbers': view.numbers = !view.numbers; applyView(); break;
      case 'spaces': view.spaces = !view.spaces; applyView(); break;
      case 'activeline': view.activeline = !view.activeline; applyView(); break;
      case 'dark': view.dark = !view.dark; applyView(); break;
      case 'zoomin': view.size = Math.min(32, view.size + 1); applyView(); break;
      case 'zoomout': view.size = Math.max(9, view.size - 1); applyView(); break;
      case 'zoomreset': view.size = 14; applyView(); break;
      case 'foldall': cm.operation(function () { for (var i = cm.firstLine(); i <= cm.lastLine(); i++) cm.foldCode({ line: i, ch: 0 }, null, 'fold'); }); break;
      case 'unfoldall': cm.operation(function () { for (var i = cm.firstLine(); i <= cm.lastLine(); i++) cm.foldCode({ line: i, ch: 0 }, null, 'unfold'); }); break;
      case 'full': $('np').classList.toggle('full'); document.documentElement.classList.toggle('np-full', $('np').classList.contains('full')); setTimeout(function () { cm.refresh(); cm.focus(); }, 30); break;
      case 'sortasc': onLines(function (L) { return L.slice().sort(function (a, b) { return a.localeCompare(b); }); }, 'Sorted A to Z'); break;
      case 'sortdesc': onLines(function (L) { return L.slice().sort(function (a, b) { return b.localeCompare(a); }); }, 'Sorted Z to A'); break;
      case 'sortnum': onLines(function (L) { var n = function (s) { var m = s.match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : Infinity; }; return L.slice().sort(function (a, b) { return n(a) - n(b); }); }, 'Sorted as numbers'); break;
      case 'sortlen': onLines(function (L) { return L.slice().sort(function (a, b) { return a.length - b.length; }); }, 'Sorted by length'); break;
      case 'shuffle': onLines(function (L) { var a = L.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }, 'Lines shuffled'); break;
      case 'reverse': onLines(function (L) { return L.slice().reverse(); }, 'Order reversed'); break;
      case 'dedupe': var before; onLines(function (L) { before = L.length; var seen = {}; return L.filter(function (s) { if (seen['$' + s]) return false; seen['$' + s] = 1; return true; }); }, 'Duplicate lines removed'); break;
      case 'noempty': onLines(function (L) { var o = L.filter(function (s) { return s.trim(); }); return o.length ? o : ['']; }, 'Empty lines removed'); break;
      case 'number': onLines(function (L) { var w = String(L.length).length; return L.map(function (s, i) { return String(i + 1).padStart(w, ' ') + '. ' + s; }); }, 'Lines numbered'); break;
      case 'jsonfmt': case 'jsonmin':
        try { onText(function (s) { return JSON.stringify(JSON.parse(s), null, cmd === 'jsonfmt' ? 2 : 0); }); if (!cm.somethingSelected()) { t.lang = 'JSON'; cm.setOption('mode', lang('JSON')[1]); status(); } say('JSON ' + (cmd === 'jsonfmt' ? 'formatted.' : 'minified.'), 'ok'); }
        catch (e) { say('That is not valid JSON: ' + e.message, 'bad'); } break;
      case 'b64enc': onText(function (s) { var b = new TextEncoder().encode(s), x = ''; for (var i = 0; i < b.length; i++) x += String.fromCharCode(b[i]); return btoa(x); }); break;
      case 'b64dec': try { onText(function (s) { var bin = atob(s.replace(/\s+/g, '')), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder('utf-8', { fatal: true }).decode(u); }); } catch (e) { say('That is not valid Base64 text.', 'bad'); } break;
      case 'urlenc': onText(encodeURIComponent); break;
      case 'urldec': try { onText(function (s) { return decodeURIComponent(s.replace(/\+/g, ' ')); }); } catch (e) { say('That text has a broken % code.', 'bad'); } break;
      case 'stats':
        var txt = cm.somethingSelected() ? cm.getSelection() : cm.getValue(), words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
        say((cm.somethingSelected() ? 'Selection: ' : 'Document: ') + fmtNum(words) + ' words · ' + fmtNum(Array.from(txt).length) + ' characters · ' + fmtNum(Array.from(txt.replace(/\s/g, '')).length) + ' without spaces · ' + fmtNum(txt.split('\n').length) + ' lines.', 'ok'); break;
      case 'help': say('Shortcuts: Ctrl+S save · Ctrl+O open · Alt+N new tab · Alt+W close tab · Ctrl+F find · Ctrl+H replace · F3 next · Ctrl+G go to line · Ctrl+D duplicate line · Ctrl+L delete line · Alt+↑/↓ move line · Ctrl+/ comment · Ctrl+click add a cursor · Alt+drag column select · Alt+Z word wrap · Alt+= / Alt+- zoom · F11 full screen.', 'ok'); break;
      default:
        if (cmd.indexOf('lang:') === 0) { t.lang = cmd.slice(5); cm.setOption('mode', lang(t.lang)[1]); applySpaces(); status(); persist(); say('Language: ' + t.lang, 'ok'); }
    }
    if (/^(new|open|save|saveas|saveall|rename|close|closeothers|closeall|find|replace|goto|print|copyall)$/.test(cmd) === false && cmd.indexOf('lang:') !== 0 && $('npFind').hidden) cm.focus();
  }

  // ---------- menus ----------
  $('npLangs').innerHTML = LANGS.map(function (L) { return '<button data-cmd="lang:' + L[0] + '">' + L[0] + '</button>'; }).join('');
  var openMenu = null;
  function closeMenus() { document.querySelectorAll('#np .np-m.open').forEach(function (m) { m.classList.remove('open'); }); openMenu = null; }
  document.querySelectorAll('#np .np-mb').forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); var m = b.parentNode, was = m.classList.contains('open'); closeMenus(); if (!was) { m.classList.add('open'); openMenu = m; } });
    b.addEventListener('mouseenter', function () { if (openMenu && openMenu !== b.parentNode) { closeMenus(); b.parentNode.classList.add('open'); openMenu = b.parentNode; } });
  });
  document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('#np .np-drop')) closeMenus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(); });
  $('np').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cmd]'); if (!b || !$('np').contains(b)) return;
    closeMenus(); run(b.dataset.cmd);
  });
  // keep keyboard shortcuts working when the find box has focus
  $('npFind').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); run('save'); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'h' || e.key === 'H')) { e.preventDefault(); openFind(true); }
  });
  window.addEventListener('beforeunload', function () { clearTimeout(saveTimer); try { localStorage.setItem(KEY, JSON.stringify({ cur: cur, seq: seq, tabs: tabs.map(function (t) { var c = t.doc.getCursor(); return { name: t.name, lang: t.lang, eol: t.eol, text: t.doc.getValue(), line: c.line, ch: c.ch }; }) })); } catch (e) {} });

  restore(); applyView();
})();
</script>
