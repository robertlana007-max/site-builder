<style>
.wsm fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.wsm legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.wsm textarea { min-height: 150px; font-family: inherit; font-size: 15px; }
.wsm .wsm-hint { display: block; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.wsm .wsm-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.wsm .wsm-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 4px; }
.wsm .wsm-prev canvas { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
.wsm .wsm-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
.wsm .wsm-bar .btn { min-height: 38px; padding: 4px 12px; }
</style>
<div class="wsm" id="wsm">
<fieldset><legend>Words</legend>
  <div class="fields"><div><label for="wsTitle">Puzzle title</label><input type="text" id="wsTitle" data-nomemo maxlength="70" placeholder="e.g. Ocean Animals"></div></div>
  <label for="wsWords">Words to hide, one per line or separated by commas</label>
  <textarea id="wsWords" data-nomemo maxlength="6000" placeholder="dolphin&#10;octopus&#10;starfish&#10;whale&#10;coral&#10;seahorse"></textarea>
  <span class="wsm-hint" id="wsCount">Any language works. Spaces and hyphens inside a word are removed in the grid.</span>
</fieldset>
<fieldset><legend>Puzzle</legend>
  <div class="fields">
    <div><label for="wsLevel">Difficulty</label><select id="wsLevel"><option value="easy">Easy: across and down</option><option value="medium" selected>Medium: adds diagonals</option><option value="hard">Hard: also backwards</option></select></div>
    <div><label for="wsSize">Grid size</label><select id="wsSize"><option value="auto">Automatic</option></select></div>
    <div><label for="wsCase">Letters</label><select id="wsCase"><option value="upper">CAPITALS</option><option value="lower">small letters</option><option value="asis">As typed</option></select></div>
  </div>
  <div class="fields">
    <div><label for="wsPaper">Paper</label><select id="wsPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
    <div><label for="wsCopies">Different versions in the PDF</label><select id="wsCopies"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>10</option><option>20</option><option>30</option></select></div>
  </div>
  <label class="wsm-check"><input type="checkbox" id="wsName" checked>Add Name and Date lines</label>
  <label class="wsm-check"><input type="checkbox" id="wsList" checked>Show the word list under the puzzle</label>
</fieldset>
<div class="btns" style="margin:0 0 14px">
  <button type="button" class="btn" id="wsMake">Make puzzle</button>
  <button type="button" class="btn ghost" id="wsShuffle">New layout</button>
</div>
<div class="wsm-prev" id="wsPrevBox" hidden>
  <div class="wsm-bar"><span id="wsInfo"></span><button type="button" class="btn ghost" id="wsKey" aria-pressed="false">Show answers</button></div>
  <canvas id="wsCanvas" width="595" height="842" aria-label="Word search preview"></canvas>
</div>
<div class="btns">
  <button type="button" class="btn" id="wsPdf" disabled>Download PDF with answer key</button>
  <button type="button" class="btn ghost" id="wsPng" disabled>Save as PNG</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

  // one page as a list of shapes (used for the preview, the PNG and the PDF)
  function pageOps(r, title, key, version) {
