<style>
.bl-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.bl-bar .btn { min-height: 40px; padding: 6px 12px; }
.bl-stage { background: repeating-conic-gradient(var(--line) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 12px; user-select: none; -webkit-user-select: none; }
.bl-stage canvas { max-width: 100%; max-height: 70vh; display: block; margin: 0 auto; touch-action: none; cursor: crosshair; }
.bl-stage canvas.mv { cursor: move; }
.bl-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
.bl-list li { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 14px; }
.bl-list li[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.bl-list button { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 6px 4px 6px 12px; min-height: 36px; }
.bl-list button.x { padding: 6px 12px 6px 6px; color: var(--muted); }
.bl-list button.x:hover { color: var(--bad); }
.bl-tip { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.bl-col input[type=color] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 3px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop an image here</b>JPG, PNG or WebP. Blurred on your device, never uploaded. You can also paste with Ctrl+V.</div>
<input type="file" id="file" accept="image/*" hidden data-nomemo>
<div id="editor" hidden>
  <div class="bl-bar" role="group" aria-label="Drawing tool">
    <button class="btn ghost" type="button" data-mode="rect" aria-pressed="true">▭ Rectangle</button>
    <button class="btn ghost" type="button" data-mode="ellipse" aria-pressed="false">◯ Ellipse</button>
    <button class="btn ghost" type="button" data-mode="brush" aria-pressed="false">✎ Brush</button>
    <button class="btn ghost" type="button" data-mode="move" aria-pressed="false">✥ Select and move</button>
    <button class="btn ghost" type="button" id="faces" hidden>Find faces</button>
  </div>
  <p class="bl-tip" id="tip">Drag on the picture to cover an area. Drag an existing area to move it, or its corner squares to resize it.</p>
  <div class="bl-stage"><canvas id="cv" aria-label="Your image with blurred areas. Drag to add an area."></canvas></div>
  <ul class="bl-list" id="list" aria-label="Covered areas"></ul>
  <div class="fields bl-col">
    <div><label for="fx">Effect</label><select id="fx"><option value="blur">Blur</option><option value="pixel">Pixelate (mosaic)</option><option value="bar">Solid bar (safest)</option></select></div>
    <div id="amtRow"><label for="amt">Strength: <span id="amtV">50</span>%</label><input type="range" id="amt" min="5" max="100" value="50"></div>
    <div id="colRow" hidden><label for="barCol">Bar colour</label><input type="color" id="barCol" value="#000000"></div>
    <div id="brushRow"><label for="bsz">Brush size: <span id="bszV">5</span>%</label><input type="range" id="bsz" min="1" max="20" step="0.5" value="5"></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="whole" data-nomemo> Blur the whole image</label></div>
  <div class="fields" id="wholeRow" hidden><div><label for="wamt">Whole image blur: <span id="wamtV">30</span>%</label><input type="range" id="wamt" min="2" max="100" value="30"></div></div>
  <div class="fields">
    <div><label for="fmt">Save as</label><select id="fmt"><option value="keep">Same as original</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
    <div id="qRow"><label for="q">Quality (JPG, WebP): <span id="qv">92</span>%</label><input type="range" id="q" min="40" max="100" value="92"></div>
  </div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Download image</button><button class="btn ghost" id="clearAll" hidden>Remove all areas</button><a class="btn ghost" id="dl" hidden>Download</a></div>
<p class="msg" id="msg"></p>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  var img = null, file = null, regions = [], sel = -1, mode = 'rect', busy = false;
  var cv = $('cv'), ctx = cv.getContext('2d'), baseCache = null;
  var EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
  var FXN = { blur: 'Blur', pixel: 'Pixelate', bar: 'Bar' }, KN = { rect: 'Rectangle', ellipse: 'Ellipse', brush: 'Brush' };
  function say(c, t) { PT.say(c, t); }

  // ---------- pixel effects (plain JavaScript so every browser, Safari included, gives the same result) ----------
  function boxBlur(d, w, h, r) { // 3 passes of a horizontal + vertical box blur ≈ Gaussian

    if (r.kind !== 'brush') { c.fill(); return; }
    var lw = r.size * Math.max(W, H);

    r.pts.forEach(function (p) { c.beginPath(); c.arc(p[0] * W - ox, p[1] * H - oy, lw / 2, 0, Math.PI * 2); c.fill(); }); // round ends everywhere, even on a single tap
  }
  function applyRegion(c, r, W, H) {
    var b = bbox(r, W, H), base = Math.max(W, H);
    var x0 = Math.max(0, Math.floor(b.x)), y0 = Math.max(0, Math.floor(b.y)), x1 = Math.min(W, Math.ceil(b.x + b.w)), y1 = Math.min(H, Math.ceil(b.y + b.h));
    if (x1 - x0 < 1 || y1 - y0 < 1) return;
    var w = x1 - x0, h = y1 - y0, layer = document.createElement('canvas'); layer.width = w; layer.height = h;

    var fxc = document.createElement('canvas'); fxc.width = id.width; fxc.height = id.height; fxc.getContext('2d').putImageData(id, 0, 0);
    lc.fillStyle = '#000'; shape(lc, r, W, H, x0, y0);
    lc.globalCompositeOperation = 'source-in'; lc.drawImage(fxc, px0 - x0, py0 - y0);

    });

  function corners(b) { return [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]]; }

  function list() {

      var a = document.createElement('button'); a.type = 'button'; a.textContent = (k + 1) + '. ' + KN[r.kind] + ' · ' + FXN[r.fx];

  document.querySelectorAll('[data-mode]').forEach(function (b) {

    });
  });

  // ---------- pointer editing ----------
  var drag = null;
  function pt(e) { var b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / b.width * cv.width, y: (e.clientY - b.top) / b.height * cv.height, u: cv.width / b.width }; }

    else { nr.x = p.x / W; nr.y = p.y / H; nr.w = 0; nr.h = 0; }

  document.addEventListener('keydown', function (e) {

  // optional: the browser's own face detector (Chrome with experimental features). Never guessed.

        });

  // ---------- loading ----------

        // JPG has no transparency: put a white backing under it
        if (type === 'image/jpeg') { x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); }
      } catch (e) { busy = false; list(); say('bad', 'This image is too large for your browser\'s memory. Try a smaller copy.'); return; }
      PT.blob(c, type, $('q').value / 100).then(function (b) {
        c.width = c.height = 0; busy = false; list();
        if (!b) { say('bad', 'Your browser could not save in this format. Try JPG or PNG.'); return; }
        var name = PT.base(file.name || 'image') + '-blurred.' + (EXT[b.type] || 'png');
        PT.done(b, name, b.type, 'Saved ' + name + ' at ' + W + ' × ' + H + ' px');
        $('dl').textContent = 'Download ' + name; $('dl').click();
      });
    }, 30);
  });
  syncUi();
})();
</script>
