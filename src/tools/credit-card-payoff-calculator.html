<div class="fields">
  <div><label for="bal">Card balance</label><input type="number" id="bal" min="0" step="any" value="5000"></div>
  <div><label for="apr">Interest rate (APR %)</label><input type="number" id="apr" min="0" step="any" value="22"></div>
  <div><label for="pay">Monthly payment</label><input type="number" id="pay" min="0" step="any" value="200"></div>
</div>
<div class="stats">
  <div class="stat"><span>Time to pay off</span><b id="time">–</b></div>
  <div class="stat"><span>Total interest</span><b id="int">–</b></div>
  <div class="stat"><span>Total paid</span><b id="tot">–</b></div>
</div>
<p class="msg" id="msg"></p>
<h3>Pay it off by a target date</h3>
<div class="fields">
  <div><label for="months">Months to be debt free</label><input type="number" id="months" min="1" max="600" step="1" value="24"></div>
</div>
<div class="out" id="need">–</div>
<script>
(function () {
  function calc() {
    var B = +$('bal').value, r = +$('apr').value / 1200, P = +$('pay').value, ids = ['time', 'int', 'tot'];
    $('msg').textContent = '';
    if (!(B > 0) || r < 0 || !(P > 0)) ids.forEach(function (i) { $(i).textContent = '–'; });
    else if (P <= B * r) {
      ids.forEach(function (i) { $(i).textContent = '–'; });
      $('msg').className = 'msg bad';
      $('msg').textContent = 'This payment does not cover the monthly interest of ' + fmtNum(B * r, 2) + ', so the balance would never go down. Pay more than that each month.';
    } else {
      // Simulate month by month so the smaller final payment is counted exactly.
      var bal = B, n = 0, interest = 0;
      while (bal > 0.005 && n < 1200) { var i = bal * r; interest += i; bal = bal + i - Math.min(P, bal + i); n++; }
      var y = Math.floor(n / 12), m = n % 12;
      $('time').textContent = (y ? y + (y === 1 ? ' yr ' : ' yrs ') : '') + (m || !y ? m + ' mo' : '');
      $('int').textContent = fmtNum(interest, 2);
      $('tot').textContent = fmtNum(B + interest, 2);
    }
    var N = Math.floor(+$('months').value);
    if (!(B > 0) || r < 0 || !(N >= 1 && N <= 600)) $('need').textContent = '–';
    else $('need').textContent = 'Pay ' + fmtNum(r === 0 ? B / N : B * r / (1 - Math.pow(1 + r, -N)), 2) + ' a month';
  }
  ['bal', 'apr', 'pay', 'months'].forEach(function (id) { $(id).addEventListener('input', calc); });
  calc();
})();
</script>
