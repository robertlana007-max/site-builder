<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a PDF here</b>Rotated on your device. Nothing is uploaded.</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div class="fields">
  <div><label for="deg">Rotate</label><select id="deg"><option value="90">90° clockwise</option><option value="180">180° (upside down)</option><option value="270">90° counter-clockwise</option></select></div>
  <div><label for="pages">Pages (leave empty for all)</label><input type="text" id="pages" placeholder="All pages" autocomplete="off"></div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Rotate PDF</button><a class="btn ghost" id="dl" hidden>Download PDF</a></div>
<p class="msg" id="msg"></p>
<script src="../assets/vendor/pdf-lib.min.js"></script>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  var file = null;
  PT.drop(false, function (f) {
    $('dl').hidden = true;
    PT.open(f).then(function (d) {
      file = f; var n = d.getPageCount(); $('go').disabled = false;
      PT.say('', f.name + ' · ' + n + (n === 1 ? ' page' : ' pages'));
    }).catch(function (e) { file = null; $('go').disabled = true; PT.say('bad', e.message); });
  });
  $('go').addEventListener('click', function () {
    PT.run(async function () {
      var doc = await PT.open(file), n = doc.getPageCount(), add = +$('deg').value; // reopen so repeated clicks do not stack
      var idx = $('pages').value.trim() ? PT.ranges($('pages').value, n) : doc.getPageIndices();
      idx.forEach(function (i) {
        var p = doc.getPage(i);
        p.setRotation(PDFLib.degrees((p.getRotation().angle + add) % 360));
      });
      PT.done(await doc.save(), PT.base(file.name) + '-rotated.pdf', 'application/pdf', 'Rotated ' + idx.length + (idx.length === 1 ? ' page' : ' pages'));
    });
  });
})();
</script>
