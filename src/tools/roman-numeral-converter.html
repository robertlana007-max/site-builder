<div class="fields">
  <div><label for="num">Number (1 to 3999)</label><input type="number" id="num" min="1" max="3999" step="1" placeholder="2024"></div>
  <div><label for="rom">Roman numeral</label><input type="text" id="rom" placeholder="MMXXIV" autocomplete="off" spellcheck="false" style="text-transform:uppercase"></div>
</div>
<p class="msg" id="msg">Type in either box and the other one updates.</p>
<script>
(function () {
  var T = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  function toRoman(n) { var s = ''; T.forEach(function (t) { while (n >= t[0]) { s += t[1]; n -= t[0]; } }); return s; }
  function fromRoman(s) { var n = 0, i = 0; T.forEach(function (t) { while (s.substr(i, t[1].length) === t[1]) { n += t[0]; i += t[1].length; } }); return n; }
  function say(cls, t) { $('msg').className = 'msg ' + cls; $('msg').textContent = t; }
  $('num').addEventListener('input', function () {
    var v = $('num').value, n = +v;
    if (v === '') { $('rom').value = ''; return say('', 'Type in either box and the other one updates.'); }
    if (!Number.isInteger(n) || n < 1 || n > 3999) { $('rom').value = ''; return say('bad', 'Roman numerals cover whole numbers from 1 to 3999.'); }
    $('rom').value = toRoman(n); say('', '');
  });
  $('rom').addEventListener('input', function () {
    var s = $('rom').value.trim().toUpperCase();
    if (!s) { $('num').value = ''; return say('', 'Type in either box and the other one updates.'); }
    var n = /^[IVXLCDM]+$/.test(s) ? fromRoman(s) : 0;
    // A numeral is valid only if converting back gives the same text (rejects IIII, VX, IC and so on).
    if (!n || toRoman(n) !== s) { $('num').value = ''; return say('bad', '"' + s + '" is not a valid Roman numeral.'); }
    $('num').value = n; say('', '');
  });
})();
</script>
