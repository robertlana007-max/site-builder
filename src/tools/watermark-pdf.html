<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a PDF here</b>The watermark is added on your device. Nothing is uploaded.</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div class="fields">
  <div><label for="text">Watermark text</label><input type="text" id="text" value="CONFIDENTIAL" maxlength="60"></div>
  <div><label for="style">Style</label><select id="style"><option value="diag">Diagonal across the page</option><option value="flat">Straight across the middle</option></select></div>
  <div><label for="op">Strength</label><select id="op"><option value="0.12">Light</option><option value="0.22" selected>Medium</option><option value="0.4">Strong</option></select></div>
  <div><label for="col">Color</label><select id="col"><option value="g">Gray</option><option value="r">Red</option><option value="b">Blue</option></select></div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Add watermark</button><a class="btn ghost" id="dl" hidden>Download PDF</a></div>
<p class="msg" id="msg"></p>
<script src="../assets/vendor/pdf-lib.min.js"></script>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  var file = null, COL = { g: [0.35, 0.35, 0.35], r: [0.8, 0.1, 0.1], b: [0.1, 0.25, 0.8] };
  PT.drop(false, function (f) {
    $('dl').hidden = true;
    PT.open(f).then(function (d) {
      file = f; var n = d.getPageCount(); $('go').disabled = false;
      PT.say('', f.name + ' · ' + n + (n === 1 ? ' page' : ' pages'));
    }).catch(function (e) { file = null; $('go').disabled = true; PT.say('bad', e.message); });
  });
  $('go').addEventListener('click', function () {
    PT.run(async function () {
      var text = $('text').value.trim();
      if (!text) throw new Error('Type the watermark text.');
      var doc = await PT.open(file), font = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold), c = COL[$('col').value];
      try { font.widthOfTextAtSize(text, 10); }
      catch (e) { throw new Error('The watermark can only use Latin letters, numbers and common symbols.'); }
      var diag = $('style').value === 'diag';
      doc.getPages().forEach(function (p) {
        // work on the page as it is shown, so pages with a built-in rotation get the same upright watermark
        var v = PT.view(p), ang = diag ? Math.atan2(v.height, v.width) : 0;
        // Size the text to span about 70% of the diagonal (or width), then center it on the page.
        var span = (diag ? Math.hypot(v.width, v.height) : v.width) * 0.7;
        var size = Math.min(span / font.widthOfTextAtSize(text, 1), v.height / 4), w = font.widthOfTextAtSize(text, size), h = size * 0.7;
        var at = v.at(v.width / 2 - (w / 2) * Math.cos(ang) + (h / 2) * Math.sin(ang), v.height / 2 - (w / 2) * Math.sin(ang) - (h / 2) * Math.cos(ang));
        p.drawText(text, {
          x: at.x, y: at.y,
          size: size, font: font, color: PDFLib.rgb(c[0], c[1], c[2]), opacity: +$('op').value, rotate: PDFLib.degrees(v.angle + ang * 180 / Math.PI)
        });
      });
      var n = doc.getPageCount();
      PT.done(await doc.save(), PT.base(file.name) + '-watermark.pdf', 'application/pdf', 'Watermarked ' + n + (n === 1 ? ' page' : ' pages'));
    });
  });
})();
</script>
