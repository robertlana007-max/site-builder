<style>
.pst fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.pst legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.pst textarea { min-height: 70px; font-family: inherit; font-size: 15px; }
.pst .pst-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-bottom: 12px; }
.pst .pst-row button { font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 4px 6px; }
.pst .pst-row button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pst .pst-pal { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.pst .pst-pal button { width: 48px; height: 32px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; padding: 0; overflow: hidden; display: flex; }
.pst .pst-pal button i { flex: 1; }
.pst .pst-pal button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.pst .pst-img { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.pst .pst-img img { max-height: 44px; max-width: 110px; border: 1px solid var(--line); border-radius: 6px; }
.pst input[type=file] { max-width: 100%; }
.pst .pst-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.pst .pst-prev canvas { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
.pst .pst-prev.wide canvas { max-width: 680px; }
.pst .pst-hint { display: block; font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
</style>
<div class="pst" id="pst">
<fieldset><legend>Template</legend>
  <div class="pst-row" id="psTpl" role="group" aria-label="Template"></div>
</fieldset>
<fieldset><legend>Text</legend>
  <div class="fields">
    <div><label for="psHead">Headline</label><input type="text" id="psHead" data-nomemo maxlength="60"></div>
    <div><label for="psSub">Subheading</label><input type="text" id="psSub" data-nomemo maxlength="90"></div>
  </div>
  <div class="fields"><div><label for="psDetails">Key details, one per line (date, time, place, price…)</label><textarea id="psDetails" data-nomemo maxlength="400"></textarea></div></div>
  <div class="fields"><div><label for="psBody">More text (optional)</label><textarea id="psBody" data-nomemo maxlength="600"></textarea></div></div>
  <div class="fields"><div><label for="psFoot">Bottom line: contact, website or organiser (optional)</label><input type="text" id="psFoot" data-nomemo maxlength="90"></div></div>
</fieldset>
<fieldset><legend>Picture and colours</legend>
  <label for="psImg">Picture (optional)</label>
  <div class="pst-img"><input type="file" id="psImg" data-nomemo accept="image/png,image/jpeg,image/webp,image/gif"><img id="psImgPrev" alt="Chosen picture" hidden><button type="button" class="btn ghost" id="psImgDel" hidden>Remove</button></div>
  <div class="pst-pal" id="psPal" role="group" aria-label="Colours"></div>
  <div class="fields">
    <div><label for="psSize">Size</label><select id="psSize">
      <option value="a4">A4 paper</option><option value="letter">US Letter paper</option><option value="a3">A3 paper</option><option value="square">Square post (1080 × 1080)</option><option value="portrait">Portrait post (1080 × 1350)</option><option value="story">Story (1080 × 1920)</option><option value="wide">Wide (1920 × 1080)</option>
    </select></div>
    <div><label for="psFont">Headline font</label><select id="psFont"><option value="auto">Template's choice</option><option value="display">Strong (Anton)</option><option value="bebas">Tall (Bebas Neue)</option><option value="sansb">Modern sans</option><option value="serifb">Classic serif</option><option value="pacifico">Friendly (Pacifico)</option><option value="hand">Script (Dancing)</option></select></div>
  </div>
</fieldset>
<div class="pst-prev" id="psPrevBox"><canvas id="psCanvas" width="595" height="842" aria-label="Poster preview"></canvas></div>
<div class="btns">
  <button type="button" class="btn" id="psPng">Download PNG</button>
  <button type="button" class="btn ghost" id="psPdf">Download PDF</button>
  <button type="button" class="btn ghost" id="psReset">Clear text</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
