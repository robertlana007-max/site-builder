<label for="txt">Text to hash</label>
<textarea id="txt" spellcheck="false" style="min-height:120px" placeholder="Type or paste text..."></textarea>
<div class="kv"><span>SHA-1</span><code id="h1">–</code><button class="btn ghost" data-c="h1">Copy</button></div>
<div class="kv"><span>SHA-256</span><code id="h256">–</code><button class="btn ghost" data-c="h256">Copy</button></div>
<div class="kv"><span>SHA-384</span><code id="h384">–</code><button class="btn ghost" data-c="h384">Copy</button></div>
<div class="kv"><span>SHA-512</span><code id="h512">–</code><button class="btn ghost" data-c="h512">Copy</button></div>
<p class="msg" id="msg"></p>
<script>
(function () {
  var A = { h1: 'SHA-1', h256: 'SHA-256', h384: 'SHA-384', h512: 'SHA-512' }, run = 0;
  function calc() {
    var mine = ++run, data = new TextEncoder().encode($('txt').value);
    if (!window.crypto || !crypto.subtle) { $('msg').className = 'msg bad'; $('msg').textContent = 'Your browser does not support hashing on this page. Open the site over HTTPS.'; return; }
    Object.keys(A).forEach(function (id) {
      crypto.subtle.digest(A[id], data).then(function (buf) {
        if (mine !== run) return; // a newer keystroke already started
        $(id).textContent = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    });
  }
  $('txt').addEventListener('input', calc);
  document.querySelectorAll('[data-c]').forEach(function (b) {
    b.addEventListener('click', function () { copyText($(b.dataset.c).textContent, b); });
  });
  calc();
})();
</script>
