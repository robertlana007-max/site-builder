<style>
.cc-conv { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: end; }
.cc-side label { margin-bottom: 6px; }
.cc-side input { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 8px; }
.cc-pbtn { width: 100%; display: flex; align-items: center; gap: 10px; font: inherit; text-align: start; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 48px; cursor: pointer; }
.cc-pbtn:hover, .cc-pbtn[aria-expanded="true"] { border-color: var(--accent); }
.cc-pbtn .cc-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 14px; }
.cc-pbtn .cc-cd { font-weight: 700; }
.cc-pbtn::after { content: '▾'; color: var(--muted); }
.cc-flag { font-size: 22px; line-height: 1; width: 28px; text-align: center; flex: none; }
.cc-flag.txt { font-size: 11px; font-weight: 800; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 5px 0; }
.cc-swap { font: inherit; font-size: 20px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; margin-bottom: 0; }
.cc-swap:hover { border-color: var(--accent); }
.cc-res { margin: 16px 0 0; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.cc-res .cc-big { font-size: clamp(22px, 5.5vw, 32px); font-weight: 800; letter-spacing: -.02em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.cc-res .cc-small { color: var(--muted); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.cc-lines { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
.cc-status { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; overflow-wrap: anywhere; }
.cc-status.warn { color: var(--ink); background: color-mix(in srgb, #f59e0b 14%, var(--surface)); border: 1px solid #f59e0b; border-radius: 10px; padding: 8px 12px; }
.cc-status.bad { color: var(--bad); }
.cc-status a { color: inherit; }
.cc-pairs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.cc-pairs button { font: inherit; font-size: 13.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 11px; cursor: pointer; }
.cc-pairs button:hover { border-color: var(--accent); color: var(--accent); }
.cc-h { font-size: 17px; margin: 26px 0 10px; }
.cc-chart-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.cc-read { font-size: 15px; font-weight: 600; min-height: 1.5em; margin: 10px 0 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cc-svg { width: 100%; height: auto; display: block; touch-action: pan-y; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.cc-svg:focus-visible { outline: 3px solid var(--accent-soft); }
.cc-svg text { font-size: 11px; fill: var(--muted); font-family: inherit; }
.cc-svg .grid { stroke: var(--line); stroke-width: 1; }
.cc-svg .line { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.cc-svg .area { fill: var(--accent); opacity: .1; }
.cc-svg .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.cc-svg .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.cc-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.cc-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.cc-table td:nth-child(2) { text-align: end; }
.cc-table .cc-cur { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cc-table .cc-cur span:last-child { min-width: 0; overflow-wrap: anywhere; }
.cc-table small { display: block; color: var(--muted); font-size: 12.5px; }
.cc-table b { font-size: 16px; overflow-wrap: anywhere; }
.cc-x { font: inherit; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.cc-x:hover { border-color: var(--bad); color: var(--bad); }
.cc-pop { position: absolute; z-index: 50; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 44px -10px rgba(0, 0, 0, .35); padding: 8px; }
.cc-pop input { margin-bottom: 6px; }
.cc-pop ul { list-style: none; margin: 0; padding: 0; max-height: min(340px, 50vh); overflow: auto; }
.cc-pop li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
.cc-pop li[aria-selected="true"] { background: var(--accent-soft); }
.cc-pop li b { flex: none; }
.cc-pop li span:last-child { color: var(--muted); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.cc-pop .cc-none { padding: 10px; color: var(--muted); cursor: default; }
.cc-man { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 10px; }
.cc-man span { font-weight: 600; }
details.cc-more { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 22px; }
details.cc-more summary { cursor: pointer; font-weight: 600; }
.cc-tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: color-mix(in srgb, #f59e0b 22%, var(--surface)); margin-inline-start: 4px; }
@media (max-width: 600px) {
  .cc-conv { grid-template-columns: minmax(0, 1fr); }
  .cc-swap { justify-self: center; transform: rotate(90deg); }
  .cc-man { grid-template-columns: auto minmax(0, 1fr); }
  .cc-man > :nth-child(n+3) { grid-column: 1 / -1; }
}
</style>
<div class="cc-conv">
  <div class="cc-side"><label id="ccFromL">From</label><button type="button" class="cc-pbtn" id="ccFrom" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="ccFromL ccFrom"></button>
    <input type="number" id="ccAmt" min="0" step="any" inputmode="decimal" aria-label="Amount to convert" data-nomemo></div>
  <button type="button" class="cc-swap" id="ccSwap" title="Swap currencies" aria-label="Swap the two currencies">⇄</button>
  <div class="cc-side"><label id="ccToL">To</label><button type="button" class="cc-pbtn" id="ccTo" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="ccToL ccTo"></button>
    <input type="number" id="ccAmt2" min="0" step="any" inputmode="decimal" aria-label="Converted amount (you can type here too)" data-nomemo></div>
</div>
<div class="cc-res" aria-live="polite">
  <div class="cc-small" id="ccOutA"></div>
  <div class="cc-big" id="ccOut">–</div>
  <div class="cc-lines"><span id="ccL1"></span><span id="ccL2"></span></div>
</div>
<p class="cc-status" id="ccStatus">Loading exchange rates…</p>
<div class="cc-pairs" id="ccPairs" aria-label="Popular pairs"></div>
<div class="btns"><button class="btn ghost" id="ccRefresh">Check for new rates</button><button class="btn ghost" id="ccCopy">Copy result</button></div>

<h3 class="cc-h" id="ccChartH">Rate history</h3>
<div class="cc-chart-top">
  <div class="seg" role="group" aria-label="Chart period" id="ccRange"><button type="button" data-r="7">7D</button><button type="button" data-r="30">30D</button><button type="button" data-r="90">90D</button><button type="button" data-r="365">1Y</button></div>
</div>
<p class="cc-read" id="ccRead" aria-live="polite"></p>
<svg class="cc-svg" id="ccSvg" viewBox="0 0 640 240" tabindex="0" role="img" aria-label="Exchange rate chart"></svg>
<div class="stats">
  <div class="stat"><span>High</span><b id="ccHi">–</b></div>
  <div class="stat"><span>Low</span><b id="ccLo">–</b></div>
  <div class="stat"><span>Change</span><b id="ccChg">–</b></div>
</div>
<p class="msg" id="ccChartMsg"></p>

<h3 class="cc-h">Convert to many currencies at once</h3>
<div class="scroll-x"><table class="cc-table"><tbody id="ccMulti"></tbody></table></div>
<div class="btns"><button type="button" class="btn ghost" id="ccAdd" aria-haspopup="listbox" aria-expanded="false">+ Add a currency</button></div>

<details class="cc-more">
  <summary>Currency missing, or want to use your bank's rate? Add your own</summary>
  <p class="msg" style="margin:8px 0 0">Your own rate is used only for a currency that the free rate sources do not include. It is saved on this device only.</p>
  <div class="cc-man">
    <span>1</span>
    <select id="ccManBase" aria-label="Currency you know the rate against" data-nomemo></select>
    <span>=</span>
    <input type="number" id="ccManVal" min="0" step="any" placeholder="Rate" aria-label="Rate" inputmode="decimal" data-nomemo>
    <input type="text" id="ccManCode" maxlength="3" placeholder="Code, e.g. XYZ" aria-label="Currency code" autocomplete="off" data-nomemo>
  </div>
  <div class="btns"><button class="btn" id="ccManSave">Save my rate</button></div>
  <p class="msg" id="ccManMsg"></p>
  <ul id="ccManList" style="padding-inline-start:18px;margin:6px 0 0"></ul>
</details>
<script>

  var st = load(KS, {});
  var state = { amt: st.amt != null ? String(st.amt) : '1000', from: st.from || 'USD', to: st.to || 'PKR', multi: Array.isArray(st.multi) ? st.multi : ['EUR', 'GBP', 'AED', 'SAR', 'INR'], range: [7, 30, 90, 365].indexOf(st.range) >= 0 ? st.range : 30, manBase: st.manBase || 'USD' };

  // ---------- rates: units of each currency per 1 US dollar ----------

    else { if (b >= 0) { a = b / r; $('ccAmt').value = round(a, f); } else $('ccAmt').value = ''; }
    state.amt = $('ccAmt').value; persist();
    if (a >= 0 && b >= 0) { $('ccOutA').textContent = amountStr(a, f) + ' ' + nameOf(f) + ' ='; $('ccOut').textContent = amountStr(b, t) + ' ' + nameOf(t); }
    else { $('ccOutA').textContent = ''; $('ccOut').textContent = 'Enter an amount of 0 or more'; }
    $('ccL1').textContent = '1 ' + f + ' = ' + rateStr(r) + ' ' + t;
    $('ccL2').textContent = '1 ' + t + ' = ' + rateStr(1 / r) + ' ' + f;
    var own = [f, t].filter(isManual);
    if (own.length) $('ccL2').textContent += ' · uses your own rate for ' + own.join(' and ');
  }
  $('ccAmt').addEventListener('input', function () { last = 'from'; calc(); multi(); });
  $('ccAmt2').addEventListener('input', function () { last = 'to'; calc(); multi(); });
  $('ccSwap').addEventListener('click', function () {
    var f = state.from; state.from = state.to; state.to = f;
    if (last === 'to') last = 'from';
    persist(); all();
  });

  // ---------- many currencies ----------
  function multi() {
    var tb = $('ccMulti'), a = num($('ccAmt').value), f = state.from; tb.innerHTML = '';
    state.multi.forEach(function (c) {
      var tr = document.createElement('tr'), td1 = document.createElement('td'), td2 = document.createElement('td'), td3 = document.createElement('td');
      var cur = document.createElement('div'); cur.className = 'cc-cur'; cur.appendChild(flagEl(c));
      var nm = document.createElement('span'); nm.textContent = c; var sm = document.createElement('small'); sm.textContent = nameOf(c); nm.appendChild(sm);
      if (isManual(c)) { var tg = document.createElement('span'); tg.className = 'cc-tag'; tg.textContent = 'your rate'; nm.insertBefore(tg, sm); }
      cur.appendChild(nm); td1.appendChild(cur);
      var r = rateOf(f, c), b = document.createElement('b'), s = document.createElement('small');
      b.textContent = isFinite(r) && a >= 0 ? amountStr(a * r, c) : '–';
      s.textContent = isFinite(r) ? '1 ' + f + ' = ' + rateStr(r) + ' ' + c : 'No rate available';
      td2.appendChild(b); td2.appendChild(s);
      var x = document.createElement('button'); x.className = 'cc-x'; x.type = 'button'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove ' + c);
      x.addEventListener('click', function () { state.multi = state.multi.filter(function (y) { return y !== c; }); persist(); multi(); });
      td3.appendChild(x); td3.style.width = '44px';
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tb.appendChild(tr);
    });
    if (!state.multi.length) { var tr = document.createElement('tr'), td = document.createElement('td'); td.colSpan = 3; td.className = 'msg'; td.textContent = 'Add currencies to see the same amount in each of them.'; tr.appendChild(td); tb.appendChild(tr); }
  }

  // ---------- status, honest about where and when ----------
  function when(ms) { return new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function day(iso) { var p = String(iso).split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); }
  function status() {
    var el = $('ccStatus'); el.innerHTML = '';
    function t(s) { el.appendChild(document.createTextNode(s)); }
    if (!data) { el.className = 'cc-status' + (fetchFail ? ' bad' : ''); t(fetchFail ? fetchFail + ' There are no saved rates on this device yet, so nothing can be converted. Try again when you are online.' : 'Loading exchange rates…'); return; }
    el.className = 'cc-status' + (fetchFail ? ' warn' : '');
    if (fetchFail) t(fetchFail + ' Showing the last saved rates. ');
    t('Mid-market reference rates, updated ' + (data.fiatSrc === 'erapi' ? when(data.fiatTime) : day(data.fiatTime)) + ' (published once a day; checked ' + when(data.checked) + '). ');
    if (data.fiatSrc === 'erapi') { var a = document.createElement('a'); a.href = 'https://www.exchangerate-api.com'; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Rates by Exchange Rate API'; el.appendChild(a); t('. '); }
    else t('Source: fawazahmed0 currency-api. ');
    if (data.extraDate) t('Crypto and metals: currency-api, ' + day(data.extraDate) + '. ');
    t('These are not live trading prices: banks, exchange companies and card providers add their own margin.');
  }

  // ---------- downloading ----------
  function getJSON(url) {
    var ctl = window.AbortController ? new AbortController() : null, tm = setTimeout(function () { if (ctl) ctl.abort(); }, 12000);
    return fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(tm); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }, function (e) { clearTimeout(tm); throw e; });
  }
  function firstOk(urls) { return getJSON(urls[0]).catch(function () { if (urls.length > 1) return firstOk(urls.slice(1)); throw new Error('all failed'); }); }
  function good(v) { return typeof v === 'number' && isFinite(v) && v > 0; }
  function parseEr(j) {
    if (!j || j.result !== 'success' || j.base_code !== 'USD' || !j.rates || !(j.time_last_update_unix > 0)) return null;
    var o = {}, n = 0; for (var k in j.rates) if (/^[A-Z]{3}$/.test(k) && good(j.rates[k])) { o[k] = j.rates[k]; n++; }
    return n > 50 && o.USD ? { fiat: o, time: j.time_last_update_unix * 1000 } : null;
  }
  function parseFz(j) {
    if (!j || !/^\d{4}-\d{2}-\d{2}$/.test(j.date || '') || !j.usd || typeof j.usd !== 'object') return null;
    var fiat = {}, extra = {}, n = 0;
    FIAT.forEach(function (c) { var v = j.usd[c.toLowerCase()]; if (good(v)) { fiat[c] = v; n++; } });
    Object.keys(EXTRA).forEach(function (c) { var v = j.usd[c.toLowerCase()]; if (good(v)) extra[c] = v; });
    fiat.USD = 1;
    return n > 50 ? { date: j.date, fiat: fiat, extra: extra } : null;
  }
  var busy = false;
  function refresh(quiet) {
    if (busy) return;
    if (navigator.onLine === false) { fetchFail = 'You are offline.'; status(); return; }
    busy = true; $('ccRefresh').disabled = true; if (!quiet) $('ccRefresh').textContent = 'Checking…';
    var er = getJSON(ERAPI).then(parseEr, function () { return null; });
    var fz = firstOk(fawazUrls('latest')).then(parseFz, function () { return null; });
    Promise.all([er, fz]).then(function (res) {
      var e = res[0], z = res[1];
      if (e || z) {
        data = { fiat: e ? e.fiat : z.fiat, fiatSrc: e ? 'erapi' : 'fawaz', fiatTime: e ? e.time : z.date, extra: z ? z.extra : (data && data.extra) || {}, extraDate: z ? z.date : (data && data.extraDate) || '', checked: Date.now() };
        save(KR, data); fetchFail = '';
      } else fetchFail = navigator.onLine === false ? 'You are offline.' : 'Could not download new rates right now.';
      busy = false; $('ccRefresh').disabled = false; $('ccRefresh').textContent = 'Check for new rates';
      all();
    });
  }

  // ---------- history chart ----------
  var hist = load(KH, {}), series = [], hover = -1, chartKey = '', inflight = {};
  function iso(d) { return d.toISOString().slice(0, 10); }
  function datesFor(range) {
    var step = range === 7 ? 1 : range === 30 ? 1 : range === 90 ? 3 : 7, out = [], now = new Date();
    for (var k = range; k >= 0; k -= step) { var d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - k)); var s = iso(d); if (s >= '2024-03-02') out.push(s); }
    if (out[out.length - 1] !== iso(now)) out.push(iso(now));
    return out;
  }
  function slim(z) { var o = {}; for (var k in z.fiat) o[k] = +z.fiat[k].toPrecision(8); for (k in z.extra) o[k] = +z.extra[k].toPrecision(8); return o; }
  function saveHist() {
    var keys = Object.keys(hist).sort();
    while (keys.length > 420) delete hist[keys.shift()];
    if (!save(KH, hist)) { keys.slice(0, Math.floor(keys.length / 2)).forEach(function (k) { delete hist[k]; }); save(KH, hist); }
  }
  function fetchDay(date) {
    if (inflight[date]) return inflight[date];
    return (inflight[date] = firstOk(fawazUrls(date)).then(function (j) {
      var z = parseFz(j); if (!z || z.date !== date) throw new Error('bad');
      hist[date] = slim(z); return true;
    }).catch(function () {
      var age = (Date.now() - Date.parse(date)) / 864e5;
      if (age > 3 && navigator.onLine !== false) hist[date] = 0; // not published for that day; do not ask again
      return false;
    }).then(function (ok) { delete inflight[date]; return ok; }));
  }
  function pool(list, limit, fn) {
    var i = 0, n = 0;
    return new Promise(function (done) {
      if (!list.length) return done();
      function next() { if (i >= list.length) { if (n === 0) done(); return; } var x = list[i++]; n++; fn(x).then(function () { n--; next(); }); }
      for (var k = 0; k < Math.min(limit, list.length); k++) next();
    });
  }
  function chart() {
    var f = state.from, t = state.to, range = state.range, key = f + t + range;
    document.querySelectorAll('#ccRange button').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.r === range); });
    $('ccChartH').textContent = f + ' to ' + t + ' rate history';
    if (isManual(f) || isManual(t)) { series = []; drawChart(); say('There is no history for a currency that uses your own rate.'); return; }
    var dates = datesFor(range), need = dates.filter(function (d) { return !(d in hist); });
    chartKey = key;
    build(dates);
    if (!need.length) return;
    if (navigator.onLine === false) { say(series.length ? 'You are offline. Showing the days saved on this device.' : 'You are offline. The chart needs the internet the first time.'); return; }
    say('Loading ' + need.length + ' day' + (need.length === 1 ? '' : 's') + ' of history…');
    pool(need, 6, fetchDay).then(function () { saveHist(); if (chartKey === key) build(dates, true); });
  }
  function say(t) { $('ccChartMsg').textContent = t; }
  function build(dates, after) {
    var f = state.from, t = state.to;
    series = dates.map(function (d) { var h = hist[d]; return h && good(h[f]) && good(h[t]) ? { d: d, v: h[t] / h[f] } : null; }).filter(Boolean);
    hover = -1; drawChart();
    if (after || dates.every(function (d) { return d in hist; })) {
      var miss = dates.filter(function (d) { return !hist[d]; }).length;
      say(series.length < 2 ? 'History could not be loaded for this pair right now. Try again later.' : 'Daily reference rates from the free currency-api (fawazahmed0), ' + series.length + ' days shown' + (miss ? ', ' + miss + ' day' + (miss === 1 ? '' : 's') + ' not available' : '') + '.');
    }
  }
  var W = 640, H = 240, PL = 64, PR = 14, PT = 14, PB = 28;
  function sx(i) { return PL + (series.length < 2 ? 0 : i * (W - PL - PR) / (series.length - 1)); }
  function drawChart() {
    var svg = $('ccSvg'), NS = 'http://www.w3.org/2000/svg'; svg.innerHTML = '';
    function el(n, a) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
    if (series.length < 2) {
      ['ccHi', 'ccLo', 'ccChg'].forEach(function (i) { $(i).textContent = '–'; }); $('ccRead').textContent = '';
      el('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle' }).textContent = 'No history to show yet';
      svg.setAttribute('aria-label', 'No history to show'); return;
    }
    var vs = series.map(function (p) { return p.v; }), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs), pad = (hi - lo) * 0.08 || hi * 0.01;
    var y0 = lo - pad, y1 = hi + pad;
    function sy(v) { return PT + (y1 - v) / (y1 - y0) * (H - PT - PB); }
    for (var g = 0; g <= 3; g++) { var v = y0 + (y1 - y0) * g / 3, y = sy(v); el('line', { x1: PL, x2: W - PR, y1: y, y2: y, class: 'grid' }); el('text', { x: PL - 6, y: y + 4, 'text-anchor': 'end' }).textContent = rateStr(v); }
    var d = series.map(function (p, i) { return (i ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(p.v).toFixed(1); }).join(' ');
    el('path', { d: d + ' L' + sx(series.length - 1).toFixed(1) + ' ' + (H - PB) + ' L' + PL + ' ' + (H - PB) + ' Z', class: 'area' });
    el('path', { d: d, class: 'line' });
    [0, Math.floor((series.length - 1) / 2), series.length - 1].forEach(function (i, k) { el('text', { x: sx(i), y: H - 8, 'text-anchor': k === 0 ? 'start' : k === 2 ? 'end' : 'middle' }).textContent = day(series[i].d); });
    var first = series[0].v, lastV = series[series.length - 1].v, chg = (lastV - first) / first * 100;
    $('ccHi').textContent = rateStr(hi); $('ccLo').textContent = rateStr(lo);
    $('ccChg').textContent = (chg > 0 ? '+' : '') + fmtNum(chg, 2) + '%';
    var i = hover >= 0 ? hover : series.length - 1, p = series[i];
    if (hover >= 0) { el('line', { x1: sx(i), x2: sx(i), y1: PT, y2: H - PB, class: 'cross' }); }
    el('circle', { cx: sx(i), cy: sy(p.v), r: 5, class: 'dot' });
    $('ccRead').textContent = day(p.d) + ': 1 ' + state.from + ' = ' + rateStr(p.v) + ' ' + state.to;
    svg.setAttribute('aria-label', state.from + ' to ' + state.to + ' from ' + day(series[0].d) + ' to ' + day(series[series.length - 1].d) + ': low ' + rateStr(lo) + ', high ' + rateStr(hi) + ', change ' + fmtNum(chg, 2) + ' percent. Use the arrow keys to read each day.');
  }
  function pick(e) {
    if (series.length < 2) return;
    var r = $('ccSvg').getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    var i = Math.round((x - PL) / ((W - PL - PR) / (series.length - 1)));
    i = Math.max(0, Math.min(series.length - 1, i));
    if (i !== hover) { hover = i; drawChart(); }
  }
  $('ccSvg').addEventListener('pointermove', pick);
  $('ccSvg').addEventListener('pointerdown', pick);
  $('ccSvg').addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { hover = -1; drawChart(); } });
  $('ccSvg').addEventListener('keydown', function (e) {
    if (series.length < 2) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); if (hover < 0) hover = series.length - 1; hover = Math.max(0, Math.min(series.length - 1, hover + (e.key === 'ArrowLeft' ? -1 : 1))); drawChart(); }
  });
  document.querySelectorAll('#ccRange button').forEach(function (b) { b.addEventListener('click', function () { state.range = +b.dataset.r; persist(); chart(); }); });

  // ---------- your own rates ----------
  function manualUI() {
    var sel = $('ccManBase'), keep = sel.value || state.manBase; sel.innerHTML = '';
    codes().filter(function (c) { return !isManual(c); }).forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c + ' – ' + nameOf(c); sel.appendChild(o); });
    if (!sel.options.length) ['USD', 'EUR', 'GBP'].forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
    if (sel.querySelector('option[value="' + keep + '"]')) sel.value = keep;
    var ul = $('ccManList'); ul.innerHTML = '';
    Object.keys(manual).sort().forEach(function (c) {
      var m = manual[c], li = document.createElement('li'), x = document.createElement('button');
      li.textContent = '1 ' + m.base + ' = ' + rateStr(m.value) + ' ' + c + ' (saved ' + when(m.saved) + ')' + (isManual(c) ? '' : ', not used because the rate sources now include ' + c) + ' ';
      x.type = 'button'; x.className = 'linkbtn'; x.textContent = 'Delete'; x.style.cssText = 'font:inherit;background:none;border:0;color:var(--bad);cursor:pointer;text-decoration:underline';
      x.addEventListener('click', function () { delete manual[c]; save(KM, manual); state.multi = state.multi.filter(function (y) { return y !== c || !isManual(y); }); all(); });
      li.appendChild(x); ul.appendChild(li);
    });
  }
  $('ccManBase').addEventListener('change', function () { state.manBase = $('ccManBase').value; persist(); });
  $('ccManSave').addEventListener('click', function () {
    var c = $('ccManCode').value.trim().toUpperCase(), b = $('ccManBase').value, v = num($('ccManVal').value), msg = $('ccManMsg');
    if (!/^[A-Z]{3}$/.test(c)) { msg.className = 'msg bad'; msg.textContent = 'Enter a 3-letter currency code, for example XYZ.'; return; }
    if (c === b) { msg.className = 'msg bad'; msg.textContent = 'Pick two different currencies.'; return; }
    if (data && (c in data.fiat || c in (data.extra || {}))) { msg.className = 'msg bad'; msg.textContent = c + ' is already included in the daily rates, so your own rate is not needed.'; return; }
    if (!(v > 0) || !isFinite(v)) { msg.className = 'msg bad'; msg.textContent = 'Enter a rate above 0: how many ' + c + ' you get for 1 ' + b + '.'; return; }
    manual[c] = { base: b, value: v, saved: Date.now() }; save(KM, manual);
    if (state.multi.indexOf(c) < 0) state.multi.push(c); persist();
    msg.className = 'msg ok'; msg.textContent = 'Saved: 1 ' + b + ' = ' + rateStr(v) + ' ' + c + '. You can now pick ' + c + ' as From or To.';
    $('ccManVal').value = ''; $('ccManCode').value = '';
    all();
  });

  // ---------- popular pairs ----------
  PAIRS.forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = p[0] + ' → ' + p[1];
    b.addEventListener('click', function () { state.from = p[0]; state.to = p[1]; last = 'from'; persist(); all(); });
    $('ccPairs').appendChild(b);
  });
  $('ccRefresh').addEventListener('click', function () { refresh(false); });
  $('ccCopy').addEventListener('click', function () { if ($('ccOut').textContent !== '–') copyText($('ccOutA').textContent + ' ' + $('ccOut').textContent + ' (' + $('ccL1').textContent + ')', $('ccCopy')); });

  var lastPair = '';
  function all() {
    var R = table(), list = codes();
    if (list.length && !(state.from in R)) state.from = list[0];
    if (list.length && !(state.to in R)) state.to = list.filter(function (c) { return c !== state.from; })[0] || state.from;
    calc(); multi(); status(); manualUI();
    var pair = state.from + state.to + state.range + (data ? data.checked : '');
    if (pair !== lastPair) { lastPair = pair; chart(); }
  }
  $('ccAmt').value = state.amt;
  all();
  // Rates change once a day; checking every 10 minutes keeps an open page current without hammering the free services.
  if (!data || Date.now() - data.checked > 10 * 60e3) refresh(true);
  setInterval(function () { if (!document.hidden) refresh(true); }, 10 * 60e3);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && (!data || Date.now() - data.checked > 10 * 60e3)) refresh(true); });
  window.addEventListener('online', function () { refresh(true); });
})();
</script>
