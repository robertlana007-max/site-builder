<style>
.cp-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: -4px 0 16px; }
.cp-top label { margin: 0; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.cp-top input[type=color] { width: 54px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 3px; cursor: pointer; }
.cp-stage { position: relative; background: repeating-conic-gradient(var(--line) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 14px; text-align: center; }
.cp-stage canvas#cv { max-width: 100%; max-height: 65vh; display: block; margin: 0 auto; cursor: crosshair; touch-action: none; }
.cp-stage canvas#cv:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cp-loupe { position: fixed; z-index: 1000; width: 132px; height: 132px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35); pointer-events: none; overflow: hidden; background: #fff; }
.cp-loupe canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.cp-loupe b { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.72); color: #fff; font: 600 11px/1.6 var(--mono, monospace); padding: 0 6px; border-radius: 6px; white-space: nowrap; }
.cp-cur { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; margin-bottom: 8px; }
.cp-sw { width: 96px; height: 96px; border-radius: 14px; border: 1px solid var(--line); }
.cp-cur .kv:first-child { margin-top: 0; }
.cp-h { font-size: 16px; margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cp-h .btn { min-height: 36px; padding: 5px 12px; font-size: 14px; }
.cp-h select { width: auto; min-height: 36px; padding: 4px 8px; font-size: 14px; }
.cp-h .grow { flex: 1; }
.cp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; list-style: none; padding: 0; margin: 0; }
.cp-list:empty::before { content: attr(data-empty); color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
.cp-list button { width: 100%; font: 600 12.5px/1.2 var(--mono, monospace); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 0 6px; cursor: pointer; overflow: hidden; }
.cp-list button:hover { border-color: var(--accent); }
.cp-list button i { display: block; height: 46px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.cp-list small { display: block; font: 400 11px var(--font, sans-serif); color: var(--muted); margin-top: 2px; }
@media (max-width: 480px) { .cp-cur { grid-template-columns: 1fr; } .cp-sw { width: 100%; height: 56px; } }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop an image here</b>Or paste a screenshot with Ctrl+V. The image stays on your device.</div>
<input type="file" id="file" accept="image/*" hidden data-nomemo>
<div class="cp-top">
  <label for="pick">No image? Pick any colour <input type="color" id="pick" value="#2563eb"></label>
  <button class="btn ghost" id="eye" type="button" hidden>Pick from screen</button>
  <label for="avg" style="margin-inline-start:auto">Sample <select id="avg" style="width:auto"><option value="1">1 pixel</option><option value="3">3 × 3 average</option><option value="5">5 × 5 average</option></select></label>
</div>
<div class="cp-stage" id="stage" hidden><canvas id="cv" tabindex="0" aria-label="Your image. Click or tap to pick a colour. With the keyboard, use the arrow keys to move and Enter to pick."></canvas></div>
<div class="cp-loupe" id="loupe" hidden><canvas id="lz" width="15" height="15"></canvas><b id="lhex"></b></div>

<div class="cp-cur">
  <div class="cp-sw" id="sw" style="background:#2563eb"></div>
  <div>
    <div class="kv"><span>HEX</span><code id="hex">#2563EB</code><button class="btn ghost" data-copy="hex">Copy</button></div>
    <div class="kv"><span>RGB</span><code id="rgb">rgb(37, 99, 235)</code><button class="btn ghost" data-copy="rgb">Copy</button></div>
    <div class="kv"><span>HSL</span><code id="hsl">hsl(221, 83%, 53%)</code><button class="btn ghost" data-copy="hsl">Copy</button></div>
  </div>
</div>

<h3 class="cp-h">Picked colours <span class="grow"></span><button class="btn ghost" id="copyPicked" disabled>Copy all</button><button class="btn ghost" id="clearPicked" disabled>Clear</button></h3>
<ul class="cp-list" id="picked" data-empty="Click or tap the image, and the colours you pick are listed here."></ul>

<div id="palBox" hidden>
  <h3 class="cp-h">Main colours in the image <span class="grow"></span><label for="k" style="margin:0;font-size:14px;font-weight:400">Colours <select id="k"><option>5</option><option selected>6</option><option>7</option><option>8</option></select></label><button class="btn ghost" id="copyPal">Copy palette</button></h3>
  <ul class="cp-list" id="pal"></ul>
</div>
<p class="msg" id="msg"></p>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  var cv = $('cv'), cx = cv.getContext('2d', { willReadFrequently: true }), data = null, W = 0, H = 0, picked = [], cur = [37, 99, 235], kb = null, palette = [];
  var MAX = 3000; // the picture is sampled at up to 3000 px on its longest side, which keeps phones fast

  // ---------- colour maths ----------
  function hex(c) { return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('').toUpperCase(); }
  function hsl(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
    if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = Math.round(h * 60); if (h < 0) h += 360; }
    return [h % 360, Math.round(s * 100), Math.round(l * 100)];
  }
  function fmt(c) { var h = hsl(c); return { hex: hex(c), rgb: 'rgb(' + c.join(', ') + ')', hsl: 'hsl(' + h[0] + ', ' + h[1] + '%, ' + h[2] + '%)' }; }
  function show(c) {
    cur = c; var f = fmt(c);
    $('sw').style.background = f.hex; $('hex').textContent = f.hex; $('rgb').textContent = f.rgb; $('hsl').textContent = f.hsl;
    $('pick').value = f.hex.toLowerCase();
  }
  function keep(c, how) {
    show(c);
    var h = hex(c);
    picked = picked.filter(function (p) { return hex(p) !== h; }); picked.unshift(c);
    if (picked.length > 48) picked.pop();
    list($('picked'), picked); $('copyPicked').disabled = $('clearPicked').disabled = !picked.length;
    PT.say('ok', 'Picked ' + h + (how ? ' ' + how : '') + '.');
  }
  function list(ul, cols, counts) {
    ul.innerHTML = '';
    cols.forEach(function (c, k) {
      var li = document.createElement('li'), b = document.createElement('button'), i = document.createElement('i'), f = fmt(c);
      b.type = 'button'; i.style.background = f.hex; b.appendChild(i); b.appendChild(document.createTextNode(f.hex));
      if (counts) { var s = document.createElement('small'); s.textContent = counts[k] + '%'; b.appendChild(s); }
      b.title = 'Show and copy ' + f.hex; b.setAttribute('aria-label', 'Colour ' + f.hex + (counts ? ', ' + counts[k] + '% of the image' : '') + '. Click to copy.');
      b.addEventListener('click', function () { show(c); copyText(f.hex, null); PT.say('ok', 'Copied ' + f.hex + '.'); });
      li.appendChild(b); ul.appendChild(li);
    });
  }

  // ---------- sampling ----------
  function sample(x, y) {
    var n = +$('avg').value, r = (n - 1) / 2, t = [0, 0, 0], a = 0;
    for (var j = y - r; j <= y + r; j++) for (var i = x - r; i <= x + r; i++) {
      if (i < 0 || j < 0 || i >= W || j >= H) continue;
      var o = (j * W + i) * 4, al = data[o + 3] / 255;
      // see-through pixels are shown over white, the way most apps display them
      t[0] += data[o] * al + 255 * (1 - al); t[1] += data[o + 1] * al + 255 * (1 - al); t[2] += data[o + 2] * al + 255 * (1 - al); a++;
    }
    return t.map(function (v) { return Math.round(v / a); });
  }
  function toPx(e) {
    var r = cv.getBoundingClientRect();
    return { x: Math.min(W - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * W))), y: Math.min(H - 1, Math.max(0, Math.floor((e.clientY - r.top) / r.height * H))) };
  }
  var lz = $('lz').getContext('2d', { willReadFrequently: true });
  function loupe(p, sx, sy, touch) {
    var L = $('loupe'), N = 15, h = (N - 1) / 2;
    lz.fillStyle = '#fff'; lz.fillRect(0, 0, N, N);
    lz.putImageData(cx.getImageData(p.x - h, p.y - h, N, N), 0, 0); // pixels outside the picture are left white
    L.hidden = false;
    // the 1 px loupe canvas is scaled up with crisp pixels; draw the centre marker on top with CSS-free maths
    var c = sample(p.x, p.y); $('lhex').textContent = hex(c);
    L.style.borderColor = hex(c);
    var size = 132, x = sx + 24, y = sy + 24;
    if (touch) { x = sx - size / 2; y = sy - size - 46; }
    if (x + size > innerWidth - 4) x = sx - size - 24;
    if (y < 4) y = sy + 46;
    if (y + size > innerHeight - 4) y = sy - size - 24;
    L.style.left = Math.max(4, x) + 'px'; L.style.top = Math.max(4, y) + 'px';
    return c;
  }
  // centre cross-hair inside the loupe
  (function () { var m = document.createElement('i'); m.style.cssText = 'position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);border:1.5px solid #fff;outline:1px solid #000;'; $('loupe').appendChild(m); })();

  var down = null;
  cv.addEventListener('pointerdown', function (e) {
    if (!data) return; e.preventDefault(); cv.focus({ preventScroll: true });
    down = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    loupe(toPx(e), e.clientX, e.clientY, e.pointerType !== 'mouse');
  });
  cv.addEventListener('pointermove', function (e) {
    if (!data) return;
    if (e.pointerType === 'mouse' || down === e.pointerId) loupe(toPx(e), e.clientX, e.clientY, e.pointerType !== 'mouse');
  });
  cv.addEventListener('pointerup', function (e) {
    if (down !== e.pointerId) return; down = null;
    var p = toPx(e); kb = p; keep(sample(p.x, p.y), 'at ' + (p.x + 1) + ', ' + (p.y + 1));
    if (e.pointerType !== 'mouse') $('loupe').hidden = true;
  });
  cv.addEventListener('pointercancel', function () { down = null; $('loupe').hidden = true; });
  cv.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') $('loupe').hidden = true; });
  window.addEventListener('scroll', function () { if (down === null) $('loupe').hidden = true; }, { passive: true });
  // keyboard: arrows move a cursor (Shift for bigger steps), Enter or Space picks
  cv.addEventListener('keydown', function (e) {
    if (!data) return;
    var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!kb) kb = { x: W >> 1, y: H >> 1 };
    if (d) { e.preventDefault(); var st = e.shiftKey ? Math.max(10, Math.round(W / 40)) : 1; kb = { x: Math.min(W - 1, Math.max(0, kb.x + d[0] * st)), y: Math.min(H - 1, Math.max(0, kb.y + d[1] * st)) }; }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); keep(sample(kb.x, kb.y), 'at ' + (kb.x + 1) + ', ' + (kb.y + 1)); return; }
    else if (e.key === 'Escape') { $('loupe').hidden = true; return; }
    else return;
    var r = cv.getBoundingClientRect(); var c = loupe(kb, r.left + (kb.x + 0.5) / W * r.width, r.top + (kb.y + 0.5) / H * r.height, false); show(c);
  });
  cv.addEventListener('blur', function () { if (down === null) $('loupe').hidden = true; });

  // ---------- main colours: k-means on a small copy of the picture ----------
  function extract() {
    if (!data) return;
    var k = +$('k').value, step = Math.max(1, Math.floor(Math.sqrt(W * H / 12000))), px = [];
    for (var y = 0; y < H; y += step) for (var x = 0; x < W; x += step) { var o = (y * W + x) * 4; if (data[o + 3] >= 128) px.push([data[o], data[o + 1], data[o + 2]]); }
    if (!px.length) { $('palBox').hidden = true; return; }
    // k-means++ start, with a fixed random sequence so the same picture always gives the same palette
    var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var dist = function (a, b) { var r = a[0] - b[0], g = a[1] - b[1], bl = a[2] - b[2]; return r * r * 0.3 + g * g * 0.59 + bl * bl * 0.11; };
    var cen = [px[Math.floor(rnd() * px.length)].slice()], D = new Float64Array(px.length), i, j;
    while (cen.length < k) {
      var sum = 0;
      for (i = 0; i < px.length; i++) { var m = Infinity; for (j = 0; j < cen.length; j++) m = Math.min(m, dist(px[i], cen[j])); D[i] = m; sum += m; }
      if (!sum) break; // fewer distinct colours than asked for
      var t = rnd() * sum; for (i = 0; i < px.length && (t -= D[i]) > 0; i++);
      cen.push(px[Math.min(i, px.length - 1)].slice());
    }
    var lab = new Int32Array(px.length);
    for (var it = 0; it < 20; it++) {
      var acc = cen.map(function () { return [0, 0, 0, 0]; }), moved = 0;
      for (i = 0; i < px.length; i++) {
        var best = 0, bd = Infinity; for (j = 0; j < cen.length; j++) { var dd = dist(px[i], cen[j]); if (dd < bd) { bd = dd; best = j; } }
        if (lab[i] !== best) moved++; lab[i] = best; var a = acc[best]; a[0] += px[i][0]; a[1] += px[i][1]; a[2] += px[i][2]; a[3]++;
      }
      cen = cen.map(function (c, j) { var a = acc[j]; return a[3] ? [a[0] / a[3], a[1] / a[3], a[2] / a[3]] : c; });
      if (!moved && it) break;
    }
    // specks such as blended edges (under 0.6% of the picture) are left out
    var cnt = cen.map(function () { return 0; }); for (i = 0; i < px.length; i++) cnt[lab[i]]++;
    var ord = cen.map(function (c, j) { return j; }).filter(function (j) { return cnt[j] >= px.length * 0.006; }).sort(function (a, b) { return cnt[b] - cnt[a]; });
    palette = ord.map(function (j) { return cen[j].map(Math.round); });
    list($('pal'), palette, ord.map(function (j) { return Math.max(1, Math.round(cnt[j] / px.length * 100)); }));
    $('palBox').hidden = false;
  }

  // ---------- loading ----------
  function take(f) {
    if (!f) return;
    if (!/^image\//.test(f.type)) { PT.say('bad', 'Please choose an image file, like a JPG, PNG or screenshot.'); return; }
    loadImage(f, function (img) {
      if (!img || !img.naturalWidth) { PT.say('bad', 'Could not read that image. Try a JPG or PNG.'); return; }
      var s = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      W = cv.width = Math.max(1, Math.round(img.naturalWidth * s)); H = cv.height = Math.max(1, Math.round(img.naturalHeight * s));
      cx.clearRect(0, 0, W, H); cx.drawImage(img, 0, 0, W, H);
      data = cx.getImageData(0, 0, W, H).data; kb = null;
      $('stage').hidden = false; $('loupe').hidden = true;
      extract();
      PT.say('', 'Move over the image and click, or tap, to pick a colour.' + (s < 1 ? ' (Large image shown at ' + W + ' × ' + H + ' px.)' : ''));
    });
  }
  setupDrop('drop', 'file', function (f) { $('file').value = ''; take(f); });
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) if (/^image\//.test(items[i].type)) { e.preventDefault(); take(items[i].getAsFile()); return; }
  });

  // ---------- other ways to pick ----------
  $('pick').addEventListener('input', function () { var v = $('pick').value, n = parseInt(v.slice(1), 16); show([n >> 16, n >> 8 & 255, n & 255]); });
  $('pick').addEventListener('change', function () { keep(cur, 'with the colour box'); });
  if ('EyeDropper' in window) {
    $('eye').hidden = false;
    $('eye').addEventListener('click', function () {
      new window.EyeDropper().open().then(function (r) { var n = parseInt(r.sRGBHex.slice(1, 7), 16); keep([n >> 16, n >> 8 & 255, n & 255], 'from your screen'); }, function () { PT.say('', 'Screen picking was cancelled.'); });
    });
  }
  $('avg').addEventListener('change', function () { if (kb && data) show(sample(kb.x, kb.y)); });
  $('k').addEventListener('change', extract);
  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (b) { b.addEventListener('click', function () { copyText($(b.dataset.copy).textContent, b); }); });
  $('copyPicked').addEventListener('click', function () { copyText(picked.map(hex).join('\n'), $('copyPicked')); });
  $('clearPicked').addEventListener('click', function () { picked = []; list($('picked'), picked); $('copyPicked').disabled = $('clearPicked').disabled = true; PT.say('', ''); });
  $('copyPal').addEventListener('click', function () { copyText(palette.map(hex).join(', '), $('copyPal')); });
  show(cur);
})();
</script>
