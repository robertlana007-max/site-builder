<style>
.cp-stage { position: relative; margin: 12px auto 4px; width: fit-content; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.cp-stage canvas { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); background: #fff; }
.cp-shade { position: absolute; background: rgba(0, 0, 0, .45); pointer-events: none; }
.cp-box { position: absolute; border: 2px solid var(--accent, #2563eb); box-shadow: 0 0 0 1px #fff inset; cursor: move; box-sizing: border-box; }
.cp-h { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; border: 2px solid var(--accent, #2563eb); box-sizing: border-box; touch-action: none; }
.cp-h[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; } .cp-h[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; }
.cp-h[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; } .cp-h[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; }
.cp-h[data-h=n] { left: 50%; top: 0; cursor: ns-resize; } .cp-h[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
.cp-h[data-h=w] { left: 0; top: 50%; cursor: ew-resize; } .cp-h[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; }
.cp-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
.cp-nav span { font-size: 14px; color: var(--muted); min-width: 110px; text-align: center; }
.cp-size { text-align: center; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a PDF here</b>Crop it on your device. Nothing is uploaded.</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div id="work" hidden>
  <p class="msg">Drag the box or its round handles to choose the part of the page to keep. Everything in the dark area is cut away.</p>
  <div class="cp-nav">
    <button type="button" class="btn ghost" id="prev" aria-label="Previous page">‹ Prev</button>
    <span id="pageNo">Page 1 of 1</span>
    <button type="button" class="btn ghost" id="next" aria-label="Next page">Next ›</button>
  </div>
  <div class="cp-stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="cp-shade" id="s1"></div><div class="cp-shade" id="s2"></div><div class="cp-shade" id="s3"></div><div class="cp-shade" id="s4"></div>
    <div class="cp-box" id="box"><i class="cp-h" data-h="nw"></i><i class="cp-h" data-h="n"></i><i class="cp-h" data-h="ne"></i><i class="cp-h" data-h="e"></i><i class="cp-h" data-h="se"></i><i class="cp-h" data-h="s"></i><i class="cp-h" data-h="sw"></i><i class="cp-h" data-h="w"></i></div>
  </div>
  <p class="cp-size" id="size"></p>
  <div class="btns" style="justify-content:center">
    <button type="button" class="btn ghost" id="auto">Trim white margins</button>
    <button type="button" class="btn ghost" id="reset">Reset box</button>
  </div>
  <div class="fields">
    <div><label for="apply">Crop which pages</label><select id="apply"><option value="all">All pages (same area)</option><option value="this">Only the page shown</option><option value="some">Pages I choose</option><option value="autoall">Trim white margins on every page separately</option></select></div>
    <div id="rangeBox" hidden><label for="range">Pages</label><input type="text" id="range" placeholder="For example 1-3, 5" data-nomemo></div>
  </div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Crop PDF</button><a class="btn ghost" id="dl" hidden>Download cropped PDF</a></div>
<p class="msg" id="msg"></p>
<script src="../assets/vendor/pdf-lib.min.js"></script>
<script src="../assets/vendor/pdf.min.js"></script>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  // The crop box is kept as fractions (0..1) of the visible page, measured from the top-left corner,
  // so the same area can be applied to pages of other sizes.
  var file = null, pdf = null, cur = 1, box = { l: 0, t: 0, r: 1, b: 1 }, view = null, busy = false, renderTask = null, renderToken = 0;
  var cv = $('cv'), stage = $('stage'), MIN = 0.02;

  function hideDl() { $('dl').hidden = true; }
  PT.drop(false, function (f) {
    if (busy) return PT.say('bad', 'Please wait until the current file is finished.');
    hideDl(); $('go').disabled = true; $('work').hidden = true; file = null; pdf = null;
    if (!f.size) return PT.say('bad', '"' + f.name + '" is empty.');
    if (!PT.isPdf(f)) return PT.say('bad', '"' + f.name + '" is not a PDF. Please choose a PDF file.');
    PT.say('', 'Opening ' + f.name + '…');
    PT.render(f).then(function (d) {
      file = f; pdf = d; cur = 1; box = { l: 0, t: 0, r: 1, b: 1 };
      $('work').hidden = false; $('go').disabled = false;
      PT.say('', f.name + ' · ' + d.numPages + (d.numPages === 1 ? ' page' : ' pages'));
      return show();
    }).catch(function (e) { PT.say('bad', e.message); });
  });

  function show() {
    var tk = ++renderToken;
    $('pageNo').textContent = 'Page ' + cur + ' of ' + pdf.numPages;
    $('prev').disabled = cur <= 1; $('next').disabled = cur >= pdf.numPages;
    return pdf.getPage(cur).then(function (page) {
      if (tk !== renderToken) return;
      var v1 = page.getViewport({ scale: 1 });
      var avail = Math.min(stage.parentNode.clientWidth || 600, 900), hmax = Math.max(320, window.innerHeight * 0.7);
      var s = Math.min(avail / v1.width, hmax / v1.height, 3);
      var dpr = Math.min(window.devicePixelRatio || 1, 2), vp = page.getViewport({ scale: s * dpr });
      if (renderTask) { try { renderTask.cancel(); } catch (e) {} }
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      cv.style.width = Math.floor(vp.width / dpr) + 'px';
      view = { w: v1.width, h: v1.height };
      layout();
      renderTask = page.render({ canvasContext: cv.getContext('2d'), viewport: vp });
      return renderTask.promise.catch(function (e) { if (!e || e.name !== 'RenderingCancelledException') throw e; });
    });
  }

  function layout() {
    var W = cv.clientWidth, H = cv.clientHeight, x = box.l * W, y = box.t * H, w = (box.r - box.l) * W, h = (box.b - box.t) * H;
    var B = $('box').style; B.left = x + 'px'; B.top = y + 'px'; B.width = w + 'px'; B.height = h + 'px';
    function sh(id, a, b, c, d) { var s = $(id).style; s.left = a + 'px'; s.top = b + 'px'; s.width = Math.max(0, c) + 'px'; s.height = Math.max(0, d) + 'px'; }
    sh('s1', 0, 0, W, y); sh('s2', 0, y + h, W, H - y - h); sh('s3', 0, y, x, h); sh('s4', x + w, y, W - x - w, h);
    if (view) {
      var mm = function (v) { return Math.round(v * 25.4 / 72); };
      $('size').textContent = 'Kept area: ' + mm((box.r - box.l) * view.w) + ' × ' + mm((box.b - box.t) * view.h) + ' mm (' + Math.round((box.r - box.l) * view.w / 72 * 100) / 100 + ' × ' + Math.round((box.b - box.t) * view.h / 72 * 100) / 100 + ' in)';
    }
  }
  addEventListener('resize', function () { if (pdf && !$('work').hidden) show(); });

  // Dragging the box or a handle (mouse, pen and touch).
  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    if (!pdf) return;
    var h = e.target.getAttribute && e.target.getAttribute('data-h'), r = cv.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    if (h) drag = { h: h };
    else if (e.target === $('box') && !(box.l <= 0.001 && box.t <= 0.001 && box.r >= 0.999 && box.b >= 0.999)) drag = { h: 'move', dx: px - box.l, dy: py - box.t, w: box.r - box.l, ht: box.b - box.t };
    else drag = { h: 'new', x0: Math.max(0, Math.min(1, px)), y0: Math.max(0, Math.min(1, py)) };
    stage.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var r = cv.getBoundingClientRect(), x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    var b = box;
    if (drag.h === 'move') {
      var l = Math.max(0, Math.min(1 - drag.w, x - drag.dx)), t = Math.max(0, Math.min(1 - drag.ht, y - drag.dy));
      box = { l: l, t: t, r: l + drag.w, b: t + drag.ht };
    } else if (drag.h === 'new') {
      if (Math.abs(x - drag.x0) < MIN || Math.abs(y - drag.y0) < MIN) return;
      box = { l: Math.min(x, drag.x0), t: Math.min(y, drag.y0), r: Math.max(x, drag.x0), b: Math.max(y, drag.y0) };
    } else {
      var n = { l: b.l, t: b.t, r: b.r, b: b.b };
      if (/w/.test(drag.h)) n.l = Math.min(x, b.r - MIN);
      if (/e/.test(drag.h)) n.r = Math.max(x, b.l + MIN);
      if (/n/.test(drag.h)) n.t = Math.min(y, b.b - MIN);
      if (/s/.test(drag.h)) n.b = Math.max(y, b.t + MIN);
      box = n;
    }
    hideDl(); layout();
  });
  function end() { drag = null; }
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

  $('prev').addEventListener('click', function () { if (cur > 1) { cur--; show(); } });
  $('next').addEventListener('click', function () { if (cur < pdf.numPages) { cur++; show(); } });
  $('reset').addEventListener('click', function () { box = { l: 0, t: 0, r: 1, b: 1 }; hideDl(); layout(); });
  $('apply').addEventListener('change', function () { $('rangeBox').hidden = $('apply').value !== 'some'; hideDl(); });
  $('range').addEventListener('input', hideDl);

  // Find the part of a page that is not (almost) white. Returns fractions, or null for a blank page.
  async function contentBox(n) {
    var page = await pdf.getPage(n), v1 = page.getViewport({ scale: 1 }), s = Math.min(2, 1000 / Math.max(v1.width, v1.height));
    var vp = page.getViewport({ scale: s }), c = document.createElement('canvas');
    c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
    var ctx = c.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    var d = ctx.getImageData(0, 0, c.width, c.height).data, W = c.width, H = c.height, x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var i = (y * W + x) * 4;
      if (d[i] < 235 || d[i + 1] < 235 || d[i + 2] < 235) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    c.width = c.height = 0;
    if (x1 < 0) return null;
    var pad = 6 * s; // a small white border looks better than cutting right at the ink
    return { l: Math.max(0, (x0 - pad) / W), t: Math.max(0, (y0 - pad) / H), r: Math.min(1, (x1 + 1 + pad) / W), b: Math.min(1, (y1 + 1 + pad) / H) };
  }
  $('auto').addEventListener('click', function () {
    if (!pdf) return;
    contentBox(cur).then(function (b) {
      if (!b) return PT.say('bad', 'This page looks blank, so there is nothing to trim.');
      box = b; hideDl(); layout(); PT.say('', 'The box now fits the content of page ' + cur + '.');
    });
  });

  $('go').addEventListener('click', function () {
    if (!pdf || busy) return;
    busy = true;
    PT.run(async function () {
      var mode = $('apply').value, doc = await PT.open(file), pages = doc.getPages(), n = pages.length, list;
      if (mode === 'all' || mode === 'autoall') list = pages.map(function (p, i) { return i; });
      else if (mode === 'this') list = [cur - 1];
      else list = PT.ranges($('range').value, n);
      if (mode !== 'autoall' && box.l <= 0.0005 && box.t <= 0.0005 && box.r >= 0.9995 && box.b >= 0.9995) throw new Error('The box covers the whole page, so nothing would be cut. Drag the box smaller first, or press Trim white margins.');
      var blank = 0;
      for (var k = 0; k < list.length; k++) {
        var i = list[k], b = box;
        if (mode === 'autoall') {
          PT.say('', 'Finding the margins of page ' + (i + 1) + ' of ' + n + '…');
          b = await contentBox(i + 1);
          if (!b) { blank++; continue; }
        }
        var pg = pages[i], v = PT.view(pg);
        // The fractions are from the top-left of the page as seen; PT.view's at() wants points from the bottom-left.
        var p1 = v.at(b.l * v.width, (1 - b.b) * v.height), p2 = v.at(b.r * v.width, (1 - b.t) * v.height);
        var x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y), w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
        pg.setCropBox(x, y, w, h);
        pg.setMediaBox(x, y, w, h); // so every reader and printer uses the new size
        pg.node.delete(PDFLib.PDFName.of('BleedBox')); pg.node.delete(PDFLib.PDFName.of('TrimBox')); pg.node.delete(PDFLib.PDFName.of('ArtBox'));
      }
      var bytes = await doc.save();
      var done = list.length - blank;
      PT.done(bytes, PT.base(file.name) + '-cropped.pdf', 'application/pdf', 'Cropped ' + done + (done === 1 ? ' page' : ' pages') + (blank ? ' (' + (blank === 1 ? '1 blank page was left as it was' : blank + ' blank pages were left as they were') + ')' : ''));
    }).then(function () { busy = false; });
  });
})();
</script>
