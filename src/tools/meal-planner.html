<style>
.mp fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 4px; margin: 0 0 14px; min-width: 0; }
.mp legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.mp h3 { font-size: 18px; margin: 22px 0 8px; }
.mp .mp-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
.mp .mp-nav b { flex: 1 1 200px; font-size: 17px; text-align: center; }
.mp .mp-nav .btn { min-height: 44px; }
.mp .mp-week { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.mp .mp-day { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--surface); min-width: 0; }
.mp .mp-day.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.mp .mp-day h4 { margin: 2px 0 6px; font-size: 15.5px; }
.mp .mp-slot { border-top: 1px solid var(--line); padding: 6px 0; }
.mp .mp-slot > span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.mp .mp-e { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 14.5px; }
.mp .mp-e > span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.mp .mp-e small { color: var(--muted); white-space: nowrap; }
.mp .mp-e.note > span { font-style: italic; }
.mp .mp-ib { min-width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; padding: 0 8px; flex: 0 0 auto; }
.mp .mp-ib.x { color: var(--muted); font-size: 17px; padding: 0; width: 34px; }
.mp .mp-ib.x:hover { color: var(--bad); border-color: var(--bad); }
.mp .mp-add { font: inherit; font-size: 13.5px; color: var(--accent); background: none; border: 1px dashed var(--line); border-radius: 8px; min-height: 36px; padding: 2px 10px; cursor: pointer; margin-top: 2px; }
.mp .mp-pick { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 6px 0; display: grid; gap: 6px; }
.mp .mp-pick select, .mp .mp-pick input { width: 100%; box-sizing: border-box; min-width: 0; }
.mp .mp-pick .row { display: flex; gap: 6px; align-items: end; flex-wrap: wrap; }
.mp .mp-pick .row > div { flex: 1 1 90px; min-width: 0; }
.mp .mp-pick label { font-size: 13px; }
.mp .mp-shop { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mp .mp-shop li { display: flex; align-items: center; gap: 10px; padding: 4px 10px; border-bottom: 1px solid var(--line); min-height: 48px; }
.mp .mp-shop li:last-child { border-bottom: 0; }
.mp .mp-shop label { flex: 1 1 auto; display: flex; gap: 10px; align-items: center; margin: 0; font-weight: 400; font-size: 15px; cursor: pointer; min-height: 44px; min-width: 0; overflow-wrap: anywhere; }
.mp .mp-shop input { width: 22px; height: 22px; flex: 0 0 22px; accent-color: var(--ok); }
.mp .mp-shop li.got label span { text-decoration: line-through; color: var(--muted); }
.mp .mp-shop .q { font-variant-numeric: tabular-nums; font-weight: 600; text-align: end; white-space: nowrap; }
.mp .mp-shop small { display: block; color: var(--muted); font-size: 12px; }
.mp .mp-cat { margin: 14px 0 4px; font-size: 15px; }
.mp .mp-hint { font-size: 13.5px; color: var(--muted); margin: 4px 0 10px; }
.mp .mp-empty { color: var(--muted); padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.mp .mp-rec { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.mp .mp-rc { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mp .mp-rc b { overflow-wrap: anywhere; }
.mp .mp-rc small { color: var(--muted); }
.mp .mp-rc .act { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
.mp textarea { width: 100%; box-sizing: border-box; min-height: 150px; font: inherit; font-size: 15px; }
.mp .mp-parse { font-size: 13px; color: var(--muted); margin: 4px 0 10px; overflow-wrap: anywhere; }
.mp .btns .btn { min-height: 44px; }
.mp details summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
</style>
<div class="mp">
<div class="fields">
  <div><label for="mpPeople">People eating</label><input type="number" id="mpPeople" data-nomemo min="1" max="50" value="2" inputmode="numeric"></div>
  <div><label for="mpUnits">Shopping list units</label><select id="mpUnits" data-nomemo><option value="metric">Metric (g, kg, ml, L)</option><option value="us">US (oz, lb, cups)</option></select></div>
  <div><label for="mpWs">Week starts on</label><select id="mpWs" data-nomemo><option value="1">Monday</option><option value="0">Sunday</option><option value="6">Saturday</option></select></div>
</div>

<div class="mp-nav">
  <button type="button" class="btn ghost" id="mpPrev" aria-label="Previous week">‹ Prev</button>
  <b id="mpWkLabel" aria-live="polite"></b>
  <button type="button" class="btn ghost" id="mpNext" aria-label="Next week">Next ›</button>
  <button type="button" class="btn ghost" id="mpToday">This week</button>
</div>
<div class="mp-week" id="mpWeek"></div>
<div class="btns">
  <button type="button" class="btn" id="mpPlanPdf">Print weekly plan</button>
  <button type="button" class="btn ghost" id="mpCopy">Copy last week</button>
  <button type="button" class="btn ghost danger" id="mpClear">Clear this week</button>
</div>

<h3 id="mpShopH">Shopping list for this week</h3>
<p class="mp-hint">Made from every recipe in the week, scaled to the servings you chose. The same ingredients are added together. Tick what you already have.</p>
<div id="mpShop"></div>
<div class="btns">
  <button type="button" class="btn" id="mpShopPdf">Print shopping list</button>
  <button type="button" class="btn ghost" id="mpShare">Share as text</button>
  <a class="btn ghost" id="mpWa" href="#" target="_blank" rel="noopener">WhatsApp</a>
  <button type="button" class="btn ghost" id="mpToGrocery">Send to Grocery List</button>
</div>

<h3>Recipes</h3>
<div class="fields">
  <div><label for="mpSearch">Find a recipe</label><input type="search" id="mpSearch" data-nomemo maxlength="60" placeholder="Name, cuisine or ingredient"></div>
  <div><label for="mpCuisine">Cuisine</label><select id="mpCuisine" data-nomemo></select></div>
</div>
<div class="mp-rec" id="mpRecipes"></div>

<fieldset style="margin-top:14px" id="mpForm"><legend id="mpFormT">Add your own recipe</legend>
  <div class="fields">
    <div><label for="mpRName">Recipe name</label><input type="text" id="mpRName" data-nomemo maxlength="80" placeholder="e.g. Grandma's chicken soup"></div>
    <div><label for="mpRCuisine">Cuisine (optional)</label><input type="text" id="mpRCuisine" data-nomemo maxlength="30" list="mpCuisines" placeholder="e.g. Turkish"><datalist id="mpCuisines"></datalist></div>
    <div><label for="mpRMeal">Usually for</label><select id="mpRMeal" data-nomemo><option value="main">Lunch or dinner</option><option value="breakfast">Breakfast</option><option value="snack">Snack or side</option></select></div>
    <div><label for="mpRServes">Serves</label><input type="number" id="mpRServes" data-nomemo min="1" max="100" value="4" inputmode="numeric"></div>
  </div>
  <label for="mpRIng">Ingredients, one per line (amount, unit, ingredient)</label>
  <textarea id="mpRIng" data-nomemo maxlength="4000" placeholder="500 g chicken&#10;2 onions&#10;1 tbsp olive oil&#10;1 can chopped tomatoes&#10;salt to taste"></textarea>
  <p class="mp-parse" id="mpParse"></p>
  <label for="mpRMethod">Method (optional)</label>
  <textarea id="mpRMethod" data-nomemo maxlength="4000" style="min-height:90px"></textarea>
  <div class="btns">
    <button type="button" class="btn" id="mpRSave">Save recipe</button>
    <button type="button" class="btn ghost" id="mpRCancel" hidden>Cancel</button>
  </div>
</fieldset>

<details>
  <summary>Backup and more</summary>
  <div class="fields"><div><label for="mpPaper">Paper size</label><select id="mpPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div></div>
  <div class="btns">
    <button type="button" class="btn ghost" id="mpCsv">Shopping list CSV</button>
    <button type="button" class="btn ghost" id="mpBackup">Export plans and recipes (JSON)</button>
    <button type="button" class="btn ghost" id="mpImportBtn">Import</button>
    <input type="file" id="mpImport" data-nomemo accept="application/json,.json" hidden>
    <button type="button" class="btn ghost" id="mpSamples">Bring back sample recipes</button>
  </div>
</details>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<a id="dl" hidden></a>
</div>

    var items = [];
    shopping().forEach(function (o) {
      if (H[o.key]) return; var base = { name: o.name, cat: o.cat, prices: {}, done: false };
      var us = st.units === 'us', parts = 0;
      Object.keys(o.cnt).forEach(function (u) { parts++; var v = cntText(o.cnt[u], u); if (!u) items.push(Object.assign({ id: uid(), qty: o.cnt[u] >= 1 ? Math.ceil(o.cnt[u] - 1e-9) : .5, unit: 'pcs' }, base)); else if (u === 'can' || u === 'bunch' || u === 'pack') items.push(Object.assign({ id: uid(), qty: Math.ceil(o.cnt[u] - 1e-9), unit: u }, base)); else items.push(Object.assign({ id: uid(), qty: 1, unit: 'pcs' }, base, { name: o.name + ' (' + v + ')' })); });
      if (o.g) { parts++; var gq = us ? o.g / 28.3495 : o.g; items.push(Object.assign({ id: uid(), qty: us ? (gq < 16 ? r2(gq, .5) : Math.ceil(gq / 16 * 100) / 100) : (gq < 1000 ? r2(gq, 5) : Math.ceil(gq / 10) / 100), unit: us ? (gq < 16 ? 'oz' : 'lb') : (gq < 1000 ? 'g' : 'kg') }, base)); }
      if (o.ml) { parts++; if (o.ml < 60 || us) items.push(Object.assign({ id: uid(), qty: 1, unit: 'pcs' }, base, { name: o.name + ' (' + volText(o.ml, o.spoon) + ')' })); else items.push(Object.assign({ id: uid(), qty: o.ml < 1000 ? r2(o.ml, 5) : Math.ceil(o.ml / 10) / 100, unit: o.ml < 1000 ? 'ml' : 'l' }, base)); }
      if (!parts) items.push(Object.assign({ id: uid(), qty: 1, unit: 'pcs' }, base));
    });
    if (!items.length) return say('', 'You have ticked everything as already at home, so there is nothing to send.');
    var id = uid(); g.lists.push({ id: id, name: ('Meals ' + weekLabel()).slice(0, 50), budget: null, at: 'mix', items: items.slice(0, 500) }); g.cur = id;
    if (!storeSet('gtn-grocery-list', g)) return;
    $('msg').className = 'msg ok'; $('msg').innerHTML = 'Sent ' + items.length + ' items to a new list in the <a href="../grocery-list/">Grocery List</a> tool.';
  });

  // ---------- recipes ----------
  function renderRecipes() {
    var cu = {}; st.recipes.forEach(function (r) { if (r.cuisine) cu[r.cuisine] = 1; });
    var sel = $('mpCuisine').value, names = Object.keys(cu).sort(function (a, b) { return a.localeCompare(b); });
    $('mpCuisine').innerHTML = '<option value="">All cuisines (' + st.recipes.length + ')</option>' + names.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
    $('mpCuisine').value = cu[sel] ? sel : '';
    $('mpCuisines').innerHTML = names.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    var q = $('mpSearch').value.trim().toLowerCase(), c = $('mpCuisine').value;
    var rs = st.recipes.filter(function (r) { return (!c || r.cuisine === c) && (!q || (r.name + ' ' + r.cuisine + ' ' + r.ing.map(function (i) { return i.n; }).join(' ')).toLowerCase().indexOf(q) >= 0); }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var ML = { main: 'Lunch or dinner', breakfast: 'Breakfast', snack: 'Snack or side' };
    $('mpRecipes').innerHTML = rs.length ? rs.map(function (r) {
      return '<div class="mp-rc"><b>' + esc(r.name) + '</b><small>' + esc([r.cuisine, ML[r.meal], 'serves ' + r.serves, r.ing.length + ' ingredients'].filter(Boolean).join(' · ')) + '</small>' +
        '<div class="act"><button type="button" class="mp-ib" data-a="view" data-id="' + esc(r.id) + '">View</button><button type="button" class="mp-ib" data-a="edit" data-id="' + esc(r.id) + '">Edit</button><button type="button" class="mp-ib x" data-a="del" data-id="' + esc(r.id) + '" aria-label="Delete ' + esc(r.name) + '">×</button></div><div class="mp-view" hidden></div></div>';
    }).join('') : '<p class="mp-empty">No recipes match. Clear the search or add your own below.</p>';
  }
  $('mpSearch').addEventListener('input', renderRecipes);
  $('mpCuisine').addEventListener('change', renderRecipes);
  $('mpRecipes').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var r = recipe(b.dataset.id); if (!r) return;
    if (b.dataset.a === 'view') {
      var v = b.closest('.mp-rc').querySelector('.mp-view'); v.hidden = !v.hidden; b.textContent = v.hidden ? 'View' : 'Hide';
      if (!v.hidden) v.innerHTML = '<ul style="margin:4px 0;padding-inline-start:18px;font-size:14px">' + r.ing.map(function (i) { return '<li>' + esc(lineText(i)) + '</li>'; }).join('') + '</ul>' + (r.method ? '<p style="font-size:14px;margin:4px 0">' + esc(r.method) + '</p>' : '');
    } else if (b.dataset.a === 'edit') {
      editId = r.id; $('mpFormT').textContent = 'Edit recipe'; $('mpRCancel').hidden = false; $('mpRName').value = r.name; $('mpRCuisine').value = r.cuisine; $('mpRMeal').value = r.meal; $('mpRServes').value = r.serves;
      $('mpRIng').value = r.ing.map(lineText).join('\n'); $('mpRMethod').value = r.method; showParse(); $('mpForm').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('mpRName').focus({ preventScroll: true });
    } else if (b.dataset.a === 'del') {
      var used = Object.keys(st.plans).filter(function (wk) { return Object.keys(st.plans[wk]).some(function (k) { return st.plans[wk][k].some(function (x) { return x.r === r.id; }); }); }).length;
      if (!confirm('Delete the recipe "' + r.name + '"?' + (used ? ' It is planned in ' + used + (used === 1 ? ' week' : ' weeks') + ' and will be removed from them.' : ''))) return;
      st.recipes = st.recipes.filter(function (x) { return x !== r; });
      Object.keys(st.plans).forEach(function (wk) { Object.keys(st.plans[wk]).forEach(function (k) { st.plans[wk][k] = st.plans[wk][k].filter(function (x) { return x.r !== r.id; }); if (!st.plans[wk][k].length) delete st.plans[wk][k]; }); });
      if (editId === r.id) resetForm();
      save(); renderRecipes(); renderWeek(); renderShop(); say('ok', 'Deleted "' + r.name + '".');
    }
  });
  function readIng() { return $('mpRIng').value.split(/\r?\n/).map(parseLine).filter(Boolean); }
  function showParse() { var ing = readIng(); $('mpParse').textContent = ing.length ? 'Read as: ' + ing.slice(0, 12).map(function (i) { return (i.q == null ? '(as needed) ' : nfmt(i.q, 2) + (i.u ? ' ' + (i.u === 'floz' ? 'fl oz' : i.u) : '') + ' · ') + i.n; }).join('; ') + (ing.length > 12 ? '; …' : '') : ''; }
  var pt = null; $('mpRIng').addEventListener('input', function () { clearTimeout(pt); pt = setTimeout(showParse, 250); });
  function resetForm() { editId = ''; $('mpFormT').textContent = 'Add your own recipe'; $('mpRCancel').hidden = true; ['mpRName', 'mpRCuisine', 'mpRIng', 'mpRMethod'].forEach(function (id) { $(id).value = ''; }); $('mpRMeal').value = 'main'; $('mpRServes').value = 4; $('mpParse').textContent = ''; }
  $('mpRCancel').addEventListener('click', function () { resetForm(); say('', ''); });
  $('mpRSave').addEventListener('click', function () {
    var name = $('mpRName').value.trim().replace(/\s+/g, ' '); if (!name) { say('bad', 'Give the recipe a name.'); $('mpRName').focus(); return; }
    var sv = num($('mpRServes').value); if (!(sv >= 1 && sv <= 100) || Math.round(sv) !== sv) { say('bad', 'Serves must be a whole number from 1 to 100.'); $('mpRServes').focus(); return; }
    var ing = readIng(); if (!ing.length) { say('bad', 'Add at least one ingredient, one per line, like "200 g rice".'); $('mpRIng').focus(); return; }
    if (ing.length > 80) return say('bad', 'A recipe can have up to 80 ingredients.');
    var o = { name: name.slice(0, 80), cuisine: $('mpRCuisine').value.trim().slice(0, 30), meal: $('mpRMeal').value, serves: sv, ing: ing, method: $('mpRMethod').value.trim().slice(0, 4000) };
    if (editId) { var r = recipe(editId); if (r) { Object.assign(r, o); r.sample = false; } say('ok', 'Saved changes to "' + o.name + '".'); }
    else { if (st.recipes.length >= 500) return say('bad', 'You can keep up to 500 recipes.'); o.id = uid(); o.sample = false; st.recipes.push(o); say('ok', 'Saved "' + o.name + '". Add it to a meal with + Add in the week above.'); }
    resetForm(); save(); renderRecipes(); renderWeek(); renderShop();
  });
  $('mpSamples').addEventListener('click', function () {
    var have2 = {}; st.recipes.forEach(function (r) { have2[r.id] = 1; }); var add = sampleRecipes().filter(function (r) { return !have2[r.id]; });
    if (!add.length) return say('', 'All the sample recipes are already there.');
    st.recipes = st.recipes.concat(add); save(); renderRecipes(); say('ok', 'Brought back ' + add.length + ' sample recipes.');
  });

  // ---------- settings ----------
  $('mpPeople').addEventListener('change', function () { var v = num(this.value); if (!(v >= 1 && v <= 50) || Math.round(v) !== v) { say('bad', 'People eating must be a whole number from 1 to 50.'); this.value = st.people; return; } st.people = v; save(); say('', 'New meals will be planned for ' + v + (v === 1 ? ' person.' : ' people.') + ' Meals already planned keep their servings.'); });
  $('mpUnits').addEventListener('change', function () { st.units = this.value === 'us' ? 'us' : 'metric'; save(); renderShop(); });
  $('mpWs').addEventListener('change', function () { var old = st.ws, nw = +this.value; if (Object.keys(st.plans).some(function (w) { return Object.keys(st.plans[w]).length; })) { st.plans = shiftPlans(st.plans, old, nw); } st.ws = nw; st.wk = weekOf(today()); save(); renderWeek(); renderShop(); });
  // keep each meal on its real date when the first day of the week changes
  function shiftPlans(plans, a, b) {
    var out = {};
    Object.keys(plans).forEach(function (wk) { Object.keys(plans[wk]).forEach(function (k) {
      var date = addDays(wk, +k[0]), p = date.split('-'), dow = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(), nwk = addDays(date, -((dow - b + 7) % 7)), nk = dayDiff(nwk, date) + k[1];
      out[nwk] = out[nwk] || {}; out[nwk][nk] = (out[nwk][nk] || []).concat(plans[wk][k]);
    }); });
    st.have = {};
    return out;
  }
  $('mpPaper').addEventListener('change', function () { st.paper = this.value; save(); });

  // ---------- PDFs ----------
  $('mpPlanPdf').addEventListener('click', function () {
    var P = plan(); if (!Object.keys(P).length) return say('bad', 'This week is empty. Add some meals first.');
    var rows = [], used = {};
    for (var d = 0; d < 7; d++) rows.push([dayLabel(addDays(st.wk, d))].concat(SLOTS.map(function (s) { return (P[d + s[0]] || []).map(function (e) { if (e.r) used[e.r] = 1; return entryText(e) + (e.r ? ' (×' + nfmt(e.s, 1) + ')' : ''); }).join('\n'); })));
    var blocks = [{ kind: 'table', title: 'Meals', cols: [{ h: 'Day', w: 1.1 }, { h: 'Breakfast', w: 2 }, { h: 'Lunch', w: 2 }, { h: 'Dinner', w: 2 }, { h: 'Snacks', w: 1.7 }], rows: rows }];
    Object.keys(used).map(recipe).filter(Boolean).sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (r) {
      blocks.push({ kind: 'note', title: r.name + ' – serves ' + r.serves + (r.cuisine ? ' (' + r.cuisine + ')' : ''), text: r.ing.map(function (i) { return '• ' + lineText(i); }).join('\n') + (r.method ? '\n\n' + r.method : '') });
    });
    docDownload(this, { paper: st.paper, landscape: true, title: 'Meal plan', docTitle: 'Meal plan ' + weekLabel(), biz: weekLabel(), meta: [['People', String(st.people)]], blocks: blocks, accent: '#b45309', footer: 'Made with GetToolNest Meal Planner' }, 'meal-plan-' + st.wk + '.pdf', $('dl'));
  });
  $('mpShopPdf').addEventListener('click', function () {
    if (!needShop()) return; var H = have(), list = shopping(), blocks = [];
    CATS.forEach(function (c) { var g = list.filter(function (o) { return o.cat === c; }); if (g.length) blocks.push({ kind: 'checks', title: c, two: true, rows: g.map(function (o) { return [o.name, o.text, !!H[o.key]]; }) }); });
    docDownload(this, { paper: st.paper, title: 'Shopping list', docTitle: 'Shopping list ' + weekLabel(), biz: weekLabel(), meta: [['Items', String(list.length)]], blocks: blocks, accent: '#b45309', footer: 'Made with GetToolNest Meal Planner' }, 'shopping-list-' + st.wk + '.pdf', $('dl'));
  });

  // ---------- backup ----------
  $('mpBackup').addEventListener('click', function () { download('meal-planner-' + today() + '.json', JSON.stringify({ app: KEY, v: 1, saved: new Date().toISOString(), recipes: st.recipes, plans: st.plans, have: st.have, people: st.people, units: st.units, ws: st.ws }, null, 1), 'application/json'); say('ok', 'Exported ' + st.recipes.length + ' recipes and ' + Object.keys(st.plans).filter(function (w) { return Object.keys(st.plans[w]).length; }).length + ' planned weeks.'); });
  $('mpImportBtn').addEventListener('click', function () { $('mpImport').click(); });
  $('mpImport').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    if (!/\.json$/i.test(f.name) && f.type !== 'application/json') return say('bad', '"' + f.name + '" is not a meal planner backup. Choose the .json file you exported here.');
    if (f.size > 8e6) return say('bad', 'That file is too big to be a meal planner backup.');
    readText(f).then(function (t) {
      var o; try { o = JSON.parse(t); } catch (e) { o = null; }
      var c = o && o.app === KEY ? cleanState(o) : null;
      if (!c || !c.recipes.length) return say('bad', 'This file is not a meal planner backup from this tool. Nothing was changed.');
      if (!confirm('Replace your recipes and meal plans with the ones in "' + f.name + '"?')) return;
      c.paper = st.paper; c.wk = weekOf(today()); st = c; st.wk = weekOf(today()); save(); toForm(); renderWeek(); renderShop(); renderRecipes(); say('ok', 'Imported ' + st.recipes.length + ' recipes.');
    }, function () { say('bad', 'That file could not be read.'); });
  });

  function toForm() { $('mpPeople').value = st.people; $('mpUnits').value = st.units; $('mpWs').value = String(st.ws); $('mpPaper').value = st.paper; }
  toForm(); renderWeek(); renderShop(); renderRecipes(); save();
})();
</script>
