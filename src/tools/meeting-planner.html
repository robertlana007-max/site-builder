<style>
.mp-rows { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
.mp-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; }
.mp-row:first-child { border-color: var(--accent); }
.mp-name { font-weight: 700; overflow-wrap: anywhere; }
.mp-name small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.mp-name .mp-main { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); margin-inline-start: 6px; vertical-align: 2px; }
.mp-set { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; color: var(--muted); }
.mp-set select { width: auto; min-height: 36px; padding: 4px 8px; font-size: 14px; }
.mp-btns { display: flex; gap: 4px; }
.mp-btns button { font: inherit; font-size: 13px; height: 34px; min-width: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.mp-btns button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.mp-btns button[disabled] { opacity: .35; cursor: default; }
.mp-picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mp-picks button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; text-align: start; }
.mp-picks button:hover { border-color: var(--accent); color: var(--accent); }
.mp-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; margin-top: 16px; -webkit-overflow-scrolling: touch; }
.mp-grid { border-collapse: separate; border-spacing: 2px; font-size: 13px; font-variant-numeric: tabular-nums; }
.mp-grid th { position: sticky; inset-inline-start: 0; z-index: 1; background: var(--surface); text-align: start; font-weight: 600; padding: 4px 8px; min-width: 96px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-grid td { min-width: 38px; height: 34px; text-align: center; border-radius: 6px; cursor: pointer; padding: 0 2px; line-height: 1.05; }
.mp-grid td small { display: block; font-size: 10px; opacity: .8; }
.mp-grid td.work { background: #bbf7d0; color: #14532d; }
.mp-grid td.edge { background: #fef3c7; color: #713f12; }
.mp-grid td.night { background: #cbd5e1; color: #1e293b; }
.mp-grid td.off { background: repeating-linear-gradient(135deg, #e2e8f0 0 5px, #f1f5f9 5px 10px); color: #475569; }
[data-theme="dark"] .mp-grid td.work { background: #166534; color: #dcfce7; } [data-theme="dark"] .mp-grid td.edge { background: #713f12; color: #fef3c7; }
[data-theme="dark"] .mp-grid td.night { background: #1e293b; color: #cbd5e1; } [data-theme="dark"] .mp-grid td.off { background: repeating-linear-gradient(135deg, #334155 0 5px, #1e293b 5px 10px); color: #cbd5e1; }
.mp-grid td.sel { outline: 3px solid var(--accent); outline-offset: -1px; }
.mp-grid tr.score td { height: 22px; background: none; color: var(--ok); font-weight: 700; cursor: pointer; }
.mp-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.mp-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 4px; }
.mp-best { margin: 14px 0 0; }

.mp-slot ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }

.mp-slot li span { color: var(--muted); font-size: 14px; }

<div class="fields">
  <div><label for="mpDate">Date</label><input type="date" id="mpDate" data-nomemo></div>
  <div><label for="mpDur">Meeting length</label><select id="mpDur" data-nomemo><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>1 hour</option><option value="90">1 hour 30 minutes</option><option value="120">2 hours</option><option value="180">3 hours</option></select></div>

</div>
<ul class="mp-rows" id="mpRows" aria-label="Cities in the meeting"></ul>
<label for="mpFind">Add a city or time zone</label>
<input type="text" id="mpFind" data-nomemo autocomplete="off" placeholder="Search a city, country or zone, e.g. Nairobi, Mexico, Asia/Manila">
<div class="mp-picks" id="mpPicks"></div>
<p class="msg" id="mpMsg"></p>
<div class="mp-wrap" id="mpWrap"><table class="mp-grid" id="mpGrid"></table></div>
<div class="mp-legend"><span><i style="background:#bbf7d0"></i>Working hours</span><span><i style="background:#fef3c7"></i>Early or late</span><span><i style="background:#cbd5e1"></i>Night</span><span><i style="background:#e2e8f0"></i>Weekend</span><span style="color:var(--ok);font-weight:700">✓ Everyone is working</span></div>
<p class="notice mp-best" id="mpBest"></p>
<div class="mp-slot" id="mpSlot" hidden>
  <b id="mpSlotHead"></b>
  <ul id="mpSlotList"></ul>
  <label for="mpTitle" style="margin-top:12px">Meeting title (optional)</label>
  <input type="text" id="mpTitle" data-nomemo autocomplete="off" placeholder="For example: Weekly project call">
  <label for="mpInvite" style="margin-top:10px">Invite text</label>
  <textarea id="mpInvite" class="plain" data-nomemo readonly></textarea>
  <div class="btns"><button class="btn" id="mpCopy" type="button">Copy invite text</button><a class="btn ghost" id="mpIcs" download="meeting.ics">Download calendar file (.ics)</a></div>
</div>

  function status(r, t, len) {
    var p = parts(t, r.zone), m = p.h * 60 + p.mi, wk = r.wk ? r.wk.split(',').map(Number) : [];
    if (wk.indexOf(p.wd) !== -1) return 'off';
    if (m >= r.from && m + len <= r.to) return 'work';
    if (m >= 420 && m + len <= 1320) return 'edge';
    return 'night';
  }
  function grid() {
    var d = $('mpDate').value.split('-').map(Number), g = $('mpGrid'), base = rows[0].zone;
    g.innerHTML = ''; cols = [];
    if (d.length !== 3 || !d[0]) { $('mpBest').textContent = 'Pick a date.'; return; }
    var t0 = midnight(d[0], d[1], d[2], base);
    for (var c = 0; c < 26; c++) { var t = t0 + c * 36e5, p = parts(t, base); if (c && (p.d !== d[2])) break; cols.push(t); }
    rows.forEach(function (r, i) {
      var tr = document.createElement('tr'), th = document.createElement('th'); th.scope = 'row'; th.textContent = r.name; th.title = r.name + ' · ' + r.zone; tr.appendChild(th);
      cols.forEach(function (t, k) {
        var td = document.createElement('td'), p = parts(t, r.zone), st = status(r, t, 60);
        td.className = st; td.innerHTML = hmShort(p.h, p.mi);
        if (p.h === 0 && p.mi < 60 && i) td.title = dayName(t, r.zone);
        td.setAttribute('aria-label', r.name + ' ' + hm(p.h, p.mi) + ' ' + { work: 'working hours', edge: 'early or late', night: 'night', off: 'weekend' }[st]);
        td.addEventListener('click', function () { choose(k); });
        tr.appendChild(td);
      });
      g.appendChild(tr);
    });
    var sc = document.createElement('tr'); sc.className = 'score'; var th2 = document.createElement('th'); th2.textContent = 'Everyone'; sc.appendChild(th2);
    var scores = cols.map(function (t) { return rows.filter(function (r) { return status(r, t, 60) === 'work'; }).length; });
    scores.forEach(function (s, k) { var td = document.createElement('td'); td.textContent = s === rows.length ? '✓' : ''; td.addEventListener('click', function () { choose(k); }); sc.appendChild(td); });
    g.appendChild(sc);
    // best hours
    var max = Math.max.apply(null, scores), runs = [], st0 = -1;
    scores.forEach(function (s, k) { if (s === max && st0 < 0) st0 = k; if ((s !== max || k === scores.length - 1) && st0 >= 0) { runs.push([st0, s === max ? k : k - 1]); st0 = -1; } });
    var b = $('mpBest');
    if (!max) { b.className = 'notice mp-best bad'; b.textContent = 'There is no hour on this day when anyone is in working hours' + (rows.some(function (r) { return r.wk; }) ? ' (it may be a weekend)' : '') + '. Try another date, or click any hour to plan it anyway.'; }
    else {
      var txt = runs.slice(0, 4).map(function (r) { var a = parts(cols[r[0]], base), e = parts(cols[r[1]] + 36e5, base); return hm(a.h, a.mi) + '–' + hm(e.h, e.mi); }).join(', ');
      b.className = 'notice mp-best ' + (max === rows.length ? 'ok' : '');
      b.textContent = (max === rows.length ? 'Best time for everyone: ' : 'No hour suits everyone. At most ' + max + ' of ' + rows.length + ' places are in working hours at once, at ') + txt + ' (' + (rows[0].name === 'Your time' ? 'your' : rows[0].name) + ' time). Click an hour in the grid to plan the meeting.';
    }
    if (pick != null && pick < cols.length) choose(pick, true); else { $('mpSlot').hidden = true; pick = null; }
  }
  function choose(k, quiet) {
    pick = k;
    Array.prototype.forEach.call($('mpGrid').rows, function (tr) { Array.prototype.forEach.call(tr.cells, function (td, i) { if (i) td.classList.toggle('sel', i - 1 === k); }); });
    var start = cols[k] + +$('mpMin').value * 60000, len = +$('mpDur').value, end = start + len * 60000, base = rows[0].zone;
    var list = $('mpSlotList'); list.innerHTML = '';
    var lines = [];
    rows.forEach(function (r) {
      var a = parts(start, r.zone), e = parts(end, r.zone), st = status(r, start, len), ab = abbr(start, r.zone);
      var when = dayName(start, r.zone) + ', ' + hm(a.h, a.mi) + '–' + hm(e.h, e.mi) + (e.d !== a.d ? ' (' + dayName(end, r.zone) + ')' : '');
      var li = document.createElement('li'), bb = document.createElement('b'), sp = document.createElement('span');
      bb.textContent = r.name + ': ' + when; sp.textContent = { work: 'in working hours', edge: 'outside working hours', night: 'night time', off: 'weekend' }[st] + ' · ' + (ab ? ab + ', ' : '') + utcLabel(off(start, r.zone));
      li.appendChild(bb); li.appendChild(sp); list.appendChild(li);
      lines.push('• ' + (r.name === 'Your time' ? r.sub.replace(/^Near /, '') : r.name + (r.sub && r.sub.indexOf('/') === -1 ? ', ' + r.sub : '')) + ': ' + when + ' (' + (ab ? ab + ', ' : '') + utcLabel(off(start, r.zone)) + ')');
    });
    $('mpSlotHead').textContent = dayName(start, base, true) + ' · ' + (len >= 60 ? len / 60 + (len === 60 ? ' hour' : ' hours') : len + ' minutes');
    var title = $('mpTitle').value.trim() || 'Meeting';
    $('mpInvite').value = title + '\n' + dayName(start, base, true) + ' · ' + (len < 60 ? len + ' minutes' : len / 60 + (len === 60 ? ' hour' : ' hours')) + '\n\n' + lines.join('\n') + '\n\nUTC: ' + new Date(start).toISOString().slice(0, 16).replace('T', ' ') + '–' + new Date(end).toISOString().slice(11, 16);
    // calendar file
    var stamp = function (t) { return new Date(t).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }, esc = function (s) { return s.replace(/\\/g, '\\\\').replace(/[,;]/g, '\\$&').replace(/\n/g, '\\n'); };
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GetToolNest//Meeting Planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT', 'UID:' + Date.now().toString(36) + Math.random().toString(36).slice(2) + '@gettoolnest', 'DTSTAMP:' + stamp(Date.now()), 'DTSTART:' + stamp(start), 'DTEND:' + stamp(end), 'SUMMARY:' + esc(title), 'DESCRIPTION:' + esc(lines.join('\n')), 'END:VEVENT', 'END:VCALENDAR'].map(fold75).join('\r\n');
    var a2 = $('mpIcs'); if (a2.href && a2.href.indexOf('blob:') === 0) URL.revokeObjectURL(a2.href);
    a2.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a2.download = title.replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) + '.ics';
    $('mpSlot').hidden = false;
    if (!quiet) $('mpSlot').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  // calendar files must break lines longer than 75 bytes, going on after a space
  function fold75(line) {
    var out = '', n = 0, enc = new TextEncoder();
    Array.from(line).forEach(function (ch) { var w = enc.encode(ch).length; if (n + w > 75) { out += '\r\n '; n = 1; } out += ch; n += w; });
    return out;
  }
  function changed() { save(); drawRows(); grid(); }
  ['mpDate', 'mpFmt'].forEach(function (id) { $(id).addEventListener('change', function () { save(); drawRows(); grid(); }); });
  ['mpDur', 'mpMin'].forEach(function (id) { $(id).addEventListener('change', function () { save(); if (pick != null) choose(pick, true); }); });
  $('mpTitle').addEventListener('input', function () { if (pick != null) choose(pick, true); });
  $('mpCopy').addEventListener('click', function () { copyText($('mpInvite').value, $('mpCopy')); });

  // ---------- search ----------
  function fold(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[_/]/g, ' '); }
  $('mpFind').addEventListener('input', function () {
    var q = fold($('mpFind').value.trim()), box = $('mpPicks'), out = [], seen = {}; box.innerHTML = '';
    if (!q) return;
    CITY.forEach(function (c) { var n = fold(c.name), co = fold(c.country), s = n.indexOf(q) === 0 ? 0 : n.indexOf(q) > 0 ? 1 : co.indexOf(q) === 0 ? 2 : -1; if (s >= 0) out.push({ s: s, label: c.name + ', ' + c.country, row: function () { return makeRow(c.name, c.country, c.zone, c.country); } }); });
    ALL.forEach(function (z) { if (fold(z).indexOf(q) === -1) return; var c = canon(z); if (seen[c]) return; seen[c] = 1; var bits = z.split('/'); out.push({ s: 3, label: z.replace(/_/g, ' '), row: function () { return makeRow(bits[bits.length - 1].replace(/_/g, ' '), z.replace(/_/g, ' '), z); } }); });
    out.sort(function (a, b) { return a.s - b.s || a.label.localeCompare(b.label); });
    out.slice(0, 12).forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = '+ ' + o.label;
      b.addEventListener('click', function () {
        if (rows.length >= 12) { $('mpMsg').textContent = 'You can compare up to 12 places at once. Remove one first.'; return; }
        var r = o.row();
        if (rows.some(function (x) { return x.name === r.name && canon(x.zone) === canon(r.zone); })) { $('mpMsg').textContent = r.name + ' is already in the list.'; return; }
        rows.push(r); $('mpFind').value = ''; box.innerHTML = ''; $('mpMsg').textContent = r.name + ' added.'; changed();
      });
      box.appendChild(b);
    });
    if (!out.length) { var s = document.createElement('span'); s.className = 'mp-legend'; s.textContent = 'No city or time zone matches. Try the country name or a bigger city nearby.'; box.appendChild(s); }
  });
  $('mpFind').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var b = $('mpPicks').querySelector('button'); if (b) b.click(); } });

  drawRows(); grid();
})();
</script>
