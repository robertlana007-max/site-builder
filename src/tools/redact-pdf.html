<style>
.rd-find textarea { min-height: 84px; font-family: inherit; font-size: 15px; }
.rd-find .checks { margin: 10px 0 0; }
.rd-sheet { touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.rd-layer { position: absolute; inset: 0; }
.rd-mark { position: absolute; background: rgba(0, 0, 0, .55); outline: 2px solid #e5484d; }
.rd-mark.white { background: rgba(255, 255, 255, .7); outline-color: #e5484d; }
.rd-mark button { position: absolute; right: -11px; top: -11px; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: #e5484d; color: #fff; font: 700 12px/16px system-ui, sans-serif; cursor: pointer; }
@media (pointer: coarse) { .rd-mark button { width: 30px; height: 30px; right: -15px; top: -15px; line-height: 24px; } }
.rd-draft { position: absolute; border: 2px dashed #e5484d; background: rgba(229, 72, 77, .15); pointer-events: none; }
.rd-hits { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.rd-opts { margin-top: 16px; }
</style>
<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a PDF here</b>Hide names, numbers and other private details for good. The file never leaves your device.</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div id="rdWork" hidden>
  <div class="rd-find">
    <label for="rdTerms">Find words to hide (one word or phrase per line)</label>
    <textarea id="rdTerms" data-nomemo spellcheck="false" placeholder="For example:&#10;John Smith&#10;4111 2222 3333 4444"></textarea>
    <div class="checks">
      <label><input type="checkbox" id="rdWhole" checked> Whole words only</label>
      <label><input type="checkbox" id="rdCase"> Match capital letters</label>
      <label><input type="checkbox" id="rdEmail" data-nomemo> All email addresses</label>
      <label><input type="checkbox" id="rdPhone" data-nomemo> All phone numbers</label>
      <label><input type="checkbox" id="rdNums" data-nomemo> All long numbers (cards, IDs, accounts)</label>
    </div>
    <div class="btns"><button class="btn ghost" id="rdFind" type="button">Find and mark</button><button class="btn ghost" id="rdUndo" type="button" disabled>Undo</button><button class="btn ghost" id="rdClear" type="button" disabled>Remove all marks</button></div>
    <p class="rd-hits" id="rdHits"></p>
  </div>
  <div class="pager" style="margin-top:14px">
    <button class="btn ghost" id="rdPrev" type="button" aria-label="Previous page">‹</button>
    <span id="rdPageNo">Page 1 of 1</span>
    <button class="btn ghost" id="rdNext" type="button" aria-label="Next page">›</button>
    <span class="grow"></span>
    <span id="rdCount">Nothing marked yet</span>
  </div>
  <p class="rd-hits" style="margin:0 0 8px">Drag on the page to cover any area, such as a photo, a signature or a stamp. Press ✕ on a mark to remove it.</p>
  <div class="stage"><div class="sheet rd-sheet" id="rdSheet"><canvas id="rdCv"></canvas><div class="rd-layer" id="rdLayer"></div></div></div>
  <div class="fields rd-opts">
    <div><label for="rdColor">Colour of the boxes</label><select id="rdColor"><option value="black">Black</option><option value="white">White (blends into the page)</option></select></div>
    <div><label for="rdDpi">Quality of redacted pages</label><select id="rdDpi"><option value="150">Good (150 dpi, smaller file)</option><option value="200" selected>High (200 dpi)</option><option value="300">Print (300 dpi, larger file)</option></select></div>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="rdKeep" checked> Keep the rest of the text on redacted pages searchable and copyable</label>
    <label><input type="checkbox" id="rdMeta" checked> Also remove the title, author and other hidden document details</label>
  </div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Redact PDF</button><a class="btn ghost" id="dl" hidden>Download redacted PDF</a></div>
<p class="msg" id="msg"></p>

    (t.annots || []).forEach(function (a) { if (!a.link && ranges(plainText(a.text), list).length) boxes.push(a.box); });

  }
  $('rdFind').addEventListener('click', async function () {
    if (!pdf || busy) return;
    var list;
    try { list = patterns(); } catch (e) { return PT.say('bad', 'One of the words could not be searched for. Try writing it differently.'); }
    if (!list.length) { PT.say('bad', 'Type a word or phrase to find, or tick one of the boxes such as All email addresses.'); $('rdTerms').focus(); return; }
    busy = true; $('rdFind').disabled = true;
    var found = 0, already = 0, pages = [], noText = 0, before = JSON.stringify(marks);
    try {
      for (var i = 1; i <= n; i++) {
        if (n > 20 && i % 10 === 1) PT.say('', 'Searching page ' + i + ' of ' + n + '…');
        var t = await pageText(i);
        if (!t.items.length) noText++;
        var b = findIn(t, list);
        if (b.length) {
          var have = marks[i] = marks[i] || [];
          b.forEach(function (x) { if (!have.some(function (y) { return Math.abs(y.x - x.x) < .5 && Math.abs(y.y - x.y) < .5 && Math.abs(y.w - x.w) < .5; })) { have.push(x); found++; } else already++; });
          pages.push(i);
        }
      }
      if (found) history.push(before);
      $('rdHits').textContent = found ? 'Marked ' + found + (found === 1 ? ' match' : ' matches') + ' on ' + (pages.length === 1 ? 'page ' + pages[0] : pages.length + ' pages (' + pages.slice(0, 12).join(', ') + (pages.length > 12 ? '…' : '') + ')') + '. Check each page, then press Redact PDF.'
        : already ? 'All ' + already + (already === 1 ? ' match is' : ' matches are') + ' already marked. Check each page, then press Redact PDF.'
        : 'No matches found.' + (noText === n ? ' This PDF has no text layer (it is probably a scan), so words cannot be searched. Drag boxes over them instead.' : noText ? ' ' + noText + (noText === 1 ? ' page has' : ' pages have') + ' no searchable text (for example a scanned page): drag boxes over details there.' : '');
      PT.say(found ? 'ok' : '', '');
      if (pages.length && pages.indexOf(cur) === -1) show(pages[0]);
    } catch (e) { PT.say('bad', 'The text of this PDF could not be read.'); }
    busy = false; $('rdFind').disabled = false; changed();
  });

  // ---------- open ----------
  PT.drop(false, function (f) {
    if (busy) return PT.say('bad', 'Please wait until the current job is finished.');
    if (!f.size) return PT.say('bad', '"' + f.name + '" is empty.');
    if (!PT.isPdf(f)) return PT.say('bad', '"' + f.name + '" is not a PDF. Please choose a PDF file.');
    busy = true; PT.say('', 'Opening ' + f.name + '…');
    pdfjsLib.GlobalWorkerOptions.workerSrc = '../assets/vendor/pdf.worker.min.js';
    // like PT.render, but keeping the font widths so words can be found letter by letter
    f.arrayBuffer().then(function (buf) { return pdfjsLib.getDocument({ data: buf, fontExtraProperties: true }).promise; }).catch(function (e) {
      throw new Error(e && e.name === 'PasswordException' ? '"' + f.name + '" is password protected. Remove the password first with the free Unlock PDF tool on this site, then try again.' : '"' + f.name + '" could not be read as a PDF.');
    }).then(function (doc) {
      if (pdf) pdf.destroy();
      file = f; pdf = doc; n = doc.numPages; marks = {}; history = []; texts = {}; fontWidths = {};
      $('rdWork').hidden = false; $('rdHits').textContent = '';
      $('drop').querySelector('b').textContent = f.name;
      busy = false; changed(); show(1);
      PT.say('', f.name + ' · ' + n + (n === 1 ? ' page' : ' pages') + ' · ' + fmtBytes(f.size));
    }).catch(function (e) { busy = false; PT.say('bad', e.message); });
  });

  // ---------- redact ----------
  var fontBytes = null;
  // Take out links whose web address matches the search (pages that are rebuilt lose all links anyway).
  function dropLinks(page, list) {
    if (!list.length) return;
    var L = PDFLib, annots = page.node.Annots();
    if (!annots) return;
    for (var q = annots.size() - 1; q >= 0; q--) {
      try {
        var a = annots.lookup(q, L.PDFDict), act = a.lookup(L.PDFName.of('A')), uri = act instanceof L.PDFDict ? act.lookup(L.PDFName.of('URI')) : null;

  function overlaps(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  $('go').addEventListener('click', function () {
    if (!pdf || busy || !total()) return;
    busy = true;
    PT.run(async function () {
      var L = PDFLib, src = await openLib(await file.arrayBuffer()), out = await L.PDFDocument.create({ updateMetadata: false });
      var dpi = +$('rdDpi').value, white = $('rdColor').value === 'white', keep = $('rdKeep').checked, font = null, glyphs = null;
      if (!$('rdMeta').checked) {
        [['Title', 'setTitle'], ['Author', 'setAuthor'], ['Subject', 'setSubject'], ['Creator', 'setCreator']].forEach(function (k) { var v = src['get' + k[0]](); if (v) out[k[1]](v); });
        var kw = src.getKeywords(); if (kw) out.setKeywords([kw]);
      }
      if (keep) {
        out.registerFontkit(fontkit);
        if (!fontBytes) fontBytes = fetch('../assets/vendor/fonts/noto-sans-subset-400.ttf').then(function (r) { if (!r.ok) throw new Error(); return r.arrayBuffer(); }).catch(function (e) { fontBytes = null; throw e; });
        try { font = await out.embedFont(await fontBytes, { subset: true }); glyphs = font.embedder.font; } catch (e) { font = null; }
      }
      var redacted = [], plain = [], copied, findList = [];
      try { findList = patterns(); } catch (e) { findList = []; }
      function live(i) { return (marks[i] || []).filter(function (m) { return m.w > 0 && m.h > 0; }); }
      for (var i = 1; i <= n; i++) if (!live(i).length) plain.push(i - 1);
      copied = await out.copyPages(src, plain); // in one go, so shared fonts and pictures are stored once
      for (i = 1; i <= n; i++) {
        var ms = live(i);
        if (!ms.length) { dropLinks(out.addPage(copied[plain.indexOf(i - 1)]), findList); continue; }
        PT.say('', 'Redacting page ' + i + ' of ' + n + '…');
        var page = await pdf.getPage(i), vp1 = page.getViewport({ scale: 1 }), k = Math.min(dpi / 72, Math.sqrt(16e6 / (vp1.width * vp1.height)));
        var vp = page.getViewport({ scale: k }), c = document.createElement('canvas');
        c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: g, viewport: vp }).promise;
        g.fillStyle = white ? '#fff' : '#000';
        ms.forEach(function (m) { g.fillRect(Math.floor(m.x * k), Math.floor(m.y * k), Math.ceil(m.w * k) + 1, Math.ceil(m.h * k) + 1); });
        var jpg = await PT.blob(c, 'image/jpeg', .9), img = await out.embedJpg(new Uint8Array(await jpg.arrayBuffer()));
        c.width = c.height = 1; page.cleanup();
        var np = out.addPage([vp1.width, vp1.height]);
        np.drawImage(img, { x: 0, y: 0, width: vp1.width, height: vp1.height });
        if (font) {
          // An invisible text layer with only the words that are not covered, so the page can still be searched and copied.
          var t = await pageText(i);
          np.pushOperators(L.pushGraphicsState(), L.setTextRenderingMode(L.TextRenderingMode.Invisible));
          t.items.forEach(function (o) {
            if (!o.flat) {
              if (ms.some(function (m) { return overlaps(m, { x: o.bx, y: o.by, w: o.bw, h: o.bh }); })) return;
              var a = Math.atan2(o.m[1], o.m[0]);
              var s = o.chars.filter(function (ch) { return glyphs.hasGlyphForCodePoint(ch.codePointAt(0)); }).join('');
              if (s.trim()) try { np.drawText(s, { x: o.m[4], y: vp1.height - o.m[5], size: o.fh, font: font, rotate: L.degrees(-a * 180 / Math.PI) }); } catch (e) { /* skip */ }
              return;
            }
            var seg = null, segs = [];
            o.chars.forEach(function (ch, j) {
              var hidden = ms.some(function (m) { return overlaps(m, letterCore(o, j)); }) || !glyphs.hasGlyphForCodePoint(ch.codePointAt(0));
              if (hidden) { seg = null; return; }
              if (!seg) { seg = { a: j, s: '' }; segs.push(seg); }
              seg.s += ch; seg.b = j + 1;
            });
            segs.forEach(function (sg) {
              if (!sg.s.trim()) return;
              var x0 = o.x + o.pos[sg.a] * o.w, want = (o.pos[sg.b] - o.pos[sg.a]) * o.w, have = font.widthOfTextAtSize(sg.s, o.fh);
              var hs = have > 0 ? Math.max(10, Math.min(1000, want / have * 100)) : 100;
              np.pushOperators(L.pushGraphicsState(), L.setCharacterSqueeze(hs));

        }
        var md = await chk.getMetadata().catch(function () { return {}; }), info = md.info || {};
        var details = ['Title', 'Author', 'Subject', 'Keywords', 'Creator', 'Producer'].map(function (k) { return typeof info[k] === 'string' ? info[k] : ''; }).join('\n');
        var dh = ranges(plainText(details), list).length;
        if (dh) { left += dh; where.push('the document details (title, author…)'); }
        chk.destroy();
        var pg = inText.concat(inNotes.filter(function (x) { return inText.indexOf(x) < 0; })).sort(function (a, b) { return a - b; });
        if (pg.length) where.unshift((pg.length === 1 ? 'page ' : 'pages ') + pg.slice(0, 12).join(', '));
      }
      PT.done(bytes, PT.base(file.name) + '-redacted.pdf', 'application/pdf', 'Redacted ' + redacted.length + (redacted.length === 1 ? ' page' : ' pages') + (list.length ? (left ? '. Warning: ' + left + (left === 1 ? ' match of your search is' : ' matches of your search are') + ' still in the file, in ' + where.join(' and ') + (dh ? '. Tick "Also remove the title, author…" to clear the details' : '') + (pg.length ? '. Press Find and mark again to cover the rest' : '') : '. Checked: none of the searched words are left in the file') : ''));
      if (left) $('msg').className = 'msg bad';
    }).then(function () { busy = false; $('go').disabled = !total(); });
  });
})();
</script>
