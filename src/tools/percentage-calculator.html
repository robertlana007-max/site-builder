<h3 style="margin-top:0">What is X% of Y?</h3>
<div class="fields">
  <div><label for="a1">Percent (%)</label><input type="number" id="a1" step="any" placeholder="15"></div>
  <div><label for="a2">Of number</label><input type="number" id="a2" step="any" placeholder="200"></div>
</div>
<div class="out" id="r1">–</div>

<h3>X is what percent of Y?</h3>
<div class="fields">
  <div><label for="b1">Number X</label><input type="number" id="b1" step="any" placeholder="30"></div>
  <div><label for="b2">Number Y</label><input type="number" id="b2" step="any" placeholder="200"></div>
</div>
<div class="out" id="r2">–</div>

<h3>Percentage change from X to Y</h3>
<div class="fields">
  <div><label for="c1">From</label><input type="number" id="c1" step="any" placeholder="80"></div>
  <div><label for="c2">To</label><input type="number" id="c2" step="any" placeholder="100"></div>
</div>
<div class="out" id="r3">–</div>
<script>
(function () {
  function v(id) { var s = $(id).value; return s === '' ? NaN : +s; }
  function f(n) { return fmtNum(n, undefined).replace(/^-0$/, '0'); }
  function calc() {
    var a1 = v('a1'), a2 = v('a2'), b1 = v('b1'), b2 = v('b2'), c1 = v('c1'), c2 = v('c2');
    $('r1').textContent = isNaN(a1) || isNaN(a2) ? '–' : f(a1 / 100 * a2);
    $('r2').textContent = isNaN(b1) || isNaN(b2) ? '–' : b2 === 0 ? 'Y cannot be zero' : f(b1 / b2 * 100) + '%';
    if (isNaN(c1) || isNaN(c2)) $('r3').textContent = '–';
    else if (c1 === 0) $('r3').textContent = 'Starting value cannot be zero';
    else { var p = (c2 - c1) / Math.abs(c1) * 100; $('r3').textContent = f(Math.abs(p)) + '% ' + (p > 0 ? 'increase' : p < 0 ? 'decrease' : '(no change)'); }
  }
  ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'].forEach(function (id) { $(id).addEventListener('input', calc); });
})();
</script>
