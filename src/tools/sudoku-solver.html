<style>
.ss .ss-board { display: grid; grid-template-columns: repeat(9, 1fr); width: 100%; max-width: 460px; aspect-ratio: 1; margin: 0 auto; border: 2.5px solid var(--ink); background: var(--ink); gap: 1px; user-select: none; touch-action: manipulation; }
.ss .ss-board button { all: unset; box-sizing: border-box; background: var(--surface); color: var(--ink); display: grid; place-items: center; font-size: clamp(16px, 5.2vw, 26px); font-weight: 800; cursor: pointer; position: relative; aspect-ratio: 1; min-width: 0; }
.ss .ss-board button.c3 { border-right: 2px solid var(--ink); } .ss .ss-board button.r3 { border-bottom: 2px solid var(--ink); }
.ss .ss-board button.sol { color: var(--accent); font-weight: 500; }
.ss .ss-board button.hint { color: var(--ok); font-weight: 600; }
.ss .ss-board button.ocr { background: color-mix(in srgb, #f59e0b 16%, var(--surface)); }
.ss .ss-board button.unsure { background: color-mix(in srgb, #f59e0b 42%, var(--surface)); }
.ss .ss-board button.hl { background: var(--accent-soft); }
.ss .ss-board button.focus { background: color-mix(in srgb, var(--ok) 30%, var(--surface)); }
.ss .ss-board button.sel { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.ss .ss-board button.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.ss .ss-board button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.ss .ss-pad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 460px; margin: 12px auto 0; }
.ss .ss-pad button { font: inherit; font-size: 19px; font-weight: 700; min-height: 46px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 0; min-width: 0; }
.ss .ss-pad button:last-child { font-size: 15px; }
.ss .ss-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 460px; margin: 12px auto 0; }
.ss .ss-tools .btn { min-height: 42px; padding: 6px 14px; }
.ss .ss-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 640px) { .ss .ss-in { grid-template-columns: 1fr; } }
.ss .ss-in .drop { margin: 0; padding: 22px 12px; }
.ss textarea { min-height: 82px; font-family: ui-monospace, monospace; font-size: 14px; }
.ss .ss-hintbox { max-width: 460px; margin: 14px auto 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--surface)); }
.ss .ss-hintbox b { display: block; margin-bottom: 4px; }
.ss .ss-hintbox p { margin: 0; font-size: 15px; }
.ss .ss-hintbox .btns { margin-top: 10px; }
.ss .ss-hintbox .btn { min-height: 40px; padding: 6px 14px; }
.ss .ss-scan { max-width: 460px; margin: 0 auto 14px; display: flex; gap: 12px; align-items: center; }
.ss .ss-scan canvas { width: 120px; height: 120px; border: 1px solid var(--line); border-radius: 8px; flex: none; background: #fff; }
.ss .ss-scan p { margin: 0; font-size: 14px; color: var(--muted); }
.ss .ss-meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
.ss .ss-meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.ss .ss-legend { max-width: 460px; margin: 8px auto 0; font-size: 13px; color: var(--muted); text-align: center; }

<div class="ss" id="ss">
<div class="ss-in">
  <div>
    <div class="drop" id="drop" tabindex="0" role="button"><b>Photo or screenshot</b>Take a picture of the puzzle, or pick a screenshot. It is read on your device.</div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div>
    <label for="ssPaste">Or paste 81 digits (0 or . for empty)</label>
    <textarea id="ssPaste" data-nomemo maxlength="600" spellcheck="false" placeholder="530070000600195000098000060800060003400803001700020006060000280000419005000080079"></textarea>
    <div class="btns" style="margin-top:8px"><button type="button" class="btn ghost" id="ssLoad">Put it on the board</button></div>
  </div>
</div>
<div class="ss-scan" id="ssScan" hidden><canvas id="ssWarp" width="432" height="432" aria-label="The grid found in your picture"></canvas><div style="flex:1;min-width:0"><p id="ssScanText">Reading…</p><div class="ss-meter" id="ssMeter"><i id="ssBar"></i></div></div></div>
<div class="ss-board" id="ssBoard" role="grid" aria-label="Sudoku puzzle"></div>
<p class="ss-legend" id="ssLegend" hidden>Yellow squares were read from your picture. Check them against your puzzle; darker yellow ones are unsure.</p>
<div class="ss-pad" id="ssPad" aria-label="Numbers"></div>
<div class="ss-tools">
  <button type="button" class="btn" id="ssSolve">Solve</button>
  <button type="button" class="btn ghost" id="ssHint">Hint: next step</button>
  <button type="button" class="btn ghost" id="ssCheck">Check puzzle</button>
  <button type="button" class="btn ghost" id="ssClearSol">Hide answer</button>
  <button type="button" class="btn ghost" id="ssCopy">Copy as 81 digits</button>
  <button type="button" class="btn ghost danger" id="ssClear">Clear board</button>
</div>
<div class="ss-hintbox" id="ssHintBox" hidden><b id="ssHintTitle">Hint</b><p id="ssHintText"></p><div class="btns"><button type="button" class="btn" id="ssPlace">Put it in</button><button type="button" class="btn ghost" id="ssHintClose">Close</button></div></div>
<p class="msg" id="msg" role="status" aria-live="polite" style="text-align:center"></p>
<p class="ss-legend">Want a new puzzle to play or print? Try the <a href="../sudoku-generator/">Sudoku Generator</a>.</p>
</div>
<script>
(function () {
