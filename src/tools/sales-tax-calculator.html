<div class="fields">
  <div><label for="amt">Amount</label><input type="number" id="amt" min="0" step="any" value="100"></div>
  <div><label for="rate">Tax rate (%)</label><input type="number" id="rate" min="0" step="any" value="8.25"></div>
  <div><label for="mode">The amount is</label><select id="mode"><option value="add">Before tax (add tax)</option><option value="remove">Tax included (remove tax)</option></select></div>
</div>
<div class="stats">
  <div class="stat"><span>Price before tax</span><b id="net">–</b></div>
  <div class="stat"><span>Tax</span><b id="tax">–</b></div>
  <div class="stat"><span>Price with tax</span><b id="gross">–</b></div>
</div>
<p class="msg" id="msg"></p>
<script>
(function () {
  function calc() {
    var a = +$('amt').value, r = +$('rate').value;
    var err = !(a > 0) ? 'Enter an amount above 0.' : ($('rate').value === '' || !(r >= 0)) ? 'Enter a tax rate of 0 or more.' : '';
    $('msg').className = err ? 'msg bad' : 'msg'; $('msg').textContent = err;
    if (err) { ['net', 'tax', 'gross'].forEach(function (i) { $(i).textContent = '–'; }); return; }
    var net = $('mode').value === 'add' ? a : a / (1 + r / 100), gross = $('mode').value === 'add' ? a * (1 + r / 100) : a;
    $('net').textContent = fmtNum(net, 2);
    $('tax').textContent = fmtNum(gross - net, 2);
    $('gross').textContent = fmtNum(gross, 2);
  }
  ['amt', 'rate', 'mode'].forEach(function (id) { $(id).addEventListener('input', calc); });
  $('mode').addEventListener('change', calc);
  calc();
})();
</script>
