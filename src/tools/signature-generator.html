<style>
.sgn .sgn-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.sgn .sgn-tabs .btn { flex: 1; justify-content: center; }
.sgn .sgn-sw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.sgn .sgn-sw button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sgn .sgn-sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sgn input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); }
.sgn .sgn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 4px 0 14px; }
.sgn .sgn-grid button { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-height: 96px; }
.sgn .sgn-grid button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sgn .sgn-grid canvas { width: 100%; height: 70px; display: block; }
.sgn .sgn-grid small { font-size: 12px; color: #6b7280; text-align: left; }
.sgn .sgn-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.sgn .sgn-hint { display: block; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.sgn .sgn-big { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background-color: #fff; background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1f5f9 75%), linear-gradient(-45deg, transparent 75%, #f1f5f9 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
.sgn .sgn-big canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.sgn .sgn-pad { position: relative; border: 1px dashed var(--line); border-radius: 12px; background: #fff; touch-action: none; }
.sgn .sgn-pad canvas { width: 100%; height: 220px; display: block; cursor: crosshair; touch-action: none; }
.sgn .sgn-pad .sgn-base { position: absolute; left: 8%; right: 8%; bottom: 52px; border-top: 1px solid #cbd5e1; pointer-events: none; }
.sgn .sgn-pad .sgn-x { position: absolute; left: 8%; bottom: 56px; color: #94a3b8; font-size: 18px; pointer-events: none; }
</style>
<div class="sgn" id="sgn">
<div class="sgn-tabs" role="group" aria-label="How to make the signature">
  <button type="button" class="btn ghost" id="sgTabType" aria-pressed="true">Type it</button>
  <button type="button" class="btn ghost" id="sgTabDraw" aria-pressed="false">Draw it</button>
</div>
<div id="sgTypeBox">
  <div class="fields">
    <div><label for="sgName">Your name</label><input type="text" id="sgName" data-nomemo maxlength="40" placeholder="e.g. Maria Garcia" autocomplete="name"></div>
    <div><label for="sgSize">Image size</label><select id="sgSize"><option value="90">Small (for email)</option><option value="180" selected>Medium</option><option value="360">Large (for print)</option></select></div>
    <div><label for="sgSlant">Slant</label><select id="sgSlant"><option value="0">Upright</option><option value="8" selected>A little</option><option value="16">More</option></select></div>
  </div>
  <div class="sgn-sw" id="sgSw"><input type="color" id="sgColor" value="#1e3a8a" aria-label="Custom ink colour"></div>
  <label class="sgn-check"><input type="checkbox" id="sgLine">Add a flourish under the name</label>
  <span class="sgn-hint" id="sgFontNote">Pick a style. The handwriting fonts cover Latin letters (English, Spanish, French, German and more). For other alphabets, use Draw it.</span>
  <div class="sgn-grid" id="sgGrid" role="group" aria-label="Signature styles"></div>
  <div class="sgn-big"><canvas id="sgBig" width="600" height="180" aria-label="Chosen signature"></canvas></div>
  <div class="btns">
    <button type="button" class="btn" id="sgPng" disabled>Download PNG (transparent)</button>
    <button type="button" class="btn ghost" id="sgSvg" disabled>Download SVG</button>
    <button type="button" class="btn ghost" id="sgCopy" disabled>Copy image</button>
  </div>
</div>
<div id="sgDrawBox" hidden>
  <div class="fields">
    <div><label for="sgPen">Pen thickness</label><select id="sgPen"><option value="2">Thin</option><option value="3.2" selected>Medium</option><option value="5">Thick</option></select></div>
  </div>
  <div class="sgn-sw" id="sgSw2"><input type="color" id="sgColor2" value="#1e3a8a" aria-label="Custom ink colour"></div>
  <div class="sgn-pad"><span class="sgn-x">×</span><span class="sgn-base"></span><canvas id="sgPad" aria-label="Draw your signature here with a finger, pen or mouse"></canvas></div>
  <span class="sgn-hint">Sign above the line with your finger, a stylus or the mouse.</span>
  <div class="btns">
    <button type="button" class="btn" id="sgDrawPng" disabled>Download PNG (transparent)</button>
    <button type="button" class="btn ghost" id="sgUndo" disabled>Undo</button>
    <button type="button" class="btn ghost" id="sgClear" disabled>Clear</button>
  </div>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
