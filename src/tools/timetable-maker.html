<style>
.tt-days { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.tt-days label { margin: 0; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px 6px 9px; cursor: pointer; background: var(--surface); }
.tt-days label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tt-days input { margin: 0 6px 0 0; }
details.tt-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; }
details.tt-box summary { cursor: pointer; font-weight: 600; }
details.tt-box[open] summary { margin-bottom: 12px; }
.tt-plist { display: grid; gap: 6px; margin: 8px 0 0; }
.tt-prow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) auto 40px; gap: 6px; align-items: center; }
.tt-prow input[type=text], .tt-prow input[type=time] { min-height: 40px; padding: 6px 9px; width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
.tt-prow label { margin: 0; font-weight: 400; font-size: 13px; white-space: nowrap; }
.tt-prow button { font: inherit; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tt-prow button:hover { border-color: var(--bad); color: var(--bad); }
.tt-prow.brk input[type=text] { font-style: italic; }
.tt-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); -webkit-overflow-scrolling: touch; }
.tt-title { font-size: 19px; font-weight: 700; text-align: center; padding: 12px 10px 0; overflow-wrap: anywhere; }
.tt-title:empty { display: none; }
table.tt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: calc(92px + var(--tt-n, 5) * 118px); table-layout: fixed; font-size: 14px; }
table.tt th, table.tt td { border-bottom: 1px solid var(--line); border-inline-end: 1px solid var(--line); padding: 3px; vertical-align: top; }
table.tt tr > :last-child { border-inline-end: 0; }
table.tt tbody tr:last-child > * { border-bottom: 0; }
table.tt thead th { font-size: 13.5px; padding: 10px 4px; text-align: center; background: var(--bg); }
table.tt th.tt-time { width: 92px; text-align: center; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 8px 4px; font-variant-numeric: tabular-nums; background: var(--bg); line-height: 1.35; }
table.tt th.tt-time b { display: block; color: var(--ink); font-size: 13px; }
table.tt td { height: 64px; }
.tt-cell { width: 100%; height: 100%; min-height: 56px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; border: 1px dashed transparent; border-radius: 8px; background: none; color: var(--muted); font: inherit; font-size: 20px; cursor: pointer; padding: 6px; text-align: center; }
.tt-cell:hover, .tt-cell:focus-visible { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); outline: none; }
.tt-cls { font-size: 13px; color: var(--tt-ink, #111); background: var(--tt-bg, #dbeafe); border: 1px solid rgba(0, 0, 0, .08); }
.tt-cls:hover, .tt-cls:focus-visible { color: var(--tt-ink, #111); background: var(--tt-bg); border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.tt-cls b { font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.tt-cls span { font-size: 12px; opacity: .85; overflow-wrap: anywhere; line-height: 1.25; }
table.tt tr.tt-brk td { height: auto; text-align: center; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: repeating-linear-gradient(135deg, var(--bg), var(--bg) 8px, var(--surface) 8px, var(--surface) 16px); padding: 8px 4px; vertical-align: middle; }
table.tt tr.tt-brk th.tt-time { padding: 6px 4px; }
.tt-dlg { border: 0; border-radius: 18px; padding: 20px 20px 16px; max-width: min(480px, calc(100vw - 24px)); width: 100%; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.tt-dlg::backdrop { background: rgba(15, 18, 22, .55); }
.tt-dlg h3 { margin: 0 0 4px; font-size: 18px; }
.tt-dlg .fields { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.tt-dlg .tt-full { grid-column: 1 / -1; }
.tt-sw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tt-sw button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.tt-sw button[aria-pressed="true"] { border-color: var(--ink); }
.tt-sw input[type=color] { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); cursor: pointer; }
.tt-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
@media (max-width: 520px) {
  .tt-prow { grid-template-columns: 1fr 1fr 40px; } .tt-prow input[data-k=label] { grid-column: 1 / 3; } .tt-prow label { grid-column: 1 / 3; }
  .tt-dlg .fields { grid-template-columns: 1fr; }
}
@media print {
  @page { size: landscape; margin: 10mm; }
  body * { visibility: hidden !important; }
  #ttPrint, #ttPrint * { visibility: visible !important; }
  #ttPrint { position: absolute; left: 0; top: 0; width: 100%; border: 0; overflow: visible; }
  #ttPrint table.tt { min-width: 0; }
  .tt-cell:not(.tt-cls) { color: transparent !important; }
  .tt-cls, table.tt tr.tt-brk td, table.tt thead th, table.tt th.tt-time { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
<div class="fields">
  <div style="grid-column:1/-1"><label for="ttName">Timetable title (optional)</label><input type="text" id="ttName" data-nomemo maxlength="80" placeholder="e.g. Class 9B · Autumn term"></div>
</div>
<label>Days</label>
<div class="tt-days" id="ttDays"></div>

<details class="tt-box" id="ttTimes">
  <summary>Times and periods</summary>
  <div class="fields">
    <div><label for="ttStart">Day starts at</label><input type="time" id="ttStart" data-nomemo value="08:00"></div>
    <div><label for="ttEnd">Day ends by</label><input type="time" id="ttEnd" data-nomemo value="15:00"></div>
    <div><label for="ttLen">Period length (minutes)</label><input type="number" id="ttLen" data-nomemo min="5" max="300" value="45"></div>
    <div><label for="ttGap">Gap between periods (minutes)</label><input type="number" id="ttGap" data-nomemo min="0" max="60" value="0"></div>
    <div><label for="ttB1">Short break after period</label><input type="number" id="ttB1" data-nomemo min="0" max="20" value="2" placeholder="none"></div>
    <div><label for="ttB1L">Short break length (min)</label><input type="number" id="ttB1L" data-nomemo min="0" max="120" value="15"></div>
    <div><label for="ttB2">Lunch after period</label><input type="number" id="ttB2" data-nomemo min="0" max="20" value="4" placeholder="none"></div>
    <div><label for="ttB2L">Lunch length (min)</label><input type="number" id="ttB2L" data-nomemo min="0" max="180" value="45"></div>
  </div>
  <div class="btns" style="margin:0"><button type="button" class="btn" id="ttGen">Make periods from these times</button></div>
  <h3 style="margin:18px 0 0;font-size:15px">Periods (edit any time to make custom periods)</h3>

    <label style="display:inline-flex;align-items:center;gap:6px;margin:0 0 0 auto;font-weight:500">Clock <select id="ttClock" data-nomemo style="width:auto;min-height:40px;padding:4px 10px"><option value="24">24-hour</option><option value="12">12-hour (am/pm)</option></select></label></div>
</details>

<div class="tt-scroll" id="ttPrint"><div class="tt-title" id="ttTitleOut"></div><table class="tt" id="ttTable"></table></div>
<p class="tt-note">Click an empty cell to add a class. Click a class to change or delete it. On a phone, swipe the table sideways to see every day.</p>
<div class="btns">
  <button type="button" class="btn" id="ttPng">Download PNG</button>
  <button type="button" class="btn ghost" id="ttPdf">Download PDF</button>
  <button type="button" class="btn ghost" id="ttPrintBtn">Print</button>
  <button type="button" class="btn ghost danger" id="ttClear">Clear all classes</button>
  <a class="btn ghost" id="dl" hidden>Download</a>
</div>
<p class="msg" id="msg"></p>

<dialog class="tt-dlg" id="ttDlg" aria-labelledby="ttDlgT">
  <form method="dialog" id="ttForm">
    <h3 id="ttDlgT">Add a class</h3>
    <p class="tt-note" id="ttDlgWhen" style="margin:0 0 12px"></p>
    <div class="fields">
      <div class="tt-full"><label for="ttSubj">Subject</label><input type="text" id="ttSubj" data-nomemo maxlength="60" list="ttSubjects" autocomplete="off" required placeholder="e.g. Mathematics"><datalist id="ttSubjects"></datalist></div>
      <div><label for="ttRoom">Room (optional)</label><input type="text" id="ttRoom" data-nomemo maxlength="40"></div>
      <div><label for="ttTeacher">Teacher (optional)</label><input type="text" id="ttTeacher" data-nomemo maxlength="50"></div>
      <div><label for="ttSpan">Length</label><select id="ttSpan" data-nomemo></select></div>
      <div><label>Colour</label><div class="tt-sw" id="ttSw"></div></div>
    </div>
    <div class="btns" style="margin-top:6px">
      <button type="submit" class="btn" id="ttSave" value="save">Save</button>
      <button type="button" class="btn ghost" id="ttCancel">Cancel</button>
      <button type="button" class="btn ghost danger" id="ttDel" hidden>Delete</button>
    </div>
  </form>
</dialog>
<script src="../assets/vendor/pdf-lib.min.js"></script>
<script>
(function () {
  var KEY = 'gtn-timetable';
  var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var COLORS = ['#dbeafe', '#dcfce7', '#fef3c7', '#fee2e2', '#ede9fe', '#fce7f3', '#cffafe', '#ffedd5', '#e2e8f0', '#d9f99d', '#2563eb', '#059669'];
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function say(cls, t) { $('msg').className = 'msg ' + (cls || ''); $('msg').textContent = t || ''; }
  function toMin(t) { var m = String(t || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; }
  function hhmm(n) { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
  function show(n) {
    if (n == null) return '';
    if (st.clock !== '12') return hhmm(n);
    var h = Math.floor(n / 60) % 24, m = n % 60;
    return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm');
  }
  function ink(bg) {
    var m = String(bg).match(/^#([0-9a-f]{6})$/i); if (!m) return '#111111';
    var v = parseInt(m[1], 16), r = v >> 16 & 255, g = v >> 8 & 255, b = v & 255;
    var L = function (c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    return 0.2126 * L(r) + 0.7152 * L(g) + 0.0722 * L(b) > 0.4 ? '#111111' : '#ffffff';
  }

  // ---------- state ----------
  var st = { name: '', days: [0, 1, 2, 3, 4], clock: '24', periods: [], classes: [], gen: null };
  function generate(o) {
    var start = toMin(o.start), end = toMin(o.end), len = Math.max(5, +o.len || 45), gap = Math.max(0, +o.gap || 0), out = [], t = start, n = 0;
    if (start == null || end == null || end <= start) return null;
    var b1 = +o.b1 || 0, b1l = +o.b1l || 0, b2 = +o.b2 || 0, b2l = +o.b2l || 0;
    while (t + len <= end && n < 20) {
      n++; out.push({ id: uid(), start: t, end: t + len, brk: false, label: 'Period ' + n }); t += len;
      var extra = [];
      if (n === b1 && b1l > 0) extra.push(['Break', b1l]);
      if (n === b2 && b2l > 0) extra.push(['Lunch', b2l]);
      if (extra.length) extra.forEach(function (x) { if (t + x[1] <= end) { out.push({ id: uid(), start: t, end: t + x[1], brk: true, label: x[0] }); t += x[1]; } });
      else t += gap;
    }
    return out;
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.periods)) {
        st.name = String(s.name || ''); st.clock = s.clock === '12' ? '12' : '24';
        st.days = Array.isArray(s.days) ? s.days.filter(function (d) { return d >= 0 && d < 7; }) : st.days;
        st.periods = s.periods.filter(function (p) { return p && p.id; }); st.classes = Array.isArray(s.classes) ? s.classes.filter(function (c) { return c && c.pid; }) : [];
        st.gen = s.gen || null;
        return;
      }
    } catch (e) {}
    st.periods = generate({ start: '08:00', end: '15:00', len: 45, gap: 0, b1: 2, b1l: 15, b2: 4, b2l: 45 });
  }
  var saveTimer;
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { say('bad', 'Could not save in this browser.'); } }, 250); }

  // ---------- grid ----------
  // Periods a class covers: its start period plus following teaching periods, stopping at a break.
  function covered(c) {
    var i = st.periods.findIndex(function (p) { return p.id === c.pid; }), out = [];
    if (i === -1) return out;
    for (var k = i; k < st.periods.length && out.length < (c.span || 1); k++) { if (st.periods[k].brk) break; out.push(st.periods[k].id); }
    return out;
  }
  function maxSpan(day, pid, ignore) {
    var i = st.periods.findIndex(function (p) { return p.id === pid; }), n = 0;
    for (var k = i; k < st.periods.length; k++) {
      var p = st.periods[k]; if (p.brk) break;
      if (k > i && st.classes.some(function (c) { return c !== ignore && c.day === day && covered(c).indexOf(p.id) !== -1; })) break;
      n++;
    }
    return n;
  }
  function occupancy() {
    var occ = {};
    st.classes.forEach(function (c) { covered(c).forEach(function (pid, j) { occ[c.day + ':' + pid] = j === 0 ? c : 'cont'; }); });
    return occ;
  }
  function draw() {
    var t = $('ttTable'), days = st.days.slice().sort(), occ = occupancy();
    t.style.setProperty('--tt-n', Math.max(1, days.length));
    $('ttTitleOut').textContent = st.name;
    var h = '<thead><tr><th class="tt-time" scope="col">Time</th>';
    days.forEach(function (d) { h += '<th scope="col">' + DAYS[d] + '</th>'; });
    h += '</tr></thead><tbody></tbody>';
    t.innerHTML = h;
    var tb = t.tBodies[0], pn = 0;
    if (!days.length) { tb.innerHTML = '<tr><td style="padding:20px;text-align:center;color:var(--muted)">Choose at least one day above.</td></tr>'; return; }
    if (!st.periods.length) { tb.innerHTML = '<tr><td colspan="' + (days.length + 1) + '" style="padding:20px;text-align:center;color:var(--muted)">Add periods under “Times and periods”.</td></tr>'; return; }
    st.periods.forEach(function (p) {
      var tr = document.createElement('tr'), th = document.createElement('th');
      th.className = 'tt-time'; th.scope = 'row';
      var b = document.createElement('b'); b.textContent = p.brk ? '' : (p.label || 'Period ' + (pn + 1));
      if (!p.brk) { pn++; th.appendChild(b); }
      th.appendChild(document.createTextNode(show(p.start) + (p.end != null ? '–' + show(p.end) : '')));
      tr.appendChild(th);
      if (p.brk) {
        tr.className = 'tt-brk';
        var td = document.createElement('td'); td.colSpan = days.length; td.textContent = p.label || 'Break'; tr.appendChild(td);
      } else days.forEach(function (d) {
        var o = occ[d + ':' + p.id]; if (o === 'cont') return;
        var td = document.createElement('td'), btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'tt-cell';
        var when = DAYS[d] + ', ' + (p.label || 'period') + ' (' + show(p.start) + '–' + show(p.end) + ')';
        if (o) {
          var n = covered(o).length; td.rowSpan = n;
          btn.classList.add('tt-cls'); btn.style.setProperty('--tt-bg', o.color || COLORS[0]); btn.style.setProperty('--tt-ink', ink(o.color || COLORS[0]));
          var s = document.createElement('b'); s.textContent = o.subject; btn.appendChild(s);
          [o.room, o.teacher].forEach(function (x) { if (x) { var sp = document.createElement('span'); sp.textContent = x; btn.appendChild(sp); } });
          btn.setAttribute('aria-label', o.subject + (o.room ? ', room ' + o.room : '') + (o.teacher ? ', ' + o.teacher : '') + '. ' + when + '. Click to edit.');
          btn.addEventListener('click', function () { openEditor(d, p.id, o); });
        } else {
          btn.textContent = '+'; btn.setAttribute('aria-label', 'Add a class on ' + when);
          btn.addEventListener('click', function () { openEditor(d, p.id, null); });
        }
        td.appendChild(btn); tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }

  // ---------- days and periods ----------
  function drawDays() {
    var box = $('ttDays'); box.innerHTML = '';
    DAYS.forEach(function (n, i) {
      var l = document.createElement('label'), c = document.createElement('input');
      c.type = 'checkbox'; c.id = 'ttD' + i; c.setAttribute('data-nomemo', ''); c.checked = st.days.indexOf(i) !== -1;
      c.addEventListener('change', function () { st.days = DAYS.map(function (x, k) { return $('ttD' + k).checked ? k : -1; }).filter(function (k) { return k >= 0; }); draw(); save(); });
      l.appendChild(c); l.appendChild(document.createTextNode(n.slice(0, 3))); l.title = n; box.appendChild(l);
    });
  }
  function drawPeriods() {
    var box = $('ttPeriods'); box.innerHTML = '';
    st.periods.forEach(function (p, i) {
      var row = document.createElement('div'); row.className = 'tt-prow' + (p.brk ? ' brk' : '');
      row.innerHTML = '<input type="text" data-k="label" data-nomemo maxlength="30" aria-label="Name of row ' + (i + 1) + '"><input type="time" data-k="start" data-nomemo aria-label="Start time of row ' + (i + 1) + '"><input type="time" data-k="end" data-nomemo aria-label="End time of row ' + (i + 1) + '"><label><input type="checkbox" data-k="brk" data-nomemo>Break</label><button type="button" aria-label="Remove row ' + (i + 1) + '">✕</button>';
      var q = function (k) { return row.querySelector('[data-k=' + k + ']'); };
      q('label').value = p.label || ''; q('start').value = p.start != null ? hhmm(p.start) : ''; q('end').value = p.end != null ? hhmm(p.end) : ''; q('brk').checked = !!p.brk;
      q('label').addEventListener('input', function () { p.label = q('label').value; draw(); save(); });
      ['start', 'end'].forEach(function (k) { q(k).addEventListener('change', function () { var v = toMin(q(k).value); if (v == null) return; p[k] = v; if (p.end != null && p.start != null && p.end <= p.start) say('bad', 'Row ' + (i + 1) + ' ends before it starts. Check its times.'); else say('', ''); draw(); save(); }); });
      q('brk').addEventListener('change', function () {
        if (q('brk').checked && st.classes.some(function (c) { return covered(c).indexOf(p.id) !== -1; }) && !confirm('Classes in this row will be removed or shortened. Make it a break?')) { q('brk').checked = false; return; }
        p.brk = q('brk').checked; if (p.brk && /^Period \d+$/.test(p.label || '')) p.label = 'Break';
        st.classes = st.classes.filter(function (c) { return c.pid !== p.id || !p.brk; });
        renumber(); drawPeriods(); draw(); save();
      });
      row.querySelector('button').addEventListener('click', function () {
        var uses = st.classes.filter(function (c) { return c.pid === p.id; });
        if (uses.length && !confirm('Remove this row and the ' + uses.length + (uses.length === 1 ? ' class' : ' classes') + ' that start in it?')) return;
        st.classes = st.classes.filter(function (c) { return c.pid !== p.id; });
        st.periods.splice(i, 1); renumber(); drawPeriods(); draw(); save();
      });
      box.appendChild(row);
    });
  }
  // Keep automatic names (Period 1, Period 2…) in order after rows change; names the user typed stay.
  function renumber() { var n = 0; st.periods.forEach(function (p) { if (p.brk) return; n++; if (!p.label || /^Period \d+$/.test(p.label)) p.label = 'Period ' + n; }); }
  $('ttAddP').addEventListener('click', function () {
    var last = st.periods[st.periods.length - 1], lastP = st.periods.filter(function (p) { return !p.brk; }).pop();
    var len = lastP && lastP.end != null ? lastP.end - lastP.start : 45, s = last && last.end != null ? last.end : 480;
    st.periods.push({ id: uid(), start: s, end: s + len, brk: false, label: '' }); renumber(); drawPeriods(); draw(); save();
  });
  $('ttAddB').addEventListener('click', function () {
    var last = st.periods[st.periods.length - 1], s = last && last.end != null ? last.end : 480;
    st.periods.push({ id: uid(), start: s, end: s + 15, brk: true, label: 'Break' }); drawPeriods(); draw(); save();
  });
  $('ttGen').addEventListener('click', function () {
    var o = { start: $('ttStart').value, end: $('ttEnd').value, len: $('ttLen').value, gap: $('ttGap').value, b1: $('ttB1').value, b1l: $('ttB1L').value, b2: $('ttB2').value, b2l: $('ttB2L').value };
    var ps = generate(o);
    if (!ps) { say('bad', 'The day must end after it starts.'); return; }
    if (!ps.length) { say('bad', 'A ' + (+o.len || 45) + '-minute period does not fit between these times.'); return; }
    // Classes keep their place by period number, so a new set of times does not wipe the timetable.
    var oldTeach = st.periods.filter(function (p) { return !p.brk; }), newTeach = ps.filter(function (p) { return !p.brk; }), lost = 0;
    st.classes = st.classes.filter(function (c) { var i = oldTeach.findIndex(function (p) { return p.id === c.pid; }); if (i === -1 || i >= newTeach.length) { lost++; return false; } c.pid = newTeach[i].id; return true; });
    st.periods = ps; st.gen = o; drawPeriods(); draw(); save();
    say(lost ? 'bad' : 'ok', 'Made ' + newTeach.length + ' periods.' + (lost ? ' ' + lost + (lost === 1 ? ' class was' : ' classes were') + ' removed because their period no longer exists.' : ''));
  });
  $('ttClock').addEventListener('change', function () { st.clock = $('ttClock').value; draw(); save(); });
  $('ttName').addEventListener('input', function () { st.name = $('ttName').value; $('ttTitleOut').textContent = st.name; save(); });

  // ---------- the class editor ----------
  var ed = null, color = COLORS[0];
  function drawSwatches() {
    var box = $('ttSw'); box.innerHTML = '';
    COLORS.forEach(function (c) { var b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', 'Colour ' + c); b.setAttribute('aria-pressed', c === color); b.addEventListener('click', function () { color = c; drawSwatches(); }); box.appendChild(b); });
    var inp = document.createElement('input'); inp.type = 'color'; inp.value = /^#[0-9a-f]{6}$/i.test(color) ? color : '#dbeafe'; inp.setAttribute('aria-label', 'Pick any colour'); inp.setAttribute('data-nomemo', '');
    inp.addEventListener('input', function () { color = inp.value; box.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); });
    box.appendChild(inp);
  }
  function subjects() { var m = {}; st.classes.forEach(function (c) { m[c.subject.toLowerCase()] = c; }); return m; }
  function openEditor(day, pid, cls) {
    var p = st.periods.filter(function (x) { return x.id === pid; })[0];
    ed = { day: day, pid: pid, cls: cls };
    $('ttDlgT').textContent = cls ? 'Edit class' : 'Add a class';
    $('ttDlgWhen').textContent = DAYS[day] + ' · ' + (p.label || 'Period') + ' · ' + show(p.start) + '–' + show(p.end);
    $('ttSubj').value = cls ? cls.subject : ''; $('ttRoom').value = cls ? cls.room || '' : ''; $('ttTeacher').value = cls ? cls.teacher || '' : '';
    var used = Object.keys(subjects()).map(function (k) { return subjects()[k]; });
    color = cls ? cls.color : COLORS[used.length % COLORS.length];
    drawSwatches();
    var max = maxSpan(day, pid, cls), sel = $('ttSpan'); sel.innerHTML = '';
    for (var i = 1; i <= Math.max(1, max); i++) { var o = document.createElement('option'); o.value = i; o.textContent = i === 1 ? '1 period' : i + ' periods (double, triple…)'.replace(' (double, triple…)', i === 2 ? ' (double)' : i === 3 ? ' (triple)' : ''); sel.appendChild(o); }
    sel.value = cls ? Math.min(cls.span || 1, max) : 1; sel.disabled = max <= 1;
    $('ttSubjects').innerHTML = ''; used.forEach(function (c) { var o = document.createElement('option'); o.value = c.subject; $('ttSubjects').appendChild(o); });
    $('ttDel').hidden = !cls;
    var dlg = $('ttDlg');
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    setTimeout(function () { $('ttSubj').focus(); }, 30);
  }
  function closeEditor() { var d = $('ttDlg'); if (d.close) d.close(); else d.removeAttribute('open'); ed = null; }
  $('ttSubj').addEventListener('change', function () {
    // Picking a subject you used before fills in its room, teacher and colour.
    var prev = subjects()[$('ttSubj').value.trim().toLowerCase()];
    if (prev && (!ed || !ed.cls)) { if (!$('ttRoom').value) $('ttRoom').value = prev.room || ''; if (!$('ttTeacher').value) $('ttTeacher').value = prev.teacher || ''; color = prev.color; drawSwatches(); }
  });
  $('ttForm').addEventListener('submit', function (e) {
    e.preventDefault(); if (!ed) return;
    var subj = $('ttSubj').value.trim(); if (!subj) { $('ttSubj').focus(); return; }
    var c = ed.cls || { id: uid(), day: ed.day, pid: ed.pid };
    c.subject = subj; c.room = $('ttRoom').value.trim(); c.teacher = $('ttTeacher').value.trim(); c.color = color; c.span = +$('ttSpan').value || 1;
    if (!ed.cls) st.classes.push(c);
    closeEditor(); draw(); save(); say('', '');
  });
  $('ttCancel').addEventListener('click', closeEditor);
  $('ttDel').addEventListener('click', function () { if (!ed || !ed.cls) return; st.classes = st.classes.filter(function (c) { return c !== ed.cls; }); closeEditor(); draw(); save(); say('', 'Class deleted.'); });
  $('ttDlg').addEventListener('click', function (e) { if (e.target === $('ttDlg')) closeEditor(); });
  $('ttClear').addEventListener('click', function () { if (!st.classes.length) { say('', 'There are no classes to clear.'); return; } if (!confirm('Delete all ' + st.classes.length + ' classes? Days and times stay.')) return; st.classes = []; draw(); save(); say('', 'All classes cleared.'); });

  // ---------- picture, PDF and print ----------
  function wrap(ctx, text, maxW, maxLines) {
    var words = String(text).split(/\s+/), lines = [], line = '';
    words.forEach(function (w) {
      var test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width <= maxW || !line) line = test; else { lines.push(line); line = w; }
    });
    if (line) lines.push(line);
    lines = lines.map(function (l) { if (ctx.measureText(l).width <= maxW) return l; while (l.length > 1 && ctx.measureText(l + '…').width > maxW) l = l.slice(0, -1); return l + '…'; });
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); var last = lines[maxLines - 1]; while (last.length > 1 && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1); lines[maxLines - 1] = last + '…'; }
    return lines;
  }
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function render(scale) {
    var days = st.days.slice().sort(), occ = occupancy();
    if (!days.length || !st.periods.length) return null;
    var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    var TW = 120, DW = days.length > 5 ? 170 : 200, HH = 46, RH = 78, BH = 36, PAD = 24, TT = st.name ? 54 : 0;
    var rows = st.periods.map(function (p) { return p.brk ? BH : RH; }), H = PAD * 2 + TT + HH + rows.reduce(function (a, b) { return a + b; }, 0), W = PAD * 2 + TW + DW * days.length;
    var c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
    var x = c.getContext('2d'); x.scale(scale, scale);
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
    x.textBaseline = 'middle'; x.textAlign = 'center';
    if (st.name) { x.fillStyle = '#111827'; x.font = '700 24px ' + FONT; x.fillText(wrap(x, st.name, W - PAD * 2, 1)[0], W / 2, PAD + TT / 2 - 6); }
    var top = PAD + TT, left = PAD;
    x.fillStyle = '#f3f4f6'; x.fillRect(left, top, W - PAD * 2, HH);
    x.fillStyle = '#374151'; x.font = '700 15px ' + FONT; x.fillText('Time', left + TW / 2, top + HH / 2);
    days.forEach(function (d, i) { x.fillText(DAYS[d], left + TW + DW * i + DW / 2, top + HH / 2); });
    var y = top + HH, pn = 0;
    st.periods.forEach(function (p, r) {
      var h = rows[r];
      x.fillStyle = '#f9fafb'; x.fillRect(left, y, TW, h);
      if (p.brk) {
        x.fillStyle = '#f3f4f6'; x.fillRect(left + TW, y, DW * days.length, h);
        x.fillStyle = '#6b7280'; x.font = '700 13px ' + FONT; x.fillText((p.label || 'Break').toUpperCase(), left + TW + DW * days.length / 2, y + h / 2);
        x.font = '12px ' + FONT; x.fillText(show(p.start) + '–' + show(p.end), left + TW / 2, y + h / 2);
      } else {
        pn++;
        x.fillStyle = '#111827'; x.font = '700 14px ' + FONT; x.fillText(wrap(x, p.label || 'Period ' + pn, TW - 12, 1)[0], left + TW / 2, y + h / 2 - 10);
        x.fillStyle = '#6b7280'; x.font = '12.5px ' + FONT; x.fillText(show(p.start) + '–' + show(p.end), left + TW / 2, y + h / 2 + 10);
        days.forEach(function (d, i) {
          var o = occ[d + ':' + p.id]; if (!o || o === 'cont') return;
          var span = covered(o), hh = 0, k = r; span.forEach(function () { hh += rows[k++]; });
          var cx = left + TW + DW * i + 4, cy = y + 4, cw = DW - 8, ch = hh - 8;
          x.fillStyle = o.color || COLORS[0]; rr(x, cx, cy, cw, ch, 8); x.fill();
          x.strokeStyle = 'rgba(0,0,0,.08)'; x.lineWidth = 1; x.stroke();
          var fg = ink(o.color || COLORS[0]), lines = [];
          x.font = '700 15px ' + FONT; var sub = wrap(x, o.subject, cw - 14, ch > 80 ? 3 : 2);
          var extra = [o.room, o.teacher].filter(Boolean);
          var lh = 18, total = sub.length * lh + extra.length * 16, ty = cy + ch / 2 - total / 2 + lh / 2;
          x.fillStyle = fg; sub.forEach(function (l) { x.fillText(l, cx + cw / 2, ty); ty += lh; });
          x.font = '12.5px ' + FONT; x.globalAlpha = .85; ty += -2;
          extra.forEach(function (l) { x.fillText(wrap(x, l, cw - 14, 1)[0], cx + cw / 2, ty); ty += 16; });
          x.globalAlpha = 1;
        });
      }
      y += h;
    });
    // grid lines (drawn last, skipping the inside of multi-period classes)
    x.strokeStyle = '#d1d5db'; x.lineWidth = 1;
    x.strokeRect(left + .5, top + .5, W - PAD * 2 - 1, H - PAD * 2 - TT - 1);
    x.beginPath();
    for (var i = 0; i <= days.length; i++) { var gx = Math.round(left + TW + DW * i) + .5; if (i < days.length) { x.moveTo(gx, top); x.lineTo(gx, top + HH); } }
    x.moveTo(left, top + HH + .5); x.lineTo(W - PAD, top + HH + .5);
    var yy = top + HH;
    st.periods.forEach(function (p, r) {
      var h = rows[r], nextY = yy + h;
      x.moveTo(left + TW + .5, yy); x.lineTo(left + TW + .5, nextY);
      if (!p.brk) days.forEach(function (d, i) { if (i) { var gx = Math.round(left + TW + DW * i) + .5; x.moveTo(gx, yy); x.lineTo(gx, nextY); } });
      if (r < st.periods.length - 1) {
        days.forEach(function (d, i) {
          var a = occ[d + ':' + p.id], nb = st.periods[r + 1], b = occ[d + ':' + nb.id];
          if (a && b === 'cont') return; // inside one class
          x.moveTo(left + TW + DW * i, Math.round(nextY) + .5); x.lineTo(left + TW + DW * (i + 1), Math.round(nextY) + .5);
        });
        x.moveTo(left, Math.round(nextY) + .5); x.lineTo(left + TW, Math.round(nextY) + .5);
      }
      yy = nextY;
    });
    x.stroke();
    return c;
  }
  function fname(ext) { return ((st.name || 'timetable').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '-').toLowerCase().slice(0, 50) || 'timetable') + '.' + ext; }
  var lastUrl = null;
  function give(blob, name, note) {
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    var a = $('dl'); a.href = lastUrl; a.download = name; a.textContent = 'Download ' + name; a.hidden = false;
    a.click();
    say('ok', note + ' · ' + fmtBytes(blob.size) + '. If it did not download, use the button above.');
  }
  function check() {
    if (!st.days.length) { say('bad', 'Choose at least one day first.'); return false; }
    if (!st.periods.length) { say('bad', 'Add some periods first.'); return false; }
    return true;
  }
  $('ttPng').addEventListener('click', function () {
    if (!check()) return;
    var c = render(2); c.toBlob(function (b) { if (!b) { say('bad', 'Your browser could not make the picture.'); return; } give(b, fname('png'), 'PNG ready (' + c.width + ' × ' + c.height + ' px)'); }, 'image/png');
  });
  $('ttPdf').addEventListener('click', function () {
    if (!check()) return;
    if (!window.PDFLib) { say('bad', 'The PDF maker did not load. Check your connection and reload the page.'); return; }
    var btn = this; btn.disabled = true; say('', 'Making PDF…');
    var c = render(2);
    new Promise(function (res) { c.toBlob(res, 'image/png'); }).then(function (b) { return b.arrayBuffer(); }).then(async function (buf) {
      var doc = await PDFLib.PDFDocument.create(), img = await doc.embedPng(buf);
      var land = c.width >= c.height, pw = land ? 841.89 : 595.28, ph = land ? 595.28 : 841.89, m = 28;
      var s = Math.min((pw - 2 * m) / img.width, (ph - 2 * m) / img.height), w = img.width * s, h = img.height * s;
      var page = doc.addPage([pw, ph]); page.drawImage(img, { x: (pw - w) / 2, y: ph - m - h, width: w, height: h });
      doc.setTitle(st.name || 'Timetable'); doc.setCreator('GetToolNest Timetable Maker');
      give(new Blob([await doc.save()], { type: 'application/pdf' }), fname('pdf'), 'PDF ready (A4 ' + (land ? 'landscape' : 'portrait') + ')');
    }).catch(function () { say('bad', 'Could not make the PDF. Try the PNG instead.'); }).then(function () { btn.disabled = false; });
  });
  $('ttPrintBtn').addEventListener('click', function () { if (check()) window.print(); });

  // ---------- start ----------
  load();
  $('ttName').value = st.name; $('ttClock').value = st.clock;
  if (st.gen) ['start', 'end', 'len', 'gap', 'b1', 'b1l', 'b2', 'b2l'].forEach(function (k) { var id = { start: 'ttStart', end: 'ttEnd', len: 'ttLen', gap: 'ttGap', b1: 'ttB1', b1l: 'ttB1L', b2: 'ttB2', b2l: 'ttB2L' }[k]; if (st.gen[k] != null) $(id).value = st.gen[k]; });
  drawDays(); drawPeriods(); draw();
})();
</script>
