<style>
.hww fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 4px; margin: 0 0 14px; min-width: 0; }
.hww legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.hww .fields { margin-bottom: 12px; }
.hww textarea { min-height: 90px; font-family: inherit; font-size: 16px; }
.hww .hw-chk { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; font-size: 14.5px; }
.hww .hw-chk input { width: 20px; height: 20px; flex: none; }
.hww .hw-hint { display: block; font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.hww .hw-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.hww .hw-prev canvas { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
.hww .hw-pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }
.hww .hw-pager button { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-size: 18px; }
.hww .hw-pager button:disabled { opacity: .4; cursor: default; }
</style>
<div class="hww" id="hww">
<fieldset><legend>What to practise</legend>
  <div class="fields">
    <div><label for="hwScript">Writing system</label><select id="hwScript"></select></div>
    <div><label for="hwWhat">Content</label><select id="hwWhat"></select></div>
    <div id="hwStyleBox"><label for="hwFont">Letter style</label><select id="hwFont"><option value="sans">Print (simple)</option><option value="kalam">Handwriting</option><option value="cursive">Joined-up / cursive</option></select></div>
  </div>
  <div class="fields" id="hwCustomBox" hidden><div style="grid-column:1/-1"><label for="hwText">Your text: one word, name or sentence per line</label><textarea id="hwText" data-nomemo maxlength="3000" dir="auto" placeholder="e.g. My name is Sara&#10;The cat sat on the mat"></textarea></div></div>
</fieldset>
<fieldset><legend>Lines and tracing</legend>
  <div class="fields">
    <div><label for="hwGuide">Guide lines</label><select id="hwGuide"><option value="four">4-line handwriting guide</option><option value="base">Baseline only</option><option value="grid">Square boxes (田 grid)</option><option value="grid8">Square boxes (米 grid)</option><option value="none">No lines</option></select></div>
    <div><label for="hwTrace">Tracing letters</label><select id="hwTrace"><option value="dot">Dotted</option><option value="dash">Dashed</option><option value="grey">Solid light grey</option></select></div>
    <div><label for="hwSize">Letter size</label><select id="hwSize"><option value="s">Small (lines 10 mm)</option><option value="m" selected>Medium (lines 15 mm)</option><option value="l">Large (lines 20 mm)</option><option value="xl">Extra large (lines 28 mm)</option></select></div>
    <div><label for="hwReps">Copies on each line</label><select id="hwReps"><option value="fill">Fill the line</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="8">8</option><option value="10">10</option></select></div>
    <div><label for="hwRows">Lines for each item</label><select id="hwRows"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
  </div>
  <label class="hw-chk"><input type="checkbox" id="hwModel" checked> First copy dark, as an example</label>
  <label class="hw-chk"><input type="checkbox" id="hwBlank"> Empty line after each item, for writing alone</label>
  <label class="hw-chk" id="hwArrowBox"><input type="checkbox" id="hwArrows" checked> Start dots and arrows (Latin letters and numbers)</label>
</fieldset>
<fieldset><legend>Page</legend>
  <div class="fields">
    <div><label for="hwPaper">Paper</label><select id="hwPaper"><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
    <div><label for="hwTitle">Title</label><input type="text" id="hwTitle" data-nomemo maxlength="70" dir="auto" placeholder="Automatic"></div>
  </div>
  <label class="hw-chk"><input type="checkbox" id="hwHead" checked> Name and date lines at the top</label>
</fieldset>
<div class="hw-prev"><canvas id="hwCanvas" width="595" height="842" aria-label="Worksheet preview"></canvas>
  <div class="hw-pager" id="hwPager"><button type="button" id="hwPrev" aria-label="Previous page">‹</button><span id="hwPageN">Page 1 of 1</span><button type="button" id="hwNext" aria-label="Next page">›</button></div>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="btns"><button type="button" class="btn" id="hwPdf">Download PDF</button></div>
<p class="hw-hint" style="margin-top:10px">Print at 100% ("Actual size"). Chinese and Japanese characters use your device's fonts, so they look the same as on screen.</p>
</div>
