<div class="fields">
  <div><label for="pick">Pick a color</label><input type="color" id="pick" value="#4f46e5" style="width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:4px;cursor:pointer"></div>
  <div><label for="txt">Or type HEX, RGB or HSL</label><input type="text" id="txt" value="#4f46e5" spellcheck="false" autocomplete="off"></div>
</div>
<div id="sw" style="height:90px;border-radius:14px;border:1px solid var(--line);background:#4f46e5"></div>
<div class="kv"><span>HEX</span><code id="hex">–</code><button class="btn ghost" data-c="hex">Copy</button></div>
<div class="kv"><span>RGB</span><code id="rgb">–</code><button class="btn ghost" data-c="rgb">Copy</button></div>
<div class="kv"><span>HSL</span><code id="hsl">–</code><button class="btn ghost" data-c="hsl">Copy</button></div>
<p class="msg" id="msg"></p>
<script>
(function () {
  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { return Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))); };
    return [f(0), f(8), f(4)];
  }
  function parse(v) {
    v = v.trim().toLowerCase();
    var m = v.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/);
    if (m) {
      var h = m[1]; if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    m = v.match(/^rgb\(?\s*(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})\s*\)?$/) || v.match(/^(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})$/);
    if (m && +m[1] <= 255 && +m[2] <= 255 && +m[3] <= 255) return [+m[1], +m[2], +m[3]];
    m = v.match(/^hsl\(?\s*(\d{1,3}(?:\.\d+)?)(?:deg)?[\s,]+(\d{1,3}(?:\.\d+)?)%?[\s,]+(\d{1,3}(?:\.\d+)?)%?\s*\)?$/);
    if (m && +m[1] <= 360 && +m[2] <= 100 && +m[3] <= 100) return hslToRgb(+m[1], +m[2], +m[3]);
    return null;
  }
  function show(c, from) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0, l = (mx + mn) / 2;
    var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
    var hex = '#' + c.map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    $('hex').textContent = hex;
    $('rgb').textContent = 'rgb(' + c.join(', ') + ')';
    $('hsl').textContent = 'hsl(' + h + ', ' + Math.round(s * 100) + '%, ' + Math.round(l * 100) + '%)';
    $('sw').style.background = hex; $('sw').style.opacity = ''; $('sw').style.borderStyle = '';
    if (from !== 'pick') $('pick').value = hex;
    if (from !== 'txt') $('txt').value = hex;
    $('msg').textContent = '';
  }
  $('pick').addEventListener('input', function () { show(parse($('pick').value), 'pick'); });
  $('txt').addEventListener('input', function () {
    var c = parse($('txt').value);
    if (c) show(c, 'txt');
    else {
      // do not leave the last good colour on screen: it would look like the result of what is typed now
      ['hex', 'rgb', 'hsl'].forEach(function (id) { $(id).textContent = '–'; });
      $('sw').style.background = 'transparent'; $('sw').style.borderStyle = 'dashed';
      $('msg').className = 'msg ' + ($('txt').value.trim() ? 'bad' : '');
      $('msg').textContent = $('txt').value.trim() ? 'That is not a color code yet. Use a format like #4f46e5, rgb(79, 70, 229) or hsl(243, 75%, 59%).' : 'Type a color code, or use the color picker.';
    }
  });
  document.querySelectorAll('[data-c]').forEach(function (b) {
    b.addEventListener('click', function () { var v = $(b.dataset.c).textContent; if (v !== '–') copyText(v, b); });
  });
  show(parse('#4f46e5'));
})();
</script>
