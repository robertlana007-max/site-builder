<style>
.ex-list { display: grid; gap: 12px; margin-bottom: 14px; }
.ex-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; min-width: 0; }
.ex-card img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.ex-card h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
.ex-sum { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
.ex-warn { color: var(--bad); font-weight: 600; }
.ex-okk { color: var(--ok); font-weight: 600; }
.ex-card details { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 10px; }
.ex-card summary { cursor: pointer; padding: 8px 10px; font-weight: 600; font-size: 14px; }
.ex-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ex-tbl th, .ex-tbl td { text-align: start; padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.ex-tbl th { width: 38%; color: var(--muted); font-weight: 600; }
.ex-tbl tr.gps td, .ex-tbl tr.gps th { background: color-mix(in srgb, var(--bad) 8%, transparent); }
.ex-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.ex-row .btn { min-height: 38px; padding: 6px 12px; }

<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop photos here</b>JPG, PNG or WebP (one or many). They are read on your device and never uploaded.</div>
<input type="file" id="file" accept="image/*" multiple hidden data-nomemo>
<div class="stats" id="stats" hidden>
  <div class="stat"><span>Photos</span><b id="sN">0</b></div>
  <div class="stat"><span>With hidden data</span><b id="sM">0</b></div>
  <div class="stat"><span>With GPS location</span><b id="sG">0</b></div>
</div>
<div class="ex-list" id="list" aria-live="polite"></div>
<div class="checks"><label><input type="checkbox" id="keepIcc" checked> Keep the colour profile (recommended, holds no personal data)</label></div>
<div class="btns"><button class="btn" id="go" disabled>Remove metadata and download</button><button class="btn ghost" id="clear" hidden>Remove all photos</button><a class="btn ghost" id="dl" hidden>Download</a></div>
<p class="msg" id="msg"></p>

  $('keepIcc').addEventListener('change', function () { $('dl').hidden = true; });
  PT.drop(true, async function (files) {
    if (busy) return;
    var bad = [], heic = [];
    for (var f of files) {
      if (/\.(hei[cf])$/i.test(f.name) || /hei[cf]/i.test(f.type)) { heic.push(f.name); continue; }
      if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|bmp|avif|tiff?)$/i.test(f.name)) { bad.push(f.name); continue; }
      if (f.size > 200 * 1048576) { bad.push(f.name + ' (too large)'); continue; }
      var u = new Uint8Array(await f.arrayBuffer()), info = inspect(u);
      { // make sure the picture really opens (a damaged file can still start like a JPG) before we promise to clean it
        var ok = await new Promise(function (res) { loadImage(f, function (im) { res(!!(im && im.naturalWidth)); }); });
        if (!ok) { bad.push(f.name); continue; }
      }
      items.push({ file: f, u: u, info: info, url: URL.createObjectURL(f) });
    }
    render();
    var n = [];
    if (items.length) { var g = items.filter(function (it) { return it.info.gps; }).length; n.push(g ? g + (g === 1 ? ' photo shows' : ' photos show') + ' the place where it was taken. Clean before you share.' : 'Check what each photo contains, then download the clean copies.'); }
    if (bad.length) n.push('Could not read ' + bad.join(', ') + ': damaged or not a supported image.');
    if (heic.length) n.push(heic.join(', ') + ': HEIC photos need converting first. Use the HEIC to JPG tool, which also drops the hidden data.');
    say(bad.length || heic.length ? 'bad' : '', n.join(' '));
  });
  render();
})();
</script>
