<style>
.sdk .sdk-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.sdk .sdk-tabs .btn { flex: 1; justify-content: center; min-width: 90px; }
.sdk fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.sdk legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.sdk .sdk-board { display: grid; grid-template-columns: repeat(9, 1fr); width: 100%; max-width: 460px; aspect-ratio: 1; margin: 0 auto; border: 2.5px solid var(--ink); background: var(--ink); gap: 1px; user-select: none; touch-action: manipulation; }
.sdk .sdk-board button { all: unset; box-sizing: border-box; background: var(--surface); color: var(--accent); display: grid; place-items: center; font-size: clamp(16px, 5.2vw, 26px); font-weight: 600; cursor: pointer; position: relative; aspect-ratio: 1; min-width: 0; }
.sdk .sdk-board button.g { color: var(--ink); font-weight: 800; }
.sdk .sdk-board button.c3 { border-right: 2px solid var(--ink); } .sdk .sdk-board button.r3 { border-bottom: 2px solid var(--ink); }
.sdk .sdk-board button.hl { background: var(--accent-soft); }
.sdk .sdk-board button.same { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.sdk .sdk-board button.sel { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.sdk .sdk-board button.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.sdk .sdk-board button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.sdk .sdk-board button .n { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: clamp(7px, 2vw, 10px); font-weight: 500; color: var(--muted); line-height: 1; }
.sdk .sdk-board button .n i { font-style: normal; display: grid; place-items: center; }
.sdk .sdk-pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; max-width: 460px; margin: 12px auto 0; }
.sdk .sdk-pad button { font: inherit; font-size: 20px; font-weight: 700; min-height: 46px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 0; }
.sdk .sdk-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 460px; margin: 10px auto 0; }
.sdk .sdk-tools .btn { min-height: 40px; padding: 4px 12px; }
.sdk .sdk-bar { display: flex; justify-content: space-between; max-width: 460px; margin: 0 auto 8px; font-size: 14px; color: var(--muted); }
.sdk .sdk-hint { display: block; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.sdk .sdk-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.sdk textarea { min-height: 90px; font-family: ui-monospace, monospace; font-size: 15px; }
</style>
<div class="sdk" id="sdk">
<div class="sdk-tabs" role="group" aria-label="What do you want to do?">
  <button type="button" class="btn ghost" data-tab="play" aria-pressed="true">Play</button>
  <button type="button" class="btn ghost" data-tab="print" aria-pressed="false">Print</button>
  <button type="button" class="btn ghost" data-tab="solve" aria-pressed="false">Solve</button>
</div>
<div id="sdTop">
  <div class="fields" id="sdLevelBox"><div><label for="sdLevel">Difficulty</label><select id="sdLevel"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="expert">Expert</option></select></div></div>
</div>
<div id="sdPlay">
  <div class="btns" style="margin:0 0 12px"><button type="button" class="btn" id="sdNew">New puzzle</button></div>
  <div class="sdk-bar"><span id="sdInfo">Medium</span><span id="sdTime">0:00</span></div>
  <div class="sdk-board" id="sdBoard" role="grid" aria-label="Sudoku board"></div>
  <div class="sdk-pad" id="sdPad" aria-label="Numbers"></div>
  <div class="sdk-tools">
    <button type="button" class="btn ghost" id="sdNotes" aria-pressed="false">Notes: off</button>
    <button type="button" class="btn ghost" id="sdErase">Erase</button>
    <button type="button" class="btn ghost" id="sdUndo">Undo</button>
    <button type="button" class="btn ghost" id="sdCheck">Check</button>
    <button type="button" class="btn ghost" id="sdHint">Hint</button>
    <button type="button" class="btn ghost" id="sdReveal">Show solution</button>
  </div>
</div>
<div id="sdPrint" hidden>
  <fieldset><legend>Printable puzzles</legend>
    <div class="fields">
      <div><label for="sdCount">Number of puzzles</label><input type="number" id="sdCount" min="1" max="100" value="6" step="1" inputmode="numeric"></div>
      <div><label for="sdPer">Puzzles per page</label><select id="sdPer"><option value="1">1 (large)</option><option value="2">2</option><option value="4">4</option><option value="6" selected>6</option></select></div>
      <div><label for="sdPaper">Paper</label><select id="sdPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
    </div>
    <div class="fields"><div><label for="sdTitle">Title (optional)</label><input type="text" id="sdTitle" data-nomemo maxlength="60" placeholder="e.g. Puzzle Club Week 3"></div></div>
    <label class="sdk-check"><input type="checkbox" id="sdAns" checked>Add the answers at the end</label>
  </fieldset>
  <div class="btns"><button type="button" class="btn" id="sdPdf">Make PDF</button></div>
</div>
<div id="sdSolve" hidden>
  <span class="sdk-hint">Tap a square and a number to copy a puzzle from a book or newspaper, or paste it below as 81 digits (use 0 or . for empty squares).</span>
  <label for="sdPaste">Paste a puzzle (optional)</label>
  <textarea id="sdPaste" data-nomemo maxlength="400" placeholder="530070000600195000098000060800060003400803001700020006060000280000419005000080079"></textarea>
  <div class="btns" style="margin:8px 0 14px"><button type="button" class="btn ghost" id="sdLoad">Put it on the board</button></div>
  <div class="sdk-board" id="sdBoard2" role="grid" aria-label="Puzzle to solve"></div>
  <div class="sdk-pad" id="sdPad2" aria-label="Numbers"></div>
  <div class="sdk-tools"><button type="button" class="btn" id="sdSolveBtn">Solve</button><button type="button" class="btn ghost" id="sdErase2">Erase square</button><button type="button" class="btn ghost" id="sdClear2">Clear board</button></div>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
