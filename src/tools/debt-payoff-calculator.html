<style>
.dpc .stat b { font-size: clamp(17px, 4.6vw, 22px); overflow-wrap: normal; word-break: normal; }
.dpc .dpc-list { display: grid; gap: 10px; margin: 0 0 12px; }
.dpc .dpc-row { display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)) 40px; gap: 8px; align-items: end; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.dpc .dpc-row label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
.dpc .dpc-row input { min-width: 0; }
.dpc .dpc-x { width: 40px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.dpc .dpc-x:hover { color: var(--bad); border-color: var(--bad); }
@media (max-width: 600px) { .dpc .dpc-row { grid-template-columns: 1fr 1fr; } .dpc .dpc-row > div:first-child { grid-column: 1 / -1; } .dpc .dpc-x { width: 100%; } }
.dpc .dpc-cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
.dpc .dpc-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
.dpc .dpc-card.best { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
.dpc .dpc-card h4 { margin: 0 0 6px; font-size: 16px; }
.dpc .dpc-card p { margin: 2px 0; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.dpc .dpc-card ol { margin: 6px 0 0; padding-inline-start: 20px; font-size: 14px; }
.dpc .dpc-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--ok); margin-inline-start: 6px; }
.dpc .dpc-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 8px; }
.dpc .dpc-head h3 { margin: 0; }
.dpc table.sched td, .dpc table.sched th { white-space: nowrap; }
.dpc table.sched td:last-child { white-space: normal; min-width: 140px; text-align: start; }
.fch { position: relative; margin: 16px 0 4px; }
.fch canvas { display: block; width: 100%; height: 240px; touch-action: pan-y; }
.fch-tip { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); margin-top: 6px; min-height: 20px; font-variant-numeric: tabular-nums; }
.fch-tip b { color: var(--ink); }
.fch-tip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
@media (max-width: 480px) { .dpc .stats { grid-template-columns: 1fr 1fr; } .dpc .stat { padding: 10px 12px; } }

<div class="dpc" id="dpc">
<div class="fields">
  <div><label for="dpcCur">Currency</label><select id="dpcCur" data-cur></select></div>
  <div hidden><label for="dpcSym">Your currency symbol</label><input type="text" id="dpcSym" data-cursym maxlength="6" placeholder="e.g. ¥ or KES"></div>
  <div><label for="dpcExtra">Extra you can pay each month</label><input type="number" id="dpcExtra" min="0" step="any" inputmode="decimal" value="100"></div>
</div>
<h3>Your debts</h3>
<div class="dpc-list" id="dpcList"></div>
<div class="btns" style="margin-top:0"><button type="button" class="btn ghost" id="dpcAdd">+ Add a debt</button><button type="button" class="btn ghost" id="dpcSample">Fill in an example</button><button type="button" class="btn ghost" id="dpcReset">Clear list</button></div>
<div class="stats">
  <div class="stat"><span>Total debt</span><b id="dpcTotal">–</b></div>
  <div class="stat"><span>Monthly budget for debts</span><b id="dpcBudget">–</b></div>
  <div class="stat"><span>Debt-free in (best plan)</span><b id="dpcFree">–</b></div>
  <div class="stat"><span>Interest saved vs minimums only</span><b id="dpcSaved">–</b></div>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="dpc-cmp" id="dpcCmp"></div>
<div class="dpc-head"><h3>Total balance over time</h3></div>
<div class="fch"><canvas id="dpcChart" role="img" aria-label="Line chart of total debt balance by month for each plan"></canvas><div class="fch-tip" id="dpcTip" aria-live="off"></div></div>
<div class="dpc-head"><h3>Month-by-month plan</h3>
  <div class="seg" role="group" aria-label="Plan shown in the table"><button type="button" data-v="av" aria-pressed="true">Avalanche</button><button type="button" data-v="sb" aria-pressed="false">Snowball</button></div>
</div>
<div class="scroll-x"><table class="sched"><thead><tr><th>Month</th><th>Paid</th><th>Interest</th><th>Balance left</th><th>Paid off</th></tr></thead><tbody id="dpcRows"></tbody></table></div>
<div class="btns"><button type="button" class="btn ghost" id="dpcCsv">Download plan (CSV)</button><button type="button" class="btn ghost" id="dpcCopy">Copy summary</button></div>
<a id="dl" hidden></a>
</div>

  function clear(msg, cls) { ['dpcTotal', 'dpcBudget', 'dpcFree', 'dpcSaved'].forEach(function (i) { $(i).textContent = '–'; }); $('dpcCmp').innerHTML = ''; $('dpcRows').innerHTML = ''; chart.set({ labels: [], series: [] }); last = null; say(cls || 'bad', msg); }
  function card(title, s, best, base, note) {
    var saved = base && !base.never ? base.int - s.int : null;
    return '<div class="dpc-card' + (best ? ' best' : '') + '"><h4>' + title + (best ? '<span class="dpc-tag">Saves the most</span>' : '') + '</h4>' +
      '<p>Debt-free: <b>' + (s.never ? 'Never at this payment' : dur(s.months) + ' (' + monthLabel(s.months) + ')') + '</b></p>' +
      '<p>Total interest: <b>' + (s.never ? '–' : money(s.int)) + '</b></p>' + (s.never ? '' : '<p>Total paid: ' + money(s.paid) + '</p>') +
      (saved != null && note ? '<p>Interest saved: <b>' + money(Math.max(0, saved)) + '</b></p>' : '') +
      (note && !s.never ? '<ol>' + s.order.map(function (d) { return '<li>' + esc(d.name) + ' – paid off in month ' + d.off + '</li>'; }).join('') + '</ol>' : '') + '</div>';
  }
  function calc() {
    var r = read(), extra = num('dpcExtra');
    if (isNaN(extra)) extra = 0;
    if (r.err) return clear(r.err);
    if (extra < 0) return clear('The extra payment cannot be negative.');
    if (extra > 1e12) return clear('The extra payment is too large.');
    if (!r.list.length) return clear('Add at least one debt with a balance, interest rate and minimum payment.', '');
    var av = sim(r.list, extra, 'av'), sb = sim(r.list, extra, 'sb'), mn = sim(r.list, 0, 'min');
    var tot = r.list.reduce(function (s, d) { return s + d.bal; }, 0);
    $('dpcTotal').textContent = money(tot);
    $('dpcBudget').textContent = money(av.budget);
    if (av.never) {
      $('dpcFree').textContent = 'Never'; $('dpcSaved').textContent = '–';
      $('dpcCmp').innerHTML = ''; $('dpcRows').innerHTML = ''; chart.set({ labels: [], series: [] }); last = null;
      return say('bad', 'Your payments do not cover the interest, so the debt would never be paid off (or it takes over 100 years). Raise the minimum payments or the extra amount.');
    }
    var best = av.int <= sb.int + 0.005 ? av : sb;
    $('dpcFree').textContent = dur(best.months);
    $('dpcSaved').textContent = mn.never ? 'Minimums never finish' : money(Math.max(0, mn.int - best.int));
    $('dpcCmp').innerHTML = card('Avalanche (highest interest first)', av, av.int < sb.int - 0.005, mn, true) + card('Snowball (smallest balance first)', sb, sb.int < av.int - 0.005, mn, true) + card('Minimum payments only', mn, false, null, false);
    var diff = sb.int - av.int, notes = [];
    if (Math.abs(diff) < 0.5) notes.push('Both plans cost about the same here.');
    else notes.push((diff > 0 ? 'Avalanche saves ' : 'Snowball saves ') + money(Math.abs(diff)) + ' in interest compared with ' + (diff > 0 ? 'snowball' : 'avalanche') + '.');
    if (mn.never) notes.push('With minimum payments only, at least one debt never gets paid off because its minimum does not cover its interest.');
    else notes.push('Paying ' + money(extra) + ' extra and rolling over each freed-up minimum saves ' + money(Math.max(0, mn.int - best.int)) + ' and ' + Math.max(0, mn.months - best.months) + ' months compared with minimums only.');
    say('ok', notes.join(' '));
    last = { av: av, sb: sb, mn: mn, extra: extra, tot: tot };
    table(); draw();
  }
  function table() {
    if (!last) return;
    var s = last[view];
    $('dpcRows').innerHTML = s.rows.map(function (r) { return '<tr><td>' + monthLabel(r.m) + '</td><td>' + money(r.paid) + '</td><td>' + money(r.int) + '</td><td>' + money(r.bal) + '</td><td>' + esc(r.done.join(', ')) + '</td></tr>'; }).join('');
  }
  function draw() {
    if (!last) return;
    var L = Math.max(last.av.rows.length, last.sb.rows.length, last.mn.never ? 0 : last.mn.rows.length);
    L = Math.min(L, MAXM);
    var labels = [], series = function (s) { var out = [last.tot]; for (var i = 0; i < L; i++) out.push(s.rows[i] ? s.rows[i].bal : 0); return out; };
    for (var i = 0; i <= L; i++) labels.push(i ? monthLabel(i) : 'Now');
    var S = [{ name: 'Avalanche', color: cssv('--accent', '#2563eb'), data: series(last.av) }, { name: 'Snowball', color: '#f59e0b', data: series(last.sb) }];
    if (!last.mn.never) S.push({ name: 'Minimums only', color: '#94a3b8', data: series(last.mn) });
    chart.set({ type: 'line', labels: labels, fmt: function (v) { return money(v, 0); }, series: S });
  }
  $('dpcList').addEventListener('input', function (e) {
    var row = e.target.closest('.dpc-row'); if (!row) return;
    debts[+row.dataset.i]['nbrm'.indexOf(e.target.dataset.f)] = e.target.value; save(); calc();
  });
  $('dpcList').addEventListener('click', function (e) {
    var b = e.target.closest('.dpc-x'); if (!b) return;
    debts.splice(+b.closest('.dpc-row').dataset.i, 1); if (!debts.length) debts.push(['', '', '', '']); save(); render(); calc();
  });
  $('dpcAdd').addEventListener('click', function () {
    if (debts.length >= 30) return say('bad', 'You can add up to 30 debts.');
    debts.push(['', '', '', '']); save(); render(); calc(); var f = $('dpcD' + debts.length + 'n'); if (f) f.focus();
  });
  $('dpcSample').addEventListener('click', function () { debts = SAMPLE.map(function (d) { return d.map(String); }); save(); render(); calc(); });
  $('dpcReset').addEventListener('click', function () { debts = [['', '', '', ''], ['', '', '', '']]; store(KEY, null); render(); calc(); });
  if ($('clearBtn')) $('clearBtn').addEventListener('click', function () { store(KEY, null); });
  document.querySelectorAll('.dpc .seg button').forEach(function (b) {
    b.addEventListener('click', function () { view = b.dataset.v; document.querySelectorAll('.dpc .seg button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); table(); });
  });
  $('dpcCsv').addEventListener('click', function () {
    if (!last) return say('bad', 'Enter your debts first.');
    var s = last[view], q = function (t) { t = String(t); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    var lines = ['Month,Paid,Interest,Balance left,Paid off'];
    s.rows.forEach(function (r) { lines.push([monthLabel(r.m), r.paid.toFixed(2), r.int.toFixed(2), r.bal.toFixed(2), q(r.done.join('; '))].join(',')); });
    var a = $('dl'); if (a.href) URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' })); a.download = 'debt-payoff-' + (view === 'av' ? 'avalanche' : 'snowball') + '.csv'; a.click();
    say('ok', 'Saved the ' + (view === 'av' ? 'avalanche' : 'snowball') + ' plan with ' + s.rows.length + ' months.');
  });
  $('dpcCopy').addEventListener('click', function () {
    if (!last) return say('bad', 'Enter your debts first.');
    var f = function (n, s) { return n + ': debt-free in ' + dur(s.months) + ', interest ' + (s.never ? 'never finishes' : money(s.int)); };
    copyText('Debt payoff plan (' + money(last.tot) + ' total, ' + money(last.extra) + ' extra per month)\n' + f('Avalanche', last.av) + '\n' + f('Snowball', last.sb) + '\n' + (last.mn.never ? 'Minimums only: never finishes' : f('Minimums only', last.mn)), this);
  });
  $('dpcExtra').addEventListener('input', calc);
  render();
  curWire(calc);
  calc();
})();
</script>
