<style>
.sv-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.sv-tabs button { font: 700 14.5px/1.2 inherit; font-family: inherit; min-height: 42px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer; padding: 6px; }
.sv-tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.sv-stage { background: repeating-conic-gradient(var(--line) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 14px; }
.sv-stage img, .sv-stage canvas { max-width: 100%; max-height: 50vh; display: block; margin: 0 auto; }
.sv-code { width: 100%; min-height: 120px; font-family: var(--mono); font-size: 13px; }
.sv-or { text-align: center; color: var(--muted); font-size: 14px; margin: -6px 0 8px; }
.sv-col { display: flex; gap: 8px; align-items: center; }
.sv-col input[type=color] { width: 56px; height: 44px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); flex: none; }
.sv-col label { margin: 0; font-weight: 400; font-size: 14px; }
.sv-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sv-cmp figure { margin: 0; } .sv-cmp figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
<div class="sv-tabs" role="tablist" aria-label="Direction">
  <button type="button" role="tab" id="tabA" aria-selected="true" aria-controls="paneA">SVG → PNG / JPG</button>
  <button type="button" role="tab" id="tabB" aria-selected="false" aria-controls="paneB">PNG / JPG → SVG</button>
</div>

<div id="paneA" role="tabpanel" aria-labelledby="tabA">
  <div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop an SVG file here</b>Turn it into a sharp PNG, JPG or WebP at any size. Nothing is uploaded.</div>
  <input type="file" id="file" accept=".svg,image/svg+xml" hidden data-nomemo>
  <p class="sv-or">or paste SVG code</p>
  <textarea id="code" class="sv-code" placeholder="&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; …&gt;…&lt;/svg&gt;" aria-label="SVG code" spellcheck="false" data-nomemo></textarea>
  <div class="sv-stage" id="stageA" hidden><canvas id="cvA" aria-label="Preview of the picture"></canvas></div>
  <div class="fields" style="margin-top:14px">
    <div><label for="sizeBy">Size</label><select id="sizeBy"><option value="scale">Scale</option><option value="width">Width in pixels</option><option value="height">Height in pixels</option></select></div>
    <div id="scaleW"><label for="scale">Scale</label><select id="scale"><option value="1">1× (original)</option><option value="2" selected>2×</option><option value="3">3×</option><option value="4">4×</option><option value="8">8×</option></select></div>
    <div id="pxW" hidden><label for="px">Pixels</label><input type="number" id="px" min="1" max="16000" value="1024"></div>
    <div><label for="fmtA">Save as</label><select id="fmtA"><option value="image/png">PNG (see-through)</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></div>
    <div><label for="bgA">Background</label><div class="sv-col"><input type="color" id="bgA" value="#ffffff" aria-label="Background colour"><label><input type="checkbox" id="transA" checked> See-through</label></div></div>
  </div>
  <p class="msg" id="infoA" style="margin-top:0"></p>
  <div class="btns"><button class="btn" id="goA" disabled>Convert and download</button></div>
</div>

<div id="paneB" role="tabpanel" aria-labelledby="tabB" hidden>
  <div class="drop" id="dropB" tabindex="0" role="button"><b>Click or drop a PNG or JPG here</b>Best for logos, icons, drawings and clip art with clear shapes. Nothing is uploaded.</div>
  <input type="file" id="fileB" accept="image/*" hidden data-nomemo>
  <div class="fields">
    <div><label for="modeB">Type of picture</label><select id="modeB"><option value="color">Colour logo or drawing</option><option value="bw">Black and white (line art, signature)</option><option value="photo">Photo (many colours, big file)</option></select></div>
    <div id="colsW"><label for="colors">Colours: <span id="colorsv">8</span></label><input type="range" id="colors" min="2" max="32" value="8"></div>
    <div id="thrW" hidden><label for="thr">Darkness cut-off: <span id="thrv">50</span>%</label><input type="range" id="thr" min="5" max="95" value="50"></div>
    <div><label for="detail">Detail: <span id="detailv">6</span></label><input type="range" id="detail" min="1" max="10" value="6"></div>
    <div><label for="speck">Ignore specks smaller than: <span id="speckv">8</span> px</label><input type="range" id="speck" min="0" max="64" value="8"></div>
    <div><label for="maxB">Tracing size</label><select id="maxB"><option value="700">Fast (up to 700 px)</option><option value="1200" selected>Normal (up to 1200 px)</option><option value="2000">Fine (up to 2000 px, slow)</option></select></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="noWhite"> Make the white background see-through</label></div>
  <div class="sv-cmp" id="cmpB" hidden>
    <figure class="sv-stage" style="margin:0"><img id="origB" alt="Your picture"><figcaption>Original</figcaption></figure>
    <figure class="sv-stage" style="margin:0"><img id="svgB" alt="Traced SVG"><figcaption id="capB">SVG</figcaption></figure>
  </div>
  <div class="btns"><button class="btn" id="goB" disabled>Download SVG</button><button class="btn ghost" id="copyB" disabled>Copy SVG code</button></div>
</div>
<a class="btn ghost" id="dl" hidden>Download</a>
<p class="msg" id="msg"></p>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  function say(c, t) { PT.say(c, t); }
  var lastUrl = null;
  function offer(blob, name, note) {
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    var a = $('dl'); a.href = lastUrl; a.download = name; a.textContent = 'Download ' + name; a.hidden = false; a.click(); if (window.burst) burst(a);
    say('ok', note + ' · ' + fmtBytes(blob.size) + '. If the download did not start, use the green button.');
  }
  // ---------- tabs ----------
  function tab(b) {
    var a = b === 'B';
    $('tabA').setAttribute('aria-selected', String(!a)); $('tabB').setAttribute('aria-selected', String(a));
    $('paneA').hidden = a; $('paneB').hidden = !a; $('dl').hidden = true; say('', '');
  }
  $('tabA').addEventListener('click', function () { tab('A'); });
  $('tabB').addEventListener('click', function () { tab('B'); });

  // ================= SVG -> PNG =================
  var svg = null; // { text, w, h, name, img }
  var MAX_SIDE = 16000, MAX_AREA = 40000000;
  function parseSvg(text, name) {
    var doc; try { doc = new DOMParser().parseFromString(text, 'image/svg+xml'); } catch (e) { doc = null; }
    var root = doc && doc.documentElement;
    if (!root || root.nodeName.toLowerCase() !== 'svg' || doc.getElementsByTagName('parsererror').length) return Promise.reject(new Error('This is not valid SVG code. It should start with <svg and end with </svg>.'));
    if (!root.getAttribute('xmlns')) root.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    // work out the natural size from width/height, or the viewBox if those are missing or in %
    var vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number), w = parseFloat(root.getAttribute('width')), h = parseFloat(root.getAttribute('height'));
    var pct = /%/.test(root.getAttribute('width') || '') || /%/.test(root.getAttribute('height') || '');
    var unit = function (v) { var m = String(v || '').match(/(mm|cm|in|pt|pc|em|ex)$/); return m ? { mm: 3.7795, cm: 37.795, in: 96, pt: 1.3333, pc: 16, em: 16, ex: 8 }[m[1]] : 1; };
    if (w && !pct) w *= unit(root.getAttribute('width')); if (h && !pct) h *= unit(root.getAttribute('height'));
    if (pct || !(w > 0) || !(h > 0)) {
      if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) { if (w > 0 && !pct) h = w * vb[3] / vb[2]; else if (h > 0 && !pct) w = h * vb[2] / vb[3]; else { w = vb[2]; h = vb[3]; } }
      else { w = w > 0 && !pct ? w : 300; h = h > 0 && !pct ? h : 150; }
    }
    if (!root.getAttribute('viewBox')) root.setAttribute('viewBox', '0 0 ' + (parseFloat(root.getAttribute('width')) || w) + ' ' + (parseFloat(root.getAttribute('height')) || h));
    root.setAttribute('preserveAspectRatio', root.getAttribute('preserveAspectRatio') || 'xMidYMid meet');
    var ext = text.match(/(xlink:)?href\s*=\s*["']https?:/i);
    return Promise.resolve({ doc: doc, root: root, w: w, h: h, name: name, external: !!ext });
  }
  // Render at the exact output size by setting width/height on the SVG itself, so it stays sharp.
  function rasterAt(s, W, H) {
    s.root.setAttribute('width', W); s.root.setAttribute('height', H);
    var text = new XMLSerializer().serializeToString(s.doc), url = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); res(im); };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Your browser could not draw this SVG. It may use features browsers do not support.')); };
      im.src = url;
    });
  }
  function outSize() {
    if (!svg) return null;
    var by = $('sizeBy').value, W, H, px = Math.max(1, Math.min(MAX_SIDE, parseInt($('px').value, 10) || 1024));
    if (by === 'scale') { W = svg.w * +$('scale').value; H = svg.h * +$('scale').value; }
    else if (by === 'width') { W = px; H = px * svg.h / svg.w; } else { H = px; W = px * svg.w / svg.h; }
    var f = Math.min(1, MAX_SIDE / Math.max(W, H), Math.sqrt(MAX_AREA / (W * H)));
    return { W: Math.max(1, Math.round(W * f)), H: Math.max(1, Math.round(H * f)), capped: f < 1 };
  }
  function syncA() {
    var by = $('sizeBy').value; $('scaleW').hidden = by !== 'scale'; $('pxW').hidden = by === 'scale';
    $('transA').disabled = $('fmtA').value === 'image/jpeg';
    $('goA').disabled = !svg;
    var o = outSize();
    $('infoA').textContent = o ? 'Original ' + Math.round(svg.w) + ' × ' + Math.round(svg.h) + ' px → result ' + o.W + ' × ' + o.H + ' px' + (o.capped ? ' (the largest size browsers can make)' : '') + '.' + (svg.external ? ' Note: pictures linked from the internet inside the SVG are not drawn.' : '') : '';
    $('dl').hidden = true;
  }
  var pvJob = 0;
  function previewA() {
    var mine = ++pvJob, s = Math.min(1, 900 / Math.max(svg.w, svg.h)) * Math.min(2, window.devicePixelRatio || 1), W = Math.max(1, Math.round(svg.w * s)), H = Math.max(1, Math.round(svg.h * s));
    rasterAt(svg, W, H).then(function (im) {
      if (mine !== pvJob) return;
      var cv = $('cvA'); cv.width = W; cv.height = H; cv.style.width = Math.round(W / Math.min(2, window.devicePixelRatio || 1)) + 'px';
      var x = cv.getContext('2d'); x.clearRect(0, 0, W, H); if (!$('transA').checked || $('fmtA').value === 'image/jpeg') { x.fillStyle = $('bgA').value; x.fillRect(0, 0, W, H); }
      x.drawImage(im, 0, 0, W, H); $('stageA').hidden = false;
    }, function (e) { if (mine === pvJob) { svg = null; syncA(); $('stageA').hidden = true; say('bad', e.message); } });
  }
  function useSvg(text, name) {
    if (text.length > 30 * 1048576) { say('bad', 'This SVG is too large (over 30 MB).'); return; }
    parseSvg(text, name).then(function (s) { svg = s; syncA(); say('', ''); previewA(); }, function (e) { svg = null; syncA(); $('stageA').hidden = true; say('bad', e.message); });
  }
  PT.drop(false, function (f) {
    if (!/svg/i.test(f.type) && !/\.svgz?$/i.test(f.name)) { say('bad', '"' + f.name + '" is not an SVG file. To turn a PNG or JPG into SVG, use the second tab.'); return; }
    f.text().then(function (t) { $('code').value = ''; useSvg(t, PT.base(f.name)); });
  });
  var codeT = 0;
  $('code').addEventListener('input', function () {
    clearTimeout(codeT);
    codeT = setTimeout(function () { var t = $('code').value.trim(); if (!t) { svg = null; syncA(); $('stageA').hidden = true; say('', ''); return; } useSvg(t, 'image'); }, 350);
  });
  ['sizeBy', 'scale', 'px', 'fmtA', 'bgA', 'transA'].forEach(function (id) { $(id).addEventListener('input', function () { syncA(); if (svg && /fmtA|bgA|transA/.test(id)) previewA(); }); $(id).addEventListener('change', function () { syncA(); }); });
  $('goA').addEventListener('click', function () {
    if (!svg) return;
    var o = outSize(), type = $('fmtA').value; $('goA').disabled = true; say('', 'Converting…');
    rasterAt(svg, o.W, o.H).then(function (im) {
      var c = document.createElement('canvas'); c.width = o.W; c.height = o.H; var x = c.getContext('2d');
      if (!x) throw new Error('This size is too large for your browser. Choose a smaller size.');
      if (!$('transA').checked || type === 'image/jpeg') { x.fillStyle = $('bgA').value; x.fillRect(0, 0, o.W, o.H); }
      x.drawImage(im, 0, 0, o.W, o.H);
      return PT.blob(c, type, 0.92).then(function (b) {
        c.width = c.height = 0;
        if (!b) throw new Error('Your browser could not save a picture this big. Choose a smaller size.');
        var ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[b.type] || 'png', name = svg.name + '-' + o.W + 'x' + o.H + '.' + ext;
        offer(b, name, 'Saved ' + name);
      });
    }).catch(function (e) { say('bad', e.message || 'Could not convert this SVG.'); }).then(function () { $('goA').disabled = !svg; });
  });
  syncA();

  // ================= PNG/JPG -> SVG (tracing runs in a worker so the page stays smooth) =================
  var src = null, srcName = 'image', traced = null, worker = null, tJob = 0, tTimer = 0, origUrl = null, svgUrl = null;
  var TRACER = new URL('../assets/vendor/imagetracer/imagetracer.min.js', location.href).href;
  function getWorker() {
    if (worker) return worker;
    var code = 'importScripts(' + JSON.stringify(TRACER) + ');onmessage=function(e){try{var s=ImageTracer.imagedataToSVG(e.data.img,e.data.opt);postMessage({id:e.data.id,svg:s});}catch(err){postMessage({id:e.data.id,err:String(err&&err.message||err)});}};';
    worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    return worker;
  }
  function syncB() {
    var m = $('modeB').value; $('colsW').hidden = m === 'bw'; $('thrW').hidden = m !== 'bw';
    [['colors', 'colorsv'], ['thr', 'thrv'], ['detail', 'detailv'], ['speck', 'speckv']].forEach(function (p) { $(p[1]).textContent = $(p[0]).value; });
  }
  function trace() {
    if (!src) return;
    clearTimeout(tTimer);
    tTimer = setTimeout(function () {
      var mine = ++tJob, m = $('modeB').value, max = +$('maxB').value, W = src.naturalWidth, H = src.naturalHeight, s = Math.min(1, max / Math.max(W, H));
      var w = Math.max(1, Math.round(W * s)), h = Math.max(1, Math.round(H * s)), c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, w, h);
      var id = x.getImageData(0, 0, w, h), d = id.data, i;
      if (m === 'bw') { var t = +$('thr').value / 100 * 255; for (i = 0; i < d.length; i += 4) { var a = d[i + 3] / 255, l = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) * a + 255 * (1 - a), v = l < t ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } }
      var det = +$('detail').value, opt = {
        ltres: 3.2 - det * 0.3, qtres: 3.2 - det * 0.3, pathomit: +$('speck').value, rightangleenhance: true, colorsampling: 2,
        numberofcolors: m === 'bw' ? 2 : m === 'photo' ? Math.max(16, +$('colors').value) : +$('colors').value, mincolorratio: 0, colorquantcycles: m === 'photo' ? 2 : 3,
        layering: 0, strokewidth: m === 'photo' ? 0 : 1, linefilter: false, scale: 1 / s, roundcoords: 1, viewbox: true, desc: false, blurradius: m === 'photo' ? 2 : 0, blurdelta: 20
      };
      $('goB').disabled = $('copyB').disabled = true;
      say('', 'Tracing the shapes… (' + w + ' × ' + h + ' px)');
      var wk = getWorker(), started = performance.now();
      wk.onmessage = function (e) {
        if (e.data.id !== mine) return;
        if (e.data.err) { say('bad', 'Tracing failed: ' + e.data.err.slice(0, 120) + '. Try fewer colours or a smaller tracing size.'); return; }
        var out = e.data.svg;
        out = out.replace(/<svg /, '<svg width="' + W + '" height="' + H + '" ');
        if ($('noWhite').checked) out = out.replace(/<path[^>]*fill="rgb\((\d+),(\d+),(\d+)\)"[^>]*\/>/g, function (p, r, g, b) { return +r > 235 && +g > 235 && +b > 235 ? '' : p; });
        if (m === 'bw') out = out.replace(/<path[^>]*fill="rgb\(255,255,255\)"[^>]*\/>/g, $('noWhite').checked ? '' : '$&');
        out = out.replace(/<path[^>]*opacity="0"[^>]*\/>/g, ''); // fully see-through areas need no shapes
        traced = out;
        if (svgUrl) URL.revokeObjectURL(svgUrl);
        svgUrl = URL.createObjectURL(new Blob([out], { type: 'image/svg+xml' })); $('svgB').src = svgUrl;
        var n = (out.match(/<path/g) || []).length, size = new Blob([out]).size;
        $('capB').textContent = 'SVG · ' + n + ' shapes · ' + fmtBytes(size);
        $('goB').disabled = $('copyB').disabled = false; $('cmpB').hidden = false;
        say(size > 3 * 1048576 ? 'bad' : 'ok', 'Traced in ' + ((performance.now() - started) / 1000).toFixed(1) + ' s.' + (size > 3 * 1048576 ? ' The SVG is very large; try fewer colours, less detail or ignoring bigger specks.' : ' Compare, adjust the sliders if needed, then download.'));
      };
      wk.onerror = function () { say('bad', 'Tracing could not start in this browser.'); };
      wk.postMessage({ id: mine, img: { width: w, height: h, data: d }, opt: opt });
    }, 250);
  }
  function restartWorker() { if (worker) { worker.terminate(); worker = null; } }
  function takeB(f) {
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name)) { say('bad', '"' + f.name + '" is not an image. Please choose a PNG or JPG.'); return; }
    if (/svg/.test(f.type)) { say('bad', 'This is already an SVG. To turn it into PNG or JPG, use the first tab.'); return; }
    loadImage(f, function (im) {
      if (!im || !im.naturalWidth) { say('bad', 'Could not read "' + f.name + '". It may be damaged or in a format your browser cannot open.'); return; }
      src = im; srcName = PT.base(f.name) || 'image'; traced = null;
      if (origUrl) URL.revokeObjectURL(origUrl); origUrl = URL.createObjectURL(f); $('origB').src = origUrl;
      restartWorker(); trace();
    });
  }
  (function () { // second drop zone
    var drop = $('dropB'), input = $('fileB');
    drop.addEventListener('click', function () { input.click(); });
    drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', function () { var f = input.files[0]; input.value = ''; if (f) takeB(f); });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) takeB(f); });
  })();
  ['modeB', 'colors', 'thr', 'detail', 'speck', 'maxB', 'noWhite'].forEach(function (id) { $(id).addEventListener('input', function () { syncB(); $('dl').hidden = true; if (src) { restartWorker(); trace(); } }); });
  $('goB').addEventListener('click', function () { if (traced) offer(new Blob([traced], { type: 'image/svg+xml' }), srcName + '.svg', 'Saved ' + srcName + '.svg'); });
  $('copyB').addEventListener('click', function () { if (traced) copyText(traced, $('copyB')); });
  syncB();
})();
</script>
