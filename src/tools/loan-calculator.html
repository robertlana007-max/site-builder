<div class="fields">
  <div><label for="amt">Loan amount</label><input type="number" id="amt" min="0" step="any" value="250000"></div>
  <div><label for="rate">Interest rate (% per year)</label><input type="number" id="rate" min="0" step="any" value="6.5"></div>
  <div><label for="yrs">Term (years)</label><input type="number" id="yrs" min="0" step="any" value="30"></div>
</div>
<div class="stats">
  <div class="stat"><span>Monthly payment</span><b id="pay">–</b></div>
  <div class="stat"><span>Total interest</span><b id="int">–</b></div>
  <div class="stat"><span>Total paid</span><b id="tot">–</b></div>
</div>
<p class="msg" id="msg"></p>
<h3>Yearly breakdown</h3>
<div class="scroll-x"><table class="sched"><thead><tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
(function () {
  function calc() {
    var P = +$('amt').value, r = +$('rate').value / 1200, n = Math.round(+$('yrs').value * 12);
    $('rows').innerHTML = '';
    if (!(P > 0) || !(n > 0) || r < 0 || n > 1200) {
      ['pay', 'int', 'tot'].forEach(function (i) { $(i).textContent = '–'; });
      $('msg').className = 'msg bad'; $('msg').textContent = 'Enter a loan amount, a rate of 0 or more, and a term up to 100 years.'; return;
    }
    $('msg').textContent = '';
    var pay = r === 0 ? P / n : P * r / (1 - Math.pow(1 + r, -n));
    $('pay').textContent = fmtNum(pay, 2);
    $('int').textContent = fmtNum(pay * n - P, 2);
    $('tot').textContent = fmtNum(pay * n, 2);
    var bal = P, yp = 0, yi = 0, html = '';
    for (var k = 1; k <= n; k++) {
      var i = bal * r, p = Math.min(pay - i, bal);
      bal -= p; yp += p; yi += i;
      if (k % 12 === 0 || k === n) {
        html += '<tr><td>' + Math.ceil(k / 12) + '</td><td>' + fmtNum(yp, 2) + '</td><td>' + fmtNum(yi, 2) + '</td><td>' + fmtNum(Math.max(0, bal), 2) + '</td></tr>';
        yp = yi = 0;
      }
    }
    $('rows').innerHTML = html;
  }
  ['amt', 'rate', 'yrs'].forEach(function (id) { $(id).addEventListener('input', calc); });
  calc();
})();
</script>
