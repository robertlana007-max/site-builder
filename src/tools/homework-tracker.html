<style>
.hwt input[type=time] { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 44px; }
.hwt textarea { min-height: 70px; }
.hwt .hwt-h { font-size: 18px; margin: 22px 0 10px; }
.hwt .hwt-h:first-child { margin-top: 0; }
.hwt .hwt-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.hwt .hwt-bar input[type=search] { flex: 1 1 200px; width: auto; }
.hwt .hwt-bar select { flex: 0 1 170px; width: auto; }
.hwt .hwt-bar .checks { margin: 0; }
.hwt .hwt-grp { margin: 18px 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.hwt .hwt-grp span { font-size: 12.5px; font-weight: 700; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; color: var(--muted); }
.hwt .hwt-grp.over { color: var(--bad); }
.hwt .hwt-list { display: grid; gap: 8px; }
.hwt .hwt-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; border: 1px solid var(--line); border-left: 5px solid var(--sc); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.hwt .hwt-item.done { opacity: .65; }
.hwt .hwt-item.done .hwt-title { text-decoration: line-through; }
.hwt .hwt-item > input[type=checkbox] { margin: 3px 0 0; width: 22px; height: 22px; }
.hwt .hwt-title { font-weight: 700; font-size: 15.5px; overflow-wrap: anywhere; }
.hwt .hwt-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 3px; }
.hwt .hwt-sub { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: var(--sc); border-radius: 99px; padding: 1px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hwt .hwt-due.late { color: var(--bad); font-weight: 700; }
.hwt .hwt-due.soon { color: #b45309; font-weight: 700; }
:root[data-theme="dark"] .hwt .hwt-due.soon { color: #fbbf24; }
.hwt .hwt-pri { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 1px 6px; border: 1px solid var(--line); }
.hwt .hwt-pri.high { color: #fff; background: #dc2626; border-color: #dc2626; }
.hwt .hwt-pri.med { color: #92400e; background: #fef3c7; border-color: #f59e0b; }
.hwt .hwt-notes { font-size: 14px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.hwt .hwt-act { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.hwt .hwt-act select { width: auto; min-height: 34px; padding: 4px 8px; font-size: 13px; }
.hwt .hwt-act .row { display: flex; gap: 4px; }
.hwt .hwt-ib { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; min-height: 34px; min-width: 34px; padding: 4px 8px; cursor: pointer; }
.hwt .hwt-ib:hover { border-color: var(--accent); color: var(--accent); }
.hwt .hwt-ib.del:hover { border-color: var(--bad); color: var(--bad); }
.hwt .hwt-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: start; }
.hwt .hwt-col { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-height: 160px; transition: border-color .15s, background .15s; }
.hwt .hwt-col.over { border-color: var(--accent); background: var(--accent-soft); }
.hwt .hwt-col h4 { margin: 2px 4px 8px; font-size: 14.5px; display: flex; justify-content: space-between; }
.hwt .hwt-col h4 span { color: var(--muted); font-weight: 600; }
.hwt .hwt-cards { display: grid; gap: 8px; min-height: 60px; }
.hwt .hwt-card { position: relative; border: 1px solid var(--line); border-left: 5px solid var(--sc); border-radius: 10px; background: var(--surface); padding: 8px 8px 8px 10px; cursor: grab; user-select: none; -webkit-user-select: none; }
.hwt .hwt-card.dragging { opacity: .35; }
.hwt .hwt-card .hwt-title { font-size: 14.5px; padding-right: 34px; }
.hwt .hwt-handle { position: absolute; top: 4px; right: 4px; width: 34px; height: 34px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: grab; touch-action: none; border-radius: 8px; }
.hwt .hwt-handle:hover { background: var(--bg); color: var(--ink); }
.hwt .hwt-mv { display: flex; gap: 4px; margin-top: 6px; }
.hwt .hwt-mv .hwt-ib { min-height: 30px; padding: 2px 8px; }
.hwt-ghost { position: fixed; z-index: 1000; pointer-events: none; box-shadow: 0 12px 30px -8px rgba(0, 0, 0, .35); transform: rotate(2deg); opacity: .95; }
.hwt .hwt-empty { padding: 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; font-size: 14.5px; }
.hwt .hwt-col .hwt-empty { padding: 10px; font-size: 13px; }
.hwt .hwt-subs { display: grid; gap: 8px; }
.hwt .hwt-subrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.hwt .hwt-subrow input[type=color] { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); cursor: pointer; }
.hwt .hwt-subrow b { font-size: 14.5px; overflow-wrap: anywhere; }
.hwt .hwt-subrow .meter { margin-top: 4px; height: 7px; }
.hwt .hwt-subrow .meter i { background: var(--sc); }
.hwt .hwt-subrow small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.hwt details.hwt-done { margin-top: 14px; }
.hwt details.hwt-done summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.hwt .hwt-remrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.hwt .hwt-remrow select { width: auto; }
@media (max-width: 640px) {
  .hwt .hwt-board { grid-template-columns: minmax(0, 1fr); }
  .hwt .hwt-col { min-height: 0; }
  .hwt .hwt-item { grid-template-columns: auto minmax(0, 1fr); }
  .hwt .hwt-act { grid-column: 1 / -1; flex-direction: row; justify-content: flex-end; flex-wrap: wrap; }
}
</style>
<div class="hwt">
<h3 class="hwt-h" id="hwtFormTitle">Add homework</h3>
<div class="fields">
  <div style="grid-column:1/-1"><label for="hwtTitle">What do you have to do?</label><input type="text" id="hwtTitle" data-nomemo maxlength="140" placeholder="e.g. Read chapter 5 and answer questions 1–8" autocomplete="off"></div>
  <div><label for="hwtSub">Subject</label><input type="text" id="hwtSub" data-nomemo maxlength="40" list="hwtSubList" placeholder="e.g. Science" autocomplete="off"><datalist id="hwtSubList"></datalist></div>
  <div><label for="hwtDue">Due date</label><input type="date" id="hwtDue" data-nomemo></div>
  <div><label for="hwtTime">Due time</label><input type="time" id="hwtTime" data-nomemo value="09:00"></div>
  <div><label for="hwtPri">Priority</label><select id="hwtPri" data-nomemo><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option></select></div>
  <div><label for="hwtStatus">Status</label><select id="hwtStatus" data-nomemo><option value="todo">To do</option><option value="doing">Doing</option><option value="done">Done</option></select></div>
</div>
<label for="hwtNotes">Notes <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
<textarea id="hwtNotes" class="plain" data-nomemo maxlength="2000" placeholder="Page numbers, what the teacher said, links..."></textarea>
<div class="btns">
  <button type="button" class="btn" id="hwtAdd">Add homework</button>
  <button type="button" class="btn ghost" id="hwtCancel" hidden>Cancel edit</button>
</div>
<p class="msg" id="hwtMsg" aria-live="polite"></p>

<h3 class="hwt-h">Your homework</h3>
<div class="hwt-bar">
  <div class="seg" role="group" aria-label="View"><button type="button" data-v="list" aria-pressed="true">List</button><button type="button" data-v="board" aria-pressed="false">Board</button></div>
  <input type="search" id="hwtQ" data-nomemo placeholder="Search homework" aria-label="Search homework" autocomplete="off">
  <select id="hwtFSub" data-nomemo aria-label="Filter by subject"><option value="">All subjects</option></select>
  <select id="hwtFPri" data-nomemo aria-label="Filter by priority"><option value="">Any priority</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select>
</div>
<div class="stats" style="margin:0 0 6px">
  <div class="stat"><span>To do</span><b id="hwtN1">0</b></div>
  <div class="stat"><span>Doing</span><b id="hwtN2">0</b></div>
  <div class="stat"><span>Done</span><b id="hwtN3">0</b></div>
  <div class="stat"><span>Overdue</span><b id="hwtN4">0</b></div>
</div>
<div id="hwtView"></div>

<h3 class="hwt-h">Progress by subject</h3>
<p class="msg" style="margin:-4px 0 10px;font-size:14px">Tap a colour square to change a subject’s colour.</p>
<div class="hwt-subs" id="hwtSubs"></div>

<h3 class="hwt-h">Reminders</h3>
<div class="hwt-remrow">
  <label class="tog"><input type="checkbox" id="hwtRem" data-nomemo><i></i><span><b>Remind me before homework is due</b><small>Works while this page is open in a tab</small></span></label>
  <div><label for="hwtLead" style="margin-bottom:2px;font-size:13px">How early</label><select id="hwtLead" data-nomemo><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="180">3 hours</option><option value="1440">1 day</option></select></div>
</div>
<p class="msg" id="hwtRemMsg" aria-live="polite"></p>

<h3 class="hwt-h">Backup</h3>
<div class="btns" style="margin-top:0">
  <button type="button" class="btn ghost" id="hwtExport">Export JSON</button>
  <button type="button" class="btn ghost" id="hwtImport">Import JSON</button>
  <input type="file" id="hwtFile" accept=".json,application/json" data-nomemo hidden>
  <button type="button" class="btn ghost danger" id="hwtClearDone">Delete finished homework</button>
  <button type="button" class="btn ghost danger" id="hwtClearAll">Delete everything</button>
</div>
<p class="msg" id="hwtIoMsg" aria-live="polite"></p>
</div>
<script>
(function () {
  var KEY = 'gtn-homework-tracker';
  var PAL = ['#2563eb', '#db2777', '#059669', '#d97706', '#7c3aed', '#0891b2', '#dc2626', '#65a30d', '#9333ea', '#0d9488', '#ea580c', '#475569'];
  var STAT = { todo: 'To do', doing: 'Doing', done: 'Done' }, ORDER = ['todo', 'doing', 'done'];
  var PRI = { high: 'High', med: 'Medium', low: 'Low' }, PRN = { high: 0, med: 1, low: 2 };
  var S = { items: [], colors: {}, view: 'list', rem: false, lead: 60 };

  function clean(it) {
    if (!it || typeof it !== 'object' || typeof it.title !== 'string' || !it.title.trim() || !/^\d{4}-\d\d-\d\d$/.test(it.due)) return null;
    return {
      id: typeof it.id === 'string' && it.id ? it.id.slice(0, 40) : uid(),
      title: it.title.trim().slice(0, 140), subject: (typeof it.subject === 'string' ? it.subject.trim() : '').slice(0, 40) || 'General',
      due: it.due, time: /^\d\d:\d\d$/.test(it.time) ? it.time : '09:00', pri: PRI[it.pri] ? it.pri : 'med',
      notes: typeof it.notes === 'string' ? it.notes.slice(0, 2000) : '', status: STAT[it.status] ? it.status : 'todo',
      created: +it.created || Date.now(), remKey: typeof it.remKey === 'string' ? it.remKey : ''
    };
  }
  try {
    var o = JSON.parse(localStorage.getItem(KEY));
    if (o && Array.isArray(o.items)) {
      S.items = o.items.map(clean).filter(Boolean);
      if (o.colors && typeof o.colors === 'object') for (var k in o.colors) if (/^#[0-9a-f]{6}$/i.test(o.colors[k])) S.colors[k] = o.colors[k];
      S.view = o.view === 'board' ? 'board' : 'list'; S.rem = !!o.rem; S.lead = [15, 60, 180, 1440].indexOf(+o.lead) !== -1 ? +o.lead : 60;
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { io('bad', 'Could not save. Your browser storage may be full or blocked.'); } }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dueAt(it) { var d = pd(it.due), t = it.time.split(':'); d.setHours(+t[0], +t[1], 0, 0); return d; }
  function color(sub) {
    if (!S.colors[sub]) { var used = Object.keys(S.colors).map(function (k) { return S.colors[k]; }); S.colors[sub] = PAL.filter(function (c) { return used.indexOf(c) === -1; })[0] || PAL[Object.keys(S.colors).length % PAL.length]; }
    return S.colors[sub];
  }
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // which list group an item belongs to
  function group(it, now) {
    if (it.status === 'done') return 'done';
    var t = ds(now), at = dueAt(it);
    if (at < now) return 'over';
    if (it.due === t) return 'today';
    var tm = new Date(now); tm.setDate(tm.getDate() + 1);
    if (it.due === ds(tm)) return 'tomorrow';
    var end = new Date(now); end.setDate(end.getDate() + (7 - end.getDay()) % 7); // this coming Sunday
    if (it.due <= ds(end)) return 'week';
    return 'later';
  }
  function dueText(it, now) {
    var at = dueAt(it), d = pd(it.due), t = ds(now), ms = at - now;
    var tm = new Date(now); tm.setDate(tm.getDate() + 1);
    var day = it.due === t ? 'Today' : it.due === ds(tm) ? 'Tomorrow' : WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : '');
    var rel = '';
    if (it.status !== 'done') {
      if (ms < 0) { var late = -ms; rel = late < 36e5 ? Math.max(1, Math.round(late / 6e4)) + ' min late' : late < 864e5 ? Math.round(late / 36e5) + ' h late' : Math.floor(late / 864e5) + (Math.floor(late / 864e5) === 1 ? ' day late' : ' days late'); }
      else if (ms < 36e5) rel = 'in ' + Math.max(1, Math.round(ms / 6e4)) + ' min';
      else if (ms < 864e5) rel = 'in ' + Math.round(ms / 36e5) + ' h';
    }
    return { text: day + ' ' + it.time + (rel ? ' · ' + rel : ''), cls: it.status === 'done' ? '' : ms < 0 ? 'late' : ms < 864e5 ? 'soon' : '' };
  }

  // ---------- form ----------
  var editing = null;
  function say(cls, t) { var m = $('hwtMsg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t; }
  function io(cls, t) { var m = $('hwtIoMsg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t; }
  function resetForm() {
    editing = null; $('hwtTitle').value = ''; $('hwtNotes').value = ''; $('hwtPri').value = 'med'; $('hwtStatus').value = 'todo';
    var tm = new Date(); tm.setDate(tm.getDate() + 1); $('hwtDue').value = ds(tm); $('hwtTime').value = '09:00';
    $('hwtAdd').textContent = 'Add homework'; $('hwtCancel').hidden = true; $('hwtFormTitle').textContent = 'Add homework';
  }
  $('hwtAdd').addEventListener('click', function () {
    var title = $('hwtTitle').value.trim(), sub = $('hwtSub').value.trim() || 'General', due = $('hwtDue').value, time = $('hwtTime').value || '09:00';
    if (!title) { say('bad', 'Type what you have to do first.'); $('hwtTitle').focus(); return; }
    if (!/^\d{4}-\d\d-\d\d$/.test(due)) { say('bad', 'Pick the due date.'); $('hwtDue').focus(); return; }
    var data = { title: title, subject: sub, due: due, time: time, pri: $('hwtPri').value, notes: $('hwtNotes').value.trim(), status: $('hwtStatus').value };
    if (editing) {
      var it = find(editing);
      if (it) { for (var k in data) it[k] = data[k]; it.remKey = ''; }
      say('ok', 'Saved.');
    } else {
      if (S.items.length >= 2000) { say('bad', 'You have 2,000 items. Delete finished homework to add more.'); return; }
      data.id = uid(); data.created = Date.now();
      var c = clean(data); S.items.push(c);
      say('ok', '“' + title + '” added.');
      if (window.burst) burst($('hwtAdd'));
    }
    color(sub);
    var keepSub = sub; resetForm(); $('hwtSub').value = keepSub;
    save(); render(); $('hwtTitle').focus();
  });
  $('hwtTitle').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('hwtAdd').click(); });
  $('hwtCancel').addEventListener('click', function () { resetForm(); say('', ''); });
  function find(id) { for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i]; return null; }
  function edit(it) {
    editing = it.id; $('hwtTitle').value = it.title; $('hwtSub').value = it.subject; $('hwtDue').value = it.due; $('hwtTime').value = it.time;
    $('hwtPri').value = it.pri; $('hwtStatus').value = it.status; $('hwtNotes').value = it.notes;
    $('hwtAdd').textContent = 'Save changes'; $('hwtCancel').hidden = false; $('hwtFormTitle').textContent = 'Edit homework';
    say('', ''); $('hwtFormTitle').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('hwtTitle').focus({ preventScroll: true });
  }
  function del(it) {
    if (!confirm('Delete “' + it.title + '”?')) return;
    S.items = S.items.filter(function (x) { return x.id !== it.id; });
    if (editing === it.id) resetForm();
    save(); render();
  }
  function setStatus(it, st) {
    if (it.status === st) return;
    it.status = st; save(); render();
    if (st === 'done') { if (window.toast) toast('Done! ' + it.title); }
  }

  // ---------- filters ----------
  var filt = { q: '', sub: '', pri: '' };
  $('hwtQ').addEventListener('input', function () { filt.q = this.value.toLowerCase().trim(); renderView(); });
  $('hwtFSub').addEventListener('change', function () { filt.sub = this.value; renderView(); });
  $('hwtFPri').addEventListener('change', function () { filt.pri = this.value; renderView(); });
  function visible() {
    var words = filt.q.split(/\s+/).filter(Boolean);
    return S.items.filter(function (it) {
      if (filt.sub && it.subject !== filt.sub) return false;
      if (filt.pri && it.pri !== filt.pri) return false;
      var hay = (it.title + ' ' + it.subject + ' ' + it.notes).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    }).sort(function (a, b) { return a.due + a.time < b.due + b.time ? -1 : a.due + a.time > b.due + b.time ? 1 : PRN[a.pri] - PRN[b.pri]; });
  }

  // ---------- rendering ----------
  document.querySelectorAll('.hwt .seg button').forEach(function (b) {
    b.addEventListener('click', function () { S.view = b.dataset.v; save(); renderView(); });
  });
  function render() { renderFilters(); renderStats(); renderView(); renderSubs(); }
  function subjects() { var s = {}; S.items.forEach(function (it) { s[it.subject] = 1; }); return Object.keys(s).sort(function (a, b) { return a.localeCompare(b); }); }
  function renderFilters() {
    var subs = subjects(), sel = $('hwtFSub'), dl = $('hwtSubList');
    if (filt.sub && subs.indexOf(filt.sub) === -1) filt.sub = '';
    sel.innerHTML = '<option value="">All subjects</option>' + subs.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('');
    sel.value = filt.sub;
    dl.innerHTML = subs.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
  }
  function renderStats() {
    var n = { todo: 0, doing: 0, done: 0 }, over = 0, now = new Date();
    S.items.forEach(function (it) { n[it.status]++; if (it.status !== 'done' && dueAt(it) < now) over++; });
    $('hwtN1').textContent = n.todo; $('hwtN2').textContent = n.doing; $('hwtN3').textContent = n.done; $('hwtN4').textContent = over;
    $('hwtN4').style.color = over ? 'var(--bad)' : '';
  }
  function meta(it, now) {
    var d = dueText(it, now);
    return '<div class="hwt-meta"><span class="hwt-sub">' + esc(it.subject) + '</span><span class="hwt-due ' + d.cls + '">' + esc(d.text) + '</span>' + (it.pri !== 'low' ? '<span class="hwt-pri ' + it.pri + '">' + PRI[it.pri] + '</span>' : '') + (it.status === 'doing' ? '<span>· Doing</span>' : '') + '</div>';
  }
  function itemRow(it, now) {
    var r = document.createElement('div'); r.className = 'hwt-item' + (it.status === 'done' ? ' done' : ''); r.style.setProperty('--sc', color(it.subject)); r.dataset.id = it.id;
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = it.status === 'done'; cb.setAttribute('data-nomemo', ''); cb.setAttribute('aria-label', 'Done: ' + it.title);
    cb.addEventListener('change', function () { if (cb.checked && window.burst) burst(cb); setStatus(it, cb.checked ? 'done' : 'todo'); });
    r.appendChild(cb);
    var mid = document.createElement('div');
    mid.innerHTML = '<div class="hwt-title">' + esc(it.title) + '</div>' + meta(it, now) + (it.notes ? '<div class="hwt-notes">' + esc(it.notes) + '</div>' : '');
    r.appendChild(mid);
    var act = document.createElement('div'); act.className = 'hwt-act';
    var sel = document.createElement('select'); sel.setAttribute('data-nomemo', ''); sel.setAttribute('aria-label', 'Status of ' + it.title);
    ORDER.forEach(function (s) { var op = document.createElement('option'); op.value = s; op.textContent = STAT[s]; sel.appendChild(op); });
    sel.value = it.status; sel.addEventListener('change', function () { setStatus(it, sel.value); });
    act.appendChild(sel);
    var row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<button type="button" class="hwt-ib ed">Edit</button><button type="button" class="hwt-ib del" aria-label="Delete ' + esc(it.title) + '">✕</button>';
    row.querySelector('.ed').addEventListener('click', function () { edit(it); });
    row.querySelector('.del').addEventListener('click', function () { del(it); });
    act.appendChild(row); r.appendChild(act);
    return r;
  }
  function renderView() {
    document.querySelectorAll('.hwt .seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === S.view); });
    var box = $('hwtView'); box.innerHTML = '';
    if (!S.items.length) { box.innerHTML = '<div class="hwt-empty">No homework yet. Add your first assignment above.</div>'; return; }
    var list = visible(), now = new Date();
    if (!list.length) { box.innerHTML = '<div class="hwt-empty">Nothing matches your search or filters.</div>'; return; }
    if (S.view === 'board') return renderBoard(box, list, now);
    var G = [['over', 'Overdue'], ['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'Later this week'], ['later', 'Later'], ['done', 'Done']], by = {};
    list.forEach(function (it) { var g = group(it, now); (by[g] = by[g] || []).push(it); });
    var open = 0;
    G.forEach(function (g) {
      var items = by[g[0]]; if (!items) return;
      var wrap = box, h;
      if (g[0] === 'done') {
        wrap = document.createElement('details'); wrap.className = 'hwt-done'; if (!open) wrap.open = true;
        wrap.innerHTML = '<summary>Done (' + items.length + ')</summary>'; box.appendChild(wrap);
      } else {
        h = document.createElement('h4'); h.className = 'hwt-grp' + (g[0] === 'over' ? ' over' : ''); h.innerHTML = esc(g[1]) + ' <span>' + items.length + '</span>'; box.appendChild(h); open += items.length;
      }
      var l = document.createElement('div'); l.className = 'hwt-list';
      items.forEach(function (it) { l.appendChild(itemRow(it, now)); });
      wrap.appendChild(l);
    });
  }
  function renderBoard(box, list, now) {
    var b = document.createElement('div'); b.className = 'hwt-board';
    ORDER.forEach(function (st, ci) {
      var col = document.createElement('div'); col.className = 'hwt-col'; col.dataset.st = st;
      var items = list.filter(function (it) { return it.status === st; });
      col.innerHTML = '<h4>' + STAT[st] + ' <span>' + items.length + '</span></h4>';
      var cards = document.createElement('div'); cards.className = 'hwt-cards';
      items.forEach(function (it) {
        var c = document.createElement('div'); c.className = 'hwt-card'; c.style.setProperty('--sc', color(it.subject)); c.dataset.id = it.id;
        c.innerHTML = '<button type="button" class="hwt-handle" aria-label="Drag ' + esc(it.title) + '" title="Drag to another column">⠿</button><div class="hwt-title">' + esc(it.title) + '</div>' + meta(it, now) +
          '<div class="hwt-mv">' + (ci > 0 ? '<button type="button" class="hwt-ib" data-to="' + ORDER[ci - 1] + '" aria-label="Move to ' + STAT[ORDER[ci - 1]] + '">← ' + STAT[ORDER[ci - 1]] + '</button>' : '') +
          (ci < 2 ? '<button type="button" class="hwt-ib" data-to="' + ORDER[ci + 1] + '" aria-label="Move to ' + STAT[ORDER[ci + 1]] + '">' + STAT[ORDER[ci + 1]] + ' →</button>' : '') +
          '<button type="button" class="hwt-ib ed">Edit</button></div>';
        c.querySelectorAll('[data-to]').forEach(function (x) { x.addEventListener('click', function () { setStatus(it, x.dataset.to); }); });
        c.querySelector('.ed').addEventListener('click', function () { edit(it); });
        drag(c, it);
        cards.appendChild(c);
      });
      if (!items.length) cards.innerHTML = '<div class="hwt-empty">Drop homework here</div>';
      col.appendChild(cards); b.appendChild(col);
    });
    box.appendChild(b);
  }
  // Drag and drop with pointer events: a mouse can drag the whole card; on touch screens use the ⠿ handle so the page still scrolls.
  function drag(card, it) {
    card.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      var handle = e.target.closest('.hwt-handle');
      if (!handle && (e.pointerType !== 'mouse' || e.target.closest('button,select,input,a'))) return;
      var sx = e.clientX, sy = e.clientY, ghost = null, over = null, r = card.getBoundingClientRect(), dx = sx - r.left, dy = sy - r.top, scrollT = null, lastY = sy;
      try { card.setPointerCapture(e.pointerId); } catch (x) {}
      if (handle) e.preventDefault();
      function colAt(x, y) { var el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.hwt-col') : null; }
      function move(ev) {
        if (!ghost) {
          if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
          ghost = card.cloneNode(true); ghost.classList.add('hwt-ghost'); ghost.style.width = r.width + 'px'; ghost.removeAttribute('data-id');
          document.querySelector('.hwt').appendChild(ghost); card.classList.add('dragging');
        }
        ev.preventDefault();
        ghost.style.left = (ev.clientX - dx) + 'px'; ghost.style.top = (ev.clientY - dy) + 'px';
        lastY = ev.clientY;
        var c = colAt(ev.clientX, ev.clientY);
        if (c !== over) { if (over) over.classList.remove('over'); over = c; if (over) over.classList.add('over'); }
        if (!scrollT) scrollT = setInterval(function () { var h = window.innerHeight; if (lastY < 70) window.scrollBy(0, -12); else if (lastY > h - 70) window.scrollBy(0, 12); }, 30);
      }
      function up(ev) {
        card.removeEventListener('pointermove', move); card.removeEventListener('pointerup', up); card.removeEventListener('pointercancel', up);
        clearInterval(scrollT);
        if (!ghost) return;
        ghost.remove(); card.classList.remove('dragging'); if (over) over.classList.remove('over');
        var c = ev.type === 'pointerup' ? colAt(ev.clientX, ev.clientY) : null;
        if (c && c.dataset.st) setStatus(it, c.dataset.st);
      }
      card.addEventListener('pointermove', move); card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
    });
  }
  function renderSubs() {
    var box = $('hwtSubs'), subs = subjects(); box.innerHTML = '';
    if (!subs.length) { box.innerHTML = '<div class="hwt-empty">Your subjects appear here with how much of their homework is done.</div>'; return; }
    subs.forEach(function (s, i) {
      var tot = 0, done = 0; S.items.forEach(function (it) { if (it.subject === s) { tot++; if (it.status === 'done') done++; } });
      var pct = Math.round(done / tot * 100), row = document.createElement('div'); row.className = 'hwt-subrow'; row.style.setProperty('--sc', color(s));
      var id = 'hwtC' + i;
      row.innerHTML = '<input type="color" id="' + id + '" data-nomemo value="' + color(s) + '" aria-label="Colour for ' + esc(s) + '"><div><b>' + esc(s) + '</b><div class="meter"><i style="width:' + pct + '%"></i></div></div><small>' + done + ' of ' + tot + ' done · ' + pct + '%</small>';
      row.querySelector('input').addEventListener('change', function () { S.colors[s] = this.value; save(); render(); });
      box.appendChild(row);
    });
  }

  // ---------- reminders (Notification API, only while the page is open) ----------
  function remSay(cls, t) { var m = $('hwtRemMsg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t; }
  var canNotify = 'Notification' in window;
  $('hwtRem').checked = S.rem; $('hwtLead').value = String(S.lead);
  function remState() {
    if (!S.rem) { remSay('', 'Reminders are off.'); return; }
    if (!canNotify) { remSay('', 'Your browser cannot show system notifications here, so reminders appear as a message on this page.'); return; }
    if (Notification.permission === 'granted') remSay('ok', 'Reminders are on. Keep this page open in a tab to get them.');
    else if (Notification.permission === 'denied') remSay('bad', 'Notifications are blocked for this site. Allow them in your browser’s site settings (the icon left of the address), or reminders will only show on this page.');
    else remSay('', 'Reminders are on, but notifications are not allowed yet, so they show on this page only.');
  }
  $('hwtRem').addEventListener('change', function () {
    S.rem = this.checked; save();
    if (S.rem && canNotify && Notification.permission === 'default') {
      try {
        var p = Notification.requestPermission(function () { remState(); });
        if (p && p.then) p.then(remState, remState);
      } catch (e) { remState(); }
    }
    remState(); if (S.rem) checkRem();
  });
  $('hwtLead').addEventListener('change', function () { S.lead = +this.value; S.items.forEach(function (it) { it.remKey = ''; }); save(); checkRem(); });
  function notify(title, body) {
    if (window.toast) toast(title + ': ' + body);
    if (!canNotify || Notification.permission !== 'granted') return;
    try { var n = new Notification(title, { body: body, tag: 'hwt-' + body.slice(0, 40) }); n.onclick = function () { window.focus(); n.close(); }; }
    catch (e) { // Android Chrome only allows notifications through a service worker
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.showNotification(title, { body: body }); }).catch(function () {});
    }
  }
  function checkRem() {
    if (!S.rem) return;
    var now = Date.now(), changed = false;
    S.items.forEach(function (it) {
      if (it.status === 'done') return;
      var at = dueAt(it).getTime(), key = it.due + ' ' + it.time + ' ' + S.lead;
      if (it.remKey === key || now >= at || now < at - S.lead * 6e4) return;
      it.remKey = key; changed = true;
      var mins = Math.round((at - now) / 6e4);
      notify('Homework due ' + (mins < 60 ? 'in ' + Math.max(1, mins) + ' min' : mins < 1440 ? 'in ' + Math.round(mins / 60) + ' h' : 'tomorrow'), it.subject + ': ' + it.title);
    });
    if (changed) save();
  }
  remState();
  setInterval(function () { checkRem(); renderStats(); }, 30000);
  setInterval(function () { if (!document.querySelector('.hwt-ghost')) renderView(); }, 300000);
  checkRem();

  // ---------- backup ----------
  $('hwtExport').addEventListener('click', function () {
    if (!S.items.length) { io('bad', 'There is no homework to export yet.'); return; }
    var data = { app: 'GetToolNest Homework Tracker', version: 1, exported: new Date().toISOString(), colors: S.colors, items: S.items.map(function (it) { return { id: it.id, title: it.title, subject: it.subject, due: it.due, time: it.time, pri: it.pri, notes: it.notes, status: it.status, created: it.created }; }) };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'homework-' + ds(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    io('ok', 'Exported ' + S.items.length + ' items. Keep the file to restore them later or on another device.');
  });
  $('hwtImport').addEventListener('click', function () { $('hwtFile').value = ''; $('hwtFile').click(); });
  $('hwtFile').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return; // reset, so the same file can be picked again
    if (f.size > 5 * 1048576) { io('bad', 'That file is too big (' + fmtBytes(f.size) + '). A homework backup is usually a few KB.'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      var data;
      try { data = JSON.parse(rd.result); } catch (e) { io('bad', 'This file is not valid JSON. Choose a file made with Export JSON.'); return; }
      var arr = Array.isArray(data) ? data : data && Array.isArray(data.items) ? data.items : null;
      if (!arr) { io('bad', 'No homework found in this file. Choose a file made with Export JSON.'); return; }
      var added = 0, updated = 0, bad = 0;
      arr.slice(0, 2000).forEach(function (x) {
        var c = clean(x); if (!c) { bad++; return; }
        var old = find(c.id);
        if (old) { for (var k in c) old[k] = c[k]; updated++; } else { S.items.push(c); added++; }
      });
      if (data && data.colors && typeof data.colors === 'object') for (var k in data.colors) if (/^#[0-9a-f]{6}$/i.test(data.colors[k])) S.colors[k] = data.colors[k];
      if (!added && !updated) { io('bad', 'No valid homework found in this file.'); return; }
      save(); render();
      io('ok', 'Imported: ' + added + ' new, ' + updated + ' updated' + (bad ? ', ' + bad + ' skipped because they were incomplete' : '') + '.');
    };
    rd.onerror = function () { io('bad', 'Could not read that file.'); };
    rd.readAsText(f);
  });
  $('hwtClearDone').addEventListener('click', function () {
    var n = S.items.filter(function (it) { return it.status === 'done'; }).length;
    if (!n) { io('', 'There is no finished homework to delete.'); return; }
    if (!confirm('Delete ' + n + ' finished item' + (n === 1 ? '' : 's') + '?')) return;
    S.items = S.items.filter(function (it) { return it.status !== 'done'; }); save(); render(); io('ok', 'Deleted ' + n + ' finished item' + (n === 1 ? '' : 's') + '.');
  });
  $('hwtClearAll').addEventListener('click', function () {
    if (!S.items.length) return;
    if (!confirm('Delete all ' + S.items.length + ' items? Export a backup first if you might need them.')) return;
    S.items = []; S.colors = {}; resetForm(); save(); render(); io('ok', 'Everything was deleted.');
  });

  resetForm();
  render();
})();
</script>
