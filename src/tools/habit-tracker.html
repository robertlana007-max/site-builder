<style>
.hbt .hbt-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 12px; }
.hbt .hbt-top > div { flex: 1 1 160px; }
.hbt .hbt-nav { display: flex; gap: 6px; }
.hbt .hbt-nav .btn { min-height: 44px; padding: 4px 14px; }
.hbt .hbt-add { display: flex; gap: 8px; margin-bottom: 14px; }
.hbt .hbt-add input { flex: 1; min-width: 0; }
.hbt .hbt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); -webkit-overflow-scrolling: touch; }
.hbt table { border-collapse: collapse; font-size: 13px; }
.hbt th, .hbt td { border-bottom: 1px solid var(--line); padding: 0; text-align: center; }
.hbt thead th { font-weight: 600; color: var(--muted); padding: 4px 0; min-width: 30px; position: sticky; top: 0; background: var(--surface); }
.hbt thead th.today { color: var(--accent); }
.hbt thead th small { display: block; font-weight: 400; font-size: 11px; }
.hbt .hbt-name { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; padding: 4px 6px 4px 10px; min-width: 130px; max-width: 170px; border-right: 1px solid var(--line); }
.hbt .hbt-name div { display: flex; align-items: center; gap: 4px; }
.hbt .hbt-name span { flex: 1; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.hbt .hbt-name button { all: unset; cursor: pointer; color: var(--muted); padding: 4px; font-size: 14px; }
.hbt .hbt-name small { display: block; color: var(--muted); font-size: 11px; }
.hbt td button.d { all: unset; box-sizing: border-box; width: 26px; height: 26px; margin: 4px 2px; border: 1.5px solid var(--line); border-radius: 7px; cursor: pointer; display: grid; place-items: center; font-size: 15px; color: #fff; }
.hbt td button.d[aria-pressed="true"] { background: var(--hb, #16a34a); border-color: var(--hb, #16a34a); }
.hbt td button.d.today { border-color: var(--accent); border-width: 2px; }
.hbt td button.d:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hbt td.st { padding: 0 8px; white-space: nowrap; font-size: 13px; }
.hbt .hbt-empty { padding: 18px; color: var(--muted); text-align: center; }
.hbt .hbt-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
</style>
<div class="hbt" id="hbt">
<div class="hbt-top">
  <div><label for="hbMonth">Month</label><input type="month" id="hbMonth" data-nomemo></div>
  <div class="hbt-nav"><button type="button" class="btn ghost" id="hbPrev" aria-label="Previous month">‹</button><button type="button" class="btn ghost" id="hbToday">This month</button><button type="button" class="btn ghost" id="hbNext" aria-label="Next month">›</button></div>
</div>
<label for="hbNew">Add a habit</label>
<div class="hbt-add"><input type="text" id="hbNew" data-nomemo maxlength="40" placeholder="e.g. Drink 8 glasses of water"><button type="button" class="btn" id="hbAdd">Add</button></div>
<div class="hbt-wrap" id="hbWrap"></div>
<div class="stats">
  <div class="stat"><span>Done this month</span><b id="hbDone">0</b></div>
  <div class="stat"><span>Completion</span><b id="hbPct">0%</b></div>
  <div class="stat"><span>Best current streak</span><b id="hbStreak">0 days</b></div>
</div>
<fieldset style="border:1px solid var(--line);border-radius:12px;padding:12px 14px 2px;margin:16px 0 0;min-width:0"><legend style="font-weight:700;font-size:15px;padding:0 6px">Printable tracker</legend>
  <div class="fields">
    <div><label for="hbPaper">Paper</label><select id="hbPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
    <div><label for="hbBlank">Extra empty rows</label><select id="hbBlank"><option value="0">None</option><option value="3" selected>3</option><option value="6">6</option><option value="12">12</option></select></div>
  </div>
  <label class="hbt-check"><input type="checkbox" id="hbTicks">Include the days already ticked</label>
</fieldset>
<div class="btns">
  <button type="button" class="btn" id="hbPdf">Download PDF for this month</button>
  <button type="button" class="btn ghost" id="hbExport">Back up my data</button>
  <button type="button" class="btn ghost" id="hbImport">Restore a backup</button>
  <input type="file" id="hbFile" accept=".json,application/json" hidden>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

  function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); return true; } catch (e) { say('bad', 'Your browser did not let us save. Ticks will be lost when you close this page.'); return false; } }
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  var today = iso(new Date());
  function ym() { var v = $('hbMonth').value; if (!/^\d{4}-\d{2}$/.test(v)) { v = today.slice(0, 7); $('hbMonth').value = v; } return v.split('-').map(Number); }
  function days(y, m) { return new Date(y, m, 0).getDate(); }
  function has(id, k) { return (D.marks[id] || []).indexOf(k) >= 0; }
  function setMark(id, k, on) { var a = D.marks[id] = D.marks[id] || [], i = a.indexOf(k); if (on && i < 0) a.push(k); if (!on && i >= 0) a.splice(i, 1); }
  // days in a row up to today (or yesterday, so an unticked today does not break it)
  function streak(id) {
    var set = {}; (D.marks[id] || []).forEach(function (k) { set[k] = 1; });
    var d = new Date(); if (!set[iso(d)]) d.setDate(d.getDate() - 1);
    var n = 0; while (set[iso(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function bestIn(id, y, m) { var best = 0, run = 0; for (var d = 1; d <= days(y, m); d++) { if (has(id, y + '-' + pad(m) + '-' + pad(d))) { run++; best = Math.max(best, run); } else run = 0; } return best; }
  var wfmt = (function () { try { return new Intl.DateTimeFormat(undefined, { weekday: 'narrow' }); } catch (e) { return new Intl.DateTimeFormat('en', { weekday: 'narrow' }); } })();
  function render() {
    var p = ym(), y = p[0], m = p[1], n = days(y, m), wrap = $('hbWrap');
    if (!D.habits.length) { wrap.innerHTML = '<div class="hbt-empty">Add your first habit above. Then tick a box each day you do it.</div>'; stats(y, m); return; }
    var t = document.createElement('table'), th = '<thead><tr><th class="hbt-name" scope="col">Habit</th>';
    for (var d = 1; d <= n; d++) { var k = y + '-' + pad(m) + '-' + pad(d); th += '<th scope="col"' + (k === today ? ' class="today"' : '') + '>' + d + '<small>' + UT.esc(wfmt.format(new Date(y, m - 1, d))) + '</small></th>'; }
    th += '<th scope="col">Done</th><th scope="col">Streak</th></tr></thead>';
    var tb = '<tbody>';
    D.habits.forEach(function (h, hi) {
      var c = COLORS[hi % COLORS.length], done = 0;
      tb += '<tr style="--hb:' + c + '"><th class="hbt-name" scope="row"><div><span data-ren="' + h.id + '" title="Tap to rename">' + UT.esc(h.name) + '</span><button type="button" data-up="' + h.id + '" aria-label="Move ' + UT.esc(h.name) + ' up">↑</button><button type="button" data-del="' + h.id + '" aria-label="Delete ' + UT.esc(h.name) + '">✕</button></div></th>';
      for (var d2 = 1; d2 <= n; d2++) { var k2 = y + '-' + pad(m) + '-' + pad(d2), on = has(h.id, k2); if (on) done++; tb += '<td><button type="button" class="d' + (k2 === today ? ' today' : '') + '" data-h="' + h.id + '" data-k="' + k2 + '" aria-pressed="' + on + '" aria-label="' + UT.esc(h.name) + ', day ' + d2 + '">' + (on ? '✓' : '') + '</button></td>'; }
      var s = streak(h.id);
      tb += '<td class="st"><b>' + done + '</b>/' + n + '</td><td class="st">' + (s ? '🔥 ' + s : '0') + '<small style="display:block;color:var(--muted)">best ' + bestIn(h.id, y, m) + '</small></td></tr>';
    });
    t.innerHTML = th + tb + '</tbody>'; wrap.innerHTML = ''; wrap.appendChild(t);
    // show today's column when the month is opened on a phone
    var cur = wrap.querySelector('thead th.today'); if (cur && wrap.scrollWidth > wrap.clientWidth) wrap.scrollLeft = Math.max(0, cur.offsetLeft - wrap.clientWidth / 2);
    stats(y, m);
  }
  function stats(y, m) {
    var n = days(y, m), done = 0, best = 0;
    D.habits.forEach(function (h) { for (var d = 1; d <= n; d++) if (has(h.id, y + '-' + pad(m) + '-' + pad(d))) done++; best = Math.max(best, streak(h.id)); });
    $('hbDone').textContent = fmtNum(done); $('hbPct').textContent = D.habits.length ? Math.round(done / (n * D.habits.length) * 100) + '%' : '0%';
    $('hbStreak').textContent = best + (best === 1 ? ' day' : ' days');
  }
  $('hbWrap').addEventListener('click', function (e) {
    var b = e.target.closest('button, span[data-ren]'); if (!b) return;
    if (b.dataset.k) { var on = b.getAttribute('aria-pressed') !== 'true'; setMark(b.dataset.h, b.dataset.k, on); save(); var sl = $('hbWrap').scrollLeft; render(); $('hbWrap').scrollLeft = sl; var nb = $('hbWrap').querySelector('button[data-h="' + b.dataset.h + '"][data-k="' + b.dataset.k + '"]'); if (nb) nb.focus(); if (on && b.dataset.k === today && streak(b.dataset.h) > 0 && streak(b.dataset.h) % 7 === 0 && window.burst) burst(nb); return; }
    var id = b.dataset.del || b.dataset.ren || b.dataset.up, h = D.habits.filter(function (x) { return String(x.id) === id; })[0]; if (!h) return;
    if (b.dataset.del) { if (!confirm('Delete "' + h.name + '" and all its ticks?')) return; D.habits = D.habits.filter(function (x) { return x !== h; }); delete D.marks[h.id]; save(); render(); say('', '"' + h.name + '" was deleted.'); }
    else if (b.dataset.up) { var i = D.habits.indexOf(h); if (i > 0) { D.habits.splice(i, 1); D.habits.splice(i - 1, 0, h); save(); render(); } }
    else { var nn = prompt('Rename this habit', h.name); if (nn != null && nn.trim()) { h.name = nn.trim().slice(0, 40); save(); render(); } }
  });
  function add() {
    var v = $('hbNew').value.trim().replace(/\s+/g, ' ');
    if (!v) return say('bad', 'Type a habit first, for example "Read 20 pages".');
    if (D.habits.length >= 20) return say('bad', 'You can track up to 20 habits. Delete one to add another.');
    if (D.habits.some(function (h) { return h.name.toLocaleLowerCase() === v.toLocaleLowerCase(); })) return say('bad', 'You already track "' + v + '".');
    D.habits.push({ id: 'h' + (D.next = (D.next || 1) + 1), name: v.slice(0, 40) }); save(); $('hbNew').value = ''; render(); say('ok', 'Added "' + v + '". Tick a box on each day you do it.');
  }
  $('hbAdd').addEventListener('click', add);
  $('hbNew').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  function shift(n) { var p = ym(), d = new Date(p[0], p[1] - 1 + n, 1); $('hbMonth').value = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); }
  $('hbPrev').addEventListener('click', function () { shift(-1); });
  $('hbNext').addEventListener('click', function () { shift(1); });
  $('hbToday').addEventListener('click', function () { $('hbMonth').value = today.slice(0, 7); render(); });
  $('hbMonth').addEventListener('change', render);
  $('hbPaper').value = UT.letter() ? 'letter' : 'a4';
  $('hbExport').addEventListener('click', function () { var b = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' }); GD.download(b, 'habit-tracker-backup.json'); say('ok', 'Backup saved. Your ticks are kept in this browser; the file is a copy for safe keeping.'); });
  $('hbImport').addEventListener('click', function () { $('hbFile').value = ''; $('hbFile').click(); });
  $('hbFile').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    if (f.size > 5e6) return say('bad', 'That file is too big to be a habit tracker backup.');
    f.text().then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (e) {}
      var ok = d && Array.isArray(d.habits) && d.marks && typeof d.marks === 'object' && d.habits.every(function (h) { return h && typeof h.name === 'string' && h.id != null; });
      if (!ok) return say('bad', '"' + f.name + '" is not a habit tracker backup. Choose the file saved with "Back up my data".');
      if (D.habits.length && !confirm('Replace your ' + D.habits.length + ' habit' + (D.habits.length > 1 ? 's' : '') + ' and ticks in this browser with the backup?')) return;
      d.habits = d.habits.slice(0, 20).map(function (h) { return { id: String(h.id), name: String(h.name).slice(0, 40) }; });
      Object.keys(d.marks).forEach(function (k) { if (!Array.isArray(d.marks[k])) delete d.marks[k]; else d.marks[k] = d.marks[k].filter(function (x) { return /^\d{4}-\d{2}-\d{2}$/.test(x); }); });
      d.next = Math.max(+d.next || 1, d.habits.length + 1);
      D = { habits: d.habits, marks: d.marks, next: d.next }; save(); render();
      say('ok', 'Backup restored: ' + D.habits.length + ' habit' + (D.habits.length === 1 ? '' : 's') + '.');
    }, function () { say('bad', 'That file could not be read.'); });
  });
  // weekend days of the visitor's region (for the shaded columns of the printout)
  var WE = (function () {
    try { var lo = new Intl.Locale(UT.langs()[0]); if (!lo.region && UT.region()) lo = new Intl.Locale(lo.language + '-' + UT.region()); var wi = lo.getWeekInfo ? lo.getWeekInfo() : lo.weekInfo; if (wi && wi.weekend && wi.weekend.length) return wi.weekend.map(function (d) { return d % 7; }); } catch (e) {}
    return [0, 6];
  })();
  // ---------- printable month ----------
  $('hbPdf').addEventListener('click', async function () {
    if (busy) return; busy = true; var btn = this; btn.disabled = true; say('', 'Making the PDF…');
    try {
      await GD.loadAll(['sans', 'sansb']);
      var p = ym(), y = p[0], m = p[1], n = days(y, m), P = $('hbPaper').value === 'letter' ? [792, 612] : [841.89, 595.28], W = P[0], H = P[1], M = 26, ops = [{ k: 'rect', x: 0, y: 0, w: W, h: H, fill: '#ffffff' }];
      var title = (function () { try { var s = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' }).format(new Date(y, m - 1, 15)); return s.charAt(0).toLocaleUpperCase() + s.slice(1); } catch (e) { return y + '-' + pad(m); } })();
      ops.push({ k: 'text', t: 'Habit tracker', x: M, y: M + 16, font: 'sansb', s: 18, fill: '#111827' }, { k: 'text', t: title, x: W - M, y: M + 16, font: 'sansb', s: 18, fill: '#16a34a', align: 'right' });
      var rows = D.habits.map(function (h) { return h; }).concat(Array.from({ length: +$('hbBlank').value }, function () { return null; }));
      if (!rows.length) rows = Array.from({ length: 10 }, function () { return null; });
      var top = M + 34, nameW = 150, endW = 44, cw = (W - 2 * M - nameW - endW) / n, rh = Math.min(36, (H - top - M - 22) / rows.length), ticks = $('hbTicks').checked;
      for (var d = 1; d <= n; d++) {
        var x = M + nameW + (d - 1) * cw, we = WE.indexOf(new Date(y, m - 1, d).getDay()) >= 0;
        if (we) ops.push({ k: 'rect', x: x, y: top, w: cw, h: 22 + rows.length * rh, fill: '#f3f4f6' });
        ops.push({ k: 'text', t: String(d), x: x + cw / 2, y: top + 9, font: 'sansb', s: Math.min(8, cw * 0.5), fill: '#374151', align: 'center' });
        ops.push({ k: 'text', t: wfmt.format(new Date(y, m - 1, d)), x: x + cw / 2, y: top + 18, font: 'sans', s: Math.min(6.5, cw * 0.42), fill: '#6b7280', align: 'center' });
      }
      ops.push({ k: 'text', t: 'Done', x: W - M - endW / 2, y: top + 14, font: 'sansb', s: 8, fill: '#374151', align: 'center' });
      rows.forEach(function (h, i) {
        var ry = top + 22 + i * rh, c = COLORS[i % COLORS.length], cnt = 0;
        ops.push({ k: 'line', x1: M, y1: ry, x2: W - M, y2: ry, stroke: '#d1d5db', lw: 0.6 });
        if (h) ops.push({ k: 'text', t: h.name, x: M + 4, y: ry + rh / 2 + 3.5, font: 'sans', s: GD.fit(h.name, 'sans', 10, nameW - 10, 5), fill: '#111827' });
        for (var d = 1; d <= n; d++) {
          var bx = M + nameW + (d - 1) * cw, s = Math.min(cw, rh) * 0.66, k = y + '-' + pad(m) + '-' + pad(d), on = ticks && h && has(h.id, k);
          if (on) cnt++;
          ops.push({ k: 'rect', x: bx + (cw - s) / 2, y: ry + (rh - s) / 2, w: s, h: s, r: s * 0.2, stroke: '#9ca3af', lw: 0.6, fill: on ? c : '#ffffff' });
        }
        if (ticks && h) ops.push({ k: 'text', t: String(cnt), x: W - M - endW / 2, y: ry + rh / 2 + 3.5, font: 'sansb', s: 9, fill: c, align: 'center' });
      });
      ops.push({ k: 'line', x1: M, y1: top + 22 + rows.length * rh, x2: W - M, y2: top + 22 + rows.length * rh, stroke: '#d1d5db', lw: 0.6 });
      ops.push({ k: 'text', t: 'Tick a box each day you keep the habit. Try not to break the chain.', x: M, y: H - M + 8, font: 'sans', s: 8, fill: '#6b7280' });
      var env = await GD.newPdf('Habit tracker ' + title, 'GetToolNest Habit Tracker', function (t) { say('', t); });
      await GD.drawPdf(env, env.doc.addPage([W, H]), ops);
      var bytes = await env.doc.save();
      GD.download(new Blob([bytes], { type: 'application/pdf' }), 'habit-tracker-' + y + '-' + pad(m) + '.pdf');
      say('ok', 'PDF saved for ' + title + '.');
    } catch (e) { say('bad', 'The PDF could not be made. ' + (e && e.message ? e.message : '')); }
    busy = false; btn.disabled = false;
  });
  $('hbMonth').value = today.slice(0, 7);
  render();
  window.addEventListener('storage', function (e) { if (e.key === KEY) { D = load(); render(); } });
})();
</script>
