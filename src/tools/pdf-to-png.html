<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a PDF here</b>Every page becomes a PNG picture, on your device. Nothing is uploaded.</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div class="fields">
  <div><label for="scale">Resolution</label><select id="scale"><option value="1">Standard (72 dpi)</option><option value="2" selected>High (144 dpi)</option><option value="3">Very high (216 dpi)</option><option value="4.1667">Print quality (300 dpi)</option></select></div>
  <div><label for="pages">Pages</label><input type="text" id="pages" placeholder="All pages, or for example 1-3, 5" data-nomemo></div>
</div>
<div class="checks"><label><input type="checkbox" id="clear"> Transparent background (no white paper behind the page)</label></div>
<div class="btns"><button class="btn" id="go" disabled>Convert to PNG</button><a class="btn ghost" id="dl" hidden>Download all (ZIP)</a></div>
<p class="msg" id="msg"></p>
<div class="thumbs" id="thumbs"></div>
<script src="../assets/vendor/pdf.min.js"></script>
<script src="../assets/pdf-tools.js"></script>
<script>
(function () {
  var file = null, pdf = null, MAX = 300, MAXPX = 16000000, urls = [], busy = false;
  function clearThumbs() { urls.forEach(function (u) { URL.revokeObjectURL(u); }); urls = []; $('thumbs').innerHTML = ''; }
  PT.drop(false, function (f) {
    if (busy) return PT.say('bad', 'Please wait until the current file is finished.');
    clearThumbs(); $('dl').hidden = true; pdf = null; file = null; $('go').disabled = true;
    if (!f.size) return PT.say('bad', '"' + f.name + '" is empty.');
    if (!PT.isPdf(f)) return PT.say('bad', '"' + f.name + '" is not a PDF. Please choose a PDF file.');
    PT.say('', 'Opening ' + f.name + '…');
    PT.render(f).then(function (d) {
      file = f; pdf = d; $('go').disabled = false;
      PT.say('', f.name + ' · ' + fmtBytes(f.size) + ' · ' + d.numPages + (d.numPages === 1 ? ' page' : ' pages'));
    }).catch(function (e) { PT.say('bad', e.message); });
  });
  $('pages').addEventListener('input', function () { $('dl').hidden = true; });
  $('clear').addEventListener('change', function () { $('dl').hidden = true; });

  $('go').addEventListener('click', function () {
    if (!pdf || busy) return;
    busy = true;
    PT.run(async function () {
      var n = pdf.numPages, base = PT.base(file.name), want = +$('scale').value, transparent = $('clear').checked;
      var list = $('pages').value.trim() ? PT.ranges($('pages').value, n) : null;
      if (!list) { list = []; for (var k = 0; k < n; k++) list.push(k); }
      if (list.length > MAX) throw new Error('That is ' + list.length + ' pages. The limit is ' + MAX + ' at a time. Type a smaller range in Pages, for example 1-' + MAX + '.');
      clearThumbs();
      var out = [], lowered = 0;
      for (var j = 0; j < list.length; j++) {
        var i = list[j] + 1;
        PT.say('', 'Converting page ' + i + ' (' + (j + 1) + ' of ' + list.length + ')…');
        var page = await pdf.getPage(i), vp1 = page.getViewport({ scale: 1 }), s = want;
        // Keep very large pages inside what phones and browsers can draw.
        if (vp1.width * vp1.height * s * s > MAXPX) { s = Math.sqrt(MAXPX / (vp1.width * vp1.height)); lowered++; }
        var vp = page.getViewport({ scale: s }), c = document.createElement('canvas');
        c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
        var ctx = c.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: vp, background: transparent ? 'rgba(0,0,0,0)' : '#ffffff' }).promise;
        page.cleanup();
        var blob = await PT.blob(c, 'image/png');
        c.width = c.height = 0;
        if (!blob) throw new Error('Page ' + i + ' is too large for this resolution. Choose a lower one.');
        var name = base + '-page-' + i + '.png', url = URL.createObjectURL(blob); urls.push(url);
        out.push({ name: name, data: new Uint8Array(await blob.arrayBuffer()) });
        var a = document.createElement('a'), img = document.createElement('img'), cap = document.createElement('span');
        a.href = url; a.download = name; img.src = url; img.alt = 'Page ' + i; img.loading = 'lazy';
        if (transparent) img.style.background = 'repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 16px 16px';
        cap.textContent = 'Page ' + i + ' · ' + Math.round(vp.width) + '×' + Math.round(vp.height) + ' · ' + fmtBytes(blob.size);
        a.appendChild(img); a.appendChild(cap); $('thumbs').appendChild(a);
      }
      var note = out.length + (out.length === 1 ? ' PNG' : ' PNGs') + ' ready. Tap one to save it, or download them all';
      PT.done(PT.zip(out), base + '-png.zip', 'application/zip', note);
      if (lowered) PT.say('ok', $('msg').textContent + '. ' + lowered + (lowered === 1 ? ' very large page was' : ' very large pages were') + ' made a little smaller so your browser can draw it.');
    }).then(function () { busy = false; });
  });
})();
</script>
