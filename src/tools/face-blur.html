<style>
.fb-list { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 0 12px; }
.fb-list:empty { display: none; }
.fb-list button { flex: none; position: relative; width: 74px; height: 74px; padding: 0; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); cursor: pointer; }
.fb-list button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fb-list img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fb-list small { position: absolute; left: 3px; bottom: 3px; background: rgba(0,0,0,.65); color: #fff; font: 600 11px/1 system-ui, sans-serif; padding: 3px 5px; border-radius: 5px; }
.fb-stage { position: relative; text-align: center; line-height: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: hidden; }
.fb-stage canvas { max-width: 100%; height: auto; touch-action: manipulation; cursor: pointer; }
.fb-stage.draw canvas { touch-action: none; cursor: crosshair; }
.fb-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.fb-tools .btn { min-height: 40px; padding: 6px 14px; }
.fb-help { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop photos here</b>One or many JPG, PNG or WebP photos. Faces are found on your device; nothing is uploaded.</div>
<input type="file" id="file" accept="image/*" multiple hidden data-nomemo>
<div class="fields">
  <div><label for="fx">Cover faces with</label><select id="fx"><option value="blur">Blur</option><option value="pixel">Pixels (mosaic)</option><option value="emoji">Emoji</option><option value="solid">Solid colour</option></select></div>
  <div id="strW"><label for="str">Strength: <span id="strv">60</span></label><input type="range" id="str" min="10" max="100" value="60"></div>
  <div id="emoW" hidden><label for="emo">Emoji</label><select id="emo"><option>😀</option><option>🙂</option><option>😎</option><option>🤖</option><option>🐱</option><option>🐶</option><option>⭐</option><option>❤️</option><option>🙈</option></select></div>
  <div id="colW" hidden><label for="col">Colour</label><input type="color" id="col" value="#111111"></div>
  <div><label for="shape">Shape</label><select id="shape"><option value="oval">Oval</option><option value="rect">Rectangle</option></select></div>
  <div><label for="pad">Cover size: <span id="padv">+25%</span></label><input type="range" id="pad" min="0" max="80" step="5" value="25"></div>
</div>
<div class="notice" id="notice" hidden><div class="meter" id="bar"><i id="fill"></i></div><p id="stat"></p></div>
<ul class="fb-list" id="list" aria-label="Your photos"></ul>
<div id="work" hidden>
  <div class="fb-tools">
    <div class="seg" id="mode" role="group" aria-label="What a tap does"><button type="button" data-v="toggle" aria-pressed="true">Tap a face to switch it on or off</button><button type="button" data-v="draw" aria-pressed="false">Draw a new box</button></div>
    <label style="margin:0;font-weight:400"><input type="checkbox" id="outl" checked> Show outlines</label>
  </div>
  <div class="fb-stage" id="stage"><canvas id="cv" width="10" height="10" aria-label="Photo with covered faces"></canvas></div>
  <p class="fb-help" id="help"></p>
  <div class="fb-tools">
    <button class="btn ghost" id="allOn" type="button">Cover all</button>
    <button class="btn ghost" id="allOff" type="button">Uncover all</button>
    <button class="btn ghost" id="undo" type="button">Remove my last box</button>
    <button class="btn ghost" id="redo" type="button">Find faces again</button>
  </div>
  <div class="btns">
    <button class="btn" id="dl" type="button">Download this photo</button>
    <button class="btn ghost" id="dlAll" type="button" hidden>Download all (ZIP)</button>
    <button class="btn ghost" id="remove" type="button">Remove this photo</button>
  </div>
</div>

  $('allOn').addEventListener('click', function () { var ph = photos[cur]; if (ph && ph.faces) { ph.faces.forEach(function (f) { f.on = true; }); show(); } });
  $('allOff').addEventListener('click', function () { var ph = photos[cur]; if (ph && ph.faces) { ph.faces.forEach(function (f) { f.on = false; }); show(); } });
  $('undo').addEventListener('click', function () { var ph = photos[cur]; if (!ph || !ph.faces) return; for (var i = ph.faces.length - 1; i >= 0; i--) if (ph.faces[i].manual) { ph.faces.splice(i, 1); break; } ph.manualKeep = ph.faces.filter(function (q) { return q.manual; }); show(); });
  $('redo').addEventListener('click', function () { var ph = photos[cur]; if (!ph || working || !ph.faces) return; working = true; find(ph).then(function () { working = false; pump(); }); });
  $('remove').addEventListener('click', function () {
    if (cur < 0) return; photos.splice(cur, 1); $('list').removeChild($('list').children[cur]);
    cur = Math.min(cur, photos.length - 1); show(); if (!photos.length) say('', '');
  });
  function syncLabels() {
    var fx = $('fx').value; $('strW').hidden = fx === 'emoji' || fx === 'solid'; $('emoW').hidden = fx !== 'emoji'; $('colW').hidden = fx !== 'solid';
    $('strv').textContent = $('str').value; $('padv').textContent = '+' + $('pad').value + '%';
  }
  ['fx', 'str', 'emo', 'col', 'shape', 'pad', 'outl'].forEach(function (id) { $(id).addEventListener('input', function () { syncLabels(); show(); }); $(id).addEventListener('change', function () { syncLabels(); show(); }); });
  syncLabels();

  // ---------- saving ----------
  function render(ph) {
    var c = canvas(ph.w, ph.h), x = c.getContext('2d'); paint(x, ph.img, ph.w, ph.h, ph.faces || [], 1);
    var png = /png|gif|bmp/.test(ph.type), type = png ? 'image/png' : /webp/.test(ph.type) ? 'image/webp' : 'image/jpeg';
    return new Promise(function (r) { c.toBlob(function (b) { r({ blob: b, name: ph.name.replace(/\.[^.]+$/, '') + '-faces-covered.' + (type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg') }); }, type, 0.92); });
  }
  function save(blob, name) { var u = URL.createObjectURL(blob); urls.push(u); var a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); if (urls.length > 4) URL.revokeObjectURL(urls.shift()); }
  $('dl').addEventListener('click', function () {
    var ph = photos[cur]; if (!ph) return;
    render(ph).then(function (r) { if (!r.blob) { say('bad', 'Your browser could not create the file. The photo may be too large for this device.'); return; } save(r.blob, r.name); burst($('dl')); say('ok', 'Saved ' + r.name + ' (' + fmtBytes(r.blob.size) + '). Location and camera details (EXIF) are not included.'); });
  });
  $('dlAll').addEventListener('click', function () {
    if (!photos.length) return; var files = [], i = 0, names = {};
    $('dlAll').disabled = true; say('', 'Preparing the ZIP…');
    (function next() {
      if (i >= photos.length) {
        var z = PT.zip(files); save(z, 'faces-covered.zip'); $('dlAll').disabled = false; $('notice').hidden = true; burst($('dlAll'));
        say('ok', 'Saved ' + files.length + ' photos in faces-covered.zip (' + fmtBytes(z.size) + ').'); return;
      }
      var ph = photos[i++];
      progress(i / photos.length, 'Adding photo ' + i + ' of ' + photos.length + '…');
      render(ph).then(function (r) {
        if (!r.blob) return;
        var n = r.name; while (names[n]) n = n.replace(/(\.\w+)$/, '-' + i + '$1'); names[n] = 1;
        return r.blob.arrayBuffer().then(function (a) { files.push({ name: n, data: new Uint8Array(a) }); });
      }).then(next, function () { $('dlAll').disabled = false; $('notice').hidden = true; say('bad', 'The ZIP could not be made. Try downloading the photos one at a time.'); });
    })();
  });
})();
</script>
