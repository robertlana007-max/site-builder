<style>
.mzg fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.mzg legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.mzg .mzg-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
.mzg .mzg-row button { font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; padding: 4px 6px; }
.mzg .mzg-row button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.mzg .mzg-check { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 0 12px; }
.mzg .mzg-prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.mzg .mzg-prev canvas { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.mzg .mzg-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
.mzg .mzg-bar .btn { min-height: 38px; padding: 4px 12px; }
</style>
<div class="mzg" id="mzg">
<fieldset><legend>Maze</legend>
  <div class="mzg-row" id="mzShape" role="group" aria-label="Shape"><button type="button" data-v="rect">Rectangle</button><button type="button" data-v="circle">Circle</button></div>
  <div class="fields">
    <div><label for="mzLevel">Difficulty</label><select id="mzLevel"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="expert">Expert</option><option value="custom">Choose my own size</option></select></div>
    <div><label for="mzStyle">Path style</label><select id="mzStyle"><option value="dfs">Long winding paths</option><option value="prim">Many short dead ends</option></select></div>
  </div>
  <div class="fields" id="mzCustom" hidden>
    <div class="mz-r"><label for="mzW">Squares across</label><input type="number" id="mzW" min="4" max="100" value="20" inputmode="numeric"></div>
    <div class="mz-r"><label for="mzH">Squares down</label><input type="number" id="mzH" min="4" max="100" value="20" inputmode="numeric"></div>
    <div class="mz-c" hidden><label for="mzRings">Rings</label><input type="number" id="mzRings" min="3" max="50" value="12" inputmode="numeric"></div>
  </div>
</fieldset>
<div class="btns" style="margin:0 0 14px"><button type="button" class="btn" id="mzMake">New maze</button></div>
<div class="mzg-prev"><div class="mzg-bar"><span id="mzInfo"></span><button type="button" class="btn ghost" id="mzSol" aria-pressed="false">Show solution</button></div><canvas id="mzCanvas" width="600" height="600" aria-label="Maze"></canvas></div>
<fieldset style="margin-top:14px"><legend>Print</legend>
  <div class="fields">
    <div><label for="mzCount">Number of mazes</label><input type="number" id="mzCount" min="1" max="50" value="1" inputmode="numeric"></div>
    <div><label for="mzPer">Mazes per page</label><select id="mzPer"><option value="1">1</option><option value="2">2</option><option value="4">4</option></select></div>
    <div><label for="mzPaper">Paper</label><select id="mzPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div>
  </div>
  <div class="fields"><div><label for="mzTitle">Title (optional)</label><input type="text" id="mzTitle" data-nomemo maxlength="60" placeholder="e.g. Help the mouse find the cheese"></div></div>
  <label class="mzg-check"><input type="checkbox" id="mzAns" checked>Add the solutions at the end</label>
</fieldset>
<div class="btns">
  <button type="button" class="btn" id="mzPdf">Download PDF</button>
  <button type="button" class="btn ghost" id="mzPng">Save this maze as PNG</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
