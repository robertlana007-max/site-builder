<style>
.mac .stat b { font-size: clamp(17px, 4.6vw, 22px); overflow-wrap: normal; word-break: normal; }
.mac fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 2px; margin: 0 0 14px; min-width: 0; }
.mac legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.mac .mac-bar { display: flex; height: 18px; border-radius: 9px; overflow: hidden; margin: 16px 0 6px; background: var(--line); }
.mac .mac-bar i { display: block; height: 100%; }
.mac .mac-key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.mac .mac-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.mac .c-p { background: #2563eb; } .mac .c-c { background: #f59e0b; } .mac .c-f { background: #10b981; }
.mac table.sched td, .mac table.sched th { white-space: nowrap; }
.mac .mac-hint { display: block; font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
@media (max-width: 480px) { .mac .stats { grid-template-columns: 1fr 1fr; } .mac .stat { padding: 10px 12px; } }
</style>
<div class="mac" id="mac">
<fieldset>
  <legend>About you</legend>
  <div class="fields">
    <div><label for="macUnit">Units</label><select id="macUnit"><option value="m">Metric (kg, cm)</option><option value="i">Imperial (lb, ft, in)</option></select></div>
    <div><label for="macSex">Sex</label><select id="macSex"><option value="f">Female</option><option value="m">Male</option></select></div>
    <div><label for="macAge">Age (years)</label><input type="number" id="macAge" min="15" max="100" step="1" inputmode="numeric" value="30"></div>
  </div>
  <div class="fields">
    <div><label for="macWt" id="macWtL">Weight (kg)</label><input type="number" id="macWt" min="0" step="any" inputmode="decimal" value="70"></div>
    <div id="macCmBox"><label for="macCm">Height (cm)</label><input type="number" id="macCm" min="0" step="any" inputmode="decimal" value="170"></div>
    <div id="macFtBox" hidden><label for="macFt">Height (ft)</label><input type="number" id="macFt" min="0" step="1" inputmode="numeric" value="5"></div>
    <div id="macInBox" hidden><label for="macIn">Height (in)</label><input type="number" id="macIn" min="0" step="any" inputmode="decimal" value="7"></div>
  </div>
  <div class="fields">
    <div><label for="macAct">Activity level</label><select id="macAct">
      <option value="1.2">Little or no exercise</option><option value="1.375">Light exercise 1–3 days a week</option><option value="1.55" selected>Moderate exercise 3–5 days a week</option><option value="1.725">Hard exercise 6–7 days a week</option><option value="1.9">Very hard exercise or a physical job</option></select></div>
    <div><label for="macGoal">Goal</label><select id="macGoal">
      <option value="-0.2">Lose weight (20% fewer calories)</option><option value="-0.1">Lose slowly (10% fewer)</option><option value="0" selected>Keep my weight</option><option value="0.1">Gain slowly (10% more)</option><option value="0.15">Build muscle (15% more)</option></select></div>
  </div>
</fieldset>
<fieldset>
  <legend>Macro split</legend>
  <div class="fields">
    <div><label for="macDiet">Eating style</label><select id="macDiet">
      <option value="30,40,30">Balanced (30% protein, 40% carbs, 30% fat)</option><option value="25,50,25">Higher carb (25 / 50 / 25)</option><option value="40,30,30">High protein (40 / 30 / 30)</option><option value="35,25,40">Lower carb (35 / 25 / 40)</option><option value="25,5,70">Keto (25 / 5 / 70)</option><option value="c">Custom</option></select></div>
    <div><label for="macMeals">Meals per day</label><input type="number" id="macMeals" min="1" max="10" step="1" inputmode="numeric" value="3"></div>
  </div>
  <div class="fields" id="macCustom" hidden>
    <div><label for="macP">Protein (%)</label><input type="number" id="macP" min="0" max="100" step="any" inputmode="decimal" value="30"></div>
    <div><label for="macC">Carbs (%)</label><input type="number" id="macC" min="0" max="100" step="any" inputmode="decimal" value="40"></div>
    <div><label for="macF">Fat (%)</label><input type="number" id="macF" min="0" max="100" step="any" inputmode="decimal" value="30"></div>
  </div>
</fieldset>
<div class="stats">
  <div class="stat"><span>Daily calories</span><b id="macKcal">–</b></div>
  <div class="stat"><span>Protein</span><b id="macPg">–</b></div>
  <div class="stat"><span>Carbs</span><b id="macCg">–</b></div>
  <div class="stat"><span>Fat</span><b id="macFg">–</b></div>
</div>
<div class="mac-bar" aria-hidden="true"><i class="c-p" id="macBp"></i><i class="c-c" id="macBc"></i><i class="c-f" id="macBf"></i></div>
<div class="mac-key"><span><i class="c-p"></i>Protein</span><span><i class="c-c"></i>Carbs</span><span><i class="c-f"></i>Fat</span></div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="scroll-x"><table class="sched"><thead><tr><th></th><th>Per day</th><th>Per meal</th><th>Calories</th><th>Share</th></tr></thead><tbody id="macRows"></tbody></table></div>
<p class="msg">These are estimates for healthy adults, not medical or nutrition advice. If you are pregnant, breastfeeding, under 18, or have a health condition, ask a doctor or dietitian.</p>
<div class="btns"><button type="button" class="btn ghost" id="macCopy">Copy my macros</button></div>
</div>
<script>
(function () {
  'use strict';
  // ---------- shared helpers ----------
  function num(id) { var el = typeof id === 'string' ? $(id) : id; var s = String(el.value).replace(/[\s,']/g, ''); return s === '' ? NaN : +s; }
  function say(cls, text, id) { var m = $(id || 'msg'); if (!m) return; m.className = 'msg ' + (cls || ''); m.textContent = text || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function isoToday() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function niceDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : ''; }
  // Region from the browser language (e.g. en-US -> US). Used only to pick sensible defaults.
  function region() { var l = (navigator.languages && navigator.languages[0]) || navigator.language || '', m = /[-_]([a-z]{2})\b/i.exec(l); return m ? m[1].toUpperCase() : ''; }
  // Imperial by default where it is the everyday system (or when chosen in Settings); metric everywhere else.
  function imperialDefault() { if (window.Prefs && Prefs.get().units === 'imperial') return true; return ['US', 'LR', 'MM'].indexOf(region()) !== -1; }
  function nf(n, d) { return isFinite(n) ? fmtNum(n, d == null ? 2 : d) : '–'; }
  function round(n, d) { var p = Math.pow(10, d || 0); return Math.round(n * p) / p; }
  // Short axis labels: 1.2K, 3.4M
  function shortNum(n) { try { return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n); } catch (e) { return String(Math.round(n)); } }
  // number with up to d decimals (trailing zeros dropped), in the visitor's number format
  function nfx(n, d) { if (!isFinite(n)) return '–'; try { return Number(n).toLocaleString((window.Prefs && Prefs.get().numfmt) || 'en-US', { maximumFractionDigits: d == null ? 2 : d }); } catch (e) { return String(round(n, d == null ? 2 : d)); } }
  function cssv(v, d) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || d; }
  var last = null;
  if (imperialDefault()) $('macUnit').value = 'i';
  function units() {
    var imp = $('macUnit').value === 'i';
    $('macWtL').textContent = imp ? 'Weight (lb)' : 'Weight (kg)';
    $('macCmBox').hidden = imp; $('macFtBox').hidden = !imp; $('macInBox').hidden = !imp;
  }
  function split() {
    var d = $('macDiet').value;
    $('macCustom').hidden = d !== 'c';
    if (d !== 'c') return d.split(',').map(Number);
    return [num('macP'), num('macC'), num('macF')];
  }
  function calc() {
    units();
    var imp = $('macUnit').value === 'i', age = num('macAge'), male = $('macSex').value === 'm';
    var kg = imp ? num('macWt') * 0.45359237 : num('macWt');
    var cm = imp ? ((num('macFt') || 0) * 12 + (num('macIn') || 0)) * 2.54 : num('macCm');
    var act = +$('macAct').value, goal = +$('macGoal').value, meals = num('macMeals'), sp = split();
    var fail = function (t) { ['macKcal', 'macPg', 'macCg', 'macFg'].forEach(function (i) { $(i).textContent = '–'; }); $('macRows').innerHTML = ''; ['macBp', 'macBc', 'macBf'].forEach(function (i) { $(i).style.width = '0'; }); last = null; say('bad', t); };
    if (!(age >= 15 && age <= 100)) return fail('Enter an age from 15 to 100. This formula is for adults and older teens.');
    if (!(kg >= 25 && kg <= 350)) return fail('Enter a weight between ' + (imp ? '55 and 770 lb.' : '25 and 350 kg.'));
    if (!(cm >= 120 && cm <= 250)) return fail('Enter a height between ' + (imp ? '4 ft and 8 ft 2 in.' : '120 and 250 cm.'));
    if (!(meals >= 1 && meals <= 10)) return fail('Meals per day must be from 1 to 10.');
    if (sp.some(function (x) { return !(x >= 0); })) return fail('Enter a percentage for protein, carbs and fat (0 or more).');
    var sum = sp[0] + sp[1] + sp[2];
    if (Math.abs(sum - 100) > 0.5) return fail('Protein, carbs and fat must add up to 100%. They add up to ' + nfx(sum, 1) + '% now.');
    // Mifflin-St Jeor resting energy: 10 x kg + 6.25 x cm - 5 x age + 5 (men) or - 161 (women)
    var bmr = 10 * kg + 6.25 * cm - 5 * age + (male ? 5 : -161), tdee = bmr * act, kcal = Math.round(tdee * (1 + goal));
    var g = [kcal * sp[0] / 100 / 4, kcal * sp[1] / 100 / 4, kcal * sp[2] / 100 / 9];
    $('macKcal').textContent = fmtNum(kcal, 0) + ' kcal';
    $('macPg').textContent = fmtNum(Math.round(g[0]), 0) + ' g'; $('macCg').textContent = fmtNum(Math.round(g[1]), 0) + ' g'; $('macFg').textContent = fmtNum(Math.round(g[2]), 0) + ' g';
    $('macBp').style.width = sp[0] + '%'; $('macBc').style.width = sp[1] + '%'; $('macBf').style.width = sp[2] + '%';
    var names = ['Protein', 'Carbs', 'Fat'], per = [4, 4, 9];
    $('macRows').innerHTML = names.map(function (n, i) { return '<tr><td>' + n + '</td><td>' + fmtNum(Math.round(g[i]), 0) + ' g</td><td>' + nfx(g[i] / meals, 0) + ' g</td><td>' + fmtNum(Math.round(g[i] * per[i]), 0) + ' kcal</td><td>' + nfx(sp[i], 1) + '%</td></tr>'; }).join('') +
      '<tr><td><b>Total</b></td><td></td><td>' + fmtNum(Math.round(kcal / meals), 0) + ' kcal</td><td><b>' + fmtNum(kcal, 0) + ' kcal</b></td><td>100%</td></tr>';
    var notes = ['Resting burn (Mifflin-St Jeor): ' + fmtNum(Math.round(bmr), 0) + ' kcal. With your activity: ' + fmtNum(Math.round(tdee), 0) + ' kcal a day (' + fmtNum(Math.round(tdee * 4.184), 0) + ' kJ).'];
    notes.push('Protein is ' + nfx(g[0] / kg, 1) + ' g per kg of body weight (' + nfx(g[0] / (kg / 0.45359237), 2) + ' g per lb).');
    var floor = male ? 1500 : 1200;
    if (kcal < floor) notes.push('This is below ' + floor + ' kcal a day, which is generally too low without medical supervision. Pick a gentler goal.');
    say(kcal < floor ? 'bad' : 'ok', notes.join(' '));
    last = { kcal: kcal, g: g, sp: sp };
  }
  $('macCopy').addEventListener('click', function () {
    if (!last) return say('bad', 'Fix the numbers above first.');
    copyText('Daily target: ' + fmtNum(last.kcal, 0) + ' kcal\nProtein: ' + Math.round(last.g[0]) + ' g (' + last.sp[0] + '%)\nCarbs: ' + Math.round(last.g[1]) + ' g (' + last.sp[1] + '%)\nFat: ' + Math.round(last.g[2]) + ' g (' + last.sp[2] + '%)', this);
  });
  // switching units converts the numbers already typed
  var prevImp = $('macUnit').value === 'i';
  $('macUnit').addEventListener('change', function () {
    var imp = $('macUnit').value === 'i'; if (imp === prevImp) return; prevImp = imp;
    var w = num('macWt');
    if (imp) { if (w > 0) $('macWt').value = round(w / 0.45359237, 1); var c = num('macCm'); if (c > 0) { var t = round(c / 2.54, 2), ft = Math.floor(t / 12); $('macFt').value = ft; $('macIn').value = round(t - ft * 12, 2); } }
    else { if (w > 0) $('macWt').value = round(w * 0.45359237, 1); var inch = (num('macFt') || 0) * 12 + (num('macIn') || 0); if (inch > 0) $('macCm').value = round(inch * 2.54, 1); }
    calc();
  });
  if (prevImp) { $('macWt').value = 154; }
  $('mac').addEventListener('input', calc);
  $('mac').addEventListener('change', calc);
  calc();
})();
</script>
