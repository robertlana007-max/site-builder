<div class="fields">
  <div><label for="bill">Bill amount</label><input type="number" id="bill" min="0" step="any" placeholder="0.00"></div>
  <div><label for="tip">Tip (%)</label><input type="number" id="tip" min="0" step="any" value="15"></div>
  <div><label for="ppl">Split between (people)</label><input type="number" id="ppl" min="1" step="1" value="1"></div>
</div>
<div class="btns" style="margin:0 0 4px">
  <button class="btn ghost" data-t="10">10%</button>
  <button class="btn ghost" data-t="15">15%</button>
  <button class="btn ghost" data-t="18">18%</button>
  <button class="btn ghost" data-t="20">20%</button>
  <button class="btn ghost" data-t="25">25%</button>
</div>
<div class="stats">
  <div class="stat"><span>Tip</span><b id="t">–</b></div>
  <div class="stat"><span>Total</span><b id="tot">–</b></div>
  <div class="stat"><span>Each person pays</span><b id="each">–</b></div>
  <div class="stat"><span>Tip per person</span><b id="teach">–</b></div>
</div>
<script>
(function () {
  function calc() {
    var bill = +$('bill').value, tip = Math.max(0, +$('tip').value), ppl = Math.max(1, Math.floor(+$('ppl').value) || 1);
    if (!(bill > 0)) { ['t', 'tot', 'each', 'teach'].forEach(function (i) { $(i).textContent = '–'; }); return; }
    var t = bill * tip / 100;
    $('t').textContent = fmtNum(t, 2);
    $('tot').textContent = fmtNum(bill + t, 2);
    $('each').textContent = fmtNum((bill + t) / ppl, 2);
    $('teach').textContent = fmtNum(t / ppl, 2);
  }
  ['bill', 'tip', 'ppl'].forEach(function (id) { $(id).addEventListener('input', calc); });
  document.querySelectorAll('[data-t]').forEach(function (b) {
    b.addEventListener('click', function () { $('tip').value = b.dataset.t; calc(); });
  });
})();
</script>
