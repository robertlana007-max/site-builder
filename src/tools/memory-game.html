<style>
.mg-set { display: grid; gap: 14px; }
.mg-set .fields { margin-bottom: 0; }
.mg-themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mg-themes button { font: inherit; font-size: 14.5px; font-weight: 600; min-height: 52px; display: flex; align-items: center; gap: 10px; text-align: start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.mg-themes button span { font-size: 22px; line-height: 1; flex: none; width: 28px; text-align: center; }
.mg-themes button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mg-names { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mg-names label { font-weight: 600; }
.mg-hint { font-size: 13.5px; color: var(--muted); margin: 0; }
.mg-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.mg-bar .sp { flex: 1; }
.mg-bar .btn { min-height: 40px; padding: 6px 12px; }
.mg-stat { display: inline-flex; flex-direction: column; padding: 5px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 12px; color: var(--muted); line-height: 1.2; font-variant-numeric: tabular-nums; }
.mg-stat b { font-size: 18px; color: var(--ink); }
.mg-pl { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 2px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 600; max-width: 100%; }
.mg-pl i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.mg-pl em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 9em; }
.mg-pl b { font-variant-numeric: tabular-nums; }
.mg-pl.now { border-color: var(--pc); background: var(--surface); box-shadow: 0 0 0 2px var(--pc); }
.mg-turn { font-size: 15px; font-weight: 600; margin: 0 0 10px; min-height: 1.4em; }
.mg-grid { display: grid; gap: var(--gap, 8px); margin: 0 auto; max-width: var(--maxw, 640px); touch-action: manipulation; }
.mg-card { position: relative; aspect-ratio: 3 / 3.4; padding: 0; border: 0; background: none; cursor: pointer; perspective: 800px; font: inherit; color: inherit; border-radius: 12px; -webkit-tap-highlight-color: transparent; min-width: 0; }
.mg-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mg-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .42s cubic-bezier(.3, .7, .3, 1); }
.mg-card.up .mg-in { transform: rotateY(180deg); }
.mg-f { position: absolute; inset: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.mg-back { background: linear-gradient(135deg, #4f7df3, #7b5cf0); border: 2px solid rgba(255,255,255,.35); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.mg-back::after { content: ''; position: absolute; inset: 14%; border-radius: 50%; border: 3px dotted rgba(255,255,255,.55); }
.mg-face { transform: rotateY(180deg); background: #fff; color: #1c2230; border: 2px solid #d7dce5; box-shadow: 0 2px 6px rgba(0,0,0,.12); text-align: center; padding: 3px; }
.mg-face .e { font-size: var(--fz, 40px); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.mg-face .t { font-size: var(--fz, 40px); font-weight: 800; line-height: 1; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.mg-face .w { font-size: calc(var(--fz, 40px) * .5); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; font-family: "Andika", "Comic Sans MS", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.mg-face .cap { font-size: max(10px, calc(var(--fz, 40px) * .26)); font-weight: 600; color: #4a5466; margin-top: 4%; line-height: 1.1; overflow-wrap: anywhere; }
.mg-face svg { width: 64%; height: auto; display: block; }
.mg-face .sw { width: 70%; height: 46%; border-radius: 10px; border: 2px solid rgba(0,0,0,.25); }
.mg-face .dots { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 6%; width: 86%; height: 70%; }
.mg-face .dots i { width: 22%; aspect-ratio: 1; border-radius: 50%; background: #e8546b; }
.mg-card.got .mg-face { border-color: var(--pc, #2fb36d); box-shadow: 0 0 0 3px var(--pc, #2fb36d) inset; }
.mg-card.got { cursor: default; }
.mg-card.got .mg-face::after { content: '✓'; position: absolute; top: 3px; right: 6px; font-size: 13px; font-weight: 800; color: var(--pc, #2fb36d); }
.mg-card.no .mg-face { border-color: #e8546b; }
.mg-card.pop .mg-in { animation: mg-pop .45s ease; }
@keyframes mg-pop { 0% { transform: rotateY(180deg) scale(1); } 45% { transform: rotateY(180deg) scale(1.08); } 100% { transform: rotateY(180deg) scale(1); } }
.mg-calm .mg-in { transition: none; transform: none !important; animation: none !important; }
.mg-calm .mg-face { transform: none; visibility: hidden; }
.mg-calm .mg-card.up .mg-face { visibility: visible; }
.mg-calm .mg-card.up .mg-back { visibility: hidden; }
.mg-done { text-align: center; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); padding: 22px 16px; margin: 16px auto 0; max-width: 560px; }
.mg-done h3 { margin: 0 0 6px; font-size: 22px; }
.mg-done p { margin: 4px 0; }
.mg-done .btns { justify-content: center; }
.mg-done ol { text-align: start; display: inline-block; margin: 8px 0 0; padding-inline-start: 22px; }
.mg-best { font-size: 14px; color: var(--muted); }
@media (max-width: 520px) { .mg-themes { grid-template-columns: 1fr 1fr; } .mg-themes button { font-size: 13.5px; padding: 6px 8px; gap: 6px; } .mg-bar .sp { display: none; } }
</style>
<div id="mg">
<div id="mgSetup" class="mg-set">
  <div>
    <label id="mgThemeL">Cards</label>
    <div class="mg-themes" id="mgThemes" role="group" aria-labelledby="mgThemeL"></div>
  </div>
  <div class="fields">
    <div><label for="mgGrid">Grid size</label><select id="mgGrid" data-nomemo>
      <option value="4x3">4 × 3 (6 pairs)</option><option value="4x4" selected>4 × 4 (8 pairs)</option><option value="5x4">5 × 4 (10 pairs)</option>
      <option value="6x4">6 × 4 (12 pairs)</option><option value="6x5">6 × 5 (15 pairs)</option><option value="6x6">6 × 6 (18 pairs)</option></select></div>
    <div><label for="mgPlayers">Players</label><select id="mgPlayers" data-nomemo><option value="1">1 player (solo)</option><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select></div>
  </div>
  <div class="mg-names" id="mgNames" hidden></div>
  <div class="checks" style="margin:0"><label><input type="checkbox" id="mgSound" checked data-nomemo> Sounds</label><label><input type="checkbox" id="mgPeek" data-nomemo> Show all cards for 3 seconds at the start</label></div>
  <p class="mg-hint" id="mgThemeHint"></p>
  <div class="btns" style="margin:0"><button type="button" class="btn big" id="mgStart">Start game</button><button type="button" class="btn ghost" id="mgResume" hidden>Continue last game</button></div>
  <p class="msg" id="mgMsg" role="status" aria-live="polite"></p>
  <p class="mg-best" id="mgBestList"></p>
</div>

<div id="mgPlay" hidden>
  <div class="mg-bar" id="mgBar"></div>
  <p class="mg-turn" id="mgTurn" aria-live="polite"></p>
  <div class="mg-grid" id="mgGrid2" role="grid" aria-label="Memory cards"></div>
  <div class="mg-done" id="mgDone" hidden></div>
  <p class="mg-hint" style="margin-top:12px;text-align:center">Keyboard: arrow keys move, Enter or Space turns a card over.</p>
</div>
</div>

    ['circle', '#e8546b', '<circle cx="50" cy="50" r="40"/>'], ['square', '#2f80ed', '<rect x="12" y="12" width="76" height="76"/>'],
    ['triangle', '#2fb36d', '<path d="M50 8 92 88H8z"/>'], ['star', '#f2a516', '<path d="M50 6l12.9 28.3 30.9 3.4-23 20.9 6.4 30.4L50 73.4 22.8 89l6.4-30.4-23-20.9 30.9-3.4z"/>'],

  var THEMES = [
    { k: 'animals', n: 'Animals', ic: '🐶', pairs: function () { return emo(ANIMALS, ANIMAL_N); } },
    { k: 'food', n: 'Fruit and food', ic: '🍎', pairs: function () { return emo(FOOD, FOOD_N); } },
    { k: 'numbers', n: 'Numbers', ic: '7', pairs: function () { var o = []; for (var i = 1; i <= 20; i++) o.push({ a: { t: String(i), n: String(i) } }); return o; } },
    { k: 'letters', n: 'Letters', ic: 'A', pairs: function () { return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function (c) { return { a: { t: c, n: 'letter ' + c } }; }); } },
    { k: 'shapes', n: 'Shapes', ic: '⬟', pairs: function () { return SHAPES.map(function (s) { return { a: { svg: s[2], c: s[1], cap: s[0], n: s[0] } }; }); } },
    { k: 'colours', n: 'Colours', ic: '🎨', pairs: function () { return CLRS.map(function (c) { return { a: { sw: c[1], cap: c[0], n: c[0] } }; }); } },
    { k: 'words', n: 'Words and pictures', ic: '🔤', hint: 'Match each word to its picture. Good for early readers.', pairs: function () { return WORDS.map(function (w) { return { a: { e: w[1], n: 'picture of a ' + w[0] }, b: { w: w[0], n: 'word ' + w[0] } }; }); } },
    { k: 'case', n: 'Big and small letters', ic: 'Aa', hint: 'Match each capital letter to its small letter, like A and a. (I is left out, because I and l look the same in many fonts.)', pairs: function () { return 'ABCDEFGHJKLMNOPQRSTUVWXYZ'.split('').map(function (c) { return { a: { t: c, n: 'capital ' + c }, b: { t: c.toLowerCase(), n: 'small ' + c.toLowerCase() } }; }); } },
    { k: 'count', n: 'Dots and numbers', ic: '⁘', hint: 'Count the dots and find the matching number. Up to 10 pairs, so pick a grid of 20 cards or fewer.', pairs: function () { var o = []; for (var i = 1; i <= 10; i++) o.push({ a: { dots: i, n: i + ' dot' + (i > 1 ? 's' : '') }, b: { t: String(i), n: 'number ' + i } }); return o; } }
  ];
  function themeOf(k) { for (var i = 0; i < THEMES.length; i++) if (THEMES[i].k === k) return THEMES[i]; return THEMES[0]; }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var calm = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || document.documentElement.hasAttribute('data-calm');

  function tone(seq) {

      seq.forEach(function (n) {

  }
  var SND = { flip: [[660, 0, 0.07, 'triangle']], match: [[660, 0, 0.12], [880, 0.1, 0.18]], miss: [[300, 0, 0.12, 'triangle'], [240, 0.1, 0.16, 'triangle']], win: [[523, 0, 0.15], [659, 0.13, 0.15], [784, 0.26, 0.15], [1047, 0.39, 0.3]] };

    return '';
  }
  function nameOf(c) { var P = themeOf(G.theme).pairs()[c.src]; return (c.side === 'b' && P.b ? P.b : P.a).n; }
  function sizeGrid() {
    var grid = $('mgGrid2'), w = Math.min(grid.parentNode.clientWidth || 360, 680), gap = w < 420 ? 6 : 8;
    var vh = window.innerHeight || 700, maxH = Math.max(320, vh - 190);
    var cw = (w - gap * (G.cols - 1)) / G.cols, ch = cw * 3.4 / 3;
    if (ch * G.rows + gap * (G.rows - 1) > maxH && w > 500) { ch = (maxH - gap * (G.rows - 1)) / G.rows; cw = ch * 3 / 3.4; }

    grid.style.gridTemplateColumns = 'repeat(' + G.cols + ', minmax(0, 1fr))';

  }
  function start(fresh) {

    $('mgSetup').hidden = true; $('mgPlay').hidden = false; $('mgDone').hidden = true; say('', '');
    var grid = $('mgGrid2'); grid.innerHTML = ''; grid.setAttribute('aria-rowcount', G.rows); grid.setAttribute('aria-colcount', G.cols);
    G.open = G.open.filter(function (i) { return G.cards[i] && G.cards[i].got < 0; });
    if (G.open.length > 1) G.open = [];
    var row;
    G.cards.forEach(function (c, i) {
      if (i % G.cols === 0) { row = document.createElement('div'); row.setAttribute('role', 'row'); row.style.display = 'contents'; grid.appendChild(row); }
      var cell = document.createElement('div'); cell.setAttribute('role', 'gridcell'); cell.style.display = 'contents';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'mg-card'; b.setAttribute('data-i', i); b.tabIndex = i === focusI ? 0 : -1;
      b.innerHTML = '<span class="mg-in"><span class="mg-f mg-back"></span><span class="mg-f mg-face">' + faceHtml(c) + '</span></span>';
      cell.appendChild(b); row.appendChild(cell); paintCard(i, b);
    });
    sizeGrid(); bar(); turnText();
    if (fresh && S.peek) { lock = true; grid.querySelectorAll('.mg-card').forEach(function (b) { b.classList.add('up'); }); $('mgTurn').textContent = 'Look carefully… the cards turn over in 3 seconds.'; setTimeout(function () { if (!G) return; grid.querySelectorAll('.mg-card').forEach(function (b, i) { paintCard(i, b); }); lock = false; turnText(); }, 3000); }
    runClock();
    if (!('ontouchstart' in window)) { var f = grid.querySelector('[tabindex="0"]'); if (f) f.focus({ preventScroll: true }); }
    window.scrollTo(0, $('mgPlay').getBoundingClientRect().top + window.scrollY - 120);
  }
  function cardEl(i) { return $('mgGrid2').querySelector('[data-i="' + i + '"]'); }
  function paintCard(i, b) {
    b = b || cardEl(i); if (!b) return; var c = G.cards[i], up = c.got >= 0 || G.open.indexOf(i) !== -1;
    b.classList.toggle('up', up); b.classList.toggle('got', c.got >= 0);
    if (c.got >= 0) b.style.setProperty('--pc', G.players.length > 1 ? COLORS[c.got] : '#2fb36d'); else b.style.removeProperty('--pc');
    var r = Math.floor(i / G.cols) + 1, col = i % G.cols + 1;
    b.setAttribute('aria-label', 'Row ' + r + ', column ' + col + ': ' + (up ? nameOf(c) + (c.got >= 0 ? ', matched' : '') : 'face down'));
    b.setAttribute('aria-disabled', String(c.got >= 0));
  }
  function bar() {
    var h = '', pairs = G.cards.length / 2, got = G.cards.filter(function (c) { return c.got >= 0; }).length / 2;
    if (G.players.length === 1) {
      var b = S.best[bestKey(G.theme, G.grid)];
      h += '<span class="mg-stat">Moves<b id="mgMoves">' + G.moves + '</b></span><span class="mg-stat">Time<b id="mgTime">' + fmtT(G.time) + '</b></span><span class="mg-stat">Pairs<b>' + got + ' / ' + pairs + '</b></span>' + (b ? '<span class="mg-stat">Best<b>' + b.moves + ' moves</b></span>' : '');
    } else {
      G.players.forEach(function (p, i) { h += '<span class="mg-pl' + (i === G.turn && !G.over ? ' now' : '') + '" style="--pc:' + COLORS[i] + '"><i style="background:' + COLORS[i] + '"></i><em>' + esc(p) + '</em><b>' + G.scores[i] + '</b></span>'; });
    }
    h += '<span class="sp"></span><button type="button" class="btn ghost" id="mgMute" aria-pressed="' + (!S.sound) + '" aria-label="' + (S.sound ? 'Mute sounds' : 'Turn sounds on') + '">' + (S.sound ? '🔊' : '🔇') + '</button><button type="button" class="btn ghost" id="mgRestart">Restart</button><button type="button" class="btn ghost" id="mgQuit">Settings</button>';
    $('mgBar').innerHTML = h;
  }
  function turnText() {
    if (G.over) { $('mgTurn').textContent = ''; return; }
    var left = G.cards.filter(function (c) { return c.got < 0; }).length / 2;
    $('mgTurn').textContent = G.players.length > 1 ? G.players[G.turn] + '’s turn. Find a pair!' : (G.moves === 0 ? 'Turn over two cards to find a matching pair.' : left + ' pair' + (left === 1 ? '' : 's') + ' left.');
  }
  function runClock() {
    clearInterval(tick);
    tick = setInterval(function () { if (!G || G.over || !G.started || document.hidden) return; G.time++; var t = $('mgTime'); if (t) t.textContent = fmtT(G.time); if (G.time % 5 === 0) save(); }, 1000);
  }
  function closeOpen() {
    clearTimeout(flipBack); flipBack = null;
    var o = G.open.slice(); G.open = []; lock = false;
    o.forEach(function (i) { var b = cardEl(i); if (b) b.classList.remove('no'); paintCard(i); });
    if (G.players.length > 1) { G.turn = (G.turn + 1) % G.players.length; bar(); }
    turnText(); save();
  }
  function flip(i) {
    if (!G || G.over) return;
    var c = G.cards[i]; if (!c || c.got >= 0 || G.open.indexOf(i) !== -1) return;
    if (G.open.length === 2) { if (flipBack) closeOpen(); else return; }
    if (lock) return;
    G.started = true; G.open.push(i); paintCard(i); tone(SND.flip);
    if (G.open.length < 2) { save(); return; }
    G.moves++; var a = G.cards[G.open[0]], b2 = G.cards[G.open[1]], who = G.turn;
    if (a.p === b2.p) {
      a.got = b2.got = who; G.scores[who]++;
      var o = G.open.slice(); G.open = [];
      o.forEach(function (j) { var el = cardEl(j); paintCard(j, el); if (!calm && el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } });
      tone(SND.match);
      $('mgTurn').textContent = 'A match: ' + nameOf(a).replace(/^(picture of an? |word |capital |small |number )/, '') + '!' + (G.players.length > 1 ? ' ' + G.players[who] + ' goes again.' : '');
      bar();

    } else {
      tone(SND.miss);
      G.open.forEach(function (j) { var el = cardEl(j); if (el) el.classList.add('no'); });
      $('mgTurn').textContent = 'Not a pair. ' + (G.players.length > 1 ? 'Next player…' : 'Remember where they are!');
      if (G.players.length === 1) bar();
      flipBack = setTimeout(closeOpen, calm ? 1300 : 1100); save();
    }
  }
  function finish() {
    G.over = true; clearInterval(tick); S.game = null; save(); tone(SND.win);
    var box = $('mgDone'), h = '';
    if (G.players.length === 1) {
      var k = bestKey(G.theme, G.grid), b = S.best[k], isBest = !b || G.moves < b.moves || (G.moves === b.moves && G.time < b.time);
      if (isBest) { S.best[k] = { moves: G.moves, time: G.time, at: Date.now() }; save(); }
      var perfect = G.moves === G.cards.length / 2;
      h = '<h3>' + (perfect ? 'Perfect memory! 🌟' : 'You found them all! 🎉') + '</h3><p>' + G.moves + ' moves in ' + fmtT(G.time) + ' for ' + G.cards.length / 2 + ' pairs.</p><p class="mg-best">' + (isBest ? (b ? 'New best score! Your old best was ' + b.moves + ' moves.' : 'This is your first best score for this card set and grid.') : 'Your best is ' + b.moves + ' moves in ' + fmtT(b.time) + '.') + '</p>';
    } else {
      var top = Math.max.apply(null, G.scores), win = G.players.filter(function (_, i) { return G.scores[i] === top; });
      var order = G.players.map(function (p, i) { return [p, G.scores[i], i]; }).sort(function (x, y) { return y[1] - x[1]; });
      h = '<h3>' + (win.length > 1 ? 'It’s a tie between ' + esc(win.join(' and ')) + '! 🤝' : esc(win[0]) + ' wins! 🏆') + '</h3><ol>' + order.map(function (o) { return '<li><b style="color:' + COLORS[o[2]] + '">●</b> ' + esc(o[0]) + ': ' + o[1] + ' pair' + (o[1] === 1 ? '' : 's') + '</li>'; }).join('') + '</ol><p class="mg-best">' + G.moves + ' turns in ' + fmtT(G.time) + '.</p>';
    }
    h += '<div class="btns"><button type="button" class="btn" id="mgAgain">Play again</button><button type="button" class="btn ghost" id="mgChange">Change settings</button></div>';
    box.innerHTML = h; box.hidden = false; bar(); turnText();
    if (window.burst) burst(box.querySelector('h3'));
    setTimeout(function () { box.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' }); var a = $('mgAgain'); if (a) a.focus({ preventScroll: true }); }, 50);
  }
  function quit() { clearInterval(tick); clearTimeout(flipBack); flipBack = null; if (G && !G.over) { G.open = []; S.game = G; save(); } $('mgPlay').hidden = true; $('mgSetup').hidden = false; G = null; syncSetup(); }

  $('mgGrid2').addEventListener('click', function (e) { var b = e.target.closest('.mg-card'); if (!b) return; var i = +b.getAttribute('data-i'); setFocus(i, false); flip(i); });
  $('mgGrid2').addEventListener('keydown', function (e) {
    var b = e.target.closest('.mg-card'); if (!b || !G) return; var i = +b.getAttribute('data-i'), n = G.cards.length, j = i;
    if (e.key === 'ArrowRight') j = i + 1; else if (e.key === 'ArrowLeft') j = i - 1; else if (e.key === 'ArrowDown') j = i + G.cols; else if (e.key === 'ArrowUp') j = i - G.cols; else if (e.key === 'Home') j = i - i % G.cols; else if (e.key === 'End') j = i - i % G.cols + G.cols - 1; else return;
    e.preventDefault(); if (j < 0 || j >= n) return; setFocus(j, true);
  });
  function setFocus(i, move) { var g = $('mgGrid2'); g.querySelectorAll('.mg-card').forEach(function (b) { b.tabIndex = -1; }); var b = cardEl(i); if (b) { b.tabIndex = 0; if (move) b.focus(); } focusI = i; }
  $('mgPlay').addEventListener('click', function (e) {
    var id = e.target.closest('button') && e.target.closest('button').id;
    if (id === 'mgMute') { S.sound = !S.sound; save(); bar(); var m = $('mgMute'); if (m) m.focus(); }
    else if (id === 'mgRestart') { if (G && G.moves > 0 && !G.over && !confirm('Start again with new cards? This game will be lost.')) return; newGame(); }
    else if (id === 'mgQuit' || id === 'mgChange') quit();
    else if (id === 'mgAgain') newGame();
  });
  $('mgStart').addEventListener('click', function () { if (S.game && S.game.cards && !S.game.over && S.game.moves > 0 && !confirm('Start a new game? Your unfinished game will be replaced.')) return; newGame(); });
  $('mgResume').addEventListener('click', function () {
    var g = S.game; if (!g || !Array.isArray(g.cards) || !g.cols || !g.rows || g.cards.length !== g.cols * g.rows) { S.game = null; save(); syncSetup(); say('bad', 'The saved game could not be opened. Please start a new one.'); return; }
    G = g; G.open = []; focusI = 0; start(false);
  });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (G && !$('mgPlay').hidden) sizeGrid(); }, 120); });

  syncSetup();
})();
</script>
