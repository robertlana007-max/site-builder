<style>

<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a spreadsheet here</b>Excel (.xlsx, .xls), OpenDocument (.ods) or CSV. It is turned into a PDF on your device and never uploaded.</div>

    <div><label for="size">Paper size</label><select id="size"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option><option value="a3">A3</option></select></div>

  </div>

          if (ri % 400 === 0) { PT.say('', 'Making pages for "' + g.name + '": row ' + fmtNum(ri) + ' of ' + fmtNum(rows.length) + (groups.length > 1 ? ', columns part ' + (gi + 1) + ' of ' + groups.length : '') + '…'); await new Promise(function (r) { setTimeout(r, 0); }); }
          var L = layoutRow(rows[ri], false);
          if (y - Math.min(L.h, top - bottom) < bottom - 0.01 && pageRows > 0) await newPage();
          await drawRow(L, false, zebra && (ri - start) % 2 === 1);
          pageRows++;
        }
      }
    }
    // Titles and page numbers
    total = pagesBySheet.length;
    if (showTitle) for (var pi = 0; pi < total; pi++) {
      var p = pagesBySheet[pi], W = p.getWidth(), H = p.getHeight(), t = p.__sheet + (p.__part ? '  ·  columns ' + p.__part : '');
      if (supported(t)) p.drawText(t, { x: M, y: H - M - 10, size: 10, font: B, color: PL.rgb(0.2, 0.22, 0.26) });
      else await drawFallback(p, t, M, H - M - 10, 10, true, '#33383f');
      var pn = 'Page ' + (pi + 1) + ' of ' + total, pw = F.widthOfTextAtSize(pn, 8);
      p.drawText(pn, { x: W - M - pw, y: M - 14, size: 8, font: F, color: PL.rgb(0.45, 0.47, 0.5) });
    }
    if (!total) throw new Error('There is nothing to print in the chosen sheets.');
    doc.setTitle(PT.base(file.name)); doc.setCreator('GetToolNest');
    return { bytes: await doc.save(), pages: total, fallback: fallbackCount };
  }

  $('go').addEventListener('click', function () {
    if (!wb || busy) return;
    busy = true;
    PT.run(async function () {
      var r = await build();
      PT.done(r.bytes, PT.base(file.name) + '.pdf', 'application/pdf', 'Your PDF is ready: ' + r.pages + (r.pages === 1 ? ' page' : ' pages'));
    }).then(function () { busy = false; });
  });
})();
</script>
