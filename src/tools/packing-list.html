<style>
.pk fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 4px; margin: 0 0 14px; min-width: 0; }
.pk legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
.pk .pk-lab { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
.pk .pk-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.pk .pk-chips button { font: inherit; font-size: 14.5px; font-weight: 600; min-height: 44px; padding: 6px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 22px; cursor: pointer; }
.pk .pk-chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pk .pk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 0 0 12px; }
.pk .pk-bar > div { flex: 1 1 200px; min-width: 0; }
.pk .pk-bar select, .pk .pk-bar input { width: 100%; box-sizing: border-box; }
.pk .pk-prog { height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 6px 0 4px; }
.pk .pk-prog i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
.pk .pk-sum { font-weight: 600; margin: 0; }
.pk .pk-notes { margin: 8px 0 12px; padding-inline-start: 20px; color: var(--muted); font-size: 14px; }
.pk .pk-cat { margin: 16px 0 4px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
.pk .pk-cat small { color: var(--muted); font-weight: 400; font-size: 13px; }
.pk ul.pk-items { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pk .pk-items li { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-bottom: 1px solid var(--line); min-height: 52px; }
.pk .pk-items li:last-child { border-bottom: 0; }
.pk .pk-items label { flex: 1 1 auto; display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; margin: 0; font-weight: 400; font-size: 15.5px; min-width: 0; overflow-wrap: anywhere; padding: 4px; }
.pk .pk-items input[type=checkbox] { width: 24px; height: 24px; flex: 0 0 24px; accent-color: var(--ok); margin: 0; }
.pk .pk-items li.done label span { text-decoration: line-through; color: var(--muted); }
.pk .pk-items .nt { display: block; font-size: 12.5px; color: var(--muted); text-decoration: none !important; }
.pk .pk-q { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.pk .pk-q b { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }
.pk .pk-q button, .pk .pk-x { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-size: 18px; line-height: 1; padding: 0; }
.pk .pk-x { color: var(--muted); }
.pk .pk-x:hover { color: var(--bad); border-color: var(--bad); }
.pk .pk-empty { color: var(--muted); padding: 16px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.pk .pk-add { display: grid; grid-template-columns: minmax(0, 1fr) 80px minmax(0, 170px) auto; gap: 8px; align-items: end; }
.pk .pk-add input, .pk .pk-add select { width: 100%; box-sizing: border-box; }
@media (max-width: 560px) { .pk .pk-add { grid-template-columns: minmax(0, 1fr) 76px; } .pk .pk-add .wide { grid-column: 1 / -1; } }
.pk .btns .btn { min-height: 44px; }
.pk details summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
</style>
<div class="pk">
<fieldset><legend>Your trip</legend>
  <div class="fields">
    <div><label for="pkName">Trip name (optional)</label><input type="text" id="pkName" data-nomemo maxlength="60" placeholder="e.g. Summer at the coast"></div>
    <div><label for="pkDays">Number of days</label><input type="number" id="pkDays" data-nomemo min="1" max="90" step="1" value="5" inputmode="numeric"></div>
  </div>
  <span class="pk-lab" id="pkWxL">Weather</span>
  <div class="pk-chips" id="pkWx" role="group" aria-labelledby="pkWxL"></div>
  <span class="pk-lab" id="pkTypeL">Type of trip (choose any)</span>
  <div class="pk-chips" id="pkType" role="group" aria-labelledby="pkTypeL"></div>
  <div class="fields">
    <div><label for="pkGo">Getting there</label><select id="pkGo" data-nomemo>
      <option value="carry">Plane, carry-on bag only</option><option value="plane">Plane, with a checked bag</option><option value="car">Car</option><option value="train">Train or bus</option></select></div>
    <div><label for="pkWash">Can you wash clothes?</label><select id="pkWash" data-nomemo>
      <option value="0">No laundry</option><option value="3">Yes, every 3 days</option><option value="5">Yes, every 5 days</option><option value="7">Yes, once a week</option></select></div>
  </div>
  <div class="fields">
    <div><label for="pkAd">Adults</label><input type="number" id="pkAd" data-nomemo min="0" max="20" step="1" value="1" inputmode="numeric"></div>
    <div><label for="pkKid">Children (2–12)</label><input type="number" id="pkKid" data-nomemo min="0" max="20" step="1" value="0" inputmode="numeric"></div>
    <div><label for="pkBaby">Babies (under 2)</label><input type="number" id="pkBaby" data-nomemo min="0" max="10" step="1" value="0" inputmode="numeric"></div>
  </div>
  <div class="btns"><button type="button" class="btn" id="pkMake">Make my packing list</button></div>
</fieldset>

<div class="pk-bar">
  <div><label for="pkLists">My lists</label><select id="pkLists" data-nomemo></select></div>
  <button type="button" class="btn ghost" id="pkSaveAs">Save as new list</button>
  <button type="button" class="btn ghost" id="pkRename">Rename</button>
  <button type="button" class="btn ghost danger" id="pkDel">Delete</button>
</div>
<p class="pk-sum" id="pkSum" aria-live="polite"></p>
<div class="pk-prog" aria-hidden="true"><i id="pkProg"></i></div>
<ul class="pk-notes" id="pkNotes"></ul>
<div class="checks"><label><input type="checkbox" id="pkHide" data-nomemo> Hide packed items</label></div>
<div id="pkOut"></div>

<fieldset style="margin-top:16px"><legend>Add your own item</legend>
  <div class="pk-add">
    <div class="wide"><label for="pkNew">Item</label><input type="text" id="pkNew" data-nomemo maxlength="80" placeholder="e.g. Travel pillow"></div>
    <div><label for="pkNewQ">How many</label><input type="number" id="pkNewQ" data-nomemo min="1" max="999" value="1" inputmode="numeric"></div>
    <div><label for="pkNewCat">Group</label><select id="pkNewCat" data-nomemo></select></div>
    <button type="button" class="btn" id="pkAdd">Add</button>
  </div>
</fieldset>

<div class="btns">
  <button type="button" class="btn" id="pkPdf">Print / PDF</button>
  <button type="button" class="btn ghost" id="pkShare">Share as text</button>
  <a class="btn ghost" id="pkWa" href="#" target="_blank" rel="noopener">WhatsApp</a>
  <button type="button" class="btn ghost" id="pkUntick">Untick all</button>
</div>
<details>
  <summary>Backup and more</summary>
  <div class="fields"><div><label for="pkPaper">Paper size</label><select id="pkPaper" data-nomemo><option value="a4">A4</option><option value="letter">US Letter</option></select></div></div>
  <div class="btns">
    <button type="button" class="btn ghost" id="pkTxt">Download as text</button>
    <button type="button" class="btn ghost" id="pkCsv">Download CSV</button>
    <button type="button" class="btn ghost" id="pkBackup">Export all lists (JSON)</button>
    <button type="button" class="btn ghost" id="pkImportBtn">Import lists</button>
    <input type="file" id="pkImport" data-nomemo accept="application/json,.json" hidden>
  </div>
</details>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<a id="dl" hidden></a>
</div>
<script>
(function () {

  // @LK-START (shared list helpers: storage, dates, money, files, PDF)

      try {

    var my = y - 46;

          need(16);
          [rows[i], rows[i + 1]].forEach(function (r, j) { if (!r) return; var x = M + j * cw; txt(r[0], x, y - 10, 9, R, mute); var lw = Math.max(90, wid(r[0], 9, R) + 10); txt(r[1], x + lw, y - 10, fit(r[1], 9.5, Bf, cw - lw - 10), Bf); });

          y -= 22;
        };
        need(52); head();
        var trows = b.rows.length ? b.rows : [[b.empty || 'Nothing added yet.']];
        trows.forEach(function (r) {
          var bold = r.cls === 'fd-bold';
          var cells = r.map(function (v, i) { var c = b.cols[i] || b.cols[0], f = bold ? Bf : R; return c.a === 'r' ? [clean(v)] : wrap(v, 9.5, f, xs[i][1] - 12); });
          var h = Math.max.apply(null, cells.map(function (c) { return c.length; })) * 12.5 + 10;
          if (y - h < BOTTOM) { newPage(); head(); }
          var top = y - 15;
          cells.forEach(function (lines, i) {
            var c = b.cols[i] || b.cols[0], f = bold || (c.a === 'r' && i === b.cols.length - 1) ? Bf : R;
            if (c.a === 'r') rtxt(lines[0], xs[i][0] + xs[i][1] - 6, top, fit(lines[0], 9.5, f, xs[i][1] - 10), f);
            else lines.forEach(function (t, k) { txt(t, xs[i][0] + 6, top - k * 12.5, 9.5, f, null, xs[i][1] - 12); });
          });
          y -= h;
          page.drawLine({ start: { x: M, y: y }, end: { x: M + W, y: y }, thickness: .6, color: line });
        });

      } else if (b.kind === 'totals') {
        need(b.rows.length * 17 + 16);

          y -= big ? 24 : 17;
        });
        y -= 8;
      } else if (b.kind === 'banner') {
        need(50); y -= 4;

  var docUrl = null;

  // ---------- dates, numbers, money (whole minor units, never floats) ----------

    ['Baby', 'Baby blanket and favourite toy', 'b', 1, function (x) { return x.B > 0; }],
    ['Baby', "Baby's medicines (if any)", 't', 1, function (x) { return x.B > 0; }],
    ['Children', 'Toys, books and games', 'k', 1, function (x) { return x.K > 0; }],
    ['Children', 'Car seat or booster seat', 'k', 1, function (x) { return x.K > 0 && x.car; }],
    ['Children', 'Comfort toy', 'k', 1, function (x) { return x.K > 0 && x.d > 1; }],
    ['For the journey', 'Snacks for the journey', 't', 1],

    ['For the journey', 'Neck pillow', 'p', 1, function (x) { return (x.fly || x.train) && x.d > 2; }],

    ['For the journey', 'Offline music, podcasts or films', 't', 1, function (x) { return x.car || x.train || x.fly; }],
    ['For the journey', 'Check tyres, oil and the spare wheel before you go', 't', 1, function (x) { return x.car; }],
    ['For the journey', 'Reusable shopping bag', 't', 1, function (x) { return x.d > 2; }],

  // ---------- state ----------

  function cleanParams(p) {

  }

  }
  st = cleanState(st);
  if (!st) { var first = { id: uid(), name: 'My packing list', made: false, params: cleanParams({}), notes: [], items: [] }; st = { cur: first.id, hide: false, paper: letterPaper() ? 'letter' : 'a4', lists: [first] }; }
  function cur() { for (var i = 0; i < st.lists.length; i++) if (st.lists[i].id === st.cur) return st.lists[i]; return st.lists[0]; }

  function int(id, lo, hi, label) {

    if (raw === '' || !(v >= lo) || v > hi || Math.round(v) !== v) { say('bad', label + ' must be a whole number from ' + lo + ' to ' + hi + '.'); $(id).focus(); return null; }
    return v;
  }

  // ---------- making the list ----------
  function make(p) {
    var d = p.days, L = +p.wash, carry = p.go === 'carry';
    var c = L ? Math.min(d, L) : Math.min(d, 14); if (carry) c = Math.min(c, 5);

      if (!n || !(q > 0)) return;
      var note = it[5] ? it[5](x) : '';
      if (who !== 't' && n > 1 && q > 0) note = (q + ' each') + (note ? ', ' + note : '');
      out.push({ id: uid(), cat: it[0], name: it[1], qty: q * n, note: note, done: false, own: false });
    });
    var notes = [];

    if (x.mixed) notes.push('Mixed weather: pack thin layers you can add or remove instead of one heavy coat.');
    if (B && d > 4) notes.push('Nappies are counted for 4 days. They are sold almost everywhere, so buy more when you arrive.');

  }
  function tripName(p) {

  }
  $('pkMake').addEventListener('click', function () {

    if (!ad && !kid && !baby) { say('bad', 'Add at least one traveller.'); $('pkAd').focus(); return; }

    var L = cur(), r = make(p), old = {};
    L.items.forEach(function (it) { if (!it.own) old[it.name] = it; });
    r.items.forEach(function (it) { var o = old[it.name]; if (o) it.done = o.done; });
    L.items = r.items.concat(L.items.filter(function (it) { return it.own; }));
    var auto = !L.name || L.name === 'My packing list' || (L.params && L.name === tripName(L.params));

    $('pkSum').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---------- showing the list ----------
  function fillLists() {
    $('pkLists').innerHTML = st.lists.map(function (l) { var n = l.items.length, dn = l.items.filter(function (i) { return i.done; }).length; return '<option value="' + esc(l.id) + '">' + esc(l.name) + ' (' + dn + '/' + n + ')</option>'; }).join('');
    $('pkLists').value = st.cur; $('pkDel').disabled = false;
    var cats = CATS.slice(); $('pkNewCat').innerHTML = cats.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join(''); $('pkNewCat').value = 'My items';

  function render() {

    CATS.forEach(function (c) {
      var g = items.filter(function (i) { return i.cat === c; }); if (!g.length) return;
      var gd = g.filter(function (i) { return i.done; }).length, show = st.hide ? g.filter(function (i) { return !i.done; }) : g;

          '<div class="pk-q"><button type="button" data-a="m" aria-label="One fewer ' + esc(i.name) + '">−</button><b>' + i.qty + '</b><button type="button" data-a="p" aria-label="One more ' + esc(i.name) + '">+</button></div>' +
          '<button type="button" class="pk-x" data-a="x" aria-label="Remove ' + esc(i.name) + '">×</button></li>';

    $('pkWa').href = waUrl(asText());
  }
  function find(id) { var L = cur(); for (var i = 0; i < L.items.length; i++) if (L.items[i].id === id) return L.items[i]; return null; }
  $('pkOut').addEventListener('change', function (e) {
    var li = e.target.closest('li'); if (!li || e.target.type !== 'checkbox') return;
    var it = find(li.dataset.id); if (!it) return; it.done = e.target.checked; save();

  });
  $('pkOut').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var li = b.closest('li'), it = li && find(li.dataset.id); if (!it) return;
    if (b.dataset.a === 'p') it.qty = Math.min(9999, it.qty + 1);

    if (b.dataset.a !== 'x') { var nb = $('pkOut').querySelector('li[data-id="' + it.id + '"] button[data-a="' + b.dataset.a + '"]'); if (nb) nb.focus(); }
  });
  $('pkHide').addEventListener('change', function () { st.hide = this.checked; save(); render(); });
  $('pkPaper').addEventListener('change', function () { st.paper = this.value; save(); });
  $('pkAdd').addEventListener('click', function () {

    var L = cur(); if (L.items.length >= 1000) return say('bad', 'A list can have up to 1,000 items.');
    var dup = L.items.filter(function (i) { return i.name.toLowerCase() === name.toLowerCase(); })[0];
    if (dup) { dup.qty = Math.min(9999, dup.qty + Math.round(q)); say('ok', '"' + dup.name + '" was already on the list, so its number went up to ' + dup.qty + '.'); }
    else { L.items.push({ id: uid(), cat: $('pkNewCat').value, name: name.slice(0, 120), qty: Math.round(q), note: '', done: false, own: true }); say('ok', 'Added "' + name + '".'); }
    $('pkNew').value = ''; $('pkNewQ').value = 1; save(); render(); fillLists(); $('pkNew').focus();
  });
  $('pkNew').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('pkAdd').click(); } });

  // ---------- saved lists ----------
  $('pkLists').addEventListener('change', function () { st.cur = this.value; save(); toForm(cur().params); render(); say('', 'Showing "' + cur().name + '".'); });
  $('pkSaveAs').addEventListener('click', function () {
    var L = cur(), name = prompt('Name for the new list:', L.name + ' (copy)'); if (name == null) return; name = name.trim().slice(0, 60) || 'My packing list';
    if (st.lists.length >= 100) return say('bad', 'You can keep up to 100 lists. Delete one first.');
    var c = JSON.parse(JSON.stringify(L)); c.id = uid(); c.name = name; c.items.forEach(function (i) { i.id = uid(); });
    st.lists.push(c); st.cur = c.id; save(); fillLists(); render(); say('ok', 'Saved as "' + name + '". Your earlier list is still in My lists.');
  });
  $('pkRename').addEventListener('click', function () { var L = cur(), name = prompt('New name for this list:', L.name); if (name == null || !name.trim()) return; L.name = name.trim().slice(0, 60); save(); fillLists(); say('ok', 'Renamed.'); });
  $('pkDel').addEventListener('click', function () {
    var L = cur(); if (!confirm('Delete the list "' + L.name + '"? This cannot be undone.')) return;
    st.lists = st.lists.filter(function (x) { return x !== L; });
    if (!st.lists.length) st.lists.push({ id: uid(), name: 'My packing list', made: false, params: cleanParams(L.params), notes: [], items: [] });
    st.cur = st.lists[0].id; save(); fillLists(); toForm(cur().params); render(); say('ok', 'Deleted "' + L.name + '".');
  });
  $('pkUntick').addEventListener('click', function () { var L = cur(), n = 0; L.items.forEach(function (i) { if (i.done) n++; i.done = false; }); save(); render(); fillLists(); say('ok', n ? 'Unticked ' + n + ' items, ready to pack again.' : 'Nothing was ticked.'); });

  // ---------- text, share, files ----------
  function asText() {
    var L = cur(), out = [L.name || 'Packing list'];
    CATS.forEach(function (c) { var g = L.items.filter(function (i) { return i.cat === c; }); if (!g.length) return; out.push('', c.toUpperCase()); g.forEach(function (i) { out.push((i.done ? '☑ ' : '☐ ') + i.name + (i.qty !== 1 ? ' × ' + i.qty : '') + (i.note ? ' (' + i.note + ')' : '')); }); });

  }
  function needItems() { if (!cur().items.length) { say('bad', 'The list is empty. Make a list or add items first.'); return false; } return true; }

  $('pkWa').addEventListener('click', function (e) { if (!cur().items.length) { e.preventDefault(); needItems(); } else this.href = waUrl(asText()); });

  $('pkCsv').addEventListener('click', function () {
    if (!needItems()) return;
    var rows = [['Group', 'Item', 'Quantity', 'Note', 'Packed']]; cur().items.forEach(function (i) { rows.push([i.cat, i.name, i.qty, i.note, i.done ? 'yes' : 'no']); });

      var ids = {}; st.lists.forEach(function (l) { ids[l.id] = l; }); var added = 0, upd = 0;
      got.forEach(function (l) { if (ids[l.id]) { Object.assign(ids[l.id], l); upd++; } else if (st.lists.length < 100) { st.lists.push(l); added++; } });
      st.lists = st.lists.filter(function (l) { return l.made || l.items.length || st.lists.length === 1; });
      if (!st.lists.some(function (l) { return l.id === st.cur; })) st.cur = st.lists[0].id;
      st.cur = got[0].id; save(); fillLists(); toForm(cur().params); render();
      say('ok', 'Imported ' + got.length + (got.length === 1 ? ' list' : ' lists') + ' (' + added + ' new, ' + upd + ' updated).');
    }, function () { say('bad', 'That file could not be read.'); });
  });
  $('pkPdf').addEventListener('click', function () {
    if (!needItems()) return;
    var L = cur(), p = L.params, blocks = [];
    CATS.forEach(function (c) { var g = L.items.filter(function (i) { return i.cat === c; }); if (g.length) blocks.push({ kind: 'checks', title: c, two: true, rows: g.map(function (i) { return [i.name + (i.note ? ' (' + i.note + ')' : ''), i.qty !== 1 ? '× ' + i.qty : '', i.done]; }) }); });
    if ((L.notes || []).length) blocks.push({ kind: 'note', title: 'Notes', text: L.notes.join('\n') });

  });

})();
