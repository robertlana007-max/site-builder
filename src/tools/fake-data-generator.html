<style>
.fdg-fields { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 10px; }
.fdg-row { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 8px; align-items: center; }
.fdg-row input, .fdg-row select { min-width: 0; }
.fdg-row button { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); cursor: pointer; font-size: 18px; }

  function seeded(str) { var h = 1779033703 ^ str.length; for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } var a = h >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function cryptoRnd() { var buf = new Uint32Array(1024), i = 1024; return function () { if (i >= 1024) { crypto.getRandomValues(buf); i = 0; } return buf[i++] / 4294967296; }; }
  function int(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function pattern(p) { return p.replace(/[#A]/g, function (c) { return c === '#' ? String(int(0, 9)) : String.fromCharCode(65 + int(0, 25)); }); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function iso(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function ascii(s) { return s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/ß/g, 'ss').replace(/ø/g, 'o').replace(/ı/g, 'i').toLowerCase().replace(/[^a-z0-9]+/g, ''); }

  // One made-up person per row, so name, email and username match each other.
  function person(loc) {
    var d = D[loc], fem = rnd() < 0.5, first = pick(fem ? d.f : d.m), s1 = pick(d.s), last = { n: s1.n, l: s1.l };
    if (d.two) { var s2 = pick(d.s); if (s2.n !== s1.n) last = { n: s1.n + ' ' + s2.n, l: s1.l }; }
    if (d.femSuffix && fem) last = { n: last.n + d.femSuffix, l: last.l + 'a' };
    var full = d.familyFirst ? last.n + (d.noSpace ? '' : ' ') + first.n : first.n + ' ' + last.n;
    var fl = ascii(first.l), ll = ascii(last.l), sep = pick(['.', '_', '', '.']);
    var user = pick([fl + sep + ll, fl.charAt(0) + ll, fl + ll.charAt(0), ll + sep + fl]) + (rnd() < 0.6 ? int(1, 99) : '');
    var city = pick(d.c), n = int(1, 199);
    var street = d.addr.replace('{st}', pick(d.st).n).replace('{n}', n).replace('{n2}', int(1, 30)).replace('{n3}', int(1, 20));
    var pc = pattern(d.pc);
    var addrFull = loc === 'ja-JP' ? '〒' + pc + ' ' + city.n + street : loc === 'zh-CN' ? city.n + street + ' ' + pc : loc === 'en-US' ? street + ', ' + city.n + ' ' + pc : loc === 'en-GB' || loc === 'en-IN' ? street + ', ' + city.n + ' ' + pc : loc === 'ar-EG' ? street + '، ' + city.n + ' ' + pc : street + ', ' + pc + ' ' + city.n;
    var co = d.coFirst || loc === 'zh-CN' ? (loc === 'ja-JP' || loc === 'zh-CN' ? (loc === 'ja-JP' ? d.co[0] + pick(d.s).n + pick(['商事', '工業', '電機', '物産']) : pick(d.s).n + pick(['华', '鑫', '腾', '盛']) + pick(['科技', '贸易', '实业']) + '有限公司') : pick(d.co) + ' ' + pick(d.s).n + ' ' + pick(['Mandiri', 'Sejahtera', 'Group', 'Trading'])) : pick(d.s).n + ' ' + pick(d.co);
    if (loc === 'ru-RU') co = pick(d.co) + ' «' + pick(['Север', 'Альфа', 'Восток', 'Прогресс', 'Вектор']) + '»';
    if (loc === 'ar-EG') co = pick(['شركة النيل', 'شركة الأمل', 'شركة المستقبل', 'شركة الهرم']) + ' ' + pick(d.co);
    return { first: first.n, last: last.n, full: full, gender: fem ? 'female' : 'male', email: user.replace(/\d+$/, '') + (rnd() < 0.5 ? int(1, 99) : '') + '@' + pick(['example.com', 'example.org', 'example.net']), username: user, phone: pattern(d.ph), street: street, city: city.n, postcode: pc, country: d.country, ccode: d.cc, address: addrFull, company: co, slug: fl };
  }
  // the same birth date for a row's date of birth and age columns
  function dob(p, now) { if (!p._dob) p._dob = new Date(now - (18 * 365.25 + rnd() * 62 * 365.25) * 864e5); return p._dob; }
  var COLNAME = { id: 'id', uuid: 'uuid', first: 'first_name', last: 'last_name', full: 'full_name', gender: 'gender', email: 'email', username: 'username', password: 'password', phone: 'phone', street: 'street', city: 'city', postcode: 'postcode', country: 'country', ccode: 'country_code', address: 'address', company: 'company', job: 'job_title', dob: 'birth_date', age: 'age', date: 'date', datetime: 'created_at', int: 'number', price: 'price', bool: 'active', ip: 'ip_address', ipv6: 'ipv6_address', url: 'url', color: 'color', lat: 'latitude', lng: 'longitude', sentence: 'note' };
  function value(type, p, i, now) {
    switch (type) {
      case 'id': return i + 1;
      case 'uuid': var h = []; for (var k = 0; k < 16; k++) h.push(int(0, 255)); h[6] = (h[6] & 15) | 64; h[8] = (h[8] & 63) | 128; var x = h.map(function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join(''); return x.slice(0, 8) + '-' + x.slice(8, 12) + '-' + x.slice(12, 16) + '-' + x.slice(16, 20) + '-' + x.slice(20);
      case 'password': var cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?', pw = ''; for (var j = 0; j < 14; j++) pw += cs.charAt(int(0, cs.length - 1)); return pw;
      case 'dob': return iso(dob(p, now));
      case 'age': var b = dob(p, now), t = new Date(now), y = t.getUTCFullYear() - b.getUTCFullYear(); if (t.getUTCMonth() < b.getUTCMonth() || (t.getUTCMonth() === b.getUTCMonth() && t.getUTCDate() < b.getUTCDate())) y--; return y; // age in whole years, as on a calendar
      case 'date': return iso(new Date(now - rnd() * 730 * 864e5));
      case 'datetime': return new Date(now - rnd() * 730 * 864e5).toISOString().replace(/\.\d+Z$/, 'Z');
      case 'int': return int(1, 1000);
      case 'price': return +(int(99, 99999) / 100).toFixed(2);
      case 'bool': return rnd() < 0.5;
      case 'ip': return pick(['192.0.2.', '198.51.100.', '203.0.113.']) + int(1, 254);
      case 'ipv6': return '2001:db8:' + [int(0, 65535), int(0, 65535), int(0, 65535), int(0, 65535), int(0, 65535), int(1, 65535)].map(function (v) { return v.toString(16); }).join(':');
      case 'url': return 'https://www.' + pick(['example.com', 'example.org', 'example.net']) + '/' + pick(['blog', 'shop', 'news', 'products', 'about', 'docs']) + '/' + (p.slug || 'page') + '-' + int(1, 999);
      case 'color': return '#' + ('00000' + int(0, 0xFFFFFF).toString(16)).slice(-6);
      case 'lat': return +(rnd() * 180 - 90).toFixed(6);
      case 'lng': return +(rnd() * 360 - 180).toFixed(6);
      case 'job': return pick(JOBS);
      case 'sentence': var n = int(5, 12), w = []; for (var q = 0; q < n; q++) w.push(pick(WORDS)); var s = w.join(' '); return s.charAt(0).toUpperCase() + s.slice(1) + '.';
      default: return p[type];
    }
  }

  // ---- column editor ----
  function addRow(type, name) {
    var row = document.createElement('div'); row.className = 'fdg-row';
    row.innerHTML = '<select aria-label="Data type">' + TYPES.map(function (t) { return '<option value="' + t[0] + '"' + (t[0] === type ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') + '</select><input type="text" aria-label="Column name" maxlength="64" spellcheck="false"><button type="button" aria-label="Remove column" title="Remove column">×</button>';
    row.querySelector('input').value = name;
    row.querySelector('select').addEventListener('change', function () { var inp = row.querySelector('input'); if (!inp.dataset.touched) inp.value = COLNAME[this.value] || this.value; save(); });
    row.querySelector('input').addEventListener('input', function () { this.dataset.touched = 1; save(); });
    row.querySelector('button').addEventListener('click', function () { if ($('fdFields').children.length > 1) { row.remove(); save(); } else say('', 'Keep at least one column.'); });
    $('fdFields').appendChild(row);
  }
  function cols() { return [].map.call($('fdFields').children, function (r) { return [r.querySelector('select').value, r.querySelector('input').value.trim() || r.querySelector('select').value]; }); }
  function save() { try { localStorage.setItem('gtn-fake-cols', JSON.stringify(cols())); } catch (e) {} }
  function load() { var c = null; try { c = JSON.parse(localStorage.getItem('gtn-fake-cols')); } catch (e) {} if (!Array.isArray(c) || !c.length) c = DEFAULT; $('fdFields').innerHTML = ''; c.forEach(function (x) { if (Array.isArray(x) && TYPES.some(function (t) { return t[0] === x[0]; })) addRow(x[0], String(x[1])); }); if (!$('fdFields').children.length) DEFAULT.forEach(function (x) { addRow(x[0], x[1]); }); }

  // ---- output ----
  function csvCell(v) { var s = String(v); return /[",\n\r]/.test(s) || /^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function sqlId(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
  function sqlVal(v) { return typeof v === 'number' ? String(v) : typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : "'" + String(v).replace(/'/g, "''") + "'"; }
  var last = '', ext = 'csv';
  function say(cls, t) { $('fdMsg').className = 'msg ' + cls; $('fdMsg').textContent = t; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function generate() {
    var n = Math.floor(+$('fdRows').value);
    if (!(n >= 1)) return say('bad', 'Enter how many rows you need (1 to 10,000).');
    if (n > 10000) { n = 10000; $('fdRows').value = 10000; }
    var c = cols(), names = c.map(function (x) { return x[1]; }), seed = $('fdSeed').value.trim();
    var dup = names.filter(function (x, i) { return names.indexOf(x) !== i; });
    if (dup.length) return say('bad', 'Two columns are both called “' + dup[0] + '”. Give each column its own name.');
    rnd = seed ? seeded(seed) : cryptoRnd();
    var now = seed ? Date.UTC(2026, 0, 1) : Date.now(), loc = $('fdLoc').value, locs = Object.keys(D), rows = [];
    for (var i = 0; i < n; i++) { var p = person(loc === 'mix' ? pick(locs) : loc), r = []; for (var j = 0; j < c.length; j++) r.push(value(c[j][0], p, i, now)); rows.push(r); }
    data = { rows: rows, names: names, n: n, seed: seed };
    render();
  }
  // Write the generated rows in the chosen format (changing the format or table name keeps the same rows).
  var data = null;
  function render() {
    if (!data) return;
    var rows = data.rows, names = data.names, n = data.n, seed = data.seed, fmt = $('fdFmt').value, out;
    if (fmt === 'csv') { out = '\ufeff' + names.map(csvCell).join(',') + '\r\n' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n'; ext = 'csv'; }
    else if (fmt === 'json' || fmt === 'jsonl') {
      var objs = rows.map(function (r) { var o = {}; names.forEach(function (k, j) { o[k] = r[j]; }); return o; });
      out = fmt === 'json' ? JSON.stringify(objs, null, 2) + '\n' : objs.map(function (o) { return JSON.stringify(o); }).join('\n') + '\n'; ext = fmt === 'json' ? 'json' : 'jsonl';
    } else {
      var t = $('fdTable').value.trim() || 'people', head = 'INSERT INTO ' + sqlId(t) + ' (' + names.map(sqlId).join(', ') + ') VALUES\n', parts = [];
      for (var b = 0; b < rows.length; b += 500) parts.push(head + rows.slice(b, b + 500).map(function (r) { return '  (' + r.map(sqlVal).join(', ') + ')'; }).join(',\n') + ';');
      out = parts.join('\n\n') + '\n'; ext = 'sql';
    }
    last = out;
    $('fdOut').value = out.length > 2000000 ? out.slice(0, 2000000).replace(/^\ufeff/, '') + '\n… (preview cut here; Copy and Download include everything)' : out.replace(/^\ufeff/, '');
    $('fdPrev').hidden = false;
    $('fdPrev').innerHTML = '<table><thead><tr>' + names.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.slice(0, 8).map(function (r) { return '<tr>' + r.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
    say('ok', 'Generated ' + fmtNum(n) + ' row' + (n === 1 ? '' : 's') + ' (' + fmtBytes(new Blob([out]).size) + '). All people are made up; emails use the reserved example.com domains' + (seed ? '; the same seed gives the same data.' : '.'));
  }
  $('fdAdd').addEventListener('click', function () { if ($('fdFields').children.length >= 40) return say('', 'That is the maximum of 40 columns.'); var used = cols().map(function (c) { return c[0]; }), next = TYPES.filter(function (t) { return used.indexOf(t[0]) === -1; })[0] || TYPES[0]; addRow(next[0], COLNAME[next[0]]); save(); });
  $('fdReset').addEventListener('click', function () { $('fdFields').innerHTML = ''; DEFAULT.forEach(function (x) { addRow(x[0], x[1]); }); save(); });
  $('fdGo').addEventListener('click', generate);
  $('fdFmt').addEventListener('change', render);
  $('fdTable').addEventListener('input', function () { if ($('fdFmt').value === 'sql') render(); });
  $('fdCp').addEventListener('click', function () { if (!last) return say('', 'Press Generate first.'); copyText(last.replace(/^\ufeff/, ''), $('fdCp')); });
  $('fdDl').addEventListener('click', function () {
    if (!last) return say('', 'Press Generate first.');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([last], { type: { csv: 'text/csv', json: 'application/json', jsonl: 'application/x-ndjson', sql: 'application/sql' }[ext] + ';charset=utf-8' })); a.download = 'fake-data.' + ext;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });
  load();
  // Start with the visitor's own country or language when it is in the list (a saved choice still wins).
  try {
    var want = (navigator.languages || [navigator.language || '']).map(String), opts = [].map.call($('fdLoc').options, function (o) { return o.value; });
    want.some(function (l) {
      var exact = opts.filter(function (v) { return v.toLowerCase() === l.toLowerCase(); })[0];
      var lang = opts.filter(function (v) { return v.split('-')[0] === l.split('-')[0].toLowerCase(); })[0];
      if (exact || lang) { $('fdLoc').value = exact || lang; return true; }
      return false;
    });
  } catch (e) {}
})();
</script>
