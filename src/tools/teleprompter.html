<style>
.tp-script { width: 100%; min-height: 220px; resize: vertical; font: inherit; font-size: 16px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--field, var(--bg)); color: var(--ink); }
.tp-meta { font-size: 14px; color: var(--muted); margin: 6px 0 14px; }
.tp-range { display: flex; align-items: center; gap: 10px; }
.tp-range input { flex: 1; min-width: 0; accent-color: var(--accent); }
.tp-range output { min-width: 3.2em; text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }
.tp-go { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
.tp-go .btn { flex: 1 1 180px; min-height: 56px; font-size: 18px; }
.tp-stage { position: fixed; inset: 0; z-index: 2147483000; background: #000; color: #fff; overflow: hidden; display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
.tp-stage.open { display: block; }
.tp-cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tp-cam.selfie { transform: scaleX(-1); }
.tp-view { position: absolute; inset: 0; overflow: hidden; }
.tp-text { position: absolute; left: 0; right: 0; top: 0; margin: 0 auto; white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 600; will-change: transform; }
.tp-text.shade { text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 2px #000; }
.tp-guide { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid rgba(255,80,80,.75); pointer-events: none; }
.tp-guide::before, .tp-guide::after { content: ''; position: absolute; top: -9px; border: 8px solid transparent; }
.tp-guide::before { left: 0; border-left-color: rgba(255,80,80,.9); }
.tp-guide::after { right: 0; border-right-color: rgba(255,80,80,.9); }
.tp-count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30vmin; font-weight: 800; pointer-events: none; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
.tp-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 8px; background: rgba(0,0,0,.72); transition: opacity .3s; }
.tp-stage.quiet .tp-bar { opacity: 0; }
.tp-bar button { font: inherit; font-size: 15px; font-weight: 600; min-width: 44px; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
.tp-bar button.rec { border-color: #ef4444; }
.tp-bar button.rec.on { background: #ef4444; }
.tp-bar span { font-size: 14px; color: #ddd; font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
.tp-prog { position: absolute; left: 0; top: 0; height: 4px; background: rgba(255,255,255,.7); width: 0; }
.tp-recs { margin: 0 0 14px; }
.tp-recs a { margin: 0 8px 8px 0; }
</style>
<label for="script">Your script</label>
<textarea class="tp-script" id="script" data-nomemo placeholder="Paste or type what you want to say. Leave an empty line between paragraphs.">Welcome! This is your teleprompter.

Paste your own script here, then press Start.

Read the line at the red arrows. Tap the screen or press the space bar to pause, and use the arrow keys to go faster or slower.

Your script is saved in this browser only, so it is still here next time.</textarea>
<p class="tp-meta" id="meta"></p>
<div class="fields">
  <div><label for="speed">Scroll speed</label><div class="tp-range"><input type="range" id="speed" min="1" max="30" step="1" value="8"><output id="speedOut">8</output></div></div>
  <div><label for="size">Text size</label><div class="tp-range"><input type="range" id="size" min="20" max="140" step="2" value="56"><output id="sizeOut">56</output></div></div>
  <div><label for="width">Text width</label><div class="tp-range"><input type="range" id="width" min="40" max="100" step="5" value="85"><output id="widthOut">85%</output></div></div>
  <div><label for="lh">Line spacing</label><select id="lh"><option value="1.2">Tight</option><option value="1.45" selected>Normal</option><option value="1.8">Wide</option></select></div>
  <div><label for="theme">Colours</label><select id="theme"><option value="wb">White text on black</option><option value="yb">Yellow text on black</option><option value="bw">Black text on white</option></select></div>
  <div><label for="align">Alignment</label><select id="align"><option value="left">Left</option><option value="center">Centre</option></select></div>
  <div><label for="count">Countdown before it starts</label><select id="count"><option value="0">None</option><option value="3" selected>3 seconds</option><option value="5">5 seconds</option><option value="10">10 seconds</option></select></div>
  <div><label for="guide">Reading line</label><select id="guide"><option value="0.33">One third from the top</option><option value="0.5">Middle of the screen</option><option value="0.2">Near the top (close to the camera)</option><option value="-1">Hide</option></select></div>
</div>
<div class="checks">
  <label><input type="checkbox" id="mirror"> Mirror the text left to right (for a teleprompter glass)</label>
  <label><input type="checkbox" id="flip"> Flip the text upside down</label>
  <label><input type="checkbox" id="cam"> Show my camera behind the text and let me record myself</label>
</div>
<div class="tp-go"><button class="btn" type="button" id="start">▶ Start teleprompter</button></div>
<div class="tp-recs" id="recs"></div>
<p class="msg" id="msg">Keys while it runs: Space pause / play, ↑ ↓ speed, + − text size, M mirror, R record, Home back to the start, Esc close.</p>
<div class="tp-stage" id="stage" role="dialog" aria-label="Teleprompter">
  <video class="tp-cam" id="camv" playsinline muted autoplay hidden></video>
  <div class="tp-view" id="view"><div class="tp-text" id="text"></div></div>
  <div class="tp-guide" id="guideLine"></div>
  <div class="tp-prog" id="prog"></div>
  <div class="tp-count" id="countN" aria-live="assertive"></div>
  <div class="tp-bar" id="tbar">
    <button type="button" id="bPlay" aria-label="Pause or play">❚❚</button>
    <button type="button" id="bSlow" aria-label="Slower">−</button><span id="bSpeed">8</span><button type="button" id="bFast" aria-label="Faster">+</button>
    <button type="button" id="bSmall" aria-label="Smaller text">A−</button><button type="button" id="bBig" aria-label="Larger text">A+</button>
    <button type="button" id="bMirror" aria-label="Mirror text">⇋</button>
    <button type="button" id="bTop" aria-label="Back to the start">⤒</button>
    <button type="button" class="rec" id="bRec" hidden>● Rec</button>
    <span id="bTime"></span>
    <button type="button" id="bClose" aria-label="Close the teleprompter">✕ Close</button>
  </div>
</div>
<script src="../assets/vendor/fix-webm-duration/fix-webm-duration.js"></script>
<script>
(function () {
  var KEY = 'gtn-teleprompter-script', stage = $('stage'), txt = $('text'), view = $('view');
  var pos = 0, playing = false, last = 0, raf = 0, counting = 0, countT = 0, wake = null, hideT = 0;
  var stream = null, recorder = null, chunks = [], recT0 = 0, recN = 0;
  var HELP = $('msg').textContent;
  function say(c, t) { $('msg').className = 'msg ' + (c || ''); $('msg').textContent = t; }
  try { var saved = localStorage.getItem(KEY); if (saved) $('script').value = saved; } catch (e) {}
  function words(s) { var m = s.trim().match(/\S+/g); return m ? m.length : 0; }
  function meta() {
    var w = words($('script').value), mins = w / 140;
    $('meta').textContent = fmtNum(w, 0) + ' words · about ' + (mins < 1 ? Math.max(1, Math.round(mins * 60)) + ' seconds' : fmtNum(Math.round(mins * 10) / 10, 1) + ' minutes') + ' when spoken at a relaxed pace.';
  }
  var saveT = 0;
  $('script').addEventListener('input', function () { meta(); clearTimeout(saveT); saveT = setTimeout(function () { try { localStorage.setItem(KEY, $('script').value); } catch (e) {} }, 400); });
  function out() {
    $('speedOut').textContent = $('speed').value; $('bSpeed').textContent = $('speed').value;
    $('sizeOut').textContent = $('size').value; $('widthOut').textContent = $('width').value + '%';
  }
  ['speed', 'size', 'width'].forEach(function (id) { $(id).addEventListener('input', function () { out(); if (stage.classList.contains('open')) style(); }); });
  ['lh', 'theme', 'align', 'guide', 'mirror', 'flip'].forEach(function (id) { $(id).addEventListener('change', function () { if (stage.classList.contains('open')) style(); }); });

  // ---------- look ----------
  function guideY() { var g = +$('guide').value; return g < 0 ? 0.33 : g; }
  function style() {
    var th = $('theme').value, cam = !!stream;
    stage.style.background = th === 'bw' && !cam ? '#fff' : '#000';
    txt.style.color = th === 'yb' ? '#ffe14d' : th === 'bw' && !cam ? '#111' : '#fff';
    txt.classList.toggle('shade', cam);
    txt.style.fontSize = $('size').value + 'px'; txt.style.lineHeight = $('lh').value;
    txt.style.width = $('width').value + '%'; txt.style.textAlign = $('align').value;
    var t = [];
    if ($('mirror').checked) t.push('scaleX(-1)');
    if ($('flip').checked) t.push('scaleY(-1)');
    view.style.transform = t.join(' ');
    $('guideLine').hidden = +$('guide').value < 0;
    var gy = guideY() * stage.clientHeight;
    $('guideLine').style.top = ($('flip').checked ? stage.clientHeight - gy : gy) + 'px';
    place();
  }
  function maxPos() { return Math.max(0, txt.offsetHeight); }
  function place() {
    var top = guideY() * view.clientHeight; // the first line starts at the reading line
    txt.style.transform = 'translateY(' + (top - pos) + 'px)';
    var m = maxPos(); $('prog').style.width = (m ? Math.min(100, pos / m * 100) : 0) + '%';
    var pxs = speedPx(), left = pxs ? (m - pos) / pxs : 0;
    $('bTime').textContent = left > 0 ? Math.floor(left / 60) + ':' + ('0' + Math.floor(left % 60)).slice(-2) + ' left' : 'End';
  }
  function speedPx() { return +$('speed').value * (+$('size').value / 56) * 7; } // pixels per second, scaled with the text size

  // ---------- running ----------
  function frame(t) {
    raf = requestAnimationFrame(frame);
    var dt = last ? Math.min(0.1, (t - last) / 1000) : 0; last = t;
    if (counting) {
      var left = Math.ceil((countT - performance.now()) / 1000);
      if (left <= 0) { counting = 0; $('countN').textContent = ''; playing = true; } else $('countN').textContent = left;
    }
    if (playing) { pos += speedPx() * dt; if (pos >= maxPos()) { pos = maxPos(); playing = false; showBar(); } }
    $('bPlay').textContent = playing || counting ? '❚❚' : '▶';
    place();
  }
  function play() {
    if (pos >= maxPos()) pos = 0;
    var c = +$('count').value;
    if (c && pos === 0) { counting = 1; countT = performance.now() + c * 1000; } else playing = true;
    quietSoon();
  }
  function pause() { playing = false; counting = 0; $('countN').textContent = ''; showBar(); }
  function toggle() { if (playing || counting) pause(); else play(); }
  function showBar() { stage.classList.remove('quiet'); clearTimeout(hideT); }
  function quietSoon() { showBar(); hideT = setTimeout(function () { if (playing || counting) stage.classList.add('quiet'); }, 2500); }
  function open() {
    var s = $('script').value;
    if (!s.trim()) { say('bad', 'Type or paste your script first.'); $('script').focus(); return; }
    if (/bad/.test($('msg').className)) say('', HELP);
    txt.textContent = s.replace(/\r/g, '');
    pos = 0; playing = false; counting = 0; last = 0;
    stage.classList.add('open'); document.documentElement.style.overflow = 'hidden';
    var f = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (f) { try { var p = f.call(stage); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').then(function (l) { wake = l; }, function () {});
    style(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    if ($('cam').checked) startCam().then(function () { style(); play(); }); else play();
    $('bPlay').focus();
  }
  function close() {
    if (recorder) stopRec();
    cancelAnimationFrame(raf); playing = false; counting = 0; $('countN').textContent = '';
    stage.classList.remove('open', 'quiet'); document.documentElement.style.overflow = '';
    if (document.fullscreenElement || document.webkitFullscreenElement) { var x = document.exitFullscreen || document.webkitExitFullscreen; try { var p = x.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
    stopCam(); $('start').focus();
  }
  $('start').addEventListener('click', open);
  $('bClose').addEventListener('click', close);
  $('bPlay').addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
  function nudgeSpeed(d) { $('speed').value = Math.max(1, Math.min(30, +$('speed').value + d)); out(); }
  function nudgeSize(d) { var keep = maxPos() ? pos / maxPos() : 0; $('size').value = Math.max(20, Math.min(140, +$('size').value + d)); out(); style(); pos = keep * maxPos(); place(); }
  $('bSlow').addEventListener('click', function () { nudgeSpeed(-1); });
  $('bFast').addEventListener('click', function () { nudgeSpeed(1); });
  $('bSmall').addEventListener('click', function () { nudgeSize(-6); });
  $('bBig').addEventListener('click', function () { nudgeSize(6); });
  $('bMirror').addEventListener('click', function () { $('mirror').checked = !$('mirror').checked; style(); });
  $('bTop').addEventListener('click', function () { pos = 0; pause(); place(); });
  // tap the text to pause or play; drag (or scroll the wheel) to move by hand
  var down = null;
  view.addEventListener('pointerdown', function (e) { down = { y: e.clientY, pos: pos, moved: false }; view.setPointerCapture(e.pointerId); showBar(); });
  view.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dy = e.clientY - down.y; if (Math.abs(dy) > 8) down.moved = true;
    if (down.moved) { pos = Math.max(0, Math.min(maxPos(), down.pos - dy * ($('flip').checked ? -1 : 1))); place(); }
  });
  view.addEventListener('pointerup', function () { if (down && !down.moved) toggle(); down = null; });
  view.addEventListener('pointercancel', function () { down = null; });
  stage.addEventListener('wheel', function (e) { e.preventDefault(); pos = Math.max(0, Math.min(maxPos(), pos + e.deltaY)); place(); showBar(); }, { passive: false });
  stage.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') { showBar(); if (playing) quietSoon(); } });
  document.addEventListener('keydown', function (e) {
    if (!stage.classList.contains('open') || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, h = true;
    if (k === ' ' || k === 'Enter' && e.target === document.body) toggle();
    else if (k === 'ArrowUp') nudgeSpeed(1);
    else if (k === 'ArrowDown') nudgeSpeed(-1);
    else if (k === '+' || k === '=') nudgeSize(6);
    else if (k === '-' || k === '_') nudgeSize(-6);
    else if (k === 'm' || k === 'M') { $('mirror').checked = !$('mirror').checked; style(); }
    else if (k === 'r' || k === 'R') { if (stream) $('bRec').click(); }
    else if (k === 'Home') { pos = 0; pause(); place(); }
    else if (k === 'PageDown') { pos = Math.min(maxPos(), pos + view.clientHeight * 0.6); place(); }
    else if (k === 'PageUp') { pos = Math.max(0, pos - view.clientHeight * 0.6); place(); }
    else if (k === 'Escape') close();
    else h = false;
    if (h) { e.preventDefault(); showBar(); if (playing) quietSoon(); }
  });
  document.addEventListener('fullscreenchange', function () { if (stage.classList.contains('open')) style(); });
  window.addEventListener('resize', function () { if (stage.classList.contains('open')) style(); });

  // ---------- camera and recording ----------
  var md = navigator.mediaDevices;
  function camWhy(e) {
    var n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') return 'Camera access was blocked, so the teleprompter runs without the camera. To record yourself, allow the camera and microphone next to the web address and start again.';
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'No camera was found, so the teleprompter runs without it.';
    if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError') return 'The camera is busy (another app may be using it), so the teleprompter runs without it.';
    return 'The camera could not start, so the teleprompter runs without it.';
  }
  function startCam() {
    if (!window.isSecureContext || !md || !md.getUserMedia) { say('bad', 'This browser cannot use the camera here, so the teleprompter runs without it.'); return Promise.resolve(); }
    var v = { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } };
    return md.getUserMedia({ video: v, audio: { echoCancellation: true, noiseSuppression: true } }).catch(function () { return md.getUserMedia({ video: v }); }).then(function (s) {
      if (!stage.classList.contains('open')) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s; var cv = $('camv'); cv.srcObject = s; cv.hidden = false; cv.classList.add('selfie');
      var p = cv.play(); if (p && p.catch) p.catch(function () {});
      $('bRec').hidden = !window.MediaRecorder;
      if (!window.MediaRecorder) say('bad', 'This browser can show the camera but cannot record video.');
    }, function (e) { say('bad', camWhy(e)); });
  }
  function stopCam() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null; $('camv').srcObject = null; $('camv').hidden = true; $('bRec').hidden = true;
  }
  $('bRec').addEventListener('click', function () {
    if (recorder) return stopRec();
    if (!stream) return;
    var types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'], type = '';
    for (var i = 0; i < types.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) { type = types[i]; break; }
    try { recorder = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream); } catch (e) { recorder = null; return say('bad', 'Recording could not start in this browser.'); }
    chunks = [];
    recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      var mime = recorder.mimeType || type || 'video/webm', ms = Date.now() - recT0, blob = new Blob(chunks, { type: mime }); recorder = null; chunks = [];
      $('bRec').classList.remove('on'); $('bRec').textContent = '● Rec';
      if (!blob.size) return say('bad', 'The recording was empty. Try again.');
      var mp4 = /mp4/.test(mime), ready = !mp4 && window.ysFixWebmDuration ? ysFixWebmDuration(blob, ms, { logger: false }).catch(function () { return blob; }) : Promise.resolve(blob);
      ready.then(function (b) {
        recN++;
        var a = document.createElement('a'); a.className = 'btn ghost'; a.href = URL.createObjectURL(b);
        a.download = 'teleprompter-recording-' + recN + (mp4 ? '.mp4' : '.webm'); a.textContent = 'Download recording ' + recN + ' (' + fmtBytes(b.size) + ')';
        a.id = 'rec' + recN; $('recs').appendChild(a);
        say('ok', 'Recording ' + recN + ' is ready to download below the Start button (' + Math.round(ms / 1000) + ' s).');
      });
    };
    recorder.start(1000); recT0 = Date.now();
    $('bRec').classList.add('on'); $('bRec').textContent = '■ Stop rec';
    if (!playing && !counting) play();
  });
  function stopRec() { if (recorder && recorder.state !== 'inactive') { try { recorder.stop(); } catch (e) {} } }
  meta(); out();
})();
</script>
