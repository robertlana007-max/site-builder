<style>
.mq-set { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
.mq-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-bottom: 12px; }
.mq-modes button { font: inherit; font-size: 14px; font-weight: 600; min-height: 48px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.mq-modes button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mq-q { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: 12px 14px; margin-bottom: 10px; }
.mq-top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.mq-top b { color: var(--ink); }
.mq-top .sp { flex: 1; }
.mq-prompt { font-size: 19px; font-weight: 700; margin: 2px 0 8px; overflow-wrap: anywhere; }
.mq-flag { display: block; width: 168px; max-width: 60%; aspect-ratio: 4 / 3; object-fit: cover; border: 1px solid #c8ced8; border-radius: 6px; margin: 4px 0 10px; background: #fff; }
.mq-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mq-opts button { font: inherit; font-size: 15px; font-weight: 600; min-height: 48px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; overflow-wrap: anywhere; }
.mq-opts button:hover:not([disabled]) { border-color: var(--accent); }
.mq-opts button.ok { background: #0f7a4f; border-color: #0f7a4f; color: #fff; }
.mq-opts button.bad { background: #c62828; border-color: #c62828; color: #fff; }
.mq-opts button[disabled] { cursor: default; }
.mq-type { display: flex; gap: 8px; }
.mq-type input { flex: 1; min-width: 0; }
.mq-fb { min-height: 1.4em; margin: 8px 0 0; font-size: 15px; font-weight: 600; }
.mq-fb.ok { color: var(--ok); } .mq-fb.bad { color: var(--bad); }
.mq-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.mq-row .btn { min-height: 40px; padding: 6px 14px; }
.mq-mapwrap { position: relative; height: min(62vh, 520px); min-height: 280px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #cfe6f5; touch-action: none; user-select: none; -webkit-user-select: none; }
:root[data-theme="dark"] .mq-mapwrap { background: #16324a; }
.mq-map { width: 100%; height: 100%; display: block; cursor: grab; }
.mq-map.drag { cursor: grabbing; }
.mq-map { --land: #f3efe3; --edge: #8a8f99; --grat: rgba(40,80,120,.18); --dimland: #e2e0da; }
:root[data-theme="dark"] .mq-map { --land: #3b4352; --edge: #151a21; --grat: rgba(160,200,240,.14); --dimland: #262c36; }
.mq-map path { fill: var(--land); stroke: var(--edge); stroke-width: .7; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.mq-map path.grat { fill: none; stroke: var(--grat); }
.mq-map path.hov { fill: #ffe7a8; }
.mq-map path.dim { fill: var(--dimland); }
.mq-map path.q { fill: #ffb547; stroke: #7a4a00; stroke-width: 1.4; }
.mq-map path.ok { fill: #34c27c; stroke: #0d5c37; stroke-width: 1.4; }
.mq-map path.bad { fill: #ef6b6b; stroke: #7d1515; stroke-width: 1.4; }
.mq-map path.sel { fill: #8fb8ff; stroke: #1f4fb5; stroke-width: 1.4; }
.mq-map circle.mk { fill: none; stroke: #e65100; stroke-width: 2.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.mq-zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.mq-zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 700 20px/1 system-ui, sans-serif; cursor: pointer; box-shadow: var(--shadow); }
.mq-tip { position: absolute; left: 8px; bottom: 8px; right: 56px; pointer-events: none; font-size: 12.5px; color: #2b3440; background: rgba(255,255,255,.85); border-radius: 8px; padding: 4px 8px; width: fit-content; }
.mq-info { display: flex; gap: 12px; align-items: center; }
.mq-info img { width: 72px; aspect-ratio: 4 / 3; object-fit: cover; border: 1px solid #c8ced8; border-radius: 4px; flex: none; background: #fff; }
.mq-info p { margin: 2px 0; font-size: 14.5px; }
.mq-res { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: 16px; margin-top: 12px; }
.mq-res h3 { margin: 0 0 6px; }
.mq-res ul { margin: 8px 0 0; padding-inline-start: 20px; }
.mq-res li { margin: 3px 0; overflow-wrap: anywhere; }
.mq-hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
@media (max-width: 520px) { .mq-modes { grid-template-columns: 1fr 1fr; } .mq-prompt { font-size: 17px; } .mq-opts button { font-size: 14px; } .mq-mapwrap { height: 58vh; } }

    $('mqQ').innerHTML = '<p class="mq-prompt">' + (early ? 'Quiz ended.' : pct === 100 ? 'Perfect score! 🌍' : pct >= 70 ? 'Great work! 🎉' : 'Good try! Keep practising.') + '</p><p style="margin:0">You got <b>' + Q.right + ' of ' + n + '</b> right (' + pct + '%) in ' + fmtT(Q.time) + '.' + (isBest ? ' New best score!' : '') + '</p>';
    var r = $('mqRes'), h = '';
    if (Q.miss.length) {
      h = '<h3>Review your mistakes (' + Q.miss.length + ')</h3><ul>' + Q.miss.map(function (m) { return '<li><b>' + esc(m.q) + '</b>: the answer is <b>' + esc(m.right) + '</b>' + (m.you && m.you !== m.right ? ' (you said ' + esc(m.you) + ')' : '') + '</li>'; }).join('') + '</ul><div class="mq-row"><button type="button" class="btn" id="mqPractice">Practise these again</button><button type="button" class="btn ghost" id="mqAgain">New quiz</button></div>';
    } else h = '<h3>' + (n ? 'No mistakes!' : 'No questions answered.') + '</h3><div class="mq-row"><button type="button" class="btn" id="mqAgain">New quiz</button></div>';
    r.innerHTML = h; r.hidden = false; Q.missIdx = Q.miss.map(function (m) { return m.i; }).filter(function (v, k, a) { return a.indexOf(v) === k; });
    bestText(); if (!early && pct >= 70 && window.burst) burst($('mqQ').querySelector('.mq-prompt'));
    clearMarks(); Q.miss.forEach(function (m) { F[m.i].el.classList.add('bad'); }); home();
  }
  $('mq').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'mqNext') next();
    else if (b.id === 'mqSkip') answer(false, '');
    else if (b.id === 'mqStop') finish(true);
    else if (b.id === 'mqAgain') start();
    else if (b.id === 'mqPractice') { var m = Q && Q.missIdx; if (m && m.length) start(m); }
    else if (b.parentNode && b.parentNode.id === 'mqOpts' && Q && !Q.wait) { var v = b.getAttribute('data-v'); answer(v === Q.right1, v); }
  });

  // ---------- start ----------
  syncSetup(); intro(); size();
  fetch('../assets/vendor/world-atlas/countries-110m.json').then(function (r) { if (!r.ok) throw new Error('map'); return r.json(); }).then(function (topo) {
    build(topo); size(); dimOthers(); home(); intro();
  }).catch(function (e) { console.warn(e); $('mqTip').textContent = 'The map could not be loaded.'; $('mqQ').innerHTML = '<p class="mq-fb bad">Sorry, the map could not be loaded. If you are offline, open this page once while online so it is saved on your device, then try again.</p>'; });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (!ready) return; var cx = (W / 2 - V.x) / V.k, cy = (H / 2 - V.y) / V.k; size(); V.x = W / 2 - cx * V.k; V.y = H / 2 - cy * V.k; apply(); }, 120); });
})();
</script>
