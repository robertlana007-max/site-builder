<style>
.mc-mats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.mc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.mc-head h3 { margin: 0 8px 0 0; font-size: 18px; }
.mc-head select { width: auto; min-height: 38px; padding: 4px 8px; }
.mc-head span { color: var(--muted); }
.mc-grid { display: inline-grid; gap: 6px; padding: 8px 10px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 8px; }
.mc-grid input { width: 58px; min-height: 40px; padding: 6px 4px; text-align: center; font-family: var(--mono); font-size: 15px; }
.mc-grid input.bad { border-color: var(--bad); }
.mc-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mc-tools button { font-size: 13.5px; padding: 6px 10px; min-height: 36px; }
.mc-ops { margin-top: 18px; }
.mc-ops .btns { margin-top: 8px; }
.mc-ops .btn { padding: 8px 14px; min-height: 42px; }
.mc-k { display: inline-flex; align-items: center; gap: 6px; }
.mc-k input { width: 80px; min-height: 42px; text-align: center; font-family: var(--mono); }
.mc-out { margin-top: 18px; }
.mc-res { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
.mc-res .big { font-size: 26px; font-weight: 700; font-family: var(--mono); overflow-wrap: anywhere; }
.mc-res p { margin: 4px 0; }
.mx-t { border-collapse: separate; border-spacing: 0; margin: 6px 0; font-family: var(--mono); font-size: 14.5px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 6px; font-variant-numeric: tabular-nums; }
.mx-t td { padding: 3px 10px; text-align: end; white-space: nowrap; }
.mx-t td.bar { border-left: 1.5px dashed var(--muted); }
.mc-steps { margin: 10px 0 0; padding-inline-start: 22px; display: grid; gap: 8px; }
.mc-steps li { overflow-x: auto; }
.mc-steps b { display: block; font-size: 15px; }
.mc-sw { margin-top: 10px; }
@media (max-width: 480px) { .mc-grid { gap: 4px; padding: 6px; } .mc-grid input { width: 44px; font-size: 14px; padding: 4px 2px; } }
</style>

  <div>

  </div>
  <div>
    <div class="mc-head"><h3>Matrix B</h3><select id="br" data-nomemo aria-label="Rows of B"></select><span>×</span><select id="bc" data-nomemo aria-label="Columns of B"></select></div>
    <div class="scroll-x"><div class="mc-grid" id="gB"></div></div>

  </div>
</div>

</div>

        steps.push({ op: 'R' + (i + 1) + ' → R' + (i + 1) + (neg ? ' + ' : ' − ') + (isOne(fa) ? '' : paren(fmtv(fa)) + '·') + 'R' + (r + 1), M: snap() });

  }
  function isOne(v) { return v instanceof Q ? v.eq(Q(1)) : Math.abs(v - 1) < 1e-12; }
  function paren(s) { return /^[−-]|[\/ ]/.test(s) ? '(' + s + ')' : s; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  // A matrix as an HTML table with bracket sides; bar = column index where a dividing line goes (augmented matrices).
  function matHtml(M, fmtv, bar) {
    var h = '<table class="mx-t' + (bar != null ? ' aug' : '') + '"><tbody>';
    M.forEach(function (r) { h += '<tr>' + r.map(function (v, k) { return '<td' + (k === bar ? ' class="bar"' : '') + '>' + esc(fmtv(v)) + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table>';
  }
  var MAX = 6, size = { A: [3, 3], B: [3, 3] }, one = 'A', lastM = null;
  var start = { A: [['2', '1', '-1'], ['-3', '-1', '2'], ['-2', '1', '2']], B: [['1', '0', '2'], ['0', '1', '0'], ['3', '0', '1']] };
  ['ar', 'ac', 'br', 'bc'].forEach(function (id) { for (var i = 1; i <= MAX; i++) { var o = document.createElement('option'); o.value = o.textContent = i; $(id).appendChild(o); } $(id).value = 3; });
  function cells(t) { return [].slice.call($('g' + t).querySelectorAll('input')); }
  function current(t) { var r = size[t][0], c = size[t][1], cs = cells(t), out = []; for (var i = 0; i < r; i++) { out.push([]); for (var j = 0; j < c; j++) out[i].push(cs[i * c + j].value); } return out; }
  function build(t, vals) {
    var r = size[t][0], c = size[t][1], g = $('g' + t); g.innerHTML = ''; g.style.gridTemplateColumns = 'repeat(' + c + ', auto)';
    for (var i = 0; i < r; i++) for (var j = 0; j < c; j++) {
      var inp = document.createElement('input'); inp.type = 'text'; inp.setAttribute('data-nomemo', ''); inp.autocomplete = 'off'; inp.spellcheck = false; inp.inputMode = 'text';
      inp.setAttribute('aria-label', t + ' row ' + (i + 1) + ' column ' + (j + 1));

    }
  }
  function resize(t) { var old = current(t); size[t] = [+$(t.toLowerCase() + 'r').value, +$(t.toLowerCase() + 'c').value]; build(t, old); }
  ['A', 'B'].forEach(function (t) {
    $(t.toLowerCase() + 'r').addEventListener('change', function () { resize(t); });
    $(t.toLowerCase() + 'c').addEventListener('change', function () { resize(t); });
  });
  // Arrow keys and Enter move between cells
  ['gA', 'gB'].forEach(function (id) {
    $(id).addEventListener('keydown', function (e) {

      if (i < 0) return;

      else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) to = i + 1; else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) to = i - 1;

  });
  function setMatrix(t, rows) { size[t] = [rows.length, rows[0].length]; $(t.toLowerCase() + 'r').value = rows.length; $(t.toLowerCase() + 'c').value = rows[0].length; build(t, rows); }
  document.querySelectorAll('[data-a]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.dataset.t, r = size[t][0], c = size[t][1], v = [];
      for (var i = 0; i < r; i++) { v.push([]); for (var j = 0; j < c; j++) v[i].push(b.dataset.a === 'clear' ? '' : b.dataset.a === 'id' ? (i === j ? '1' : '0') : String(Math.floor(Math.random() * 19) - 9)); }
      build(t, v);
    });
  });
  $('swap').addEventListener('click', function () { var a = current('A'), b = current('B'); setMatrix('A', b); setMatrix('B', a); });
  function pick(t) { one = t; $('onA').setAttribute('aria-pressed', t === 'A'); $('onB').setAttribute('aria-pressed', t === 'B'); }
  $('onA').addEventListener('click', function () { pick('A'); }); $('onB').addEventListener('click', function () { pick('B'); });

  // ---------- reading and showing values ----------
  var decimalMode = false;
  function read(t) {
    var cs = cells(t), c = size[t][1], M = [], bad = null;
    cs.forEach(function (inp, k) {
      var i = Math.floor(k / c), s = inp.value.trim(), v;
      if (!M[i]) M[i] = [];
      if (!s) v = Q(0);
      else {
        try { v = nEval(mParse(s, [])); } catch (e) { if (!(e instanceof MathError)) throw e; inp.classList.add('bad'); if (!bad) bad = t + ' row ' + (i + 1) + ', column ' + (k % c + 1) + ': ' + e.message; v = Q(0); }

  }
  function fmtF(x) { if (!isFinite(x)) return '∞'; var r = parseFloat(x.toPrecision(8)); if (Math.abs(r) < 1e-12) return '0'; var a = Math.abs(r); return (a >= 1e10 || a < 1e-6 ? r.toExponential(5).replace(/\.?0+e/, 'e') : String(r)).replace('-', '−'); }
  function fv(v) { return !decimalMode && v instanceof Q ? v.toString().replace('-', '−') : fmtF(nF(v)); }
  function dims(M) { return M.length + '×' + M[0].length; }
  function show(main, steps, M, open) {
    var h = '<div class="mc-res">' + main + '</div>';
    if (steps && steps.length) h += '<details class="mc-sw"' + (open ? ' open' : '') + '><summary><b>Show the steps (' + steps.length + ')</b></summary><ol class="mc-steps">' + steps.join('') + '</ol></details>';
    $('out').innerHTML = h; lastM = M || null; $('resBtns').hidden = !M;
    $('out').setAttribute('data-answer', M ? M.map(function (r) { return r.map(fv).join('\t'); }).join('\n') : $('out').querySelector('.mc-res').textContent);
  }
  function st(op, M, bar) { return '<li><b>' + op + '</b>' + (M ? '<div class="scroll-x">' + matHtml(M, fv, bar) + '</div>' : '') + '</li>'; }
  function same(A, B, word) { if (A.length !== B.length || A[0].length !== B[0].length) throw new MathError(word + ' needs A and B to be the same size, but A is ' + dims(A) + ' and B is ' + dims(B) + '.'); }
  function mul(A, B) { return A.map(function (r) { return B[0].map(function (x, j) { return r.reduce(function (s, v, k) { return nAdd(s, nMul(v, B[k][j])); }, Q(0)); }); }); }
  function square(M, what) { if (M.length !== M[0].length) throw new MathError(what + ' only exists for square matrices, but ' + one + ' is ' + dims(M) + '.'); }

  // ---------- operations ----------
  var OPS = {
    add: function () { var A = read('A'), B = read('B'); same(A, B, 'A + B'); var R = A.map(function (r, i) { return r.map(function (v, j) { return nAdd(v, B[i][j]); }); }); show('<p>A + B =</p>' + matHtml(R, fv), ['<li>Add the entries in the same position: (A + B)ᵢⱼ = Aᵢⱼ + Bᵢⱼ</li>'], R); },
    sub: function () { var A = read('A'), B = read('B'); same(A, B, 'A − B'); var R = A.map(function (r, i) { return r.map(function (v, j) { return nSub(v, B[i][j]); }); }); show('<p>A − B =</p>' + matHtml(R, fv), ['<li>Subtract the entries in the same position: (A − B)ᵢⱼ = Aᵢⱼ − Bᵢⱼ</li>'], R); },
    mul: function () { prod(read('A'), read('B'), 'A', 'B'); },
    mulBA: function () { prod(read('B'), read('A'), 'B', 'A'); },
    scal: function () {
      var A = read('A'), ks = $('k').value.trim(), k;
      if (!ks) throw new MathError('Type a number for k.');
      try { k = nEval(mParse(ks, [])); } catch (e) { if (e instanceof MathError) throw new MathError('k: ' + e.message); throw e; }
      if (/[.e]/i.test(ks) || !(k instanceof Q)) decimalMode = true;
      var R = A.map(function (r) { return r.map(function (v) { return nMul(k, v); }); });
      show('<p>' + fv(k) + ' × A =</p>' + matHtml(R, fv), ['<li>Multiply every entry of A by ' + fv(k) + '.</li>'], R);
    },
    tr: function () { var M = read(one), R = M[0].map(function (x, j) { return M.map(function (r) { return r[j]; }); }); show('<p>' + one + 'ᵀ (' + dims(R) + ') =</p>' + matHtml(R, fv), ['<li>Rows become columns: (' + one + 'ᵀ)ᵢⱼ = ' + one + 'ⱼᵢ</li>'], R); },
    sq: function () { var M = read(one); square(M, one + '²'); var R = mul(M, M); show('<p>' + one + '² = ' + one + ' × ' + one + ' =</p>' + matHtml(R, fv), null, R); },
    det: function () {
      var M = read(one); square(M, 'A determinant'); var n = M.length, steps = [];
      if (n === 1) { show('<p>det(' + one + ') =</p><p class="big">' + fv(M[0][0]) + '</p>', null, null); return; }
      if (n === 2) steps.push('<li><b>For a 2×2 matrix, det = ad − bc</b>(' + fv(M[0][0]) + ')(' + fv(M[1][1]) + ') − (' + fv(M[0][1]) + ')(' + fv(M[1][0]) + ')</li>');
      var red = rowReduce(M, 0, fv, false), R = red.R, d = red.swaps % 2 ? Q(-1) : Q(1);
      steps.push(st('Start with ' + one, M));
      red.steps.forEach(function (s) { steps.push(st(s.op, s.M)); });
      if (red.rank < n) { steps.push('<li><b>A column has no pivot, so the matrix is singular</b>det = 0</li>'); d = Q(0); }
      else {
        for (var i = 0; i < n; i++) d = nMul(d, R[i][i]);
        steps.push('<li><b>Multiply the numbers on the diagonal' + (red.swaps ? ' and change the sign once for each row swap (' + red.swaps + ')' : '') + '</b>det = ' + (red.swaps % 2 ? '−' : '') + R.map(function (r, i) { return '(' + fv(r[i]) + ')'; }).join(' × ') + ' = ' + fv(d) + '</li>');
        steps.push('<li>Adding a multiple of one row to another does not change the determinant; swapping two rows flips its sign.</li>');
      }
      var dz = nIsZero(d, red.tol * 10);
      show('<p>det(' + one + ') =</p><p class="big">' + fv(dz ? 0 : d) + '</p>' + (!decimalMode && d instanceof Q && !d.isInt() ? '<p>≈ ' + fmtF(nF(d)) + '</p>' : '') + (dz ? '<p>The determinant is 0, so ' + one + ' has no inverse.</p>' : ''), steps, null);
    },
    inv: function () {
      var M = read(one); square(M, 'An inverse'); var n = M.length;
      var aug = M.map(function (r, i) { return r.concat(M.map(function (x, j) { return i === j ? Q(1) : Q(0); })); });
      var red = rowReduce(aug, n, fv), steps = [st('Write [' + one + ' | I]', aug, n)];
      red.steps.forEach(function (s) { steps.push(st(s.op, s.M, n)); });

      var R = red.R.map(function (r) { return r.slice(n); });

    },
    rref: function () {
      var M = read(one), red = rowReduce(M, 0, fv), steps = [st('Start with ' + one, M)];
      red.steps.forEach(function (s) { steps.push(st(s.op, s.M)); });
      if (!red.steps.length) steps.push('<li>No row operations are needed.</li>');
      show('<p>RREF(' + one + ') =</p>' + matHtml(red.R, fv) + '<p>Rank ' + red.rank + ' · pivot columns: ' + (red.pivots.length ? red.pivots.map(function (c) { return c + 1; }).join(', ') : 'none') + '</p>', steps, red.R, true);
    },
    rank: function () {
      var M = read(one), red = rowReduce(M, 0, fv), steps = [st('Start with ' + one, M)];
      red.steps.forEach(function (s) { steps.push(st(s.op, s.M)); });
      steps.push('<li><b>Count the rows that are not all zero</b>rank = ' + red.rank + '</li>');
      show('<p>rank(' + one + ') =</p><p class="big">' + red.rank + '</p><p>' + (red.rank === Math.min(M.length, M[0].length) ? 'Full rank.' : 'Not full rank (the most possible for ' + dims(M) + ' is ' + Math.min(M.length, M[0].length) + ').') + '</p>', steps, null);
    }

    show('<p>' + a + ' × ' + b + ' (' + dims(R) + ') =</p>' + matHtml(R, fv), ['<li>Each entry is a row of ' + a + ' times a column of ' + b + ', multiplied entry by entry and added up.</li>', '<li><b>For example, row 1 · column 1</b>' + ex + ' = ' + fv(R[0][0]) + '</li>'], R);
  }
  document.querySelectorAll('[data-op]').forEach(function (b) {
    b.addEventListener('click', function () {
      $('msg').className = 'msg'; $('msg').textContent = ''; decimalMode = false;
      document.querySelectorAll('.mc-grid input.bad').forEach(function (x) { x.classList.remove('bad'); });
      try { OPS[b.dataset.op](); }
      catch (e) {
        if (!(e instanceof MathError)) throw e;
        $('out').innerHTML = ''; $('out').removeAttribute('data-answer'); $('resBtns').hidden = true; lastM = null;
        $('msg').className = 'msg bad'; $('msg').textContent = e.message;
      }
    });
  });

  $('copy').addEventListener('click', function () { if (lastM) copyText(asText(lastM).map(function (r) { return r.join('\t'); }).join('\n'), this); });
  $('toA').addEventListener('click', function () { if (lastM && lastM.length <= MAX && lastM[0].length <= MAX) setMatrix('A', asText(lastM)); });
  $('toB').addEventListener('click', function () { if (lastM && lastM.length <= MAX && lastM[0].length <= MAX) setMatrix('B', asText(lastM)); });
  build('A', start.A); build('B', start.B);
})();
