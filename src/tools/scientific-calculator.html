<style>
.scal-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.scal-mem { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 24px; }
.scal-screen { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.scal-prev { min-height: 20px; font-size: 14px; color: var(--muted); text-align: end; overflow-wrap: anywhere; font-family: var(--mono); }
.scal-screen input[type=text] { border: 0; background: none; box-shadow: none; padding: 4px 0; min-height: 48px; font: 600 clamp(22px, 6vw, 30px)/1.2 var(--mono); text-align: end; }
.scal-screen input[type=text]:focus { box-shadow: none; }
.scal-live { min-height: 22px; font-size: 16px; text-align: end; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
.scal-live.bad { color: var(--bad); font-family: inherit; font-weight: 600; }
.scal-keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scal-keys button { font: 600 16px/1 inherit; font-family: inherit; min-height: 46px; padding: 0 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; touch-action: manipulation; }
.scal-keys button:hover { border-color: var(--accent); }
.scal-keys button:active { transform: translateY(1px); }
.scal-keys .f { font-size: 14px; background: var(--bg); color: var(--muted); }
.scal-keys .n { font-size: 19px; }
.scal-keys .o { color: var(--accent); font-size: 19px; }
.scal-keys .eq { background: var(--accent); color: var(--on-accent); border-color: var(--accent); grid-column: span 2; font-size: 20px; }
.scal-keys .clr { color: var(--bad); }
.scal-memrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
.scal-memrow button { font: 600 13px/1 inherit; font-family: inherit; min-height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.scal-memrow button:hover { color: var(--accent); border-color: var(--accent); }
.scal-hist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; max-height: 320px; overflow-y: auto; }
.scal-hist li { display: flex; gap: 6px; }
.scal-hist button { font: inherit; font-family: var(--mono); font-size: 14px; text-align: start; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 9px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.scal-hist button:hover { border-color: var(--accent); }
.scal-hist .x { flex: 1; overflow-wrap: anywhere; }
.scal-hist .r { flex: none; max-width: 45%; overflow-wrap: anywhere; font-weight: 700; color: var(--accent); }
.scal-h { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
.scal-h h3 { margin: 0; font-size: 16px; }
@media (max-width: 380px) { .scal-keys { gap: 4px; } .scal-keys button { font-size: 14px; min-height: 44px; } .scal-keys .f { font-size: 12.5px; } }
</style>
<div class="scal-top">
  <div class="seg" role="group" aria-label="Angle unit"><button type="button" id="deg" aria-pressed="true">DEG</button><button type="button" id="rad" aria-pressed="false">RAD</button></div>
  <span class="scal-mem" id="memInd" title="A number is stored in memory" hidden>M</span>
</div>

</div>

</div>
<div class="scal-keys" id="keys">
  <button type="button" class="f" data-ins="sin(">sin</button><button type="button" class="f" data-ins="cos(">cos</button><button type="button" class="f" data-ins="tan(">tan</button><button type="button" class="f" data-ins="(">(</button><button type="button" class="f" data-ins=")">)</button>
  <button type="button" class="f" data-ins="asin(" aria-label="inverse sine">sin⁻¹</button><button type="button" class="f" data-ins="acos(" aria-label="inverse cosine">cos⁻¹</button><button type="button" class="f" data-ins="atan(" aria-label="inverse tangent">tan⁻¹</button><button type="button" class="f" data-ins="^" aria-label="power">xʸ</button><button type="button" class="f" data-ins="√(" aria-label="square root">√</button>
  <button type="button" class="f" data-ins="ln(">ln</button><button type="button" class="f" data-ins="log(" aria-label="log base 10">log</button><button type="button" class="f" data-ins="²" aria-label="square">x²</button><button type="button" class="f" data-ins="⁻¹" aria-label="reciprocal">1/x</button><button type="button" class="f" data-ins="!" aria-label="factorial">n!</button>
  <button type="button" class="f" data-ins="π">π</button><button type="button" class="f" data-ins="e">e</button><button type="button" class="f" data-ins="E" aria-label="times ten to the power">EXP</button><button type="button" class="f" data-ins="Ans">Ans</button><button type="button" class="f" data-ins="%" aria-label="percent">%</button>
  <button type="button" class="n" data-ins="7">7</button><button type="button" class="n" data-ins="8">8</button><button type="button" class="n" data-ins="9">9</button><button type="button" class="o" data-act="back" aria-label="Backspace">⌫</button><button type="button" class="o clr" data-act="ac" aria-label="All clear">AC</button>
  <button type="button" class="n" data-ins="4">4</button><button type="button" class="n" data-ins="5">5</button><button type="button" class="n" data-ins="6">6</button><button type="button" class="o" data-ins="×" aria-label="times">×</button><button type="button" class="o" data-ins="÷" aria-label="divide">÷</button>
  <button type="button" class="n" data-ins="1">1</button><button type="button" class="n" data-ins="2">2</button><button type="button" class="n" data-ins="3">3</button><button type="button" class="o" data-ins="+" aria-label="plus">+</button><button type="button" class="o" data-ins="−" aria-label="minus">−</button>
  <button type="button" class="n" data-ins="0">0</button><button type="button" class="n" data-ins=".">.</button><button type="button" class="n" data-act="neg" aria-label="negative">(−)</button><button type="button" class="eq" id="eq" aria-label="equals">=</button>
</div>
<div class="btns"><button class="btn ghost" id="cp">Copy result</button></div>
<div class="scal-h"><h3>History</h3><button class="btn ghost" id="hclr" style="min-height:36px;padding:5px 12px">Clear history</button></div>
<ul class="scal-hist" id="hist"></ul>
<p class="msg" id="hnone">Your calculations appear here. Click one to use it again.</p>
<script>
(function () {
  // ---------- the parser: a hand-written recursive descent evaluator (no eval) ----------
  function CalcError(msg) { this.msg = msg; }
  var FUNCS = { sin: 1, cos: 1, tan: 1, asin: 1, acos: 1, atan: 1, ln: 1, log: 1, sqrt: 1, '√': 1 };
  function tokenize(s) {
    var t = [], i = 0, m;
    s = s.replace(/[−–—]/g, '-').replace(/[×·∗]/g, '*').replace(/[÷∕]/g, '/').replace(/,/g, '.');
    while (i < s.length) {
      var c = s[i], rest = s.slice(i);
      if (/\s/.test(c)) { i++; continue; }
      if ((m = /^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(rest))) {
        if (s[i + m[0].length] === '.') throw new CalcError('A decimal point is in the wrong place.');
        if (/^E/.test(s.slice(i + m[0].length))) throw new CalcError('EXP needs a whole number after it, like 3E5.');
        t.push({ k: 'num', v: parseFloat(m[0].replace('E', 'e')) }); i += m[0].length; continue;
      }
      if (c === 'E') throw new CalcError('EXP needs a number before it, like 3E5.');
      if (c === '.') throw new CalcError('A decimal point is in the wrong place.');
      if ((m = /^(asin|acos|atan|sin|cos|tan|sqrt|ln|log|Ans|ans|pi)/.exec(rest))) {
        var w = m[1].toLowerCase();
        if (w === 'ans') t.push({ k: 'ans' }); else if (w === 'pi') t.push({ k: 'num', v: Math.PI, c: 1 }); else t.push({ k: 'fn', v: w });
        i += m[1].length; continue;
      }
      if (c === 'π') { t.push({ k: 'num', v: Math.PI, c: 1 }); i++; continue; }
      if (c === 'e') { t.push({ k: 'num', v: Math.E, c: 1 }); i++; continue; }
      if (c === '√') { t.push({ k: 'fn', v: 'sqrt' }); i++; continue; }
      if (rest.slice(0, 2) === '⁻¹') { t.push({ k: 'post', v: 'inv' }); i += 2; continue; }
      if (c === '²' || c === '³') { t.push({ k: 'post', v: c }); i++; continue; }
      if (c === '!' || c === '%') { t.push({ k: 'post', v: c }); i++; continue; }
      if ('+-*/^()'.indexOf(c) !== -1) { t.push({ k: c }); i++; continue; }
      throw new CalcError('"' + c + '" is not something this calculator understands.');
    }
    return t;
  }
  function evaluate(src, opt) {
    var toks = tokenize(src), p = 0, deg = opt.deg, ans = opt.ans || 0;
    // forgive missing closing brackets at the end, like most calculators
    var open = 0; toks.forEach(function (x) { if (x.k === '(') open++; else if (x.k === ')') open--; });
    while (open-- > 0) toks.push({ k: ')' });
    if (!toks.length) throw new CalcError('Type a calculation first.');
    function peek() { return toks[p]; }
    function startsOperand(x) { return x && (x.k === 'num' || x.k === 'ans' || x.k === 'fn' || x.k === '('); }
    function expr() {
      var v = term();
      while (peek() && (peek().k === '+' || peek().k === '-')) { var o = toks[p++].k, r = term(); v = o === '+' ? v + r : v - r; }
      return v;
    }
    function term() {
      var v = unary();
      for (;;) {
        var x = peek();
        if (x && (x.k === '*' || x.k === '/')) {
          p++; var r = unary();
          if (x.k === '/') { if (r === 0) throw new CalcError('You cannot divide by zero.'); v = v / r; } else v = v * r;
        } else if (startsOperand(x)) { // implicit multiplication: 2π, 3(4+5), (1+2)(3+4), 2sin(30)
          if (x.k === 'num' && !x.c && toks[p - 1].k === 'num' && !toks[p - 1].c) throw new CalcError('Two numbers need an operator between them.');
          v = v * unary();
        } else return v;
      }
    }
    function unary() {
      var x = peek();
      if (x && x.k === '-') { p++; return -unary(); }
      if (x && x.k === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var b = postfix();
      if (peek() && peek().k === '^') {
        p++; var ex = unary(), r = Math.pow(b, ex); // right-associative: the exponent may itself contain ^
        if (b === 0 && ex < 0) throw new CalcError('You cannot divide by zero.');
        if (isNaN(r)) throw new CalcError('A negative number cannot be raised to a fractional power.');
        return r;
      }
      return b;
    }
    function postfix() {
      var v = primary();
      while (peek() && peek().k === 'post') {
        var o = toks[p++].v;
        if (o === '!') v = fact(v);
        else if (o === '%') v = v / 100;
        else if (o === '²') v = v * v;
        else if (o === '³') v = v * v * v;
        else { if (v === 0) throw new CalcError('You cannot divide by zero.'); v = 1 / v; }
      }
      return v;
    }
    function primary() {
      var x = toks[p++];
      if (!x) throw new CalcError('The calculation ends too early.');
      if (x.k === 'num') return x.v;
      if (x.k === 'ans') return ans;
      if (x.k === '(') {
        if (peek() && peek().k === ')') throw new CalcError('Empty brackets.');
        var v = expr();
        if (!peek() || peek().k !== ')') throw new CalcError('Check your brackets.');
        p++; return v;
      }
      if (x.k === 'fn') {
        var a = (peek() && peek().k === '(') ? primary() : unary();
        return fn(x.v, a);
      }
      if (x.k === ')') throw new CalcError('Check your brackets.');
      if (x.k === 'post') throw new CalcError('"' + (x.v === 'inv' ? '⁻¹' : x.v) + '" needs a number before it.');
      throw new CalcError('An operator is missing a number.');
    }
    function snapTrig(r, arg) { return Math.abs(r) < 1e-14 && Math.abs(arg) > 1e-7 ? 0 : r; }
    function fn(f, a) {
      var r, k = deg ? Math.PI / 180 : 1;
      switch (f) {
        case 'sin': case 'cos': case 'tan':
          if (!isFinite(a)) throw new CalcError('That angle is too large.');
          if (deg) { // exact answers at whole multiples of 90°
            var q = ((a % 360) + 360) % 360;
            if (q % 90 === 0) {
              var S = [0, 1, 0, -1][q / 90], C = [1, 0, -1, 0][q / 90];
              if (f === 'tan' && C === 0) throw new CalcError('tan is undefined at ' + fmt(a) + '°.');
              return f === 'sin' ? S : f === 'cos' ? C : S / C;
            }
          }
          var s = snapTrig(Math.sin(a * k), a * k), c = snapTrig(Math.cos(a * k), a * k);
          if (f === 'tan') { if (c === 0) throw new CalcError('tan is undefined at this angle.'); return s / c; }
          return f === 'sin' ? s : c;
        case 'asin': case 'acos':
          if (a < -1 || a > 1) throw new CalcError(f === 'asin' ? 'sin⁻¹ only accepts numbers from −1 to 1.' : 'cos⁻¹ only accepts numbers from −1 to 1.');
          r = f === 'asin' ? Math.asin(a) : Math.acos(a); return r / k;
        case 'atan': return Math.atan(a) / k;
        case 'ln': if (a <= 0) throw new CalcError('ln only accepts numbers greater than 0.'); return Math.log(a);
        case 'log': if (a <= 0) throw new CalcError('log only accepts numbers greater than 0.'); return Math.log10(a);
        case 'sqrt': if (a < 0) throw new CalcError('You cannot take the square root of a negative number.'); return Math.sqrt(a);
      }
    }
    function fact(n) {
      if (n < 0 || Math.floor(n) !== n) throw new CalcError('n! needs a whole number from 0 to 170.');
      if (n > 170) throw new CalcError('n! is too large above 170.');
      var r = 1; for (var i = 2; i <= n; i++) r *= i; return r;
    }
    var v = expr();
    if (p < toks.length) throw new CalcError(toks[p].k === ')' ? 'Check your brackets.' : 'There is something extra at the end.');
    if (v !== v) throw new CalcError('Math error.');
    if (!isFinite(v)) throw new CalcError('The result is too large.');
    return v;
  }
  // 12 significant digits hides floating-point noise: 0.1+0.2 shows 0.3
  function clean(v) { var r = parseFloat(v.toPrecision(12)); return r === 0 ? 0 : r; }
  function fmt(v, ascii) {
    var r = clean(v), a = Math.abs(r), s;
    if (r === 0) return '0';
    if (a >= 1e15 || a < 1e-9) s = r.toExponential().replace(/\.?0*e/, 'E').replace('E+', 'E');
    else s = String(r);
    return ascii ? s : s.replace(/-/g, '−');
  }

  // ---------- the interface ----------
  var KEY = 'gtn-scicalc', st = { deg: true, ans: 0, mem: 0, hist: [] };
  try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved && typeof saved === 'object') { st.deg = saved.deg !== false; st.ans = +saved.ans || 0; st.mem = +saved.mem || 0; st.hist = Array.isArray(saved.hist) ? saved.hist.slice(0, 50) : []; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var ex = $('expr'), justDone = false, lastResult = null;
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) ex.setAttribute('inputmode', 'none'); // phones use the keypad, not the system keyboard

  function pretty() { // show × ÷ − whatever was typed, keeping the cursor in place (same length)
    var v = ex.value, n = v.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
    if (n !== v) { var a = ex.selectionStart, b = ex.selectionEnd; ex.value = n; try { ex.setSelectionRange(a, b); } catch (e) {} }
  }
  function live() {
    var s = ex.value.trim();
    $('live').className = 'scal-live';
    if (!s) { $('live').textContent = ''; return; }
    try { var v = evaluate(s, st); $('live').textContent = /^[−-]?[\d.]+$/.test(s) ? '' : '= ' + fmt(v); } catch (e) { $('live').textContent = ''; }
  }
  function insert(txt) {
    if (justDone) {
      justDone = false;
      // after =, an operator carries on from the answer, anything else starts a new calculation
      if (/^([+×÷^%!²−]|⁻¹)$/.test(txt)) { ex.value = 'Ans'; ex.setSelectionRange(3, 3); }
      else ex.value = '';
    }
    var a = ex.selectionStart == null ? ex.value.length : ex.selectionStart, b = ex.selectionEnd == null ? a : ex.selectionEnd;
    ex.value = ex.value.slice(0, a) + txt + ex.value.slice(b);
    ex.setSelectionRange(a + txt.length, a + txt.length);
    live();
  }
  function showErr(msg) { $('live').className = 'scal-live bad'; $('live').textContent = msg; }
  function equals() {
    var s = ex.value.trim();
    if (!s) { if (lastResult !== null) return; showErr('Type a calculation first.'); return; }
    try {
      var v = clean(evaluate(s, st)), out = fmt(v);
      $('prev').textContent = s + ' =';
      st.ans = v; lastResult = v;
      if (!(st.hist[0] && st.hist[0].x === s && st.hist[0].v === v)) st.hist.unshift({ x: s, v: v });
      st.hist = st.hist.slice(0, 50); save(); drawHist();
      ex.value = out; $('live').textContent = ''; justDone = true;
      ex.setSelectionRange(out.length, out.length);
    } catch (e) {
      if (!(e instanceof CalcError)) throw e;
      showErr(e.msg); justDone = false;
    }
  }
  function current() { // the value M+ and M− use: the answer on screen, or the expression typed so far
    var s = ex.value.trim();
    if (justDone && lastResult !== null) return lastResult;
    if (!s) return lastResult;
    try { return clean(evaluate(s, st)); } catch (e) { showErr(e.msg || 'Math error.'); return null; }
  }
  function drawMem() { $('memInd').hidden = !st.mem; $('memInd').title = 'Memory: ' + fmt(st.mem); }
  function drawHist() {
    var ul = $('hist'); ul.innerHTML = '';
    st.hist.forEach(function (h) {
      var li = document.createElement('li'), a = document.createElement('button'), b = document.createElement('button');
      a.className = 'x'; a.type = 'button'; a.textContent = h.x; a.title = 'Use this calculation again';
      b.className = 'r'; b.type = 'button'; b.textContent = '= ' + fmt(h.v); b.title = 'Insert this answer';
      a.addEventListener('click', function () { ex.value = h.x; justDone = false; ex.focus(); ex.setSelectionRange(h.x.length, h.x.length); live(); });
      b.addEventListener('click', function () { var t = fmt(h.v); if (h.v < 0) t = '(' + t + ')'; ex.focus(); insert(t); });
      li.appendChild(a); li.appendChild(b); ul.appendChild(li);
    });
    $('hnone').hidden = st.hist.length > 0; $('hclr').hidden = !st.hist.length;
  }
  function setAngle(d) {
    st.deg = d; save();
    $('deg').setAttribute('aria-pressed', d); $('rad').setAttribute('aria-pressed', !d); live();
  }
  $('deg').addEventListener('click', function () { setAngle(true); });
  $('rad').addEventListener('click', function () { setAngle(false); });

  $('keys').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var keepFocus = document.activeElement === ex;
    if (b.dataset.ins) insert(b.dataset.ins);
    else if (b.dataset.act === 'neg') insert('−');
    else if (b.dataset.act === 'back') back();
    else if (b.dataset.act === 'ac') allClear();
    else if (b.id === 'eq') equals();
    if (keepFocus) ex.focus();
  });
  function back() {
    if (justDone) { allClear(); return; }
    var a = ex.selectionStart, b = ex.selectionEnd, v = ex.value;
    if (a !== b) { ex.value = v.slice(0, a) + v.slice(b); ex.setSelectionRange(a, a); }
    else if (a > 0) {
      var m = /(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|√\(|Ans|⁻¹)$/.exec(v.slice(0, a)), n = m ? m[0].length : 1; // remove a whole function name at once
      ex.value = v.slice(0, a - n) + v.slice(a); ex.setSelectionRange(a - n, a - n);
    }
    live();
  }
  function allClear() { ex.value = ''; $('prev').textContent = ''; $('live').textContent = ''; $('live').className = 'scal-live'; justDone = false; }
  document.querySelectorAll('[data-mem]').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.dataset.mem, v;
      if (m === 'mc') { st.mem = 0; toast('Memory cleared'); }
      else if (m === 'mr') { var t = fmt(st.mem); if (st.mem < 0) t = '(' + t + ')'; insert(t); }
      else { v = current(); if (v === null) return; st.mem = clean(st.mem + (m === 'add' ? v : -v)); toast('Memory: ' + fmt(st.mem)); }
      save(); drawMem();
    });
  });
  ex.addEventListener('input', function () { justDone = false; pretty(); live(); });
  ex.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Escape') { e.preventDefault(); allClear(); }
    else if (justDone && e.key === 'Backspace') { e.preventDefault(); allClear(); }
    else if (justDone && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); insert({ '*': '×', '/': '÷', '-': '−' }[e.key] || e.key); }
  });
  // typing anywhere on the page (outside other fields) goes to the calculator
  document.addEventListener('keydown', function (e) {
    var t = e.target, tag = (t.tagName || '');
    if (t === ex || /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || t.isContentEditable || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('dialog[open]')) return;
    var k = e.key, map = { '*': '×', '/': '÷', '-': '−', x: '×' };
    if (/^[0-9.+()^!%]$/.test(k) || k in map) { e.preventDefault(); ex.focus(); ex.setSelectionRange(ex.value.length, ex.value.length); insert(map[k] || k); }
    else if (k === 'Enter' && (!tag.match(/^(BUTTON|A)$/))) { e.preventDefault(); equals(); }
    else if (k === '=') { e.preventDefault(); equals(); }
    else if (k === 'Backspace') { e.preventDefault(); ex.setSelectionRange(ex.value.length, ex.value.length); back(); }
    else if (k === 'Escape') allClear();
  });
  $('cp').addEventListener('click', function () {
    var v = justDone ? lastResult : current();
    if (v === null || v === undefined) { showErr('There is no result to copy yet.'); return; }
    copyText(fmt(v, true), $('cp'));
  });
  $('hclr').addEventListener('click', function () { st.hist = []; save(); drawHist(); });
  setAngle(st.deg); drawMem(); drawHist();
})();
</script>
