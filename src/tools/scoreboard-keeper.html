<style>
.sb-stage { background: var(--surface); border-radius: 14px; }
.sb-stage:fullscreen { padding: 2vmin 3vmin; overflow: auto; box-sizing: border-box; height: 100vh; }
.sb-title { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; margin: 0 0 8px; }
.sb-title b { font-size: 17px; }
.sb-title span { color: var(--muted); font-size: 14px; }
.sb-clocks { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; margin: 4px 0 10px; }
.sb-clock { font: 800 clamp(26px, 7vw, 40px)/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; padding: 6px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.sb-clock.out { color: var(--bad); border-color: var(--bad); }
.sb-clock small { display: block; font: 600 11px/1.2 system-ui, sans-serif; color: var(--muted); text-align: center; margin-top: 2px; }
.sb-clocks .btn { min-height: 44px; padding: 6px 12px; }
.sb-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sb-side { border: 2px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; min-width: 0; background: var(--bg); }
.sb-side.lead { border-color: var(--accent); }
.sb-side.turn { box-shadow: 0 0 0 3px #f59e0b; }
.sb-name { font-weight: 700; font-size: clamp(15px, 4vw, 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-score { font-weight: 800; font-size: clamp(56px, 17vw, 110px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; margin: 4px 0; }
.sb-score.mid { font-size: clamp(40px, 11vw, 76px); }
.sb-sub { font-size: 14px; color: var(--muted); min-height: 1.3em; }
.sb-side .btns { justify-content: center; margin-top: 8px; gap: 6px; }
.sb-side .btn { min-height: 48px; min-width: 52px; padding: 6px 10px; font-size: 17px; justify-content: center; }
.sb-ctl { margin: 12px 0 0; }
.sb-ctl .btns { margin: 8px 0 0; gap: 8px; }
.sb-ctl .btn { min-height: 48px; justify-content: center; }
.sb-balls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sb-balls .btn { min-height: 54px; font-size: 20px; padding: 4px; justify-content: center; }
.sb-ext { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.sb-ext .btn { min-height: 44px; font-size: 14px; padding: 4px; justify-content: center; }
.sb-info { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; font-size: 16px; margin: 10px 0 0; }
.sb-info b { font-variant-numeric: tabular-nums; }
.sb-log { font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-top: 10px; }
.sb-log span { display: inline-block; min-width: 26px; text-align: center; border-radius: 6px; margin: 1px; }
.sb-log .w { background: var(--bad); color: #fff; } .sb-log .f { background: var(--ok); color: #fff; } .sb-log .s { background: #7c3aed; color: #fff; }
.sb-table { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; }
.sb-table table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.sb-table th, .sb-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.sb-table td.e { cursor: pointer; }
.sb-table tfoot td { font-weight: 800; font-size: 18px; }
.sb-table input { width: 72px; text-align: center; padding: 6px; }
.sb-banner { text-align: center; font-weight: 800; font-size: clamp(18px, 5vw, 26px); color: var(--ok); margin: 10px 0 0; }
.sb-note { text-align: center; color: #b45309; font-weight: 700; margin: 8px 0 0; min-height: 0; }
.sb-hist { list-style: none; padding: 0; margin: 0; }
.sb-hist li { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 0 0 8px; }
.sb-hist li small { color: var(--muted); }
.sb-hist .btns { margin-top: 6px; } .sb-hist .btn { min-height: 38px; padding: 4px 12px; font-size: 14px; }
.sb-stage:fullscreen .sb-score { font-size: min(24vmin, 220px); }
.sb-stage:fullscreen .sb-name { font-size: min(5vmin, 40px); }
.sb-stage:fullscreen .sb-clock { font-size: min(8vmin, 64px); }
.sb-stage:fullscreen.hidectl .sb-ctl, .sb-stage:fullscreen.hidectl .sb-side .btns, .sb-stage:fullscreen.hidectl .sb-clocks .btn { display: none; }
.sb-print { display: none; }
@media print {
  body > *:not(.sb-print) { display: none !important; }
  .sb-print { display: block !important; color: #000; font: 11pt/1.4 system-ui, sans-serif; }
  .sb-print table { border-collapse: collapse; width: 100%; }
  .sb-print th, .sb-print td { border: 1px solid #999; padding: 4px 6px; text-align: left; vertical-align: top; }
  .sb-print h2 { margin: 0 0 8px; }
}
</style>
<div id="sbSetup">
  <div class="fields">
    <div><label for="sbGame">Game</label><select id="sbGame">
      <option value="cricket">Cricket</option><option value="football">Football (soccer)</option><option value="basketball">Basketball</option><option value="volleyball">Volleyball</option>
      <option value="badminton">Badminton</option><option value="tabletennis">Table tennis</option><option value="carrom">Carrom</option><option value="cards">Card game (rounds)</option>
      <option value="board">Board game (rounds and turn timer)</option><option value="custom">Custom (any game)</option></select></div>
    <div><label for="sbTitle">Match name (optional)</label><input type="text" id="sbTitle" data-nomemo maxlength="60" placeholder="e.g. Sunday final"></div>
  </div>
  <label for="sbNames" id="sbNamesLbl">Teams (one per line)</label>
  <textarea id="sbNames" data-nomemo rows="3" style="min-height:0" maxlength="800"></textarea>
  <div class="fields" id="sbOpts" style="margin-top:12px"></div>
  <div class="btns" style="margin:0"><button type="button" class="btn big" id="sbStart">Start match</button></div>
</div>
<div id="sbLive" hidden>
  <div class="sb-stage" id="sbStage">
    <div class="sb-title"><b id="sbHead"></b><span id="sbHeadSub"></span></div>
    <div class="sb-clocks" id="sbClocks"></div>
    <div id="sbBoard"></div>
    <div class="sb-note" id="sbNote" aria-live="polite"></div>
    <div class="sb-ctl" id="sbCtl"></div>
    <div class="btns">
      <button type="button" class="btn ghost" id="sbUndo">↶ Undo</button>
      <button type="button" class="btn ghost" id="sbFull">Full screen</button>
      <button type="button" class="btn ghost" id="sbHide" hidden>Hide buttons</button>
    </div>
  </div>
  <div class="btns">
    <button type="button" class="btn" id="sbShare">Share result as image</button>
    <button type="button" class="btn ghost" id="sbFinish">Finish and save</button>
    <button type="button" class="btn ghost danger" id="sbQuit">Discard match</button>
  </div>
</div>
<p class="msg" id="sbMsg" aria-live="polite">Choose a game, type the names and press Start. Everything stays on this device.</p>
<fieldset style="margin-top:18px">
  <legend>Match history</legend>
  <ul class="sb-hist" id="sbHist"></ul>
  <div class="btns" style="margin:0">
    <button type="button" class="btn ghost" id="sbExport">Export JSON</button>
    <button type="button" class="btn ghost" id="sbCsv">Export CSV</button>
    <button type="button" class="btn ghost" id="sbImportBtn">Import JSON</button>
    <button type="button" class="btn ghost" id="sbPrint">Print / PDF</button>
    <button type="button" class="btn ghost danger" id="sbWipe">Delete history</button>
    <input type="file" id="sbImport" accept=".json,application/json" data-nomemo hidden>
  </div>
</fieldset>
<script>
(function () {
  var LS = 'gtn-scoreboard-keeper';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var GAMES = {

    badminton: { name: 'Badminton', who: 'Players or pairs', names: 'Player 1\nPlayer 2', min: 2, max: 2, opts: [['bestOf', 'Best of (games)', 3, 1, 7], ['to', 'Points per game', 21, 5, 50], ['cap', 'Golden point at', 30, 5, 60], ['srv', 'Serving first', 'sel', ['first', 'second']]] },
    tabletennis: { name: 'Table tennis', who: 'Players or pairs', names: 'Player 1\nPlayer 2', min: 2, max: 2, opts: [['bestOf', 'Best of (games)', 5, 1, 9], ['to', 'Points per game', 11, 5, 30], ['srv', 'Serving first', 'sel', ['first', 'second']]] },
    carrom: { name: 'Carrom', who: 'Players or pairs', names: 'Player 1\nPlayer 2', min: 2, max: 2, opts: [['target', 'Points to win', 25, 5, 100], ['boards', 'Most boards', 8, 1, 30], ['qcap', 'Queen (3 points) counts until', 22, 0, 100]] },

  };

      var d = document.createElement('div'), id = 'sbO_' + o[0];
      if (o[2] === 'sel') d.innerHTML = '<label for="' + id + '">' + o[1] + '</label><select id="' + id + '" data-nomemo>' + o[3].map(function (x, i) { return '<option value="' + i + '">' + x + '</option>'; }).join('') + '</select>';
      else if (o[2] === 'text') d.innerHTML = '<label for="' + id + '">' + o[1] + '</label><input type="text" id="' + id + '" data-nomemo value="' + o[3] + '">';
      else d.innerHTML = '<label for="' + id + '">' + o[1] + '</label><input type="number" id="' + id + '" data-nomemo inputmode="numeric" min="' + o[3] + '" max="' + o[4] + '" value="' + o[2] + '">';
      box.appendChild(d);
    });
  }
  $('sbGame').addEventListener('change', showOpts);

  $('sbStart').addEventListener('click', function () {
    var type = $('sbGame').value, g = GAMES[type];
    var names = $('sbNames').value.split('\n').map(function (s) { return s.trim().slice(0, 40); }).filter(Boolean);
    if (names.length < g.min) { say('bad', 'Please type ' + (g.min === 2 ? 'both names' : 'at least one name') + ', one per line.'); return; }
    if (names.length > g.max) { say('bad', g.name + ' needs ' + (g.max === 2 ? 'exactly two sides' : 'at most ' + g.max + ' names') + '. You typed ' + names.length + '.'); return; }
    var opts = {}, bad = null;
    g.opts.forEach(function (o) {
      var el = $('sbO_' + o[0]);
      if (o[2] === 'sel') opts[o[0]] = +el.value;
      else if (o[2] === 'text') { var st = el.value.split(/[ ,;]+/).map(Number).filter(function (n) { return isFinite(n) && n > 0 && n <= 1000; }).slice(0, 4); if (!st.length) bad = 'Type one or more score steps, like 1, 2, 5.'; opts[o[0]] = st; }
      else { var v = Number(el.value); if (el.value === '' || !isFinite(v) || v < o[3] || v > o[4] || Math.round(v) !== v) bad = '"' + o[1] + '" must be a whole number from ' + o[3] + ' to ' + o[4] + '.'; opts[o[0]] = v; }
    });
    if (bad) { say('bad', bad); return; }
    if ((type === 'volleyball' || type === 'badminton' || type === 'tabletennis') && opts.bestOf % 2 === 0) { say('bad', '"Best of" should be an odd number, like 3 or 5.'); return; }
    if (type === 'badminton' && opts.cap <= opts.to) { say('bad', 'The golden point must be higher than the points per game.'); return; }
    if (db.cur && !confirm('A match is in progress. Start a new one and discard it?')) return;

  });

  function init(type, names, o) {
    var n = names.length, z = function () { return names.map(function () { return 0; }); };
    if (type === 'cricket') { var b = o.first || 0; return { inn: [inn(b), inn(1 - b)], cur: 0, ext: '', done: false }; }
    if (type === 'football') return { score: z(), pens: z(), period: 0, log: [] };
    if (type === 'basketball') return { score: z(), fouls: z(), period: 0, log: [] };
    if (type === 'volleyball' || type === 'badminton' || type === 'tabletennis') return { pts: z(), sets: z(), hist: [], srv: o.srv || 0, first: o.srv || 0, done: false };

    if (type === 'cards' || type === 'board') return { rounds: [], done: false };
    return { score: z(), done: false };
  }
  function inn(bat) { return { bat: bat, runs: 0, wk: 0, balls: 0, ex: { wd: 0, nb: 0, b: 0, lb: 0 }, log: [[]], over: false }; }

  // ---------------- clocks ----------------
  function el(c) { return c.acc + (c.t0 ? Date.now() - c.t0 : 0); }
  function fmt(ms, tenths) { var neg = ms < 0; ms = Math.abs(ms); var s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60); var t = (h ? h + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); return (neg ? '−' : '') + t; }
  function clockLimit(m) { var o = m.opts; return m.type === 'basketball' ? o.qlen * 60000 : m.type === 'custom' && o.mins ? o.mins * 60000 : 0; }
  function turnSecs(m) { return m.opts.turn || 0; }
  var beeped = {};
  function beep(n) {
    try { var AC = window.AudioContext || window.webkitAudioContext, a = beep.a || (beep.a = new AC()); a.resume(); for (var i = 0; i < (n || 1); i++) { var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i * 0.25; o.frequency.value = 880; g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.22); } } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(300); } catch (e) {}
  }
  function drawClocks() {
    var m = db.cur; if (!m) return;
    var lim = clockLimit(m), e = el(m.clock), h = '';
    var show = lim ? lim - e : e;
    if (lim && show <= 0 && m.clock.t0) { m.clock.acc = lim; m.clock.t0 = null; save(); beep(3); show = 0; }
    var label = m.type === 'football' ? (m.d.period < 4 ? 'match clock' : '') : lim ? 'time left' : 'match time';
    h += '<div class="sb-clock' + (lim && show <= 0 ? ' out' : '') + '" id="sbClk">' + fmt(show) + '<small>' + label + '</small></div>';
    h += '<button type="button" class="btn ghost" data-a="clk">' + (m.clock.t0 ? 'Pause' : el(m.clock) ? 'Resume' : 'Start clock') + '</button><button type="button" class="btn ghost" data-a="clkreset">Reset</button>';
    var ts = turnSecs(m);
    if (ts) {
      var left = ts * 1000 - el(m.turn);
      if (left <= 0 && m.turn.t0) { m.turn.acc = ts * 1000; m.turn.t0 = null; save(); beep(2); left = 0; }
      h += '<div class="sb-clock' + (left <= 0 ? ' out' : '') + '">' + fmt(Math.max(0, left) + 999) + '<small>' + esc(m.names[m.turn.i % m.names.length]) + '’s turn</small></div>';

  // ---------------- scoring ----------------
  function snap() { db.undo.push(JSON.stringify(db.cur)); if (db.undo.length > 150) db.undo.shift(); }

  function act(a, i, v) {
    var m = db.cur, d = m.d, o = m.opts, t = m.type; note = '';
    if (a === 'clk') { if (m.clock.t0) { m.clock.acc = el(m.clock); m.clock.t0 = null; } else { var lim = clockLimit(m); if (lim && el(m.clock) >= lim) m.clock.acc = 0; m.clock.t0 = Date.now(); } save(); drawClocks(); return; }

  function cricket(m, a, v) {

    d.ext = '';
    if (a === 'ball') {

      else if (ex === 'nb') { I.runs += 1 + r; I.ex.nb += 1; tok = 'nb' + (r ? '+' + r : ''); }
      else if (ex === 'b' || ex === 'lb') { I.runs += r; I.ex[ex] += r; I.balls++; tok = r + ex; }
      else { I.runs += r; I.balls++; tok = r ? String(r) : '•'; }
    } else if (a === 'wkt') {
      I.wk++;
      if (ex === 'wd') { I.runs += 1; I.ex.wd += 1; tok = 'W+wd'; } else if (ex === 'nb') { I.runs += 1; I.ex.nb += 1; tok = 'W+nb'; } else { I.balls++; tok = 'W'; }
    } else return;
    last.push(tok);
    var legal = a === 'wkt' ? ex !== 'wd' && ex !== 'nb' : ex !== 'wd' && ex !== 'nb';
    if (legal && I.balls % bpo === 0) { I.log.push([]); note = 'End of over ' + I.balls / bpo + '.'; }

    if (!m.d.done && !confirm('The match is not over yet. Save it with the score as it is now?')) return;
    m.clock.acc = el(m.clock); m.clock.t0 = null;
    var r = record(m); db.hist = db.hist.filter(function (h) { return h.id !== r.id; }); db.hist.unshift(r); if (db.hist.length > 300) db.hist.length = 300;
    db.cur = null; db.undo = []; save(); showLive(); drawHist(); say('ok', 'Saved to your match history: ' + r.result + '.');
    if (lock) { try { lock.release(); } catch (e) {} }
  });
  $('sbQuit').addEventListener('click', function () { if (!confirm('Discard this match? It will not be saved.')) return; db.cur = null; db.undo = []; save(); showLive(); say('', 'Match discarded.'); });
  function drawHist() {
    var ul = $('sbHist');
    if (!db.hist.length) { ul.innerHTML = '<li style="border-style:dashed;color:var(--muted)">No finished matches yet.</li>'; return; }
    ul.innerHTML = db.hist.map(function (h, k) {
      return '<li><b>' + esc(h.result) + '</b><br><small>' + esc((h.title ? h.title + ' · ' : '') + h.game + ' · ' + new Date(h.date).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })) + '</small><div style="font-size:14px;margin-top:4px">' + h.lines.map(esc).join('<br>') + '</div><div class="btns"><button type="button" class="btn ghost" data-h="share" data-k="' + k + '">Share image</button><button type="button" class="btn ghost danger" data-h="del" data-k="' + k + '">Delete</button></div></li>';
    }).join('');
  }
  $('sbHist').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-h]'); if (!b) return; var k = +b.dataset.k, h = db.hist[k]; if (!h) return;
    if (b.dataset.h === 'del') { if (!confirm('Delete this match from the history?')) return; db.hist.splice(k, 1); save(); drawHist(); }
    else shareImage(h);
  });

  // ---------------- share as image ----------------
  function wrapText(g, text, x, y, maxW, lh) { var words = String(text).split(' '), line = '', lines = 0; for (var i = 0; i < words.length; i++) { var test = line ? line + ' ' + words[i] : words[i]; if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y + lines * lh); line = words[i]; lines++; } else line = test; } g.fillText(line, x, y + lines * lh); return lines + 1; }
  function shareImage(h) {
    var W = 1200, H = 675, c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
    var grd = g.createLinearGradient(0, 0, W, H); grd.addColorStop(0, '#0f172a'); grd.addColorStop(1, '#1e3a8a'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
    var F = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans Devanagari", sans-serif';
    g.fillStyle = '#93c5fd'; g.font = '600 30px ' + F; g.textAlign = 'center'; g.fillText((h.title ? h.title + ' · ' : '') + h.game, W / 2, 70);
    g.fillStyle = '#cbd5e1'; g.font = '24px ' + F; g.fillText(new Date(h.date).toLocaleDateString(undefined, { dateStyle: 'long' }), W / 2, 108);
    var n = Math.min(h.names.length, 6), colW = (W - 80) / n;
    for (var i = 0; i < n; i++) {
      var cx = 40 + colW * i + colW / 2;
      g.fillStyle = '#fff'; g.font = '700 ' + (n > 3 ? 28 : 38) + 'px ' + F; var nm = h.names[i]; while (g.measureText(nm).width > colW - 20 && nm.length > 3) nm = nm.slice(0, -2) + '…'; g.fillText(nm, cx, 200);
      g.font = '800 ' + (n > 3 ? 96 : 150) + 'px ' + F; g.fillText(h.disp && h.disp[i] != null ? String(h.disp[i]) : String(h.scores[i]), cx, n > 3 ? 320 : 360);
    }
    if (h.names.length > 6) { g.font = '24px ' + F; g.fillStyle = '#cbd5e1'; g.fillText('+ ' + (h.names.length - 6) + ' more', W / 2, 400); }
    g.fillStyle = '#fde68a'; g.font = '700 40px ' + F; var used = wrapText(g, h.result, W / 2, 470, W - 120, 48);
    g.fillStyle = '#e2e8f0'; g.font = '24px ' + F; wrapText(g, h.lines.filter(function (l) { return !/^.*: -?\d+(\.\d+)?$/.test(l); }).join(' · '), W / 2, 470 + used * 48 + 10, W - 120, 32);
    g.fillStyle = '#64748b'; g.font = '20px ' + F; g.fillText('GetToolNest Scoreboard', W / 2, H - 28);
    c.toBlob(function (blob) {
      var name = 'score-' + (h.game.toLowerCase().replace(/[^a-z]+/g, '-')) + '-' + h.date.slice(0, 10) + '.png', file = null;
      try { file = new File([blob], name, { type: 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: h.game + ' result', text: h.result }).catch(function () {}); return; }
      var a = document.createElement('a'), u = URL.createObjectURL(blob); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
      say('ok', 'Image saved as ' + name + '. Send it in any chat app.');
    }, 'image/png');
  }
  $('sbShare').addEventListener('click', function () { if (db.cur) shareImage(record(db.cur)); });

  // ---------------- export, import, print ----------------
  function download(blob, name) { var a = document.createElement('a'), u = URL.createObjectURL(blob); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); }
  $('sbExport').addEventListener('click', function () { if (!db.hist.length) { say('bad', 'There is no history to export yet.'); return; } download(new Blob([JSON.stringify({ app: 'gtn-scoreboard-keeper', v: 1, exported: new Date().toISOString(), matches: db.hist }, null, 1)], { type: 'application/json' }), 'match-history.json'); say('ok', 'History exported (' + db.hist.length + ' matches).'); });
  $('sbCsv').addEventListener('click', function () {
    if (!db.hist.length) { say('bad', 'There is no history to export yet.'); return; }
    var q = function (s) { s = String(s == null ? '' : s); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    var rows = [['Date', 'Game', 'Match name', 'Players or teams', 'Result', 'Details']].concat(db.hist.map(function (h) { return [h.date.slice(0, 16).replace('T', ' '), h.game, h.title || '', h.names.join(' | '), h.result, h.lines.join('; ')]; }));
    download(new Blob(['﻿' + rows.map(function (r) { return r.map(q).join(','); }).join('\r\n')], { type: 'text/csv' }), 'match-history.csv'); say('ok', 'CSV exported. It opens in Excel, Google Sheets or LibreOffice.');
  });
  $('sbImportBtn').addEventListener('click', function () { $('sbImport').value = ''; $('sbImport').click(); });
  $('sbImport').addEventListener('change', function () {
    var f = $('sbImport').files[0]; if (!f) return;
    if (f.size > 5e6) { say('bad', 'That file is too big to be a match history.'); return; }
    f.text().then(function (txt) {
      var o = null; try { o = JSON.parse(txt); } catch (e) {}
      var list = o && o.app === 'gtn-scoreboard-keeper' && Array.isArray(o.matches) ? o.matches.filter(function (h) { return h && typeof h.id === 'string' && GAMES[h.type] && typeof h.result === 'string' && Array.isArray(h.names) && Array.isArray(h.lines) && Array.isArray(h.scores) && !isNaN(Date.parse(h.date)); }) : null;
      if (!list) { say('bad', '"' + f.name + '" is not a match history exported from this tool, so nothing was imported.'); return; }
      var have = {}, added = 0; db.hist.forEach(function (h) { have[h.id] = 1; });
      list.forEach(function (h) { if (!have[h.id]) { db.hist.push({ id: h.id, type: h.type, game: GAMES[h.type].name, title: String(h.title || '').slice(0, 60), date: h.date, names: h.names.map(String).slice(0, 12), result: h.result.slice(0, 300), lines: h.lines.map(String).slice(0, 20), scores: h.scores.slice(0, 12).map(Number), disp: Array.isArray(h.disp) ? h.disp.slice(0, 12).map(String) : null }); added++; } });
      db.hist.sort(function (a, b) { return b.date < a.date ? -1 : 1; }); save(); drawHist();
      say('ok', 'Imported ' + added + ' match' + (added === 1 ? '' : 'es') + (list.length - added ? ' (' + (list.length - added) + ' already here)' : '') + '.');
    });
  });
  $('sbWipe').addEventListener('click', function () { if (!db.hist.length) return; if (!confirm('Delete all ' + db.hist.length + ' saved matches from this device?')) return; db.hist = []; save(); drawHist(); say('', 'History deleted.'); });
  $('sbPrint').addEventListener('click', function () {
    var box = document.createElement('div'); box.className = 'sb-print';
    var cur = db.cur ? record(db.cur) : null, all = (cur ? [cur] : []).concat(db.hist);
    if (!all.length) { say('bad', 'Nothing to print yet.'); return; }
    box.innerHTML = '<h2>Match results</h2><p>Printed ' + esc(new Date().toLocaleString()) + '</p><table><thead><tr><th>Date</th><th>Game</th><th>Result</th><th>Details</th></tr></thead><tbody>' + all.map(function (h, k) { return '<tr><td>' + esc(new Date(h.date).toLocaleDateString()) + (cur && k === 0 ? '<br>(in progress)' : '') + '</td><td>' + esc((h.title ? h.title + ' · ' : '') + h.game) + '</td><td>' + esc(h.result) + '</td><td>' + h.lines.map(esc).join('<br>') + '</td></tr>'; }).join('') + '</tbody></table>';
    document.body.appendChild(box);
    var done = function () { box.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done); window.print(); setTimeout(function () { if (box.parentNode && !window.matchMedia('print').matches) done(); }, 1500);
  });

  showOpts(); drawHist();
  if (db.cur) { showLive(); say('', 'Your match is back where you left it.'); }
})();
</script>
