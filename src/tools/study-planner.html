<style>
.sp .sp-h { font-size: 18px; margin: 22px 0 10px; }
.sp .sp-h:first-child { margin-top: 0; }
.sp input[type=time] { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 44px; }
.sp textarea { min-height: 110px; }
.sp .sp-hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.sp .sp-exams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; margin-top: 14px; }
.sp .sp-exam { border: 1px solid var(--line); border-left: 5px solid var(--sc); border-radius: 12px; padding: 12px 14px; background: var(--surface); min-width: 0; }
.sp .sp-exam h4 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.sp .sp-exam .sp-meta { font-size: 13.5px; color: var(--muted); margin: 2px 0 8px; }
.sp .sp-cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.sp .sp-cd div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; }
.sp .sp-cd b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sp .sp-cd span { font-size: 11.5px; color: var(--muted); }
.sp .sp-exam.done .sp-cd { opacity: .55; }
.sp .sp-eb { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sp .sp-eb button { font: inherit; font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; min-height: 36px; cursor: pointer; }
.sp .sp-eb button:hover { border-color: var(--accent); color: var(--accent); }
.sp .sp-eb button.del:hover { border-color: var(--bad); color: var(--bad); }
.sp .sp-prog { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.sp .sp-prog .meter { margin-top: 4px; height: 6px; }
.sp .sp-prog .meter i { background: var(--sc); }
.sp .sp-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sp .sp-week label { font-size: 12.5px; text-align: center; margin-bottom: 3px; }
.sp .sp-week input { padding: 8px 4px; text-align: center; }
.sp .sp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sp .sp-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 3px 4px 3px 10px; }
.sp .sp-chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; width: 28px; height: 28px; border-radius: 50%; }
.sp .sp-chip button:hover { color: var(--bad); }
.sp .sp-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.sp .sp-row > div { flex: 1 1 160px; }
.sp .sp-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 16px 0 8px; }
.sp .sp-warn { margin: 10px 0; padding: 10px 12px; border-radius: 10px; border: 1px solid #f59e0b; background: color-mix(in srgb, #f59e0b 12%, var(--surface)); font-size: 14.5px; }
.sp .sp-warn p { margin: 2px 0; }
.sp .sp-day { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--surface); overflow: hidden; }
.sp .sp-dh { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--bg); font-weight: 600; font-size: 14.5px; flex-wrap: wrap; }
.sp .sp-dh small { font-weight: 500; color: var(--muted); }
.sp .sp-day.today { border-color: var(--accent); }
.sp .sp-day.today .sp-dh { background: var(--accent-soft); }
.sp .sp-ses { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 15px; margin: 0; font-weight: 400; cursor: pointer; }
.sp .sp-ses input { flex: none; margin: 0; width: 20px; height: 20px; }
.sp .sp-ses .sp-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--sc); }
.sp .sp-ses span.t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sp .sp-ses b.h { flex: none; font-variant-numeric: tabular-nums; font-size: 14px; }
.sp .sp-ses.is-done span.t { text-decoration: line-through; color: var(--muted); }
.sp .sp-tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--sc); color: #fff; margin-inline-end: 4px; vertical-align: 1px; }
.sp .sp-none { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.sp .sp-examrow { padding: 8px 12px; border-top: 1px solid var(--line); font-weight: 700; font-size: 14.5px; }
.sp .sp-cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sp .sp-cal-nav b { font-size: 17px; }
.sp .sp-cal-nav button { font: inherit; width: 44px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; font-size: 18px; }
.sp .sp-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.sp .sp-cal .wd { font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; }
.sp .sp-cell { min-height: 84px; border: 1px solid var(--line); border-radius: 8px; padding: 4px; background: var(--surface); font-size: 12px; text-align: start; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
.sp .sp-cell.out { opacity: .35; }
.sp .sp-cell.rest { background: var(--bg); }
.sp .sp-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sp .sp-cell.sel { background: var(--accent-soft); }
.sp .sp-cell .n { font-size: 12.5px; font-weight: 700; }
.sp .sp-cell .c { display: block; font-size: 11px; line-height: 1.25; padding: 1px 4px; border-radius: 4px; background: color-mix(in srgb, var(--sc) 18%, var(--surface)); border-left: 3px solid var(--sc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .sp-cell .c.ok { opacity: .55; text-decoration: line-through; }
.sp .sp-cell .x { display: block; font-size: 11px; font-weight: 800; color: #fff; background: var(--sc); border-radius: 4px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp #spDayBox { margin-top: 12px; }
.sp .sp-empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
@media (max-width: 560px) {
  .sp .sp-cell { min-height: 58px; padding: 3px; }
  .sp .sp-cell .c, .sp .sp-cell .x { font-size: 0; height: 6px; padding: 0; border-left: 0; background: var(--sc); }
  .sp .sp-cell .c.ok { opacity: .35; text-decoration: none; }
  .sp .sp-week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
#spPrintBox { display: none; }
@media print {
  @page { margin: 12mm; }
  body > *:not(#spPrintBox) { display: none !important; }
  html, body { background: #fff !important; color: #000 !important; margin: 0 !important; padding: 0 !important; }
  #spPrintBox { display: block !important; color: #000; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10pt; }
  #spPrintBox h1 { font-size: 16pt; margin: 0 0 4pt; }
  #spPrintBox table { width: 100%; border-collapse: collapse; }
  #spPrintBox th, #spPrintBox td { border-bottom: 1px solid #ccc; padding: 4pt 5pt; text-align: left; vertical-align: top; }
  #spPrintBox tr { break-inside: avoid; }
  #spPrintBox .box { display: inline-block; width: 9pt; height: 9pt; border: 1px solid #000; margin-right: 4pt; vertical-align: -1pt; }
}
</style>
<div class="sp">
<h3 class="sp-h">1. Add your exams</h3>
<div class="fields">
  <div><label for="spSub">Subject</label><input type="text" id="spSub" data-nomemo placeholder="e.g. Maths" maxlength="60" autocomplete="off"></div>
  <div><label for="spDate">Exam date</label><input type="date" id="spDate" data-nomemo></div>
  <div><label for="spTime">Start time</label><input type="time" id="spTime" data-nomemo value="09:00"></div>
  <div><label for="spDiff">How hard is it for you?</label><select id="spDiff" data-nomemo><option value="1">1 – Easy</option><option value="2">2</option><option value="3" selected>3 – Medium</option><option value="4">4</option><option value="5">5 – Very hard</option></select></div>
</div>
<label for="spTopics">Chapters or topics <span class="sp-hint">one per line, add hours after a comma (no number = 2 hours)</span></label>
<textarea id="spTopics" class="plain" data-nomemo placeholder="Algebra, 3&#10;Geometry, 2&#10;Probability"></textarea>
<div class="btns">
  <button type="button" class="btn" id="spAdd">Add exam</button>
  <button type="button" class="btn ghost" id="spCancel" hidden>Cancel edit</button>
  <button type="button" class="btn ghost" id="spSample">Load an example</button>
</div>
<p class="msg" id="spMsg" aria-live="polite"></p>
<div class="sp-exams" id="spExams"></div>

<h3 class="sp-h">2. Your study time</h3>
<p class="sp-hint" style="margin:0 0 8px">Hours you can study on each day of the week. Use 0 for a day off.</p>
<div class="sp-week" id="spWeek"></div>
<div class="fields" style="margin-top:14px">
  <div><label for="spRev">Revision days before each exam</label><select id="spRev" data-nomemo><option value="0">None</option><option value="1" selected>1 day</option><option value="2">2 days</option><option value="3">3 days</option></select></div>
  <div><label for="spStart">Usual study start time <span class="sp-hint">(for the calendar file)</span></label><input type="time" id="spStart" data-nomemo value="16:00"></div>
</div>
<div class="sp-row">
  <div><label for="spRestDate">Add a rest day (no study)</label><input type="date" id="spRestDate" data-nomemo></div>
  <button type="button" class="btn ghost" id="spRestAdd">Add rest day</button>
</div>
<div class="sp-chips" id="spRest"></div>

<h3 class="sp-h">3. Your plan</h3>
<div class="stats">
  <div class="stat"><span>Next exam in</span><b id="spS1">–</b></div>
  <div class="stat"><span>Study hours planned</span><b id="spS2">0</b></div>
  <div class="stat"><span>Hours done</span><b id="spS3">0</b></div>
  <div class="stat"><span>Progress</span><b id="spS4">0%</b></div>
</div>
<div id="spWarn"></div>
<div class="sp-tools">
  <div class="seg" role="group" aria-label="Plan view"><button type="button" data-v="list" aria-pressed="true">List</button><button type="button" data-v="cal" aria-pressed="false">Calendar</button></div>
  <div class="btns" style="margin:0">
    <button type="button" class="btn ghost" id="spReplan" title="Spread the remaining work again from today">↻ Re-plan</button>
    <button type="button" class="btn ghost" id="spIcs">Export .ics</button>
    <button type="button" class="btn ghost" id="spPrint">Print</button>
  </div>
</div>
<div id="spPlan"></div>
<div class="btns"><button type="button" class="btn ghost danger" id="spClear">Delete all exams and progress</button></div>
</div>
<script>
(function () {
  var KEY = 'gtn-study-planner';
  var COLORS = ['#2563eb', '#db2777', '#059669', '#d97706', '#7c3aed', '#0891b2', '#dc2626', '#65a30d', '#9333ea', '#0d9488'];
  var MULT = { 1: 0.8, 2: 0.9, 3: 1, 4: 1.15, 5: 1.3 }; // harder subjects get extra time
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function blank() { return { exams: [], hours: [2, 3, 3, 3, 3, 3, 2], rest: [], rev: 1, start: '16:00', log: [], view: 'list' }; }
  var S = blank();
  try {
    var o = JSON.parse(localStorage.getItem(KEY));
    if (o && Array.isArray(o.exams)) {
      S.exams = o.exams.filter(function (e) { return e && e.id && e.subject && /^\d{4}-\d\d-\d\d$/.test(e.date) && Array.isArray(e.topics); });
      if (Array.isArray(o.hours) && o.hours.length === 7) S.hours = o.hours.map(function (h) { return Math.max(0, Math.min(16, +h || 0)); });
      if (Array.isArray(o.rest)) S.rest = o.rest.filter(function (d) { return /^\d{4}-\d\d-\d\d$/.test(d); });
      if (o.rev >= 0 && o.rev <= 3) S.rev = +o.rev;
      if (/^\d\d:\d\d$/.test(o.start)) S.start = o.start;
      if (Array.isArray(o.log)) S.log = o.log.filter(function (l) { return l && l.date && l.exam && l.h > 0; });
      if (o.view === 'cal') S.view = 'cal';
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // ---------- dates (local, as YYYY-MM-DD strings) ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function add(s, n) { var d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
  function today() { return ds(new Date()); }
  function nice(s, long) { var d = pd(s); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + (long ? ' ' + d.getFullYear() : ''); }
  function hrs(h) { h = Math.round(h * 100) / 100; return (h % 1 ? h.toFixed(1).replace(/\.0$/, '') : String(h)) + ' h'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function examAt(e) { var d = pd(e.date), t = (e.time || '09:00').split(':'); d.setHours(+t[0], +t[1], 0, 0); return d; }
  function byId(id) { for (var i = 0; i < S.exams.length; i++) if (S.exams[i].id === id) return S.exams[i]; return null; }

  // ---------- the planner ----------
  /*PLAN*/
  function plan(st, t0) {
    var exams = st.exams.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var future = exams.filter(function (e) { return e.date > t0; });
    var out = { days: [], sessions: {}, short: [], need: {}, doneH: {}, last: null };
    exams.forEach(function (e) { out.need[e.id] = 0; out.doneH[e.id] = 0; });
    st.log.forEach(function (l) { if (out.doneH[l.exam] != null) out.doneH[l.exam] += l.h; });
    if (!future.length) return out;
    var last = future[future.length - 1].date; out.last = last;
    var days = [], cap = {}, free = {}, restSet = {};
    st.rest.forEach(function (r) { restSet[r] = 1; });
    for (var d = t0; d < last; d = add(d, 1)) days.push(d);
    days.forEach(function (d) {
      var c = restSet[d] ? 0 : (+st.hours[pd(d).getDay()] || 0);
      st.log.forEach(function (l) { if (l.date === d) c -= l.h; });
      cap[d] = Math.max(0, c); out.sessions[d] = [];
    });
    // remaining hours per topic (estimated hours × difficulty factor, minus what is already done)
    var rem = {};
    future.forEach(function (e) {
      var m = MULT[e.diff] || 1, tot = 0;
      rem[e.id] = e.topics.map(function (t) {
        var need = Math.round(t.h * m * 2) / 2, done = 0;
        st.log.forEach(function (l) { if (l.exam === e.id && l.kind === 'study' && l.topic === t.n) done += l.h; });
        tot += need;
        return { n: t.n, r: Math.max(0, need - done) };
      });
      out.need[e.id] = tot;
    });
    // revision days just before each exam: that day's time is shared by the exams being revised for
    var revFor = {};
    if (st.rev > 0) future.forEach(function (e) {
      for (var k = 1; k <= st.rev; k++) { var d = add(e.date, -k); if (cap[d] != null) (revFor[d] = revFor[d] || []).push(e); }
    });
    days.forEach(function (d) {
      free[d] = cap[d];
      var list = revFor[d]; if (!list || !cap[d]) return;
      var share = Math.floor(cap[d] * 2 / list.length) / 2;
      if (share < 0.5) share = cap[d] >= 0.5 ? 0.5 : 0;
      list.forEach(function (e) {
        if (free[d] < share || !share) return;
        out.sessions[d].push({ exam: e.id, topic: 'Revision', h: share, kind: 'rev' }); free[d] -= share; out.need[e.id] += share;
      });
    });
    // study: hand out half-hour blocks, each to the exam that is most behind (work left ÷ time left before it), weighted by difficulty
    var left = days.map(function (d) { return free[d]; });
    future.forEach(function (e) { e._w = 1 + ((+e.diff || 3) - 3) * 0.08; });
    days.forEach(function (d, i) {
      var prev = null, units = Math.floor(left[i] * 2);
      for (var u = 0; u < units; u++) {
        var best = null, bs = -1, ps = -1, limit = null, work = 0;
        // if the exams up to some date need all the time left before it, only those exams may use this block
        for (var k = 0; k < future.length; k++) {
          var fe = future[k]; if (fe.date <= d) continue;
          rem[fe.id].forEach(function (t) { work += t.r; });
          var avk = 0; for (var j = i; j < days.length && days[j] < fe.date; j++) avk += left[j];
          if (work > 0 && avk - work < 0.5) { limit = fe.date; break; }
        }
        future.forEach(function (e) {
          if (e.date <= d || (limit && e.date > limit)) return;
          var r = 0; rem[e.id].forEach(function (t) { r += t.r; }); if (r <= 0) return;
          var av = 0; for (var j = i; j < days.length && days[j] < e.date; j++) av += left[j];
          var sc = (av > 0 ? r / av : 99) * e._w;
          if (sc > bs) { bs = sc; best = e; }
          if (prev && e.id === prev.id) ps = sc;
        });
        if (!best) break;
        if (prev && ps >= bs * 0.85) best = prev; // keep going with the same subject when it is almost as urgent
        var tp = rem[best.id].filter(function (t) { return t.r > 0; })[0];
        tp.r -= 0.5; left[i] -= 0.5; prev = best;
        var ss = out.sessions[d], lastS = ss[ss.length - 1];
        if (lastS && lastS.exam === best.id && lastS.topic === tp.n && lastS.kind === 'study') lastS.h += 0.5;
        else ss.push({ exam: best.id, topic: tp.n, h: 0.5, kind: 'study' });
      }
    });
    future.forEach(function (e) {
      var r = 0; rem[e.id].forEach(function (t) { r += Math.max(0, t.r); });
      if (r > 0) out.short.push({ exam: e.id, h: r });
    });
    out.days = days;
    return out;
  }
  /*PLAN-END*/

  // ---------- iCalendar ----------
  /*ICS*/
  function icsText(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  function fold(line) {
    var out = [], cur = '', n = 0;
    for (var ch of line) {
      var b = unescape(encodeURIComponent(ch)).length;
      if (n + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; n = 0; }
      cur += ch; n += b;
    }
    out.push(cur);
    return out.join('\r\n ');
  }
  function icsDate(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
  function buildIcs(st, p, now) {
    var stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GetToolNest//Study Planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Study plan'];
    function ev(id, a, b, sum, desc) {
      L.push('BEGIN:VEVENT', 'UID:' + id + '@gettoolnest-study-planner', 'DTSTAMP:' + stamp, 'DTSTART:' + icsDate(a), 'DTEND:' + icsDate(b), 'SUMMARY:' + icsText(sum));
      if (desc) L.push('DESCRIPTION:' + icsText(desc));
      L.push('END:VEVENT');
    }
    st.exams.forEach(function (e) {
      var a = examAt(e), b = new Date(a.getTime() + 2 * 3600e3);
      ev('exam-' + e.id, a, b, 'Exam: ' + e.subject, 'Difficulty ' + e.diff + '/5. Topics: ' + e.topics.map(function (t) { return t.n; }).join(', '));
    });
    var hm = (st.start || '16:00').split(':');
    p.days.forEach(function (d) {
      var t = pd(d); t.setHours(+hm[0], +hm[1], 0, 0);
      p.sessions[d].forEach(function (s, i) {
        var e = byIdIn(st, s.exam); if (!e) return;
        var b = new Date(t.getTime() + s.h * 3600e3);
        ev('s-' + d.replace(/-/g, '') + '-' + i + '-' + e.id, t, b, (s.kind === 'rev' ? 'Revise: ' : 'Study: ') + e.subject + (s.kind === 'rev' ? '' : ' – ' + s.topic), hrs(s.h) + ' for your ' + e.subject + ' exam on ' + nice(e.date, true) + '.');
        t = new Date(b.getTime() + 15 * 60e3); // 15 minute break between sessions
      });
    });
    L.push('END:VCALENDAR');
    return L.map(fold).join('\r\n') + '\r\n';
  }
  function byIdIn(st, id) { for (var i = 0; i < st.exams.length; i++) if (st.exams[i].id === id) return st.exams[i]; return null; }
  /*ICS-END*/

  // ---------- form ----------
  var editing = null;
  function parseTopics(txt) {
    var out = [];
    txt.split(/\n/).forEach(function (line) {
      line = line.trim(); if (!line) return;
      var m = /^(.*?)[,;:\t]\s*(\d+(?:[.,]\d+)?)\s*(h|hrs?|hours?)?$/i.exec(line), n = line, h = 2;
      if (m && m[1].trim()) { n = m[1].trim(); h = parseFloat(m[2].replace(',', '.')); }
      h = Math.max(0.5, Math.min(100, Math.round(h * 2) / 2));
      n = n.slice(0, 80);
      var same = out.filter(function (t) { return t.n === n; })[0];
      if (same) same.h += h; else out.push({ n: n, h: h });
    });
    return out;
  }
  function say(cls, t) { var m = $('spMsg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t; }
  $('spDate').min = today();
  $('spAdd').addEventListener('click', function () {
    var sub = $('spSub').value.trim(), date = $('spDate').value, time = $('spTime').value || '09:00', diff = +$('spDiff').value || 3;
    if (!sub) { say('bad', 'Type the subject name first.'); $('spSub').focus(); return; }
    if (!/^\d{4}-\d\d-\d\d$/.test(date)) { say('bad', 'Pick the exam date.'); $('spDate').focus(); return; }
    if (date < today() && !editing) { say('bad', 'That date has already passed. Pick a date from today on.'); $('spDate').focus(); return; }
    if (date > add(today(), 730)) { say('bad', 'Pick a date within the next two years.'); return; }
    var topics = parseTopics($('spTopics').value);
    if (!topics.length) topics = [{ n: 'All topics', h: 6 }];
    if (editing) {
      var e = byId(editing);
      if (e) {
        // keep progress on topics that keep their name
        e.subject = sub; e.date = date; e.time = time; e.diff = diff; e.topics = topics;
      }
      say('ok', sub + ' updated. The plan has been rebuilt.');
      stopEdit();
    } else {
      if (S.exams.length >= 30) { say('bad', 'You can plan up to 30 exams.'); return; }
      var used = S.exams.map(function (x) { return x.color; }), col = COLORS.filter(function (c) { return used.indexOf(c) === -1; })[0] || COLORS[S.exams.length % COLORS.length];
      S.exams.push({ id: uid(), subject: sub, date: date, time: time, diff: diff, topics: topics, color: col });
      say('ok', sub + ' added with ' + topics.length + (topics.length === 1 ? ' topic.' : ' topics.'));
      $('spSub').value = ''; $('spTopics').value = ''; $('spDiff').value = '3';
      if (window.burst) burst($('spAdd'));
    }
    save(); render();
  });
  function stopEdit() { editing = null; $('spAdd').textContent = 'Add exam'; $('spCancel').hidden = true; $('spSub').value = ''; $('spTopics').value = ''; $('spDiff').value = '3'; $('spTime').value = '09:00'; $('spDate').value = ''; }
  $('spCancel').addEventListener('click', function () { stopEdit(); say('', ''); });
  $('spSample').addEventListener('click', function () {
    if (S.exams.length && !confirm('Add the example exams to your list?')) return;
    var t = today();
    S.exams.push({ id: uid(), subject: 'Maths', date: add(t, 12), time: '09:00', diff: 4, color: COLORS[0], topics: [{ n: 'Algebra', h: 4 }, { n: 'Trigonometry', h: 3 }, { n: 'Calculus', h: 5 }, { n: 'Statistics', h: 2 }] });
    S.exams.push({ id: uid(), subject: 'Biology', date: add(t, 8), time: '13:30', diff: 3, color: COLORS[1], topics: [{ n: 'Cells', h: 2 }, { n: 'Genetics', h: 3 }, { n: 'Ecology', h: 2 }] });
    S.exams.push({ id: uid(), subject: 'History', date: add(t, 17), time: '09:00', diff: 2, color: COLORS[2], topics: [{ n: 'World War I', h: 3 }, { n: 'The Cold War', h: 3 }, { n: 'Essay practice', h: 2 }] });
    var cols = S.exams.map(function (e) { return e.color; });
    S.exams.forEach(function (e, i) { if (cols.indexOf(e.color) !== i) e.color = COLORS[i % COLORS.length]; });
    save(); render(); say('ok', 'Example exams added. Change or delete them any time.');
  });

  // ---------- study time ----------
  var week = $('spWeek');
  [1, 2, 3, 4, 5, 6, 0].forEach(function (w) {
    var d = document.createElement('div');
    d.innerHTML = '<label for="spW' + w + '">' + WD[w] + '</label><input type="number" id="spW' + w + '" data-nomemo min="0" max="16" step="0.5" inputmode="decimal">';
    week.appendChild(d);
    var inp = d.querySelector('input'); inp.value = S.hours[w];
    inp.addEventListener('change', function () { var v = Math.max(0, Math.min(16, Math.round((parseFloat(inp.value) || 0) * 2) / 2)); inp.value = v; S.hours[w] = v; save(); render(); });
  });
  $('spRev').value = S.rev; $('spStart').value = S.start;
  $('spRev').addEventListener('change', function () { S.rev = +$('spRev').value; save(); render(); });
  $('spStart').addEventListener('change', function () { if (/^\d\d:\d\d$/.test($('spStart').value)) { S.start = $('spStart').value; save(); } });
  $('spRestAdd').addEventListener('click', function () {
    var d = $('spRestDate').value;
    if (!d) { $('spRestDate').focus(); return; }
    if (S.rest.indexOf(d) === -1) S.rest.push(d);
    S.rest.sort(); $('spRestDate').value = ''; save(); render();
  });

  // ---------- rendering ----------
  var P = null, calMonth = null, selDay = null;
  function render() {
    S.rest = S.rest.filter(function (d) { return d >= add(today(), -1); });
    P = plan(S, today());
    renderExams(); renderRest(); renderStats(); renderPlan();
  }
  function renderRest() {
    var box = $('spRest'); box.innerHTML = '';
    S.rest.forEach(function (d) {
      var c = document.createElement('span'); c.className = 'sp-chip'; c.innerHTML = 'Rest: ' + nice(d) + ' <button type="button" aria-label="Remove rest day ' + nice(d) + '">×</button>';
      c.querySelector('button').addEventListener('click', function () { S.rest.splice(S.rest.indexOf(d), 1); save(); render(); });
      box.appendChild(c);
    });
  }
  function renderExams() {
    var box = $('spExams'); box.innerHTML = '';
    S.exams.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (e) {
      var c = document.createElement('div'); c.className = 'sp-exam'; c.style.setProperty('--sc', e.color); c.dataset.id = e.id;
      var need = P.need[e.id] || 0, done = P.doneH[e.id] || 0, pct = need ? Math.min(100, Math.round(done / need * 100)) : 0;
      c.innerHTML = '<h4>' + esc(e.subject) + '</h4><div class="sp-meta">' + nice(e.date, true) + ' at ' + esc(e.time || '09:00') + ' · difficulty ' + e.diff + '/5 · ' + e.topics.length + (e.topics.length === 1 ? ' topic' : ' topics') + '</div>' +
        '<div class="sp-cd" aria-label="Time left"><div><b data-u="d">0</b><span>days</span></div><div><b data-u="h">0</b><span>hours</span></div><div><b data-u="m">0</b><span>min</span></div><div><b data-u="s">0</b><span>sec</span></div></div>' +
        '<div class="sp-prog">' + hrs(done) + ' of ' + hrs(need) + ' done (' + pct + '%)<div class="meter"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="sp-eb"><button type="button" class="ed">Edit</button><button type="button" class="del">Delete</button></div>';
      c.querySelector('.ed').addEventListener('click', function () {
        editing = e.id; $('spSub').value = e.subject; $('spDate').value = e.date; $('spTime').value = e.time || '09:00'; $('spDiff').value = e.diff;
        $('spTopics').value = e.topics.map(function (t) { return t.n + ', ' + t.h; }).join('\n');
        $('spAdd').textContent = 'Save changes'; $('spCancel').hidden = false; say('', 'Editing ' + e.subject + '. Change the details and click Save changes.');
        $('spSub').scrollIntoView({ block: 'center', behavior: 'smooth' }); $('spSub').focus({ preventScroll: true });
      });
      c.querySelector('.del').addEventListener('click', function () {
        if (!confirm('Delete the ' + e.subject + ' exam and its progress?')) return;
        S.exams = S.exams.filter(function (x) { return x.id !== e.id; }); S.log = S.log.filter(function (l) { return l.exam !== e.id; });
        if (editing === e.id) stopEdit();
        save(); render();
      });
      box.appendChild(c);
    });
    tick();
  }
  function tick() {
    var now = Date.now();
    document.querySelectorAll('.sp-exam').forEach(function (c) {
      var e = byId(c.dataset.id); if (!e) return;
      var ms = examAt(e).getTime() - now, past = ms <= 0; ms = Math.max(0, ms);
      var v = { d: Math.floor(ms / 864e5), h: Math.floor(ms / 36e5) % 24, m: Math.floor(ms / 6e4) % 60, s: Math.floor(ms / 1e3) % 60 };
      c.classList.toggle('done', past);
      c.querySelectorAll('.sp-cd b').forEach(function (b) { var t = String(v[b.dataset.u]); if (b.textContent !== t) b.textContent = t; });
      if (past && !c.querySelector('.sp-over')) { var p = document.createElement('div'); p.className = 'sp-meta sp-over'; p.style.margin = '6px 0 0'; p.textContent = 'This exam has started or is over. Good luck!'; c.querySelector('.sp-cd').after(p); }
    });
    var next = S.exams.filter(function (e) { return examAt(e).getTime() > now; }).sort(function (a, b) { return examAt(a) - examAt(b); })[0];
    var s1 = $('spS1');
    if (!next) s1.textContent = '–';
    else { var ms = examAt(next).getTime() - now, d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24; s1.textContent = (d ? d + 'd ' : '') + h + 'h · ' + next.subject; }
  }
  setInterval(tick, 1000);
  function renderStats() {
    var planned = 0, done = 0;
    P.days.forEach(function (d) { P.sessions[d].forEach(function (s) { planned += s.h; }); });
    S.log.forEach(function (l) { done += l.h; });
    $('spS2').textContent = hrs(planned).replace(' h', '');
    $('spS3').textContent = hrs(done).replace(' h', '');
    $('spS4').textContent = (planned + done ? Math.round(done / (planned + done) * 100) : 0) + '%';
    var w = $('spWarn'); w.innerHTML = '';
    if (P.short.length) {
      var box = document.createElement('div'); box.className = 'sp-warn';
      box.innerHTML = '<p><b>Not enough time for everything.</b> Add study hours, remove rest days or cut some topics:</p>' + P.short.map(function (s) { var e = byId(s.exam); return '<p>• ' + esc(e.subject) + ' needs about ' + hrs(s.h) + ' more before ' + nice(e.date) + '.</p>'; }).join('');
      w.appendChild(box);
    }
  }
  function sessionRow(d, s, i, done) {
    var e = byId(s.exam); if (!e) return null;
    var lab = document.createElement('label'); lab.className = 'sp-ses' + (done ? ' is-done' : ''); lab.style.setProperty('--sc', e.color);
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!done; cb.setAttribute('data-nomemo', '');
    cb.setAttribute('aria-label', (done ? 'Done: ' : 'Mark done: ') + e.subject + ' ' + s.topic + ', ' + hrs(s.h));
    lab.appendChild(cb);
    lab.insertAdjacentHTML('beforeend', '<i class="sp-dot"></i><span class="t">' + (s.kind === 'rev' ? '<span class="sp-tag">Revision</span>' : '') + '<b>' + esc(e.subject) + '</b>' + (s.kind === 'rev' ? ' – go over everything, past papers' : ' – ' + esc(s.topic)) + '</span><b class="h">' + hrs(s.h) + '</b>');
    cb.addEventListener('change', function () {
      if (cb.checked) { S.log.push({ id: uid(), date: d, exam: s.exam, topic: s.topic, h: s.h, kind: s.kind }); if (window.burst) burst(cb); if (window.toast) toast('Nice work! The rest of the plan has been updated.'); }
      else S.log = S.log.filter(function (l) { return l.id !== done.id; });
      save(); render();
    });
    return lab;
  }
  function dayBox(d) {
    var box = document.createElement('div'); box.className = 'sp-day' + (d === today() ? ' today' : '');
    var ss = (P.sessions[d] || []), logs = S.log.filter(function (l) { return l.date === d; }), exams = S.exams.filter(function (e) { return e.date === d; });
    var tot = 0; ss.forEach(function (s) { tot += s.h; }); logs.forEach(function (l) { tot += l.h; });
    var label = d === today() ? 'Today · ' : d === add(today(), 1) ? 'Tomorrow · ' : '';
    var rest = S.rest.indexOf(d) !== -1 || !(+S.hours[pd(d).getDay()]);
    box.innerHTML = '<div class="sp-dh"><span>' + label + nice(d) + '</span><small>' + (tot ? hrs(tot) : rest ? 'Rest day' : '') + '</small></div>';
    exams.forEach(function (e) { var r = document.createElement('div'); r.className = 'sp-examrow'; r.style.color = e.color; r.textContent = '📝 ' + e.subject + ' exam at ' + (e.time || '09:00'); box.appendChild(r); });
    logs.forEach(function (l) { var row = sessionRow(d, l, 0, l); if (row) box.appendChild(row); });
    ss.forEach(function (s, i) { var row = sessionRow(d, s, i, null); if (row) box.appendChild(row); });
    if (!ss.length && !logs.length && !exams.length) { var n = document.createElement('div'); n.className = 'sp-none'; n.textContent = rest ? 'Rest day. Enjoy it!' : 'Free – nothing left to plan for this day.'; box.appendChild(n); }
    return box;
  }
  function renderPlan() {
    var box = $('spPlan'); box.innerHTML = '';
    document.querySelectorAll('.sp .seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === S.view); });
    if (!S.exams.length) { box.innerHTML = '<div class="sp-empty">Add your first exam above, or click <b>Load an example</b>, to see a day-by-day plan.</div>'; return; }
    if (!P.days.length) {
      box.innerHTML = '<div class="sp-empty">All your exams are today or already over. Add your next exam to make a new plan.</div>';
      if (S.exams.some(function (e) { return e.date === today(); })) box.prepend(dayBox(today()));
      return;
    }
    if (S.view === 'cal') return renderCal(box);
    P.days.concat([P.last]).forEach(function (d) { box.appendChild(dayBox(d)); });
  }
  function renderCal(box) {
    var t = today();
    if (!calMonth) calMonth = t.slice(0, 7);
    var y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7) - 1;
    var nav = document.createElement('div'); nav.className = 'sp-cal-nav';
    nav.innerHTML = '<button type="button" aria-label="Previous month">‹</button><b>' + MONL[m] + ' ' + y + '</b><button type="button" aria-label="Next month">›</button>';
    var bs = nav.querySelectorAll('button');
    bs[0].addEventListener('click', function () { var d = new Date(y, m - 1, 1); calMonth = ds(d).slice(0, 7); renderPlan(); });
    bs[1].addEventListener('click', function () { var d = new Date(y, m + 1, 1); calMonth = ds(d).slice(0, 7); renderPlan(); });
    box.appendChild(nav);
    var g = document.createElement('div'); g.className = 'sp-cal';
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(function (w) { var h = document.createElement('div'); h.className = 'wd'; h.textContent = w; g.appendChild(h); });
    var first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, start = ds(new Date(y, m, 1 - off));
    for (var i = 0; i < 42; i++) {
      var d = add(start, i);
      if (i >= 35 && d.slice(0, 7) !== calMonth) break;
      var c = document.createElement('button'); c.type = 'button';
      var rest = S.rest.indexOf(d) !== -1;
      c.className = 'sp-cell' + (d.slice(0, 7) !== calMonth ? ' out' : '') + (d === t ? ' today' : '') + (rest ? ' rest' : '') + (d === selDay ? ' sel' : '');
      var h = '<span class="n">' + (+d.slice(8)) + '</span>', tot = 0, parts = [];
      S.exams.forEach(function (e) { if (e.date === d) h += '<span class="x" style="--sc:' + e.color + '">📝 ' + esc(e.subject) + '</span>'; });
      S.log.forEach(function (l) { var e = byId(l.exam); if (l.date === d && e) { h += '<span class="c ok" style="--sc:' + e.color + '">' + esc(e.subject) + ' ' + hrs(l.h) + '</span>'; tot += l.h; } });
      (P.sessions[d] || []).forEach(function (s) { var e = byId(s.exam); if (e) { h += '<span class="c" style="--sc:' + e.color + '">' + (s.kind === 'rev' ? 'Rev ' : '') + esc(e.subject) + ' ' + hrs(s.h) + '</span>'; tot += s.h; parts.push(e.subject); } });
      c.innerHTML = h;
      c.setAttribute('aria-label', nice(d, true) + (tot ? ', ' + hrs(tot) + ' of study' : '') + (rest ? ', rest day' : ''));
      (function (d) { c.addEventListener('click', function () { selDay = d; renderPlan(); var b = $('spDayBox'); if (b) b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }); })(d);
      g.appendChild(c);
    }
    box.appendChild(g);
    var db = document.createElement('div'); db.id = 'spDayBox';
    var sd = selDay || (t.slice(0, 7) === calMonth ? t : null);
    if (sd) db.appendChild(dayBox(sd)); else { db.className = 'msg'; db.textContent = 'Tap a day to see its sessions.'; }
    box.appendChild(db);
  }
  document.querySelectorAll('.sp .seg button').forEach(function (b) {
    b.addEventListener('click', function () { S.view = b.dataset.v; save(); renderPlan(); });
  });
  $('spReplan').addEventListener('click', function () { render(); if (window.toast) toast('Plan rebuilt from today.'); burst && burst($('spReplan')); });
  $('spIcs').addEventListener('click', function () {
    if (!S.exams.length) { say('bad', 'Add an exam first.'); return; }
    var blob = new Blob([buildIcs(S, P, new Date())], { type: 'text/calendar;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'study-plan.ics';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    if (window.toast) toast('Calendar file saved. Open it to add the plan to your calendar.');
  });
  $('spPrint').addEventListener('click', function () {
    if (!S.exams.length) { say('bad', 'Add an exam first.'); return; }
    var box = $('spPrintBox');
    if (!box) { box = document.createElement('div'); box.id = 'spPrintBox'; document.body.appendChild(box); }
    var h = '<h1>Study plan</h1><p>Exams: ' + S.exams.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).map(function (e) { return '<b>' + esc(e.subject) + '</b> ' + nice(e.date, true) + ' ' + esc(e.time || ''); }).join(' · ') + '</p>';
    h += '<table><thead><tr><th>Day</th><th>Sessions</th><th>Hours</th></tr></thead><tbody>';
    P.days.concat(P.last ? [P.last] : []).forEach(function (d) {
      var ss = P.sessions[d] || [], ex = S.exams.filter(function (e) { return e.date === d; }), lg = S.log.filter(function (l) { return l.date === d; }), tot = 0;
      var items = ex.map(function (e) { return '<b>EXAM: ' + esc(e.subject) + ' ' + esc(e.time || '') + '</b>'; });
      lg.forEach(function (l) { var e = byId(l.exam); if (e) { items.push('✓ ' + esc(e.subject) + ' – ' + esc(l.kind === 'rev' ? 'Revision' : l.topic) + ' (' + hrs(l.h) + ')'); tot += l.h; } });
      ss.forEach(function (s) { var e = byId(s.exam); if (e) { items.push('<span class="box"></span>' + esc(e.subject) + ' – ' + esc(s.kind === 'rev' ? 'Revision' : s.topic) + ' (' + hrs(s.h) + ')'); tot += s.h; } });
      h += '<tr><td>' + nice(d) + '</td><td>' + (items.join('<br>') || 'Rest') + '</td><td>' + (tot ? hrs(tot) : '') + '</td></tr>';
    });
    box.innerHTML = h + '</tbody></table>';
    window.print();
  });
  $('spClear').addEventListener('click', function () {
    if (!S.exams.length && !S.log.length) return;
    if (!confirm('Delete all exams, rest days and progress? This cannot be undone.')) return;
    var keep = { hours: S.hours, rev: S.rev, start: S.start, view: S.view };
    S = blank(); S.hours = keep.hours; S.rev = keep.rev; S.start = keep.start; S.view = keep.view;
    stopEdit(); save(); render(); say('', 'Everything was deleted.');
  });
  // a new day starts: rebuild the plan from the new date
  var lastDay = today();
  setInterval(function () { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
  render();
})();
</script>
