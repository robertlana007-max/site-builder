<style>
.cpg .cpg-tabs { display: inline-flex; padding: 4px; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.cpg .cpg-tabs button { font: inherit; font-weight: 700; font-size: 14px; height: 38px; padding: 0 18px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer; }
.cpg .cpg-tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.cpg .cpg-sw { display: flex; border-radius: 14px; overflow: hidden; min-height: 260px; border: 1px solid var(--line); }
.cpg .cpg-c { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 10px 4px; gap: 4px; position: relative; }
.cpg .cpg-c b { font: 700 15px/1.2 var(--mono, monospace); cursor: pointer; border-radius: 6px; padding: 2px 4px; background: none; border: 0; color: inherit; }
.cpg .cpg-c small { font-size: 11.5px; opacity: .85; text-align: center; overflow-wrap: anywhere; }
.cpg .cpg-c .cpg-ic { display: flex; gap: 2px; }
.cpg .cpg-c button.cpg-i { width: 34px; height: 34px; border-radius: 8px; border: 0; background: rgba(255,255,255,.18); color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; position: relative; overflow: hidden; }
.cpg .cpg-c.dk button.cpg-i { background: rgba(0,0,0,.08); }
.cpg .cpg-c button.cpg-i[aria-pressed="true"] { background: rgba(0,0,0,.35); color: #fff; }
.cpg .cpg-c input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
@media (max-width: 600px) { .cpg .cpg-sw { flex-direction: column; min-height: 0; } .cpg .cpg-c { flex-direction: row; justify-content: space-between; padding: 10px 12px; min-height: 62px; } .cpg .cpg-c small { text-align: start; flex: 1; } }
.cpg .cpg-saved { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.cpg .cpg-saved button { display: flex; height: 40px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); padding: 0; cursor: pointer; }
.cpg .cpg-saved button i { flex: 1; }
.cpg .cpg-grad { height: 220px; border-radius: 14px; border: 1px solid var(--line); }
.cpg .cpg-stop { display: grid; grid-template-columns: 52px 1fr 70px 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
.cpg .cpg-stop input[type=color], .cpg .cpg-stop input[type=range] { width: 100%; }
.cpg .cpg-stop input[type=color] { height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--field); }
.cpg .cpg-stop button { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font-size: 18px; }
.cpg .cpg-pre { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin: 8px 0 14px; }
.cpg .cpg-pre button { height: 44px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; }
.cpg h3 { font-size: 15px; margin: 18px 0 6px; }
</style>
<div class="cpg" id="cpg">
<div class="cpg-tabs" role="tablist"><button type="button" role="tab" id="cpTabP" aria-selected="true">Palette</button><button type="button" role="tab" id="cpTabG" aria-selected="false">Gradient</button></div>
<div id="cpPal">
  <div class="fields">
    <div><label for="cpMode">Colour rule</label><select id="cpMode"><option value="random">Random (nice colours)</option><option value="analogous">Analogous (neighbours)</option><option value="complementary">Complementary (opposites)</option><option value="split">Split complementary</option><option value="triadic">Triadic (three-way)</option><option value="tetradic">Square (four-way)</option><option value="mono">Monochrome (one hue)</option><option value="pastel">Pastel</option><option value="earth">Earthy and muted</option></select></div>
    <div><label for="cpBase">Start from colour (optional)</label><input type="text" id="cpBase" data-nomemo maxlength="7" placeholder="#3b82f6" autocomplete="off"></div>
    <div><label for="cpN">Colours</label><select id="cpN"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option></select></div>
  </div>
  <div class="cpg-sw" id="cpSw"></div>
  <p class="msg" style="font-size:13.5px">Tap a code to copy it. 🔒 keeps a colour when you generate again, the pencil lets you pick it yourself. Press the space bar to generate.</p>
  <div class="btns">
    <button type="button" class="btn" id="cpGo">Generate</button>
    <button type="button" class="btn ghost" id="cpCss">Copy CSS</button>
    <button type="button" class="btn ghost" id="cpHex">Copy HEX list</button>
    <button type="button" class="btn ghost" id="cpPng">Download PNG</button>
    <button type="button" class="btn ghost" id="cpSave">Save palette</button>
    <button type="button" class="btn ghost" id="cpToGrad">Make a gradient</button>
  </div>
  <h3>Saved palettes</h3>
  <div class="cpg-saved" id="cpSaved"></div><p class="msg" id="cpNoSaved" style="margin-top:4px">Nothing saved yet. Saved palettes stay on this device.</p>
</div>
<div id="cpGrad" hidden>
  <div class="cpg-grad" id="cpGradView"></div>
  <div class="fields" style="margin-top:14px">
    <div><label for="cpGType">Type</label><select id="cpGType"><option value="linear">Linear</option><option value="radial">Radial</option><option value="conic">Conic</option></select></div>
    <div><label for="cpGAngle">Angle: <span id="cpGAngleV">90</span>°</label><input type="range" id="cpGAngle" min="0" max="360" value="90"></div>
  </div>
  <label>Colour stops</label>
  <div id="cpStops"></div>
  <div class="btns" style="margin:0 0 10px"><button type="button" class="btn ghost" id="cpAddStop">+ Add colour</button><button type="button" class="btn ghost" id="cpGRand">Random gradient</button></div>
  <label>Ideas</label>
  <div class="cpg-pre" id="cpPre"></div>
  <label for="cpGCode">CSS</label>
  <textarea id="cpGCode" data-nomemo readonly style="min-height:70px"></textarea>
  <div class="btns"><button type="button" class="btn" id="cpGCopy">Copy CSS</button><button type="button" class="btn ghost" id="cpGPng">Download PNG (1920 × 1080)</button></div>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
<script>
(function () {
  'use strict';
  var SAVEKEY = 'gtnPalettes';
  var cols = [], locks = [];
  function say(c, t) { var m = $('msg'); m.className = 'msg ' + (c || ''); m.textContent = t || ''; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function hsl2hex(h, s, l) { h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100; var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l), f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); }; return '#' + [f(0), f(8), f(4)].map(function (x) { var v = Math.round(x * 255); return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
  function hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function hex2hsl(h) { var c = hex2rgb(h).map(function (x) { return x / 255; }), mx = Math.max.apply(0, c), mn = Math.min.apply(0, c), l = (mx + mn) / 2, d = mx - mn, s = 0, hh = 0; if (d) { s = d / (1 - Math.abs(2 * l - 1)); hh = mx === c[0] ? ((c[1] - c[2]) / d) % 6 : mx === c[1] ? (c[2] - c[0]) / d + 2 : (c[0] - c[1]) / d + 4; hh *= 60; if (hh < 0) hh += 360; } return [Math.round(hh), Math.round(s * 100), Math.round(l * 100)]; }
  function lum(h) { var c = hex2rgb(h).map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
  function normHex(t) { t = String(t || '').trim().replace(/^#?/, '#').toLowerCase(); if (/^#[0-9a-f]{3}$/.test(t)) t = '#' + t.slice(1).replace(/./g, '$&$&'); return /^#[0-9a-f]{6}$/.test(t) ? t : null; }
  function R(a, b) { return a + Math.random() * (b - a); }
  function harmony(mode, n, base) {
    var h = base ? base[0] : R(0, 360), s = base ? clamp(base[1], 35, 90) : R(50, 80), l = base ? clamp(base[2], 30, 70) : R(42, 62), out = [];
    var offs = { analogous: [0, 25, -25, 50, -50, 12, -12, 37], complementary: [0, 180, 0, 180, 0, 180, 0, 180], split: [0, 150, 210, 0, 150, 210, 0, 150], triadic: [0, 120, 240, 0, 120, 240, 0, 120], tetradic: [0, 90, 180, 270, 0, 90, 180, 270] }[mode];
    for (var i = 0; i < n; i++) {
      if (mode === 'random') out.push(hsl2hex(base && i === 0 ? h : R(0, 360), R(40, 85), R(30, 78)));
      else if (mode === 'mono') out.push(hsl2hex(h, s, clamp(18 + i * (68 / Math.max(1, n - 1)), 10, 92)));
      else if (mode === 'pastel') out.push(hsl2hex(h + i * (360 / n) + R(-10, 10), R(55, 80), R(78, 88)));
      else if (mode === 'earth') out.push(hsl2hex(R(15, 60) + (i % 2 ? 60 : 0), R(18, 40), R(25, 72)));
      else { var rep = Math.floor(i / (mode === 'tetradic' ? 4 : mode === 'complementary' ? 2 : 3)); out.push(hsl2hex(h + offs[i], s + R(-8, 8) - rep * 8, clamp(l + (rep % 2 ? 18 : -14) * Math.min(rep, 1) + R(-6, 6), 15, 88))); }
    }
    if (base) out[0] = hsl2hex(base[0], base[1], base[2]);
    return out;
  }
  function generate() {
    var n = +$('cpN').value, base = normHex($('cpBase').value), fresh = harmony($('cpMode').value, n, base ? hex2hsl(base) : null);
    if ($('cpBase').value.trim() && !base) say('bad', '"' + $('cpBase').value.trim() + '" is not a colour code. Use a HEX code like #3b82f6.'); else say('', '');
    var next = [];
    for (var i = 0; i < n; i++) next.push(locks[i] && cols[i] ? cols[i] : fresh[i]);
    cols = next; locks = locks.slice(0, n); render(); store();
  }
  function info(h) { var r = hex2rgb(h), s = hex2hsl(h); return 'rgb(' + r.join(', ') + ')\nhsl(' + s[0] + ', ' + s[1] + '%, ' + s[2] + '%)'; }
  function render() {
    var box = $('cpSw'); box.innerHTML = '';
    cols.forEach(function (c, i) {
      var d = document.createElement('div'), light = lum(c) > 0.42; d.className = 'cpg-c' + (light ? ' dk' : ''); d.style.background = c; d.style.color = light ? '#111' : '#fff';
      d.innerHTML = '<div class="cpg-ic"><button type="button" class="cpg-i" data-lock="' + i + '" aria-pressed="' + !!locks[i] + '" aria-label="Lock this colour" title="Lock">' + (locks[i] ? '🔒' : '🔓') + '</button><button type="button" class="cpg-i" aria-label="Pick this colour yourself" title="Pick colour">✎<input type="color" data-pick="' + i + '" data-nomemo value="' + c + '"></button></div><b data-copy="' + c + '" title="Copy">' + c.toUpperCase() + '</b><small></small>';
      d.querySelector('small').textContent = info(c).replace('\n', ' · ');
      box.appendChild(d);
    });
  }
  $('cpSw').addEventListener('click', function (e) {
    var l = e.target.closest('[data-lock]'); if (l) { var i = +l.dataset.lock; locks[i] = !locks[i]; render(); store(); return; }
    var c = e.target.closest('[data-copy]'); if (c) { copyText(c.dataset.copy); if (window.toast) toast('Copied ' + c.dataset.copy.toUpperCase()); }
  });
  $('cpSw').addEventListener('input', function (e) { var p = e.target.closest('[data-pick]'); if (!p) return; cols[+p.dataset.pick] = p.value; locks[+p.dataset.pick] = true; var cell = p.closest('.cpg-c'); cell.style.background = p.value; cell.querySelector('b').textContent = p.value.toUpperCase(); cell.querySelector('b').dataset.copy = p.value; });
  $('cpSw').addEventListener('change', function (e) { if (e.target.closest('[data-pick]')) { render(); store(); } });
  $('cpGo').addEventListener('click', generate);
  ['cpMode', 'cpN'].forEach(function (id) { $(id).addEventListener('change', generate); });
  $('cpBase').addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' || $('cpPal').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target; if (t && (/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(t.tagName) || t.isContentEditable)) return;
    e.preventDefault(); generate();
  });
  $('cpCss').addEventListener('click', function () { copyText(':root {\n' + cols.map(function (c, i) { return '  --color-' + (i + 1) + ': ' + c + ';'; }).join('\n') + '\n}', this); });
  $('cpHex').addEventListener('click', function () { copyText(cols.map(function (c) { return c.toUpperCase(); }).join(', '), this); });
  $('cpPng').addEventListener('click', function () {
    var w = 1600, h = 900, c = document.createElement('canvas'); c.width = w; c.height = h; var g = c.getContext('2d'), cw = w / cols.length;
    cols.forEach(function (col, i) { g.fillStyle = col; g.fillRect(Math.floor(i * cw), 0, Math.ceil(cw), h * 0.82); g.fillStyle = '#ffffff'; g.fillRect(Math.floor(i * cw), h * 0.82, Math.ceil(cw), h * 0.18); g.fillStyle = '#222'; g.font = '600 ' + Math.round(Math.min(34, cw / 6)) + 'px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText(col.toUpperCase(), i * cw + cw / 2, h * 0.92); });
    c.toBlob(function (b) { var u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'palette-' + cols.map(function (x) { return x.slice(1); }).join('-') + '.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); say('ok', 'Palette picture saved.'); });
  });
  function savedList() { try { var s = JSON.parse(localStorage.getItem(SAVEKEY)); return Array.isArray(s) ? s.filter(function (p) { return Array.isArray(p) && p.every(normHex); }) : []; } catch (e) { return []; } }
  function showSaved() {
    var s = savedList(), box = $('cpSaved'); box.innerHTML = '';
    s.forEach(function (p, i) { var b = document.createElement('button'); b.type = 'button'; b.dataset.i = i; b.setAttribute('aria-label', 'Open saved palette ' + p.join(' ')); b.innerHTML = p.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join(''); box.appendChild(b); });
    $('cpNoSaved').hidden = s.length > 0;
  }
  $('cpSave').addEventListener('click', function () { var s = savedList(); if (s.some(function (p) { return p.join() === cols.join(); })) return say('', 'This palette is already saved.'); s.unshift(cols.slice()); s = s.slice(0, 40); try { localStorage.setItem(SAVEKEY, JSON.stringify(s)); say('ok', 'Palette saved on this device.'); } catch (e) { say('bad', 'This browser would not let the page save.'); } showSaved(); });
  $('cpSaved').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; var p = savedList()[+b.dataset.i]; if (!p) return; cols = p.slice(); locks = []; $('cpN').value = String(Math.min(8, Math.max(3, cols.length))); render(); store(); say('ok', 'Saved palette opened. Generate keeps locked colours only.'); });
  function store() { try { localStorage.setItem(SAVEKEY + 'Now', JSON.stringify({ cols: cols, locks: locks, stops: stops })); } catch (e) {} }

  // ---------- gradient ----------
  var stops = [];
  var PRESETS = [['#ff7e5f', '#feb47b'], ['#6a11cb', '#2575fc'], ['#00c9ff', '#92fe9d'], ['#f857a6', '#ff5858'], ['#43cea2', '#185a9d'], ['#fbc2eb', '#a6c1ee'], ['#0f2027', '#2c5364'], ['#f7971e', '#ffd200'], ['#ee0979', '#ff6a00'], ['#c471f5', '#fa71cd'], ['#1d976c', '#93f9b9'], ['#141e30', '#243b55']];
  function css() {
    var t = $('cpGType').value, a = +$('cpGAngle').value, s = stops.slice().sort(function (x, y) { return x.p - y.p; }).map(function (x) { return x.c + ' ' + x.p + '%'; }).join(', ');
    return t === 'linear' ? 'linear-gradient(' + a + 'deg, ' + s + ')' : t === 'radial' ? 'radial-gradient(circle at center, ' + s + ')' : 'conic-gradient(from ' + a + 'deg at 50% 50%, ' + s + ')';
  }
  function gRender(rebuild) {
    $('cpGAngleV').textContent = $('cpGAngle').value; $('cpGAngle').disabled = $('cpGType').value === 'radial';
    var g = css(); $('cpGradView').style.background = g; $('cpGCode').value = 'background: ' + stops[0].c + ';\nbackground: ' + g + ';';
    if (rebuild) {
      $('cpStops').innerHTML = stops.map(function (s, i) { return '<div class="cpg-stop"><input type="color" data-sc="' + i + '" data-nomemo value="' + s.c + '" aria-label="Colour ' + (i + 1) + '"><input type="range" data-sp="' + i + '" data-nomemo min="0" max="100" value="' + s.p + '" aria-label="Position of colour ' + (i + 1) + '"><span>' + s.p + '%</span><button type="button" data-sd="' + i + '" aria-label="Remove colour ' + (i + 1) + '"' + (stops.length <= 2 ? ' disabled' : '') + '>×</button></div>'; }).join('');
      $('cpAddStop').disabled = stops.length >= 6;
    }
    store();
  }
  $('cpStops').addEventListener('input', function (e) { var t = e.target; if (t.dataset.sc) stops[+t.dataset.sc].c = t.value; if (t.dataset.sp) { stops[+t.dataset.sp].p = +t.value; t.nextElementSibling.textContent = t.value + '%'; } gRender(false); });
  $('cpStops').addEventListener('click', function (e) { var b = e.target.closest('[data-sd]'); if (!b || stops.length <= 2) return; stops.splice(+b.dataset.sd, 1); gRender(true); });
  $('cpAddStop').addEventListener('click', function () { if (stops.length >= 6) return; stops.push({ c: hsl2hex(R(0, 360), 70, 60), p: 100 }); stops.forEach(function (s, i) { s.p = Math.round(i * 100 / (stops.length - 1)); }); gRender(true); });
  $('cpGRand').addEventListener('click', function () { var h = R(0, 360); stops = [{ c: hsl2hex(h, R(60, 90), R(45, 65)), p: 0 }, { c: hsl2hex(h + R(40, 160), R(60, 90), R(45, 65)), p: 100 }]; $('cpGAngle').value = String(Math.round(R(0, 360) / 15) * 15); gRender(true); });
  ['cpGType', 'cpGAngle'].forEach(function (id) { $(id).addEventListener('input', function () { gRender(false); }); });
  $('cpPre').innerHTML = PRESETS.map(function (p, i) { return '<button type="button" data-pre="' + i + '" style="background:linear-gradient(90deg,' + p[0] + ',' + p[1] + ')" aria-label="Gradient ' + p.join(' to ') + '"></button>'; }).join('');
  $('cpPre').addEventListener('click', function (e) { var b = e.target.closest('[data-pre]'); if (!b) return; var p = PRESETS[+b.dataset.pre]; stops = [{ c: p[0], p: 0 }, { c: p[1], p: 100 }]; gRender(true); });
  $('cpGCopy').addEventListener('click', function () { copyText($('cpGCode').value, this); });
  $('cpGPng').addEventListener('click', function () {
    var w = 1920, h = 1080, c = document.createElement('canvas'); c.width = w; c.height = h; var g = c.getContext('2d'), t = $('cpGType').value, a = (+$('cpGAngle').value - 90) * Math.PI / 180, gr;
    var ss = stops.slice().sort(function (x, y) { return x.p - y.p; });
    if (t === 'linear') { var len = Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a)); gr = g.createLinearGradient(w / 2 - Math.cos(a) * len / 2, h / 2 - Math.sin(a) * len / 2, w / 2 + Math.cos(a) * len / 2, h / 2 + Math.sin(a) * len / 2); }
    else if (t === 'radial') gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.hypot(w, h) / 2);
    else if (g.createConicGradient) gr = g.createConicGradient(a, w / 2, h / 2);
    else return say('bad', 'This browser cannot save conic gradients as pictures. Choose Linear or Radial.');
    ss.forEach(function (s) { gr.addColorStop(s.p / 100, s.c); }); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    c.toBlob(function (b) { var u = URL.createObjectURL(b), el = document.createElement('a'); el.href = u; el.download = 'gradient.png'; document.body.appendChild(el); el.click(); el.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); say('ok', 'Gradient picture saved (1920 × 1080).'); });
  });
  $('cpToGrad').addEventListener('click', function () { stops = cols.slice(0, 6).map(function (c, i, a) { return { c: c, p: Math.round(i * 100 / (a.length - 1)) }; }); tab(true); gRender(true); });
  function tab(g) { $('cpTabP').setAttribute('aria-selected', String(!g)); $('cpTabG').setAttribute('aria-selected', String(g)); $('cpPal').hidden = g; $('cpGrad').hidden = !g; say('', ''); }
  $('cpTabP').addEventListener('click', function () { tab(false); }); $('cpTabG').addEventListener('click', function () { tab(true); });

  var now = null; try { now = JSON.parse(localStorage.getItem(SAVEKEY + 'Now')); } catch (e) {}
  if (now && Array.isArray(now.cols) && now.cols.length >= 3 && now.cols.every(normHex)) { cols = now.cols.slice(0, 8); locks = Array.isArray(now.locks) ? now.locks.map(Boolean) : []; $('cpN').value = String(cols.length); render(); } else generate();
  stops = now && Array.isArray(now.stops) && now.stops.length >= 2 && now.stops.every(function (s) { return s && normHex(s.c) && s.p >= 0 && s.p <= 100; }) ? now.stops : [{ c: '#6a11cb', p: 0 }, { c: '#2575fc', p: 100 }];
  gRender(true); showSaved();
})();
</script>
