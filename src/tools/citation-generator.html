<style>
.ct-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.ct-row.org { grid-template-columns: 1fr auto; }
.ct-row .ct-org-name { display: none; }
.ct-row.org .ct-org-name { display: block; }
.ct-row.org .ct-person { display: none; }
.ct-row label { font-size: 13px; font-weight: 600; }
.ct-row .ct-tools { display: flex; gap: 6px; align-items: center; min-height: 44px; }
.ct-row .ct-tools label { margin: 0; font-weight: 400; font-size: 14px; white-space: nowrap; }
.ct-x { font: inherit; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: none; }
.ct-x:hover { border-color: var(--bad); color: var(--bad); }
.ct-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 4px; margin-bottom: 16px; }
.ct-box > b { display: block; font-size: 14px; margin-bottom: 8px; }
.ct-out { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 8px; font-family: Georgia, "Times New Roman", serif; font-size: 16.5px; line-height: 1.6; overflow-wrap: anywhere; }
.ct-ref { padding-inline-start: 2em; text-indent: -2em; }
.ct-lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 0; }
.ct-list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.ct-list li { display: flex; gap: 8px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 10px 14px; }
.ct-list li.editing { border-color: var(--accent); }
.ct-list .ct-ref { flex: 1; min-width: 0; font-family: Georgia, "Times New Roman", serif; font-size: 15.5px; line-height: 1.55; overflow-wrap: anywhere; }
.ct-list button { font: inherit; font-size: 13px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: none; }
.ct-list button:hover { border-color: var(--accent); color: var(--accent); }
.ct-hint { font-size: 13px; color: var(--muted); margin: -8px 0 14px; }
.ct-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; margin-top: 26px; }
.ct-h h3 { margin: 0; }
.ct-btns .btn { padding: 7px 14px; min-height: 40px; }
@media (max-width: 520px) { .ct-row { grid-template-columns: 1fr 1fr; } .ct-row .ct-tools { grid-column: 1 / -1; justify-content: space-between; min-height: 0; } .ct-row.org { grid-template-columns: 1fr; } }
</style>
<div class="fields">
  <div><label for="ctStyle">Citation style</label><select id="ctStyle" data-nomemo>
    <option value="apa">APA 7th edition</option>
    <option value="mla">MLA 9th edition</option>
    <option value="harvard">Harvard (Cite Them Right)</option>
    <option value="chicago-nb">Chicago 18th, notes and bibliography</option>
    <option value="chicago-ad">Chicago 18th, author-date</option>
  </select></div>
  <div><label for="ctType">Source type</label><select id="ctType" data-nomemo>
    <option value="website">Website or web page</option>
    <option value="book">Book or e-book</option>
    <option value="journal">Journal article</option>
    <option value="news">Newspaper or magazine article</option>
    <option value="video">YouTube or online video</option>
    <option value="report">Report</option>
  </select></div>
</div>

<div class="ct-box">
  <b>Authors</b>
  <div id="ctAuthors"></div>
  <div class="btns" style="margin:4px 0 10px"><button type="button" class="btn ghost" id="ctAddAuthor">+ Add author</button><button type="button" class="btn ghost" id="ctAddOrg">+ Add organisation</button></div>
  <p class="ct-hint" style="margin:0 0 10px">Leave empty if no author is named. The title then moves to the front, as each style requires.</p>
</div>

<div class="fields">
  <div style="grid-column:1/-1"><label for="ctTitle" id="ctTitleLbl">Title of the page</label><input type="text" id="ctTitle" data-nomemo placeholder="e.g. The top 10 causes of death"></div>
</div>
<p class="ct-hint" id="ctCaseHint"></p>
<div class="fields">
  <div data-f="container"><label for="ctContainer" id="ctContainerLbl">Website name</label><input type="text" id="ctContainer" data-nomemo></div>
  <div data-f="channel"><label for="ctChannel">Channel or uploader</label><input type="text" id="ctChannel" data-nomemo placeholder="e.g. Harvard University"></div>
  <div data-f="duration"><label for="ctDuration">Length (optional)</label><input type="text" id="ctDuration" data-nomemo placeholder="e.g. 4:16"></div>
  <div data-f="edition"><label for="ctEdition">Edition (optional)</label><input type="text" id="ctEdition" data-nomemo placeholder="e.g. 2"></div>
  <div data-f="reportno"><label for="ctReportNo">Report number (optional)</label><input type="text" id="ctReportNo" data-nomemo placeholder="e.g. 18-2059"></div>
  <div data-f="publisher"><label for="ctPublisher">Publisher</label><input type="text" id="ctPublisher" data-nomemo></div>
  <div data-f="place"><label for="ctPlace">Place of publication (optional)</label><input type="text" id="ctPlace" data-nomemo placeholder="e.g. London"></div>
  <div data-f="volume"><label for="ctVolume">Volume</label><input type="text" id="ctVolume" data-nomemo></div>
  <div data-f="issue"><label for="ctIssue">Issue</label><input type="text" id="ctIssue" data-nomemo></div>
  <div data-f="pages"><label for="ctPages">Pages</label><input type="text" id="ctPages" data-nomemo placeholder="e.g. 45-67"></div>
</div>
<div class="fields">
  <div><label for="ctYear" id="ctYearLbl">Year published</label><input type="text" id="ctYear" data-nomemo inputmode="numeric" maxlength="12" placeholder="Blank if none (n.d.)"></div>
  <div data-f="month"><label for="ctMonth">Month</label><select id="ctMonth" data-nomemo><option value="">–</option></select></div>
  <div data-f="day"><label for="ctDay">Day</label><input type="number" id="ctDay" data-nomemo min="1" max="31"></div>
</div>
<div class="fields">
  <div data-f="doi"><label for="ctDoi">DOI (if it has one)</label><input type="text" id="ctDoi" data-nomemo placeholder="e.g. 10.1037/ppm0000185"></div>
  <div data-f="url" style="grid-column:span 2"><label for="ctUrl" id="ctUrlLbl">URL</label><input type="text" id="ctUrl" data-nomemo inputmode="url" placeholder="https://"></div>
  <div data-f="accessed"><label for="ctAccessed">Date you accessed it</label><input type="date" id="ctAccessed" data-nomemo></div>
  <div><label for="ctPage">Page for the in-text citation (optional)</label><input type="text" id="ctPage" data-nomemo placeholder="e.g. 45"></div>
</div>

<span class="ct-lbl" id="ctRefLbl">Reference</span>
<div class="ct-out ct-ref" id="ctRef" aria-live="polite"></div>
<span class="ct-lbl" id="ctInLbl">In-text citation</span>
<div class="ct-out" id="ctIn"></div>
<div class="btns ct-btns">
  <button type="button" class="btn" id="ctAdd">Add to my list</button>
  <button type="button" class="btn ghost" id="ctCopyRef">Copy reference</button>
  <button type="button" class="btn ghost" id="ctCopyIn">Copy in-text</button>
  <button type="button" class="btn ghost" id="ctCancel" hidden>Cancel editing</button>
  <button type="button" class="btn ghost" id="ctNew">Clear form</button>
</div>
<p class="msg" id="msg"></p>

<div class="ct-h"><h3 id="ctListTitle">References</h3><span class="ct-hint" style="margin:0" id="ctCount"></span></div>
<ol class="ct-list" id="ctList"></ol>
<p class="ct-hint" id="ctEmpty" style="margin:10px 0 0">Your list is empty. Fill in a source and click “Add to my list”. The list is saved in this browser and re-formats itself when you change the style.</p>
<div class="btns ct-btns" id="ctListBtns" hidden>
  <button type="button" class="btn ghost" id="ctSort">Sort A to Z</button>
  <button type="button" class="btn ghost" id="ctCopyAll">Copy all</button>
  <button type="button" class="btn ghost" id="ctTxt">Download .txt</button>
  <button type="button" class="btn ghost" id="ctHtml">Download for Word (.html)</button>
  <button type="button" class="btn ghost danger" id="ctClear">Clear list</button>
</div>
<script>
(function () {
  var KEY = 'gtn-citations';
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var MLA_MON = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
  var STYLE_NAME = { apa: 'APA 7', mla: 'MLA 9', harvard: 'Harvard', 'chicago-nb': 'Chicago (notes and bibliography)', 'chicago-ad': 'Chicago (author-date)' };
  var LIST_TITLE = { apa: 'References', mla: 'Works Cited', harvard: 'Reference list', 'chicago-nb': 'Bibliography', 'chicago-ad': 'References' };
  // Which fields each source type uses.
  var TYPES = {
    website: { f: ['container', 'month', 'day', 'url', 'accessed'], title: 'Title of the page', cont: 'Website name', ph: 'e.g. The top 10 causes of death' },
    book: { f: ['edition', 'publisher', 'place', 'doi', 'url'], title: 'Book title', ph: 'e.g. The psychology of prejudice: From attitudes to social action' },
    journal: { f: ['container', 'volume', 'issue', 'pages', 'month', 'doi', 'url'], title: 'Article title', cont: 'Journal name', ph: 'e.g. Emotions in storybooks' },
    news: { f: ['container', 'volume', 'issue', 'pages', 'month', 'day', 'url', 'accessed'], title: 'Article title', cont: 'Newspaper or magazine', ph: 'e.g. How will humanity react to alien life?' },
    video: { f: ['container', 'channel', 'duration', 'month', 'day', 'url', 'accessed'], title: 'Video title', cont: 'Platform', ph: 'e.g. Soft robotic gripper for jellyfish' },
    report: { f: ['reportno', 'publisher', 'place', 'doi', 'url', 'accessed'], title: 'Report title', ph: 'e.g. Taking time: Support for people with cancer' }
  };
  var ITALIC_TITLE = { apa: { website: 1, book: 1, video: 1, report: 1 }, other: { book: 1, report: 1 } };
  var ONLINE = { website: 1, news: 1, video: 1 };

  // ---------- small text helpers (output is HTML with <i> for italics) ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function I(s) { return s ? '<i>' + esc(s) + '</i>' : ''; }
  var tmp = document.createElement('div');
  function plain(html) { tmp.innerHTML = html; return tmp.textContent; }
  function endsP(html) { return /[.?!][”’]?$/.test(plain(html).trim()); }
  function endsQ(s) { return /[?!]$/.test(String(s).trim()); }
  function dot(html) { return html ? html + (endsP(html) ? '' : '.') : ''; }
  // American double quotes; a full stop or comma goes inside, and is dropped after ? or !.
  function dq(t, p) { t = String(t).trim(); if (endsQ(t) || (p === '.' && /\.$/.test(t))) p = ''; return '“' + esc(t) + (p || '') + '”'; }
  function sq(t) { return '‘' + esc(String(t).trim()) + '’'; }
  function ord(n) { var v = +n, s = ['th', 'st', 'nd', 'rd'], m = v % 100; return v + (s[(m - 20) % 10] || s[m] || s[0]); }
  function join(a, sep) { return a.filter(Boolean).join(sep); }

  function initials(first, gap) {
    return first.trim().split(/\s+/).filter(Boolean).map(function (w) {
      return w.split('-').filter(Boolean).map(function (p) { return p.charAt(0).toUpperCase() + '.'; }).join('-');
    }).join(gap);
  }
  function surname(a) { return a.org ? a.name : a.last; }
  function fullName(a) { return a.org ? a.name : join([a.first, a.last], ' '); }
  function inverted(a) { return a.org ? a.name : (a.first ? a.last + ', ' + a.first : a.last); }

  // Page ranges. MLA and Chicago shorten the second number by their own rules; APA and Harvard write it in full.
  function parseRange(p) { var m = String(p || '').trim().match(/^([A-Za-z]?)(\d+)\s*(?:-|–|—|to)\s*\1?(\d+)$/); return m ? { pre: m[1], a: +m[2], b: +m[3], sa: m[2], sb: m[3] } : null; }
  function shortened(a, b, min) {
    var sa = String(a), sb = String(b);
    if (sb.length > sa.length) return sb;
    for (var k = min; k < sb.length; k++) if (sa.slice(0, sa.length - k) + sb.slice(-k) === sb) return sb.slice(-k);
    return sb;
  }
  function pages(p, style) {
    var r = parseRange(p); if (!r) return String(p || '').trim();
    var second = r.sb;
    if (r.b > r.a) {
      if (style === 'mla' && r.a >= 100) second = shortened(r.a, r.b, 2);
      if (style === 'chicago' && r.a >= 100 && r.a % 100 !== 0) second = shortened(r.a, r.b, r.a % 100 < 10 ? 1 : 2);
    }
    return r.pre + r.sa + (style === 'mla' ? '-' : '–') + r.pre + second;
  }
  function isRange(p) { return !!parseRange(p) || /[,–-]/.test(String(p || '')); }

  function doiUrl(d) {
    d = String(d || '').trim(); if (!d) return '';
    d = d.replace(/^doi:\s*/i, '').replace(/^https?:\/\/(dx\.)?doi\.org\//i, '');
    return 'https://doi.org/' + d;
  }
  function edition(e, style) {
    e = String(e || '').trim(); if (!e || /^1(st)?$/i.test(e)) return '';
    var n = e.match(/^(\d+)(st|nd|rd|th)?(\s*(ed|edn|edition)\.?)?$/i);
    if (n) return ord(n[1]) + (style === 'harvard' ? ' edn.' : ' ed.');
    return e;
  }
  function reportNo(r) { r = String(r || '').trim(); if (!r) return ''; return /\b(no\.|number|nr\.)/i.test(r) ? r : 'Report No. ' + r; }
  function same(a, b) { return a && b && a.trim().toLowerCase() === b.trim().toLowerCase(); }

  function accessParts(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }

  // ---------- the formatter ----------
  function prep(s) {
    var A = (s.authors || []).filter(function (a) { return a.org ? a.name && a.name.trim() : a.last && a.last.trim(); }).map(function (a) {
      return a.org ? { org: true, name: a.name.trim() } : { first: (a.first || '').trim(), last: a.last.trim() };
    });
    var t = s.type in TYPES ? s.type : 'website', f = TYPES[t].f;
    var g = function (k) { return f.indexOf(k) === -1 ? '' : String(s[k] || '').trim(); };
    var c = {
      type: t, A: A, title: String(s.title || '').trim(), container: g('container'), channel: g('channel'), duration: g('duration'),
      edition: g('edition'), reportno: g('reportno'), publisher: g('publisher'), place: g('place'), volume: g('volume'), issue: g('issue'), pages: g('pages'),
      year: String(s.year || '').trim(), month: f.indexOf('month') === -1 ? 0 : +s.month || 0, day: f.indexOf('day') === -1 ? 0 : +s.day || 0,
      doi: doiUrl(g('doi')), url: g('url'), acc: f.indexOf('accessed') === -1 ? null : accessParts(s.accessed), page: String(s.page || '').trim()
    };
    if (!c.month) c.day = 0;
    if (t === 'video' && !c.container) c.container = 'YouTube';
    if (t === 'video' && !A.length && c.channel) c.A = [{ org: true, name: c.channel }];
    c.link = c.doi || c.url;
    return c;
  }

  // APA 7 ----------------------------------------------------------------
  function apaName(a) { return a.org ? esc(a.name) : esc(a.last) + (a.first ? ', ' + esc(initials(a.first, ' ')) : ''); }
  function apaAuthors(A) {
    var n = A.map(apaName);
    if (n.length === 1) return n[0];
    if (n.length <= 20) return n.slice(0, -1).join(', ') + ', &amp; ' + n[n.length - 1];
    return n.slice(0, 19).join(', ') + ', . . . ' + n[n.length - 1];
  }
  function apa(c) {
    var it = ITALIC_TITLE.apa[c.type], y = c.year || 'n.d.';
    var d = c.year && c.month && ONLINE[c.type] ? y + ', ' + MONTHS[c.month - 1] + (c.day ? ' ' + c.day : '') : y;
    var t = it ? I(c.title) : esc(c.title), extra = '';
    if (c.type === 'book' && edition(c.edition)) extra = ' (' + edition(c.edition) + ')';
    if (c.type === 'report' && c.reportno) extra = ' (' + esc(reportNo(c.reportno)) + ')';
    if (c.type === 'video') extra += ' [Video]';
    var titleEl = dot(t + extra), out;
    var orgSame = c.A.length === 1 && c.A[0].org;
    if (c.A.length) out = dot(apaAuthors(c.A)) + ' (' + d + '). ' + titleEl;
    else out = titleEl + ' (' + d + ').';
    var src = '';
    if (c.type === 'website' && c.container && !(orgSame && same(c.A[0].name, c.container))) src = dot(esc(c.container));
    if ((c.type === 'book' || c.type === 'report') && c.publisher && !(orgSame && same(c.A[0].name, c.publisher))) src = dot(esc(c.publisher));
    if (c.type === 'video') src = dot(esc(c.container));
    if (c.type === 'journal' || (c.type === 'news' && c.container)) {
      if (c.volume) src = '<i>' + esc(c.container) + ', ' + esc(c.volume) + '</i>' + (c.issue ? '(' + esc(c.issue) + ')' : '');
      else src = I(c.container) + (c.issue ? ', (' + esc(c.issue) + ')' : '');
      if (c.pages) src += ', ' + esc(pages(c.pages, 'apa'));
      src += '.';
    }
    if (src) out += ' ' + src;
    if (c.link) out += ' ' + esc(c.link);
    return out;
  }
  function apaCite(c, narrative) {
    var y = c.year || 'n.d.', who, pg = c.page ? ', ' + (isRange(c.page) ? 'pp. ' : 'p. ') + esc(pages(c.page, 'apa')) : '';
    if (!c.A.length) {
      var it = ITALIC_TITLE.apa[c.type];
      if (narrative) return (it ? I(c.title) : dq(c.title)) + ' (' + y + pg + ')';
      return '(' + (it ? I(c.title) + ', ' : dq(c.title, ',') + ' ') + y + pg + ')';
    }
    var s = c.A.map(function (a) { return esc(surname(a)); });
    who = s.length === 1 ? s[0] : s.length === 2 ? s[0] + (narrative ? ' and ' : ' &amp; ') + s[1] : s[0] + ' et al.';
    return narrative ? who + ' (' + y + pg + ')' : '(' + who + ', ' + y + pg + ')';
  }

  // MLA 9 ----------------------------------------------------------------
  function mlaAuthors(A) {
    if (A.length === 1) return esc(inverted(A[0]));
    if (A.length === 2) return esc(inverted(A[0])) + ', and ' + esc(fullName(A[1]));
    return esc(inverted(A[0])) + ', et al.';
  }
  function mlaDate(c) { if (!c.year) return ''; return (c.month ? (c.day ? c.day + ' ' : '') + MLA_MON[c.month - 1] + ' ' : '') + c.year; }
  function mlaUrl(u) { return u.replace(/^https?:\/\//i, ''); }
  // An organisation that is both author and publisher (or the website itself) is not repeated as the author.
  function mlaSkip(c) { return c.A.length === 1 && c.A[0].org && (same(c.A[0].name, c.publisher) || same(c.A[0].name, c.container)); }
  function mla(c) {
    var it = ITALIC_TITLE.other[c.type], A = c.A, parts;
    var out = A.length && !mlaSkip(c) ? dot(mlaAuthors(A)) + ' ' : '';
    out += it ? dot(I(c.title)) : dq(c.title, '.');
    var link = c.doi || (c.url ? mlaUrl(c.url) : '');
    var pp = c.pages ? (isRange(c.pages) ? 'pp. ' : 'p. ') + esc(pages(c.pages, 'mla')) : '';
    if (c.type === 'book') parts = [esc(edition(c.edition)), esc(c.publisher), c.year];
    else if (c.type === 'report') parts = [c.reportno ? esc(reportNo(c.reportno)) : '', esc(c.publisher), c.year];
    else if (c.type === 'video') parts = [I(c.container), c.channel && !(A.length && same(fullName(A[0]), c.channel)) ? 'uploaded by ' + esc(c.channel) : '', mlaDate(c)];
    else parts = [I(c.container), c.volume ? 'vol. ' + esc(c.volume) : '', c.issue ? 'no. ' + esc(c.issue) : '', mlaDate(c), pp];
    parts.push(esc(link));
    var tail = join(parts, ', ');
    if (tail) out += ' ' + dot(tail);
    if (c.acc && !c.year && (c.url || c.doi)) out += ' Accessed ' + c.acc.d + ' ' + MLA_MON[c.acc.m - 1] + ' ' + c.acc.y + '.';
    return out;
  }
  function mlaCite(c, narrative) {
    var pg = c.page ? esc(c.page.replace(/\s*[-–]\s*/, '-')) : '', who;
    if (!c.A.length || mlaSkip(c)) who = ITALIC_TITLE.other[c.type] ? I(c.title) : dq(c.title);
    else {
      var s = c.A.map(function (a) { return esc(surname(a)); });
      who = s.length === 1 ? s[0] : s.length === 2 ? s[0] + ' and ' + s[1] : s[0] + ' et al.';
    }
    return narrative ? who + (pg ? ' (' + pg + ')' : '') : '(' + who + (pg ? ' ' + pg : '') + ')';
  }

  // Harvard (Cite Them Right) -------------------------------------------
  function harvName(a) { return a.org ? esc(a.name) : esc(a.last) + (a.first ? ', ' + esc(initials(a.first, '')) : ''); }
  function harvAuthors(A) { var n = A.map(harvName); return n.length === 1 ? n[0] : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1]; }
  function harvAccess(c) { return c.acc ? ' (Accessed: ' + c.acc.d + ' ' + MONTHS[c.acc.m - 1] + ' ' + c.acc.y + ')' : ''; }
  function harvard(c) {
    var y = c.year || 'no date', quoted = c.type === 'journal' || c.type === 'news';
    var t = quoted ? sq(c.title) : I(c.title), out;
    var after = quoted ? ', ' : '. ';
    if (!quoted && endsQ(c.title)) after = ' ';
    if (c.A.length) out = harvAuthors(c.A) + ' (' + y + ') ' + t + after;
    else out = t + ' (' + y + ')' + (quoted ? ', ' : '. ');
    var rest = '';
    if (c.type === 'book') rest = join([edition(c.edition, 'harvard'), join([esc(c.place), esc(c.publisher)], ': ') ? dot(join([esc(c.place), esc(c.publisher)], ': ')) : ''], ' ');
    else if (c.type === 'report') rest = join([c.reportno ? dot(esc(reportNo(c.reportno))) : '', join([esc(c.place), esc(c.publisher)], ': ') ? dot(join([esc(c.place), esc(c.publisher)], ': ')) : ''], ' ');
    else if (c.type === 'journal') rest = dot(join([I(c.container), c.volume ? esc(c.volume) + (c.issue ? '(' + esc(c.issue) + ')' : '') : (c.issue ? '(' + esc(c.issue) + ')' : ''), c.pages ? (isRange(c.pages) ? 'pp. ' : 'p. ') + esc(pages(c.pages, 'harvard')) : ''], ', '));
    else if (c.type === 'news') rest = dot(join([I(c.container), c.month ? (c.day ? c.day + ' ' : '') + MONTHS[c.month - 1] : '', c.pages ? (isRange(c.pages) ? 'pp. ' : 'p. ') + esc(pages(c.pages, 'harvard')) : ''], ', '));
    if (rest) out += rest; else out = out.replace(/\s+$/, '');
    if (c.link) out = out.replace(/\s+$/, '') + ' Available at: ' + esc(c.link) + (c.doi ? '' : harvAccess(c)) + '.';
    return out.replace(/\s+$/, '');
  }
  function harvardCite(c, narrative) {
    var y = c.year || 'no date', pg = c.page ? ', ' + (isRange(c.page) ? 'pp. ' : 'p. ') + esc(pages(c.page, 'harvard')) : '', who;
    if (!c.A.length) who = c.type === 'journal' || c.type === 'news' ? sq(c.title) : I(c.title);
    else {
      var s = c.A.map(function (a) { return esc(surname(a)); });
      who = s.length === 1 ? s[0] : s.length <= 3 ? s.slice(0, -1).join(', ') + ' and ' + s[s.length - 1] : s[0] + ' et al.';
    }
    return narrative ? who + ' (' + y + pg + ')' : '(' + who + ', ' + y + pg + ')';
  }

  // Chicago 18th --------------------------------------------------------
  function chiDate(c) { return c.year ? (c.month ? MONTHS[c.month - 1] + ' ' + (c.day ? c.day + ', ' : '') : '') + c.year : ''; }
  function chiAcc(c) { return c.acc ? MONTHS[c.acc.m - 1] + ' ' + c.acc.d + ', ' + c.acc.y : ''; }
  function chiBibAuthors(A) {
    var list = A.length > 6 ? A.slice(0, 3) : A;
    var n = list.map(function (a, i) { return esc(i ? fullName(a) : inverted(a)); });
    if (A.length > 6) return n.join(', ') + ', et al.';
    if (n.length === 1) return n[0];
    if (n.length === 2) return n[0] + (A[0].org || !A[0].first ? ' and ' : ', and ') + n[1];
    return n.slice(0, -1).join(', ') + ', and ' + n[n.length - 1];
  }
  function chiNoteAuthors(A, short) {
    var n = A.map(function (a) { return esc(short ? surname(a) : fullName(a)); });
    return n.length === 1 ? n[0] : n.length === 2 ? n[0] + ' and ' + n[1] : n[0] + ' et al.';
  }
  function shortTitle(t) {
    var main = String(t).split(/[:?!]\s/)[0].replace(/^(the|a|an)\s+/i, ''), w = main.split(/\s+/);
    return w.length > 4 ? w.slice(0, 4).join(' ') : main;
  }
  function chiPub(c) { var p = join([esc(c.place), esc(c.publisher)], ': '); return p; }
  function chicagoBib(c, ad) {
    var it = ITALIC_TITLE.other[c.type], y = c.year || 'n.d.', out = '';
    var title = it ? dot(I(c.title)) : dq(c.title, '.');
    if (c.A.length) out = dot(chiBibAuthors(c.A)) + ' ' + (ad ? y + '. ' : '') + title;
    else out = title + (ad ? ' ' + y + '.' : '');
    var link = c.link ? ' ' + dot(esc(c.link)) : '', rest = '';
    var dated = function () { return chiDate(c) ? dot(chiDate(c)) : (c.acc && c.link ? 'Accessed ' + chiAcc(c) + '.' : ''); };
    if (c.type === 'book') rest = join([edition(c.edition) ? dot(edition(c.edition)) : '', dot(join([chiPub(c), ad ? '' : y], ', '))], ' ');
    else if (c.type === 'report') rest = join([c.reportno ? dot(esc(reportNo(c.reportno))) : '', dot(join([chiPub(c), ad ? '' : y], ', '))], ' ');
    else if (c.type === 'journal') {
      if (ad) rest = I(c.container) + (c.volume ? ' ' + esc(c.volume) : '') + (c.issue ? ' (' + esc(c.issue) + ')' : '') + (c.pages ? ': ' + esc(pages(c.pages, 'chicago')) : '') + '.';
      else rest = I(c.container) + (c.volume ? ' ' + esc(c.volume) : '') + (c.issue ? (c.volume ? ',' : '') + ' no. ' + esc(c.issue) : '') + ' (' + (c.month ? MONTHS[c.month - 1] + ' ' : '') + y + ')' + (c.pages ? ': ' + esc(pages(c.pages, 'chicago')) : '') + '.';
    } else if (c.type === 'news') rest = dot(join([I(c.container), chiDate(c)], ', ')) + (!chiDate(c) && c.acc && c.link ? ' Accessed ' + chiAcc(c) + '.' : '');
    else if (c.type === 'website') rest = join([c.container ? dot(esc(c.container)) : '', dated()], ' ');
    else if (c.type === 'video') rest = join([dot(esc(c.container) + ' video' + (c.duration ? ', ' + esc(c.duration) : '')), dated()], ' ');
    return join([out, rest], ' ') + link;
  }
  // Joins note parts with commas; after a closing quote the comma is already inside it.
  function cat(list) {
    var out = '';
    list.forEach(function (p) { if (!p) return; out = !out ? p : out + (/”$/.test(out) || /^\(/.test(p) ? ' ' : ', ') + p; });
    return out;
  }
  function chicagoNote(c) {
    var it = ITALIC_TITLE.other[c.type], y = c.year || 'n.d.', who = c.A.length ? chiNoteAuthors(c.A) : '';
    var pg = c.page ? esc(pages(c.page, 'chicago')) : '', parts;
    var title = it ? I(c.title) : dq(c.title, ',');
    var pub = '(' + join([chiPub(c), y], ', ') + ')';
    var dated = chiDate(c) || (c.acc && c.link ? 'accessed ' + chiAcc(c) : '');
    if (c.type === 'book') parts = [who, title, esc(edition(c.edition)), pub, pg];
    else if (c.type === 'report') parts = [who, title, c.reportno ? esc(reportNo(c.reportno)) : '', pub, pg];
    else if (c.type === 'journal') parts = [who, title, I(c.container) + (c.volume ? ' ' + esc(c.volume) : '') + (c.issue ? (c.volume ? ',' : '') + ' no. ' + esc(c.issue) : '') + ' (' + (c.month ? MONTHS[c.month - 1] + ' ' : '') + y + ')' + ((pg || c.pages) ? ': ' + (pg || esc(pages(c.pages, 'chicago'))) : '')];
    else if (c.type === 'news') parts = [who, title, I(c.container), dated, pg];
    else if (c.type === 'website') parts = [who, title, esc(c.container), dated];
    else parts = [who, title, esc(c.container) + ' video', esc(c.duration), dated];
    parts.push(esc(c.link));
    return dot(cat(parts));
  }
  function chicagoShort(c) {
    var it = ITALIC_TITLE.other[c.type], st = shortTitle(c.title), pg = c.page ? esc(pages(c.page, 'chicago')) : '';
    var t = it ? I(st) : dq(st, pg ? ',' : '.');
    return dot(cat([c.A.length ? chiNoteAuthors(c.A, true) : '', t, pg]));
  }
  function chicagoCite(c, narrative) {
    var y = c.year || 'n.d.', pg = c.page ? ', ' + esc(pages(c.page, 'chicago')) : '';
    var who = c.A.length ? chiNoteAuthors(c.A, true) : (ITALIC_TITLE.other[c.type] ? I(c.title) : dq(c.title));
    return narrative ? who + ' (' + y + pg + ')' : '(' + who + ' ' + y + pg + ')';
  }

  function format(src, style) {
    var c = prep(src), r = {};
    if (style === 'apa') { r.ref = apa(c); r.inText = apaCite(c); r.narrative = apaCite(c, true); }
    else if (style === 'mla') { r.ref = mla(c); r.inText = mlaCite(c); r.narrative = mlaCite(c, true); }
    else if (style === 'harvard') { r.ref = harvard(c); r.inText = harvardCite(c); r.narrative = harvardCite(c, true); }
    else if (style === 'chicago-ad') { r.ref = chicagoBib(c, true); r.inText = chicagoCite(c); r.narrative = chicagoCite(c, true); }
    else { r.ref = chicagoBib(c, false); r.note = chicagoNote(c); r.shortNote = chicagoShort(c); }
    r.ref = r.ref.replace(/\s{2,}/g, ' ').trim();
    return r;
  }
  window.CiteFormat = format; // also used by the self-tests

  // ---------- the form ----------
  var ui = { style: $('ctStyle'), type: $('ctType') };
  var FIELDS = ['title', 'container', 'channel', 'duration', 'edition', 'reportno', 'publisher', 'place', 'volume', 'issue', 'pages', 'year', 'month', 'day', 'doi', 'url', 'accessed', 'page'];
  var IDS = { title: 'ctTitle', container: 'ctContainer', channel: 'ctChannel', duration: 'ctDuration', edition: 'ctEdition', reportno: 'ctReportNo', publisher: 'ctPublisher', place: 'ctPlace', volume: 'ctVolume', issue: 'ctIssue', pages: 'ctPages', year: 'ctYear', month: 'ctMonth', day: 'ctDay', doi: 'ctDoi', url: 'ctUrl', accessed: 'ctAccessed', page: 'ctPage' };
  MONTHS.forEach(function (m, i) { var o = document.createElement('option'); o.value = i + 1; o.textContent = m; $('ctMonth').appendChild(o); });
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  var state = { style: 'apa', list: [], draft: null };
  try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved && typeof saved === 'object') { if (STYLE_NAME[saved.style]) state.style = saved.style; if (Array.isArray(saved.list)) state.list = saved.list.filter(function (x) { return x && typeof x === 'object'; }); if (saved.draft && typeof saved.draft === 'object') state.draft = saved.draft; } } catch (e) {}
  var editing = null, saveTimer;
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      state.draft = read();
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { say('bad', 'This browser’s storage is full, so your list could not be saved.'); }
    }, 300);
  }
  function say(cls, text) { $('msg').className = 'msg ' + (cls || ''); $('msg').textContent = text || ''; }

  function authorRow(a) {
    a = a || {};
    var row = document.createElement('div'); row.className = 'ct-row' + (a.org ? ' org' : '');
    var uid = Math.random().toString(36).slice(2, 8);
    row.innerHTML = '<div class="ct-person"><label for="f' + uid + '">First and middle names</label><input type="text" data-nomemo data-k="first" id="f' + uid + '" autocomplete="off"></div>' +
      '<div class="ct-person"><label for="l' + uid + '">Last name</label><input type="text" data-nomemo data-k="last" id="l' + uid + '" autocomplete="off"></div>' +
      '<div class="ct-org-name"><label for="o' + uid + '">Organisation name</label><input type="text" data-nomemo data-k="name" id="o' + uid + '" autocomplete="off" placeholder="e.g. World Health Organization"></div>' +
      '<div class="ct-tools"><label><input type="checkbox" data-nomemo data-k="org">Organisation</label><button type="button" class="ct-x" aria-label="Remove this author">✕</button></div>';
    row.querySelector('[data-k=first]').value = a.first || '';
    row.querySelector('[data-k=last]').value = a.last || '';
    row.querySelector('[data-k=name]').value = a.name || '';
    var cb = row.querySelector('[data-k=org]'); cb.checked = !!a.org;
    cb.addEventListener('change', function () { row.classList.toggle('org', cb.checked); update(); });
    row.querySelector('.ct-x').addEventListener('click', function () { row.remove(); update(); });
    $('ctAuthors').appendChild(row);
    return row;
  }
  function readAuthors() {
    return Array.prototype.map.call($('ctAuthors').children, function (row) {
      var v = function (k) { return row.querySelector('[data-k=' + k + ']').value; };
      return row.querySelector('[data-k=org]').checked ? { org: true, name: v('name') } : { first: v('first'), last: v('last') };
    });
  }
  function read() {
    var s = { type: ui.type.value, authors: readAuthors() };
    FIELDS.forEach(function (k) { s[k] = $(IDS[k]).value; });
    return s;
  }
  function fill(s) {
    s = s || {};
    ui.type.value = TYPES[s.type] ? s.type : 'website';
    $('ctAuthors').innerHTML = '';
    (s.authors && s.authors.length ? s.authors : [{}]).forEach(authorRow);
    FIELDS.forEach(function (k) { $(IDS[k]).value = s[k] == null ? '' : s[k]; });
    if (!$('ctAccessed').value) $('ctAccessed').value = today();
    if (ui.type.value === 'video' && !$('ctContainer').value) $('ctContainer').value = 'YouTube';
    showFields();
  }
  function showFields() {
    var T = TYPES[ui.type.value];
    document.querySelectorAll('[data-f]').forEach(function (el) { el.hidden = T.f.indexOf(el.dataset.f) === -1; });
    $('ctTitleLbl').textContent = T.title; $('ctTitle').placeholder = T.ph;
    if (T.cont) $('ctContainerLbl').textContent = T.cont;
    $('ctUrlLbl').textContent = ONLINE[ui.type.value] ? 'URL' : 'URL (optional, if you read it online)';
    $('ctYearLbl').textContent = ui.type.value === 'journal' ? 'Year' : 'Year published';
    if (ui.type.value === 'video' && !$('ctContainer').value) $('ctContainer').value = 'YouTube';
  }
  var CASE = { apa: 'APA writes titles of articles, books, pages and videos in sentence case: capitalise only the first word, the first word after a colon, and names. Type the title that way.', mla: 'MLA uses title case: capitalise the main words of every title.', harvard: 'Harvard (Cite Them Right) capitalises only the first word and names in book and page titles.', 'chicago-nb': 'Chicago uses title case: capitalise the main words of every title.', 'chicago-ad': 'Chicago uses title case: capitalise the main words of every title.' };

  var current = null;
  function render() {
    var s = read(), st = ui.style.value;
    $('ctCaseHint').textContent = CASE[st];
    $('ctListTitle').textContent = LIST_TITLE[st];
    if (!s.title.trim()) {
      current = null;
      $('ctRef').innerHTML = '<span style="color:var(--muted);font-family:inherit">Type a title to see the citation.</span>'; $('ctIn').textContent = '–';

    var r = format(s, st); current = r;
    $('ctRef').innerHTML = r.ref;
    if (st === 'chicago-nb') {
      $('ctRefLbl').textContent = 'Bibliography entry'; $('ctInLbl').textContent = 'Footnote (first time, then shortened)';
      $('ctIn').innerHTML = '1. ' + r.note + '<br>2. ' + r.shortNote;
      $('ctCopyIn').textContent = 'Copy footnote';
    } else {
      $('ctRefLbl').textContent = st === 'mla' ? 'Works Cited entry' : 'Reference';
      $('ctInLbl').textContent = 'In-text citation (in brackets, then in a sentence)';
      $('ctIn').innerHTML = r.inText + '<br>' + r.narrative + (st === 'mla' ? ' writes that …' : st === 'apa' || st === 'harvard' || st === 'chicago-ad' ? ' found that …' : '');
      $('ctCopyIn').textContent = 'Copy in-text';
    }
  }
  function update() { render(); persist(); }

  // ---------- copying with italics ----------
  function copyRich(html, btn) {
    var text = plain(html.replace(/<br\s*\/?>/g, '\n').replace(/<\/p>/g, '</p>\n')).replace(/\n+$/, '');

    var done = function () { if (!btn) return; var old = btn.textContent; btn.textContent = 'Copied!'; if (window.burst) burst(btn); setTimeout(function () { btn.textContent = old; }, 1200); };
    function legacy() {
      var box = document.createElement('div'); box.contentEditable = 'true'; box.innerHTML = html;
      box.style.cssText = 'position:fixed;left:-9999px;top:0;white-space:pre-wrap';
      document.body.appendChild(box);
      var r = document.createRange(); r.selectNodeContents(box); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);

    }

      var item;
      try { item = new ClipboardItem({ 'text/html': new Blob([doc], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) }); } catch (e) { item = null; }
      if (item) { navigator.clipboard.write([item]).then(done, function () { navigator.clipboard.writeText(text).then(done, legacy); }); return; }

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, legacy);
    else legacy();
  }

  // ---------- the list ----------
  function sortKey(html) { return plain(html).replace(/^[^\p{L}\p{N}]+/u, '').replace(/^(the|a|an)\s+/i, '').toLowerCase(); }
  function refs() { var st = ui.style.value; return state.list.map(function (s) { return format(s, st).ref; }); }
  function drawList() {
    var ul = $('ctList'), st = ui.style.value; ul.innerHTML = '';
    state.list.forEach(function (s, i) {
      var li = document.createElement('li'), d = document.createElement('div'), e = document.createElement('button'), x = document.createElement('button');
      d.className = 'ct-ref'; d.innerHTML = format(s, st).ref;
      e.type = 'button'; e.textContent = 'Edit'; e.setAttribute('aria-label', 'Edit citation ' + (i + 1));
      x.type = 'button'; x.textContent = 'Delete'; x.setAttribute('aria-label', 'Delete citation ' + (i + 1));
      if (editing === s.id) li.className = 'editing';
      e.addEventListener('click', function () { editing = s.id; fill(s); $('ctAdd').textContent = 'Save changes'; $('ctCancel').hidden = false; drawList(); render(); say('', 'Editing citation ' + (i + 1) + '. Change it above, then click “Save changes”.'); $('ctTitle').scrollIntoView({ block: 'center', behavior: 'smooth' }); });
      x.addEventListener('click', function () { state.list.splice(i, 1); if (editing === s.id) stopEdit(); drawList(); persist(); say('', 'Citation deleted.'); });
      li.appendChild(d); li.appendChild(e); li.appendChild(x); ul.appendChild(li);
    });
    $('ctEmpty').hidden = !!state.list.length; $('ctListBtns').hidden = !state.list.length;
    $('ctCount').textContent = state.list.length ? state.list.length + (state.list.length === 1 ? ' source' : ' sources') + ' · ' + STYLE_NAME[st] : '';
  }
  function stopEdit() { editing = null; $('ctAdd').textContent = 'Add to my list'; $('ctCancel').hidden = true; }
  function blank(type) { fill({ type: type || ui.type.value, authors: [{}] }); }

  $('ctAdd').addEventListener('click', function () {
    var s = read();
    if (!s.title.trim()) { say('bad', 'Add a title first. Every citation needs one.'); $('ctTitle').focus(); return; }
    s.authors = s.authors.filter(function (a) { return a.org ? a.name.trim() : (a.last.trim() || a.first.trim()); }).map(function (a) { return a.org || a.last.trim() ? a : { first: '', last: a.first }; });
    if (editing) {
      var i = state.list.findIndex(function (x) { return x.id === editing; });
      s.id = editing; if (i !== -1) state.list[i] = s; else state.list.push(s);
      stopEdit(); say('ok', 'Citation updated.');
    } else {
      s.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      var dupe = state.list.some(function (x) { return JSON.stringify(format(x, 'apa').ref) === JSON.stringify(format(s, 'apa').ref); });
      if (dupe) { say('bad', 'This source is already in your list.'); return; }
      state.list.push(s); say('ok', 'Added. You have ' + state.list.length + (state.list.length === 1 ? ' source' : ' sources') + ' in your list.');
    }
    if (window.burst) burst($('ctAdd'));
    var keepType = s.type; blank(keepType); drawList(); render(); persist();
  });
  $('ctCancel').addEventListener('click', function () { stopEdit(); blank(); drawList(); render(); persist(); say('', ''); });
  $('ctNew').addEventListener('click', function () { if (editing) stopEdit(); blank(); drawList(); render(); persist(); say('', ''); $('ctTitle').focus(); });
  $('ctCopyRef').addEventListener('click', function () { if (!current) { say('bad', 'Add a title first.'); return; } copyRich(current.ref, this); });
  $('ctCopyIn').addEventListener('click', function () { if (!current) { say('bad', 'Add a title first.'); return; } copyRich(ui.style.value === 'chicago-nb' ? current.note : current.inText, this); });
  $('ctAddAuthor').addEventListener('click', function () { authorRow({}).querySelector('[data-k=first]').focus(); update(); });
  $('ctAddOrg').addEventListener('click', function () { authorRow({ org: true }).querySelector('[data-k=name]').focus(); update(); });
  $('ctSort').addEventListener('click', function () {
    var st = ui.style.value;
    state.list.sort(function (a, b) { return sortKey(format(a, st).ref).localeCompare(sortKey(format(b, st).ref)); });
    drawList(); persist(); say('ok', 'Sorted A to Z.');
  });
  $('ctCopyAll').addEventListener('click', function () { copyRich(refs().map(function (r) { return '<p style="margin:0 0 0 .5in;text-indent:-.5in">' + r + '</p>'; }).join(''), this); });
  function download(blob, name) {
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }
  $('ctTxt').addEventListener('click', function () {
    var st = ui.style.value;
    download(new Blob([LIST_TITLE[st] + '\r\n\r\n' + refs().map(plain).join('\r\n\r\n') + '\r\n'], { type: 'text/plain;charset=utf-8' }), LIST_TITLE[st].toLowerCase().replace(/\s+/g, '-') + '.txt');
  });
  $('ctHtml').addEventListener('click', function () {
    var st = ui.style.value, dbl = st === 'apa' || st === 'mla';
    var html = '<!doctype html><html><head><meta charset="utf-8"><title>' + LIST_TITLE[st] + '</title><style>body{font-family:"Times New Roman",Times,serif;font-size:12pt;line-height:' + (dbl ? '2' : '1.15') + ';margin:1in}h1{font-size:12pt;text-align:center;font-weight:' + (st === 'apa' ? 'bold' : 'normal') + ';margin:0}p{margin:0 0 ' + (dbl ? '0' : '12pt') + ' .5in;text-indent:-.5in}</style></head><body><h1>' + LIST_TITLE[st] + '</h1>' +
      refs().map(function (r) { return '<p>' + r + '</p>'; }).join('') + '</body></html>';
    download(new Blob([html], { type: 'text/html;charset=utf-8' }), LIST_TITLE[st].toLowerCase().replace(/\s+/g, '-') + '.html');
  });
  $('ctClear').addEventListener('click', function () { if (!confirm('Delete all ' + state.list.length + ' sources from your list?')) return; state.list = []; stopEdit(); drawList(); persist(); say('', 'List cleared.'); });

  ui.style.addEventListener('change', function () { state.style = ui.style.value; drawList(); update(); });
  ui.type.addEventListener('change', function () { showFields(); update(); });
  document.querySelector('.card').addEventListener('input', function (e) { if (e.target.closest('#ctAuthors') || /^ct/.test(e.target.id || '')) update(); });

  ui.style.value = state.style;
  fill(state.draft || { type: 'website', authors: [{}] });
  drawList(); render();
})();
