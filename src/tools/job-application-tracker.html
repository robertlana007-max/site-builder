<style>
.jat h3.jat-h { font-size: 18px; margin: 22px 0 10px; }
.jat h3.jat-h:first-child { margin-top: 0; }
.jat .jat-opt { font-weight: 400; color: var(--muted); }
.jat textarea { min-height: 70px; }
.jat .jat-sal { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.jat .jat-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.jat .jat-bar .seg { flex-wrap: wrap; }
.jat .jat-bar input[type=search] { flex: 1 1 180px; width: auto; }
.jat .jat-bar select { flex: 0 1 190px; width: auto; }
.jat .jat-badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.jat .jat-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: start; }
.jat .jat-col { background: var(--bg); border: 1px solid var(--line); border-top: 4px solid var(--sc); border-radius: 12px; padding: 8px; min-height: 130px; transition: border-color .15s, background .15s; }
.jat .jat-col.over { border-color: var(--accent); background: var(--accent-soft); }
.jat .jat-col h4 { margin: 2px 4px 8px; font-size: 14.5px; display: flex; justify-content: space-between; gap: 6px; }
.jat .jat-col h4 span { color: var(--muted); font-weight: 600; }
.jat .jat-cards { display: grid; gap: 8px; min-height: 50px; }
.jat .jat-card { position: relative; border: 1px solid var(--line); border-left: 4px solid var(--sc); border-radius: 10px; background: var(--surface); padding: 8px 8px 8px 10px; cursor: grab; user-select: none; -webkit-user-select: none; min-width: 0; }
.jat .jat-card.dragging { opacity: .35; }
.jat .jat-co { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; padding-right: 36px; }
.jat .jat-role { font-size: 14px; overflow-wrap: anywhere; }
.jat .jat-meta { display: flex; flex-wrap: wrap; gap: 3px 8px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.jat .jat-meta .late { color: var(--bad); font-weight: 700; }
.jat .jat-meta .soon { color: #b45309; font-weight: 700; }
:root[data-theme="dark"] .jat .jat-meta .soon { color: #fbbf24; }
.jat .jat-handle { position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: grab; touch-action: none; border-radius: 8px; }
.jat .jat-handle:hover { background: var(--bg); color: var(--ink); }
.jat .jat-acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.jat .jat-acts select { width: auto; flex: 0 1 140px; min-height: 32px; padding: 3px 6px; font-size: 13px; max-width: 100%; }
.jat .jat-ib { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; min-height: 32px; min-width: 32px; padding: 3px 9px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.jat .jat-ib:hover { border-color: var(--accent); color: var(--accent); }
.jat .jat-ib.del:hover { border-color: var(--bad); color: var(--bad); }
.jat-ghost { position: fixed; z-index: 1000; pointer-events: none; box-shadow: 0 12px 30px -8px rgba(0, 0, 0, .35); transform: rotate(2deg); opacity: .95; }
.jat .jat-empty { padding: 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; font-size: 14.5px; }
.jat .jat-col .jat-empty { padding: 10px; font-size: 13px; }
.jat .jat-list { display: grid; gap: 8px; }
.jat .jat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; border: 1px solid var(--line); border-left: 5px solid var(--sc); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.jat .jat-row .jat-co { padding: 0; }
.jat .jat-pill { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: var(--sc); border-radius: 99px; padding: 1px 9px; white-space: nowrap; }
.jat .jat-notes { font-size: 13.5px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.jat .jat-grp { margin: 16px 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.jat .jat-grp:first-child { margin-top: 0; }
.jat .jat-grp.over { color: var(--bad); }
.jat .jat-grp span { font-size: 12.5px; font-weight: 700; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; color: var(--muted); }
.jat .jat-st { display: grid; gap: 8px; margin-top: 14px; }
.jat .jat-st .r { display: grid; grid-template-columns: 90px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 14px; }
.jat .jat-st .meter { margin: 0; height: 10px; }
.jat .jat-st .meter i { background: var(--sc); }
.jat .jat-st b { text-align: end; font-variant-numeric: tabular-nums; }
.jat .jat-hint { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }
.jat .jat-priv { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
@media (max-width: 760px) { .jat .jat-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .jat .jat-board { grid-template-columns: minmax(0, 1fr); }
  .jat .jat-col { min-height: 0; }
  .jat .jat-row { grid-template-columns: minmax(0, 1fr); }
  .jat .jat-st .r { grid-template-columns: 78px minmax(0, 1fr) 36px; }
}
#jatPrintBox { display: none; }
@media print {
  @page { margin: 12mm; }
  body > *:not(#jatPrintBox) { display: none !important; }
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  #jatPrintBox { display: block !important; color: #111; font: 9.5pt/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #jatPrintBox h1 { font-size: 15pt; margin: 0 0 4px; }
  #jatPrintBox p { margin: 0 0 10px; color: #444; }
  #jatPrintBox table { width: 100%; border-collapse: collapse; }
  #jatPrintBox th, #jatPrintBox td { border: 1px solid #bbb; padding: 4px 5px; text-align: start; vertical-align: top; overflow-wrap: anywhere; }
  #jatPrintBox th { background: #eee; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #jatPrintBox thead { display: table-header-group; }
  #jatPrintBox tr { break-inside: avoid; }
  #jatPrintBox .n { white-space: nowrap; overflow-wrap: normal; }
}
</style>
<div class="jat">
<p class="jat-priv">Your applications are saved only in this browser on this device. Nothing is uploaded. Use Export now and then to keep a backup.</p>
<h3 class="jat-h" id="jatFormTitle">Add an application</h3>
<div class="fields">
  <div><label for="jatCo">Company</label><input type="text" id="jatCo" data-nomemo maxlength="100" autocomplete="off" placeholder="e.g. Blue Sky Travel"></div>
  <div><label for="jatRole">Job title</label><input type="text" id="jatRole" data-nomemo maxlength="100" autocomplete="off" placeholder="e.g. Customer Service Agent"></div>
  <div><label for="jatStatus">Status</label><select id="jatStatus" data-nomemo></select></div>
  <div><label for="jatApplied">Date applied</label><input type="date" id="jatApplied" data-nomemo></div>
  <div><label for="jatNextWhat">Next step <span class="jat-opt">(optional)</span></label><input type="text" id="jatNextWhat" data-nomemo maxlength="100" autocomplete="off" placeholder="e.g. Phone interview, follow up"></div>
  <div><label for="jatNext">Next step date <span class="jat-opt">(optional)</span></label><input type="date" id="jatNext" data-nomemo></div>
  <div><label for="jatContact">Contact <span class="jat-opt">(optional)</span></label><input type="text" id="jatContact" data-nomemo maxlength="120" autocomplete="off" placeholder="Name, email or phone"></div>
  <div><label for="jatLink">Job link <span class="jat-opt">(optional)</span></label><input type="text" inputmode="url" id="jatLink" data-nomemo maxlength="500" autocomplete="off" placeholder="https://"></div>
  <div><label for="jatSalMin">Salary <span class="jat-opt">(optional, from – to)</span></label><div class="jat-sal"><input type="number" id="jatSalMin" data-nomemo min="0" step="any" inputmode="decimal" aria-label="Salary from" placeholder="From"><input type="number" id="jatSalMax" data-nomemo min="0" step="any" inputmode="decimal" aria-label="Salary to" placeholder="To"></div></div>
  <div><label for="jatCur">Currency and period</label><div class="jat-sal"><select id="jatCur" data-nomemo aria-label="Currency"></select><select id="jatPer" data-nomemo aria-label="Salary period"><option value="year">per year</option><option value="month">per month</option><option value="week">per week</option><option value="day">per day</option><option value="hour">per hour</option></select></div></div>
</div>
<label for="jatNotes">Notes <span class="jat-opt">(optional)</span></label>
<textarea id="jatNotes" class="plain" data-nomemo maxlength="3000" placeholder="Interview questions, who you spoke to, what to prepare…"></textarea>
<div class="btns">
  <button type="button" class="btn" id="jatAdd">Add application</button>
  <button type="button" class="btn ghost" id="jatCancel" hidden>Cancel edit</button>
</div>
<p class="msg" id="jatMsg" aria-live="polite"></p>

<h3 class="jat-h">Your applications</h3>
<div class="jat-bar">
  <div class="seg" role="group" aria-label="View"><button type="button" data-v="board" aria-pressed="true">Board</button><button type="button" data-v="list" aria-pressed="false">List</button><button type="button" data-v="rem" aria-pressed="false">Reminders<span class="jat-badge" id="jatRemN" hidden></span></button><button type="button" data-v="stats" aria-pressed="false">Stats</button></div>
</div>
<div class="jat-bar" id="jatFilters">
  <input type="search" id="jatQ" data-nomemo placeholder="Search company, job, notes" aria-label="Search applications" autocomplete="off">
  <select id="jatFSt" data-nomemo aria-label="Filter by status"><option value="">All statuses</option></select>
  <select id="jatSort" data-nomemo aria-label="Sort"><option value="applied-d">Newest applied first</option><option value="applied-a">Oldest applied first</option><option value="next">Next step soonest</option><option value="co">Company A–Z</option><option value="status">Status</option><option value="sal">Salary, highest first</option><option value="upd">Recently changed</option></select>
</div>
<div id="jatView"></div>

<h3 class="jat-h">Backup and print</h3>
<div class="btns" style="margin-top:0">
  <button type="button" class="btn ghost" id="jatJson">Export JSON</button>
  <button type="button" class="btn ghost" id="jatCsv">Export CSV</button>
  <button type="button" class="btn ghost" id="jatImport">Import JSON or CSV</button>
  <input type="file" id="jatFile" accept=".json,.csv,application/json,text/csv" data-nomemo hidden>
  <button type="button" class="btn ghost" id="jatPrint">Print / save as PDF</button>
  <button type="button" class="btn ghost" id="jatClear">Delete everything</button>
</div>
<p class="msg" id="jatIoMsg" aria-live="polite"></p>
</div>
<script>
(function () {
  var KEY = 'gtn-job-application-tracker';
  var ORDER = ['saved', 'applied', 'interview', 'offer', 'rejected', 'noreply'];
  var STAT = { saved: 'Saved', applied: 'Applied', interview: 'Interview', offer: 'Offer', rejected: 'Rejected', noreply: 'No reply' };
  var COL = { saved: '#64748b', applied: '#2563eb', interview: '#d97706', offer: '#059669', rejected: '#dc2626', noreply: '#7c3aed' };
  var PER = { year: 'year', month: 'month', week: 'week', day: 'day', hour: 'hour' }, PERY = { year: 1, month: 12, week: 52, day: 260, hour: 2080 };
  var S = { apps: [], view: 'board', cur: '', sort: 'applied-d' };

  // ---------- helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function isDate(s) { if (typeof s !== 'string' || !/^\d{4}-\d\d-\d\d$/.test(s)) return false; var d = pd(s); return ds(d) === s; }
  function days(s) { var t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((pd(s) - t) / 864e5); }
  var DF = null; try { DF = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) {}
  function fd(s) { if (!s) return ''; var d = pd(s); try { return DF ? DF.format(d) : s; } catch (e) { return s; } }
  function rel(s) { var n = days(s); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n < 0 ? -n + ' days ago' : 'in ' + n + ' days'; }
  function safeUrl(u) { u = String(u || '').trim(); if (!u) return ''; if (!/^[a-z]+:/i.test(u) && /^[\w-]+(\.[\w-]+)+/.test(u)) u = 'https://' + u; return /^https?:\/\/[^\s]+$/i.test(u) ? u : ''; }
  function num(v) { if (v === '' || v == null) return null; var n = +v; return isFinite(n) && n >= 0 ? Math.min(n, 1e12) : null; }
  function money(n, cur) {
    try { if (cur) return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, maximumFractionDigits: n % 1 ? 2 : 0 }).format(n); } catch (e) {}
    return fmtNum(n, n % 1 ? 2 : 0) + (cur ? ' ' + cur : '');
  }
  function salary(a) {
    if (a.salMin == null && a.salMax == null) return '';
    var t = a.salMin != null && a.salMax != null && a.salMax !== a.salMin ? money(a.salMin, a.cur) + '–' + money(a.salMax, a.cur) : money(a.salMin != null ? a.salMin : a.salMax, a.cur);
    return t + ' / ' + PER[a.per];
  }
  function yearly(a) { var v = a.salMax != null ? a.salMax : a.salMin; return v == null ? -1 : v * PERY[a.per]; }

  // ---------- currencies (no country is assumed: the guess only sets the starting choice) ----------
  var CURS = ['USD', 'EUR', 'GBP', 'INR', 'PKR', 'BDT', 'NGN', 'KES', 'ZAR', 'EGP', 'MAD', 'GHS', 'AED', 'SAR', 'QAR', 'TRY', 'CNY', 'JPY', 'KRW', 'IDR', 'MYR', 'PHP', 'VND', 'THB', 'SGD', 'AUD', 'NZD', 'CAD', 'MXN', 'BRL', 'ARS', 'COP', 'CLP', 'PEN', 'RUB', 'UAH', 'PLN', 'CHF', 'SEK', 'NOK', 'DKK', 'CZK', 'HUF', 'RON', 'ILS', 'LKR', 'NPR', 'TZS', 'UGX', 'ETB'];
  try { if (Intl.supportedValuesOf) Intl.supportedValuesOf('currency').forEach(function (c) { if (CURS.indexOf(c) < 0) CURS.push(c); }); } catch (e) {}
  var REGCUR = { US: 'USD', GB: 'GBP', IN: 'INR', PK: 'PKR', BD: 'BDT', NG: 'NGN', KE: 'KES', ZA: 'ZAR', EG: 'EGP', MA: 'MAD', GH: 'GHS', AE: 'AED', SA: 'SAR', QA: 'QAR', TR: 'TRY', CN: 'CNY', JP: 'JPY', KR: 'KRW', ID: 'IDR', MY: 'MYR', PH: 'PHP', VN: 'VND', TH: 'THB', SG: 'SGD', AU: 'AUD', NZ: 'NZD', CA: 'CAD', MX: 'MXN', BR: 'BRL', AR: 'ARS', CO: 'COP', CL: 'CLP', PE: 'PEN', RU: 'RUB', UA: 'UAH', PL: 'PLN', CH: 'CHF', SE: 'SEK', NO: 'NOK', DK: 'DKK', CZ: 'CZK', HU: 'HUF', RO: 'RON', IL: 'ILS', LK: 'LKR', NP: 'NPR', TZ: 'TZS', UG: 'UGX', ET: 'ETB', DE: 'EUR', FR: 'EUR', ES: 'EUR', IT: 'EUR', NL: 'EUR', PT: 'EUR', IE: 'EUR', BE: 'EUR', AT: 'EUR', FI: 'EUR', GR: 'EUR' };
  var reg = ''; try { reg = (new Intl.Locale(navigator.language || 'en')).maximize().region || ''; } catch (e) {}
  var curName = null; try { curName = new Intl.DisplayNames(['en'], { type: 'currency' }); } catch (e) {}
  $('jatCur').innerHTML = '<option value="">No currency</option>' + CURS.map(function (c) { var n = ''; try { n = curName ? curName.of(c) : ''; } catch (e) {} return '<option value="' + c + '">' + c + (n && n !== c ? ' – ' + esc(n) : '') + '</option>'; }).join('');
  $('jatStatus').innerHTML = ORDER.map(function (s) { return '<option value="' + s + '">' + STAT[s] + '</option>'; }).join('');
  $('jatFSt').innerHTML += ORDER.map(function (s) { return '<option value="' + s + '">' + STAT[s] + '</option>'; }).join('');

  // ---------- data ----------
  function clean(a) {
    if (!a || typeof a !== 'object') return null;
    var co = typeof a.company === 'string' ? a.company.trim().slice(0, 100) : '', role = typeof a.role === 'string' ? a.role.trim().slice(0, 100) : '';
    if (!co && !role) return null;
    var st = String(a.status || '').toLowerCase().replace(/[\s_-]+/g, '');
    st = STAT[st] ? st : st === 'noresponse' || st === 'ghosted' ? 'noreply' : st === 'interviewing' ? 'interview' : st === 'wishlist' ? 'saved' : 'applied';
    var cur = typeof a.cur === 'string' && /^[A-Z]{3}$/.test(a.cur.toUpperCase()) ? a.cur.toUpperCase() : '';
    return {
      id: typeof a.id === 'string' && a.id ? a.id.slice(0, 40) : uid(), company: co || '(no company)', role: role || '(no job title)', status: st,
      link: typeof a.link === 'string' ? a.link.trim().slice(0, 500) : '', applied: isDate(a.applied) ? a.applied : '', next: isDate(a.next) ? a.next : '',
      nextWhat: typeof a.nextWhat === 'string' ? a.nextWhat.trim().slice(0, 100) : '', contact: typeof a.contact === 'string' ? a.contact.trim().slice(0, 120) : '',
      salMin: num(a.salMin), salMax: num(a.salMax), cur: cur, per: PER[a.per] ? a.per : 'year', notes: typeof a.notes === 'string' ? a.notes.slice(0, 3000) : '',
      created: +a.created || Date.now(), updated: +a.updated || +a.created || Date.now()
    };
  }
  try {
    var o = JSON.parse(localStorage.getItem(KEY));
    if (o && Array.isArray(o.apps)) {
      S.apps = o.apps.map(clean).filter(Boolean);
      S.view = ['board', 'list', 'rem', 'stats'].indexOf(o.view) >= 0 ? o.view : 'board';
      S.cur = typeof o.cur === 'string' ? o.cur : ''; S.sort = typeof o.sort === 'string' ? o.sort : 'applied-d';
    }
  } catch (e) {}
  if (!S.cur && REGCUR[reg]) S.cur = REGCUR[reg];
  if ($('jatSort').querySelector('option[value="' + S.sort + '"]')) $('jatSort').value = S.sort;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { io('bad', 'Could not save. Your browser storage may be full or blocked (for example in a private window).'); return false; } }
  function find(id) { for (var i = 0; i < S.apps.length; i++) if (S.apps[i].id === id) return S.apps[i]; return null; }

  // ---------- form ----------
  var editing = null;
  function say(cls, t) { var m = $('jatMsg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t || ''; }
  function io(cls, t) { var m = $('jatIoMsg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t || ''; }
  function resetForm() {
    editing = null;
    ['jatCo', 'jatRole', 'jatNextWhat', 'jatNext', 'jatContact', 'jatLink', 'jatSalMin', 'jatSalMax', 'jatNotes'].forEach(function (id) { $(id).value = ''; });
    $('jatStatus').value = 'applied'; $('jatApplied').value = ds(new Date()); $('jatCur').value = S.cur; $('jatPer').value = 'year';
    $('jatAdd').textContent = 'Add application'; $('jatCancel').hidden = true; $('jatFormTitle').textContent = 'Add an application';
  }
  $('jatAdd').addEventListener('click', function () {
    var co = $('jatCo').value.trim(), role = $('jatRole').value.trim();
    if (!co) { say('bad', 'Type the company name first.'); $('jatCo').focus(); return; }
    if (!role) { say('bad', 'Type the job title.'); $('jatRole').focus(); return; }
    var lo = $('jatSalMin').value, hi = $('jatSalMax').value;
    if ((lo !== '' && num(lo) == null) || (hi !== '' && num(hi) == null) || $('jatSalMin').validity.badInput || $('jatSalMax').validity.badInput) { say('bad', 'The salary must be a number of 0 or more, with no currency sign.'); $('jatSalMin').focus(); return; }
    if (num(lo) != null && num(hi) != null && num(hi) < num(lo)) { var t = lo; lo = hi; hi = t; }
    var link = $('jatLink').value.trim();
    if (link && !safeUrl(link)) { say('bad', 'The job link should be a web address such as https://example.com/jobs/123.'); $('jatLink').focus(); return; }
    var st = $('jatStatus').value, applied = $('jatApplied').value;
    var data = { company: co, role: role, status: st, applied: applied, next: $('jatNext').value, nextWhat: $('jatNextWhat').value, contact: $('jatContact').value, link: link ? safeUrl(link) : '',
      salMin: lo, salMax: hi, cur: $('jatCur').value, per: $('jatPer').value, notes: $('jatNotes').value.trim() };
    S.cur = $('jatCur').value;
    if (editing) {
      var a = find(editing);
      if (a) { var c = clean(Object.assign({}, a, data, { updated: Date.now() })); for (var k in c) a[k] = c[k]; }
      say('ok', 'Saved changes to ' + co + '.');
    } else {
      if (S.apps.length >= 3000) { say('bad', 'You have 3,000 applications. Delete old ones to add more.'); return; }
      data.id = uid(); data.created = data.updated = Date.now();
      S.apps.push(clean(data)); say('ok', 'Added ' + role + ' at ' + co + '.');
      if (window.burst) burst($('jatAdd'));
    }
    resetForm(); save(); render(); $('jatCo').focus();
  });
  ['jatCo', 'jatRole'].forEach(function (id) { $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') $('jatAdd').click(); }); });
  $('jatCancel').addEventListener('click', function () { resetForm(); say('', ''); });
  function edit(a) {
    editing = a.id;
