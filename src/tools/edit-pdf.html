<div class="drop" id="drop" tabindex="0" role="button"><b>Click or drop a PDF here</b>Then click any line of text to change it. Nothing is uploaded.</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div id="editor" hidden>
  <div class="pager">
    <button class="btn ghost" id="prev" aria-label="Previous page">‹</button>
    <span id="pageNo">Page 1 of 1</span>
    <button class="btn ghost" id="next" aria-label="Next page">›</button>
    <span class="grow"></span>
    <span id="count">No changes yet</span>
  </div>
  <div class="notice" id="notice"><div class="meter" id="scanBar" hidden><i id="scanFill"></i></div><p id="hint">Opening…</p></div>
  <div class="stage" id="stage"><div class="sheet" id="sheet"><canvas id="cv"></canvas><div id="layer"></div></div></div>
  <div class="editbar" id="bar" hidden>
    <input type="text" class="edit-in" aria-label="New text for the selected line" autocomplete="off" spellcheck="false">
    <button class="btn ghost" id="undoLine">Undo</button>
    <button class="btn" id="doneLine">Done</button>
  </div>
</div>
<div class="btns"><button class="btn" id="go" disabled>Save edited PDF</button><a class="btn ghost" id="dl" hidden>Download PDF</a></div>
<p class="msg" id="msg"></p>

  $('go').addEventListener('click', function () {
    if (cur) deselect();
    PT.run(async function () {
      var doc = await PT.open(file), own = {}, std = {}, nf = {}, usedOwn = 0, usedStd = 0, usedPic = 0, covered = 0, list = Object.keys(edits).map(function (k) { return edits[k]; });
