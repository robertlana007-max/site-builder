<div class="vcb" id="vcb">
<div class="stats" style="margin:0 0 14px">
  <div class="stat"><span>Words I know</span><b id="vcbKnown">0</b></div>
  <div class="stat"><span>Today's goal</span><b id="vcbToday">0 / 10</b></div>
  <div class="stat"><span>Day streak</span><b id="vcbStreak">0</b></div>
</div>
<div class="meter" aria-hidden="true" style="margin:-4px 0 14px"><i id="vcbBar"></i></div>
<div class="seg vcb-tabs" role="group" aria-label="Mode">
  <button type="button" data-tab="browse" aria-pressed="true">Browse words</button>
  <button type="button" data-tab="quiz" aria-pressed="false">Practice quiz</button>
</div>

<div id="vcbBrowse">
  <div class="fields" style="margin-bottom:8px">
    <div><label for="vcbSearch">Search</label><input type="search" id="vcbSearch" data-nomemo placeholder="Word or meaning, e.g. evidence" autocomplete="off"></div>
    <div><label for="vcbLevel">Level</label><select id="vcbLevel"><option value="">All levels</option><option value="B1">B1 (intermediate)</option><option value="B2">B2 (upper intermediate)</option><option value="C1">C1 (advanced)</option></select></div>
    <div><label for="vcbShow">Show</label><select id="vcbShow"><option value="">All words</option><option value="new">Words I am learning</option><option value="known">Words I know</option></select></div>
  </div>
  <p class="msg" id="vcbCount" style="margin:0" aria-live="polite"></p>
  <div class="vcb-list" id="vcbList"></div>
  <div class="btns"><button type="button" class="btn ghost" id="vcbMore" hidden>Show more words</button></div>
</div>

<div id="vcbQuiz" hidden>
  <div class="fields">
    <div><label for="vcbMode">Quiz type</label><select id="vcbMode"><option value="meaning">Choose the meaning</option><option value="word">Choose the word</option><option value="gap">Fill the gap</option><option value="mix">Mixed</option></select></div>
    <div><label for="vcbQLevel">Level</label><select id="vcbQLevel"><option value="">All levels</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option></select></div>
    <div><label for="vcbLen">Questions per round</label><select id="vcbLen"><option value="10">10</option><option value="20">20</option><option value="30">30</option></select></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="vcbOnlyNew" checked>Only words I have not marked as known</label></div>
  <div class="btns" style="margin:0"><button type="button" class="btn" id="vcbStart">Start practice</button></div>
  <div class="vcb-q" id="vcbCard" hidden>
    <div class="msg" id="vcbQNum" style="margin:0"></div>
    <div class="vcb-prompt" id="vcbPrompt"></div>
    <div class="vcb-opts" id="vcbOpts" role="group" aria-label="Answer choices"></div>
    <div class="vcb-fb" id="vcbFb" hidden aria-live="polite"></div>
    <div class="btns"><button type="button" class="btn" id="vcbNext" hidden>Next</button><button type="button" class="btn ghost" id="vcbStop">End round</button></div>
  </div>
  <div class="vcb-q" id="vcbEnd" hidden aria-live="polite"></div>
  <p class="msg">Keyboard: press 1 to 4 to answer and Enter for the next question.</p>
</div>
<div class="vcb-goal">
  <label for="vcbGoal">Daily goal</label>
  <select id="vcbGoal" data-nomemo><option value="5">5 correct answers a day</option><option value="10">10 correct answers a day</option><option value="20">20 correct answers a day</option><option value="30">30 correct answers a day</option><option value="50">50 correct answers a day</option></select>
  <button type="button" class="btn ghost danger" id="vcbReset">Reset my progress</button>
</div>
<p class="msg" id="vcbMsg"></p>
</div>

<script>
(function () {
  var W = $('vcbData').textContent.trim().split('\n').map(function (l) { var p = l.split('|'); return { w: p[0], pos: p[1], lv: p[2], d: p[3], ex: p[4] }; });
  var KEY = 'gtn-vocab', st = { known: {}, goal: 10, days: {} };
  try { var s0 = JSON.parse(localStorage.getItem(KEY)); if (s0 && typeof s0 === 'object') { if (s0.known && typeof s0.known === 'object') st.known = s0.known; if ([5, 10, 20, 30, 50].indexOf(s0.goal) !== -1) st.goal = s0.goal; if (s0.days && typeof s0.days === 'object') st.days = s0.days; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function say(cls, t) { $('vcbMsg').className = 'msg ' + (cls || ''); $('vcbMsg').textContent = t || ''; }

  // ---------- daily goal and streak (local calendar days) ----------
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function streak() {
    var d = new Date(), n = 0, met = function (k) { return (st.days[k] || 0) >= (st.goalOn && st.goalOn[k] || st.goal); };
    if (!met(dayKey(d))) d.setDate(d.getDate() - 1); // today is still open, so count from yesterday
    while (met(dayKey(d)) && n < 5000) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function paintTop() {
    var known = W.filter(function (x) { return st.known[x.w]; }).length, today = st.days[dayKey()] || 0;
    $('vcbKnown').textContent = known + ' / ' + W.length;
    $('vcbToday').textContent = Math.min(today, 999) + ' / ' + st.goal + (today >= st.goal ? ' ✓' : '');
    var s = streak(); $('vcbStreak').textContent = s + (s === 1 ? ' day' : ' days');
    $('vcbBar').style.width = Math.min(100, today / st.goal * 100) + '%';
    $('vcbGoal').value = String(st.goal);
  }
  function scored() {
    var k = dayKey(), before = st.days[k] || 0; st.days[k] = before + 1;
    st.goalOn = st.goalOn || {}; st.goalOn[k] = st.goal;
    var keys = Object.keys(st.days).sort(); while (keys.length > 400) { delete st.days[keys[0]]; if (st.goalOn) delete st.goalOn[keys[0]]; keys.shift(); }
    save(); paintTop();
    if (before < st.goal && before + 1 >= st.goal) { toast('Daily goal reached!'); burst($('vcbToday')); }
  }
  $('vcbGoal').addEventListener('change', function () { st.goal = +this.value; if (st.goalOn) st.goalOn[dayKey()] = st.goal; save(); paintTop(); });
  $('vcbReset').addEventListener('click', function () {
    if (!confirm('Reset your known words, daily progress and streak? This cannot be undone.')) return;
    st = { known: {}, goal: st.goal, days: {} }; save(); paintTop(); list(true); say('ok', 'Your progress was reset.');
  });

  // ---------- pronunciation ----------
  var synth = window.speechSynthesis, voice = null, canSpeak = false;
  function pickVoice() {
    if (!synth || !window.SpeechSynthesisUtterance) return;
    var v = synth.getVoices() || [], en = v.filter(function (x) { return /^en[-_]/i.test(x.lang) || x.lang === 'en'; });
    voice = en.filter(function (x) { return /^en[-_](GB|US)/i.test(x.lang) && x.localService; })[0] || en[0] || null;
    var was = canSpeak; canSpeak = !!voice;
    if (was !== canSpeak) document.querySelectorAll('#vcb [data-say]').forEach(function (b) { b.hidden = !canSpeak; });
  }
  if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice); else synth.onvoiceschanged = pickVoice; }
  function speak(t) {
    if (!canSpeak) return;
    try { synth.cancel(); var u = new SpeechSynthesisUtterance(t); u.voice = voice; u.lang = voice.lang; u.rate = .9; synth.speak(u); } catch (e) {}
  }
  function sayBtn(word) { var b = el('button', 'vcb-mini', '🔊'); b.type = 'button'; b.setAttribute('data-say', word); b.setAttribute('aria-label', 'Hear "' + word + '"'); b.title = 'Hear it'; b.hidden = !canSpeak; return b; }
  document.getElementById('vcb').addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) speak(b.getAttribute('data-say')); });

  // ---------- browse ----------
  var shown = 0, PAGE = 40, rows = [];
  function card(x) {
    var c = el('div', 'vcb-w' + (st.known[x.w] ? ' known' : '')), h = el('div', 'vcb-wh');
    c.setAttribute('data-w', x.w);
    h.appendChild(el('b', null, x.w)); h.appendChild(el('span', 'vcb-pos', x.pos)); h.appendChild(el('span', 'vcb-lv', x.lv));
    var a = el('div', 'vcb-acts'); a.appendChild(sayBtn(x.w));
    var k = el('button', 'vcb-mini', st.known[x.w] ? '✓ Known' : 'Mark as known'); k.type = 'button'; k.setAttribute('data-known', x.w); k.setAttribute('aria-pressed', st.known[x.w] ? 'true' : 'false');
    a.appendChild(k); h.appendChild(a); c.appendChild(h);
    c.appendChild(el('p', 'vcb-def', x.d)); c.appendChild(el('p', 'vcb-ex', x.ex));
    return c;
  }
  function list(reset) {
    var q = $('vcbSearch').value.trim().toLowerCase(), lv = $('vcbLevel').value, sh = $('vcbShow').value;
    if (reset) {
      rows = W.filter(function (x) {
        if (lv && x.lv !== lv) return false;
        if (sh === 'known' && !st.known[x.w]) return false;
        if (sh === 'new' && st.known[x.w]) return false;
        return !q || x.w.toLowerCase().indexOf(q) !== -1 || x.d.toLowerCase().indexOf(q) !== -1;
      });
      if (q) rows.sort(function (a, b) { var A = a.w.toLowerCase().indexOf(q) === 0 ? 0 : a.w.toLowerCase().indexOf(q) !== -1 ? 1 : 2, B = b.w.toLowerCase().indexOf(q) === 0 ? 0 : b.w.toLowerCase().indexOf(q) !== -1 ? 1 : 2; return A - B; });
      shown = 0; $('vcbList').textContent = '';
    }
    var frag = document.createDocumentFragment(), end = Math.min(rows.length, shown + PAGE);
    for (var i = shown; i < end; i++) frag.appendChild(card(rows[i]));
    $('vcbList').appendChild(frag); shown = end;
    $('vcbMore').hidden = shown >= rows.length;
    $('vcbCount').textContent = rows.length ? 'Showing ' + shown + ' of ' + rows.length + ' word' + (rows.length === 1 ? '' : 's') + '.' : 'No words match. Try a shorter search or another level.';
  }
  var tmr = 0;
  $('vcbSearch').addEventListener('input', function () { clearTimeout(tmr); tmr = setTimeout(function () { list(true); }, 120); });
  $('vcbLevel').addEventListener('change', function () { list(true); });
  $('vcbShow').addEventListener('change', function () { list(true); });
  $('vcbMore').addEventListener('click', function () { list(false); });
  function setKnown(w, on) {
    if (on) st.known[w] = 1; else delete st.known[w];
    save(); paintTop();
    document.querySelectorAll('#vcb [data-known]').forEach(function (b) {
      if (b.getAttribute('data-known') !== w) return;
      b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.textContent = on ? '✓ Known' : 'Mark as known';
      var c = b.closest('.vcb-w'); if (c) c.classList.toggle('known', on);
    });
  }
  document.getElementById('vcb').addEventListener('click', function (e) { var b = e.target.closest('[data-known]'); if (b) setKnown(b.getAttribute('data-known'), !st.known[b.getAttribute('data-known')]); });

  // ---------- quiz ----------
  function rnd(n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // find the word inside its example sentence, even when it changes form (deny -> denied, undertake -> undertook)
  function gapOf(x) {
    var re = /[A-Za-z][A-Za-z'-]*/g, toks = [], m, lw = x.w.toLowerCase();
    while ((m = re.exec(x.ex))) toks.push({ t: m[0], i: m.index });
    for (var n = lw.length; n >= Math.max(3, lw.length - 3); n--) { var stem = lw.slice(0, n); for (var k = 0; k < toks.length; k++) if (toks[k].t.toLowerCase().indexOf(stem) === 0) return toks[k]; }
    return null;
  }
  var round = null;
  function distractors(x, n, field) {
    var same = shuffle(W.filter(function (y) { return y !== x && y.pos === x.pos && y[field] !== x[field]; })), out = [], seen = {};
    seen[x[field]] = 1;
    same.concat(shuffle(W)).forEach(function (y) { if (out.length < n && !seen[y[field]] && y !== x) { seen[y[field]] = 1; out.push(y); } });
    return out;
  }
  function makeQ(x, mode) {
    if (mode === 'mix') mode = ['meaning', 'word', 'gap'][rnd(3)];
    var q = { x: x, mode: mode };
    if (mode === 'meaning') { q.opts = shuffle([x].concat(distractors(x, 3, 'd'))); q.label = function (y) { return y.d; }; }
    else { q.opts = shuffle([x].concat(distractors(x, 3, 'w'))); q.label = function (y) { return y.w; }; }
    if (mode === 'gap') q.gap = gapOf(x);
    return q;
  }
  $('vcbStart').addEventListener('click', function () {
    var lv = $('vcbQLevel').value, only = $('vcbOnlyNew').checked, len = +$('vcbLen').value || 10;
    var pool = W.filter(function (x) { return (!lv || x.lv === lv) && (!only || !st.known[x.w]); });
    if (pool.length < 1) { $('vcbEnd').hidden = false; $('vcbCard').hidden = true; $('vcbEnd').textContent = 'You have marked every ' + (lv ? lv + ' ' : '') + 'word as known. Untick "Only words I have not marked as known" to practise them again, or choose another level.'; return; }
    var picks = shuffle(pool).slice(0, len);
    round = { qs: picks.map(function (x) { return makeQ(x, $('vcbMode').value); }), at: 0, right: 0, missed: [] };
    $('vcbEnd').hidden = true; $('vcbCard').hidden = false; show();
  });
  function show() {
    var q = round.qs[round.at], x = q.x, p = $('vcbPrompt'), o = $('vcbOpts');
    q.done = false;
    $('vcbQNum').textContent = 'Question ' + (round.at + 1) + ' of ' + round.qs.length + ' · ' + x.lv + ' · ' + (q.mode === 'meaning' ? 'Choose the meaning' : q.mode === 'word' ? 'Choose the word' : 'Fill the gap');
    p.textContent = ''; p.className = 'vcb-prompt';
    if (q.mode === 'meaning') { p.appendChild(document.createTextNode(x.w + ' ')); p.appendChild(el('span', 'vcb-pos', '(' + x.pos + ')')); var sb = sayBtn(x.w); sb.style.marginInlineStart = '8px'; p.appendChild(sb); }
    else if (q.mode === 'word') { p.className = 'vcb-prompt small'; p.textContent = 'Which ' + x.pos + ' means: "' + x.d + '"?'; }
    else {
      p.className = 'vcb-prompt small';
      p.appendChild(document.createTextNode(x.ex.slice(0, q.gap.i)));
      var g = el('span', 'vcb-gap', ' '); g.setAttribute('aria-label', 'blank'); p.appendChild(g);
      p.appendChild(document.createTextNode(x.ex.slice(q.gap.i + q.gap.t.length)));
      if (q.gap.t.toLowerCase() !== x.w.toLowerCase()) p.appendChild(el('span', 'msg', ' (the word may change form, for example -s, -ed or -ing)'));
    }
    o.textContent = '';
    q.opts.forEach(function (y, i) { var b = el('button', 'vcb-opt'); b.type = 'button'; b.setAttribute('data-i', i); var k = el('kbd', null, String(i + 1)); b.appendChild(k); b.appendChild(document.createTextNode(q.label(y))); o.appendChild(b); });
    $('vcbFb').hidden = true; $('vcbNext').hidden = true;
    var f = o.querySelector('button'); if (f) f.focus({ preventScroll: true });
  }
  function answer(i) {
    var q = round.qs[round.at]; if (!q || q.done) return; q.done = true;
    var pick = q.opts[i], ok = pick === q.x, x = q.x;
    $('vcbOpts').querySelectorAll('button').forEach(function (b, j) { b.disabled = true; if (q.opts[j] === x) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
    if (ok) { round.right++; scored(); } else round.missed.push(x);
    var fb = $('vcbFb'); fb.textContent = '';
    fb.appendChild(el('b', null, ok ? '✓ Correct! ' : '✗ The answer is "' + x.w + '". '));
    fb.appendChild(document.createTextNode(x.w + ' (' + x.pos + '): ' + x.d + '. '));
    fb.appendChild(el('i', null, x.ex));
    var a = el('div', 'btns'); a.style.marginTop = '8px'; a.appendChild(sayBtn(x.w));
    var k = el('button', 'vcb-mini', st.known[x.w] ? '✓ Known' : 'Mark as known'); k.type = 'button'; k.setAttribute('data-known', x.w); k.setAttribute('aria-pressed', st.known[x.w] ? 'true' : 'false'); a.appendChild(k);
    fb.appendChild(a); fb.hidden = false;
    $('vcbNext').hidden = false; $('vcbNext').textContent = round.at + 1 < round.qs.length ? 'Next' : 'See result'; $('vcbNext').focus({ preventScroll: true });
  }
  $('vcbOpts').addEventListener('click', function (e) { var b = e.target.closest('button[data-i]'); if (b && !b.disabled) answer(+b.getAttribute('data-i')); });
  function next() { if (!round) return; round.at++; if (round.at >= round.qs.length) finish(); else show(); }
  $('vcbNext').addEventListener('click', next);
  function finish() {
    var r = round, e = $('vcbEnd'), done = r.qs.filter(function (q) { return q.done; }).length; round = null;
    $('vcbCard').hidden = true; e.hidden = false; e.textContent = '';
    e.appendChild(el('h3', null, 'Round score: ' + r.right + ' / ' + done));
    if (!done) e.appendChild(el('p', null, 'No questions answered.'));
    if (r.missed.length) {
      e.appendChild(el('p', null, 'Words to review:'));
      var ul = el('ul'); r.missed.forEach(function (x) { var li = el('li'); li.appendChild(el('b', null, x.w)); li.appendChild(document.createTextNode(' - ' + x.d)); ul.appendChild(li); }); e.appendChild(ul);
    } else if (done) e.appendChild(el('p', null, 'Perfect round! Mark the words you are sure of as known so they stop appearing.'));
    if (done && r.right === done) burst(e);
    var b = el('button', 'btn', 'Practise again'); b.type = 'button'; b.addEventListener('click', function () { $('vcbStart').click(); }); var w = el('div', 'btns'); w.appendChild(b); e.appendChild(w);
    b.focus({ preventScroll: true });
  }
  $('vcbStop').addEventListener('click', function () { if (round) finish(); });
  document.addEventListener('keydown', function (e) {
    if (!round || $('vcbQuiz').hidden || e.ctrlKey || e.metaKey || e.altKey || /INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ''))) return;
    var q = round.qs[round.at];
    if (/^[1-4]$/.test(e.key) && q && !q.done) { e.preventDefault(); answer(+e.key - 1); }
    else if (e.key === 'Enter' && q && q.done && e.target.id !== 'vcbNext') { e.preventDefault(); next(); }
  });

  // ---------- tabs ----------
  document.querySelectorAll('.vcb-tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      var n = b.getAttribute('data-tab');
      document.querySelectorAll('.vcb-tabs button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      $('vcbBrowse').hidden = n !== 'browse'; $('vcbQuiz').hidden = n !== 'quiz';
      if (n === 'browse') list(true);
    });
  });
  paintTop(); list(true);
})();
</script>
