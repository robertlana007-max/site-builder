<div class="fields">
  <div><label for="kind">Category</label><select id="kind"></select></div>
  <div><label for="val">Value</label><input type="number" id="val" step="any" value="1"></div>
  <div><label for="from">From</label><select id="from"></select></div>
  <div><label for="to">To</label><select id="to"></select></div>
</div>
<div class="out" id="res">–</div>
<div class="btns"><button class="btn ghost" id="swap">Swap units</button><button class="btn ghost" id="cp">Copy result</button></div>
<script>
(function () {
  // factor = how many base units one of this unit equals
  var U = {
    Length: { Meter: 1, Kilometer: 1000, Centimeter: 0.01, Millimeter: 0.001, Mile: 1609.344, Yard: 0.9144, Foot: 0.3048, Inch: 0.0254 },
    Weight: { Kilogram: 1, Gram: 0.001, Milligram: 0.000001, 'Metric ton': 1000, Pound: 0.45359237, Ounce: 0.028349523125, Stone: 6.35029318 },
    Temperature: { Celsius: 0, Fahrenheit: 0, Kelvin: 0 },
    Area: { 'Square meter': 1, 'Square kilometer': 1e6, 'Square foot': 0.09290304, 'Square yard': 0.83612736, Acre: 4046.8564224, Hectare: 10000, 'Square mile': 2589988.110336 },
    Volume: { Liter: 1, Milliliter: 0.001, 'Cubic meter': 1000, 'US gallon': 3.785411784, 'US quart': 0.946352946, 'US cup': 0.2365882365, 'US fluid ounce': 0.0295735295625, 'UK gallon': 4.54609 },
    Speed: { 'Meter/second': 1, 'Kilometer/hour': 1 / 3.6, 'Mile/hour': 0.44704, Knot: 1852 / 3600, 'Foot/second': 0.3048 },
    // kB, MB, GB, TB are 1000-based (SI, used by disk and phone makers); KiB, MiB, GiB, TiB are 1024-based (used by Windows and memory)
    Data: { Bit: 0.125, Byte: 1, 'Kilobyte (kB)': 1e3, 'Megabyte (MB)': 1e6, 'Gigabyte (GB)': 1e9, 'Terabyte (TB)': 1e12, 'Kibibyte (KiB)': 1024, 'Mebibyte (MiB)': 1048576, 'Gibibyte (GiB)': 1073741824, 'Tebibyte (TiB)': 1099511627776 },
    Time: { Second: 1, Minute: 60, Hour: 3600, Day: 86400, Week: 604800, 'Year (365 d)': 31536000 }
  };
  // the pair picked when a category is chosen
  var DEF = { Length: ['Kilometer', 'Mile'], Weight: ['Kilogram', 'Pound'], Temperature: ['Celsius', 'Fahrenheit'], Area: ['Square meter', 'Square foot'], Volume: ['Liter', 'US gallon'], Speed: ['Kilometer/hour', 'Mile/hour'], Data: ['Gigabyte (GB)', 'Megabyte (MB)'], Time: ['Hour', 'Minute'] };
  var last = '';
  function fill() {
    var names = Object.keys(U[$('kind').value]), opts = names.map(function (n) { return '<option>' + n + '</option>'; }).join('');
    $('from').innerHTML = opts; $('to').innerHTML = opts;
    $('from').value = DEF[$('kind').value][0]; $('to').value = DEF[$('kind').value][1];
    calc();
  }
  function temp(v, f, t) {
    var c = f === 'Celsius' ? v : f === 'Fahrenheit' ? (v - 32) * 5 / 9 : v - 273.15;
    return t === 'Celsius' ? c : t === 'Fahrenheit' ? c * 9 / 5 + 32 : c + 273.15;
  }
  function calc() {
    var k = $('kind').value, f = $('from').value, t = $('to').value, s = $('val').value;
    if (s === '' || isNaN(+s)) { $('res').textContent = '–'; last = ''; return; }
    if (k === 'Temperature' && temp(+s, f, 'Kelvin') < -1e-9) { $('res').textContent = 'That is below absolute zero (0 Kelvin, −273.15 °C, −459.67 °F), the lowest possible temperature.'; last = ''; return; }
    var r = k === 'Temperature' ? temp(+s, f, t) : +s * U[k][f] / U[k][t];
    last = String(parseFloat(r.toPrecision(10)));
    $('res').textContent = s + ' ' + f + ' = ' + last + ' ' + t;
  }
  $('kind').innerHTML = Object.keys(U).map(function (n) { return '<option>' + n + '</option>'; }).join('');
  $('kind').addEventListener('change', fill);
  ['val', 'from', 'to'].forEach(function (id) { $(id).addEventListener('input', calc); });
  $('swap').addEventListener('click', function () { var a = $('from').value; $('from').value = $('to').value; $('to').value = a; calc(); });
  $('cp').addEventListener('click', function () { if (last) copyText(last, $('cp')); });
  fill();
})();
</script>
