<div class="fields">
  <div><label for="fcDist">Distance</label><input type="number" id="fcDist" min="0" step="any" value="250" inputmode="decimal"></div>
  <div><label for="fcDU">Distance unit</label><select id="fcDU"><option value="km">Kilometers (km)</option><option value="mi">Miles (mi)</option></select></div>
  <div><label for="fcTrip">Trip</label><select id="fcTrip"><option value="1">One way</option><option value="2">Round trip (there and back)</option></select></div>
</div>
<div class="fields">
  <div><label for="fcEff">Fuel economy</label><input type="number" id="fcEff" min="0" step="any" value="7" inputmode="decimal"></div>
  <div><label for="fcEU">Economy unit</label><select id="fcEU">
    <optgroup label="Petrol, diesel, gas"><option value="l100">L/100 km</option><option value="kmL">km per liter (km/L)</option><option value="mpgUS">Miles per US gallon (mpg)</option><option value="mpgUK">Miles per UK gallon (mpg)</option></optgroup>
    <optgroup label="Electric car"><option value="kwh100">kWh/100 km</option><option value="kmkwh">km per kWh</option><option value="mikwh">Miles per kWh</option><option value="wh_mi">Wh per mile</option></optgroup>
  </select></div>
</div>
<div class="fields">
  <div><label for="fcPrice">Price</label><input type="number" id="fcPrice" min="0" step="any" value="1.6" inputmode="decimal"></div>
  <div><label for="fcPU">Price is per</label><select id="fcPU"><option value="L">Liter</option><option value="usgal">US gallon</option><option value="ukgal">UK (imperial) gallon</option><option value="kwh">kWh (electric)</option></select></div>
  <div><label for="fcCur">Currency</label><select id="fcCur"></select></div>
  <div id="fcCurOBox" hidden><label for="fcCurO">Your currency symbol</label><input type="text" id="fcCurO" maxlength="6" placeholder="e.g. KES"></div>
  <div><label for="fcPpl">Split between (people)</label><input type="number" id="fcPpl" min="1" step="1" value="1" inputmode="numeric"></div>
</div>
<div class="stats">
  <div class="stat"><span>Trip cost</span><b id="fcCost">–</b></div>
  <div class="stat"><span>Per person</span><b id="fcPer">–</b></div>
  <div class="stat"><span>Fuel needed</span><b id="fcFuel">–</b></div>
  <div class="stat"><span>Total distance</span><b id="fcTD">–</b></div>
  <div class="stat"><span>Cost per km</span><b id="fcPkm">–</b></div>
  <div class="stat"><span>Cost per mile</span><b id="fcPmi">–</b></div>
</div>
<p class="msg" id="fcMsg"></p>
<div class="btns"><button type="button" class="btn ghost" id="fcCopy">Copy summary</button></div>
<script>
(function () {
  function num(n, d) { return Number(n).toLocaleString((Prefs.get() || {}).numfmt || 'en-US', { maximumFractionDigits: d == null ? 2 : d }); }
  var MI = 1.609344, USG = 3.785411784, UKG = 4.54609;
  var CUR = [['', 'No symbol'], ['$', 'US dollar ($)'], ['€', 'Euro (€)'], ['£', 'British pound (£)'], ['₹', 'Indian rupee (₹)'], ['Rs', 'Pakistani rupee (Rs)'], ['৳', 'Bangladeshi taka (৳)'], ['₦', 'Nigerian naira (₦)'], ['KSh', 'Kenyan shilling (KSh)'], ['R', 'South African rand (R)'], ['AED', 'UAE dirham (AED)'], ['SAR', 'Saudi riyal (SAR)'], ['₱', 'Philippine peso (₱)'], ['Rp', 'Indonesian rupiah (Rp)'], ['RM', 'Malaysian ringgit (RM)'], ['R$', 'Brazilian real (R$)'], ['C$', 'Canadian dollar (C$)'], ['A$', 'Australian dollar (A$)'], ['¥', 'Yen / yuan (¥)'], ['₺', 'Turkish lira (₺)'], ['E£', 'Egyptian pound (E£)'], ['other', 'Other…']];
  var REG = { US: '$', GB: '£', IN: '₹', PK: 'Rs', BD: '৳', NG: '₦', KE: 'KSh', ZA: 'R', AE: 'AED', SA: 'SAR', PH: '₱', ID: 'Rp', MY: 'RM', BR: 'R$', CA: 'C$', AU: 'A$', JP: '¥', CN: '¥', TR: '₺', EG: 'E£' };
  'AT BE CY DE EE ES FI FR GR HR IE IT LT LU LV MT NL PT SI SK'.split(' ').forEach(function (c) { REG[c] = '€'; });
  $('fcCur').innerHTML = CUR.map(function (c) { return '<option value="' + c[0] + '">' + c[1] + '</option>'; }).join('');
  var region = ''; try { region = ((navigator.language || '').split('-')[1] || '').toUpperCase(); } catch (e) {}
  $('fcCur').value = REG[region] || '';
  if (region === 'US') { $('fcDU').value = 'mi'; $('fcDist').value = 150; $('fcEU').value = 'mpgUS'; $('fcEff').value = 30; $('fcPU').value = 'usgal'; $('fcPrice').value = 3.5; }
  else if (region === 'GB') { $('fcDU').value = 'mi'; $('fcDist').value = 150; $('fcEU').value = 'mpgUK'; $('fcEff').value = 45; $('fcPrice').value = 1.4; }
  function cur() { var v = $('fcCur').value; if (v === 'other') v = $('fcCurO').value.trim(); return v ? v + ' ' : ''; }
  function money(x) { return cur() + window.fmtNum(x, 2); }
  var copyTxt = '', lastElectric = null;
  function calc() {
    $('fcCurOBox').hidden = $('fcCur').value !== 'other';
    var eu = $('fcEU').value, electric = /kwh|wh_/.test(eu), msg = $('fcMsg'), ids = ['fcCost', 'fcPer', 'fcFuel', 'fcTD', 'fcPkm', 'fcPmi'];
    // keep the price unit sensible for the kind of car
    if (electric !== lastElectric) {
      Array.prototype.forEach.call($('fcPU').options, function (o) { o.disabled = electric ? o.value !== 'kwh' : o.value === 'kwh'; });
      if (electric && $('fcPU').value !== 'kwh') $('fcPU').value = 'kwh';
      if (!electric && $('fcPU').value === 'kwh') $('fcPU').value = $('fcDU').value === 'mi' && region === 'US' ? 'usgal' : 'L';
      lastElectric = electric;
    }
    function fail(t) { ids.forEach(function (i) { $(i).textContent = '–'; }); msg.className = 'msg bad'; msg.textContent = t; copyTxt = ''; }
    var d = $('fcDist').value, e = $('fcEff').value, pr = $('fcPrice').value, pp = $('fcPpl').value;
    if (d === '' || e === '' || pr === '') return fail('Enter the distance, fuel economy and price.');
    d = +d; e = +e; pr = +pr; pp = pp === '' ? 1 : +pp;
    if (!(d > 0) || !isFinite(d)) return fail('Distance must be greater than 0.');
    if (!(e > 0) || !isFinite(e)) return fail('Fuel economy must be greater than 0.');
    if (!(pr >= 0) || !isFinite(pr)) return fail('Price cannot be negative.');
    if (!(pp >= 1) || Math.floor(pp) !== pp) return fail('Number of people must be a whole number, 1 or more.');
    if (d > 1e8) return fail('That distance is too large. Please check it.');
    var km = d * (+$('fcTrip').value) * ($('fcDU').value === 'mi' ? MI : 1), mi = km / MI, q, qtxt;
    if (eu === 'l100') q = km * e / 100;
    else if (eu === 'kmL') q = km / e;
    else if (eu === 'mpgUS') q = mi / e * USG;
    else if (eu === 'mpgUK') q = mi / e * UKG;
    else if (eu === 'kwh100') q = km * e / 100;
    else if (eu === 'kmkwh') q = km / e;
    else if (eu === 'mikwh') q = mi / e;
    else q = mi * e / 1000;
    var pu = $('fcPU').value, inUnit = electric ? q : pu === 'usgal' ? q / USG : pu === 'ukgal' ? q / UKG : q;
    var cost = inUnit * pr;
    qtxt = electric ? num(q) + ' kWh' : num(q) + ' L' + (pu === 'usgal' ? ' (' + num(q / USG, 2) + ' US gal)' : pu === 'ukgal' ? ' (' + num(q / UKG, 2) + ' UK gal)' : '');
    $('fcCost').textContent = money(cost);
    $('fcPer').textContent = money(cost / pp);
    $('fcFuel').textContent = qtxt;
    $('fcTD').textContent = $('fcDU').value === 'mi' ? num(mi, 1) + ' mi' : num(km, 1) + ' km';
    $('fcPkm').textContent = money(cost / km);
    $('fcPmi').textContent = money(cost / mi);
    var warn = '';
    if (!electric && ((eu === 'l100' && (e < 2 || e > 40)) || (eu === 'kmL' && (e < 2.5 || e > 50)) || (/mpg/.test(eu) && (e < 5 || e > 120)))) warn = 'That fuel economy looks unusual for a car. Check you picked the right unit (km/L, L/100 km or mpg).';
    msg.className = 'msg'; msg.textContent = warn;
    copyTxt = 'Trip: ' + $('fcTD').textContent + '\nFuel: ' + qtxt + '\nCost: ' + money(cost) + (pp > 1 ? '\nPer person (' + pp + '): ' + money(cost / pp) : '');
  }
  ['fcDist', 'fcDU', 'fcTrip', 'fcEff', 'fcEU', 'fcPrice', 'fcPU', 'fcCur', 'fcCurO', 'fcPpl'].forEach(function (id) { $(id).addEventListener('input', calc); $(id).addEventListener('change', calc); });
  $('fcCopy').addEventListener('click', function () { if (copyTxt) copyText(copyTxt, this); });
  calc();
})();
</script>
