<style>
.pam-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.pam-bar .seg { flex-wrap: wrap; }
.pam-bar .btn { min-height: 38px; padding: 6px 12px; }
.pam-wrap { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 8px; text-align: center; line-height: 0; margin: 0 0 10px; }
.pam-wrap canvas { touch-action: none; cursor: crosshair; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.pam-pal { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 0 0 12px; }
.pam-pal button { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; cursor: pointer; }
.pam-pal button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.pam-pal button.clear { background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 10px 10px; }
.pam-pal input[type=color] { width: 46px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); cursor: pointer; }
.pam-frames { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 0 6px; }
.pam-frames button { flex: none; width: 52px; height: 52px; padding: 2px; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 8px 8px; position: relative; }
.pam-frames button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pam-frames canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
.pam-frames span { position: absolute; right: 2px; bottom: 1px; font: 700 10px/1 system-ui, sans-serif; color: #111; background: rgba(255,255,255,.8); border-radius: 3px; padding: 1px 2px; }
.pam-h { font-size: 15px; margin: 14px 0 8px; }
.pam-sub { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; }
</style>
<div class="fields">
  <div><label for="gw">Width (pixels)</label><select id="gw" data-nomemo><option>8</option><option selected>16</option><option>24</option><option>32</option><option>48</option><option>64</option><option>96</option><option>128</option></select></div>
  <div><label for="gh">Height (pixels)</label><select id="gh" data-nomemo><option>8</option><option selected>16</option><option>24</option><option>32</option><option>48</option><option>64</option><option>96</option><option>128</option></select></div>
  <div><label for="palSet">Palette</label><select id="palSet"><option value="basic">Basic (16)</option><option value="retro">Retro console (16)</option><option value="handheld">Handheld green (4)</option><option value="pastel">Pastel (12)</option><option value="skin">Skin and earth (12)</option></select></div>
</div>
<div class="pam-bar">
  <div class="seg" role="group" aria-label="Drawing tool">
    <button type="button" data-tool="pen" aria-pressed="true">Pencil</button>
    <button type="button" data-tool="erase" aria-pressed="false">Eraser</button>
    <button type="button" data-tool="fill" aria-pressed="false">Fill</button>
    <button type="button" data-tool="pick" aria-pressed="false">Pick colour</button>
  </div>
  <div class="seg" role="group" aria-label="Mirror">
    <button type="button" data-mir="" aria-pressed="true">No mirror</button>
    <button type="button" data-mir="x" aria-pressed="false">Mirror ↔</button>
    <button type="button" data-mir="y" aria-pressed="false">Mirror ↕</button>
    <button type="button" data-mir="xy" aria-pressed="false">Both</button>
  </div>
</div>
<div class="pam-pal" id="pal" role="group" aria-label="Colours"></div>
<div class="pam-wrap" id="wrap"><canvas id="cv" width="512" height="512" aria-label="Pixel art drawing grid"></canvas></div>
<div class="pam-bar">
  <button type="button" class="btn ghost" id="undo" disabled>Undo</button>
  <button type="button" class="btn ghost" id="redo" disabled>Redo</button>
  <button type="button" class="btn ghost" id="clear">Clear</button>
  <button type="button" class="btn ghost" id="imp">Import picture</button>
  <label style="font-size:14px;font-weight:400;margin:0"><input type="checkbox" id="grid" checked>Grid lines</label>
</div>
<input type="file" id="file" accept="image/*" hidden data-nomemo>
<div class="checks" style="margin:0 0 6px"><label><input type="checkbox" id="usePal">When importing, use only the colours in the palette</label></div>
<h3 class="pam-h">Animation frames (optional)</h3>
<div class="pam-frames" id="frames" role="group" aria-label="Frames"></div>
<div class="pam-bar">
  <button type="button" class="btn ghost" id="fAdd">New frame</button>
  <button type="button" class="btn ghost" id="fDup">Duplicate</button>
  <button type="button" class="btn ghost" id="fDel" disabled>Delete frame</button>
  <button type="button" class="btn ghost" id="play" disabled>Play</button>
  <label style="font-size:14px;font-weight:400;margin:0"><input type="checkbox" id="onion">Show previous frame faintly</label>
</div>
<div class="fields">
  <div><label for="fps">Speed: <span id="fpsV">6</span> frames per second</label><input type="range" id="fps" min="1" max="24" value="6"></div>
  <div><label for="scale">Export size</label><select id="scale"><option value="1">1× (actual pixels)</option><option value="4">4×</option><option value="8">8×</option><option value="16" selected>16×</option><option value="32">32×</option></select></div>
</div>
<div class="btns">
  <button type="button" class="btn" id="png">Download PNG</button>
  <button type="button" class="btn ghost" id="gif">Download GIF</button>
  <button type="button" class="btn ghost" id="sheet" hidden>Download sprite sheet</button>
</div>
<p class="pam-sub" style="margin-top:10px">Your drawing is kept in this browser, so it is still here if you reload the page.</p>
<p class="msg" id="msg"></p>

  function empty(f) { for (var i = 0; i < f.length; i++) if (f[i]) return false; return true; }
  $('png').addEventListener('click', function () {
    var sc = +$('scale').value;
    if (empty(frames[fi])) say('', 'This frame is empty, so the PNG is fully see-through.');
    frameCanvas(frames[fi], sc).toBlob(function (b) { if (b) saveBlob(b, 'pixel-art-' + W + 'x' + H + (frames.length > 1 ? '-frame' + (fi + 1) : '') + '.png'); }, 'image/png');
  });
  $('sheet').addEventListener('click', function () {
    var sc = +$('scale').value, n = frames.length, c = canvas(W * sc * n, H * sc), x = c.getContext('2d');
    frames.forEach(function (f, i) { x.drawImage(frameCanvas(f, sc), i * W * sc, 0); });
    c.toBlob(function (b) { if (b) saveBlob(b, 'pixel-art-sheet-' + n + 'x' + W + 'x' + H + '.png'); }, 'image/png');
  });
  $('gif').addEventListener('click', function () {
    if (!self.gifenc) { say('bad', 'The GIF maker did not load. Check your connection and reload the page.'); return; }
    var G = self.gifenc, sc = Math.min(+$('scale').value, Math.floor(1024 / Math.max(W, H)) || 1);
    // one shared palette: index 0 is see-through, then every colour used (at most 255)
    var seen = {}, colors = [];
    frames.forEach(function (f) { for (var i = 0; i < f.length; i++) if (f[i] && !seen[f[i]]) { seen[f[i]] = 1; colors.push(f[i]); } });
    var reduce = colors.length > 255, pal = [[0, 0, 0]], idxOf = {};
    if (reduce) { // imported photos can have many colours: let gifenc pick the best 255
      var all = new Uint8Array(colors.length * 4); colors.forEach(function (v, i) { all[i * 4] = v >> 16 & 255; all[i * 4 + 1] = v >> 8 & 255; all[i * 4 + 2] = v & 255; all[i * 4 + 3] = 255; });
      var q = G.quantize(all, 255, { format: 'rgb565' }), map = G.applyPalette(all, q, 'rgb565');
      q.forEach(function (c) { pal.push([c[0], c[1], c[2]]); }); colors.forEach(function (v, i) { idxOf[v] = map[i] + 1; });
    } else colors.forEach(function (v, i) { pal.push([v >> 16 & 255, v >> 8 & 255, v & 255]); idxOf[v] = i + 1; });
    var size = 2; while (size < pal.length) size *= 2; while (pal.length < size) pal.push([0, 0, 0]);
    var enc = G.GIFEncoder(), w = W * sc, h = H * sc, delay = Math.round(1000 / +$('fps').value);
    frames.forEach(function (f, k) {
      var idx = new Uint8Array(w * h);
      for (var y = 0; y < h; y++) { var sy = (y / sc) | 0; for (var x = 0; x < w; x++) { var v = f[sy * W + ((x / sc) | 0)]; idx[y * w + x] = v ? idxOf[v] : 0; } }
      enc.writeFrame(idx, w, h, k === 0 ? { palette: pal, delay: delay, transparent: true, transparentIndex: 0, repeat: 0, dispose: 2 } : { delay: delay, transparent: true, transparentIndex: 0, dispose: 2 });
    });
    enc.finish();
    saveBlob(new Blob([enc.bytes()], { type: 'image/gif' }), 'pixel-art-' + W + 'x' + H + (frames.length > 1 ? '-' + frames.length + '-frames' : '') + '.gif');
    if (reduce) say('ok', $('msg').textContent + ' Your art has more than 255 colours, so the GIF uses the closest 255.');
  });

  // ---------- start ----------
  if (!restore()) { frames = [blank()]; }
  else say('', 'Welcome back: your last drawing was restored.');
  $('gw').value = W; $('gh').value = H;
  palette(); setTool('pen'); thumbs(); layout();
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 100); });
})();
</script>
