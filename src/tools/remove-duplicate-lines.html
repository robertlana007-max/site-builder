<label for="txt">Your list (one item per line)</label>
<textarea id="txt" class="plain" style="min-height:220px" placeholder="apple&#10;banana&#10;apple"></textarea>
<div class="checks" style="margin-top:14px">
  <label><input type="checkbox" id="ci">Ignore upper/lower case</label>
  <label><input type="checkbox" id="trim" checked>Trim spaces</label>
  <label><input type="checkbox" id="empty" checked>Remove empty lines</label>
  <label><input type="checkbox" id="sort">Sort A to Z</label>
</div>
<div class="btns"><button class="btn" id="go">Remove duplicates</button><button class="btn ghost" id="cp">Copy</button></div>
<p class="msg" id="msg"></p>
<script>
(function () {
  $('go').addEventListener('click', function () {
    if (!$('txt').value.trim()) { $('msg').className = 'msg bad'; $('msg').textContent = 'Paste your list first, one item per line.'; return; }
    var lines = $('txt').value.split(/\r?\n/), seen = new Set(), out = [];
    lines.forEach(function (l) {
      if ($('trim').checked) l = l.trim();
      if ($('empty').checked && l === '') return;
      var key = $('ci').checked ? l.toLowerCase() : l;
      if (seen.has(key)) return;
      seen.add(key); out.push(l);
    });
    if ($('sort').checked) out.sort(function (a, b) { return a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true }); });
    $('txt').value = out.join('\n');
    $('msg').className = 'msg ok';
    $('msg').textContent = 'Removed ' + (lines.length - out.length) + ' of ' + lines.length + (lines.length === 1 ? ' line. ' : ' lines. ') + out.length + ' left.';
  });
  $('cp').addEventListener('click', function () { copyText($('txt').value, $('cp')); });
})();
</script>
