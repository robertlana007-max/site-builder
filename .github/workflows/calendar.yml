name: Refresh economic calendar

# Keeps charts/calendar.json (read by the Live Charts page) up to date.
# It only ever touches that one file.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: calendar

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this week's calendar and keep only the fields the page reads
        run: |
          curl -fsS -m 30 -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o /tmp/cal.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/cal.json','utf8'));if(!Array.isArray(d)||!d.length)process.exit(1);const c=(v,n)=>String(v==null?'':v).slice(0,n);fs.writeFileSync('charts/calendar.json',JSON.stringify(d.slice(0,400).map(e=>({title:c(e.title,90),country:c(e.country,4),date:c(e.date,30),impact:c(e.impact,10),forecast:c(e.forecast,16),previous:c(e.previous,16)}))));"
      - name: Commit when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/calendar.json
          git diff --cached --quiet || (git commit -m "Refresh economic calendar" && git push)
