name: Refresh Telegram signals

# Keeps charts/signals.json (read by the Live Charts page) in step with a public Telegram channel.
# It only ever touches that one file.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: signals

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel and keep its signals
        run: node .github/scripts/signals.js 2
      - name: Commit when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/signals.json
          git diff --cached --quiet || (git commit -m "Refresh Telegram signals" && git pull --rebase -q && git push)
