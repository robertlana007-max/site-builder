name: Refresh Telegram signals

# Keeps charts/signals.json (read by the Live Charts page) up to date.
# It only ever touches that one file.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Watch the channel and publish each change at once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS+3000))
          first=1
          while [ $SECONDS -lt $end ]; do
            if [ $first = 1 ]; then node .github/scripts/signals.js 2; first=0; else node .github/scripts/signals.js 1; fi
            if [ -n "$(git status --porcelain -- charts/signals.json charts/signals2.json charts/signals-all.json)" ]; then
              git add charts/signals.json charts/signals2.json charts/signals-all.json
              git commit -q -m "Refresh Telegram signals"
              git pull --rebase -q && git push -q && curl -s -m 10 -d signals https://ntfy.sh/gtn-sig-7f3k9q2x >/dev/null || true
            fi
            sleep 8
          done
      # GitHub starts scheduled jobs late or not at all, so each run starts the next one itself.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run signals.yml --ref main --repo "$GITHUB_REPOSITORY"
