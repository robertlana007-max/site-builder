<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetToolNest</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --tx:#1b1f2a; --mut:#5b6475; --ac:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12141b; --card:#1c1f29; --tx:#eef0f6; --mut:#a3abbd; --ac:#818cf8; } }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--tx); font:16px/1.5 system-ui, "Segoe UI", sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:16px; padding:32px 28px; max-width:440px; text-align:center; box-shadow:0 6px 30px rgba(0,0,0,.08); }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:22px; margin:16px 0 8px; }
  p { color:var(--mut); margin:0 0 22px; }
  button { background:var(--ac); color:#fff; border:0; border-radius:10px; padding:11px 28px; font:inherit; font-weight:600; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--tx); outline-offset:2px; }
  #st { min-height:1.5em; margin:14px 0 0; font-size:14px; }
</style>
</head>
<body>
<main class="card" role="alert">
  <img src="icon.png" alt="">
  <h1>You are offline.</h1>
  <p>GetToolNest needs internet the first time; tools you opened before keep working. Live Charts (trading) always needs internet.</p>
  <button id="retry" type="button" autofocus>Retry</button>
  <p id="st" aria-live="polite"></p>
</main>
<script>
(function () {
  var HOME = 'https://gettoolnest.xyz/appshell/?app=win';
  var target = HOME;
  try {
    var u = new URL(location.href).searchParams.get('u');
    if (u) { var t = new URL(u); if (t.protocol === 'https:' && (t.hostname === 'gettoolnest.xyz' || t.hostname === 'www.gettoolnest.xyz')) target = t.href; }
  } catch (e) {}
  var st = document.getElementById('st');
  function go() { st.textContent = 'Connecting...'; location.replace(target); }
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
})();
</script>
</body>
</html>
